      again). the one write is untouched: real voice only, once.

/* v4.7 — THE FIRST WORD RIDES AHEAD OF THE ENGINES (the artist, 26 jul: "plays

   SAY_VOICE_ID below — a text edit there must be mirrored here (a mismatch is

   mirrored here (a text match with the old voice would be adopted). */
(function(){
  try{
    if(/[?&](auto\b|phase=)/.test(location.search)) return;   /* benches + jumps have no opening */
    var LY=511.93, Y=new Date().getFullYear()-Math.round(LY);
    var L1='today is '+Y+'. by the time you hear this, my song has travelled '
      +Math.round(LY*31557600/1e9)+' billion light seconds, '
      +Math.round(LY*365.25/1000)+' thousand days, '
      +Math.round(LY*12/1000)+' thousand months, and '

    var to=setTimeout(function(){ if(ctrl){ try{ ctrl.abort(); }catch(_){} } },15000);
    window.__earlySay={ text:L1,
      p:fetch('/.netlify/functions/say',{ method:'POST', headers:{'content-type':'application/json'},

          body:JSON.stringify({ text:L1, vox:'unisong', voice_id:'jJ0g59OiGJKbLyat5v9f' }) })
        .then(function(r){ clearTimeout(to);
          if(!r||r.status===204||!r.ok) return null;
          var ct=r.headers.get('content-type')||'';
          if(ct.indexOf('audio')<0) return null;
          return r.arrayBuffer(); })
        .catch(function(){ clearTimeout(to); return null; }) };
  }catch(_){ }
})();

function eqDir(raDeg,decDeg){

/* world frame: x=east, y=up, z=north (right-handed; the controls decide facing) */
function basis(ms){
  var L=lstDeg(ms)*DEG, la=CFG.lat*DEG;
  var cl=Math.cos(la), sl=Math.sin(la), cL=Math.cos(L), sL=Math.sin(L);
  return { U:[cl*cL, sl, cl*sL], E:[-sL, 0, cL], N:[-sl*cL, cl, -sl*sL] };

    var r=3.4+62*Math.pow(hash01(i9*1.93+4.2),1.7);                       /* a corridor stays clear on the axis */
    var a=hash01(i9*7.77+1.1)*6.2832;

      '  if(zp>6.0) zp-='+SHO.depth.toFixed(1)+';',                              /* wrapping behind the head back to the far dark */
      '  p.z=zp;',
      '  float dz=p.z;',

  vertexShader:'varying vec2 vUv; varying vec3 vN; void main(){ vUv=uv; vN=normalMatrix*normal; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',

    'void main(){',
    '  vec4 t=texture2D(uMap,vUv);',
    '  float land=smoothstep(0.02,0.20, max(t.r,t.g)-t.b);',           /* the MAP: land = warmer/greener than the sea */
    '  float lum=dot(t.rgb, vec3(0.299,0.587,0.114));',
    '  vec3 sea=mix(vec3(0.36,0.66,1.00), vec3(0.70,0.90,1.00), smoothstep(0.05,0.45,lum));',   /* [TUNE sea] lighter blues, deep\u2192shallow */
    '  vec3 grn=mix(vec3(0.22,0.66,0.34), vec3(0.62,0.96,0.52), smoothstep(0.12,0.62,lum));',   /* [TUNE land] purer greens, low\u2192high */
    /* the relief — an emboss off the map's own luminance, lit from the upper left; the sea stays smooth */
    '  vec2 px=vec2(1.0/512.0, 1.0/256.0);',
    '  float hL=dot(texture2D(uMap, vUv+vec2(-px.x,  px.y)).rgb, vec3(0.299,0.587,0.114));',
    '  float hR=dot(texture2D(uMap, vUv+vec2( px.x, -px.y)).rgb, vec3(0.299,0.587,0.114));',
    '  float relief=(hL-hR)*2.2*land;',                                /* [TUNE relief] terrain grain strength */
    '  vec3 col=mix(sea,grn,land)*(1.0+relief);',
    '  col=mix(vec3(dot(col,vec3(0.299,0.587,0.114))), col, 1.30);',       /* [TUNE crisp] the saturation lift: fresh, knot neon */

    '  vec3 n=normalize(vN); vec3 l=normalize(vec3(-0.45,0.55,0.75));',
    '  float dif=0.80+0.55*max(dot(n,l),0.0);',                                     /* [TUNE body light] the whole body brighter */
    '  float spec=pow(max(dot(reflect(-l,n),vec3(0.0,0.0,1.0)),0.0),26.0)*(1.0-land)*0.42;',    /* [TUNE glint] */

   stillness the sea flattens — the ocean and the air voice exhale to nothing,
   leaving the visitor's hum alone in the skull for one breath — then one soft
   call on the star's grid (173.68 × 4 = 694.72), a knock and its quieter
   echo, asks the eyes back to the frozen sky, where the reveal waits
   (delayed to meet them). a door knock, never praise; it sounds at every
   completed conch rite — only the reveal is once-ever. */
var CALL={ f:CFG.f0*4, gain:0.10, at:1600, revealAt:2600 };   /* [TUNE call] */
function conchStillCall(){
  try{
    if(actx){
      var t0c=actx.currentTime;
      if(ocean) ocean.gain.setTargetAtTime(0.0001,t0c,0.5);           /* the sea flattens */
      if(g2){ g2.gain.setTargetAtTime(0.0001,t0c,0.8); g3.gain.setTargetAtTime(0.0001,t0c,0.8); }
    }
    rumbleStop();                                                     /* v4.0 — the bone tone exhales with the sea: the hum stands alone */
  }catch(_){}
  setTimeout(function(){
    if(ph!=='still'||!actx) return;
    try{
      resumeCtx();
      var t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=CALL.f;
      g.gain.value=0.0001; o.connect(g); g.connect(master);
      g.gain.setTargetAtTime(CALL.gain,t,0.06);                       /* one knock… */
      g.gain.setTargetAtTime(0.0001,t+0.55,0.4);
      g.gain.setTargetAtTime(CALL.gain*0.55,t+1.35,0.05);             /* …and its quieter echo */
      g.gain.setTargetAtTime(0.0001,t+1.85,0.5);
      o.start(t); o.stop(t+4.2);
    }catch(_){}
  },CALL.at);
  setTimeout(function(){ revealShow(); },CALL.revealAt);
}

/* ============================================================================
   the engine — 8th wall world tracking, HYBRID. the floor world (skull,
   drawings, filament, earth, motes) is adopted by slam and is walkable; the
   sky (stars + the star) stays on our own orientation-driven glass above the
   void, so daylight cannot wash it out. the star migrates at the descent.
   ports handoff-ar-doorway.md part B — every silent trap is handled:
   slam chunk · module wiring · allowedDevices ANY · projection seed ·
   the 300×150 canvas · and a quiet fall back to the magic window.
   ========================================================================== */
function arFallback(why){
  if(!AR||AR_DEAD) return;
  AR_DEAD=true; AR_LIVE=false; AR=false;
  if(TEST){ try{ window.__errs.push('[ar-fallback] '+why); }catch(_){} }
  try{ if(window.XR8&&XR8.stop) XR8.stop(); }catch(_){}
  try{ if(scene.parent) scene.parent.remove(scene); }catch(_){}
  scene.position.set(0,0,0); scene.rotation.set(0,0,0); scene.scale.setScalar(1);
  scene.updateMatrixWorld();
  scene.add(skyRoot);                                  /* the sky folds back into the one room */
  starBoost=1;
  if(buckets.boosted){ buckets.boosted=false; for(var bb=0;bb<4;bb++) buckets[bb].mat.size/=(1.6*STAR_K); }
  document.body.classList.remove('ar-live');
  var c=renderer.domElement;               /* our renderer was born detached — seat it where #gl stood */
  if(c!==glc){ c.style.cssText='position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2;'; document.body.appendChild(c); glc.style.display='none'; }
  resize();
  startCam(false);
  if(!booted) booted=true;
  if(!begun){ begin(); }
}
var arBootCalled=false;
function arBoot(){
  if(!AR||arBootCalled) return; arBootCalled=true;
  arStartT=performance.now();
  setTimeout(function(){ if(AR&&!AR_LIVE&&!AR_DEAD) arFallback('engine never stood'); },18000);
  function ready(){
    return !!(window.XR8
      && XR8.XrController && typeof XR8.XrController.pipelineModule==='function'
      && XR8.Threejs && typeof XR8.Threejs.pipelineModule==='function'
      && XR8.GlTextureRenderer && typeof XR8.GlTextureRenderer.pipelineModule==='function');
  }
  function scenePipelineModule(){
    return {
      name:'unisong-room',
      onStart:function(){
        if(AR_DEAD){ try{ XR8.stop(); }catch(_){} return; }
        var s=XR8.Threejs.xrScene();
        if(!s||!s.scene){ arFallback('no xr scene'); return; }
        document.body.classList.add('ar-live');
        s.scene.add(scene);                      /* the whole room, adopted as one object */
        scene.scale.setScalar(AR_SCALE);         /* life-size: the sky is far, the skull is near */
        scene.position.set(AR_POS.x,AR_POS.y,AR_POS.z);
        scene.updateMatrixWorld();
        s.camera.position.set(0,EYE,0);
        XR8.XrController.updateCameraProjectionMatrix({ origin:s.camera.position, facing:s.camera.quaternion });
        /* the hybrid: the sky lifts onto its own glass ABOVE the void, so
           daylight cannot wash the stars out */
        skyScene.add(skyRoot);
        var skc=renderer.domElement;
        if(skc!==glc){
          skc.style.cssText='position:fixed;inset:0;width:100%;height:100%;display:block;z-index:4;pointer-events:none;';
          if(!skc.parentNode) document.body.appendChild(skc);
        }
        starBoost=1.35*STAR_K;
        if(!buckets.boosted){ buckets.boosted=true; for(var bb=0;bb<4;bb++) buckets[bb].mat.size*=1.6*STAR_K; }
        resize();
        AR_LIVE=true; arStartT=performance.now();
        if(!begun){ begin(); }  /* the sky breathes in over the live camera */
      },
      onCameraStatusChange:function(e){
        try{ if(TEST&&e&&e.status) console.log('[ar] camera '+e.status); }catch(_){}
        if(e&&(e.status==='failed'||e.status==='denied')) arFallback('camera '+e.status);
      },
      onException:function(e){
        try{ console.error('[ar] engine exception',e); if(TEST) window.__errs.push('[ar-exception] '+String(e&&e.message||e)); }catch(_){}
        if(!AR_LIVE) arFallback('exception');
      }
    };
  }
  /* the engine's three renderer is born 300×150 and never re-reads the size;
     keep #gl truly full-screen — viewport + aspect only, NEVER setSize. */
  var inFit=false;
  function fitCanvas(){
    if(inFit) return; inFit=true;
    var dpr=Math.min(window.devicePixelRatio||1,3);
    var w=Math.round(window.innerWidth), hh=Math.round(window.innerHeight);
    glc.style.position='fixed'; glc.style.top='0'; glc.style.left='0';
    glc.style.width='100%'; glc.style.height='100%';
    if(glc.width!==Math.round(w*dpr)) glc.width=Math.round(w*dpr);
    if(glc.height!==Math.round(hh*dpr)) glc.height=Math.round(hh*dpr);
    try{ resize(); }catch(_){}   /* nudge our glass + labels directly — never re-dispatch (recursion) */
    try{
      var s=(window.XR8&&XR8.Threejs&&XR8.Threejs.xrScene)?XR8.Threejs.xrScene():null;
      if(s&&s.renderer&&s.renderer.setViewport) s.renderer.setViewport(0,0,glc.width,glc.height);
      if(s&&s.camera&&Math.abs(s.camera.aspect-(glc.width/glc.height))>0.001){
        s.camera.aspect=glc.width/glc.height; s.camera.updateProjectionMatrix();
      }
    }catch(_){}
    inFit=false;
  }
  function fullWindowCanvasModule(){
    return { name:'full-window-canvas',
      onStart:function(){
        fitCanvas();
        window.addEventListener('resize',fitCanvas);
        window.addEventListener('orientationchange',function(){ setTimeout(fitCanvas,120); });
      },
      onUpdate:function(){   /* reassert each frame: the engine resizes it once at camera start */
        var dpr=Math.min(window.devicePixelRatio||1,3);
        if(glc.width!==Math.round(window.innerWidth*dpr) || glc.height!==Math.round(window.innerHeight*dpr)) fitCanvas();
      } };
  }
  function motionPermissionModule(){
    return { name:'request-motion',
      requiredPermissions:function(){
        try{ return [XR8.XrPermissions.permissions().DEVICE_ORIENTATION]; }catch(_){ return []; }
      } };
  }
  function startEngine(){
    try{
      try{ XR8.XrController.configure({disableWorldTracking:false}); }catch(_){}
      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(),
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule(),
        fullWindowCanvasModule(),
        motionPermissionModule(),
        scenePipelineModule()
      ]);
      var dev=(XR8.XrConfig&&XR8.XrConfig.device)?XR8.XrConfig.device():null;
      XR8.run({ canvas:glc, allowedDevices:(dev?dev.ANY:undefined) });   /* ANY — or the session managers may all decline, silently */
    }catch(e){ try{ console.error('[ar] start failed',e); }catch(_){} arFallback('start failed'); }
  }
  function waitWired(){
    if(ready()){ startEngine(); return; }
    var n=0,iv=setInterval(function(){
      if(ready()){ clearInterval(iv); startEngine(); }
      else if(++n>150){ clearInterval(iv); arFallback('modules never wired'); }
    },100);
  }
  function ensureChunk(){
    if(XR8.XrController){ waitWired(); return; }   /* the world-tracker ships as its own chunk */
    try{
      var p=XR8.loadChunk('slam');
      if(p&&p.then){ p.then(waitWired,function(){ arFallback('slam chunk failed'); }); return; }
      waitWired();
    }catch(_){ waitWired(); }
  }
  if(window.XR8){ ensureChunk(); return; }
  var n=0,iv=setInterval(function(){
    if(window.XR8){ clearInterval(iv); ensureChunk(); }
    else if(++n>120){ clearInterval(iv); arFallback('engine never loaded'); }
  },100);
}

/* ---- v3.9 — THE TEACHING WAVE (author's ruling, candidate 2 made canvas) --
   beneath the poem's third line: two travelling threads — the star's
   (blue-white, immovable in its nature) and a voice's (gold, sliding,
   trembling with its own distance). while their wavelengths differ the
   strip churns at the difference — the beat, SEEN; as the gold thread finds
   the line the churn slows, the tremble dies, the common drift eases to
   nothing, and the two lie as ONE STILL LINE for a breath. then the gold
   drifts off and the lesson repeats — twice in all — and the strip fades on
   its own stillness. a canned demonstration of the law, deterministic,
   never random; it NEVER wears the visitor's own pitch (knot a meter, §6),
   and it yields early the moment a real ear first hears a real voiced tone
   (the sky itself takes over the teaching). gold is lawful here: the thread
   depicts a sounding voice. */
var waveEl=byId('expWave'), waveCtx=null, waveOn=false, waveT0=0, waveFadeT=0;
var wavePhS=0, wavePhG=0;                 /* the two threads' travelling phases, in cycles */
var WAVE={ apart:2.4, slide:3.8, still:2.6, drift:1.2, loops:2,   /* [TUNE wave clock] seconds per movement */
           cyc:2.4,                       /* the star thread's wavelengths across the strip */
           df:0.38,                       /* how much longer the gold's spatial frequency runs while fully apart */
           v:0.8,                         /* common drift, cycles/s — it dies into each stillness */
           amp:0.185, trem:0.055 };       /* [TUNE wave body] thread swing · tremble, as fractions of the strip */
var WAVE_L=WAVE.apart+WAVE.slide+WAVE.still+WAVE.drift;
function waveShow(){
  if(waveOn||waveFadeT||!waveEl) return;
  try{
    var r=waveEl.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    waveEl.width=Math.max(8,Math.round((r.width||300)*dpr));
    waveEl.height=Math.max(8,Math.round((r.height||76)*dpr));
    waveCtx=waveEl.getContext('2d');
  }catch(_){ return; }
  waveOn=true; waveT0=performance.now(); waveFadeT=0; wavePhS=0; wavePhG=0.37;
  waveEl.style.opacity='0.92';
}
function waveRetire(){ if(!waveOn||waveFadeT) return; waveFadeT=performance.now(); waveEl.style.opacity='0'; }
function waveD(tS){ /* detune 0..1 across the demo's clock · -1 = the lesson is over */
  if(tS>=(WAVE.loops-1)*WAVE_L+WAVE.apart+WAVE.slide+WAVE.still) return -1;   /* the last movement ends ON the stillness */
  var u=tS%WAVE_L;
  if(u<WAVE.apart) return 1;
  u-=WAVE.apart;
  if(u<WAVE.slide) return 1-sm01(u/WAVE.slide);
  u-=WAVE.slide;
  if(u<WAVE.still) return 0;
  u=(u-WAVE.still)/WAVE.drift; return u*u;               /* it drifts off again, gently */
}
function waveTick(now,dt){
  if(!waveOn||!waveCtx) return;
  if(waveFadeT && now-waveFadeT>2400){ waveOn=false; return; }   /* faded out: the strip rests */
  if(everVoiced && !waveFadeT) waveRetire();             /* a real voice sounded — the real sky teaches now */
  var d=waveFadeT?0:waveD((now-waveT0)/1000);
  if(d<0){ d=0; waveRetire(); }                          /* the demo parts on the met line */
  var w=waveEl.width, h=waveEl.height, mid=h*0.5, A=h*WAVE.amp;
  var fg=1+WAVE.df*d;
  var vC=WAVE.v*Math.min(1,d*1.6);                       /* the drift itself stills at the meeting */
  wavePhS+=vC*dt*0.001; wavePhG+=vC*fg*dt*0.001;
  var dphi=wavePhG-wavePhS; dphi-=Math.round(dphi);      /* the offset, folded to its nearest zero */
  if(d<0.55) dphi*=Math.max(0,1-dt*0.004*(1-d));         /* entrainment: the gold finds the line */
  wavePhG=wavePhS+dphi;
  var g=waveCtx, N=110, i2, u2, x, y;
  g.clearRect(0,0,w,h);
  g.lineWidth=Math.max(1,h/54); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='rgba(150,196,255,'+(0.42+0.10*(1-d)).toFixed(3)+')';   /* the star's thread */
  g.beginPath();
  for(i2=0;i2<=N;i2++){ u2=i2/N; x=u2*w;
    y=mid+A*Math.sin(TAU*(u2*WAVE.cyc+wavePhS));
    if(i2)g.lineTo(x,y); else g.moveTo(x,y); }
  g.stroke();
  g.strokeStyle='rgba(255,222,120,'+(0.50+0.16*(1-d)).toFixed(3)+')';   /* a voice's thread — gold: it sounds */
  g.beginPath();
  for(i2=0;i2<=N;i2++){ u2=i2/N; x=u2*w;
    y=mid+A*Math.sin(TAU*(u2*WAVE.cyc*fg+wavePhG))
       +h*WAVE.trem*d*(Math.sin(now*0.011+u2*9.3)+0.5*Math.sin(now*0.023+u2*17.1));   /* tremble ∝ its distance — the sky's own grammar */
    if(i2)g.lineTo(x,y); else g.moveTo(x,y); }
  g.stroke();
}

/* ---- the calibration rainbow — a very translucent CLOUD, inside the skull --
   knot the old concentric radial: soft spectral blots breathing in depth,
   pulsing with the calibration, sized to sit mostly within the bone. the
   light door's colour, kept dim and small (sanctioned exception). */
var rainGrp=null, rainVeils=[], rainK=0, rainOn=false, rainBuilt=false;
function hsl2rgb(h,s,l){
  h=((h%1)+1)%1;
  function f(n){ var k=(n+h*12)%12, a=s*Math.min(l,1-l);
    return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))); }
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];
}
function cloudSpecTex(seed){ /* soft spectral blots on a clear ground — a cloud, never a ring */
  var s=256, c=document.createElement('canvas'); c.width=c.height=s;
  var g=c.getContext('2d');
  g.clearRect(0,0,s,s);
  g.globalCompositeOperation='lighter';
  for(var i2=0;i2<24;i2++){
    var a1=hash01(seed*31.7+i2*3.1)*6.2832, rr=s*(0.10+0.26*hash01(seed*17.3+i2*5.7));
    var cx2=s*0.5+Math.cos(a1)*rr, cy2=s*0.5+Math.sin(a1)*rr;
    var br=s*(0.10+0.16*hash01(seed*7.9+i2*9.3));
    var hue=(a1/6.2832 + 0.25*hash01(seed*3.3+i2*1.7))%1;   /* hue drifts around the cloud — a broken spectrum */
    var rgb=hsl2rgb(hue,0.85,0.58);
    var rg=g.createRadialGradient(cx2,cy2,0,cx2,cy2,br);
    rg.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.16)');
    rg.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
    g.fillStyle=rg; g.beginPath(); g.arc(cx2,cy2,br,0,6.2832); g.fill();
  }
  var t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}
function rainbowBuild(){
  if(rainBuilt) return; rainBuilt=true;
  rainGrp=new THREE.Group(); rainGrp.name='calibrainbow'; skyRoot.add(rainGrp);
  var texs=[cloudSpecTex(1),cloudSpecTex(2),cloudSpecTex(3)];
  for(var i2=0;i2<10;i2++){
    var m=new THREE.MeshBasicMaterial({ map:texs[i2%3], transparent:true, opacity:0,
        depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide });
    var pl=new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.42), m);   /* [TUNE rainbow size] it sits mostly INSIDE the skull */
    pl.position.z=(hash01(i2*3.7+0.4)-0.5)*0.34;                    /* a little depth — a cloud, knot a poster */
    pl.rotation.z=hash01(i2*5.1+0.8)*6.2832;
    pl.rotation.x=(hash01(i2*6.1+0.3)-0.5)*0.7;
    pl.rotation.y=(hash01(i2*8.3+0.7)-0.5)*0.7;
    var sc=0.85+0.30*hash01(i2*7.3+0.2);
    pl.scale.set(sc,sc,1);
    pl.userData={ rz:(hash01(i2*2.3+0.6)-0.5)*0.0007, s0:sc, ph2:hash01(i2*9.7+0.1)*6.2832 };
    rainGrp.add(pl); rainVeils.push(pl);
  }
}

/* v4.3 — THE BALL OF LIVING ENERGY: at an achieved unisong the two waves
   become a 3D body of spectral colour dancing inside the skull — the
   sanctioned rainbow, embodied. built on the calibration cloud's bones
   (the veils) plus a breathing swarm of coloured points; it stands until
   the mirror rite, where it breathes back into the two waves. */
var ballOnQ=false, ballK=0, ballPts=null, ballGeo=null, ballBase=null, ballN=96;   /* v4.4 [TUNE ball count] — fewer motes (was 240): a small quick shoal, knot a crowd */
function ballBuild(){
  if(ballPts) return;
  rainbowBuild();
  var pos=new Float32Array(ballN*3), col=new Float32Array(ballN*3), i9;
  ballBase=new Float32Array(ballN*3);
  for(i9=0;i9<ballN;i9++){
    var u9=hash01(i9*3.7+0.31)*2-1, th9=hash01(i9*7.1+0.77)*TAU, r9=Math.pow(hash01(i9*5.3+0.13),0.34);
    var rp9=Math.sqrt(Math.max(0,1-u9*u9))*r9;
    ballBase[i9*3]=Math.cos(th9)*rp9; ballBase[i9*3+1]=u9*r9; ballBase[i9*3+2]=Math.sin(th9)*rp9;
    var rgb=hsl2rgb(((th9/TAU)+u9*0.25+1)%1,0.9,0.62);
    col[i9*3]=rgb[0]/255; col[i9*3+1]=rgb[1]/255; col[i9*3+2]=rgb[2]/255;
  }
  ballGeo=new THREE.BufferGeometry();
  ballGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  ballGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  ballPts=new THREE.Points(ballGeo,new THREE.PointsMaterial({ size:0.013, map:texHot, vertexColors:true,
    transparent:true, opacity:0, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending }));   /* v4.4 [TUNE ball mote size] — the smallest (was 0.032) */
  ballPts.frustumCulled=false; rainGrp.add(ballPts);

function ballOn(){ ballBuild(); ballOnQ=true; rainOn=true; }
function ballOff(){ ballOnQ=false; rainOn=false; }
function rainbowTick(now,dt){
  ballK+=(((ballOnQ)?1:0)-ballK)*Math.min(1,dt*0.0013);   /* eased even while the group rests */
  if(!rainBuilt||!rainGrp) return;
  rainK+=(((rainOn)?1:0)-rainK)*Math.min(1,dt*0.0012);
  if(rainK<0.004){ rainGrp.visible=false; return; }
  rainGrp.visible=true;
  rainGrp.position.copy(tmpV.set(0,0,-1).applyQuaternion(qYou)).multiplyScalar(2.55);   /* v4.7 — the cloud + ball share the pair's stationary frame (qYou): one composition inside the fixed bone */
  rainGrp.quaternion.copy(qYou);
  var pulse=0.72+0.28*Math.sin(now*0.0021)+0.10*Math.sin(now*0.0047+1.3);   /* [TUNE rainbow pulse] it breathes, unevenly */
  var boost=1+3.2*ballK;   /* [TUNE ball glow] v4.4 — the cloud burns BRIGHTER as a body while the ball stands (was 2.3) */
  for(var i2=0;i2<rainVeils.length;i2++){
    var v=rainVeils[i2], ud=v.userData;
    v.rotation.z+=ud.rz*34.0*(1+2.6*ballK);              /* v4.4 — the dance is livelier (was 16.7 / 2.0) */
    /* v4.4 [TUNE rainbow drift] — the cloud MOVES now: each veil wanders its own slow loop */
    var wK=1+1.4*ballK;
    v.position.x=0.065*wK*Math.sin(now*0.00052+ud.ph2*2.1);
    v.position.y=0.055*wK*Math.sin(now*0.00043+ud.ph2*3.3);
    var br=1+0.16*Math.sin(now*0.0016+ud.ph2);
    v.scale.set(ud.s0*br*(0.94+0.10*pulse), ud.s0*br*(0.94+0.10*pulse), 1);
    v.material.opacity=0.16*rainK*pulse*boost*(0.7+0.3*Math.sin(now*0.0011+ud.ph2));   /* [TUNE rainbow] v4.4 — brighter (was 0.11) */
  }
  if(ballPts){
    ballPts.material.opacity=0.9*ballK*rainK;
    ballPts.rotation.y+=dt*0.0011*(1+1.8*ballK);          /* v4.4 — the whirl is quicker (was 0.00045) */
    ballPts.rotation.x=0.30*Math.sin(now*0.00066);
    var pa=ballGeo.attributes.position.array, R0=0.30, j9;   /* [TUNE ball size] it sits inside the bone */
    /* v4.4 [TUNE shoal] — the motes school like a SHOAL now: a smooth shared
       current (displacement follows position, so neighbours turn together),
       its direction forever folding, and quicker than the old breath. */
    var tS=now*0.0018*(1+0.8*ballK);
    for(j9=0;j9<ballN;j9++){
      var bx=ballBase[j9*3], by=ballBase[j9*3+1], bz=ballBase[j9*3+2];
      var fx=Math.sin(tS*1.30+by*5.2+bz*2.6);
      var fy=Math.sin(tS*1.72+bz*5.6+bx*2.2);
      var fz=Math.sin(tS*1.11+bx*4.8+by*3.1);
      var wob=1+0.07*Math.sin(now*0.0046+j9*1.7);          /* a small quick breath of its own */
      pa[j9*3]  =(bx+0.30*fx)*R0*wob;
      pa[j9*3+1]=(by+0.30*fy)*R0*wob;
      pa[j9*3+2]=(bz+0.30*fz)*R0*wob;
    }
    ballGeo.attributes.position.needsUpdate=true;
  }
}

    pulsar.position.copy(pulsarWorld);
    blinkP=Math.pow(0.5+0.5*Math.sin(now*0.0047+0.4),7);
    var psPk=ovPeakPS(), psI, uR=sm01(tI/OVT.rise);
    if(ovStage===1){                                           /* the settle: up a little, home a little */
      var uS=sm01((now-ovSettleT0)/OVT.settle);
      psI=lerp(psPk,PS_SKY,uS); dockGeom(uS); dockK=uS;
      if(uS>=1){ ovStage=2; dockK=1; enterArrive(); }
    } else {
      psI=lerp(PS_SKY*0.10, psPk, Math.pow(uR,1.75));          /* tiny -> a third of the screen: the approach accelerates */
      if(uR>=1){ psI*=1+0.02*Math.sin(now*0.0021); dockGeom(0); }   /* arrived: bone within the light, breathing against the glass */
      else ovGeom(uR);
      if(!landHold&&uR>=1&&!meetWait(now)) ovSettle(now);
      /* v4.6 — THE TOUCH: the bone's crown meets the star's lower limb and
         the star answers with tiny blue sparks at the point of contact —
         one burst at first touch, a whisper of a trickle while the crossing
         lasts (never after the meeting stands). */
      if(!landHold && uR<1 && uR>0.02){
        var ppwS=H/(2*Math.tan(camera.fov*0.5*DEG)*CFG.skyR);
        var starB=H*0.5+psI*PB.R*ppwS;                         /* the star's lower edge on the glass */
        var dockT=parseFloat(dockEl.style.top);                /* the bone's crown */
        if(dockT===dockT && dockT<=starB){
          if(!spkTouch){ spkTouch=true; spawnContactSparks(W*0.5, dockT, 16, true); spkLastEmit=now; }
          else if(now-spkLastEmit>120){ spkLastEmit=now; spawnContactSparks(W*0.5+rnd(-12,12), Math.max(dockT,H*0.5+2), 2, false); }
        }
      }
    }
    pulsarOn=landHold?0:sm01((tI-150)/1200);                   /* the star forms as the wave passes (the last breath fires here) */
    if(pulsarOn>=1) puStood=true;                              /* once stood it never re-forms — arrive keeps it lit */
    pulsar.scale.setScalar(Math.max(0.001,psI));
    var pk0=(0.62+0.38*(0.5+0.5*Math.sin(now*0.0016)))+(0.9*blinkP);
    pulsarSet(pulsarOn*(0.5+0.5*pk0), blinkP, now);
    /* v3.6 — the earth is ALREADY FORMING below while the greeting sings
       (author's note), the visitor's place blinking on it (house guess). */
    globeOn=landHold?0:Math.max(globeOn,sm01((tI-900)/2200));
    tmpV.set(0,-Math.sin(EARTH_DROP),-Math.cos(EARTH_DROP)).applyQuaternion(qDial);
    youPos.copy(tmpV).multiplyScalar(2.4);
    youGrp.position.copy(youPos); youGrp.quaternion.copy(qDial);
    youSpin.rotation.y=now*0.00055;
    var yOv=Math.min(1,globeOn*1.2);
    earthMat.uniforms.uA.value=0.50*yOv;
    youVeil.material.opacity=0.05*yOv; youHalo.material.opacity=0.20*yOv;
    geoDot.material.opacity=Math.min(1,yOv*1.6)*(0.55+0.45*Math.sin(now*0.004));
    if(yOv>0.35) place(ylab,youPos,-10,false); else ylab.style.display='none';   /* v4.6 — "you" ON the globe's face, knot floating above it */
    bowTick(now);                                              /* the wave, passing first */
    shoalTick(now,dt,1);                                       /* v4.6 — the depth shoal streams toward the visitor from the first frame */
    spkTick(now,dt);
    holo.upd(now,dt,1.1,0.35,false); dockDraw();
    if(AR_LIVE){ syncSkyLens(); renderer.render(skyScene,camera); } else renderer.render(scene,camera);
    return;
  }

  /* arrive: the sky breathes in while the system voice locates; the two
     entries stand armed once the pulsar has said its last word */
  if(ph==='arrive'){ skyFade=sm01(tP/3.5);
    pulsarOn=Math.max(pulsarOn,sm01((tP-1.2)/2.6));   /* v3.4: the star already stood at the meeting — it never re-forms */
    globeOn =Math.max(globeOn,sm01((tP-4.0)/1.8));   /* v3.6: it already formed under the greeting */
    lineGrow=sm01((tP-5.8)/2.6);          /* then the thread reaches out */
  }
  if(ph!=='arrive') globeOn=1;
  if(ph==='shell'||ph==='still'||ph==='after'||ph==='exercise'||ph==='prep'){ skyFade=1; pulsarOn=1; lineGrow=1; }
  if(ph==='descent'||ph==='bone') pulsarOn=1;
  /* v4.0 — the earth no longer climbs at a gate (the engage phase is retired).
     v4.6 (the artist) — the map's yield WAITS now: through the opening the
     star and the earth STAND; exKT fires at the first break ("my song, the
     blue wave") and only then do the star, the filament and the motes give
     way. the earth has its own, later letting-go (earthGoneK, the second
     message's climb-and-break). everything returns with the open sky. */
  exK+=((((ph==='exercise'&&exKT)||ph==='prep'||ph==='shell'||ph==='still')&&gateOn?1:0)-exK)*Math.min(1,dt*0.0009);
  puMorphK+=(puMorphT-puMorphK)*Math.min(1,dt*0.0011);   /* v4.6 — the star folds away as it breaks into the BLUE wave (pulsarBreak) */
  dockBoost+=(((gateOn)?2.5:1)-dockBoost)*Math.min(1,dt*0.0026);   /* v3.7 [TUNE gate skull] · v4.3 — +20% again at max (author): 2.08 → 2.5; the bone holds both waves whole */
  /* v3.7 — the cluster turns around the bone while the rite's lines speak */
  swirlK+=(((swirlOn)?1:0)-swirlK)*Math.min(1,dt*0.0012);
  if(swirlK>0.002) swirlA+=dt*0.00022*swirlK;                      /* [TUNE swirl] rad/ms — a slow procession, never a spin */
  crestTick(now);

  measure(dt);

  /* the shell narrows: time opens it, a true hum opens it faster.
     v4.0 — the breathing sea obeys the window (a closed window is SILENT
     until the tone returns) and never fights the conch's flattening. */
  if(actx&&oceanBP&&((ph==='shell'&&windowT0)||(ph==='still'&&MODE!=='conch'))){
    var open=clamp(tP/CFG.oceanFloorS,0,1)*0.6 + effort*0.4 + prox*0.35;
    oceanBP.Q.value=lerp(0.8,26,clamp(open,0,1));
    var vg=clamp(open,0,1);
    g2.gain.setTargetAtTime(CFG.gVoice*vg,actx.currentTime,0.4);
    g3.gain.setTargetAtTime(CFG.gVoice3*vg,actx.currentTime,0.4);
    if(ocean) ocean.gain.setTargetAtTime(CFG.gOcean*(1-0.75*vg),actx.currentTime,0.6);
  }

  /* stillness held, then the descent */
  if(ph==='still'){
    leanK+=(CFG.leanMax*1.4-leanK)*0.04;
    /* the breath holds until the one surrendered secret has been read;
       the conch rite then rests back to the open sky, the full one descends */
    if(now-phT0>CFG.stillHold && (revealDone || now-phT0>CFG.stillHold+9000)){
      enterAfter();   /* v4.0 — BOTH rites rest to the open sky (the immersive rite already lies on the floor); the descent/bone floor rite answers only the bench jumps */
    }
  } else if(ph==='shell'){
    leanK+=(CFG.leanMax*prox*voicedK-leanK)*0.05;   /* the traces' lean rides the energy-gate too */
    if(still && beat>1.2){ still=false; stillCnt=0; tracesFrozen=false; uniMixT=0; setPh('shell'); }   /* v4.0 — a broken stillness parts the pair again */
  }

  /* the throb — the beat, seen */
  envPhase+=beat*TAU*dt*0.001;
  var wave=0.5+0.5*Math.sin(envPhase);
  if(ph==='still') env=0.92+0.05*Math.sin(t*0.75);
  else env=0.45+0.55*Math.pow(wave,1+2.0*(1-prox));

  /* descent: the sky gathers into the star; the star sinks to the floor */
  var dK=0;
  if(ph==='descent'||ph==='bone'){
    dK=sm01((now-descT0)/4200);
    leanK=lerp(leanK,1,dK);
    skyFade=1-sm01((now-descT0-600)/2600);
    lineGrow=1-sm01((now-descT0-300)/2400);
  }
  /* §4b/c — the beat now lives ONLY in the gold traces. the fixed stars are
     truly still (the indifferent cosmos). tremble ∝ detuning (→0 at unison),
     and ALL trace motion rides the mic energy-gate: no live voice, no dance —
     the speaker cannot animate them. unison is still shown by STILLNESS. */
  voicedK+=((voicedNow?1:0)-voicedK)*Math.min(1,dt*0.006);
  var dTar=0;
  if(ph==='shell'||ph==='still'){
    if(cents!==999) dTar=voicedK*clamp(Math.abs(cents)/55,0,1);
    if(still) dTar=0;
  }
  trembleK+=(dTar-trembleK)*Math.min(1,dt*0.0025);
  updateStars(now);
  tickTraces(now,dt,(ph==='descent'||ph==='bone')?Math.max(0,1-(now-descT0)/2600):1);
  bowTick(now);
  shoalTick(now,dt,(ph==='descent'||ph==='bone')?Math.max(0,1-(now-descT0)/2600):1);   /* v4.6 — the approach field, yielding with the map (exK inside) and the dark phases */
  spkTick(now,dt);       /* v4.6 — any last contact sparks breathe out */
  rainbowTick(now,dt);   /* v3.6 — the rainbow cloud (v4.0: one breath at the exercise's unisong) */
  waveTick(now,dt);      /* v3.9 — the old 2D teaching wave (v4.0: retired, never shown) */
  uniTick(now,dt);       /* v4.0 — the wave pair, inside the bone / on the mirrored face */
  morphTick(now);        /* v4.6 — the broken bodies' particles, flying into the threads */
  if(ph==='shell' && windowT0 && now-windowT0>CFG.windowMs) windowTimeout();   /* v4.0 — the thirty-second law */

  /* pulsar position: pinned to the centre of the glass (v3.2, the fixed
     dial) — or easing down to the floor in the descent. the same thread
     frame that has always screen-fixed the earth (qYou) pins the star, so
     the two ends of the filament share one plumb line. */
  var syL=AR_LIVE?0:(skyYaw+yawTrim);
  qYou.setFromAxisAngle(yAxis,-syL).multiply(camera.quaternion);   /* the camera pose, seen in the thread's frame */
  dialEase(dt);                                                    /* v3.5 — the dial GLIDES (index-doors' steadiness): hand tremor and slam jitter never reach the earth or the gate · v4.6 — the STAR left the dial: it pins to the raw view frame below (stationary, the artist's ruling) */
  var az=Math.atan2(pulsarDir.x,pulsarDir.z);
  var floorPos=new THREE.Vector3(Math.sin(az)*CFG.floorD, CFG.floorY, Math.cos(az)*CFG.floorD);
  if(SCREEN_STAR) pulsarWorld.copy(tmpV.set(0,0,-1).applyQuaternion(qYou)).multiplyScalar(CFG.skyR);   /* v4.6 — qDial → qYou: the star STATIONARY on the glass, one centre with the bone */
  else pulsarWorld.copy(pulsarDir).multiplyScalar(CFG.skyR);
  if(ph==='descent'||ph==='bone'){
    var sink=sm01(((now-descT0)-1400)/2600);
    pulsarWorld.lerp(floorPos,sink);
    holo.mesh.visible=true;
    holo.mesh.position.set(floorPos.x,CFG.floorY+0.42,floorPos.z);
    lookLocal(holo.mesh,0,CFG.floorY+0.42,0);
    holo.mesh.material.opacity=sm01(((now-descT0)-2800)/1800)*0.95;
    songPlane.visible=true;
    songPlane.position.set(floorPos.x*1.35, CFG.floorY+0.55, floorPos.z*1.35);
    lookLocal(songPlane,0,0,0);
    songPlane.material.opacity=(songPlane.material.map?1:0)*sm01(((now-descT0)-3600)/1800)*0.8;
    if((now-descT0)>3600 && !inst.classList.contains('on') && ph==='descent') inst.classList.add('on');
    if((now-descT0)>5200 && ph==='descent' && !hint.textContent){ hint.textContent='tap when you are lying still'; hint.classList.add('on'); }
    if(AUTO && ph==='descent' && (now-descT0)>6200) enterBone();
  }

  /* the shell drawing, standing where the star's azimuth is (v4.0: never
     over the mirror — the rite's eye is the wave pair on the face) */
  if((ph==='shell'||ph==='still') && !mirrorActive){
    shellPlane.visible=true;
    shellPlane.position.set(Math.sin(az)*1.5, -0.08, Math.cos(az)*1.5);
    lookLocal(shellPlane,0,0,0);
    shellOp=Math.min(0.85, shellOp+dt*0.0004);
    shellPlane.material.opacity=(shellPlane.material.map?1:0)*shellOp*(ph==='still'?1:(0.6+0.4*env));
  } else if(mirrorActive){ shellPlane.visible=false; }
  else if(ph==='descent'){ shellOp*=0.95; shellPlane.material.opacity=shellOp; if(shellOp<0.02) shellPlane.visible=false; }

  /* §4b — the fixed stars no longer throb; the beat is the traces' alone */
  var thr=1;
  for(var b2=0;b2<4;b2++) buckets[b2].mat.opacity=Math.min(1,buckets[b2].base*skyFade*thr*starBoost);
  earthG.material.opacity=0.14*skyFade*(ph==='still'?1.15:1);

  /* the map: YOU, at the bottom centre of the dial (v3.2) — a small earth
     of ice spinning on its vertical axis; the thread runs from it up to the
     star at the centre, a plumb line. neither end can be dragged: the dial
     holds them, and you are always right here. */
  var yD=2.4;               /* (qDial — the damped thread frame — was set above; the earth alone rides it now) */
  /* v4.6 — the SECOND MESSAGE lifts the earth: "and your humming, the yellow
     wave" starts the climb (earthToGold → earthRiseT0); past its waist the
     globe breaks apart (morphBurst gold, earthGoneT) and the thread takes
     the light a breath later. */
  if(earthRiseT0){
    earthK=sm01((now-earthRiseT0)/GATE.earthMs);
    if(!earthBreakFired && earthK>0.55){ earthBreakFired=true; morphBurst('gold'); earthGoneT=1;
      setTimeout(function(){ uniGoldT=1; }, AUTO?60:800); }
  }
  earthGoneK+=(((earthGoneT||((ph==='prep'||ph==='shell'||ph==='still')&&gateOn))?1:0)-earthGoneK)*Math.min(1,dt*0.0012);
  var dropNow=EARTH_DROP*(1-sm01(earthK));                         /* v3.5 — the risen earth stands at the star's heart */
  if(SCREEN_STAR) tmpV.set(0,-Math.sin(dropNow),-Math.cos(dropNow)).applyQuaternion(qDial);   /* the bottom of the dial (or its heart, risen) */
  else tmpV.set(0,0,-1).applyQuaternion(qDial);                    /* (old room) view forward, thread frame */
  youPos.copy(tmpV).multiplyScalar(yD);
  youGrp.position.copy(youPos); youGrp.quaternion.copy(qDial);
  youSpin.rotation.y=now*0.00055;                                  /* the slow day */
  /* the alignment bow: as your gaze closes on the star, the earth steps
     aside — when you and the star are one line, only the star remains.
     v3.2: on the fixed dial the two are never one line, so the earth
     simply stands (alignK held at 1). */
  tmpV.set(0,0,-1).applyQuaternion(qDial);
  var dotA=tmpV.dot(vAim.copy(pulsarWorld).normalize());
  var aAng=Math.acos(clamp(dotA,-1,1))/DEG;
  var alignK=SCREEN_STAR?1:sm01((aAng-8)/14); if(TEST) window.__aim=aAng;   /* 0 aligned .. 1 looking away */
  var mapFade=(ph==='descent'||ph==='bone')?Math.max(0,1-(now-descT0)/2000):1;
  var youOp=Math.min(1,globeOn*1.2)*Math.max(skyFade,puStood?1:0)*mapFade*(1-earthGoneK);   /* v3.6 — the earth stood under the greeting · v4.6 — it STAYS through the opening and lets go only at its own break (earthGoneK, the second message) */
  var youOp2=youOp*(0.12+0.88*alignK);
  earthMat.uniforms.uA.value=0.50*youOp2;   /* [TUNE body] v3.3 — the front door's own density (~50% translucent by ruling) */
  youVeil.material.opacity=0.05*youOp2; youHalo.material.opacity=0.20*youOp2;   /* v3.3 — the rim thinned to the front door's (the body's own blue and green carry the light) */
  geoDot.material.opacity=Math.min(1,youOp2*1.6)*(0.55+0.45*Math.sin(now*0.004));   /* v3.6 — the visitor's place, blinking (house guess) */
  youFoot.copy(youPos).addScaledVector(vAim.set(0,-1,0).applyQuaternion(qDial),0.104);   /* the motes leave the south pole */
  /* (the gold place-dot is gone — no geolocation, ever; the globe is anyone's earth) */

  /* the filament + its motes — from you to the star */
  var Bv=pulsarWorld, Av=youFoot;
  var la2=lineGeo.attributes.position.array;
  var ax=Av.x, ay=Av.y, azn=Av.z;
  la2[0]=ax; la2[1]=ay; la2[2]=azn;
  la2[3]=lerp(ax,Bv.x,lineGrow); la2[4]=lerp(ay,Bv.y,lineGrow); la2[5]=lerp(azn,Bv.z,lineGrow);
  lineGeo.attributes.position.needsUpdate=true;
  lineMat.opacity=(0.26+0.42*env*Math.max(prox,0.3))*Math.min(1,lineGrow*1.4)*mapFade*(1-exK);   /* v4.0 — the map yields with its earth */
  lineMat2.opacity=lineMat.opacity*0.6;
  var ma=moteGeo.attributes.position.array;
  for(var m2=0;m2<motes.n;m2++){
    var speedK=(ph==='still')?0:1;
    motes.t[m2]+=motes.sp[m2]*dt*0.001*speedK*(0.4+0.6*lineGrow);
    if(motes.t[m2]>1) motes.t[m2]=0;
    var tt=Math.pow(motes.t[m2],0.85), wob=Math.sin(t*1.3+m2)*0.05*(1-tt);
    ma[m2*3]=lerp(ax,Bv.x,tt)+wob; ma[m2*3+1]=lerp(ay,Bv.y,tt)+wob*0.6; ma[m2*3+2]=lerp(azn,Bv.z,tt);
  }
  if(motes.yours>=0){
    motes.yours+=dt*0.001*0.05;
    var yt=Math.min(0.999,Math.pow(motes.yours,0.85));
    ma[0]=lerp(ax,Bv.x,yt); ma[1]=lerp(ay,Bv.y,yt); ma[2]=lerp(azn,Bv.z,yt);
  }
  moteGeo.attributes.position.needsUpdate=true;
  moteMat.opacity=0.75*Math.min(1,lineGrow)*skyFade*mapFade*(1-exK);

  /* the star's blink — a millisecond heart, slowed for the eye */
  blinkP=Math.pow(0.5+0.5*Math.sin(now*0.0047+0.4),7);
  var pk=(0.62+0.38*(0.5+0.5*Math.sin(now*0.0016)))+(0.9*blinkP);
  if(AR_LIVE){                          /* sky glass until the descent brings it into the room, walkable */
    var puHome=(ph==='descent'||ph==='bone')? scene : skyRoot;
    if(pulsar.parent!==puHome) puHome.add(pulsar);
  }
  pulsar.position.copy(pulsarWorld);
  var pOp=pulsarOn*clamp(Math.max(skyFade,puStood?1:0)+((ph==='descent'||ph==='bone')?1:0),0,1)*(0.5+0.5*pk)*(ph==='bone'?Math.max(0,1-(now-phT0)/3500):1)*(1-0.82*exK)*(1-0.92*puMorphK);   /* v3.4 puStood · v4.6 — exK waits for the first break now; pulsarBreak folds the body away almost whole as its particles leave */
  if(AR_LIVE && pulsar.parent===scene) pOp=Math.min(1,pOp*1.6);   /* under the void now — burn brighter */
  var ps=(ph==='descent'||ph==='bone')? lerp(PS_SKY,0.6,sm01(((now-descT0)-1400)/2600)) : PS_SKY;
  pulsar.scale.setScalar(ps*(1-0.55*puMorphK));   /* v4.3 — it condenses as it becomes the gold thread */
  pulsarSet(pOp,blinkP,now);

  /* the bone's own point takes over the blink once the room is dark */
  if(ph==='bone'){
    dotEl.style.opacity=String(0.25+0.75*blinkP);
  }

  /* labels */
  if(ph!=='bone'){
    if(pulsarOn>0.5 && exK<0.5) place(plab,pulsarWorld,34, AR_LIVE&&pulsar.parent!==scene); else plab.style.display='none';
    llab.style.display='none';   /* v3.5 — the light-years line went with the thread (author's note) */
    if(youOp*alignK>0.35) place(ylab,youPos,-10,AR_LIVE); else ylab.style.display='none';   /* v4.6 — "you" ON the globe's face */
    /* the named stars, in tiny type */
    var slOn=skyFade>0.6 && leanK<0.4 && mapFade>0.3 && ph!=='bone' && swirlK<0.05;   /* v3.7 — the names sit out the procession */
    for(var s3=0;s3<starLabs.length;s3++){
      if(!slOn){ starLabs[s3].el.style.display='none'; continue; }
      worldFromEq(starLabs[s3].eq,tmpB,starLabs[s3].v).normalize().multiplyScalar(CFG.skyR);
      place(starLabs[s3].el,starLabs[s3].v,9,AR_LIVE);
    }
  }

  var hb=beat, hp2=prox;
  if(ph==='arrive'||ph==='after'){ hb=1.1; hp2=0.35; }   /* the docked bone idles cool */
  holo.upd(now,dt,hb,hp2, ph==='still');
  if(dockOn){
    dockGeom(dockK); dockDraw();
  }

  if(TEST){
    var aa=azAltOf(pulsarDir);
    read.textContent=ph+' · alt '+aa.alt.toFixed(1)+'° az '+aa.az.toFixed(0)+'°'
      +' · '+(cents===999?'—':cents.toFixed(0)+'¢')+' · beat '+beat.toFixed(2)
      +' · prox '+prox.toFixed(2)
      +(AR_LIVE?' · ar yaw '+((skyYaw+yawTrim)/DEG).toFixed(0)+'\u00b0':(gyroOn?' · gyro':' · drag'))+(micOn?' · mic':'');
  }

  if(AR_LIVE){ syncSkyLens(); renderer.render(skyScene,camera); }  /* the sky on its glass; the engine paints the room */
  else renderer.render(scene,camera);
}
/* ============================================================================
   v4.5 — THE EXERCISE'S GLASS (the artist's rulings, 26 jul 2026). display
   only: it READS the room's own measure (cents · voicedNow · exCnt · exMet ·
   the dock's true rect) and writes nothing into the laws. three faces:
   · the TITLE — "tuning with pulsar j0437-4715", white serif, while the
     exercise stands.
   · the GUIDE — the teaching words BELOW the bone (hum · slide up/down ·
     warmer · hold), Times, pulsing AT the throb they name; they yield to
     the room's own voice (never guiding against the speaker's leak), and
     go dark at the meeting — "two is now one" is SPOKEN, never typed.
   · the X-RAY — behind a tap on the skull (onTap): you/offset/throb at the
     top of the glass; the corridor/best/union lane BELOW the bone, never
     over it. no star chip (his ruling). throb is the honest number: the
     loudness-beat of two close tones, f0·|2^(¢/1200)−1| per second —
     slower is closer; the poem already says to let it still.
   v4.6 (the artist, 26 jul, thirteenth round) — the glass refined: title
     bracketed/smaller/breathing · egg rests during the exercise · guide is
     "hum" (spoken ~2s late), lower, held ≥1.7s with crossfades · whisper
     "tap me for x-ray" at ~10s, spoken · first skull-tap answers
     "activating x-ray mode".
   ========================================================================== */
var xrHz=0, xrOn=false, xrEver=false, xrHist=[], xrBest=1e9, xrT0=0, xrHintN=0, xrHintOff=0, xrNumT=0, xrPh=0, xrLastA='', xrLaneW=0;
/* v4.6 (the artist, 26 jul) — the glass grows a small voice and better manners:
   · the first guiding word is just "hum", SPOKEN ~2s after it appears;
   · the words HOLD (≥1.7s) and CROSSFADE — no more too-fast flips or
     overlapping messages; everything sits a little LOWER under the bone;
   · at ~10s the whisper "tap me for x-ray" appears AND speaks; the first
     skull-tap answers "activating x-ray mode" (sys register, in onTap);
   · the egg rests (hidden) while the exercise stands; the title is
     bracketed, smaller, breathing white (css). */
var xrGShowT=0, xrGSwapT=0, xrGNext=null, xrGFirstT=0, xrHumSaid=false, xrTapSaid=false, xrActSaid=false, eggHid=false;
var XSAY={ hum:  { voice:'pulsar', src:null, text:'hum', say:'hum.' },
           tapme:{ voice:'pulsar', src:null, text:'tap me for x-ray', say:'tap me for x-ray.' },
           act:  { voice:'sys',    src:null, text:'activating x-ray mode', say:'activating x-ray mode.' },
           offer:{ voice:'sys',    src:null,   /* v4.8 — the one-minute offer: the door onward without unison */
                   text:'want to try again? keep humming. or tap — seashell, or immersive experience.',
                   say:'want to try again? keep humming. or tap. sea shell, or immersive experience.' } };
var exTitleEl=byId('exTitle'), exGuideEl=byId('exGuide'), exHintEl=byId('exHint'),
    exXrayEl=byId('exXray'), exXlowEl=byId('exXlow'), exLaneEl=byId('exLane');
var xrLg=null; try{ xrLg=exLaneEl.getContext('2d'); }catch(_){ }
var XR_NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function xrNoteName(f){ if(!f) return '';
  var m=69+12*Math.log(f/440)/Math.LN2, mi=Math.round(m), off=Math.round((m-mi)*100);
  return XR_NOTE[((mi%12)+12)%12]+(Math.floor(mi/12)-1)+' '+(off>=0?'+':'')+off+'¢'; }
function xrToggle(){
  xrOn=!xrOn; if(xrOn){ xrEver=true; exHintEl.classList.remove('on'); }
  exXrayEl.className=xrOn?'on':''; exXlowEl.className=xrOn?'on':'';
}
function xrStabV(now){
  var s=0,n=0,m=0,i;
  for(i=xrHist.length-1;i>=0;i--){ if(now-xrHist[i].t>1500) break; m+=xrHist[i].c; n++; }
  if(n<6) return -1;
  m/=n;
  for(i=xrHist.length-1,n=0;i>=0;i--){ if(now-xrHist[i].t>1500) break; s+=(xrHist[i].c-m)*(xrHist[i].c-m); n++; }
  return Math.sqrt(s/n);
}
function xrLaneDraw(now){
  if(!xrLg) return;
  var cw=exLaneEl.clientWidth||300, dpr=Math.min(2,devicePixelRatio||1);
  if(xrLaneW!==cw){ xrLaneW=cw; exLaneEl.width=Math.round(cw*dpr); exLaneEl.height=Math.round(36*dpr); }
  var Wl=exLaneEl.width,Hl=exLaneEl.height;
  xrLg.clearRect(0,0,Wl,Hl);
  var span=150, y0=Hl*0.5, bh=(CFG.exCents/span)*Hl*0.5;
  xrLg.fillStyle='rgba(255,222,120,0.10)'; xrLg.fillRect(0,y0-bh,Wl,bh*2);
  xrLg.fillStyle='rgba(150,196,255,0.55)'; xrLg.fillRect(0,y0-0.5,Wl,1);
  xrLg.strokeStyle='rgba(255,222,120,0.9)'; xrLg.lineWidth=Math.max(1,Hl/22); xrLg.lineCap='round';
  xrLg.beginPath(); var began=false;
  for(var i=0;i<xrHist.length;i++){ var h2=xrHist[i], x=Wl*(1-(now-h2.t)/12000);
    if(x<0) continue;
    var y=y0-Math.max(-1,Math.min(1,h2.c/span))*Hl*0.5*0.92;
    if(began) xrLg.lineTo(x,y); else { xrLg.moveTo(x,y); began=true; } }
  xrLg.stroke();
}
function xrGuideText(now){
  /* the room's own voice must never be answered as a visitor (§8's leak law) */
  if(now!==null && performance.now()-lastRoomSpeakMs<420) return null;
  if(!voicedNow||cents===999) return {a:'hum',b:'lips closed · any note that comes easy'};   /* v4.6 — just "hum" (the artist) */
  var a=Math.abs(cents);
  if(a<CFG.exCents) return {a:'hold…',b:'let the throb still'};
  if(a<=55) return {a:'warmer…',b:cents<0?'a hair higher':'a hair lower'};
  return {a:cents<0?'<span class="gg">slide your hum up</span>':'<span class="gg">slide your hum down</span>',b:'slowly · the waves will tell you'};
}
(function xrTick(now){
  requestAnimationFrame(xrTick);
  now=now||performance.now();
  var ex=(ph==='exercise');
  exTitleEl.className=ex?'on':'';
  /* v4.6 — the egg rests while the exercise stands (the artist) */
  if(ex&&!eggHid){ eggHid=true; if(eggEl){ eggEl.style.opacity='0'; eggEl.style.pointerEvents='none'; } }
  else if(!ex&&eggHid){ eggHid=false; if(eggEl){ eggEl.style.opacity=''; eggEl.style.pointerEvents=''; } }
  if(!ex){ if(xrOn) xrToggle(); exGuideEl.className=''; exGuideEl.style.opacity=''; exHintEl.classList.remove('on'); xrT0=0; xrGSwapT=0; xrGNext=null; return; }
  if(exMet&&xrOn) xrToggle();                       /* the meeting owns the glass — the ball and the ask stand clear */
  if(exLive&&!xrT0){ xrT0=now; xrHist.length=0; xrBest=1e9; }
  /* the bone's true place — everything below hangs from its bottom edge */
  var rB=H*0.72; try{ var r=dockEl.getBoundingClientRect(); if(r&&r.height>4) rB=r.bottom; }catch(_){ }
  var gY=Math.min(rB+34,H-158);                     /* [TUNE guide seat] v4.6 — a little lower (was +10 / −172), the artist's ruling */
  /* the steadiness ledger (kept even while the x-ray sleeps) */
  if(exLive&&!exMet&&voicedNow&&cents!==999&&performance.now()-lastRoomSpeakMs>420){
    xrHist.push({t:now,c:cents});
    var aC=Math.abs(cents); if(aC<xrBest) xrBest=aC;
  }
  while(xrHist.length&&now-xrHist[0].t>12000) xrHist.shift();
  /* the guide — below the bone, dark at the meeting (the line is SPOKEN).
     v4.6 — the words HOLD ≥1.7s and CROSSFADE (no fast flips, no overlap) */
  var gOn=exLive&&!exMet&&!xrOn&&!choiceOn;
  if(gOn){
    exGuideEl.style.top=gY+'px';
    var g=xrGuideText(now);
    if(g){ var htm=g.a+(g.b?'<span class="gsub">'+g.b+'</span>':'');
      if(!xrLastA){ exGuideEl.innerHTML=htm; xrLastA=htm; xrGShowT=now; }
      else if(htm!==xrLastA && !xrGSwapT && now-xrGShowT>1700){ xrGNext=htm; xrGSwapT=now; exGuideEl.style.opacity='0'; }
      else if(htm===xrLastA && xrGSwapT && now-xrGSwapT<220){ xrGSwapT=0; xrGNext=null; exGuideEl.style.opacity=''; }   /* it wobbled back before leaving */
    }
    if(xrGSwapT && now-xrGSwapT>=460){ exGuideEl.innerHTML=xrGNext; xrLastA=xrGNext; xrGNext=null; xrGShowT=now; xrGSwapT=0; exGuideEl.style.opacity=''; }
    exGuideEl.className='on';
    if(!xrGFirstT) xrGFirstT=now;
    /* the words pulse AT the throb they name (never mid-crossfade) */
    if(!xrGSwapT && now-xrGShowT>600){
      var xb=(voicedNow&&cents!==999)?CFG.f0*Math.abs(Math.pow(2,cents/1200)-1):CFG.beatCap;
      xrPh+=Math.min(xb,CFG.beatCap)*6.2832*0.0166;
      exGuideEl.style.opacity=(voicedNow&&xb<CFG.beatCap)?String(0.74+0.26*(0.5+0.5*Math.sin(xrPh))):'';
    }
  } else { exGuideEl.className=''; exGuideEl.style.opacity=''; xrGSwapT=0; xrGNext=null; }
  /* v4.6 — the voice says "hum" ~2s after the word first stands */
  if(xrGFirstT&&!xrHumSaid&&now-xrGFirstT>2000&&exLive&&!exMet){ xrHumSaid=true; narrSeq([XSAY.hum],null); }
  /* the whisper — "tap me for x-ray": ~10s after the first guide it appears
     AND SPEAKS (v4.6); once more at 45s, silent; never after the x-ray has
     been seen */
  if(exLive&&!xrEver&&!xrOn&&!exMet&&!choiceOn){   /* v4.8 — the whisper yields to the standing offer */
    var tE=now-(xrGFirstT||xrT0);
    if(xrHintN===0&&tE>10000){ xrHintN=1; xrHintOff=now+6000;
      if(!xrTapSaid){ xrTapSaid=true; narrSeq([XSAY.tapme],null); } }
    if(xrHintN===1&&now>xrHintOff&&tE>45000){ xrHintN=2; xrHintOff=now+5500; }
    exHintEl.style.top=Math.min(gY+62,H-96)+'px';   /* always a full breath below the guide's sub-line (v4.6 — they collided at the clamp) */
    exHintEl.classList.toggle('on', now<xrHintOff);
  } else exHintEl.classList.remove('on');
  /* the x-ray — numbers at ~10hz, the lane every frame */
  if(xrOn){
    exXlowEl.style.top=Math.min(rB+8,H-150)+'px';
    xrLaneDraw(now);
    byId('exHoldB').style.width=(Math.max(0,Math.min(1,exCnt/CFG.exHoldMs))*100)+'%';
    if(now-xrNumT>100){ xrNumT=now;
      var live=voicedNow&&cents!==999;
      if(live){
        byId('exYouHz').textContent=xrHz?xrHz.toFixed(1):'—';
        byId('exYouNote').textContent=xrHz?xrNoteName(xrHz):'';
        byId('exOffC').textContent=(cents>0?'+':'')+Math.round(cents)+'¢';
        byId('exOffC').className='xbig '+(Math.abs(cents)<CFG.exCents?'xok':(Math.abs(cents)<=55?'xgold':''));
        byId('exOffDir').innerHTML=exMet?'<span class="xok">one</span>':(Math.abs(cents)<8?'<span class="xok">hold…</span>':(cents<0?'<span class="xgold">▲ higher</span>':'<span class="xgold">▼ lower</span>'));
        var xb2=CFG.f0*Math.abs(Math.pow(2,cents/1200)-1);
        byId('exThrobV').textContent=(xb2>=CFG.beatCap)?'>8':xb2.toFixed(1);
        var st2=xrStabV(now);
        byId('exSteadyV').textContent=(st2<0)?'':('±'+st2.toFixed(0)+'¢ '+(st2<8?'steady':(st2<20?'wavering':'sliding')));
      } else {
        byId('exYouHz').textContent='—';
        byId('exYouNote').textContent=micOn?'silent':(NOMIC?'sim':'mic waking…');
        byId('exOffC').textContent='—'; byId('exOffC').className='xbig';
        byId('exOffDir').innerHTML='&nbsp;'; byId('exThrobV').textContent='—'; byId('exSteadyV').textContent='';
      }
      byId('exCorrS').textContent='corridor ±'+CFG.exCents+'¢';
      byId('exBestS').textContent='best '+(xrBest<999?Math.round(xrBest)+'¢':'—');
      byId('exUnionS').textContent='union ×'+(exMet?1:0);
    }
  }
})();
if(TEST) window.__xr=function(){ return { on:xrOn?1:0, ever:xrEver?1:0, title:exTitleEl.className==='on'?1:0,
  guide:exGuideEl.className==='on'?1:0, line:exGuideEl.textContent.slice(0,60), hint:exHintEl.classList.contains('on')?1:0,
  best:(xrBest<999)?Math.round(xrBest):-1, hz:Math.round(xrHz*10)/10, drift:UNI.drift, hist:xrHist.length,
  egg:eggHid?1:0, humSaid:xrHumSaid?1:0, tapSaid:xrTapSaid?1:0, actSaid:xrActSaid?1:0 }; };
if(TEST) window.__v46=function(){ return { shoal:(shoal&&shoal.grp.visible)?1:0, drift:Math.round(shoalDrift),
  sparks:spks.length, touch:spkTouch?1:0, exKT:exKT?1:0, ek:Math.round(earthK*100)/100,
  egone:Math.round(earthGoneK*100)/100, bursts:mbBursts.length, w:UNI.w, drop:Math.round(EARTH_DROP/DEG),
  early:window.__earlySay?1:0, offered:exOffered?1:0 }; };   /* v4.7 early: head-start fetch unadopted · v4.8 offered: the one-minute door stands */

primeWords();              /* v4.3 — the elevenlabs fetches ride the page load itself */
introSpin();               /* v3.2 — the skull is turning before anything else is even asked for */
/* v4.7 — THE WORDS NO LONGER WAIT FOR THE LANDING OR THE ENGINE (the artist:
   "plays as soon as possible as user enters page"): through the tunnel the
   frame's inherited blessing usually stands the context at once, so L1 sounds
   at PAGE ENTRY — seconds before the ar engine has even booted; standalone,
   the context refuses until the landing touch, and the very same touch frees
   it (no arc change). begin()'s own waitCtxThen call remains as the belt;
   openingStart's guard keeps it once-only. jumps (?phase=) have no opening. */
if(!qs.phase) waitCtxThen(openingStart);
requestAnimationFrame(loop);
})();
</script>
