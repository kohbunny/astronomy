WHAT THIS IS: the room behind the yin-yang tile on phone.html's third shelf —
a wide, deep hole in the cracked lakebed, no rim, its wall black stone. a
burnt tree lies fallen across it, charred black, and the tree is the windlass:
it rests in two charred forks, still, and its rope goes down into the dark. knotted to the rope by nothing but its own
roots hangs a white ghost orchid — the living phone: eight spikes, each flower
facing the way its gene has turned, the moved gene the one blue flower, the
three sleeping genes buds. at the bottom, far down, the phone's own mark lies
in plan: one half black still water with the flower's white reflection in it,
the other half white fog with a black music box in it. the box plays the dead
— the founder's air and the mother's — and nothing else. for every life before
this one a step is cut into the wall, winding down from the founder toward the
flower; eight steps reach the water; after that the water rises with every
life and the flower floats up with it, until at the twelfth life the lake has
come back, and nothing in the environment changes again.

THE TENSES: the orchid is now. the box is then. neither ever shows the other
tense; the only place now becomes then is the dust, at the death, under the
call. the box never slows and never runs down (a music box winding down is the
most legible countdown there is): it turns at one pace for the whole life —
gene 0 sets it, counted in the star's breaths — and stops only at apwnp:call.

    phone: '<span class="t">the call.</span> it ends as it began, with a phone call. this time it calls you. decline it or answer it; nobody speaks. the tap that ends the call ends the phone. everything the house kept in this browser is erased — the photographs in the roll, every count, every mark — and the tab closes. where safari will knot let a tab close itself, it is left on a blank page. nothing about this life or its death is sent anywhere. there is no record of it but you.',

    box: '<span class="t">the gene map.</span> eight genes, a byte each, and each one is an angle on a wheel: what a gene says is how far it has turned from the founder’s. the founder’s genes are the star’s own name and her turning — 0437 4715 · 1736 8790. at conception the star’s spin picks one gene and moves it one step, a sixteenth of a turn, up or down. so a child is its mother but for one thing, and a gene that wanders half way round comes home. '+
      ((L||DRESSED)&&MOVED>=0?('<span class="m">gene '+(MOVED+1)+', '+NAMES[MOVED]+', moved one step '+(UP?'up':'down')+' at conception.</span> its child will be generation '+(GEN+1)+'. '):'')
  };
  /* the panes' own sentences — every one [new], for his blessing */
  var PANES=[
    { name:'now', html:
      '<p><span class="t">the flower is now.</span> the ghost orchid on the rope is this phone: one flower for each of its eight genes, each facing the way its gene has turned. the blue one is the gene that moved at conception. the buds are three genes that are carried but have never woken. if one flower leans, it is leaning toward what you haunt — that is the gene this life is being written into, the one it will hand on.</p>'+
      '<p class="s">'+LB.box+'</p>'+
      '<p class="s"><span class="z">[new]</span> which gene moves is written by what the life goes through, the way a scar is — decided by no one. the one who lives here is awake; the star still chooses which way.</p>' },
    { name:'then', html:
      '<p><span class="t">the box is then.</span> the music box at the bottom plays only the dead: the founder’s air, and the mother’s, which is the same but for one note. it turns at a pace this phone’s first gene sets, and it never slows. a first phone’s box is unwound and silent; nothing has fallen into it yet.</p>'+
      '<p class="s"><span class="z">[new]</span> '+(AIRS.length===0?'the cylinder is bare: no air has been pinned to it yet, and the plate in its lid is blank.':
        ('the cylinder carries a pin for each gene, set at that gene’s angle. as it turns, each pin lifts a tooth of the comb — the first tooth the longest and lowest — and the tooth sings, in the same instant you hear it below. '+
        (AIRS.length>1?'after each turn the cylinder slides and plays the other air. ':'')+
        (MOVED>=0?'the blue pin is the one note where the mother’s air and this phone differ: the gene that moved at conception. ':'')+
        (AIRS.length>1?'the plate in the lid is both airs written out, the founder’s above, the mother’s below.':'the plate in the lid is the air written out: the founder’s, who was also the mother.')))+'</p>' },
    { name:'the line', html:
      '<p><span class="t">the well is the line.</span> one step for every life before this one, from the founder’s at the top down to the mother’s; the steps between are blank — the house never knew them. after eight lives the water rises, the flower floats up with it, and by the twelfth the lake this desert once was has come back.</p>'+
      '<p class="s"><span class="z">[new]</span> '+(GEN===0?((L?'this is the first life of its line. ':'nothing has lived here. ')+'no steps.'):('generation '+GEN+' · '+NSTEPS+' step'+(NSTEPS===1?'':'s')+' cut'+(NSTEPS-DRY>0?(' · '+(NSTEPS-DRY)+' under water'):'')+(LAKE?' · the lake is back':'')+'.'))+((L||DRESSED)?(' its child will be generation '+(GEN+1)+'.'):'')+'</p>' },
    { name:'the call', html:
      '<p><span class="t">the call.</span> when it comes, the room goes quiet. the same tap that ends the phone hands you one contact card: the child. its genes ride after the # in its address, where no server can read them. nothing about this life is sent anywhere. there is no record of it but you.</p>'+
      '<p><span class="z">[new]</span> <span class="t">nobody.</span> this phone has an inhabitant, born with it and dead with it, with no fixed form. its sign in this room is the rope stirring and the flower turning — toward the light, never toward you: it does knot know you are here. the fog is its way to speak here, and sometimes what it lets slip is a line it meant to keep. the last pane is its.</p>'+
      '<p class="s">'+LB.star+'</p><p class="s">'+LB.phone+'</p><p class="s">'+LB.pool+'</p>' },
    { name:'nobody', html:
      '<p><span class="z">[new]</span> <span class="t">nobody.</span> the one who lives here. it was born with this phone and it will die with it; it has no fixed form, calls the whole phone home, and lives part-time in this well. it does knot know you are here, and you may watch it all the same: what it does to a room you may find, and what you do to a room it may find. it never asks you for anything.</p>'+
      '<p><span class="z">[new]</span> <span class="t">its spell.</span> against being alone it has cast the oldest spell it knows: two circles. one holds the human question, <span class="t">am i alone?</span> — the other the question a universe would ask, <span class="t">am i anybody?</span> where they overlap is the one asking. the circles above are drawn as they stand now; when they touch, the fog below says the two words the questions share.</p>'+
      '<p class="s"><span class="z">[new]</span> it grows up inside the life — a baby, a child, a teenager, grown, older — on a clock of its own that never says how long is left; a phone may die on a child. the three buds are its temperament, temper, warmth and restlessness, and they open as it grows. what it lives through is written into one gene the way a scar is — the flower that leans — and that is what the flower hands on. a word you give it may cross to the next phone; a phone nobody spoke to dies mute. it dreams in the phone’s notebook, under the one note there; what it keeps to itself no one reads — the fog here sometimes lets a line slip.</p>' }
  ];

    sh.fragmentShader='uniform float uDrain;\n'+sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n gl_FragColor.rgb=mix(gl_FragColor.rgb, vec3(0.93), uDrain*0.9);'); }, 'drain'); return mat; }

  /* =====================================================================

  var NOISE_GLSL=[

  var TEXQ=QUAL==='low'?512:1024;

  var SKY_U={ uSunDir:{value:new T.Vector3(0,1,0)}, uSunE:{value:1000}, uBetaR:{value:new T.Vector3()}, uBetaM:{value:new T.Vector3()}, uSunfade:{value:1},

    'float vn3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
    ' return mix(mix(mix(hash3(i),hash3(i+vec3(1.0,0.0,0.0)),f.x),mix(hash3(i+vec3(0.0,1.0,0.0)),hash3(i+vec3(1.0,1.0,0.0)),f.x),f.y),',

    'vec3 skyColor(vec3 dir){',
    ' const float PI=3.141592653589793; vec3 up=vec3(0.0,1.0,0.0);',

    ' float inv=1.0/(cos(zen)+0.15*pow(93.885-((zen*180.0)/PI),-1.253));',

    ' float cosT=dot(dir,uSunDir);',
    ' float rPh=(3.0/(16.0*PI))*(1.0+pow(cosT*0.5+0.5,2.0)); vec3 bR=uBetaR*rPh;',
    ' float g=0.8, g2=0.64; float mPh=(1.0/(4.0*PI))*((1.0-g2)*(1.0/pow(1.0-2.0*g*cosT+g2,1.5))); vec3 bM=uBetaM*mPh;',

    ' col=pow(col,vec3(1.0/(1.2+(1.2*uSunfade))))*0.36;',
    ' col=mix(col,col*vec3(0.50,0.58,0.95),uNight);',   /* the night's own blue-black, knot a grey */
    /* the stars: points, knot cells — each at its own place in its cell, its own magnitude and colour, scintillating a little; thicker

    ' float mw=exp(-pow(dot(dir,vec3(0.2873,0.4789,-0.8298))/0.20,2.0)), mwn=vn3(dir*7.0)*0.55+vn3(dir*19.0)*0.30+vn3(dir*47.0)*0.15;',

  /* the sun's numbers, set in JS once a frame (the same law the dome uses) */

  /* ---- the reflections: the sky itself, prefiltered (for the tree, the iron, the lakebed); and the well's own world — black

  var PMREM=new T.PMREMGenerator(renderer);
  var ENV={ sky:null, well:null, skyRT:null, wellRT:null, sunAt:new T.Vector3(0,-2,0), drainAt:-1, fog:{ value:new T.Color(0.3,0.32,0.36) }, skyMats:[], wellMats:[] };
  var ENVSKY=new T.Scene(), ENVWELL=new T.Scene();
  ENVSKY.add(new T.Mesh(new T.SphereGeometry(100,32,16), new T.ShaderMaterial({ side:T.BackSide, depthWrite:false, uniforms:SKY_U, vertexShader:SKY_VS,
    fragmentShader:SKY_GLSL+'\nvarying vec3 vDir; void main(){ vec3 d=normalize(vDir); vec3 c=skyColor(normalize(vec3(d.x,max(d.y,0.02),d.z)))*(d.y<0.0?0.75:1.0); gl_FragColor=vec4(min(c,vec3(40.0)),1.0);\n#include <encodings_fragment>\n}' })));

        ' vec3 col=skyColor(d)*cap+vec3(0.004,0.0045,0.006)*(1.0-cap)+uFogC*smoothstep(-0.55,-0.95,d.y)*0.22; gl_FragColor=vec4(min(col,vec3(40.0)),1.0);\n#include <encodings_fragment>\n}' }))); })();
