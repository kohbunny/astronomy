var NOTES=[
  ['stonehinge','a social network that runs on time instead of space. its plan is a vesica piscis: two circles, each centred on the other’s rim, and one stone where they overlap. you arrive with the circles apart.'],
  ['the rings','the two rings at the foot of the glass are the two circles — the past on the left, the future on the right — drawn as a map: east to the right. slide a ring toward the other, or turn it (they roll like wheels), or pinch the two with two fingers, and the worlds slide together under you — you stay in your own, the other approaches. as the rims cross the lens opens and the sarsens rise out of the ground where the overlap is, centre first, until the circles stand each on the other’s rim: the vesica, and a small ring of stones rises in the lens of the rings. let go and they hold for a breath, then drift apart on their own, the stone sinking back. a finger anywhere holds them.'],
  ['the past circle','8000 bc. a ring of raised pine trunks on a low bank — the posts that stood on this plain five thousand years before a stone did — and the forest of scots pine and hazel beyond, mist at the knee, a low gold sun. humanity’s question is asked here: am i alone?'],
  ['the future circle','four hundred million years on, as he dreamt it. a ring of black titan pines on a cracked rim, vents that breathe, steam rings in a red sky, strangers for stars. the universe’s question is asked here: am i anybody?'],
  ['the pupil','the lens where the circles overlap holds the only stone in the world: the sarsen circle, timeless. two suns light it, one gold from the west and one red from the east, so every stone throws two shadows. a black pool at the altar holds both skies, and the stones and the trees when you stand near.'],
  ['the tide','nothing is turned. you drift along the axis, posts to titans and back, once every eight of her breaths. a touch holds it; a drag moves it; let go and it resumes. where the circles overlap the stones keep their twelve states, dealt by where you stand: the raising toward the past, today at the centre, the sunken ruin toward the end.'],
  ['the knocks','the only mark here is a rhythm. tap a post, a stone or a titan a few times — in the world, or on the rings: a stone of the left ring sounds the post standing at that place in the past circle, a stone of the right ring the titan in the future’s, the small ring in the lens the sarsen. the intervals between your taps are the whole message. no words, no names. each material has its own voice, and each place its own note: hollow wood tuned round the ring, the sarsen’s tock, the bluestones’ chime, the titans’ crusted thud with her tone on its own degree. every knock, and every echo of everyone’s, lights its place on the rings.'],
  ['echoes in time','every knock ever made here replays, each starting on one of her beats. inside the pupil you hear them all, ringing — the sarsen circle holds a reverb of six-tenths of a second and lifts a voice within it (salford, 2020); further off they are a murmur. a knock is heard again later, fainter and darker, toward the far side — a delay whose feedback grows with age. the old carvings of this place were words; they are sounded here as knocks, never shown.'],
  ['the spark','the past is rhythm — hands, wood, a drum, no pitch. the future is tone — her spin, 173.69 hz, is the drone. music exists only where they overlap. a knock that lands on her beat lights the pupil and the bluestones flare: the human’s rhythm has found the universe’s pitch, and for one breath the two questions are one.'],
  ['her','psr j0437−4715, a pulsar 512 light years away, turning 173.69 times a second. the bluestones breathe once per 2¹¹ of her turns — 11.794 seconds — the coin clock’s own turn; her beat is a sixteenth of that. the blue is hers and never drains.'],
  ['who you are here','nobody. no names exist in this app, no faces, no camera. the phone keeps one key so the ledger may count its knocks; the ledger knows the phone only as a hash of it.'],
  ['the colour','full colour when you arrive; it drains to silver over twenty minutes. two colours never drain: red — the vents, the embers, the future’s sun — and the blue of the bluestones.'],
  ['the way out','the little phone, top left — home to the tile.'] ];

/* ============================================================== THE RINGS · the room's control (v6 · 28 sep 2026, his ask)
   his words: `would like to update the interface so that user uses their fingers to move these rings instead of current
   system. thinking of these rings at bottom of page and user can bring them together but they naturally pull apart. even
   though small, wonder if tapping individual areas make individual noises that then correspond visually to the stones
   making noise. rotating the rings with the fingers also bring them together. … in the end should be really easy to use.`
   so the two rings of his film stand at the foot of the glass, and they ARE the two circles: the left the past (the posts),
   the right the future (the titans). the plan reads as a map — east to the right, and down the glass is the world's +z —
   so a place on a ring is the same place on its circle.
   · SLIDE a ring toward the other (a finger anywhere on it) and the circles come together; the ring follows the finger.
   · TURN a ring (a finger on its stones, moving round it) and it rolls — the rings are wheels: the left one rolls east
     turning clockwise, the right one west turning the other way — so turning brings them together too, and a slide
     turns them as they go. the ring's turn and its place are one number (the separation), so they are always mirrored.

     seconds anywhere else (PULL.WAIT), then slowly, gathering, the stone sinking back as the lens closes. any finger on
     the glass, an open knock or the ⓘ holds them where they are (time never moves under a thumb).
   · TAP A STONE on a ring: it sounds, and the thing standing at that place on that circle answers in the world — the
     post, the titan — with its own voice, its light and its ring on the ground; the stone on the ring lights with it.
     every post is tuned now (a pentatonic hill round the ring, rising over the north and falling over the south) and
     every titan sounds her tone on its own degree, so each place has its own note. taps are knocks: the rhythm is kept.
   · WHERE THEY MEET the small ring rises in the lens — the sarsen circle, the same stones at a third of the size, her
     blue in the bluestones inside it. tap it and the stone at that place answers (the bluestones, in the middle).
   · every knock in the world — yours, and the echoes of everyone's — lights its place on the rings, so the rings
     twinkle with the echoes. the eye is a small light on the axis.
