<!--
  light (prototype v4 — the year in the glass) · apwnp

  THE DOLLS: the light room is a russian doll. the page opens on a snowglobe
  holding a small real world — an apple tree bearing EGGS, grass blade by
  blade, a glowing rainbow cloud low behind it — and at the tree's foot sits
  a smaller globe. shake the glass and a fine white dust wakes and flutters.
  KEEP shaking — six sustained seconds — and the blizzard whites the world
  out and carries you down into the smaller globe, which becomes the world.
  the chain: THE ORCHARD (the tree of eggs, the year, the star) falls into
  THE SEA — a night ocean under a moon, a lighthouse on its rock sweeping
  a real beam across real water — and on the rock waits THE LIGHT GLOBE,
  the crystal ball of the old room, its spectrum lying in bands. fall again
  and the light is the world: the ball afloat in the dark, the flame
  behind, the dust that storms white and rains home red-first into its
  seven strata — the same function it always performed. six more and you
  fall through the glass itself: INSIDE THE LIGHT — the silver floor, the
  narration, the grains. one full look-around from within lets you out —
  into the orchard again. the light grows the tree. the dolls never end.

  THE YEAR: the globe turns on its own, and one revolution is one year —
  the orchard passes through all four seasons as it goes. spring greens the
  leaves and lets petals drift; summer deepens everything under a high sun;
  autumn turns the canopy and sheds it leaf by leaf; winter bares the
  branches, lays snow over the ground, frosts every surface, and lets a
  little weather fall on its own. dragging the globe scrubs the year with
  your hand (and swings the sun — see THE STAR). all of it is one continuous
  blend around the wheel, no cuts. reduced-motion stops the auto-turn; the
  year then moves only by hand.

  THE STAR: a little star hangs inside the glass — a small sun. it rides
  the globe's turning (one lap per year), sits high in summer and low in
  winter, and the scene's real shadow-casting light takes its direction
  from it every frame: turn the globe and the shadows swing. a soft point
  light at its heart warms whatever it passes over.

  THE SEA: one doll down. the water is a live shader — six wave trains in
  the vertex (three swells, two chops, one slow radial), crossing ripples,
  crest-lift and a moon-path streak in the fragment — and OPAQUE, so the
  transmission glass carries it whole. THE LIGHTHOUSE IS THE CAVE'S OWN,
  at 1:65 — the weathered stone tower ported with its exact wound table
  and weathering sines, the door a dark arch in its skin, the dark iron
  gallery with rail and posts, the ghost-glass lens room, and inside it
  the eye's cool light. the beam came whole too: two nested cones, cold
  blue (0xb0d8fa in, 0x7fa7cf out), jittered along their length by value
  noise so they dissolve like breath; the water's wedge went cold to match
  and tracks the beam's world angle. the MOON drives the shadow light the
  way the orchard's star does, so dragging the globe swings the moonlight.
  the sea keeps no snow — flakes die at the waterline. the mini light
  globe waits on the SMALLER island, alone with the water. the orchard's
  mini globe previews all of it: a speck of sea, a fingernail stone tower,
  a cold grain of lamp.

  THE WEATHER: shaking wakes a fine white dust — 1300 small grains, sized
  against the true portrait viewing distance so they never fall below a
  pixel — and what settles COVERS EVERYTHING: the ground whitens
  under a snow shell, and the leaves, the grass, the bark, the earth all
  frost toward white as the cover deepens. it melts with the season.

  THE RAINBOW: not arcs of line — a CLOUD. a hundred and fifty soft motes
  of glow banded violet-in to red-out, additive, shimmering, breathing.
  strongest in spring, palest in winter.

  THE METER IS THE WEATHER: no progress bar. sustained shaking thickens the
  storm, a veil breathes up, at full white you cross. stop, and the charge
  decays. CHARGE_T=3.4s; ?fast=1 for 1.6s while testing.

  THE ARRIVAL (over the bridge): the old choreography, integrated onto this
  globe — on ?enter=light (the hub posts 'arrive-light' at its bloom; 4s
  fallback when direct) the EGG at the top releases the light: tiny grains
  fall from its underside into the crown of the glass; a small quiet glow
  where they land; the world inside answers with a storm of its own; seven
  close HAZY beams pour down below the ball; and the light GROWS THE WORDS —
  coloured points fly out of the beams into the letterforms of the intro,
  resolve to chalk, dissolve, and the real text remains. reduced motion
  fades the text in directly. the charge is locked while the arrival plays.

  TWO GLASSES, ONE LAW: the orchard's world is OPAQUE, so the outer globe
  wears TRUE TRANSMISSION — photoreal thin-shell refraction (transmission 1,
  thickness 0.05, ior 1.5, clearcoat) — which the old room could never wear
  because its dust is additive-transparent and the transmission pass
  excludes transparent objects (the "empty ball" trap, hard-won). the
  additive weathers (snow, cloud, drift) render after the transmissive pass
  and ride renderOrder above the glass, so they survive it. the LIGHT globe
  keeps the documented thin clear skin. ?skin=1 falls back everywhere.

  THE GROUND, INSIDE: v3's mound poked out through the glass at the equator
  (the green muffin). the dome is the whole world now — the ground is a low
  hill whose edge meets the glass wall from within (MND_RX chosen against
  the sphere's radius at its height), so the glass closes over everything.

  THE STACK: three.js r158, pinned, UMD, one plain script tag — no modules,
  no build. probe + nogl fallback. PCFSoft shadows, one 1024 map; leaf
  shadows are leaf-shaped via a custom depth material. ACES + PMREM env.

  PARKED (to be re-wired, not lost): webar and the eye 👁 · the metal
  button (the doll mechanic is the way inside now) · tilt-gravity sediment ·
  the departure. ?flat / ?nocam / ?go are accepted and ignored for now.

  SOUND: the house law — webaudio only, filtered noise, water and wind, no
  pitch anywhere. a wind bed breathes; the blizzard loop rides the storm;
  the charge adds a low rumble; a shake in the light globe is the breaking
  wave; the settle is two washes and a hush; the crossing is the
  submergence dive. ?mute silences the room.

  THE EGG: same contract — framed, posts {apwnp:'close-jewel'} to the
  tunnel; standing alone, index-doors.html.

  KNOBS: the TUNE block below · ?level=N · ?fast=1 · ?skin=1 · ?test ·
  ?mute · ?enter=light (bridge arrival).
-->
<style>
  html,body{ margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  :root{
    --chalk:#b9b4a8; --chalk-bright:#e8e2d2; --chalk-dim:#6a655a; --flame:#ffe27a;
    --serif:'EB Garamond', Georgia, 'Times New Roman', serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  body{ color:var(--chalk); font-family:var(--serif);
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }

  #glcv{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #veil{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:30; }

  /* the egg — the way back to the tunnel */
  #eggback{
    position:fixed; top:calc(env(safe-area-inset-top, 0px) + 14px); left:50%;
    width:17px; height:22px; transform:translateX(-50%);
    background:radial-gradient(ellipse at 35% 28%, #ffffff 0%, #e9edf4 45%, #c7cfdd 78%, #9aa5b8 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 42% 42%;
    z-index:22; cursor:pointer; opacity:.92;
    box-shadow:0 0 14px rgba(220,232,255,.28);
    transition:opacity .4s ease, transform .4s ease;
  }
  #eggback:hover{ opacity:1; transform:translateX(-50%) scale(1.08); }

  /* the intro — words the light grows below the glass on arrival, and leaves standing */
  #intro{ position:fixed; left:0; right:0;
    bottom:max(6vh, calc(env(safe-area-inset-bottom, 0px) + 18px));
    text-align:center; font-family:var(--mono); font-weight:300;
    font-size:clamp(0.56rem, 2.8vw, 0.8rem); letter-spacing:0.08em; line-height:2.1;
    color:var(--chalk); opacity:0; z-index:20; pointer-events:none; white-space:pre-line; }

  /* the light, speaking — from inside */
  #narr{ position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(max(3.2vh, env(safe-area-inset-bottom)) + 4.6rem);
    width:min(86vw, 30rem); z-index:21; pointer-events:none;
    font-family:var(--serif); font-style:italic; font-size:clamp(1.02rem,4.2vw,1.2rem);
    line-height:1.65; color:var(--chalk-bright); text-align:center;
    text-shadow:0 0 18px rgba(0,0,0,0.9);
    opacity:0; transition:opacity .8s ease; }
  #narr.on{ opacity:1; }

  #fallback{ position:fixed; left:50%; top:44%; transform:translate(-50%,-50%);
    width:min(84vw,26rem); text-align:center; z-index:5;
    font-family:var(--serif); font-style:italic; color:var(--chalk-dim);
    font-size:0.98rem; line-height:1.7; display:none; }
  html.nogl #fallback{ display:block; }

  #dbg{ position:fixed; bottom:2px; left:5px; font:10px monospace; color:#666; z-index:99;
    display:none; pointer-events:none; }
</style>

<body>

  <canvas id="glcv" aria-hidden="false" role="application"
          aria-label="a snowglobe holding worlds within worlds: an orchard turning through the four seasons under a little star; inside its smaller globe, a night sea with a lighthouse under the moon; inside that, a globe of light. drag to turn each world; shake and fine snow flutters; keep shaking and you fall through, globe into globe."></canvas>
  <div id="veil"></div>

  <div id="eggback" title="back"></div>
  <div id="intro"></div>
  <div id="narr"></div>
  <p id="fallback">the glass needs webgl to hold its shape.<br>come back with a browser that dreams in three dimensions.</p>
  <div id="dbg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
<script>
/* the probe — do we have a world to build in? */
(function(){
  try{
    var ok = !!window.THREE, c = document.createElement('canvas');
    ok = ok && !!(c.getContext('webgl2') || c.getContext('webgl'));
    window.__GL3D = !!ok;
    if(!ok) document.documentElement.className += ' nogl';
  }catch(e){ window.__GL3D=false; document.documentElement.className += ' nogl'; }
})();
</script>

<!-- the world — orchard over light over the inside of light -->
<script>
(function(){
'use strict';
if(!window.__GL3D) return;
var T = window.THREE;

/* ----------------------- flags ----------------------- */
var qs={}; (window.location.search||'').replace(/[?&]([^=&]+)=?([^&]*)/g,
  function(_,k,v){ qs[k]=decodeURIComponent(v||'1'); });
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function ez(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
var TAU=6.283185307;
var reduced=false; try{ reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var BRIDGED=(qs.enter==='light');

/* ----------------------- [TUNE] the knobs ----------------------- */
var CHARGE_T   = 3.4;    /* [TUNE dolls] seconds of sustained shaking to fall through */
var CHARGE_DK  = 0.14;   /* [TUNE dolls] how fast the whiteout forgets when you rest */
var STORM_GATE = 0.30;   /* [TUNE dolls] how stormy it must be before time counts */
var SHAKE_SENS = 7;      /* [TUNE shake] devicemotion magnitude that counts — house standard */
var FN         = 1300;   /* [TUNE snow] grains of the fine white dust */
var NS         = 1400;   /* [TUNE dust] grains of light in the light globe */
var TWINK      = 0.26;   /* [TUNE interior] how much a grain's light wanders */
var SHIM       = 0.0045; /* [TUNE interior] micro-drift of the settled bed */
var RAY_A      = 0.16;   /* [TUNE interior] the shard's seven rays, at full settle */
var SPD_RED    = 1.35, SPD_VIO = 0.70;   /* [TUNE rain] red lands first */
var SWIRL_W    = 2.1;    /* [TUNE spin] rad/s of turning before the pile wakes */
var CAUS_A     = 0.35;   /* [TUNE caustic] */
var AUTO_TURN  = 0.05;   /* [TUNE year] the globe's own turning, rad/s — one lap is one year (~126s) */
var SHELL_A    = 0.26;   /* [TUNE fringe] chromatic limb strength */
var CAM_DIST   = 3.3;    /* [TUNE camera] closest resting distance */
var CAM_FIT    = 1.26;   /* [TUNE camera] half-width the view must hold */
var MASTER_V   = 0.5;    /* [TUNE sound] the room's whole breath */
var BED_LO=-0.94, BED_HI=-0.50;   /* the light's settled strata */
var BY         = 0.90;   /* the ball's centre — it floats; nothing beneath */
/* the ground — a low hill closed entirely inside the glass: its edge circle
   (radius MND_RX at height MND_C) sits within the sphere's radius there */
var MND_C=-0.72, MND_RY=0.26, MND_RX=0.66;
var groundY=MND_C+MND_RY;                 /* the hilltop, where the tree stands */
function domeY(d){ return MND_C + MND_RY*Math.sqrt(Math.max(0, 1-(d/MND_RX)*(d/MND_RX))); }
var WATER_Y=-0.50, WATER_R=0.85;          /* the sea, one doll down */
if(qs.fast) CHARGE_T=1.6;
var START_LVL=Math.max(0,(+qs.level||0))|0;
var SKIN_ONLY=('skin' in qs);    /* fall back to the thin skin everywhere */

/* the spectrum (violet → red) — home again in the light room */
var SPEC = [ [172,120,255],[96,150,255],[90,210,235],[120,230,140],[255,214,90],[255,150,64],[255,84,64] ];

/* the four seasons, as one wheel — spring, summer, autumn, winter.
   everything blends continuously around it; nothing cuts. */
var SEA={
  leaf:  [[0.62,0.84,0.42],[0.36,0.55,0.22],[0.86,0.48,0.16],[0.50,0.47,0.40]],
  blade: [[0.55,0.78,0.36],[0.42,0.66,0.27],[0.72,0.62,0.30],[0.78,0.80,0.84]],
  gnd:   [[1,1,1],[0.93,1,0.88],[0.95,0.80,0.58],[0.80,0.86,0.96]],
  sunC:  [[1,0.95,0.85],[1,0.97,0.90],[1,0.82,0.60],[0.85,0.90,1]],
  sunI:  [1.4,2.1,1.15,0.8],
  hemiS: [[0.74,0.82,0.91],[0.81,0.88,0.95],[0.85,0.78,0.68],[0.62,0.71,0.84]],
  hemiG: [[0.17,0.25,0.12],[0.13,0.19,0.11],[0.29,0.20,0.09],[0.23,0.26,0.32]],
  hemiI: [0.75,0.9,0.6,0.5],
  starY: [0.46,0.66,0.42,0.24],
  cloud: [1,0.85,0.6,0.42],
  drift: [0.9,0,0.85,0],
  dC1:   [[1,0.85,0.90],[1,0.85,0.90],[0.85,0.48,0.17],[0.85,0.48,0.17]],
  dC2:   [[1,1,1],[1,1,1],[0.95,0.72,0.25],[0.95,0.72,0.25]],
  snowF: [0,0,0.08,0.95],
  stormF:[0,0,0,0.22],
  melt:  [0.06,0.12,0.02,0]
};
function seasW(s){ var w=[0,0,0,0],k,d;
  for(k=0;k<4;k++){ d=Math.abs(s-k/4); d=Math.min(d,1-d); w[k]=Math.max(0,1-d*4); }
  return w; }
function mixN(w,v){ return w[0]*v[0]+w[1]*v[1]+w[2]*v[2]+w[3]*v[3]; }
function mixC(w,c,out){ out.setRGB(
  w[0]*c[0][0]+w[1]*c[1][0]+w[2]*c[2][0]+w[3]*c[3][0],
  w[0]*c[0][1]+w[1]*c[1][1]+w[2]*c[2][1]+w[3]*c[3][1],
  w[0]*c[0][2]+w[1]*c[1][2]+w[2]*c[2][2]+w[3]*c[3][2]); return out; }

/* how much leaf the year allows: full through spring and summer, letting
   go through autumn so winter stands bare, and budding slowly back as the
   wheel comes round again */
function leafAmt(s){
  if(s>=0.86) return ez((s-0.86)/0.22);        /* budding, late winter */
  if(s<0.08)  return ez((s+0.14)/0.22);        /* still filling, early spring */
  if(s<0.42)  return 1;                        /* in full leaf */
  if(s<0.66)  return 1-ez((s-0.42)/0.24);      /* the letting go */
  return 0;                                    /* bare */
}

/* the light, speaking. the light is the song. [PLACEHOLDER — your voice pass] */
var NARR = [
  'you are inside me now. i am the light — the same light that carried you here.',
  'out there i looked white. white is not a colour. it is all of us, travelling together.',
  'look down. when the world goes still we come apart — red lands first, violet last. together, we were white.',
  'look up. the flame you left outside is still burning. from in here, everything arrives bent.',
  'shake me — even from in here. watch how fast we forget our places.',
  '\u2026and how surely we find them again.',
  'the song you have been following through these rooms — that is me too. slowed down enough to hear.'
];

/* ----------------------- the stage ----------------------- */
var cvs=document.getElementById('glcv');
var renderer, scene, camera;
try{
  renderer=new T.WebGLRenderer({ canvas:cvs, antialias:true, alpha:false });
}catch(e){ document.documentElement.className+=' nogl'; return; }
renderer.setClearColor(0x000000,1);
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;

scene=new T.Scene();
camera=new T.PerspectiveCamera(42,1,0.01,60);

var inside=false;
var uZoom=1, lvlZoom=1, fitD=CAM_DIST, camYaw=0, camPitch=0.06;
var insideAng=0, insideRad=0.30, lookYaw=0, lookPitch=0.05;
function placeCamera(){
  if(inside){
    var ox=Math.sin(insideAng)*insideRad, oz=Math.cos(insideAng)*insideRad;
    camera.position.set(ox, BY+BED_LO+0.34, oz);
    var e=new T.Euler(lookPitch, insideAng+lookYaw, 0, 'YXZ');
    camera.quaternion.setFromEuler(e);
  } else {
    var d=fitD*uZoom*lvlZoom;
    camera.position.set(Math.sin(camYaw)*d, BY+0.30+camPitch, Math.cos(camYaw)*d);
    camera.lookAt(0, BY-0.05, 0);
  }
}
function size(){
  var w=window.innerWidth, h=window.innerHeight;
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  var halfTan=Math.tan(camera.fov*0.5*Math.PI/180);
  fitD=Math.max(CAM_DIST, CAM_FIT/(halfTan*Math.min(camera.aspect,1)));
}
window.addEventListener('resize', size);

/* the room, as the glass remembers it (env, PMREM — one context, one build) */
var envRT=null;
(function buildEnv(){
  /* real glass is only as good as what it has to reflect. the room is
     still dark, but now it has BONES: a dim horizon, two tall soft
     window-streaks, the warm hearth, a cool high lamp — structure the
     transmission and clearcoat can bend as the globe turns. */
  var c=document.createElement('canvas'); c.width=512; c.height=256;
  var x=c.getContext('2d');
  var vg=x.createLinearGradient(0,0,0,256);
  vg.addColorStop(0,'#0b0e16'); vg.addColorStop(0.55,'#05060b'); vg.addColorStop(1,'#020204');
  x.fillStyle=vg; x.fillRect(0,0,512,256);
  /* the horizon — a faint cold band the limb can catch */
  var hz=x.createLinearGradient(0,150,0,196);
  hz.addColorStop(0,'rgba(120,140,180,0)'); hz.addColorStop(0.5,'rgba(120,140,180,0.13)');
  hz.addColorStop(1,'rgba(120,140,180,0)');
  x.fillStyle=hz; x.fillRect(0,150,512,46);
  /* two tall soft windows — the streaks that travel on turning glass */
  var wj;
  for(wj=0;wj<2;wj++){
    var wx2=wj===0? 86 : 356, ww=wj===0? 26 : 18, wa=wj===0? 0.30 : 0.20;
    var wg=x.createLinearGradient(wx2-ww,0,wx2+ww,0);
    wg.addColorStop(0,'rgba(205,222,255,0)');
    wg.addColorStop(0.5,'rgba(205,222,255,'+wa.toFixed(2)+')');
    wg.addColorStop(1,'rgba(205,222,255,0)');
    x.fillStyle=wg; x.fillRect(wx2-ww,28,ww*2,150);
  }
  var warm=x.createRadialGradient(256,168,2, 256,168,116);
  warm.addColorStop(0,'rgba(255,225,170,0.8)'); warm.addColorStop(0.4,'rgba(235,170,90,0.28)');
  warm.addColorStop(1,'rgba(235,170,90,0)');
  x.fillStyle=warm; x.beginPath(); x.arc(256,168,116,0,TAU); x.fill();
  var cool=x.createRadialGradient(88,52,2, 88,52,88);
  cool.addColorStop(0,'rgba(160,185,235,0.35)'); cool.addColorStop(1,'rgba(160,185,235,0)');
  x.fillStyle=cool; x.beginPath(); x.arc(88,52,88,0,TAU); x.fill();
  var tex=new T.CanvasTexture(c);
  tex.mapping=T.EquirectangularReflectionMapping; tex.colorSpace=T.SRGBColorSpace;
  var pm=new T.PMREMGenerator(renderer);
  envRT=pm.fromEquirectangular(tex);
  scene.environment=envRT.texture;
  tex.dispose(); pm.dispose();
})();

/* the lights — the star drives the sun's direction in the orchard; the
   seasons drive its colour and strength; the light globe turns it off and
   lets the flame carry the room, as it always did. */
var hemi=new T.HemisphereLight(0xbcd0e8, 0x22301c, 0.75);
scene.add(hemi);
var sun=new T.DirectionalLight(0xfff0d2, 1.55);
sun.position.set(1.8, BY+2.3, 1.5);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=0.5; sun.shadow.camera.far=10;
sun.shadow.camera.left=-1.15; sun.shadow.camera.right=1.15;
sun.shadow.camera.top=1.15; sun.shadow.camera.bottom=-1.15;
sun.shadow.bias=-0.0005;
scene.add(sun);
sun.target.position.set(0, BY+groundY, 0);
scene.add(sun.target);
scene.add(new T.AmbientLight(0x23252e, 0.9));
function setLight(sc,si,hs,hg,hi){
  sun.color.setHex(sc); sun.intensity=si;
  hemi.color.setHex(hs); hemi.groundColor.setHex(hg); hemi.intensity=hi;
}

/* ----------------------- the fire, indoors — the light globe's own sun ----------------------- */
var flameCv=document.createElement('canvas'); flameCv.width=256; flameCv.height=384;
var flameTex=new T.CanvasTexture(flameCv); flameTex.colorSpace=T.SRGBColorSpace;
var flamePaint=(function(){
  var fctx=flameCv.getContext('2d');
  var FL={cx:0.5,baseY:0.80,height:0.62,width:0.085,belly:0.28,tipw:0.27,layers:7,core:0.05}, DIM=0.86, wellF=0;
  function state(now){

var _m=new T.Matrix4(), _q=new T.Quaternion(), _q2=new T.Quaternion(), _e=new T.Euler(), _s=new T.Vector3(), _c=new T.Color();

function randIn(r){

/* a smooth tapered tube laid along a curve, appended into shared arrays —
   trunk, branch and root are all this one gesture, so nothing has a joint */
function tubeInto(A, curve, r0, r1, SEGS, RS){
  var nrm=new T.Vector3(1,0,0), tn=new T.Vector3(), nn=new T.Vector3(), bn=new T.Vector3();
  curve.getTangent(0,tn);
  if(Math.abs(tn.x)>0.9) nrm.set(0,0,1);
  var L=curve.getLength(), row0=A.pos.length/3, i, j;
  for(i=0;i<=SEGS;i++){
    var t=i/SEGS, p=curve.getPoint(t);
    curve.getTangent(t,tn);
    nn.copy(nrm).addScaledVector(tn, -nrm.dot(tn));
    if(nn.lengthSq()<1e-8) nn.set(tn.y,tn.z,tn.x);
    nn.normalize(); nrm.copy(nn);
    bn.crossVectors(tn,nn);
    var rr=lerp(r0, r1, Math.pow(t,0.85));
    for(j=0;j<=RS;j++){
      var a=j/RS*TAU, ca=Math.cos(a), sa=Math.sin(a);
      var nx=nn.x*ca+bn.x*sa, ny=nn.y*ca+bn.y*sa, nz=nn.z*ca+bn.z*sa;
      A.pos.push(p.x+nx*rr, p.y+ny*rr, p.z+nz*rr);
      A.nor.push(nx,ny,nz);
      A.uv.push(j/RS, t*L*9);
    }
  }
  for(i=0;i<SEGS;i++) for(j=0;j<RS;j++){
    var a2=row0+i*(RS+1)+j, b2=a2+RS+1;
    A.idx.push(a2,b2,a2+1, a2+1,b2,b2+1);
  }
}
function tubesMesh(A, mat){
  var g=new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(A.pos,3));
  g.setAttribute('normal', new T.Float32BufferAttribute(A.nor,3));
  g.setAttribute('uv', new T.Float32BufferAttribute(A.uv,2));
  g.setIndex(A.idx);
  return new T.Mesh(g, mat);
}

/* the tree — grown as one continuous body now: every limb a smooth tapered
   tube along its own slightly wandering curve, every child born on its
   parent's centreline, so the wood flows and nothing has a joint */
function makeTree(o){
  var barkMat=new T.MeshStandardMaterial({ map:texBark(), roughness:0.9, metalness:0 });
  lvl.barkMat=barkMat;
  var tree=new T.Group(); tree.position.y=groundY+0.02;
  world.add(tree);
  var tips=[];
  var A={pos:[],nor:[],uv:[],idx:[]};
  function grow(p0, dir, len, rad, depth){
    var pts=[p0.clone()], d=dir.clone().normalize(), cur=p0.clone(), K=4, k;
    for(k=1;k<=K;k++){
      d.x+=(Math.random()-0.5)*0.30; d.z+=(Math.random()-0.5)*0.30;
      if(depth<o.depth) d.y-=0.06*k/K;          /* the outer limbs remember gravity */
      else d.y+=0.10;                           /* the trunk remembers the sun */
      d.normalize();
      cur=cur.clone().addScaledVector(d, len/K);
      pts.push(cur.clone());
    }
    var curve=new T.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
    var rTip=(depth<=0)? Math.max(0.0022, rad*0.16) : rad*0.58;
    tubeInto(A, curve, rad, rTip, 12, 9);
    if(depth<=0){ tips.push(cur.clone()); return; }
    var n=(depth>=o.depth)?3:(2+((Math.random()*1.6)|0)), i2;
    for(i2=0;i2<n;i2++){
      var tt=0.45+Math.random()*0.50;
      var ap=curve.getPoint(tt);
      var tg=curve.getTangent(tt);
      var ax=new T.Vector3(Math.random()*2-1, (Math.random()-0.5)*0.4, Math.random()*2-1).normalize();
      var nd=tg.clone().applyAxisAngle(ax, 0.55+Math.random()*0.50);
      if(nd.y<0.02) nd.y=0.02+Math.random()*0.25;
      grow(ap, nd, len*(0.60+Math.random()*0.16),
           lerp(rad,rTip,Math.pow(tt,0.85))*0.72, depth-1);
    }
  }
  grow(new T.Vector3(0,0,0),
       new T.Vector3((Math.random()-0.5)*0.16, 1, (Math.random()-0.5)*0.16),
       0.34*o.h, 0.05*o.h, o.depth);
  var wood=tubesMesh(A, barkMat);
  wood.castShadow=true; wood.receiveShadow=true;
  tree.add(wood);
  tree.updateWorldMatrix(true,true);
  world.updateWorldMatrix(true,false);
  var P=[], i, v, ctr=new T.Vector3();
  for(i=0;i<tips.length;i++){
    v=tips[i].clone();
    tree.localToWorld(v);
    world.worldToLocal(v);
    P.push(v); ctr.add(v);
  }
  if(P.length) ctr.multiplyScalar(1/P.length);

  if(o.leafN>0){
    var leafTex=texLeaf();
    var lm=new T.MeshStandardMaterial({ map:leafTex, alphaTest:0.3, transparent:true,
      side:T.DoubleSide, roughness:0.85, metalness:0 });
    lvl.leafMat=lm;
    var inst=new T.InstancedMesh(new T.PlaneGeometry(0.055,0.055), lm, o.leafN);
    inst.castShadow=true;
    inst.instanceMatrix.setUsage(T.DynamicDrawUsage);
    inst.customDepthMaterial=new T.MeshDepthMaterial({ depthPacking:T.RGBADepthPacking,
      map:leafTex, alphaTest:0.3 });
    var lp=new Float32Array(o.leafN*3), lq=new Float32Array(o.leafN*4),
        ls=new Float32Array(o.leafN), lsd=new Float32Array(o.leafN),
        lmd=new Uint8Array(o.leafN), lcy=new Float32Array(o.leafN),
        ltm=new Float32Array(o.leafN),
        lox=new Float32Array(o.leafN), loz=new Float32Array(o.leafN);
    for(i=0;i<o.leafN;i++){
      var p;
      if(P.length && Math.random()<0.72){
        p=P[(Math.random()*P.length)|0].clone().add(randIn(0.045+Math.random()*0.085));
      } else {
        p=ctr.clone().add(randIn(0.16*o.h+Math.random()*0.10));
      }
      _e.set(Math.random()*TAU, Math.random()*TAU, Math.random()*TAU);
      _q.setFromEuler(_e);
      _s.setScalar(0.7+Math.random()*0.7);
      _m.compose(p,_q,_s);
      inst.setMatrixAt(i,_m);
      lp[i*3]=p.x; lp[i*3+1]=p.y; lp[i*3+2]=p.z;
      lq[i*4]=_q.x; lq[i*4+1]=_q.y; lq[i*4+2]=_q.z; lq[i*4+3]=_q.w;
      ls[i]=_s.x; lsd[i]=Math.random();
      var g2=0.75+Math.random()*0.3;
      _c.setRGB(g2,g2,g2);
      inst.setColorAt(i,_c);
    }
    inst.instanceMatrix.needsUpdate=true;
    if(inst.instanceColor) inst.instanceColor.needsUpdate=true;
    world.add(inst);
    lvl.leafMesh=inst;
    lvl.leafAnim={ p:lp, q:lq, s:ls, sd:lsd, md:lmd, cy:lcy, tm:ltm,
                   ox:lox, oz:loz, n:o.leafN };

  /* the crown — the raven will want the highest word */

  for(i=0;i<P.length;i++) if(!top || P[i].y>top.y) top=P[i];
  if(top) lvl.treeTop=top.clone();

      clearcoat:0.5, clearcoatRoughness:0.25, envMapIntensity:1.3 });
    var eg=new T.SphereGeometry(0.02,14,12);
    eg.scale(1,1.32,1);
    var en=o.eggs+2;
    var ei=new T.InstancedMesh(eg, em, en);
    ei.castShadow=true;
    _q.identity();
    var ehome=[], escl=[], placed=[], order=[], oi;
    for(oi=0;oi<P.length;oi++) order.push(oi);
    for(oi=order.length-1;oi>0;oi--){ var sw=(Math.random()*(oi+1))|0;
      var tmp2=order[oi]; order[oi]=order[sw]; order[sw]=tmp2; }
    var placedN=0, tryI=0;
    while(placedN<o.eggs && tryI<P.length*3){
      var p2=P[order[tryI%order.length]].clone();
      tryI++;
      p2.y-=0.035+Math.random()*0.02; p2.add(randIn(0.022));
      var ok=true, pk;
      for(pk=0;pk<placed.length;pk++)
        if(placed[pk].distanceToSquared(p2)<0.0036){ ok=false; break; }
      if(!ok) continue;                          /* the eggs keep their distance */
      var s2=0.68+Math.random()*0.26;
      _s.setScalar(s2);

    for(i=placedN;i<o.eggs;i++){ _s.setScalar(0.0001);   /* the tree kept some back */
      _m.compose(_tv.set(0,-9,0),_q,_s); ei.setMatrixAt(i,_m);
      ehome.push(new T.Vector3(0,-9,0)); escl.push(0.0001); }
    for(i=o.eggs;i<en;i++){          /* two fallen in the grass, unbroken */
      var aa=Math.random()*TAU, rr=0.12+Math.random()*0.14;

  }
}

/* under the earth — the mound wears an honest underside now, and the tree

  var soilM=new T.MeshStandardMaterial({ map:texSoil(), roughness:0.98, metalness:0 });
  var RXu=MND_RX+0.004, RYu=MND_RY+0.012;
  var under=new T.Mesh(new T.SphereGeometry(1,48,20, 0,TAU, Math.PI/2, Math.PI/2), soilM);
  under.scale.set(RXu, RYu, RXu);
  under.position.y=MND_C;
  world.add(under);

  /* the roots — fine as handwriting now: nine mains, each letting go
     rootlets, each rootlet a hair or two of its own, reaching nearly to
     the floor of the glass base. they move the way weed does — every
     vertex remembers where it grew and sways about that memory */
  var g=new T.Group(); g.position.y=MND_C; world.add(g);
  function soilY(r){ return -RYu*Math.sqrt(Math.max(0, 1-(r/RXu)*(r/RXu))); }
  var A={pos:[],nor:[],uv:[],idx:[]}, ranges=[], tips=[], i, k;
  var FLOOR=-0.475;                             /* how deep the roots dare into the open dark */
  function lay(pts, r0, r1, SEGS, RS){
    var v0=A.pos.length/3;
    tubeInto(A, new T.CatmullRomCurve3(pts,false,'catmullrom',0.5), r0, r1, SEGS, RS);
    ranges.push({ v0:v0, v1:A.pos.length/3, ph:Math.random()*TAU,
                  sp:0.35+Math.random()*0.35 });
    var tp=pts[pts.length-1];
    tips.push(tp.x, tp.y, tp.z);
  }
  function wander(p0, d, len, K, downBias){
    var pts=[p0.clone()], cur=p0.clone(), dd=d.clone().normalize(), kk;
    for(kk=1;kk<=K;kk++){
      dd.x+=(Math.random()-0.5)*0.55; dd.z+=(Math.random()-0.5)*0.55; dd.y-=downBias;
      dd.normalize();
      cur=cur.clone().addScaledVector(dd, len/K);
      if(cur.y<FLOOR) cur.y=FLOOR+Math.random()*0.01;
      pts.push(cur.clone());
    }
    return pts;
  }
  /* one taproot beneath the trunk — the whole network is born from it:
     branches from the main, threads from the branches, hairs from the
     threads, each finer than the last, all of it barely more than lines */
  var p0=new T.Vector3((Math.random()-0.5)*0.02, soilY(0.02)+0.03, (Math.random()-0.5)*0.02);
  var mainPts=wander(p0,
    new T.Vector3((Math.random()-0.5)*0.3, -1.35, (Math.random()-0.5)*0.3),
    0.40+Math.random()*0.05, 7, 0.40);
  lay(mainPts, 0.0034, 0.0007, 14, 6);
  var mc=new T.CatmullRomCurve3(mainPts,false,'catmullrom',0.5), b;
  for(b=0;b<7;b++){
    var tm=0.10+(b/7)*0.72+Math.random()*0.07;
    var bp=mc.getPoint(tm);
    var bd=mc.getTangent(tm).applyAxisAngle(_sv.set(0,1,0),
            (b%2?1:-1)*(0.9+Math.random()*0.8));
    bd.y=-Math.abs(bd.y)-0.45;
    var brPts=wander(bp, bd, 0.15+Math.random()*0.11, 5, 0.28);
    lay(brPts, 0.0015, 0.0004, 9, 5);
    var bc=new T.CatmullRomCurve3(brPts,false,'catmullrom',0.5), sb2;
    var nsub=1+((Math.random()*2)|0);
    for(sb2=0;sb2<nsub;sb2++){
      var sm2=0.25+Math.random()*0.55, sp2=bc.getPoint(sm2);
      var sd2=bc.getTangent(sm2).applyAxisAngle(_sv.set(0,1,0),
              (Math.random()<0.5?1:-1)*(0.9+Math.random()*0.8));
      sd2.y=-Math.abs(sd2.y)-0.4;
      var subPts=wander(sp2, sd2, 0.07+Math.random()*0.05, 4, 0.26);
      lay(subPts, 0.0008, 0.00028, 7, 4);
      if(Math.random()<0.7){
        var sc2=new T.CatmullRomCurve3(subPts,false,'catmullrom',0.5);
        var hm2=0.3+Math.random()*0.5, hp2=sc2.getPoint(hm2);
        var hd2=sc2.getTangent(hm2).applyAxisAngle(_sv.set(0,1,0),
                (Math.random()<0.5?1:-1)*(1.0+Math.random()*0.7));
        hd2.y=-Math.abs(hd2.y)-0.35;
        lay(wander(hp2, hd2, 0.045+Math.random()*0.03, 3, 0.22), 0.00045, 0.0002, 5, 4);
      }
    }
  }
  /* the mycelium answers the pulsar — a faint light living in the threads */
  var rootM=new T.MeshStandardMaterial({ color:0x2e2a28, roughness:0.9, metalness:0,
    emissive:new T.Color(0x7fb4d4), emissiveIntensity:0.4 });
  var roots=tubesMesh(A, rootM);
  roots.geometry.attributes.position.setUsage(T.DynamicDrawUsage);
  g.add(roots);
  var tgeo=new T.BufferGeometry();
  tgeo.setAttribute('position', new T.Float32BufferAttribute(tips,3));
  var tipM=new T.PointsMaterial({ color:0xcfeaff, size:0.018, sizeAttenuation:true,
    transparent:true, opacity:0.5, blending:T.AdditiveBlending, depthWrite:false,
    map:texGlow() });
  var motes=new T.Points(tgeo, tipM);
  g.add(motes);
  var cool=new T.PointLight(0x7fb0d8, 0.5, 0.95, 2);   /* the earth keeps a little starlight */
  cool.position.set(0,-0.34,0); g.add(cool);
  lvl.roots=g;
  lvl.rootMat=rootM; lvl.rootTips=tipM;
  lvl.rootSway={ geo:roots.geometry,
                 base:new Float32Array(roots.geometry.attributes.position.array),
                 ranges:ranges };
}

/* the opening sun — a pool of warm light lying on the grass, laid to the
   surface of the hill so it holds the tree's real shadow; it fades as the
   year turns away from summer, and comes back when the year does */
function makeSunPatch(){
  var c=document.createElement('canvas'); c.width=128; c.height=128;
  var x=c.getContext('2d');
  var g=x.createRadialGradient(64,64,4, 64,64,62);
  g.addColorStop(0,'rgba(255,236,168,0.85)');
  g.addColorStop(0.5,'rgba(255,220,140,0.30)');
  g.addColorStop(1,'rgba(255,220,140,0)');
  x.fillStyle=g; x.beginPath(); x.arc(64,64,62,0,TAU); x.fill();
  var t=new T.CanvasTexture(c); t.colorSpace=T.SRGBColorSpace;
  var RG=9, SG=36, R=0.34, cx=0.15, cz=0.10;
  var pos=[], uv=[], idx=[], ring, seg;
  for(ring=0;ring<=RG;ring++){
    var rr=ring/RG*R;
    for(seg=0;seg<SG;seg++){
      var aa=seg/SG*TAU, xx=cx+Math.cos(aa)*rr, zz=cz+Math.sin(aa)*rr;
      var dd=Math.sqrt(xx*xx+zz*zz);
      pos.push(xx, domeY(Math.min(dd,MND_RX))+0.006, zz);
      uv.push(0.5+Math.cos(aa)*rr/R*0.5, 0.5+Math.sin(aa)*rr/R*0.5);
    }
  }
  for(ring=0;ring<RG;ring++) for(seg=0;seg<SG;seg++){
    var a0=ring*SG+seg, b0=ring*SG+(seg+1)%SG;
    var c0=(ring+1)*SG+seg, d0=(ring+1)*SG+(seg+1)%SG;
    idx.push(a0,c0,b0, b0,c0,d0);
  }
  var geo=new T.BufferGeometry();
  geo.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  var m=new T.MeshBasicMaterial({ map:t, transparent:true, opacity:0,
    blending:T.AdditiveBlending, depthWrite:false });
  var patch=new T.Mesh(geo, m);
  patch.renderOrder=3;
  world.add(patch);
  lvl.sunPatch=m;
  lvl.sunAim=new T.Vector3(cx, domeY(Math.sqrt(cx*cx+cz*cz))+0.006, cz);
}

/* the raven — thin, black, patient at the crown. mostly it is still;
   once in a while it remembers its wings */
function makeRaven(){
  if(!lvl.treeTop) return;
  var rm=new T.MeshStandardMaterial({ color:0x0e0e12, roughness:0.5, metalness:0.15 });
  var g=new T.Group();
  var body=new T.Mesh(new T.SphereGeometry(1,10,8), rm);
  body.scale.set(0.020,0.0085,0.0085); body.castShadow=true;
  g.add(body);
  var head=new T.Mesh(new T.SphereGeometry(0.0068,9,7), rm);
  head.position.set(0.019,0.0075,0); head.castShadow=true;
  g.add(head);
  var beak=new T.Mesh(new T.ConeGeometry(0.0022,0.008,6), rm);
  beak.rotation.z=-Math.PI/2; beak.position.set(0.028,0.0068,0);
  g.add(beak);
  var tail=new T.Mesh(new T.BoxGeometry(0.017,0.0016,0.006), rm);
  tail.position.set(-0.021,0.003,0); tail.rotation.z=0.28;
  g.add(tail);
  function wing(side){
    var wg=new T.PlaneGeometry(0.026,0.011);
    wg.translate(0.013,0,0);                    /* hinge at the shoulder */
    var w=new T.Mesh(wg, new T.MeshStandardMaterial({ color:0x0e0e12,
      roughness:0.5, metalness:0.15, side:T.DoubleSide }));
    w.rotation.x=Math.PI/2;                     /* lie flat, a folded fan */
    var pv=new T.Group(); pv.add(w);
    pv.position.set(0.002, 0.004, side*0.006);
    pv.rotation.y=side*1.35;                    /* out to the side, swept a little back */
    pv.rotation.z=-0.10;
    g.add(pv);
    return pv;
  }
  var wl=wing(1), wr=wing(-1);
  g.position.copy(lvl.treeTop); g.position.y+=0.010;
  g.rotation.y=Math.random()*TAU;
  world.add(g);
  lvl.raven={ g:g, wl:wl, wr:wr, next:4+Math.random()*6, t0:-1, beats:2, y0:g.position.y };
}

/* the rainbow — a CLOUD of glow now: soft spectral motes banded along an
   arc, additive, shimmering. no lines anywhere. */
function makeRainbowCloud(xx,zz,s){
  var CN=150, cp=new Float32Array(CN*3), cc=new Float32Array(CN*3),
      cs=new Float32Array(CN), cd=new Float32Array(CN), i;
  for(i=0;i<CN;i++){
    var k=i%7, c=SPEC[k];
    var th=lerp(0.10,0.90,Math.random())*Math.PI;
    var r=0.34+k*0.014+(Math.random()*2-1)*0.02;
    var off=randIn(0.035);
    cp[i*3]=Math.cos(th)*r+off.x; cp[i*3+1]=Math.sin(th)*r+off.y; cp[i*3+2]=off.z*1.8;
    cc[i*3]=c[0]/255; cc[i*3+1]=c[1]/255; cc[i*3+2]=c[2]/255;
    cs[i]=5+Math.random()*9; cd[i]=Math.random()*100;
  }
  var cg=new T.BufferGeometry();
  cg.setAttribute('position', new T.BufferAttribute(cp,3));
  cg.setAttribute('aColor', new T.BufferAttribute(cc,3));
  cg.setAttribute('aSize', new T.BufferAttribute(cs,1));
  cg.setAttribute('aSeed', new T.BufferAttribute(cd,1));
  var cm=new T.ShaderMaterial({
    transparent:true, blending:T.AdditiveBlending, depthWrite:false,
    uniforms:{ uPx:{value:1}, uOp:{value:1}, uT:{value:0} },
    vertexShader:
      'attribute float aSize; attribute float aSeed; attribute vec3 aColor;\n'+
      'uniform float uT; uniform float uPx;\n'+
      'varying vec3 vC; varying float vA;\n'+
      'void main(){ vC=aColor;\n'+
      '  vA=0.72+0.28*sin(uT*(0.8+fract(aSeed)*1.4)+aSeed);\n'+
      '  vec3 p=position + vec3(sin(uT*0.7+aSeed), sin(uT*0.9+aSeed*1.7), sin(uT*0.8+aSeed*2.3))*0.008;\n'+
      '  vec4 mv=modelViewMatrix*vec4(p,1.0);\n'+
      '  gl_PointSize=min(46.0*uPx, aSize*uPx*(3.1/max(0.05,-mv.z)));\n'+
      '  gl_Position=projectionMatrix*mv; }',
    fragmentShader:
      'varying vec3 vC; varying float vA; uniform float uOp;\n'+
      'void main(){ vec2 q=gl_PointCoord-0.5; float d=length(q)*2.0;\n'+
      '  float body=exp(-d*d*2.6);\n'+
      '  float a=body*0.16*uOp*vA;\n'+
      '  gl_FragColor=vec4(vC*a, a); }'
  });
  var cloud=new T.Points(cg, cm);
  cloud.frustumCulled=false;
  cloud.renderOrder=10;
  var g=new T.Group();
  g.add(cloud);
  g.position.set(xx, groundY+0.02, zz);
  g.rotation.y=0.5;
  g.scale.setScalar(s);
  world.add(g);
  lvl.cloudMat=cm;
}

/* the little star — a small sun inside the glass. it rides the year (one
   lap per revolution), high in summer, low in winter; the real shadow light
   takes its direction from it every frame. */
/* the pulsar's tendrils — thin icy filaments drawn once, worn as a sprite */
function texPulsar(){
  var c=document.createElement('canvas'); c.width=256; c.height=256;
  var x=c.getContext('2d'), i, k;
  x.translate(128,128);
  for(i=0;i<11;i++){
    var aa=i/11*TAU+(Math.random()-0.5)*0.3;
    var ln=58+Math.random()*58, bend=(Math.random()-0.5)*0.55;
    x.save(); x.rotate(aa);
    var grad=x.createLinearGradient(0,0,ln,0);
    grad.addColorStop(0,'rgba(255,255,255,0.9)');
    grad.addColorStop(0.25,'rgba(214,238,255,0.55)');
    grad.addColorStop(1,'rgba(190,228,255,0)');
    x.strokeStyle=grad; x.lineWidth=1.6+Math.random()*1.2; x.lineCap='round';
    x.beginPath(); x.moveTo(4,0);
    for(k=1;k<=6;k++){
      var tt=k/6;
      x.lineTo(tt*ln, Math.sin(tt*Math.PI)*bend*22*tt);
    }
    x.stroke(); x.restore();
  }
  var t=new T.CanvasTexture(c); t.colorSpace=T.SRGBColorSpace;
  return t;
}
function makeStar(){
  /* not a lamp any more — a pulsar: a white-hot point in a web of icy
     tendrils, keeping its own slow beat. its light on the world stays
     yellow; only the star itself burns cold */
  var g=new T.Group();
  var tnd=new T.SpriteMaterial({ map:texPulsar(), transparent:true, opacity:0.55,
    blending:T.AdditiveBlending, depthWrite:false, color:0xbfe4ff });
  var tendrils=new T.Sprite(tnd); tendrils.scale.set(0.42,0.42,1);
  var glow=new T.Sprite(new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.5,
    blending:T.AdditiveBlending, depthWrite:false, color:0xa8d4f8 }));
  glow.scale.set(0.20,0.20,1);
  var hot=new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.95,
    blending:T.AdditiveBlending, depthWrite:false, color:0xffffff });
  var core=new T.Sprite(hot); core.scale.set(0.065,0.065,1);
  var pl=new T.PointLight(0xffe9b0, 0.55, 2.4, 2);
  g.add(tendrils); g.add(glow); g.add(core); g.add(pl);
  /* the shaft — one focused reach of yellow from the pulsar down through
     the tree's shoulder to the pool on the grass */
  var SLEN=1.15;
  function sgeo(r){ var bg=new T.ConeGeometry(r, SLEN, 26, 1, true);
    bg.translate(0,-SLEN/2,0); bg.rotateX(-Math.PI/2); return bg; }
  var sIn=makeBeamMat(0xffe7a8,false,SLEN);
  var shIn=new T.Mesh(sgeo(0.082), sIn);
  shIn.frustumCulled=false;
  shIn.renderOrder=6;
  var shaft=new T.Group(); shaft.add(shIn);
  g.add(shaft);
  g.position.set(0.52, 0.55, 0.0);
  world.add(g);
  lvl.star=g; lvl.starGlow=glow.material; lvl.starLight=pl;
  lvl.pulsar={ hot:hot, tnd:tnd, spr:tendrils };
  lvl.sunBeam=shaft; lvl.sunBeamIn=sIn;
}

/* petals in spring, leaves in autumn — a small drifting fall */
var DN=64;
function makeDrift(){
  var dpx=new Float32Array(DN*3), dsz=new Float32Array(DN), dsd=new Float32Array(DN);
  var dsp=new Float32Array(DN), dph=new Float32Array(DN), i;
  function respawn(i3){
    var aa=Math.random()*TAU, rr=Math.sqrt(Math.random())*0.26;
    dpx[i3]=Math.cos(aa)*rr;
    dpx[i3+1]=groundY+0.32+Math.random()*0.30;
    dpx[i3+2]=Math.sin(aa)*rr;
  }
  for(i=0;i<DN;i++){ respawn(i*3);
    dpx[i*3+1]=groundY+0.05+Math.random()*0.55;     /* first fall already underway */
    dsz[i]=2.0+Math.random()*2.0; dsd[i]=Math.random()*100;
    dsp[i]=Math.random(); dph[i]=Math.random()*TAU;
  }
  var dg=new T.BufferGeometry();
  dg.setAttribute('position', new T.BufferAttribute(dpx,3).setUsage(T.DynamicDrawUsage));
  dg.setAttribute('aSize', new T.BufferAttribute(dsz,1));
  dg.setAttribute('aSeed', new T.BufferAttribute(dsd,1));
  var dm=new T.ShaderMaterial({
    transparent:true, blending:T.NormalBlending, depthWrite:false,
    uniforms:{ uPx:{value:1}, uOp:{value:0}, uT:{value:0}, uLeaf:{value:0},
      uC1:{value:new T.Color(1,0.85,0.9)}, uC2:{value:new T.Color(1,1,1)} },
    vertexShader:
      'attribute float aSize; attribute float aSeed;\n'+
      'uniform float uT; uniform float uPx; uniform float uLeaf;\n'+
      'varying float vA; varying float vS; varying float vR;\n'+
      'void main(){ vS=fract(aSeed*0.113);\n'+
      '  vA=0.75+0.25*sin(uT*(1.2+fract(aSeed)*1.8)+aSeed);\n'+
      '  vR=aSeed*3.7+uT*(0.6+fract(aSeed*0.71)*1.5);\n'+   /* each leaf tumbles on its own clock */
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);\n'+
      '  gl_PointSize=min(16.0*uPx, aSize*uPx*(3.8/max(0.05,-mv.z))*(1.0+uLeaf*0.5));\n'+
      '  gl_Position=projectionMatrix*mv; }',
    fragmentShader:
      'uniform float uOp; uniform float uLeaf; uniform vec3 uC1; uniform vec3 uC2;\n'+
      'varying float vA; varying float vS; varying float vR;\n'+
      'void main(){ vec2 q=gl_PointCoord-0.5;\n'+
      '  float cs=cos(vR), sn=sin(vR);\n'+
      '  q=vec2(q.x*cs-q.y*sn, q.x*sn+q.y*cs);\n'+
      '  q.y*=1.0+uLeaf*1.6;\n'+                            /* petals round, leaves long */
      '  float d=length(q)*2.0;\n'+
      '  float body=exp(-d*d*5.0);\n'+
      '  float a=body*uOp*vA*0.85;\n'+
      '  gl_FragColor=vec4(mix(uC1,uC2,vS)*a, a); }'
  });
  var pts=new T.Points(dg, dm);
  pts.frustumCulled=false;
  pts.renderOrder=10;
  world.add(pts);
  lvl.driftGeo=dg; lvl.driftMat=dm;
  lvl.driftSim={ p:dpx, sp:dsp, ph:dph, respawn:respawn };
}

/* the light globe, miniature — under the tree, its spectrum already lying
   in bands, its shard already catching. the same globe you are about to
   fall into; the same function it has always performed. */
function makeMiniLight(){
  var g=new T.Group();
  var s=new T.Mesh(new T.SphereGeometry(0.095,32,24),
    new T.MeshPhysicalMaterial({ color:0xdde6f2, transparent:true, opacity:0.16,
      roughness:0.06, metalness:0, clearcoat:1.0, clearcoatRoughness:0.08,
      envMapIntensity:1.2, depthWrite:false }));
  s.renderOrder=6;
  var mshard=new T.Mesh(new T.OctahedronGeometry(0.016),
    new T.MeshPhysicalMaterial({ color:0x131a26, metalness:0, roughness:0.12, flatShading:true,
      envMapIntensity:2.4, clearcoat:1.0, clearcoatRoughness:0.05,
      iridescence:1.0, iridescenceIOR:1.32, iridescenceThicknessRange:[120,480],
      transparent:true, opacity:0.92 }));
  mshard.position.y=0.008;
  var MN=110, mpx=new Float32Array(MN*3), mcl=new Float32Array(MN*3), mi;
  for(mi=0;mi<MN;mi++){
    var t=mi/(MN-1), k=Math.min(6,Math.floor(t*7)), c=SPEC[k];
    var yy=lerp(-0.082,-0.046, clamp(t+(Math.random()*2-1)*0.06,0,1));
    var rr=Math.sqrt(Math.max(0,0.095*0.095-yy*yy))*0.88;
    var aa=Math.random()*TAU, r2=Math.sqrt(Math.random())*rr;
    mpx[mi*3]=Math.cos(aa)*r2; mpx[mi*3+1]=yy; mpx[mi*3+2]=Math.sin(aa)*r2;
    mcl[mi*3]=c[0]/255; mcl[mi*3+1]=c[1]/255; mcl[mi*3+2]=c[2]/255;
  }
  var mg=new T.BufferGeometry();
  mg.setAttribute('position', new T.BufferAttribute(mpx,3));
  mg.setAttribute('color', new T.BufferAttribute(mcl,3));
  var mdust=new T.Points(mg, new T.PointsMaterial({ size:0.006, sizeAttenuation:true,
    vertexColors:true, transparent:true, opacity:0.9,
    blending:T.AdditiveBlending, depthWrite:false }));
  mdust.renderOrder=10;
  var base=new T.Mesh(new T.CylinderGeometry(0.072,0.082,0.03,24),
    new T.MeshPhysicalMaterial({ color:0xe7edf6, transparent:true, opacity:0.16,
      roughness:0.06, metalness:0, envMapIntensity:1.2,
      clearcoat:1.0, clearcoatRoughness:0.08, depthWrite:false }));
  base.position.y=-0.102; base.renderOrder=6;
  var glow=new T.Sprite(new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.35,
    blending:T.AdditiveBlending, depthWrite:false }));
  glow.scale.set(0.11,0.11,1);
  g.add(s); g.add(mshard); g.add(mdust); g.add(base); g.add(glow);
  g.position.set(0.30, domeY(0.375)+0.115, 0.225);
  world.add(g);
  lvl.mini=g; lvl.miniGlow=glow.material;
}

/* ----------------------- the sea, one doll down -----------------------
   a night ocean inside the glass: live water (waves in the vertex shader;
   a moon-path streak and the lighthouse beam's warm wedge in the fragment —
   opaque, so the transmission glass carries it whole), a rock, a lighthouse
   whose beam makes its own rounds, and the moon hanging where the orchard
   hangs its star — the same shadow machinery, swung by the same drag.
   the light globe waits on the rock. the sea keeps no snow. */
function makeSea(){
  /* a proper grid of a disc — the old centre-fan starved the vertex waves;
     and the shading height is recomputed per-fragment from the same six
     trains, so nothing is interpolated into dots. the ridge glints are
     three independent line families now — additive sines THRESHOLDED
     SEPARATELY; sines multiplied or summed before the threshold made the
     polka-dot lattice, twice removed and not missed */

      '        +0.006*sin(dot(q,vec2(12.0,-9.0))+t*2.3)\n'+
      '        +0.004*sin(dot(q,vec2(-16.0,5.0))+t*2.9)\n'+
      '        +0.0035*sin(dot(q,vec2(21.0,17.0))-t*3.6)\n'+
      '        +0.005*sin(length(q)*10.0-t*1.1); }\n';
  var wm=new T.ShaderMaterial({
    uniforms:{ uT:{value:0}, uBeamA:{value:0}, uMoonA:{value:Math.atan2(-0.45,-0.35)} },
    vertexShader:
      'uniform float uT; varying vec2 vQ;\n'+WV+
      'void main(){ vec3 p=position;\n'+
      '  p.y+=wv(p.xz, uT); vQ=position.xz;\n'+
      '  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0); }',
    fragmentShader:
      'uniform float uT; uniform float uBeamA; uniform float uMoonA;\n'+
      'varying vec2 vQ;\n'+WV+
      'void main(){\n'+

      '  float e=0.014;\n'+
      '  float gx=(wv(vQ+vec2(e,0.0),uT)-h)/e;\n'+
      '  float gz=(wv(vQ+vec2(0.0,e),uT)-h)/e;\n'+

      '  float hN=clamp(h*15.0+0.5, 0.0, 1.0);\n'+

/* the tower's skin, ported from the cave at 1:65 — the same weathering
   sines, the same four wounds bitten into its flanks, ragged at the rim */
function makeTowerGeo(rBot,rTop,H){
  var segments=48, levels=16;
  var pos=[], uv=[], idx=[], index=0;
  var wounds=[
    { a:1.85, t:0.30, wa:0.34, wt:0.085, d:0.062 },
    { a:3.55, t:0.62, wa:0.28, wt:0.070, d:0.082 },
    { a:5.05, t:0.14, wa:0.42, wt:0.11,  d:0.048 },
    { a:2.60, t:0.86, wa:0.24, wt:0.055, d:0.056 }
  ];
  function wrapPi(a){ while(a>Math.PI)a-=TAU; while(a<-Math.PI)a+=TAU; return a; }
  function radiusAt(t,a){
    var base=lerp(rBot,rTop,t), w=1, k;
    w+=0.012*Math.sin(a*7+t*19);
    w+=0.007*Math.sin(a*17-t*37);
    w+=0.0045*Math.sin(a*43+t*61);
    w+=0.006*Math.sin(a*3+t*23+0.8);
    w+=0.0035*Math.sin(a*29-t*91+2.1);
    w+=0.0045*Math.sin(t*74+Math.sin(a*2.0)*1.8);
    for(k=0;k<wounds.length;k++){
      var wd=wounds[k];
      var da=wrapPi(a-wd.a)/wd.wa, dt2=(t-wd.t)/wd.wt;
      var bite=Math.exp(-(da*da+dt2*dt2));
      if(bite>0.004){ bite*=0.72+0.28*Math.sin(a*61+t*173+k*9); w-=wd.d*bite; }
    }
    return base*w;
  }
  var lv,seg;
  for(lv=0;lv<levels;lv++){
    var t0=lv/levels, t1=(lv+1)/levels;
    var y0=t0*H, y1=t1*H;
    for(seg=0;seg<segments;seg++){
      var a0=seg/segments*TAU, a1=(seg+1)/segments*TAU;
      var r00=radiusAt(t0,a0), r01=radiusAt(t0,a1);
      var r10=radiusAt(t1,a0), r11=radiusAt(t1,a1);
      pos.push(Math.sin(a0)*r00,y0,Math.cos(a0)*r00,
               Math.sin(a1)*r01,y0,Math.cos(a1)*r01,
               Math.sin(a0)*r10,y1,Math.cos(a0)*r10,
               Math.sin(a1)*r11,y1,Math.cos(a1)*r11);
      uv.push(seg/segments,t0,(seg+1)/segments,t0,seg/segments,t1,(seg+1)/segments,t1);
      idx.push(index,index+1,index+2, index+2,index+1,index+3);
      index+=4;
    }
  }
  var geo=new T.BufferGeometry();
  geo.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new T.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}
/* the cave's beam, whole: cold blue, born at the lamp, jittered along its
   length by value noise so it dissolves into the dark like breath */
function makeBeamMat(color, outer, LEN){
  return new T.ShaderMaterial({
    transparent:true, blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide,
    uniforms:{ uColor:{value:new T.Color(color)}, uIntensity:{value:0.85},
      uTime:{value:0}, uOuter:{value:outer?1:0} },
    vertexShader:
      'varying float vAlong; varying vec3 vLocal;\n'+
      'void main(){ vLocal=position;\n'+
      '  vAlong=clamp(position.z/'+LEN.toFixed(2)+', 0.0, 1.0);\n'+
      '  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:
      'precision mediump float;\n'+
      'uniform vec3 uColor; uniform float uIntensity; uniform float uTime; uniform float uOuter;\n'+
      'varying float vAlong; varying vec3 vLocal;\n'+
      'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }\n'+
      'float vnoise(vec2 p){ vec2 c=floor(p); vec2 f=p-c; f=f*f*(3.0-2.0*f);\n'+
      '  float a=hash(c), b=hash(c+vec2(1.0,0.0)), d=hash(c+vec2(0.0,1.0)), e=hash(c+vec2(1.0,1.0));\n'+
      '  return mix(mix(a,b,f.x),mix(d,e,f.x),f.y); }\n'+
      'void main(){ float birth=smoothstep(0.0,0.02,vAlong);\n'+
      '  float ang=atan(vLocal.y,vLocal.x);\n'+
      '  float wisp=vnoise(vec2(ang*2.6,vAlong*7.5-uTime*0.42))*0.62\n'+
      '            +vnoise(vec2(ang*6.3+17.0,vAlong*15.0+uTime*0.27))*0.38;\n'+
      '  float j=vAlong+(wisp-0.5)*0.22;\n'+
      '  float fade=1.0-smoothstep(0.60,0.94,j);\n'+
      '  fade=pow(clamp(fade,0.0,1.0),1.45);\n'+
      '  float longF=pow(clamp(1.0-vAlong*0.24,0.0,1.0),0.38);\n'+
      '  float breath=0.93+0.07*sin(vLocal.z*24.0-uTime*0.31);\n'+
      '  float alpha=birth*fade*longF*breath*uIntensity*0.5;\n'+
      '  if(uOuter>0.5) alpha*=0.31;\n'+
      '  gl_FragColor=vec4(uColor,alpha); }'
  });
}
/* the island under the tower — the cave's own, at 1:65: the same
   shoulder-and-apron profile, the same roughness sines, the same radial
   ravines cut into the flanks so the slope is a broken, shadow-holding
   thing and not one smooth apron */
function makeIslandGeo(){
  /* not a cake any more — one low weathered rise: a smooth fall from a
     small level crown (the tower must stand somewhere) down through
     noisy flanks to an irregular shore, everything leaning off-round */
  var RING=30, SEG=80, RMAX=0.175;
  function sm(a,b,v){ v=clamp((v-a)/(b-a),0,1); return v*v*(3-2*v); }
  function h2(x,y){ var s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
  function vn2(x,y){
    var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    var a=h2(xi,yi), b=h2(xi+1,yi), c2=h2(xi,yi+1), d2=h2(xi+1,yi+1);
    xf=xf*xf*(3-2*xf); yf=yf*yf*(3-2*yf);
    return lerp(lerp(a,b,xf), lerp(c2,d2,xf), yf);
  }
  var TOPA=0.10;
  function profY(r,a){
    var t=clamp((r-0.046)/(0.152-0.046),0,1);      /* crown to shoreline */
    var y=TOPA*Math.pow(Math.cos(t*Math.PI/2),1.35);
    y=lerp(y, -0.055, sm(0.146,RMAX,r));           /* and under the water */
    y+=0.010*Math.sin(a*3.0+1.3)*sm(0.05,0.16,r);  /* one long uneven shoulder */
    return y;
  }
  var pos=[], idx=[], ring, seg;
  for(ring=0;ring<=RING;ring++){
    var rr0=ring/RING*RMAX;
    for(seg=0;seg<SEG;seg++){
      var aa=seg/SEG*TAU, ca=Math.cos(aa), sa=Math.sin(aa);
      var outer=sm(0.05,RMAX,rr0);
      var rr=rr0*(1+(vn2(ca*2.3+9.3, sa*2.3+4.1)*2-1)*0.15*outer);
      var xx=sa*rr, zz=ca*rr;
      var yy=WATER_Y+profY(rr,aa)
            +(vn2(xx*13+3,zz*13+8)-0.5)*0.024*sm(0.082,RMAX,rr0)
            +(vn2(xx*34+7,zz*34)-0.5)*0.011*outer
            +(vn2(xx*70+11,zz*70+5)-0.5)*0.005*outer;
      pos.push(xx+(h2(seg,ring)-0.5)*0.005*outer, yy, zz+(h2(seg+40,ring)-0.5)*0.005*outer);
    }
  }
  for(ring=0;ring<RING;ring++) for(seg=0;seg<SEG;seg++){
    var a0=ring*SEG+seg, b0=ring*SEG+(seg+1)%SEG;
    var c0=(ring+1)*SEG+seg, d0=(ring+1)*SEG+(seg+1)%SEG;
    idx.push(a0,c0,b0, b0,c0,d0);
  }
  var geo=new T.BufferGeometry();
  geo.setAttribute('position', new T.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  geo.scale(1.20, 1, 0.84);
  geo.rotateY(0.55);
  geo.computeVertexNormals();
  return geo;
}

/* the fish — fourteen small dark backs stitching the skin of the water:
   a school going round together, a few loners crossing the other way.
   they ride just at the surface, so the waves hide and show them,
   which is all a fish ever really gives you */
function makeFish(){
  /* white this time, and under everything — pale gradients that ride
     beneath the water's skin, sometimes stooping all the way down to the
     glass floor, where the globe holds their light a moment */
  var fgeo=new T.SphereGeometry(1,10,7);
  fgeo.scale(0.020,0.005,0.0068);
  var fmat=new T.ShaderMaterial({
    transparent:true, blending:T.AdditiveBlending, depthWrite:false,
    vertexShader:
      'varying float vNx; varying vec3 vN; varying vec3 vV;\n'+
      'void main(){ vNx=position.x/0.020;\n'+
      '  vN=normalize(normalMatrix*normal);\n'+
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);\n'+
      '  vV=normalize(-mv.xyz);\n'+
      '  gl_Position=projectionMatrix*mv; }',
    fragmentShader:
      'precision mediump float;\n'+
      'varying float vNx; varying vec3 vN; varying vec3 vV;\n'+
      'void main(){\n'+
      '  float head=smoothstep(-1.05,-0.05,vNx);\n'+
      '  float rim=pow(1.0-abs(dot(normalize(vN),normalize(vV))),1.4);\n'+
      '  float a=(0.26+0.74*head)*(0.34+0.66*rim)*0.95;\n'+
      '  vec3 col=mix(vec3(0.86,0.91,1.0), vec3(1.0,1.0,1.0), head);\n'+
      '  gl_FragColor=vec4(col*a, a); }'
  });
  var N=26, list=[], i;
  for(i=0;i<N;i++){
    var m=new T.Mesh(fgeo, fmat);
    m.renderOrder=5;
    if(i>=20) m.scale.setScalar(0.55);      /* the small ones, born for the deep */
    world.add(m);
    var schooled=(i<12);
    list.push({
      m:  m,
      a:  schooled? 1.2+i*0.11 : Math.random()*TAU,
      r:  schooled? 0.40+Math.random()*0.09 : 0.42+Math.random()*0.20,
      sg: schooled? 1 : (Math.random()<0.5?-1:1),
      sp: schooled? 0.28 : 0.15+Math.random()*0.17,
      ph: Math.random()*TAU,
      dph:Math.random()*TAU,
      dAmp: schooled? 0.10+Math.random()*0.10 :
            (i>=20? 0.14+Math.random()*0.14 : 0.22+Math.random()*0.12),
      ds: 0.22+Math.random()*0.16,
      wob:0.8+Math.random()*0.5
    });
  }
  lvl.fish={ list:list, n:N };
}

/* a flame drawn EVERY frame, after flame.html — six nested teardrop
   layers, each breathing on its own, inner layers lagging the wind; an
   aura, a blue heart at the base, a hot core. never twice the same */
function liveFlame(seed){
  var c=document.createElement('canvas'); c.width=96; c.height=192;
  var x=c.getContext('2d');
  var tex=new T.CanvasTexture(c); tex.colorSpace=T.SRGBColorSpace;
  var well=0, ph=seed*7.31;
  var defs=[{c1:'150,108,46', c2:'207,160,72'}, {c1:'181,142,60', c2:'232,196,102'},
            {c1:'214,176,86', c2:'240,212,150'},{c1:'232,196,102',c2:'246,228,166'},
            {c1:'242,222,160',c2:'252,240,196'},{c1:'246,228,166',c2:'255,247,220'}];
  function update(t, gust){
    var W=96, H=192;
    x.clearRect(0,0,W,H);
    well+=((Math.random()-0.5)*0.12-well)*0.07;
    var sway=Math.sin(t*1.1+ph)*0.38+Math.sin(t*2.7+2+ph)*0.14;
    var flk=(0.55+well+gust*0.5)*(Math.sin(t*6+ph)*0.5+Math.sin(t*13+1+ph)*0.3);
    var bright=0.9+gust*0.45;
    var cx=W*0.5, baseY=H*0.94;
    var h=H*0.60*(1+0.05*Math.sin(t*0.9+ph)+gust*0.20);
    var w=W*0.34*(0.94+0.12*Math.sin(t*9+ph));
    var tip=sway*0.45+flk*0.28+Math.sin(t*3.2+ph)*0.19+Math.sin(t*6.9+1.7+ph)*0.11;
    x.save(); x.globalCompositeOperation='lighter';
    var gy=baseY-h*0.5, gr=Math.max(w*3.0, h*0.7);
    var rg=x.createRadialGradient(cx,gy,1, cx,gy,gr);
    rg.addColorStop(0,'rgba(244,222,150,'+(0.16*bright).toFixed(3)+')');
    rg.addColorStop(0.5,'rgba(232,196,102,'+(0.07*bright).toFixed(3)+')');
    rg.addColorStop(1,'rgba(232,196,102,0)');
    x.fillStyle=rg; x.beginPath(); x.arc(cx,gy,gr,0,TAU); x.fill();
    var L;
    for(L=0;L<6;L++){
      var frac=L/5, sc=1.0-0.56*frac, aa=(0.26+0.34*frac)*bright;
      var ly=defs[L];
      var lw=w*sc, lh=h*(0.82+0.18*sc);
      lh*=(1+0.028*Math.sin(t*11+L*1.9+ph));
      var tipL=tip*(1+0.16*Math.sin(t*4.3+L*0.9+ph));
      var tipX=cx+tipL*lw*1.15, tipY=baseY-lh, bul=lw, by=baseY-lh*0.46;
      var g=x.createLinearGradient(cx,baseY, tipX,tipY);
      g.addColorStop(0,'rgba('+ly.c1+',0)');
      g.addColorStop(0.16,'rgba('+ly.c1+','+(aa*0.72).toFixed(3)+')');
      g.addColorStop(0.62,'rgba('+ly.c2+','+aa.toFixed(3)+')');
      g.addColorStop(1,'rgba('+ly.c2+','+(aa*0.85).toFixed(3)+')');
      x.fillStyle=g;
      x.beginPath(); x.moveTo(tipX,tipY);
      x.bezierCurveTo(tipX+lw*0.16, tipY+lh*0.24, cx+bul, by, cx+bul*0.5, baseY-lh*0.08);
      x.quadraticCurveTo(cx+bul*0.26, baseY, cx, baseY);
      x.quadraticCurveTo(cx-bul*0.26, baseY, cx-bul*0.5, baseY-lh*0.08);
      x.bezierCurveTo(cx-bul, by, tipX-lw*0.16, tipY+lh*0.24, tipX, tipY);
      x.closePath(); x.fill();
    }
    /* the blue heart, tucked just inside the base — real candle chemistry */
    x.save();
    x.translate(cx, baseY-h*0.04);
    var bw=w*0.55;
    x.scale(1, 0.18);
    var bg=x.createRadialGradient(0,0,0.5, 0,0,bw);
    bg.addColorStop(0,'rgba(140,175,255,'+(0.13*bright).toFixed(3)+')');
    bg.addColorStop(0.6,'rgba(120,150,235,'+(0.05*bright).toFixed(3)+')');
    bg.addColorStop(1,'rgba(120,150,235,0)');
    x.fillStyle=bg; x.beginPath(); x.arc(0,0,bw,0,TAU); x.fill();
    x.restore();
    var coreW=w*0.30, coreH=h*0.30, ccy=baseY-coreH*0.7;
    var cg=x.createRadialGradient(cx,ccy,0.5, cx,ccy, Math.max(coreW,coreH));
    cg.addColorStop(0,'rgba(255,251,235,'+(0.50*bright).toFixed(3)+')');
    cg.addColorStop(0.6,'rgba(255,240,190,'+(0.20*bright).toFixed(3)+')');
    cg.addColorStop(1,'rgba(255,240,190,0)');
    x.fillStyle=cg; x.beginPath(); x.ellipse(cx,ccy,coreW,coreH,0,0,TAU); x.fill();
    x.restore();
    tex.needsUpdate=true;
  }
  return { tex:tex, update:update };
}
/* a flame, drawn once — one body, many tongues: white heart, amber
   sides, thin bright veins climbing, two licks leaning off the crown */
function texFlame(){
  var c=document.createElement('canvas'); c.width=64; c.height=128;
  var x=c.getContext('2d');
  function tongue(cx2,base,top,wid,alpha){
    var g=x.createRadialGradient(cx2,base-14,2, cx2,base-32,base-top);
    g.addColorStop(0,'rgba(255,240,200,'+(0.95*alpha)+')');
    g.addColorStop(0.22,'rgba(255,196,110,'+(0.85*alpha)+')');
    g.addColorStop(0.5,'rgba(255,140,50,'+(0.42*alpha)+')');
    g.addColorStop(0.8,'rgba(200,70,18,'+(0.12*alpha)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;
    x.beginPath();
    x.moveTo(cx2,top);
    x.bezierCurveTo(cx2+wid,top+42, cx2+wid*1.15,base-30, cx2,base);
    x.bezierCurveTo(cx2-wid*1.1,base-30, cx2-wid*0.9,top+40, cx2,top);
    x.closePath(); x.fill();
  }
  tongue(32,118,12,17,1.0);                    /* the body */
  tongue(21,116,44,7,0.6);                     /* a lick leaning left */
  tongue(44,116,36,8,0.55);                    /* and one leaning right */
  /* thin bright veins climbing the heart */
  var v2;
  x.strokeStyle='rgba(255,236,180,0.5)'; x.lineWidth=1.1; x.lineCap='round';
  for(v2=0;v2<4;v2++){
    var vx=26+v2*4.5, vy=112;
    x.beginPath(); x.moveTo(vx,vy);
    x.bezierCurveTo(vx+3,vy-22, vx-4+v2*2,vy-44, 32+(v2-1.5)*2.4, 46-v2*5);
    x.stroke();
  }
  var t=new T.CanvasTexture(c); t.colorSpace=T.SRGBColorSpace;
  return t;
}
/* black earth and old stone — soft blotches, a thousand specks, dark
   pores; no drawn lines, the rock speaks in grain alone */
var _caveTex=null;
function texCaveStone(){
  if(_caveTex) return _caveTex;
  var S=256, c=document.createElement('canvas'); c.width=S; c.height=S;
  var x=c.getContext('2d'), i;
  x.fillStyle='#211f1b'; x.fillRect(0,0,S,S);
  for(i=0;i<80;i++){
    var bx=Math.random()*S, by=Math.random()*S, br=12+Math.random()*46;
    var v=(Math.random()*22-11)|0;
    var g=x.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,'rgba('+(33+v)+','+(31+v)+','+(27+v)+',0.35)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g; x.beginPath(); x.arc(bx,by,br,0,TAU); x.fill();
  }
  for(i=0;i<1500;i++){
    var v2=Math.random();
    x.fillStyle = v2<0.5? 'rgba(9,9,7,'+(0.05+Math.random()*0.10).toFixed(2)+')'
                        : 'rgba(78,73,64,'+(0.04+Math.random()*0.08).toFixed(2)+')';
    x.fillRect(Math.random()*S, Math.random()*S, 1+Math.random()*2.2, 1+Math.random()*2.2);
  }
  for(i=0;i<380;i++){
    x.fillStyle='rgba(5,5,4,'+(0.10+Math.random()*0.18).toFixed(2)+')';
    x.beginPath(); x.arc(Math.random()*S, Math.random()*S, 0.6+Math.random()*1.5, 0, TAU); x.fill();
  }
  /* and the cracks — thin dark wanderings, saying nothing, meaning it */
  var k2, n2;
  for(k2=0;k2<16;k2++){
    var cx3=Math.random()*S, cy3=Math.random()*S, ca=Math.random()*TAU;
    var steps=5+((Math.random()*8)|0);
    x.strokeStyle='rgba(6,6,5,'+(0.14+Math.random()*0.16).toFixed(2)+')';
    x.lineWidth=0.7+Math.random()*0.8;
    x.beginPath(); x.moveTo(cx3,cy3);
    for(n2=0;n2<steps;n2++){
      ca+=(Math.random()-0.5)*1.2;
      cx3+=Math.cos(ca)*(6+Math.random()*18);
      cy3+=Math.sin(ca)*(6+Math.random()*18);
      x.lineTo(cx3,cy3);
    }
    x.stroke();
  }
  _caveTex=new T.CanvasTexture(c);
  _caveTex.colorSpace=T.SRGBColorSpace;
  _caveTex.wrapS=_caveTex.wrapT=T.MirroredRepeatWrapping;
  _caveTex.repeat.set(2,2);
  return _caveTex;
}
/* the inside of the mouth — not a surface but a depth: black above,

function roughCone(r,h,rs,hs){

function mouthShape(W,H,seed){

    var smp=new T.Sprite(new T.SpriteMaterial({ map:smTex, transparent:true, opacity:0,

  cold2.position.set(-0.15, 0.40, -0.20); world.add(cold2);
  /* sparks off the fire */
  var EN2=14, epx2=new Float32Array(EN2*3), eph2=[], esp2=[], ei4;
  for(ei4=0;ei4<EN2;ei4++){
    epx2[ei4*3]  =(Math.random()-0.5)*0.14;

  var em2=new T.PointsMaterial({ color:0xffc27a, size:0.014, sizeAttenuation:true,

  var embers2=new T.Points(eg2, em2); embers2.renderOrder=9; world.add(embers2);
  lvl.embers={ geo:eg2, mat:em2, ph:eph2, sp:esp2, n:EN2,
               y0:caveY(0)+0.04, y1:caveY(0)+0.46, cx:0, cz:0 };
  /* the roof lets go — drips from four chosen teeth */
  var DN3=Math.max(1,tipList.length), dpx3=new Float32Array(DN3*3),
      dx1=[], dy1=[], dz1=[], dv1=[], di4;
  for(di4=0;di4<DN3;di4++){

  lvl.drips={ geo:dg3, x0:dx1, y0:dy1, z0:dz1, v:dv1, n:DN3, y1:-0.55 };
  /* the stone is wet — it keeps small pieces of the firelight */
  function capK(x2,y2,z2){
    return 1+(h3(Math.round(x2*4)*0.27, Math.round(y2*4)*0.27, Math.round(z2*4)*0.27)-0.5)*0.16;
  }
  var GLN=44, gpx=new Float32Array(GLN*3), gcl=new Float32Array(GLN*3), gi2;
  for(gi2=0;gi2<GLN;gi2++){
    var gx2, gy2, gz2;
    if(gi2<30){
      var gph=0.38+Math.random()*1.15, gth=Math.random()*TAU, gtry=0;

      }
      var gux=Math.sin(gph)*Math.cos(gth), guy=Math.cos(gph), guz=Math.sin(gph)*Math.sin(gth);

  var glints=new T.Points(gg2, glintM); glints.renderOrder=8; world.add(glints);
  lvl.glint=glintM;
  /* the water remembers in rings — three of them, taking turns */
  var rgl=[], ri2;
  for(ri2=0;ri2<3;ri2++){

  lvl.mini.position.set(0, caveY(0)+0.08, 0);
  world.add(lvl.mini);

/* ----------------------- the fire — inside the flame now: the whole

function buildFire(){
  var fTex3=texCaveStone().clone();

  /* charred stones, a wider ring */
  var fs3;

    { sx:0.30, sy:0.66, ox:-0.090, oz:-0.030, f1:16.3, f2:41.9, op:0.55, cl:0xffd9a8, dr:0.026, dw:0.80 },
    { sx:0.20, sy:0.45, ox: 0.030, oz:-0.075, f1:21.7, f2:53.1, op:0.50, cl:0xffe9c8, dr:0.040, dw:0.50 },
    { sx:0.15, sy:0.36, ox:-0.045, oz: 0.060, f1:26.9, f2:63.7, op:0.45, cl:0xfff2dc, dr:0.034, dw:1.00 },
    { sx:0.26, sy:0.58, ox: 0.110, oz:-0.050, f1:11.9, f2:29.3, op:0.42, cl:0xff9040, dr:0.050, dw:0.45 },
    { sx:0.22, sy:0.50, ox:-0.120, oz: 0.070, f1:14.7, f2:37.1, op:0.40, cl:0xffb060, dr:0.045, dw:0.70 },
    { sx:0.12, sy:0.28, ox: 0.050, oz: 0.100, f1:31.1, f2:73.9, op:0.42, cl:0xfff6e6, dr:0.030, dw:1.30 },
    { sx:0.30, sy:0.28, ox: 0.000, oz: 0.000, f1:10.3, f2:26.7, op:0.72, cl:0xffc890, rot0:Math.PI, un:true },
    { sx:0.21, sy:0.22, ox: 0.060, oz: 0.035, f1:13.7, f2:33.9, op:0.55, cl:0xffd9a8, rot0:Math.PI, un:true },
    { sx:0.16, sy:0.18, ox:-0.070, oz:-0.025, f1:17.9, f2:43.7, op:0.48, cl:0xff9a4e, rot0:Math.PI, un:true },
    { sx:0.11, sy:0.13, ox: 0.025, oz:-0.060, f1:23.3, f2:57.1, op:0.44, cl:0xffe9c8, rot0:Math.PI, un:true }

  for(ft2=0;ft2<fdef2.length;ft2++){

    else if(ft2===5 || ft2===9) mp2=lfB.tex;   /* the deep-orange tongue and its echo below */
    var fmS2=new T.SpriteMaterial({ map:mp2, transparent:true, opacity:fd2.op,

    if(fd2.rot0) fmS2.rotation=fd2.rot0;
    var fspr2=new T.Sprite(fmS2);
    fspr2.scale.set(fd2.sx, fd2.sy, 1); fspr2.center.set(0.5,0.06);

               op:fd2.op, ph:Math.random()*TAU, rot0:fd2.rot0||0,
               dr:fd2.dr||0, dw:fd2.dw||0, bx:fd2.ox, bz:fd2.oz });
  }
  lvl.flame={ list:fl2, gustT:0, gust:0, live:[lfA,lfB] };
  /* two hearts — white within amber — and a dim one hanging below */
  var htM=new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.9,

  var heart=new T.Sprite(htM); heart.scale.set(0.34,0.34,1);
  heart.position.set(0, caveY(0)+0.26, 0); world.add(heart);
  var heart2=new T.Sprite(new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.45,
    blending:T.AdditiveBlending, depthWrite:false, color:0xffb060 }));
  heart2.scale.set(0.58,0.58,1); heart2.position.set(0, caveY(0)+0.30, 0); world.add(heart2);
  var unh=new T.Sprite(new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.4,
    blending:T.AdditiveBlending, depthWrite:false, color:0xffab60 }));
  unh.scale.set(0.20,0.20,1); unh.position.set(0,-0.78,0); world.add(unh);
  var warm3=new T.PointLight(0xffa860, 2.2, 2.8, 2);
  warm3.position.set(0, caveY(0)+0.30, 0); world.add(warm3);
  var unl2=new T.PointLight(0xffa860, 0.8, 1.2, 2);

  /* the ember storm */
  var EN3=40, epx3=new Float32Array(EN3*3), eph3=[], esp3=[], ei5;

    chG.rotateX(-Math.PI/2);

    for(chi=0;chi<chp.count;chi++){
      var chx=chp.getX(chi), chz=chp.getZ(chi);
      chp.setY(chi, caveY(Math.sqrt(chx*chx+chz*chz))+0.004);

/* ----------------------- the wave — the light itself now, asked its
   oldest question and answering both ways at once: rings leaving as a
   wave, grains leaving as particles, from one small source that is also
   the next door ----------------------- */
function buildWave(){
  /* the source — the little globe itself, radiating */
  makeMiniLight();
  lvl.mini.position.set(0, -0.55, 0);
  lvl.mini.scale.setScalar(0.8);
  var src=new T.Sprite(new T.SpriteMaterial({ map:texGlow(), transparent:true, opacity:0.8,
    blending:T.AdditiveBlending, depthWrite:false, color:0xf2f7ff }));
  src.scale.set(0.15,0.15,1); src.position.set(0,-0.40,0); world.add(src);
  lvl.srcGlow=src.material;
  var pl2=new T.PointLight(0xeaf2ff, 1.2, 2.8, 2);
  pl2.position.set(0,-0.40,0); world.add(pl2);
  /* the far floor — a faint interference plate, the wave's own memory
     lying beneath everything it sends */
  var wfM=new T.Mesh(new T.CircleGeometry(0.70, 48),
    new T.MeshBasicMaterial({ map:texWaveFloor(), transparent:true, opacity:0.16,
      blending:T.AdditiveBlending, depthWrite:false }));
  wfM.rotation.x=-Math.PI/2; wfM.position.y=-0.645; wfM.renderOrder=2;
  world.add(wfM);
  lvl.waveFloor=wfM.material;
  /* the wave — rings leaving the source, over and over, never arriving */
  var wrl=[], wi2;
  for(wi2=0;wi2<4;wi2++){
    var wrm=new T.Mesh(new T.RingGeometry(0.94,1.0,72),
      new T.MeshBasicMaterial({ color:0xdfeaff, transparent:true, opacity:0,
        blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide }));
    wrm.rotation.x=-Math.PI/2; wrm.position.set(0,-0.40,0); wrm.renderOrder=8;
    world.add(wrm);
    wrl.push({ m:wrm, off:wi2/4 });
  }
  lvl.waveRings=wrl;
  /* and the same light as a standing wave, walking the round of the globe */
  var RN=128, rpos=new Float32Array(RN*3), ri3;
  for(ri3=0;ri3<RN;ri3++){
    var ra=ri3/RN*TAU;
    rpos[ri3*3]=Math.cos(ra)*0.55; rpos[ri3*3+1]=-0.05; rpos[ri3*3+2]=Math.sin(ra)*0.55;
  }
  var rg3=new T.BufferGeometry();
  rg3.setAttribute('position', new T.BufferAttribute(rpos,3).setUsage(T.DynamicDrawUsage));
  var ribbon=new T.LineLoop(rg3, new T.LineBasicMaterial({ color:0xbfe0ff,
    transparent:true, opacity:0.55, blending:T.AdditiveBlending, depthWrite:false }));
  ribbon.renderOrder=8; world.add(ribbon);
  /* and a soft breath of glow riding the same wave — beads of light
     spaced along the loop so the line seems to shine, not just be */
  var GBN=48, gbp=new Float32Array(GBN*3), gb2;
  for(gb2=0;gb2<GBN;gb2++){
    var gba=gb2/GBN*TAU;
    gbp[gb2*3]=Math.cos(gba)*0.55; gbp[gb2*3+1]=-0.05; gbp[gb2*3+2]=Math.sin(gba)*0.55;
  }
  var gbg=new T.BufferGeometry();
  gbg.setAttribute('position', new T.BufferAttribute(gbp,3).setUsage(T.DynamicDrawUsage));
  var rGlow=new T.Points(gbg, new T.PointsMaterial({ color:0xbfe0ff, size:0.030,
    sizeAttenuation:true, transparent:true, opacity:0.15, blending:T.AdditiveBlending,
    depthWrite:false, map:texGlow() }));
  rGlow.renderOrder=8; world.add(rGlow);
  lvl.ribbon={ geo:rg3, n:RN, r:0.55, glow:gbg, gn:GBN };
  /* two more modes of the same question — an inner quick round and an
     outer slow one, each travelling the other way */
  function ringLoop(rr5, yy2, op2){
    var RN2=110, rpp=new Float32Array(RN2*3), rj2;
    for(rj2=0;rj2<RN2;rj2++){
      var raa=rj2/RN2*TAU;
      rpp[rj2*3]=Math.cos(raa)*rr5; rpp[rj2*3+1]=yy2; rpp[rj2*3+2]=Math.sin(raa)*rr5;
    }
    var rgg=new T.BufferGeometry();
    rgg.setAttribute('position', new T.BufferAttribute(rpp,3).setUsage(T.DynamicDrawUsage));
    var rl2=new T.LineLoop(rgg, new T.LineBasicMaterial({ color:0xbfe0ff,
      transparent:true, opacity:op2, blending:T.AdditiveBlending, depthWrite:false }));
    rl2.renderOrder=8; world.add(rl2);
    return { geo:rgg, n:RN2, y:yy2 };

var SND=!('mute' in qs);
var AC=null, sndMaster=null, sndNoiseBuf=null, ambG=null, stormG=null, stormF=null, rumG=null;
var sndStormy=false;
function wakeAudio(){
  if(!SND) return;
  try{
    if(!AC){
      var Ctor=window.AudioContext||window.webkitAudioContext;
      if(!Ctor){ SND=false; return; }
      AC=new Ctor();
      sndMaster=AC.createGain(); sndMaster.gain.value=MASTER_V; sndMaster.connect(AC.destination);
      sndNoiseBuf=AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
      var d=sndNoiseBuf.getChannelData(0), i;
      for(i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      /* the wind bed — never quite still */
      var src=AC.createBufferSource(); src.buffer=sndNoiseBuf; src.loop=true;
      var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=320; f.Q.value=0.4;
      ambG=AC.createGain(); ambG.gain.value=0.0001;
      src.connect(f); f.connect(ambG); ambG.connect(sndMaster); src.start();
      var lfo=AC.createOscillator(); lfo.frequency.value=0.05;
      var lg=AC.createGain(); lg.gain.value=110;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      /* the blizzard — silent until the hand shakes */
      var s2=AC.createBufferSource(); s2.buffer=sndNoiseBuf; s2.loop=true;
      stormF=AC.createBiquadFilter(); stormF.type='bandpass'; stormF.frequency.value=620; stormF.Q.value=0.7;
      stormG=AC.createGain(); stormG.gain.value=0.0001;
      s2.connect(stormF); stormF.connect(stormG); stormG.connect(sndMaster); s2.start();
      /* the deep of the charge */
      var s3=AC.createBufferSource(); s3.buffer=sndNoiseBuf; s3.loop=true;
      var f3=AC.createBiquadFilter(); f3.type='lowpass'; f3.frequency.value=90; f3.Q.value=0.5;
      rumG=AC.createGain(); rumG.gain.value=0.0001;
      s3.connect(f3); f3.connect(rumG); rumG.connect(sndMaster); s3.start();
    }
    if(AC.state==='suspended') AC.resume();
  }catch(e){ SND=false; }
}
function waveSwell(when, rise, fall, vol, f0, f1, pan){
  if(!AC||!SND) return;
  try{
    var t=AC.currentTime+(when||0);
    var src=AC.createBufferSource(); src.buffer=sndNoiseBuf; src.loop=true;
    src.playbackRate.value=0.9+Math.random()*0.2;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.Q.value=0.6;
    f.frequency.setValueAtTime(Math.max(60,f0),t);
    f.frequency.exponentialRampToValueAtTime(Math.max(70,f1),t+rise);
    f.frequency.exponentialRampToValueAtTime(Math.max(55,Math.min(f0,f1)*0.6),t+rise+fall);
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+rise);
    g.gain.exponentialRampToValueAtTime(0.0001,t+rise+fall);
    var out=g;
    if(pan && AC.createStereoPanner){
      var p=AC.createStereoPanner(); p.pan.value=pan; g.connect(p); out=p;
    }
    src.connect(f); f.connect(g); out.connect(sndMaster);
    src.start(t); src.stop(t+rise+fall+0.15);
  }catch(e){}
}

var motionOn=false, moEv=0, moPerm='?';
function listenMotion(){
  if(motionOn) return; motionOn=true;

      moEv++;
      var a=e.acceleration||e.accelerationIncludingGravity; if(!a) return;
      var m=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
      if(e.accelerationIncludingGravity && !e.acceleration) m=Math.abs(m-9.81);
      lastAccel=m;
      if(m>SHAKE_SENS){
        accelHotT=performance.now();
        if(level>=6){ doShake(Math.min(2, m/(SHAKE_SENS*0.8))); }

   (or anywhere without a permission api) events flow with no tap at all.
   the ask below exists only to raise the dialog for a first-time visitor. */

function askMotion(){
  /* the ask must ride a COMPLETED user gesture — ios REJECTS it from a
     pointerdown on some versions (the field clue was mo:rej with no dialog
     ever shown), so the click handler below carries it too, and every
     rejection is retried on the next tap. only DeviceMotionEvent is asked:
     one dialog covers motion and orientation both, and two simultaneous
     asks reject each other. */
  if(moPerm==='granted'||moPerm==='denied'||moPerm==='no-api') return;
  try{
    if(window.DeviceMotionEvent && DeviceMotionEvent.requestPermission){
      DeviceMotionEvent.requestPermission().then(
        function(s){ moPerm=s; }, function(){ moPerm='rej'; });
    } else moPerm='no-api';
  }catch(e){ moPerm='no-api'; }
}

        waveSwell(0, 0.008, 0.30, 0.06, 460, 110, (Math.random()-0.5)*0.4);
      }
    } else if(level===5){
