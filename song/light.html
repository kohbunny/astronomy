/* ----- the crossing's own light — built once, shown only mid-flight -----
   three gestures: the GLASS KISS, a chromatic ripple where the shell is
   pierced, wearing the limb's own colours; FALLING LIGHT, cool streaks
   rushing past the lens on the dive; and the BECKONING, rings the little
   world sends up to meet you. all of it lives in scene space, outside
   the worlds, and is hidden again the moment the crossing lands. */
/* the GLASS KISS, remade — no drawn rings: the sphere itself scatters.
   two hundred sparks are seeded on the true glass surface around the
   pierce point and slide outward ALONG the surface, wearing the limb's
   own colours, twinkling out as they go. */
var SKN=220,
    skPos=new Float32Array(SKN*3), skCol=new Float32Array(SKN*3),
    skS0=new Float32Array(SKN*3), skU=new Float32Array(SKN*3),
    skB=new Float32Array(SKN*3), skDd=new Float32Array(SKN), skTw=new Float32Array(SKN);
var skGeo=new T.BufferGeometry();
skGeo.setAttribute('position', new T.BufferAttribute(skPos,3).setUsage(T.DynamicDrawUsage));
skGeo.setAttribute('color', new T.BufferAttribute(skCol,3).setUsage(T.DynamicDrawUsage));
var sprkPts=new T.Points(skGeo, new T.PointsMaterial({ size:0.011, sizeAttenuation:true,
  vertexColors:true, transparent:true, opacity:1, blending:T.AdditiveBlending,
  depthWrite:false, map:texGlow() }));
sprkPts.frustumCulled=false; sprkPts.renderOrder=12; sprkPts.visible=false;
scene.add(sprkPts);
var kissT0=-1e9;

/* the POURING — the crossing's centrepiece. at the moment the dive
   begins, the living world is sampled from its own mesh surfaces — up
   to ~2200 grains, each carrying the colour of the thing it was taken
   from — and for a breath the whole world glitters, revealed as woven
   light. then, in a wave that spreads from the door outward, every
   grain lets go and streams along its own curved path into the little
   globe, absorbed as it arrives. the world does not vanish; it is
   REMEMBERED into the next doll. */
var PRN=2200, pourN=0, pourReady=false, pourArrive=false, pourT0=0,
    prPos=new Float32Array(PRN*3), prCol=new Float32Array(PRN*3),
    prHome=new Float32Array(PRN*3), prCtl=new Float32Array(PRN*3),
    prBase=new Float32Array(PRN*3), prDel=new Float32Array(PRN),
    prPA=new Float32Array(PRN*3), prPB=new Float32Array(PRN*3),
    prPh=new Float32Array(PRN), prAm=new Float32Array(PRN);
var prGeo=new T.BufferGeometry();
prGeo.setAttribute('position', new T.BufferAttribute(prPos,3).setUsage(T.DynamicDrawUsage));
prGeo.setAttribute('color', new T.BufferAttribute(prCol,3).setUsage(T.DynamicDrawUsage));
var pourPts=new T.Points(prGeo, new T.PointsMaterial({ size:0.012, sizeAttenuation:true,
  vertexColors:true, transparent:true, opacity:1, blending:T.AdditiveBlending,
  depthWrite:false, map:texGlow() }));
pourPts.frustumCulled=false; pourPts.renderOrder=11; pourPts.visible=false;
scene.add(pourPts);
/* the same grains again, wide and faint — a bloom layer sharing the
   buffers, so every mote is a hot core inside its own soft breath */
var pourHalo=new T.Points(prGeo, new T.PointsMaterial({ size:0.032, sizeAttenuation:true,
  vertexColors:true, transparent:true, opacity:0.34, blending:T.AdditiveBlending,
  depthWrite:false, map:texGlow() }));
pourHalo.frustumCulled=false; pourHalo.renderOrder=10; pourHalo.visible=false;
scene.add(pourHalo);
function buildPour(arriving){
  pourN=0;
  if(lvl.mini) lvl.mini.traverse(function(o){ o.userData._noPour=1; });
  world.updateMatrixWorld(true);
  var metas=[], totalV=0;
  world.traverse(function(o){
    if(!o.visible || !o.isMesh || o.isInstancedMesh || o.userData._noPour) return;
    if(!o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;
    var cnt=o.geometry.attributes.position.count;
    if(cnt<3) return;
    metas.push({ o:o, cnt:cnt });
    totalV+=cnt;
  });
  if(!totalV) return;
  var mi2, gi2, maxD=0.0001;
  if(arriving){
    _pourAim.set(0,0,0);                        /* the heart of the glass, world-local */
  } else {
    camAim.copy(_dp.set(0,BY,0));
    if(lvl.mini) lvl.mini.getWorldPosition(camAim);
    _pourAim.copy(camAim); world.worldToLocal(_pourAim);
  }
  for(mi2=0;mi2<metas.length && pourN<PRN;mi2++){
    var MM=metas[mi2], pa2=MM.o.geometry.attributes.position;
    var ni=Math.max(2, Math.round(PRN*MM.cnt/totalV));
    var mc=(MM.o.material && MM.o.material.color)? MM.o.material.color : null;
    var cr2=mc?mc.r:0.72, cg2=mc?mc.g:0.80, cb2=mc?mc.b:0.94;
    var mx2=Math.max(cr2,cg2,cb2,0.001);
    if(mx2<0.5){ var lf2=0.5/mx2; cr2*=lf2; cg2*=lf2; cb2*=lf2; }   /* everything reads as light */
    cr2=cr2*0.85+0.15; cg2=cg2*0.85+0.15; cb2=cb2*0.85+0.15;
    for(gi2=0;gi2<ni && pourN<PRN;gi2++){
      var vi2=(Math.random()*pa2.count)|0;
      _dp.set(pa2.getX(vi2), pa2.getY(vi2), pa2.getZ(vi2)).applyMatrix4(MM.o.matrixWorld);
      world.worldToLocal(_dp);                   /* local to the turning world */
      var p3=pourN*3;
      prHome[p3]=_dp.x; prHome[p3+1]=_dp.y; prHome[p3+2]=_dp.z;
      prPos[p3]=_dp.x;  prPos[p3+1]=_dp.y;  prPos[p3+2]=_dp.z;
      prBase[p3]=cr2; prBase[p3+1]=cg2; prBase[p3+2]=cb2;
      prCol[p3]=0; prCol[p3+1]=0; prCol[p3+2]=0;
      var dd3=_dp.distanceTo(_pourAim);
      if(dd3>maxD) maxD=dd3;
      prDel[pourN]=dd3;                          /* distance for now; a wave next */
      /* the bend of the path — a control point off the straight line,
         and a helix frame so the stream can braid around itself */
      _dw.copy(_pourAim).sub(_dp);
      if(_dw.lengthSq()<1e-8) _dw.set(0,1,0); else _dw.normalize();
      _du.set(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).cross(_dw);
      if(_du.lengthSq()<1e-6) _du.set(0,1,0);
      _du.normalize();
      prPA[p3]=_du.x; prPA[p3+1]=_du.y; prPA[p3+2]=_du.z;
      _dv.copy(_dw).cross(_du);
      prPB[p3]=_dv.x; prPB[p3+1]=_dv.y; prPB[p3+2]=_dv.z;
      prPh[pourN]=Math.random()*TAU;
      prAm[pourN]=0.030+Math.random()*0.045;
      var ctA=0.05+Math.random()*0.16;
      prCtl[p3]  =(_dp.x+_pourAim.x)*0.5+_du.x*ctA;
      prCtl[p3+1]=(_dp.y+_pourAim.y)*0.5+_du.y*ctA;
      prCtl[p3+2]=(_dp.z+_pourAim.z)*0.5+_du.z*ctA;
      pourN++;
    }
  }
  var wi3;                                       /* the wave spreads from the door outward */
  for(wi3=0;wi3<pourN;wi3++) prDel[wi3]=(prDel[wi3]/maxD)*0.55;
  prGeo.attributes.position.needsUpdate=true;
  prGeo.setDrawRange(0, pourN);
  if(lvl.mini) lvl.mini.traverse(function(o){ delete o.userData._noPour; });
}
var DSN=90, dsPos=new Float32Array(DSN*6), dsA=[], dsR=[], dsD=[], dsSp=[], dsi;
for(dsi=0;dsi<DSN;dsi++){
  dsA.push(Math.random()*TAU);
  dsR.push(0.14+Math.pow(Math.random(),0.7)*0.55);
  dsD.push(Math.random()*1.6);
  dsSp.push(0.8+Math.random()*1.6);
}
var dsGeo=new T.BufferGeometry();
dsGeo.setAttribute('position', new T.BufferAttribute(dsPos,3).setUsage(T.DynamicDrawUsage));
var dsMat=new T.LineBasicMaterial({ color:0xcfe2ff, transparent:true, opacity:0,
  blending:T.AdditiveBlending, depthWrite:false, depthTest:false });
var diveStreaks=new T.LineSegments(dsGeo, dsMat);
diveStreaks.frustumCulled=false; diveStreaks.renderOrder=12; diveStreaks.visible=false;
scene.add(diveStreaks);
var crossPierced=false, crossGlow=0, arriveBloom=0;
var _pourAim=new T.Vector3();
var _dv=new T.Vector3(), _dp=new T.Vector3(), _du=new T.Vector3(), _dw=new T.Vector3();

function beginCross(){
  crossing=true; crossT0=performance.now(); crossSwapped=false; crossDove=false;
  crossPierced=false; pourReady=false; pourArrive=false;
  wakeAudio(); sndCross();
  charge=0;                                     /* the veil lets go; the dark is saved for the very end */
  crossDive = !inside && !reduced;              /* rising out has no target to dive at */
  if(crossDive){
    camFrom.copy(camera.position);
    crossC.set(0, BY+lvl.gy+0.26, 0);           /* the heart of the little world */
  }
}
function crossEnd(){
  setLevel((level+1)%LEVELS.length);
  charge=0; stormS=0; dragE=0; tapP=0; accelHotT=-1e9; bridgeStormT=-1e9;
  snowMat.uniforms.uOp.value=0;
  simSpeed=1;
  arriveBloom=1;                                /* a soft breath of white as the new world opens */
  /* the other half of the gesture: sample the NEW world, and let it
     CONDENSE — grains bursting from the heart of the glass out to their
     places on the fresh surfaces, absorbed as they land. what the last
     world poured in, this one is built from. */
  if(!reduced){
    buildPour(true);
    if(pourN>0){ pourT0=performance.now(); pourArrive=true;
      pourPts.visible=true; pourHalo.visible=true; }
  }
}

/* ===================== the arrival (over the bridge) =====================
   the old choreography, whole, aimed at this globe: the EGG at the top
   releases the light — tiny grains fall from its underside into the crown
   of the glass; a small quiet glow where they land; the world inside
   answers with a storm of its own; seven close HAZY beams pour down below
   the ball; and the light GROWS THE WORDS — coloured points fly out of the
   beams into the letterforms of the intro, resolve to chalk, dissolve, and
   the real text remains. waits for postMessage('arrive-light'); starts
   alone after 4s (?enter=light direct). the charge is locked meanwhile. */
var bridgeStormT=-1e9, arriveLock=0;
if(BRIDGED){
  var arriveStarted=false;
  var _pv=new T.Vector3();
  var _proj=function(x,y,z){
    _pv.set(x,y,z); _pv.project(camera);
    return { x:(_pv.x*0.5+0.5)*window.innerWidth, y:(-_pv.y*0.5+0.5)*window.innerHeight };
  };
  var INTRO_TEXT='white light carries the whole song\nthe glass divides it into seven\nthe seven settle \u2014 still singing';
  var runArrival=function(){
    arriveLock=performance.now()+9200;
    var intro=document.getElementById('intro');
    if(intro) intro.textContent=INTRO_TEXT;
    if(reduced){ if(intro){ intro.style.transition='opacity 2s ease'; intro.style.opacity='1'; } return; }
    var acv=document.createElement('canvas');
    acv.style.cssText='position:fixed;inset:0;z-index:12;pointer-events:none;';
    acv.width=window.innerWidth*Math.min(2,window.devicePixelRatio||1);
    acv.height=window.innerHeight*Math.min(2,window.devicePixelRatio||1);
    acv.style.width='100%'; acv.style.height='100%';
    document.body.appendChild(acv);
    var ax=acv.getContext('2d'), dpr2=acv.width/window.innerWidth;

    /* where the egg lets go of the light */
    var egg=document.getElementById('eggback');
    var er=egg?egg.getBoundingClientRect():null;
    var sx=er?(er.left+er.width/2):(window.innerWidth/2);
    var sy=er?(er.bottom+1):40;

    /* sample the intro's letterforms into points the light can become */
    var pts=[];
    (function(){
      var fs=Math.max(9, Math.min(13, window.innerWidth*0.028));
      var lineH=fs*2.1;
      var lines=INTRO_TEXT.split('\n');
      var oc=document.createElement('canvas');
      var ox=oc.getContext('2d');
      ox.font='300 '+fs+'px "JetBrains Mono", monospace';
      var lw=0,i; for(i=0;i<lines.length;i++) lw=Math.max(lw, ox.measureText(lines[i]).width);
      oc.width=Math.ceil(lw)+8; oc.height=Math.ceil(lineH*lines.length)+8;
      ox=oc.getContext('2d');
      ox.font='300 '+fs+'px "JetBrains Mono", monospace';
      ox.textAlign='center'; ox.textBaseline='middle';
      ox.fillStyle='#fff';
      for(i=0;i<lines.length;i++) ox.fillText(lines[i], oc.width/2, 4+lineH*(i+0.5));
      var img=ox.getImageData(0,0,oc.width,oc.height).data;
      var step=(oc.width*oc.height>26000)?3:2, xx,yy;
      var ir=intro?intro.getBoundingClientRect():null;
      var y0=ir? (ir.top+ir.height/2) : window.innerHeight*0.86;
      var left0=window.innerWidth/2-oc.width/2, top0=y0-oc.height/2;
      for(yy=0;yy<oc.height;yy+=step) for(xx=0;xx<oc.width;xx+=step){
        if(img[(yy*oc.width+xx)*4+3]>110){
          pts.push({ tx:left0+xx, ty:top0+yy,
                     d:Math.random()*1.4 + (yy/oc.height)*0.5,
                     b:(Math.random()*7)|0, r:Math.random() });
        }
      }
    })();

    var motes=[], lastSpawn=0;
    var at0=performance.now(), stormed=false, introShown=false;
    wakeAudio(); waveSwell(0, 1.0, 0.9, 0.06, 700, 2400);   /* the light approaching */
    function aloop(now){
      var t=(now-at0)/1000, i;
      var ease=function(x){ return x<0?0:x>1?1:x*x*(3-2*x); };
      ax.setTransform(dpr2,0,0,dpr2,0,0);
      ax.clearRect(0,0,window.innerWidth,window.innerHeight);
      var top=_proj(0, BY+1.0, 0), bot=_proj(0, BY-1.0, 0);
      var g1=ease(t/0.9);
      var gS=ease((t-0.9)/0.3);                 /* the small landing glow */
      var gF=ease((t-1.5)/1.3);                 /* the hazy beams below */
      var gA=ease((t-4.0)/0.5);                 /* the words begin to grow */
      var gEnd=ease((t-6.6)/1.0);               /* the points let go */
      ax.globalCompositeOperation='lighter';

      /* grains of light, released by the egg, falling into the crown */
      if(t<3.8 && now-lastSpawn>12){
        lastSpawn=now;
        motes.push({ b:now, dur:700+Math.random()*350, s:Math.random()*6.28,
                     sz:0.9+Math.random()*1.3 });
        if(motes.length>140) motes.shift();
      }
      for(i=0;i<motes.length;i++){
        var m=motes[i], p=(now-m.b)/m.dur; if(p<0||p>1) continue;
        var my=sy + (top.y-sy)*p;
        var mx=sx + Math.sin(p*9+m.s)*3.2*(1-p*0.7) + (top.x-sx)*p;
        var ma=0.55*g1*(p<0.12? p/0.12 : (p>0.9? (1-p)/0.1 : 1));
        ax.fillStyle='rgba(255,252,242,'+ma+')';
        ax.beginPath(); ax.arc(mx,my,m.sz,0,TAU); ax.fill();
      }

      /* where the light lands: a small quiet glow, nothing theatrical */
      if(gS>0 && t<4.4){
        var sA=0.30*gS*(1-ease((t-3.4)/1.0));
        var sR=5+3*Math.sin(t*5);
        var cg=ax.createRadialGradient(top.x,top.y,0, top.x,top.y,14);
        cg.addColorStop(0,'rgba(255,250,238,'+sA+')');
        cg.addColorStop(1,'rgba(255,250,238,0)');
        ax.fillStyle=cg; ax.beginPath(); ax.arc(top.x,top.y,14,0,TAU); ax.fill();
        ax.strokeStyle='rgba(255,255,255,'+(sA*0.8)+')'; ax.lineWidth=1;
        ax.beginPath(); ax.moveTo(top.x-sR,top.y); ax.lineTo(top.x+sR,top.y);
        ax.moveTo(top.x,top.y-sR); ax.lineTo(top.x,top.y+sR); ax.stroke();
      }

      /* the world inside answers — once. in the orchard, the snow storms;
         one doll down, the light itself would. */
      if(!stormed && t>=1.15){ stormed=true;
        if(level>=6){ try{ doShake(1.1); }catch(e){} }
        else bridgeStormT=performance.now();
      }

      /* seven hazy beams, close together: cones of soft colour, no edges */
      var reach=(window.innerHeight-bot.y)*0.92;
      if(gF>0){
        var giveaway=1-gA*0.9;                  /* their light goes into the words */
        var k3,j;
        for(k3=0;k3<7;k3++){
          var c=SPEC[k3];
          var ang=Math.PI/2+(k3-3)*0.08 + Math.sin(k3*1.7+t*1.1)*0.012;
          var dirx=Math.cos(ang), diry=Math.sin(ang);
          for(j=1;j<=13;j++){
            var s=j/13, rr=3+24*s;
            var bxp=bot.x+dirx*reach*s*gF, byp=bot.y+diry*reach*s*gF;
            var ba=0.085*gF*giveaway*(1-gEnd)*(0.35+0.65*(1-s*0.5));
            var bg2=ax.createRadialGradient(bxp,byp,0, bxp,byp,rr);
            bg2.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+ba+')');
            bg2.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
            ax.fillStyle=bg2; ax.beginPath(); ax.arc(bxp,byp,rr,0,TAU); ax.fill();
          }
        }
      }

      /* the light grows the words: points fly out of the beams into letters,
         and their colour resolves to chalk as they arrive */
      if(gA>0){
        var TA=4.0, pi2, pt;
        for(pi2=0;pi2<pts.length;pi2++){
          pt=pts[pi2];
          var pp=(t-TA-pt.d)/1.2; if(pp<0) continue; pp=Math.min(1,pp);
          var pe=1-Math.pow(1-pp,3);
          if(pt.sx===undefined){
            var aa=Math.PI/2+(pt.b-3)*0.08;
            var ss=0.25+pt.r*0.7;
            pt.sx=bot.x+Math.cos(aa)*reach*ss+(pt.r-0.5)*10;
            pt.sy=bot.y+Math.sin(aa)*reach*ss+(pt.r-0.5)*10;
          }
          var ppx=pt.sx+(pt.tx-pt.sx)*pe, ppy=pt.sy+(pt.ty-pt.sy)*pe;
          var cc=SPEC[pt.b];
          var pr2=Math.round(cc[0]+(233-cc[0])*pe),
              pg =Math.round(cc[1]+(226-cc[1])*pe),
              pb =Math.round(cc[2]+(210-cc[2])*pe);
          var pa=(0.25+0.6*pe)*(1-gEnd);
          if(gEnd>0) ppy-=gEnd*(6+pt.r*10);      /* the dissolve drifts upward */
          if(pp>=1) pa*=0.8+0.2*Math.sin(t*6+pt.r*9);
          ax.fillStyle='rgba('+pr2+','+pg+','+pb+','+pa+')';
          ax.fillRect(ppx, ppy, 1.4, 1.4);
        }
      }

      /* the true words surface as the points let go */
      if(!introShown && t>=6.5 && intro){
        introShown=true;
        intro.style.transition='opacity 1.6s ease';
        intro.style.opacity='1';
      }

      if(t<8.0){ requestAnimationFrame(aloop); return; }
      try{ acv.parentNode.removeChild(acv); }catch(e){}
    }
    requestAnimationFrame(aloop);
  };
  var startArrive=function(){ if(arriveStarted) return; arriveStarted=true; runArrival(); };
  window.addEventListener('message', function(e){
    try{ if(e.data && e.data.apwnp==='arrive-light') startArrive(); }catch(_){}
  }, false);
  setTimeout(startArrive, 4000);
}
/* ===================== end arrival ===================== */

/* ----------------------- the frame ----------------------- */
var veil=document.getElementById('veil');
var dbgEl=document.getElementById('dbg');
var showDbg=('test' in qs);
if(showDbg&&dbgEl) dbgEl.style.display='block';
var _last=0, hidden=false;
document.addEventListener('visibilitychange', function(){ hidden=document.hidden; });
var _p=new T.Vector3(), _vv=new T.Vector3();
var seaLapT=0;
var SEAS_NAME=['spring','summer','autumn','winter'];

function frame(pn){
  requestAnimationFrame(frame);
  if(hidden){ _last=pn; return; }
  var dt=_last?Math.min((pn-_last)/1000,0.05):0.016; _last=pn;
  simT += dt*simSpeed; var sdt=dt*simSpeed;     /* the world's clock — hurried during the crossing */
  var tS=pn*0.001, i, f3;
  var lightOn=(level>=6), weather=(level<=1);

  /* the year — one revolution of the globe */
  var seas=0, w=null;
  if(level===0){
    seas=((turn.rotation.y/TAU)%1+1)%1;
    w=seasW(seas);
  }

  /* the flame burns only where it is the sun */
  var flk=0.5, flame=null;
  if(lightOn){
    flamePaint(pn);
    flame=window.__flame||{brightness:0.7,flicker:0.4,sway:0};
    flk=clamp(flame.flicker*(Math.sin(pn*0.006)*0.5+Math.sin(pn*0.013+1)*0.3)+0.5,0,1);
    flameLight.intensity=0.7+0.9*flame.brightness+0.35*flk;
  }

  /* the storm — from motion, from wiggle, from taps, from the bridge,
     and a little of winter's own */
  var accelK=Math.max(0, 1-(pn-accelHotT)/650);
  dragE*=Math.exp(-dt*2.6);
  tapP*=Math.exp(-dt*1.1);
  var bridgeK=Math.max(0, 1-(pn-bridgeStormT)/2800);
  var sFloor=w?mixN(w,SEA.stormF):0;
  var storm=clamp(accelK+dragE+tapP+bridgeK*0.95+sFloor, 0, 1);
  stormS += (storm-stormS)*Math.min(1, dt*5);

  /* the charge — six sustained seconds, forgetful when you rest;
     asleep while the arrival plays */
  if(!crossing){
    if(stormS>STORM_GATE && pn>arriveLock) charge=Math.min(1, charge+dt/CHARGE_T);
    else charge=Math.max(0, charge-dt*CHARGE_DK);
    if(charge>=1) beginCross();
  }

  /* the fine dust flutters while the storm lives, wherever weather is */
  if(weather && stormS>0.012){
    for(i=0;i<FN;i++){
      f3=i*3;
      spx[f3+1]-=dt*(0.10+sspd[i]*0.20)*(0.35+1.25*stormS);
      spx[f3]  += Math.sin(tS*1.3+sph[i])*dt*0.16*stormS + (Math.random()-0.5)*dt*0.22*stormS;
      spx[f3+2]+= Math.cos(tS*1.1+sph2[i])*dt*0.16*stormS + (Math.random()-0.5)*dt*0.22*stormS;
      var rr=spx[f3]*spx[f3]+spx[f3+1]*spx[f3+1]+spx[f3+2]*spx[f3+2];
      if(rr>0.874){
        var rl=Math.sqrt(rr), sc=0.933/rl;
        spx[f3]*=sc; spx[f3+1]*=sc; spx[f3+2]*=sc;
      }
      var dd=Math.sqrt(spx[f3]*spx[f3]+spx[f3+2]*spx[f3+2]);
      var fl=(level===0)? domeY(Math.min(dd,MND_RX))+0.015 : WATER_Y+0.012;
      if(spx[f3+1]<fl){
        if(level===0) snowAmt=Math.min(1, snowAmt+0.0016*stormS);   /* the sea keeps no snow */
        var yy=0.62+Math.random()*0.24;
        var rad=Math.sqrt(Math.max(0,1-yy*yy))*0.85;
        var aa=Math.random()*TAU, r2=Math.sqrt(Math.random())*rad;
        spx[f3]=Math.cos(aa)*r2; spx[f3+1]=yy; spx[f3+2]=Math.sin(aa)*r2;
      }
    }
    snowGeo.attributes.position.needsUpdate=true;
  }

  /* the flakes' own light, wherever weather lives */
  if(weather){
    snowMat.uniforms.uOp.value += ((stormS*0.95)-snowMat.uniforms.uOp.value)*Math.min(1,dt*3);
    snowMat.uniforms.uT.value=tS;
    snowMat.uniforms.uPx.value=Math.min(2, window.devicePixelRatio||1);
  }

  /* the year, applied: colour, cover, light, the fall */
  if(level===0 && w){
    var effSnow=clamp(Math.max(snowAmt, mixN(w,SEA.snowF)),0,1);
    snowAmt=Math.max(0, snowAmt-dt*mixN(w,SEA.melt));
    if(lvl.snowShell) lvl.snowShell.opacity=effSnow*0.92;

    if(lvl.leafMat){
      mixC(w,SEA.leaf,_c); _c.lerp(_white, effSnow*0.55);
      lvl.leafMat.color.copy(_c);
    }
    /* the leaves themselves — held, then let go one by one through
       autumn: each falls swaying, lands in the grass, rests a while, and
       is taken slowly into the ground. late winter they bud back */
    if(lvl.leafAnim && lvl.leafMesh){
      var LA=lvl.leafAnim, AMT=leafAmt(seas);
      var FALLW=(seas>=0.42 && seas<0.86);
      lvl.leafMesh.visible = AMT>0.01 || FALLW;
      if(lvl.leafMesh.visible){
        var gust=0.10+0.30*stormS+0.05*Math.sin(simT*0.7);
        var wobA=gust*0.05;
        for(i=0;i<LA.n;i++){
          var i3=i*3, i4=i*4, sdv=LA.sd[i];
          var si, lx2, ly2, lz2, flat=false, tumble=1;
          if(!FALLW){
            LA.md[i]=0;
            si=clamp((AMT-sdv*0.30)*1.42, 0, 1);
            lx2=LA.p[i3]  +Math.sin(simT*0.9+sdv*21)*wobA;
            ly2=LA.p[i3+1]+Math.sin(simT*1.3+sdv*31)*wobA*0.7;
            lz2=LA.p[i3+2]+Math.cos(simT*0.8+sdv*43)*wobA;
          } else {
            if(LA.md[i]===0 && seas>=0.42+sdv*0.26){
              LA.md[i]=1; LA.cy[i]=LA.p[i3+1]; LA.tm[i]=1; LA.ox[i]=0; LA.oz[i]=0;
            }
            if(LA.md[i]===0){
              si=1;
              lx2=LA.p[i3]  +Math.sin(simT*0.9+sdv*21)*wobA;
              ly2=LA.p[i3+1]+Math.sin(simT*1.3+sdv*31)*wobA*0.7;
              lz2=LA.p[i3+2]+Math.cos(simT*0.8+sdv*43)*wobA;
            } else if(LA.md[i]===1){
              LA.cy[i]-=sdt*(0.05+sdv*0.05);
              LA.ox[i]+=Math.sin(simT*(1.6+sdv)+sdv*40)*sdt*0.11;
              LA.oz[i]+=Math.cos(simT*(1.3+sdv)+sdv*57)*sdt*0.11;
              lx2=LA.p[i3]+LA.ox[i]; lz2=LA.p[i3+2]+LA.oz[i];
              var dgr=Math.sqrt(lx2*lx2+lz2*lz2);
              var gy2=domeY(Math.min(dgr,MND_RX))+0.010;
              if(LA.cy[i]<=gy2){ LA.cy[i]=gy2; LA.md[i]=2; LA.tm[i]=2+sdv*5; }
              ly2=LA.cy[i]; si=1; tumble=3;
            } else if(LA.md[i]===2){
              LA.tm[i]-=sdt;
              if(LA.tm[i]<=0){ LA.md[i]=3; LA.tm[i]=1; }
              lx2=LA.p[i3]+LA.ox[i]; lz2=LA.p[i3+2]+LA.oz[i]; ly2=LA.cy[i];
              si=1; flat=true;
            } else {
              LA.tm[i]-=sdt*0.28;                /* the ground takes it back */
              si=Math.max(0, LA.tm[i]);
              LA.cy[i]-=sdt*0.004;
              lx2=LA.p[i3]+LA.ox[i]; lz2=LA.p[i3+2]+LA.oz[i]; ly2=LA.cy[i];
              flat=true;
            }
          }
          if(flat){
            _e.set(-Math.PI/2+(sdv-0.5)*0.5, sdv*TAU, 0);
            _q.setFromEuler(_e);
          } else {
            _q.set(LA.q[i4],LA.q[i4+1],LA.q[i4+2],LA.q[i4+3]);
            _e.set(Math.sin(simT*(1.3+sdv*1.9)+sdv*37)*gust*tumble, 0,
                   Math.sin(simT*(1.1+sdv*1.6)+sdv*53)*gust*0.6*tumble);
            _q2.setFromEuler(_e); _q.multiply(_q2);
          }
          _s.setScalar(LA.s[i]*si);
          _m.compose(_tv.set(lx2,ly2,lz2), _q, _s);
          lvl.leafMesh.setMatrixAt(i,_m);
        }
        lvl.leafMesh.instanceMatrix.needsUpdate=true;
      }
    }
    if(lvl.bladeMat){ mixC(w,SEA.blade,_c); _c.lerp(_white, effSnow*0.7); lvl.bladeMat.color.copy(_c); }
    if(lvl.groundMat){ mixC(w,SEA.gnd,_c); _c.lerp(_white, effSnow*0.4); lvl.groundMat.color.copy(_c); }
    if(lvl.barkMat) lvl.barkMat.color.setRGB(1+effSnow*0.5, 1+effSnow*0.55, 1+effSnow*0.7);

    mixC(w,SEA.sunC,_c); sun.color.copy(_c);
    sun.intensity=mixN(w,SEA.sunI);
    mixC(w,SEA.hemiS,_c); hemi.color.copy(_c);
    mixC(w,SEA.hemiG,_c); hemi.groundColor.copy(_c);
    hemi.intensity=mixN(w,SEA.hemiI);

    /* the star's height is the season's; its driving of the sun is shared
       with the moon, below */
    if(lvl.star) lvl.star.position.y=mixN(w,SEA.starY);

    /* the opening sun — a warm pool on the grass, strongest in high
       summer, buried by snow, gone as the year turns away */
    var sunK=0;
    if(lvl.sunPatch){
      sunK=clamp((mixN(w,SEA.sunI)-0.85)/0.85, 0, 1);
      lvl.sunPatch.opacity=0.92*sunK*(1-effSnow*0.85);
      if(lvl.starLight) lvl.starLight.intensity=0.35+0.75*sunK;
    }
    /* the shaft leans from the pulsar to the pool; its haze is the season's */
    if(lvl.sunBeam && lvl.sunAim){
      _tv.copy(lvl.sunAim); world.localToWorld(_tv);
      lvl.sunBeam.lookAt(_tv);
      var shOn=sunK>0.02 && effSnow<0.9;
      lvl.sunBeam.visible=shOn;
      if(shOn){
        var shI=(0.20+1.40*sunK)*(1-effSnow*0.9);
        lvl.sunBeamIn.uniforms.uIntensity.value=shI;
        lvl.sunBeamIn.uniforms.uTime.value=simT;
      }
    }
    /* the pulsar keeps its beat — a hard white flash, a long icy decay.
       the light it throws stays yellow; the roots answer from below */
    var pulse=0;
    if(lvl.pulsar){
      var pb=(simT*0.42)%1;
      pulse=Math.exp(-pb*6.5);
      lvl.pulsar.hot.opacity=0.55+0.45*pulse;
      lvl.pulsar.tnd.opacity=0.30+0.55*pulse;
      lvl.pulsar.spr.material.rotation=simT*0.05;
      var psc=0.36+0.10*pulse;
      lvl.pulsar.spr.scale.set(psc,psc,1);
      if(lvl.starLight) lvl.starLight.intensity*=(0.78+0.40*pulse);
    }
    if(lvl.rootMat) lvl.rootMat.emissiveIntensity=0.30+0.35*pulse;
    if(lvl.rootTips) lvl.rootTips.opacity=0.35+0.45*pulse;

    /* the roots drift, the way weed does in still water — every vertex
       swaying about the place it grew, more the deeper it hangs */
    if(lvl.rootSway){
      var RS2=lvl.rootSway, rpos=RS2.geo.attributes.position.array, rbase=RS2.base;
      var rgi, rvi;
      for(rgi=0;rgi<RS2.ranges.length;rgi++){
        var rg=RS2.ranges[rgi];
        for(rvi=rg.v0;rvi<rg.v1;rvi++){
          var bY=rbase[rvi*3+1];
          var wgt=clamp((-0.205-bY)*3.8, 0, 1);
          rpos[rvi*3]  =rbase[rvi*3]  +Math.sin(simT*rg.sp+rg.ph+bY*6.0)*0.020*wgt;   /* the wind reaches even here */
          rpos[rvi*3+2]=rbase[rvi*3+2]+Math.cos(simT*rg.sp*0.85+rg.ph*1.3+bY*5.0)*0.016*wgt;
        }
      }
      RS2.geo.attributes.position.needsUpdate=true;
    }

    /* winter takes the grass down into the ground, blade by blade */
    if(lvl.bladeAnim){
      var BA=lvl.bladeAnim, G=mixN(w,[1,1,0.85,0.05]);
      if(Math.abs(G-BA.last)>0.004){
        BA.last=G;
        for(i=0;i<BA.n;i++){
          var bk=clamp((G-BA.sd[i]*0.25)*1.35, 0, 1);
          _q.set(BA.q[i*4],BA.q[i*4+1],BA.q[i*4+2],BA.q[i*4+3]);
          _s.set(BA.sx[i], BA.sy[i]*Math.max(bk,0.02), 1);
          _m.compose(_tv.set(BA.p[i*3],BA.p[i*3+1],BA.p[i*3+2]), _q, _s);
          BA.mesh.setMatrixAt(i,_m);
        }
        BA.mesh.instanceMatrix.needsUpdate=true;
      }
    }

    /* the raven — mostly a silhouette with opinions. now and then, wings */
    if(lvl.raven){
      var RV=lvl.raven;
      if(RV.t0<0 && simT>RV.next){ RV.t0=simT; RV.beats=2+((Math.random()*2)|0); }
      if(RV.t0>=0){
        var rk=(simT-RV.t0)/0.38;
        if(rk>=RV.beats){
          RV.t0=-1; RV.next=simT+6+Math.random()*10;
          RV.wl.rotation.z=-0.10; RV.wr.rotation.z=-0.10;
          RV.g.position.y=RV.y0;
        } else {
          var ra=Math.abs(Math.sin(rk*Math.PI))*1.15;
          RV.wl.rotation.z=-0.10+ra; RV.wr.rotation.z=-0.10+ra;
          RV.g.position.y=RV.y0+ra*0.004;
        }
      }
    }

    if(lvl.cloudMat){
      lvl.cloudMat.uniforms.uOp.value=mixN(w,SEA.cloud);
      lvl.cloudMat.uniforms.uT.value=simT;
      lvl.cloudMat.uniforms.uPx.value=Math.min(2, window.devicePixelRatio||1);
    }

    /* petals in spring, leaves in autumn */
    var autW=mixN(w,[0,0,1,0]);
    if(lvl.driftMat){
      var dop=mixN(w,SEA.drift);
      lvl.driftMat.uniforms.uOp.value=dop;
      lvl.driftMat.uniforms.uLeaf.value=autW;
      lvl.driftMat.uniforms.uT.value=simT;
      lvl.driftMat.uniforms.uPx.value=Math.min(2, window.devicePixelRatio||1);
      mixC(w,SEA.dC1,_c); lvl.driftMat.uniforms.uC1.value.copy(_c);
      mixC(w,SEA.dC2,_c); lvl.driftMat.uniforms.uC2.value.copy(_c);
      if(dop>0.02 && lvl.driftSim){
        var dp2=lvl.driftSim.p, dsp2=lvl.driftSim.sp, dph2=lvl.driftSim.ph;
        for(i=0;i<DN;i++){
          f3=i*3;
          dp2[f3+1]-=sdt*(0.05+dsp2[i]*0.07);
          dp2[f3]  +=Math.sin(simT*1.1+dph2[i])*sdt*0.06;
          dp2[f3+2]+=Math.cos(simT*0.9+dph2[i]*1.3)*sdt*0.06;
          var dd2=Math.sqrt(dp2[f3]*dp2[f3]+dp2[f3+2]*dp2[f3+2]);
          if(dp2[f3+1]<domeY(Math.min(dd2,MND_RX))+0.02) lvl.driftSim.respawn(f3);
        }
        lvl.driftGeo.attributes.position.needsUpdate=true;
      }
    }

    /* rarely, in autumn, the tree lets one egg go — it falls, rests in
       the grass a while, unbroken, and then the tree takes it back */
    if(lvl.eggs){
      if(!lvl.eggFall && autW>0.45 && Math.random()<dt*0.05){
        var ie=(Math.random()*lvl.eggs.n)|0, hm0=lvl.eggs.home[ie];
        lvl.eggFall={ i:ie, x:hm0.x, y:hm0.y, z:hm0.z, vy:0, rest:0 };
      }
      if(lvl.eggFall){
        var ef=lvl.eggFall, hm=lvl.eggs.home[ef.i], moved=true;
        if(!ef.rest){
          ef.vy-=dt*1.3; ef.y+=ef.vy*dt;
          var egy=domeY(Math.min(Math.sqrt(ef.x*ef.x+ef.z*ef.z),MND_RX))+0.016;
          if(ef.y<=egy){ ef.y=egy; ef.rest=pn+9000+Math.random()*9000; }
        } else if(pn>ef.rest){
          ef.y+=(hm.y-ef.y)*Math.min(1,dt*1.4);
          if(Math.abs(hm.y-ef.y)<0.003){ ef.y=hm.y; lvl.eggFall=null; }
        } else moved=false;
        if(moved){
          _q.identity(); _s.setScalar(lvl.eggs.scl[ef.i]);
          _m.compose(_tv.set(ef.x, ef.y, ef.z), _q, _s);
          lvl.eggs.mesh.setMatrixAt(ef.i,_m);
          lvl.eggs.mesh.instanceMatrix.needsUpdate=true;
        }
      }
    }
  }

  /* whatever hangs the light — the orchard's star, the sea's moon — the
     shadow sun takes its direction from it every frame; drag the globe and
     the shadows swing */
  if(lvl.star){
    lvl.star.getWorldPosition(_sv);
    _tv.set(0, BY+lvl.gy, 0);
    sun.position.copy(_sv).sub(_tv).normalize().multiplyScalar(3).add(_tv);
    sun.target.position.copy(_tv);
    if(lvl.starGlow) lvl.starGlow.opacity=0.5+0.22*Math.sin(pn*0.004);
  }

  /* the sea lives: waves in the shader, the beam on its rounds, the lamp
     breathing, small waves reaching the shore of the sound */
  if(level===1){
    if(lvl.beam){ lvl.beam.rotation.y+=sdt*0.45;
      if(lvl.beamIn){
        lvl.beamIn.uniforms.uTime.value=simT; lvl.beamOut.uniforms.uTime.value=simT;
        var bi=0.72+0.16*Math.sin(pn*0.0021);
        lvl.beamIn.uniforms.uIntensity.value=bi;
        lvl.beamOut.uniforms.uIntensity.value=bi;
      } }
    if(lvl.water){ lvl.water.uniforms.uT.value=simT;
      if(lvl.beam) lvl.water.uniforms.uBeamA.value=lvl.beamA0+lvl.beam.rotation.y; }
    if(lvl.lampGlow) lvl.lampGlow.opacity=0.5+0.18*Math.sin(pn*0.011);
    if(lvl.seaGlints && lvl.star){
      var SG2=lvl.seaGlints,
          mAz=Math.atan2(lvl.star.position.z, lvl.star.position.x), sgj;
      for(sgj=0;sgj<SG2.n;sgj++){
        var g5=sgj*3;
        var gA2=Math.pow(Math.max(0, Math.cos(SG2.az[sgj]-mAz)), 8);
        var tw2=Math.max(0, Math.sin(simT*(4.5+SG2.ph[sgj])+SG2.ph[sgj]*3));
        var sgA=(0.03+0.80*gA2)*(0.25+0.75*tw2*tw2);
        SG2.col[g5]=0.87*sgA; SG2.col[g5+1]=0.93*sgA; SG2.col[g5+2]=1.0*sgA;
      }
      SG2.geo.attributes.color.needsUpdate=true;
    }
    if(lvl.eye){
      var EY=lvl.eye;
      if(EY.t0<0 && simT>EY.next) EY.t0=simT;
      if(EY.t0>=0){
        var bk=(simT-EY.t0)/0.24;
        if(bk>=1){ EY.t0=-1; EY.next=simT+4+Math.random()*9; EY.spr.scale.set(0.105,0.105,1); }
        else EY.spr.scale.set(0.105, 0.105*(1-0.92*Math.sin(bk*Math.PI)), 1);
      }
    }
    /* the fish — pale gradients under the skin of the water: a school on
       its patient round, loners stooping to the glass floor and back */
    if(lvl.fish){
      var FS=lvl.fish.list, fi;
      for(fi=0;fi<lvl.fish.n;fi++){
        var fsh=FS[fi];
        fsh.a += sdt*fsh.sp*fsh.sg*(1+0.2*Math.sin(simT*0.6+fsh.ph));
        var dphase=simT*fsh.ds+fsh.dph;
        var fB=(fi>=20)? -0.26 : -0.09;      /* the small fish live a band lower */
        var fy=Math.max(-0.92, WATER_Y+fB-fsh.dAmp*(0.5+0.5*Math.sin(dphase)));
        var vy=-fsh.dAmp*0.5*Math.cos(dphase)*fsh.ds;
        var rl=Math.sqrt(Math.max(0.02, 1-fy*fy))-0.10;   /* the glass says how far */
        var rMin=(fy<-0.60)? 0.14 : 0.30;                  /* below the island, the middle opens */
        fsh.r += Math.sin(simT*0.21+fsh.ph*2.1)*sdt*0.010;
        fsh.r = clamp(fsh.r, rMin, Math.max(rMin+0.02, Math.min((fi<12?0.55:(fi>=20?0.50:0.72)), rl)));
        var fx=Math.cos(fsh.a)*fsh.r, fz=Math.sin(fsh.a)*fsh.r;
        var yaw=Math.atan2(-Math.cos(fsh.a)*fsh.sg, -Math.sin(fsh.a)*fsh.sg)
               +Math.sin(simT*7*fsh.wob+fsh.ph)*0.20;
        var pitch=clamp(Math.atan2(vy, Math.max(0.02, fsh.r*fsh.sp))*0.8, -0.55, 0.55);
        _q.setFromAxisAngle(_tv.set(0,1,0), yaw);
        _q2.setFromAxisAngle(_sv.set(0,0,1), pitch);
        _q.multiply(_q2);
        _q2.setFromAxisAngle(_sv.set(1,0,0), Math.sin(simT*4.2+fsh.ph)*0.10);
        _q.multiply(_q2);
        fsh.m.position.set(fx, fy, fz);
        fsh.m.quaternion.copy(_q);
      }
    }
    if(AC&&SND&&pn>seaLapT){ seaLapT=pn+5200+Math.random()*4800;
      waveSwell(0, 0.7, 2.2, 0.032, 130, 650, (Math.random()<0.5?-0.3:0.3)); }
  }

  /* the cave lives — outside and in: the warmth never quite steady,
     embers wandering, the roof letting go one drop at a time */
  if(level>=2 && level<=4){
    if(lvl.caveWarm) lvl.caveWarm.intensity=(lvl.warmBase||1)*(0.85+0.20*Math.sin(simT*9.1)+0.10*Math.sin(simT*23.7+2.0));
    if(lvl.mouthGlow) lvl.mouthGlow.opacity=0.52+0.16*Math.sin(simT*7.3+1.2);
    if(lvl.flame){
      var FL=lvl.flame;
      if(simT>FL.gustT){                       /* now and then the air moves */
        FL.gustT=simT+2.5+Math.random()*6;
        FL.gust=0.9;
      }
      FL.gust*=Math.pow(0.25, sdt);
      if(FL.live){ var lv2; for(lv2=0;lv2<FL.live.length;lv2++) FL.live[lv2].update(simT, FL.gust); }
      var fbr=1+0.06*Math.sin(simT*0.9)+FL.gust*0.35*Math.sin(simT*18.0);
      var ff;
      for(ff=0;ff<FL.list.length;ff++){
        var FT=FL.list[ff];
        var fk=0.82+0.14*Math.sin(simT*FT.f1+FT.ph)
                   +0.08*Math.sin(simT*FT.f2+FT.ph*2.3)
                   +FL.gust*0.18*Math.sin(simT*13.1+FT.ph*5);
        FT.spr.scale.set(FT.sx*(1.08-fk*0.14), FT.sy*fk*fbr, 1);
        FT.spr.material.opacity=FT.op*(0.72+0.30*fk);
        FT.spr.material.rotation=(FT.rot0||0)+Math.sin(simT*(6.3+ff*1.7)+FT.ph)*(0.09+FL.gust*0.10);
        if(FT.dr){                              /* the big tongues walk slowly round the heart */
          FT.spr.position.x=FT.bx+Math.cos(simT*FT.dw+FT.ph)*FT.dr;
          FT.spr.position.z=FT.bz+Math.sin(simT*FT.dw*0.8+FT.ph)*FT.dr;
        }
      }
    }
    if(lvl.passer){
      var PS=lvl.passer;
      if(PS.t0<0 && simT>PS.next){
        PS.t0=simT;
        PS.a0=Math.random()*TAU;
        PS.dir=(Math.random()<0.5?-1:1);
      }
      if(PS.t0>=0){
        var pk=(simT-PS.t0)/2.4;
        if(pk>=1){ PS.t0=-1; PS.next=simT+8+Math.random()*14; PS.spr.material.opacity=0; }
        else {
          var pa=PS.a0+PS.dir*pk*1.5;
          PS.spr.position.set(Math.sin(pa)*0.76, -0.18+0.06*Math.sin(pk*Math.PI), Math.cos(pa)*0.76);
          PS.spr.material.opacity=0.5*Math.sin(pk*Math.PI);
        }
      }
    }
    /* the fire speaks in small dry syllables — inside it, in sentences */
    if(AC && SND && pn>crackleT){
      crackleT=pn+(level===4? 110+Math.random()*480 : 200+Math.random()*950);
      waveSwell(0, 0.004, 0.08,
        (level===4?0.032: level===3?0.020:0.008)*(0.5+Math.random()),
        340+Math.random()*700, 160+Math.random()*280, (Math.random()*2-1)*0.4);
    }
    if(lvl.embers){
      var EM=lvl.embers, ep=EM.geo.attributes.position.array, ei3;
      for(ei3=0;ei3<EM.n;ei3++){
        var e3=ei3*3;
        ep[e3]  +=Math.sin(simT*(0.5+EM.ph[ei3]*0.4)+EM.ph[ei3]*7)*sdt*0.022;
        ep[e3+1]+=sdt*(EM.vy||1)*(0.010+EM.sp[ei3]*0.014);
        ep[e3+2]+=Math.cos(simT*0.4+EM.ph[ei3]*5)*sdt*0.020;
        if(ep[e3+1]>EM.y1){
          ep[e3]=EM.cx+(Math.random()-0.5)*(EM.sx||0.34);
          ep[e3+1]=EM.y0;
          ep[e3+2]=EM.cz+(Math.random()-0.5)*(EM.sz||0.22);
        }
      }
      EM.geo.attributes.position.needsUpdate=true;
      EM.mat.opacity=0.60+0.25*Math.sin(simT*3.1);
    }
    if(lvl.drips){
      var DR=lvl.drips, dpp=DR.geo.attributes.position.array, di3;
      for(di3=0;di3<DR.n;di3++){
        var d3=di3*3;
        DR.v[di3]+=sdt*1.4;
        dpp[d3+1]-=DR.v[di3]*sdt;
        if(dpp[d3+1]<DR.y1){
          if(lvl.rings){                        /* the floor answers where it lands */
            var RG2=lvl.rings.list[lvl.rings.i];
            lvl.rings.i=(lvl.rings.i+1)%lvl.rings.list.length;
            RG2.m.position.set(dpp[d3], DR.y1+0.004, dpp[d3+2]);
            RG2.t0=simT;
          }
          dpp[d3]=DR.x0[di3]; dpp[d3+1]=DR.y0[di3]; dpp[d3+2]=DR.z0[di3]; DR.v[di3]=0;
          if(AC&&SND&&Math.random()<0.25)
            waveSwell(0, 0.02, 0.35, 0.012, 900, 2600, (Math.random()<0.5?-0.2:0.2));
        }
      }
      DR.geo.attributes.position.needsUpdate=true;
    }
    if(lvl.glint) lvl.glint.opacity=0.16+0.10*Math.sin(simT*1.7)+0.06*Math.sin(simT*5.3+1.1);
    /* the smoke climbs on its own slow clock, each puff born small at the
       fire and let go wide and thin */
    if(lvl.smoke){
      var SMK=lvl.smoke, smx;
      for(smx=0;smx<SMK.list.length;smx++){
        var SP2=SMK.list[smx];
        var smk2=((simT*SP2.sp)+SP2.ph)%1;
        var sscale=SP2.s0*(0.6+SMK.grow*smk2);
        SP2.spr.scale.set(sscale, sscale*1.15, 1);
        SP2.spr.position.set(SMK.x+Math.sin(simT*0.5+SP2.wx)*0.03*(0.3+smk2),
                             SMK.y0+smk2*SMK.rise,
                             SMK.z+Math.cos(simT*0.4+SP2.wx*1.3)*0.03*(0.3+smk2));
        SP2.spr.material.opacity=SMK.op*Math.sin(Math.PI*smk2)*(0.8+0.2*Math.sin(simT*1.3+SP2.wx));
        SP2.spr.material.rotation=SP2.wx+simT*0.15*(SP2.ph>0.5?1:-1);
      }
    }
    /* the cracks keep the fire's pulse — never quite steady, like the warmth */
    if(lvl.crackGlow) lvl.crackGlow.opacity=0.18+0.12*Math.sin(simT*9.1)+0.05*Math.sin(simT*23.7+2.0);
    if(lvl.breath){
      var BR=lvl.breath, brx;
      for(brx=0;brx<BR.list.length;brx++){
        var BP=BR.list[brx];
        var brk=((simT*BP.sp)+BP.ph)%1;
        var brsc=0.05+0.16*brk;
        BP.spr.scale.set(brsc, brsc*0.8, 1);
        BP.spr.position.set(BR.x+Math.sin(simT*0.6+BP.wx)*0.02,
                            BR.y+brk*0.10+0.015*Math.sin(simT*0.8+BP.wx),
                            BR.z+brk*0.26);
        BP.spr.material.opacity=0.10*Math.sin(Math.PI*brk);
        BP.spr.material.rotation=BP.wx+simT*0.1;
      }
    }
    if(lvl.worms) lvl.worms.opacity=0.30+0.22*Math.sin(simT*1.3)+0.10*Math.sin(simT*4.7+2.0);
    /* end cave-family drives */
    if(lvl.rings){
      var rr2;
      for(rr2=0;rr2<lvl.rings.list.length;rr2++){
        var RGx=lvl.rings.list[rr2];
        if(RGx.t0<0) continue;
        var rk2=(simT-RGx.t0)/0.9;
        if(rk2>=1){ RGx.t0=-1; RGx.m.material.opacity=0; continue; }
        RGx.m.scale.setScalar(0.02+rk2*0.085);
        RGx.m.material.opacity=0.30*(1-rk2);
      }
    }
  }

  /* from within, one full look-around and the orchard takes you back —
     the turn is the door; the dolls never end */
  if(inside && !crossing && insideTurnAcc>5.6){
    insideTurnAcc=0;
    beginCross();
  }
  if(!inside) insideTurnAcc=0;

  /* the wave lives — the light asking itself, both answers at once */
  if(level===5){
    if(lvl.srcGlow) lvl.srcGlow.opacity=0.65+0.18*Math.sin(simT*0.8)+0.06*Math.sin(simT*3.7);
    if(lvl.waveFloor) lvl.waveFloor.opacity=0.12+0.06*Math.sin(simT*0.7)+0.03*Math.sin(simT*2.3);
    if(lvl.waveRings){
      var wv2;
      for(wv2=0;wv2<lvl.waveRings.length;wv2++){
        var WR=lvl.waveRings[wv2];
        var wk=((simT/3.4)+WR.off)%1;
        WR.m.scale.setScalar(0.03+wk*0.85);
        WR.m.material.opacity=0.30*(1-wk)*(0.4+0.6*Math.min(1,wk*6));
      }
    }
    if(lvl.ribbon){
      var RB=lvl.ribbon, rp2=RB.geo.attributes.position.array, rb2;
      for(rb2=0;rb2<RB.n;rb2++){
        var ra2=rb2/RB.n*TAU;
        rp2[rb2*3+1]=-0.05+0.10*Math.sin(ra2*5-simT*2.2)+0.04*Math.sin(ra2*9+simT*1.4);
      }
      RB.geo.attributes.position.needsUpdate=true;
      if(RB.glow){
        var gp2=RB.glow.attributes.position.array, gb3;
        for(gb3=0;gb3<RB.gn;gb3++){
          var ga2=gb3/RB.gn*TAU;
          gp2[gb3*3+1]=-0.05+0.10*Math.sin(ga2*5-simT*2.2)+0.04*Math.sin(ga2*9+simT*1.4);
        }
        RB.glow.attributes.position.needsUpdate=true;
      }
    }
    if(lvl.ribbon2){
      var RW2=lvl.ribbon2, qw2=RW2.geo.attributes.position.array, qb;
      for(qb=0;qb<RW2.n;qb++){
        var qa=qb/RW2.n*TAU;
        qw2[qb*3+1]=RW2.y+0.055*Math.sin(qa*3+simT*2.6)+0.022*Math.sin(qa*8-simT*1.1);
      }
      RW2.geo.attributes.position.needsUpdate=true;
    }
    if(lvl.ribbon3){
      var RW3=lvl.ribbon3, qw3=RW3.geo.attributes.position.array, qc;
      for(qc=0;qc<RW3.n;qc++){
        var qd=qc/RW3.n*TAU;
        qw3[qc*3+1]=RW3.y+0.075*Math.sin(qd*7-simT*1.5)+0.028*Math.sin(qd*11+simT*0.9);
      }
      RW3.geo.attributes.position.needsUpdate=true;
    }
    if(lvl.photons){
      var PH=lvl.photons, pp2=PH.geo.attributes.position.array, ph2;
      for(ph2=0;ph2<PH.n;ph2++){
        PH.t[ph2]+=sdt*PH.sp[ph2];
        if(PH.t[ph2]>1){                       /* arrived; the source lets go another */
          PH.t[ph2]-=1;
          var nv=new T.Vector3((Math.random()*2-1),(Math.random()*2-1)*0.8,(Math.random()*2-1)).normalize();
          PH.dx[ph2]=nv.x; PH.dy[ph2]=nv.y; PH.dz[ph2]=nv.z;
        }
        var pr=PH.t[ph2]*0.85;
        pp2[ph2*3]  =PH.sx+PH.dx[ph2]*pr;
        pp2[ph2*3+1]=PH.sy+PH.dy[ph2]*pr;
        pp2[ph2*3+2]=PH.sz+PH.dz[ph2]*pr;
      }
      PH.geo.attributes.position.needsUpdate=true;
      if(PH.tail){
        var tlp=PH.tail.attributes.position.array, th3;
        for(th3=0;th3<PH.n;th3++){
          var tpr=Math.max(0, PH.t[th3]-0.055)*0.85;
          tlp[th3*3]  =PH.sx+PH.dx[th3]*tpr;
          tlp[th3*3+1]=PH.sy+PH.dy[th3]*tpr;
          tlp[th3*3+2]=PH.sz+PH.dz[th3]*tpr;
        }
        PH.tail.attributes.position.needsUpdate=true;
      }
    }
  }

  /* the snow answers the turning — tiny high sparkles riding the spin,
     whatever world is in the glass */
  var spn=Math.abs(turn.rotation.y-turnPrevY)/Math.max(dt,1e-4);
  if(AC && SND && !inside && spn>0.35 && pn>nextSpark){
    nextSpark=pn+50+Math.random()*180/Math.min(2,spn);
    waveSwell(0, 0.015, 0.16, Math.min(0.028, 0.006+spn*0.009),
      3400+Math.random()*2200, 4600+Math.random()*2600, (Math.random()*2-1)*0.5);
  }

  /* the light globe's dust — the old physics, whole */
  var settled=1;
  if(lightOn){
    /* fast turning wakes the sediment into a swirl */
    spinRate=Math.abs(turn.rotation.y-turnPrevY)/Math.max(dt,1e-4);
    if(spinRate>SWIRL_W){
      var frac=clamp((spinRate-SWIRL_W)*0.4,0,0.5), i2;
      for(i2=0;i2<NS;i2++){
        if(fMode[i2]===0 && Math.random()<frac*dt*8){
          _p.set(px[i2*3],px[i2*3+1],px[i2*3+2]);
          _vv.copy(spinAxis).multiplyScalar(spinRate*0.35).cross(_p);
          fMode[i2]=1; fSt[i2]=0.5+Math.random()*0.8; fTint[i2]=0;
          vx[i2*3]+=_vv.x; vx[i2*3+1]+=Math.abs(_vv.y)*0.4+0.15; vx[i2*3+2]+=_vv.z;
        }
      }
    }
    /* sometimes, inside, the grains remember they are a flock — they
       lift from their strata, murmur around a wandering point, and are
       let back down to rain home */
    if(inside){
      if(swarmEnd<0 && tS>swarmNext){ swarmEnd=tS+5+Math.random()*3.5; swarmAx=Math.random()*TAU; }
      if(swarmEnd>0 && tS>swarmEnd){
        swarmEnd=-1; swarmNext=tS+14+Math.random()*16;
        for(i=0;i<NS;i++) if(fMode[i]===2){ fMode[i]=3; fSpd[i]=0.5+Math.random()*0.9; }
      }
      if(swarmEnd>0){
        for(i=0;i<NS;i++)
          if(fMode[i]===0 && Math.random()<dt*1.2){
            fMode[i]=2; fTint[i]=1;
            vx[i*3]=vx[i*3+1]=vx[i*3+2]=0;
          }
      }
    }
    var anyFlash=false;
    for(i=0;i<NS;i++){
      var m=fMode[i], o3=i*3;
      if(aFlash[i]>0){ aFlash[i]=Math.max(0,aFlash[i]-dt*1.4); anyFlash=true; }
      if(m===0){ if(fTint[i]<1)fTint[i]=Math.min(1,fTint[i]+dt*1.8); aTint[i]=fTint[i]; continue; }
      if(m===2){
        var wt2=tS*0.5+swarmAx;
        var ax2=Math.cos(wt2)*0.34+Math.cos(wt2*1.7)*0.12;
        var ay2=-0.02+0.20*Math.sin(wt2*0.8);
        var az2=Math.sin(wt2*1.13)*0.34+Math.sin(wt2*0.63)*0.12;
        var ddx=ax2-px[o3], ddy=ay2-px[o3+1], ddz=az2-px[o3+2];
        vx[o3]  +=(ddx*1.5 + ddz*1.1)*dt;
        vx[o3+1]+= ddy*1.5*dt + Math.sin(tS*3.1+i)*dt*0.06;
        vx[o3+2]+=(ddz*1.5 - ddx*1.1)*dt;
        vx[o3]*=0.965; vx[o3+1]*=0.965; vx[o3+2]*=0.965;
      } else if(m===1){
        fSt[i]-=dt;
        var sx=Math.sin(px[o3+1]*4.2+tS)      *Math.cos(px[o3+2]*3.1+tS*0.6);
        var sy=Math.sin(px[o3+2]*4.0+tS*1.25) *Math.cos(px[o3]  *3.3);
        var sz=Math.sin(px[o3]  *4.4+tS*0.85) *Math.cos(px[o3+1]*3.0);
        vx[o3]  +=(sy-sz)*dt*0.95 + Math.cos(pn*0.002+i)*dt*0.18;
        vx[o3+1]+=(sz-sx)*dt*0.70 - dt*0.5;
        vx[o3+2]+=(sx-sy)*dt*0.95 + Math.sin(pn*0.0017+i)*dt*0.18;
        vx[o3]*=0.985; vx[o3+1]*=0.985; vx[o3+2]*=0.985;
      } else { /* m===3, raining home at its own speed */
        vx[o3+1]-=dt*0.9*fSpd[i];
        vx[o3]*=0.96; vx[o3+2]*=0.96; vx[o3+1]*=0.985;
        px[o3]  += (bx[o3]  -px[o3]  )*dt*0.6*fSpd[i];
        px[o3+2]+= (bx[o3+2]-px[o3+2])*dt*0.6*fSpd[i];
      }
      px[o3]+=vx[o3]*dt; px[o3+1]+=vx[o3+1]*dt; px[o3+2]+=vx[o3+2]*dt;
      var rr2=px[o3]*px[o3]+px[o3+1]*px[o3+1]+px[o3+2]*px[o3+2];
      if(rr2>0.9025){ var rl2=Math.sqrt(rr2),nx=px[o3]/rl2,ny=px[o3+1]/rl2,nz=px[o3+2]/rl2;
        var dp=vx[o3]*nx+vx[o3+1]*ny+vx[o3+2]*nz;
        vx[o3]-=1.6*dp*nx; vx[o3+1]-=1.6*dp*ny; vx[o3+2]-=1.6*dp*nz;
        px[o3]=nx*0.945; px[o3+1]=ny*0.945; px[o3+2]=nz*0.945; }
      if(m===1){ if(fSt[i]<=0)fMode[i]=3; }
      else if(px[o3+1]<=bx[o3+1]){
        px[o3]=px[o3]*0.4+bx[o3]*0.6; px[o3+1]=bx[o3+1]; px[o3+2]=px[o3+2]*0.4+bx[o3+2]*0.6;
        vx[o3]=vx[o3+1]=vx[o3+2]=0; fMode[i]=0; fTint[i]=0;
        aFlash[i]=1.0; anyFlash=true;
      }
      aTint[i]=fTint[i];
    }
    dustGeo.attributes.position.needsUpdate=true;
    dustGeo.attributes.aTint.needsUpdate=true;
    if(anyFlash) dustGeo.attributes.aFlash.needsUpdate=true;
    dustMat.uniforms.uT.value=tS;
    dustMat.uniforms.uFlk.value=flk;
    dustMat.uniforms.uPx.value=Math.min(2, window.devicePixelRatio||1);
    settled=settled01();

    var rj; for(rj=0;rj<ridges.children.length;rj++)
      ridges.children[rj].material.opacity = 0.10*settled*(0.7+0.3*Math.sin(pn*0.0016+rj*0.9));
    var rayGate=ez(clamp((settled-0.6)/0.32,0,1))*(0.55+0.45*flk);
    for(rj=0;rj<rayMats.length;rj++)
      rayMats[rj].opacity = RAY_A*rayGate*(0.7+0.3*Math.sin(pn*0.004+rj*1.7));
    rays.rotation.y+=dt*0.05;
    rays.rotation.z=(flame?flame.sway:0)*0.04;
    shard.rotation.x+=dt*0.11; shard.rotation.y+=dt*0.07;
    shardGlow.material.opacity = 0.22 + 0.28*flk + 0.25*rayGate;

    if(sndStormy && settled>0.96){ sndStormy=false; sndSettleChord(); }
  }
  /* the flaws catch the room — speculars travelling as the glass turns */
  if(bubbles.visible){
    var bry=turn.rotation.y, byc=Math.cos(bry), bys=Math.sin(bry);
    _bH.copy(camera.position).sub(anchor.position).normalize().add(_bL).normalize();
    var bhx=_bH.x, bhy=_bH.y, bhz=_bH.z, bj;
    for(bj=0;bj<BUBN;bj++){
      var b4=bj*3;
      var nx2= bbDir[b4]*byc+bbDir[b4+2]*bys;
      var nz2=-bbDir[b4]*bys+bbDir[b4+2]*byc;
      var bd2=nx2*bhx+bbDir[b4+1]*bhy+nz2*bhz;
      var bsp=bd2>0? Math.pow(bd2,60) : 0;
      var bA=0.045+0.030*Math.sin(pn*0.004+bbSd[bj])+1.3*bsp;
      if(bA>1) bA=1;
      bbCol[b4]=0.85*bA; bbCol[b4+1]=0.91*bA; bbCol[b4+2]=1.0*bA;
    }
    bbGeo.attributes.color.needsUpdate=true;
  }
  turnPrevY=turn.rotation.y;

  /* the globe turns on its own, unhurried; the bed of light turns with it */
  if(!reduced){
    turn.rotation.y += dt*AUTO_TURN;
    dustSpin.rotation.y += dt*AUTO_TURN;
    if(inside && !crossing) insideAng += dt*0.02;
  }

  /* the world whites out as the charge climbs — but never during the
     crossing itself; the camera is in there */
  mist.material.opacity = crossing? 0 : (charge*0.5 + stormS*0.10 + arriveBloom*0.22);

  /* the small globe of light beckons */
  if(lvl.miniGlow) lvl.miniGlow.opacity=0.28+0.18*Math.sin(pn*0.0016)+charge*0.35+crossGlow;

  /* the mist breathes; the inner sky drifts and warms — nothing else
     stands between you and the grains */
  if(inside){
    inMist.material.opacity = 0.38 + 0.12*flk;
    innerSky.rotation.y+=dt*0.006;
    innerSky.material.color.setRGB(1.0, 1.0-flk*0.025, 1.0-flk*0.06);
  }

  /* the sound keeps time with the weather */
  if(AC&&SND){
    try{
      ambG.gain.setTargetAtTime(0.007+0.004*Math.sin(pn*0.0003), AC.currentTime, 0.3);
      stormG.gain.setTargetAtTime(stormS*0.05, AC.currentTime, 0.1);
      stormF.frequency.setTargetAtTime(480+stormS*900, AC.currentTime, 0.1);
      rumG.gain.setTargetAtTime(charge*0.045, AC.currentTime, 0.15);
    }catch(e){}
  }

  /* the crossing — no longer a blink. the camera slips in through the
     glass, rides one slow round inside while the world's clock hurries,
     then dives for the little globe; the white is saved for the last
     breath, so nothing of the scene is wasted on the way down */
  var vc=0;
  if(crossing){
    if(!crossDive){
      /* rising out of the inside, or reduced motion: the old gentle veil */
      var ct=(pn-crossT0)/2000;
      if(ct<0.5){ placeCamera(); vc=ez(ct/0.5); }
      else {
        if(!crossSwapped){ crossSwapped=true; crossEnd(); }
        placeCamera(); vc=1-ez((ct-0.5)/0.5);
      }
      if(ct>=1){ crossing=false; vc=0; }
    } else {
      var TA=1.6, TB=6.6, TC=2.7, TD=1.0;       /* approach, round, dive, reveal */
      var te=(pn-crossT0)/1000;
      var oR=0.55;                              /* the orbit's reach inside the glass */
      if(te<TA){
        /* through the glass — from wherever you stood to the orbit's door */
        var s0=ez(te/TA);
        _sv.set(crossC.x, crossC.y+0.02, crossC.z+oR);
        camera.position.lerpVectors(camFrom, _sv, s0);
        _tv.set(0, BY-0.05, 0).lerp(crossC, s0);
        camera.lookAt(_tv);
        simSpeed=1+0.6*s0;
        /* the glass kiss — the shell notices you a breath before you
           pass, and blooms a ripple in its own limb colours */
        if(!crossPierced){
          _dp.set(0,BY,0);
          if(camera.position.distanceTo(_dp)<=1.30){
            crossPierced=true; kissT0=pn;
            _dv.copy(camera.position).sub(_dp).normalize();   /* the radial at the strike */
            _du.set(0,1,0).cross(_dv);
            if(_du.lengthSq()<1e-4) _du.set(1,0,0);
            _du.normalize();
            _dw.copy(_dv).cross(_du);
            var sk3;
            for(sk3=0;sk3<SKN;sk3++){
              var ska=Math.random()*TAU, skr=Math.sqrt(Math.random())*0.05;
              var sc1=Math.cos(ska), sc2=Math.sin(ska), o6=sk3*3;
              var sx3=_dv.x+(_du.x*sc1+_dw.x*sc2)*skr;
              var sy3=_dv.y+(_du.y*sc1+_dw.y*sc2)*skr;
              var sz3=_dv.z+(_du.z*sc1+_dw.z*sc2)*skr;
              var sl3=1/Math.sqrt(sx3*sx3+sy3*sy3+sz3*sz3);
              skS0[o6]=sx3*sl3; skS0[o6+1]=sy3*sl3; skS0[o6+2]=sz3*sl3;
              var ux3=_du.x*sc1+_dw.x*sc2, uy3=_du.y*sc1+_dw.y*sc2, uz3=_du.z*sc1+_dw.z*sc2;
              var ul3=1/Math.max(1e-5,Math.sqrt(ux3*ux3+uy3*uy3+uz3*uz3));
              skU[o6]=ux3*ul3; skU[o6+1]=uy3*ul3; skU[o6+2]=uz3*ul3;
              skDd[sk3]=0.12+Math.random()*0.45;
              skTw[sk3]=Math.random()*TAU;
              var rv=Math.random();                /* the limb's own colours */
              if(rv<0.35){ skB[o6]=0.67; skB[o6+1]=0.47; skB[o6+2]=1.00; }
              else if(rv<0.70){ skB[o6]=0.35; skB[o6+1]=0.82; skB[o6+2]=0.92; }
              else if(rv<0.92){ skB[o6]=0.87; skB[o6+1]=0.92; skB[o6+2]=1.00; }
              else { skB[o6]=1.00; skB[o6+1]=0.33; skB[o6+2]=0.25; }
            }
            sprkPts.visible=true;
            if(AC&&SND) waveSwell(0, 0.03, 0.7, 0.020, 4300, 2400, 0);
          }
        }
      } else if(te<TA+TB){
        /* one slow low round inside — the year runs past at eye level */
        var s1=(te-TA)/TB, e1=ez(s1);
        var az=TAU*e1;
        var orr=oR-0.05*Math.sin(s1*Math.PI);
        camera.position.set(crossC.x+Math.sin(az)*orr,
                            crossC.y+0.02+0.03*Math.sin(s1*TAU),
                            crossC.z+Math.cos(az)*orr);
        _tv.set(crossC.x+Math.sin(az+1.0)*0.10, crossC.y,
                crossC.z+Math.cos(az+1.0)*0.10);
        camera.lookAt(_tv);
        simSpeed=1.6+2.6*ez(Math.min(1,s1*1.6));
        if(!reduced) turn.rotation.y += dt*(simSpeed-1)*0.30;   /* the seasons walk by */
      } else if(te<TA+TB+TC){
        /* the dive — the little globe grows until it is the world */
        var s2=(te-TA-TB)/TC;
        if(!crossSwapped){
          if(lvl.mini) lvl.mini.getWorldPosition(camAim);
          else camAim.set(0,BY,0);              /* into the glass itself */
          _sv.set(crossC.x, crossC.y+0.02, crossC.z+oR);
          camera.position.lerpVectors(_sv, camAim, Math.pow(ez(s2),1.25));
          camera.lookAt(camAim);
          vc=ez(clamp((s2-0.60)/0.32,0,1));
          /* falling light — cool streaks rushing past the lens, faster
             the deeper you go; each one reborn ahead when it is passed */
          _dv.copy(camAim).sub(camera.position);
          var dvl=_dv.length();
          if(dvl>1e-4){
            _dv.multiplyScalar(1/dvl);
            _du.set(0,1,0).cross(_dv);
            if(_du.lengthSq()<1e-4) _du.set(1,0,0);
            _du.normalize();
            _dw.copy(_dv).cross(_du);
            var sl2=0.04+0.18*s2, sj;
            for(sj=0;sj<DSN;sj++){
              dsD[sj]-=dt*dsSp[sj]*(0.6+2.4*s2);
              if(dsD[sj]<0.02) dsD[sj]=1.6+Math.random()*0.4;
              var rr3=dsR[sj]*(0.35+0.65*Math.min(1,dsD[sj]));
              _dp.copy(camera.position)
                 .addScaledVector(_dv, dsD[sj])
                 .addScaledVector(_du, Math.cos(dsA[sj])*rr3)
                 .addScaledVector(_dw, Math.sin(dsA[sj])*rr3);
              var s6=sj*6;
              dsPos[s6]  =_dp.x; dsPos[s6+1]=_dp.y; dsPos[s6+2]=_dp.z;
              dsPos[s6+3]=_dp.x-_dv.x*sl2; dsPos[s6+4]=_dp.y-_dv.y*sl2; dsPos[s6+5]=_dp.z-_dv.z*sl2;
            }
            dsGeo.attributes.position.needsUpdate=true;
            dsMat.opacity=0.30*ez(Math.min(1,s2*2.4))*(1-vc);
            diveStreaks.visible=true;
          }
          /* the pouring — the world sampled from its own surfaces at the
             first breath of the dive: it glitters in place, revealed as
             woven light, then streams grain by grain into the door */
          if(!pourReady){ pourReady=true; buildPour(); }
          if(pourN>0){
            world.matrixWorld.decompose(pourPts.position, pourPts.quaternion, pourPts.scale);
            pourHalo.position.copy(pourPts.position);
            pourHalo.quaternion.copy(pourPts.quaternion);
            pourHalo.scale.copy(pourPts.scale);
            _pourAim.copy(camAim); world.worldToLocal(_pourAim);
            var gateIn=ez(Math.min(1,s2*4)), pi4;
            for(pi4=0;pi4<pourN;pi4++){
              var o8=pi4*3;
              var ppk=ez(clamp((s2*1.35-prDel[pi4])/0.60, 0, 1));
              var omk=1-ppk;
              var thD1=prPh[pi4]+ppk*5.0, thD2=prPh[pi4]*1.7+ppk*11.0;
              var wobD=Math.sin(Math.PI*ppk)*prAm[pi4];
              var hd1=Math.cos(thD1)*wobD+Math.cos(thD2)*wobD*0.4;
              var hd2=Math.sin(thD1)*wobD+Math.sin(thD2)*wobD*0.4;
              prPos[o8]  =omk*omk*prHome[o8]  +2*omk*ppk*prCtl[o8]  +ppk*ppk*_pourAim.x
                          +prPA[o8]*hd1+prPB[o8]*hd2;
              prPos[o8+1]=omk*omk*prHome[o8+1]+2*omk*ppk*prCtl[o8+1]+ppk*ppk*_pourAim.y
                          +prPA[o8+1]*hd1+prPB[o8+1]*hd2;
              prPos[o8+2]=omk*omk*prHome[o8+2]+2*omk*ppk*prCtl[o8+2]+ppk*ppk*_pourAim.z
                          +prPA[o8+2]*hd1+prPB[o8+2]*hd2;
              var pA=(ppk<=0? 0.14*gateIn
                           : Math.pow(Math.sin(Math.PI*Math.min(ppk,0.999)),0.7)*0.85)
                     *(0.75+0.25*Math.sin(simT*7+pi4))*(1-vc);
              prCol[o8]=prBase[o8]*pA; prCol[o8+1]=prBase[o8+1]*pA; prCol[o8+2]=prBase[o8+2]*pA;
            }
            prGeo.attributes.position.needsUpdate=true;
            prGeo.attributes.color.needsUpdate=true;
            pourPts.visible=true; pourHalo.visible=true;
          }
          crossGlow=0.6*ez(Math.min(1,s2*1.4));
          if(!crossDove && s2>0.55){ crossDove=true;
            if(AC&&SND) waveSwell(0, 0.6, 2.8, 0.05, 90, 500, 0); }
          if(s2>=0.97){ crossSwapped=true; crossEnd(); }
        }
        if(crossSwapped){ placeCamera(); vc=1; }
      } else if(te<TA+TB+TC+TD){
        if(!crossSwapped){ crossSwapped=true; crossEnd(); }
        placeCamera();
        vc=1-ez((te-TA-TB-TC)/TD);
      } else { crossing=false; vc=0; simSpeed=1; }
    }
  } else placeCamera();

  /* the kiss lives out its scatter wherever the crossing has gone —
     sparks sliding along the true glass, twinkling out */
  if(sprkPts.visible){
    var kk2=(pn-kissT0)/800;
    if(kk2>=1) sprkPts.visible=false;
    else {
      var kkE=ez(kk2), sk4;
      for(sk4=0;sk4<SKN;sk4++){
        var o7=sk4*3;
        _dp.set(skS0[o7]  +skU[o7]  *skDd[sk4]*kkE,
                skS0[o7+1]+skU[o7+1]*skDd[sk4]*kkE,
                skS0[o7+2]+skU[o7+2]*skDd[sk4]*kkE).normalize().multiplyScalar(1.004);
        skPos[o7]=_dp.x; skPos[o7+1]=_dp.y+BY; skPos[o7+2]=_dp.z;
        var skA=(1-kk2)*(0.55+0.45*Math.sin(pn*0.02+skTw[sk4]));
        skCol[o7]=skB[o7]*skA; skCol[o7+1]=skB[o7+1]*skA; skCol[o7+2]=skB[o7+2]*skA;
      }
      skGeo.attributes.position.needsUpdate=true;
      skGeo.attributes.color.needsUpdate=true;
    }
  }
  /* the condensation — the new world assembling from the poured light */
  if(pourArrive){
    var arrK=(pn-pourT0)/2600;
    if(arrK>=1){ pourArrive=false; pourPts.visible=false; pourHalo.visible=false; }
    else {
      world.matrixWorld.decompose(pourPts.position, pourPts.quaternion, pourPts.scale);
      pourHalo.position.copy(pourPts.position);
      pourHalo.quaternion.copy(pourPts.quaternion);
      pourHalo.scale.copy(pourPts.scale);
      var pj;
      for(pj=0;pj<pourN;pj++){
        var o9=pj*3;
        var pkA=ez(clamp((arrK*1.35-prDel[pj])/0.60, 0, 1));
        var omA=1-pkA;
        var thA1=prPh[pj]+pkA*5.0, thA2=prPh[pj]*1.7+pkA*11.0;
        var wobA2=Math.sin(Math.PI*pkA)*prAm[pj];
        var ha1=Math.cos(thA1)*wobA2+Math.cos(thA2)*wobA2*0.4;
        var ha2=Math.sin(thA1)*wobA2+Math.sin(thA2)*wobA2*0.4;
        prPos[o9]  =2*omA*pkA*prCtl[o9]  +pkA*pkA*prHome[o9]  +prPA[o9]*ha1+prPB[o9]*ha2;
        prPos[o9+1]=2*omA*pkA*prCtl[o9+1]+pkA*pkA*prHome[o9+1]+prPA[o9+1]*ha1+prPB[o9+1]*ha2;
        prPos[o9+2]=2*omA*pkA*prCtl[o9+2]+pkA*pkA*prHome[o9+2]+prPA[o9+2]*ha1+prPB[o9+2]*ha2;
        var aA=Math.pow(Math.sin(Math.PI*Math.min(pkA,0.999)),0.7)*0.8
               *(0.75+0.25*Math.sin(simT*7+pj));
        prCol[o9]=prBase[o9]*aA; prCol[o9+1]=prBase[o9+1]*aA; prCol[o9+2]=prBase[o9+2]*aA;
      }
      prGeo.attributes.position.needsUpdate=true;
      prGeo.attributes.color.needsUpdate=true;
    }
  }
  if(!crossing) crossGlow=Math.max(0, crossGlow-dt*2.2);
  arriveBloom=Math.max(0, arriveBloom-dt*0.55);

  if(veil) veil.style.opacity=(Math.max(ez(charge)*0.35, vc)).toFixed(3);

  renderer.render(scene, camera);

  if(showDbg&&dbgEl) dbgEl.textContent='lvl '+level+(inside?' (inside)':'')
    +(level===0?' \u00b7 '+SEAS_NAME[Math.floor(seas*4)%4]+' '+seas.toFixed(2):'')
    +' \u00b7 storm '+stormS.toFixed(2)+' \u00b7 charge '+charge.toFixed(2)
    +(lightOn?' \u00b7 settled '+(settled*100|0)+'%':'')
    +' \u00b7 accel '+lastAccel.toFixed(1)+'/'+SHAKE_SENS
    +' \u00b7 mo '+moPerm+' ev '+moEv;
}

/* the egg — the way back to the tunnel, exactly where you left it */
var eggEl=document.getElementById('eggback');
if(eggEl) eggEl.addEventListener('click', function(ev){
  ev.stopPropagation();
  var framed=false; try{ framed=(window.parent && window.parent!==window); }catch(_){}
  if(framed){ try{ window.parent.postMessage({apwnp:'close-jewel'},'*'); return; }catch(_){} }
  try{ window.top.location.href='index-doors.html'; }catch(_){ location.href='index-doors.html'; }
}, false);

/* ----------------------- open ----------------------- */
size();
setLevel(START_LVL%LEVELS.length);
requestAnimationFrame(frame);
})();
</script>
