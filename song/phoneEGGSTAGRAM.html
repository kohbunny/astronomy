a LOOK, and a look is a thing a stranger notices. this screen's whole job is
to be mistaken. the bright set has no look — it is what is already in their
pocket — and the four dark tiles left standing are knot a compromise, they
are the four things in the visitor's hand that are knot theirs, and now they
are the only four that look it. the bend is confessed at length at the head
of the icon block: the weather's sun and the store's sand are warm, neither
is a living or a sounding thing, and the gold is spent there and nowhere
behind those icons.

AND IT SWIPES NOW. four page dots have sat under this grid since the day it
was dressed, with one lit, and the comment under them admitted they were a
lie — one page, no swipe, unfalsifiable in the two seconds that mattered.
the artist has now asked for the pages and the arrangement he asked for pays
the lie off: page one is the grid, then hum and the egg together (hum is
the UNISONG DOOR now — aug 12), then notes
alone, then voicemail alone. those back pages are the rooms in this house
that are a single act — sing to the star, read what the artist wrote down,
hear the one message — and a page with one or two icons on it is a room with
a door and nothing else in the corridor. the egg came OFF page one this pass
to stand beside the hum, which is the right pairing and it took his moving
her to see it: the hum room is where the visitor sings to the star and the
egg is the one who mistook the star for her mother. same act, two sides of
the glass. (the pairing survives the hum's retirement: the unisong door
leads to the same act, sung at full size.) page one keeps the mockup's arrangement slot for slot INCLUDING
THE HOLES at the bottom left — there are TWO now, the original and the one
the egg left — and ios 18 lets an icon sit anywhere and leave a gap, so a
gap is a thing a person did on purpose, and it is the most convincing mark
on the whole grid.
the gesture is axis-locked on its first seven pixels — sideways turns the
page, up and down still swivels the phone — because a drag on this glass
already meant something and only one of the two may win.

THE RIVER PASS (aug 13). eggstagram opens on a feed now, and the feed is
the audienceless set's third carriage — instagram's exact furniture,
rebuilt to free instead of trap, and it never says so. the long form:

· the simulcast. the river's head is dealt from the clock over P·2^14
  (≈94.33 s a beat) and every cell k is drawn from k alone, seeded, so
  anybody standing in the water at the same second sees the same water.
  two tabs side by side prove the river is shared — and prove, in the
  same gesture, that a posted photograph stands in only one of them.
  the proof of company and the proof of solitude are one experiment.
· the room may knot watch. nothing measures where the visitor slows,
  what they return to, what they love; the water does knot bend. (the
  three-ai symposium proposed a feed that notices, flatters, and then
  releases — the best essay in the stack, and it died on the first
  line of every audit this house has sworn, `nothing watches`, and on
  the mismatch law besides: personalization is address, and this set
  refuses address. the feed's claim on you ends because it never
  began. the river never knew you were there.)
· the widening. the categories are the medium's memory of what a
  photograph is, and depth drains the self out of them: near the head,
  mirror · meal · window · bedroom; deep, sea · sky · horizon · grain,
  until the scroll is weather arriving on schedule — which is what the
  first poster has been doing all along. the river never thins and
  never ends; it only stops being about anyone. no line announces it.
· the bylines are the categories. where instagram keeps the self, the
  attribution slot keeps the archetype — who posted this? window did.
  the one unattributed post is the visitor's own: everything fake is
  named, the one real thing is nameless, found again by its warmth.
· the palette is exsanguinated. every drawn cell is cool ink; the gold
  is withheld by the colour law and spent by exactly two hands, both
  the visitor's — the double-tap's bloom, and the one photograph,
  life's light imported whole. everything warm in the river is the
  visitor. the room never says this either.
· the hearts never number, and a heart changes NOTHING — knot the
  order, knot the water, knot any count anywhere, because there are
  none. one-way, unlimited, an expenditure and knot an account: the
  drug with the exchange removed, which is the freeing, worn as the
  hook.
· the ladder. a poster — only a poster, and only once — is told, at
  pulse-dealt hours: `somebody liked your photograph` (P·2^13),
  `anybody liked your photograph` (P·2^15), and, dealt in the dead
  letter's own band (P·(2^16..2^17)), `nobody liked your photograph` —
  lowercase, knot the address, and TRUE. two confessed forgeries
  decaying into the only true notification a feed has ever sent. the
  first high is the last high. badge-only, silent, gated by the room's
  own switch; reading the list clears it, like mail.
· the photograph. the drawn camera keeps its vow — no film, ever — so
  the post arrives by the system's own picker, the mic-and-camera
  currency. it is drawn cover-cropped onto this canvas and released:
  never uploaded, never kept past the tab, never shown to another
  soul. the privacy page swears it in system voice (NEEDS HIS
  BLESSING, like the two amendments above it). refusal stays refusal:
  compose offers `a photograph` and `nothing` as equal doors — the
  nothing is a choice, never a consolation assigned to a no — and a
  cancelled picker leaves the sheet standing, unoffended.
· the identity, re-inked at his word: @somebody · `the loneliest song
  in the universe` · `follow no one.` — the fourth corner of the
  naming square (UNKNOWN calls · ANYBODY texts · NOBODY receives ·
  somebody is followed), the song's own name, and krishnamurti kept by
  arithmetic: 1 post · 17,368 followers · 0 following. the profile
  stands one door in, whole: request → requested → eggprison, later,
  or never.
· the pool from the symposium — real photographs crossing between
  strangers for one real heart — is DROPPED and the door held: its
  receipt (`1 like`) is a count, its queue is a stone the tide
  forbids, its moderation is a duty dumb code cannot carry, and its
  thesis closes the question this house is built to keep open. the
  wall remains the only carriage for real crossing, and words stripped
  to tails remain the most this house will carry.

tell. without the flag the phone floats from the first frame, as it always

        if(f===1) blobAt(24,34,26,'#ffc37a',0.85);
        if(f===4) blobAt(40,26,24,'#9db8e8',0.6);
        if(f===0) blobAt(30,30,18,'#4a5a74',0.5);

    /* soft round glow — the levitation light under the phone */
    function bakeGlow(){
      const S=64, cv=mkcv(S), q=cv.getContext('2d');
      const g=q.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
      g.addColorStop(0,'rgba(255,255,255,0.85)');

      g.addColorStop(1,'rgba(255,255,255,0)');

    /* ---- the twelve pictures, baked understudies -------------------------
       each photo slot tries the cdn first; these seeded artworks stand in
       for any that are missing. palette is the house's own: cool blue-white
       for the fixed things, candle and ember warmth, the sac's red. */
    const PHOTO_CAP=['the egg, at glass','the star, now','song 03 again',
      'the dial says nothing','candle hours','it moved today',
      'red wires, thinner','the sac is red now','antenna weather',
      'the mouth, embering','static between stations','the pad, waiting'];
    function bakeArt(i){
      const S=LOW?256:384, cv=mkcv(S), q=cv.getContext('2d');
      const R=mulberry32((SEED^(i*2654435761))>>>0);
      const rv=(a,b)=>a+(b-a)*R();
      q.fillStyle='#06080c'; q.fillRect(0,0,S,S);
      const vg=q.createRadialGradient(S/2,S/2,S*0.2,S/2,S/2,S*0.75);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
      const vig=()=>{ q.fillStyle=vg; q.fillRect(0,0,S,S); };
      const grain=n=>{ for(let k=0;k<n;k++){ q.fillStyle='rgba('+(R()<0.5?'255,255,255':'120,150,190')+','+rv(0.02,0.06)+')';
        q.fillRect(R()*S,R()*S,1,1); } };
      const egg=(cx,cy,s,col,a)=>{ q.save(); q.translate(cx,cy); q.scale(s,s*1.28);
        q.strokeStyle=col; q.globalAlpha=a; q.lineWidth=1.6/s;
        q.beginPath(); q.arc(0,0,1,0,6.283); q.stroke(); q.restore(); q.globalAlpha=1; };
      switch(i%12){
      case 0:{ // the egg, at glass
        const g2=q.createRadialGradient(S*0.5,S*0.42,4,S*0.5,S*0.55,S*0.5);
        g2.addColorStop(0,'rgba(159,196,236,0.30)'); g2.addColorStop(1,'rgba(0,0,0,0)');
        q.fillStyle=g2; q.fillRect(0,0,S,S);
        egg(S*0.5,S*0.52,S*0.23,'rgba(210,228,250,0.85)',0.85);
        egg(S*0.5,S*0.52,S*0.225,'rgba(210,228,250,0.25)',0.5);
        q.fillStyle='rgba(94,35,32,0.75)';                       // the creature, dim
        q.beginPath(); q.ellipse(S*0.5,S*0.54,S*0.075,S*0.095,0.5,0,6.283); q.fill();
        q.fillStyle='rgba(255,132,58,0.8)';
        q.beginPath(); q.arc(S*0.5,S*0.685,S*0.016,0,6.283); q.fill();  // the mouth
        break; }
      case 1:{ // the star, now — pulse rings
        for(let k=0;k<9;k++){ const rad=S*0.06+k*S*0.05;
          q.strokeStyle='rgba(159,196,236,'+(k===2?0.9:rv(0.10,0.30))+')';
          q.lineWidth=k===2?2.2:1;
          q.beginPath(); q.arc(S/2,S/2,rad,0,6.283); q.stroke(); }
        q.fillStyle='#dce9fb'; q.beginPath(); q.arc(S/2,S/2,3.2,0,6.283); q.fill();
        break; }
      case 2:{ // song 03 again — a waveform
        q.strokeStyle='rgba(226,168,62,0.9)'; q.lineWidth=1.4; q.beginPath();
        for(let x=0;x<S;x++){ const t=x/S;
          const y=S/2+Math.sin(t*43)*S*0.09*Math.sin(t*3.1)+Math.sin(t*173)*S*0.03;
          x?q.lineTo(x,y):q.moveTo(x,y); }
        q.stroke();
        q.strokeStyle='rgba(226,168,62,0.25)'; q.strokeRect(S*0.08,S*0.30,S*0.84,S*0.40);
        break; }
      case 3:{ // the dial says nothing
        const hy=S*0.78;
        for(let v=0;v<=100;v+=5){ const a=Math.PI*(1-(0.055+0.89*v/100));
          const maj=v%20===0, r0=S*0.42, l=maj?S*0.045:S*0.02;
          q.strokeStyle='rgba(226,240,255,'+(maj?0.85:0.35)+')'; q.lineWidth=maj?2:1;
          q.beginPath();
          q.moveTo(S/2+Math.cos(a)*r0,hy-Math.sin(a)*r0);
          q.lineTo(S/2+Math.cos(a)*(r0+l),hy-Math.sin(a)*(r0+l)); q.stroke(); }
        q.strokeStyle='rgba(226,168,62,0.9)'; q.lineWidth=2;
        const na=Math.PI*(1-(0.055+0.89*0.37));
        q.beginPath(); q.moveTo(S/2,hy);
        q.lineTo(S/2+Math.cos(na)*S*0.40,hy-Math.sin(na)*S*0.40); q.stroke();
        break; }
      case 4:{ // candle hours
        const g2=q.createRadialGradient(S*0.5,S*0.55,2,S*0.5,S*0.6,S*0.55);
        g2.addColorStop(0,'rgba(255,195,122,0.95)');
        g2.addColorStop(0.25,'rgba(255,150,70,0.45)');
        g2.addColorStop(1,'rgba(0,0,0,0)');
        q.fillStyle=g2; q.fillRect(0,0,S,S);
        q.fillStyle='#0a0808';
        q.fillRect(S*0.47,S*0.62,S*0.06,S*0.30);
        q.fillStyle='rgba(255,224,138,0.95)';
        q.beginPath(); q.ellipse(S*0.5,S*0.56,S*0.018,S*0.045,0,0,6.283); q.fill();
        break; }
      case 5:{ // it moved today — the creature curled
        q.strokeStyle='rgba(240,223,208,0.8)'; q.lineWidth=S*0.05; q.lineCap='round';
        q.beginPath(); q.moveTo(S*0.62,S*0.30);
        q.bezierCurveTo(S*0.30,S*0.22,S*0.24,S*0.62,S*0.46,S*0.68);
        q.bezierCurveTo(S*0.62,S*0.73,S*0.70,S*0.62,S*0.66,S*0.52); q.stroke();
        q.fillStyle='rgba(18,14,22,0.9)';
        q.beginPath(); q.arc(S*0.585,S*0.315,S*0.022,0,6.283); q.fill();   // the eye
        q.fillStyle='rgba(76,13,11,0.75)';
        q.beginPath(); q.arc(S*0.44,S*0.52,S*0.05,0,6.283); q.fill();      // the heart
        grain(400);
        break; }
      case 6:{ // red wires, thinner
        q.lineCap='round';
        for(let k=0;k<7;k++){ q.strokeStyle='rgba(156,58,42,'+rv(0.5,0.9)+')';
          q.lineWidth=rv(1,2.2); q.beginPath();
          let x=rv(0,S), y=rv(0,S); q.moveTo(x,y);
          for(let s2=0;s2<5;s2++) q.bezierCurveTo(rv(0,S),rv(0,S),rv(0,S),rv(0,S),x=rv(0,S),y=rv(0,S));
          q.stroke(); }
        break; }
      case 7:{ // the sac is red now — speckle
        const reds=['#e02416','#c8180e','#ff4a2a','#a81410','#f03418'];
        const yels=['#ffc23a','#ffd84a','#ffa722'];
        for(let k=0;k<420;k++){ const yel=R()<0.2;
          q.fillStyle=(yel?yels:reds)[Math.floor(R()*(yel?3:5))];
          q.globalAlpha=rv(0.5,1);
          q.beginPath(); q.arc(R()*S,R()*S,rv(0.5,1.6),0,6.283); q.fill(); }
        q.globalAlpha=1;
        break; }
      case 8:{ // antenna weather
        for(let k=0;k<80;k++){ q.fillStyle='rgba(220,233,251,'+rv(0.1,0.8)+')';
          q.fillRect(R()*S,R()*S*0.7,1,1); }
        q.strokeStyle='rgba(180,174,162,0.85)'; q.lineWidth=1.6;
        q.beginPath(); q.moveTo(S*0.30,S); q.lineTo(S*0.62,S*0.22); q.stroke();
        q.fillStyle='#dce9fb'; q.beginPath(); q.arc(S*0.62,S*0.215,2.4,0,6.283); q.fill();
        q.fillStyle='rgba(159,196,236,0.9)';
        q.beginPath(); q.arc(S*0.78,S*0.14,1.8,0,6.283); q.fill();
        break; }
      case 9:{ // the mouth, embering
        const g2=q.createRadialGradient(S/2,S/2,0,S/2,S/2,S*0.46);
        g2.addColorStop(0,'rgba(255,168,92,1)');
        g2.addColorStop(0.35,'rgba(255,132,58,0.7)');
        g2.addColorStop(0.7,'rgba(196,84,26,0.25)');
        g2.addColorStop(1,'rgba(0,0,0,0)');
        q.fillStyle=g2; q.fillRect(0,0,S,S);
        for(let rad=S*0.46;rad>4;rad-=7){ q.strokeStyle='rgba(0,0,0,0.7)'; q.lineWidth=2.6;
          q.beginPath(); q.arc(S/2,S/2,rad,0,6.283); q.stroke(); }
        break; }
      case 10:{ // static between stations
        for(let k=0;k<2600;k++){ const v=R();
          q.fillStyle='rgba('+(v<0.85?'127,168,214':'255,255,255')+','+rv(0.03,0.22)+')';
          q.fillRect(R()*S,R()*S,rv(0.5,1.8),1); }
        q.strokeStyle='rgba(226,240,255,0.20)'; q.lineWidth=1;
        for(let k=0;k<4;k++){ const y=rv(0.1,0.9)*S;
          q.beginPath(); q.moveTo(0,y); q.lineTo(S,y); q.stroke(); }
        break; }
      default:{ // the pad, waiting
        q.fillStyle='#0b0a09';
        q.beginPath(); q.ellipse(S/2,S*0.62,S*0.34,S*0.13,0,0,6.283); q.fill();
        q.strokeStyle='rgba(157,184,232,0.35)'; q.lineWidth=1.4;
        q.beginPath(); q.ellipse(S/2,S*0.585,S*0.34,S*0.125,0,3.30,6.10); q.stroke();
        const g2=q.createRadialGradient(S/2,S*0.40,2,S/2,S*0.45,S*0.35);
        g2.addColorStop(0,'rgba(157,184,232,0.12)'); g2.addColorStop(1,'rgba(0,0,0,0)');
        q.fillStyle=g2; q.fillRect(0,0,S,S);
        break; } }
      vig(); grain(140);
      return cv;
    }
    /* photo slots: {cv, img(if cdn arrived), cap}; cdn tried once, lazily */
    const PHOTOS=[]; for(let i=0;i<12;i++) PHOTOS.push({ cv:null, img:null, cap:PHOTO_CAP[i], tried:false });
    function photoCv(i){ const p=PHOTOS[i]; if(!p.cv) p.cv=bakeArt(i); return p.cv; }
    let photosArmed=false;
    function armPhotos(){                     // called on first open of photos/instagram
      if(photosArmed) return; photosArmed=true;
      for(let i=0;i<12;i++){ const p=PHOTOS[i];
        if(p.tried) continue; p.tried=true;
        const n=String(i+1).padStart(2,'0');
        let u=BASE+'/phone'+n+'.jpg';
        try{ if(new URL(u).host!==ORIGIN) continue; }catch(_){ continue; }
        const im=new Image(); im.crossOrigin='anonymous';
        im.onload=()=>{ p.img=im; needDraw=true; };
        im.onerror=()=>{};                    // the understudy plays instead
        im.src=u; }
    }
    /* draw a photo (cdn image or bake) cover-cropped into a rect */
    function drawPhoto(q,i,x,y,w,h,r){
      q.save(); roundRectPath(q,x,y,w,h,r); q.clip();
      const p=PHOTOS[i], src=p.img||photoCv(i);
      const sw=src.width, sh=src.height, s=Math.max(w/sw,h/sh);
      q.drawImage(src,x+(w-sw*s)/2,y+(h-sh*s)/2,sw*s,sh*s);
      q.restore();
    }
    /* ---------------- materials ---------------- */
    function glassPhys(rough,thick){
      if(LOW) return new THREE.MeshPhysicalMaterial({ color:0xf2f6fa,
        transparent:true, opacity:0.16, roughness:rough+0.06, metalness:0,
        depthWrite:false });
      return new THREE.MeshPhysicalMaterial({ color:0xffffff,
        transmission:1.0, thickness:thick, ior:1.5, roughness:rough,
        metalness:0, attenuationColor:new THREE.Color(0xe6f1fa),
        attenuationDistance:0.9, specularIntensity:1.0 });
    }
    const M={
      slab: (()=>{ const m=glassPhys(0.045,0.0080); m.depthWrite=false;
        if(!LOW){ m.clearcoat=1.0; m.clearcoatRoughness=0.20;
          m.specularIntensity=1.45; m.attenuationColor=new THREE.Color(0xdfeef7);
          m.attenuationDistance=1.1; }
        return m; })(),
      fitting: (()=>{ const m=glassPhys(0.16,0.0030); m.depthWrite=false; return m; })(),
      lens: (()=>{ const m=glassPhys(0.03,0.0018); m.depthWrite=false;
        if(!LOW){ m.clearcoat=1.0; m.clearcoatRoughness=0.06; } return m; })(),
      lensRing: new THREE.MeshStandardMaterial({ color:0xb4c4d8,
        roughness:0.35, metalness:0.6, transparent:true, opacity:0.22,
        depthWrite:false }),
      pad: new THREE.MeshStandardMaterial({ color:0x1a1817, roughness:0.9, metalness:0.1 }),
    };
    const envT=bakeEnvCube();
    for(const mm of [M.slab,M.fitting,M.lens]){ mm.envMap=envT; mm.envMapIntensity=1.15; }
    M.lensRing.envMap=envT; M.lensRing.envMapIntensity=0.5;

    /* ---------------- geometry ---------------- */
    const g=new THREE.Group(); g.name='phone'; ctx.parent.add(g);
    const disposables=[];
    function keep(o){ disposables.push(o); return o; }

    const phoneG=new THREE.Group(); phoneG.name='body'; g.add(phoneG);
    phoneG.position.y=HOVER;

    // the slab — one seamless piece of glass, beveled like cover glass
    function roundedShape(w,h,r){
      const s=new THREE.Shape(), x=-w/2, y=-h/2;
      s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
      s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
      s.lineTo(x+r,y+h); s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
      s.lineTo(x,y+r); s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
      return s;
    }
    const BEV=0.0016;
    const slabGeo=keep(new THREE.ExtrudeGeometry(
      roundedShape(PW-2*BEV,PH-2*BEV,PR-BEV),
      { depth:PD-2*BEV, bevelEnabled:true, bevelThickness:BEV,
        bevelSize:BEV*0.92, bevelSegments:LOW?3:5, curveSegments:LOW?12:26 }));
    slabGeo.translate(0,0,-(PD-2*BEV)/2);
    const slab=new THREE.Mesh(slabGeo,M.slab);
    slab.name='slab'; slab.renderOrder=6; phoneG.add(slab);

    // the camera plateau on the back — the 16's vertical pill, two lenses
    // and the small flash, all still glass. it sits on the phone's own
    // left, which through a transparent front reads on the RIGHT, where a
    // visitor looking at the face expects to find it.
    const camG=new THREE.Group(); camG.name='cameras'; phoneG.add(camG);
    camG.position.set(0.0178,0.0470,-PD/2);
    { const pill=new THREE.Mesh(keep(new THREE.ExtrudeGeometry(
        roundedShape(0.0165,0.0345,0.0080),
        { depth:0.0009, bevelEnabled:true, bevelThickness:0.0007,
          bevelSize:0.0007, bevelSegments:LOW?2:3, curveSegments:LOW?10:18 })),M.fitting);
      pill.rotation.y=Math.PI; pill.position.z=0.0002; pill.renderOrder=6; camG.add(pill);
      for(const ly of [0.0085,-0.0085]){
        const lens=new THREE.Mesh(keep(new THREE.CylinderGeometry(0.0051,0.0051,0.0016,LOW?16:24)),M.lens);
        lens.rotation.x=Math.PI/2; lens.position.set(0,ly,-0.0022); lens.renderOrder=6; camG.add(lens);
        const ring=new THREE.Mesh(keep(new THREE.TorusGeometry(0.0051,0.00055,LOW?6:8,LOW?16:24)),M.lensRing);
        ring.position.set(0,ly,-0.0028); ring.renderOrder=7; camG.add(ring);
        const eye=new THREE.Mesh(keep(new THREE.SphereGeometry(0.0030,LOW?10:14,LOW?8:10)),M.lens);
        eye.scale.z=0.45; eye.position.set(0,ly,-0.0026); eye.renderOrder=7; camG.add(eye);
      }
      const flash=new THREE.Mesh(keep(new THREE.CylinderGeometry(0.0017,0.0017,0.0010,10)),M.lensRing);
      flash.rotation.x=Math.PI/2; flash.position.set(-0.0058,0,-0.0016); camG.add(flash);
    }

    // side buttons — capsules of the same glass. the right-side button is
    // the reality switch: it does what the camera app does.
    function sideBtn(x,y,len,name){
      const b=new THREE.Mesh(keep(new THREE.CapsuleGeometry(0.00115,Math.max(len-0.0023,0.001),3,LOW?8:10)),M.fitting);
      b.position.set(x,y,0); b.name=name; b.renderOrder=6; phoneG.add(b);
      sideBtns.push(b); return b;
    }
    const sideBtns=[];
    const powerBtn=sideBtn( PW/2+0.0006, 0.0230, 0.0225, 'power');
    sideBtn( PW/2+0.0004,-0.0105, 0.0140, 'camctl');
    sideBtn(-PW/2-0.0005, 0.0435, 0.0075, 'action');
    sideBtn(-PW/2-0.0005, 0.0250, 0.0118, 'volup');
    sideBtn(-PW/2-0.0005, 0.0095, 0.0118, 'voldn');

    /* the screen — a sheet of light floating in the middle of the slab.
       front face reads true; a fainter mirrored sheet faces the back, the
       way a transparent display would give itself away in reverse.
       (transparent things inside the transmission slab must render after
       it — slab 6, back sheet 9, front sheet 10 — and never depth-write.) */
    const scv=mkcv(LOW?540:720,LOW?1170:1560);
    const sq=scv.getContext('2d');
    const screenTex=new THREE.CanvasTexture(scv);
    screenTex.colorSpace=THREE.SRGBColorSpace; screenTex.anisotropy=8;
    const screenGeo=keep(new THREE.ShapeGeometry(roundedShape(SW,SH,SR),LOW?12:24));
    { const uv=screenGeo.attributes.uv, pos=screenGeo.attributes.position;
      for(let i=0;i<uv.count;i++)
        uv.setXY(i,(pos.getX(i)+SW/2)/SW,(pos.getY(i)+SH/2)/SH); }
    const screenMat=new THREE.MeshBasicMaterial({ map:screenTex,
      transparent:true, depthWrite:false, toneMapped:false });
    const screen=new THREE.Mesh(screenGeo,screenMat);
    screen.name='screen'; screen.position.z=0.0008; screen.renderOrder=10;
    phoneG.add(screen);
    const backMat=screenMat.clone(); backMat.opacity=0.30;
    const screenBack=new THREE.Mesh(screenGeo,backMat);
    screenBack.rotation.y=Math.PI; screenBack.position.z=0.0006;
    screenBack.renderOrder=9; phoneG.add(screenBack);

    /* ---- the arrival hide ----
       on the first landing the visitor must knot yet know there is an
       object here at all. every solid part of the phone — the slab, the
       camera plateau, the five side buttons, the mirrored back sheet — is
       switched off, and what is left is the lit screen alone, hanging in
       true #000. no edge, no bezel line, no lens: nothing to see through
       and nothing to see around. it reads as a home screen and knot as
       glass. when the hold is let go the body returns in one frame and
       the whole thing swivels away — the phone builds itself around the
       screen as it pulls back, and that is the reveal. */
    let hidden=false, arTaps=0;
    function setArrive(on){
      on=!!on; if(on===hidden) return; hidden=on;
      /* RULED, A THIRD TIME (aug 8) — the camera plateau goes with the rest.
         the lens was hidden on the first arrival, then kept through it (the
         argument was that a lens seen THROUGH the glass says `you are inside
         this` without a word), and the artist has now ruled it back out: the
         locked home screen carries no lens at all. the lens belongs to the
         camera — it appears only when the camera button is pressed and the
         body returns with the room behind it. so everything solid goes
         while the lock holds: the slab, the plateau, the five buttons, the
         mirrored back sheet — plus the sheet's own edge and the drawn
         status and home bars, for the reason that has never changed: a
         rounded rectangle outlined against black is a picture of a phone,
         and two clocks give the forgery away. */
      slab.visible=!on; screenBack.visible=!on; camG.visible=!on;
      for(const b of sideBtns) b.visible=!on;
      needDraw=true;
    }

    // the pad is gone. the phone hovers over nothing at all now, in pure
    // black, refusing a surface that is no longer offered. the objects are
    // kept and never added to the scene, so every reference below (the
    // reality switch hides them, the loop breathes the glow) still lands.
    const pad=new THREE.Mesh(keep(new THREE.CylinderGeometry(0.046,0.052,0.006,LOW?24:40)),M.pad);
    pad.position.y=0.003; pad.name='pad'; pad.visible=false;
    const glowT=bakeGlow();
    const padGlowM=keep(new THREE.SpriteMaterial({ map:glowT, color:0x9db8e8,
      transparent:true, opacity:0.10, blending:THREE.AdditiveBlending, depthWrite:false }));
    const padGlow=new THREE.Sprite(padGlowM); padGlow.scale.set(0.16,0.05,1);
    padGlow.position.y=0.012; padGlow.renderOrder=14; padGlow.visible=false;
    // one whisper-weak cool point in the glass, physical falloff
    const screenLight=new THREE.PointLight(0xbcd4f2,0,0.35,2);
    screenLight.position.set(0,HOVER,0.02); g.add(screenLight);

    /* ---------------- audio ----------------
       everything hangs off ctx.audio.bus on ctx.audio.ctx. nothing is owned.
       fetch-then-buffer for every file; the only origin is kohmedia. */
    const actx=ctx.audio.ctx, bus=ctx.audio.bus, sr=actx.sampleRate;
    const stopables=[], nodes=[];
    const an=(node)=>{ nodes.push(node); return node; };
    const gate=an(actx.createGain()); gate.gain.value=0; gate.connect(bus);
    let analy=null, analyBuf=null;
    try{ analy=an(actx.createAnalyser()); analy.fftSize=256;
      analy.smoothingTimeConstant=0.6;
      analyBuf=new Uint8Array(analy.fftSize); gate.connect(analy);
    }catch(_){ analy=null; }
    const musicG=an(actx.createGain()); musicG.gain.value=0.85; musicG.connect(gate);
    const vmG=an(actx.createGain());    vmG.gain.value=0.95;    vmG.connect(gate);
    const callG=an(actx.createGain());  callG.gain.value=0.9;   callG.connect(gate);
    const uiG=an(actx.createGain());    uiG.gain.value=0.16;    uiG.connect(gate);
    let disposed=false;

    // the ui tick — one grain of the house carrier, ×8
    let tickBuf=null;
    function uiTick(){
      if(disposed) return;
      if(!tickBuf){ const n=Math.floor(sr*0.045);
        tickBuf=actx.createBuffer(1,n,sr); const ch=tickBuf.getChannelData(0);
        for(let i=0;i<n;i++){ const t=i/sr;
          ch[i]=Math.sin(2*Math.PI*P*8*t)*Math.exp(-t/0.008)*(1-Math.exp(-t/0.0007)); } }
      try{ const s=actx.createBufferSource(); s.buffer=tickBuf;
        s.connect(uiG); s.start(); }catch(_){}
    }

    /* ---- the hum room's voices — RETIRED (aug 12, his word) ----
       the room was the unison song's placeholder; the song has its own page
       now and the tile is a door (unisong → deadstar.html). the reference
       pair, the stand-in synth and the microphone autocorrelation left with
       it — a door does knot sing, it opens. the match chime STAYS: pulsr
       rings it when the two profiles find each other, and that match is
       knot retired and never will be. */
    function matchPing(){
      try{
        const n=Math.floor(sr*0.9), b=actx.createBuffer(1,n,sr), ch=b.getChannelData(0);
        for(let i=0;i<n;i++){ const t2=i/sr;
          let v=Math.sin(2*Math.PI*P*1.5*t2)*Math.exp(-t2/0.16);
          if(t2>0.16) v+=Math.sin(2*Math.PI*P*2*t2)*Math.exp(-(t2-0.16)/0.22);
          ch[i]=v*0.5*(1-Math.exp(-t2/0.004)); }
        const s=actx.createBufferSource(); s.buffer=b;
        const g3=actx.createGain(); g3.gain.value=0.5; g3.connect(gate);
        s.connect(g3); s.start(); stopables.push(s);
      }catch(_){}
    }
    /* the ride's goodbye — one low thump at ×1/2 */
    function ridePing(){
      try{
        const n=Math.floor(sr*0.6), b=actx.createBuffer(1,n,sr), ch=b.getChannelData(0);
        for(let i=0;i<n;i++){ const t2=i/sr;
          ch[i]=Math.sin(2*Math.PI*P*0.5*t2)*Math.exp(-t2/0.14)*(1-Math.exp(-t2/0.003)); }
        const s=actx.createBufferSource(); s.buffer=b;
        const g3=actx.createGain(); g3.gain.value=0.6; g3.connect(gate);
        s.connect(g3); s.start(); stopables.push(s);
      }catch(_){}
    }

    /* the eggradio playlist — the same eight relics the radio finds.
       bytes fetched at build, decoded on first play, kept after. */
    const TRACKS=[];
    for(let i=1;i<=8;i++){ const n=String(i).padStart(2,'0');
      TRACKS.push({ url:BASE+'/soap'+n+'.mp3', title:'SONG '+n,
        ab:null, buf:null, dur:0, src:null }); }
    const music={ cur:-1, playing:false, offset:0, t0:0, pending:-1 };
    function fetchRelic(o){
      let host=''; try{ host=new URL(o.url).host; }catch(_){ return; }
      if(host!==ORIGIN) return;
      fetch(o.url).then(r=>r.ok?r.arrayBuffer():Promise.reject())
        .then(ab=>{ o.ab=ab; needDraw=true; })
        .catch(()=>{});                      // silence there, knot an error
    }
    TRACKS.forEach(fetchRelic);
    function decodeRelic(o,then){
      if(o.buf){ then&&then(); return; }
      if(!o.ab||o.decoding) return; o.decoding=true;
      actx.decodeAudioData(o.ab.slice(0)).then(buf=>{
        o.decoding=false; if(disposed) return;
        o.buf=buf; o.dur=buf.duration; needDraw=true; then&&then();
      }).catch(()=>{ o.decoding=false; });
    }
    function musicStop(){
      if(music.cur>=0&&TRACKS[music.cur].src){
        const s=TRACKS[music.cur].src; TRACKS[music.cur].src=null;
        try{ s.onended=null; s.stop(); }catch(_){}}
    }
    function musicPlay(i,offset){
      music.pending=i;
      const tr=TRACKS[i]; if(!tr){ return; }
      decodeRelic(tr,()=>{
        if(disposed||music.pending!==i) return;
        musicStop();
        const s=actx.createBufferSource(); s.buffer=tr.buf;
        s.connect(musicG); stopables.push(s);
        const off=Math.max(0,Math.min(offset||0,tr.dur-0.05));
        s.start(0,off);
        tr.src=s; music.cur=i; music.playing=true;
        music.t0=actx.currentTime-off; music.offset=0;
        s.onended=()=>{ if(disposed) return;
          if(tr.src===s){ tr.src=null;
            musicPlay((i+1)%TRACKS.length,0); } };  // the playlist turns over
        needDraw=true;
      });
    }
    function musicPause(){
      if(!music.playing||music.cur<0) return;
      music.offset=actx.currentTime-music.t0; music.playing=false;
      musicStop(); needDraw=true;
    }
    function musicToggle(){
      if(music.playing) musicPause();
      else if(music.cur>=0) musicPlay(music.cur,music.offset);
    }

    /* the voicemail — one unheard message */
    const VM={ url:BASE+'/mommy.mp3', ab:null, buf:null, dur:0, src:null,
      playing:false, offset:0, t0:0, heard:false };
    fetchRelic(VM);
    function vmStop(){ if(VM.src){ const s=VM.src; VM.src=null;
      try{ s.onended=null; s.stop(); }catch(_){}} VM.playing=false; }
    function vmPlay(offset){
      decodeRelic(VM,()=>{
        if(disposed) return; vmStop();
        const s=actx.createBufferSource(); s.buffer=VM.buf;
        s.connect(vmG); stopables.push(s);
        const off=Math.max(0,Math.min(offset||0,VM.dur-0.05));
        s.start(0,off); VM.src=s; VM.playing=true; VM.heard=true;
        VM.t0=actx.currentTime-off;
        s.onended=()=>{ if(VM.src===s){ VM.src=null; VM.playing=false;
          VM.offset=0; needDraw=true; } };
        needDraw=true;
      });
      VM.heard=true;                          // tapping it counts as listening
    }
    /* ---- the ride's own sounds ----
       TWO PATHS, and they are knot the same sound (the artist, aug 8):

       · the TAP, in the menu, answers with a SYNTHESISED system sound made
         right here — a bicycle bell for economy, a soft chime for extra
         comfort, a swell of surf for the suv, the knight's sweep for kitt.
         no file, no fetch, so it lands on the frame the thumb does and can
         never be missing. this is the audition.

       · the CONFIRM plays the tier's own recorded mp3, and the page holds
         for the whole of it while the chart waits and the spinner searches.
         this is the departure, and it is the longer, realer voice.

       the looped ridersong.mp3 that used to play under the menu is gone for
       good — one voice too many under a screen whose whole job is waiting.
       the four tier files come back only for the confirm.

       every synth tone is a rational multiple of P; the surf is a filter
       over seeded noise, exempt, as the line hiss is. the mp3s are decoded
       relics, exempt as mommy and the soap tracks are.

       the files are fetched AND decoded the moment the rider app opens, so
       `dur` is known before the confirm is pressed — which is what the
       fade's whole length is solved from. a visitor who never opens the app
       never pays for them. */
    const pickG=an(actx.createGain()); pickG.gain.value=1.0;  pickG.connect(gate);
    const voxG=an(actx.createGain());  voxG.gain.value=0.92;  voxG.connect(gate);
    const RIDEPICK=['ridereconomy','riderextracomfort','ridersuv','riderknight']
      .map(n=>({ url:BASE+'/'+n+'.mp3', ab:null, buf:null, dur:0, src:null }));
    let rideFetched=false;
    function rideFetchAll(){
      if(rideFetched) return; rideFetched=true;
      RIDEPICK.forEach(o=>{ fetchRelic(o); setTimeout(()=>decodeRelic(o),0); });
    }
    let pickSrc=null, pickTier=-1;
    /* the four voices. each shapes its own envelope inline and returns the
       seconds it will sound. all are one-shots that clean up after
       themselves; `pickSrc` is a token the stop and the onended check against,
       and a plain {stop} object stands in for a buffer source so ridePickStop
       can treat every voice the same. */
    function voxEconomy(){                       // a bicycle bell: struck twice
      const strike=(when,g0)=>{
        for(const [mul,lvl] of [[3,1.0],[8,0.42],[15,0.16]]){ // ×3 ×8 ×15 — a bell's beat
          const o=an(actx.createOscillator()); o.frequency.value=P*mul;
          const g=an(actx.createGain()); g.gain.value=0;
          o.connect(g); g.connect(pickG);
          g.gain.setValueAtTime(0.0001,when);
          g.gain.exponentialRampToValueAtTime(g0*lvl,when+0.004);
          g.gain.exponentialRampToValueAtTime(0.0001,when+0.9);
          o.start(when); o.stop(when+0.95); stopables.push(o);
        }
      };
      const t=actx.currentTime;
      strike(t,0.5); strike(t+0.16,0.34);        // ding — ding
      return 1.1;
    }
    function voxComfort(){                        // a soft major-third chime
      const t=actx.currentTime, dur=2.2;
      for(const [mul,lvl,dl] of [[2,0.5,0],[5/2,0.42,0.05],[4,0.14,0.02]]){ // ×2 ×5/2 ×4
        const o=an(actx.createOscillator()); o.type='sine'; o.frequency.value=P*mul;
        const g=an(actx.createGain()); g.gain.value=0;
        o.connect(g); g.connect(pickG);
        g.gain.setValueAtTime(0.0001,t+dl);
        g.gain.exponentialRampToValueAtTime(lvl,t+dl+0.10);
        g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
        o.start(t+dl); o.stop(t+dur+0.05); stopables.push(o);
      }
      return dur;
    }
    function voxSurf(){                           // waves: a swell of seeded noise
      const t=actx.currentTime, dur=3.0;
      const arng=mulberry32((SEED^0x5EA7)>>>0);
      const n=Math.floor(sr*dur), nb=actx.createBuffer(1,n,sr), nc=nb.getChannelData(0);
      let lp=0; for(let i=0;i<n;i++){ const w=arng()*2-1; lp+=(w-lp)*0.045; nc[i]=lp*3.2; }
      const s=actx.createBufferSource(); s.buffer=nb;
      const bp=an(actx.createBiquadFilter()); bp.type='bandpass';
      bp.frequency.value=P*3; bp.Q.value=0.6;    // a filter over noise — exempt
      const g=an(actx.createGain()); g.gain.value=0;
      s.connect(bp); bp.connect(g); g.connect(pickG);
      // two swells rising and falling — the surf coming in and drawing back
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.5,t+0.7);
      g.gain.linearRampToValueAtTime(0.12,t+1.5);
      g.gain.linearRampToValueAtTime(0.42,t+2.2);
      g.gain.linearRampToValueAtTime(0.0001,t+dur);
      bp.frequency.setValueAtTime(P*2.4,t);
      bp.frequency.linearRampToValueAtTime(P*4.0,t+0.7);
      bp.frequency.linearRampToValueAtTime(P*2.4,t+1.5);
      bp.frequency.linearRampToValueAtTime(P*4.0,t+2.2);
      s.start(); stopables.push(s);
      return dur;
    }
    function voxKnight(){                         // the knight: a scanner sweep
      const t=actx.currentTime, dur=1.9;
      const o=an(actx.createOscillator()); o.type='sawtooth'; o.frequency.value=P; // ×1 carrier
      const bp=an(actx.createBiquadFilter()); bp.type='bandpass'; bp.Q.value=7;
      const g=an(actx.createGain()); g.gain.value=0;
      o.connect(bp); bp.connect(g); g.connect(pickG);
      // the filter sweeps up and back — kitt's red light crossing and returning
      bp.frequency.setValueAtTime(P*2,t);
      bp.frequency.exponentialRampToValueAtTime(P*12,t+0.6);
      bp.frequency.exponentialRampToValueAtTime(P*2,t+1.2);
      bp.frequency.exponentialRampToValueAtTime(P*9,t+1.7);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.34,t+0.05);
      g.gain.setValueAtTime(0.34,t+1.6);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(); o.stop(t+dur+0.05); stopables.push(o);
      return dur;
    }
    const VOX=[voxEconomy,voxComfort,voxSurf,voxKnight];
    function ridePickStop(){
      if(!pickSrc) return;
      const s2=pickSrc; pickSrc=null; pickTier=-1;
      try{ s2.stop(); }catch(_){}
    }
    /* THE TAP'S AUDITION — synth only, never a file. it sets pickSrc to a
       token and remembers which tier and when; the sounds schedule their own
       stop, so the token is only a stale-guard. made synchronously, so it
       lands on the frame the thumb does. */
    function ridePickVox(i){
      if(disposed||rider.gone) return;
      if(rider.leaving>0) return;              // the leave has its own voice
      if(app!=='rider'||rider.tier!==i) return;
      const fn=VOX[i]; if(!fn) return;
      ridePickStop();
      let dur=1.0; try{ dur=fn()||1.0; }catch(_){}
      pickTier=i;
      pickSrc={ stop(){} };
      const mine=pickSrc;
      setTimeout(()=>{ if(pickSrc===mine){ pickSrc=null; pickTier=-1; needDraw=true; } },
        (dur+0.1)*1000);
    }
    /* THE CONFIRM'S VOICE — the tier's own mp3, played once, over the held
       chart. the tap's synth is cut first: the departure is a different
       sound from the audition and they must never overlap.

       the retry is the whole reason this exists as a poll. decodeRelic bails
       silently on a buffer that has knot landed, so a confirm pressed before
       the bytes are down would sound nothing at all — which is exactly the
       bug the artist hit. it asks again in short breaths until the file is
       there, and gives up only if the black has already arrived (a voice
       that begins where nothing can hold for it is worse than silence).
       returns nothing; it re-solves the hold itself when it lands late. */
    let voxSrc=null;
    function rideVoxStop(){
      if(!voxSrc) return;
      const s2=voxSrc; voxSrc=null;
      try{ s2.onended=null; s2.stop(); }catch(_){}
    }
    function rideVoxFile(i){
      const o=RIDEPICK[i]; if(!o) return 0;
      const tryPlay=()=>{
        if(disposed||rider.gone||voxSrc) return;
        if(rider.blacked) return;              // too late to be heard
        if(!o.buf){ decodeRelic(o); setTimeout(tryPlay,180); return; }
        try{
          const s2=actx.createBufferSource(); s2.buffer=o.buf;
          s2.connect(voxG); stopables.push(s2); s2.start();
          voxSrc=s2;
          s2.onended=()=>{ if(voxSrc===s2) voxSrc=null; needDraw=true; };
          /* landed late: the leave began on the provisional clock because
             the file had knot decoded yet. the span is re-solved from this
             instant — the elapsed seconds are kept and the rest of the hold
             is the whole of this voice, floored so the search still reads. */
          if(rider.leaving>0&&rider.leaving<1&&o.dur>0){
            const el3=rider.leaving*rideHold;
            rideHold=Math.max(el3+o.dur+0.35,FIND_MIN);
            rider.leaving=Math.min(rider.leaving,el3/rideHold);
          }
        }catch(_){}
      };
      ridePickStop();                          // the audition gives way
      tryPlay();
      return (o.buf&&o.dur>0)?o.dur:0;         // 0 = knot known yet
    }
    function vmToggle(){
      if(VM.playing){ VM.offset=actx.currentTime-VM.t0; vmStop(); needDraw=true; }
      else vmPlay(VM.offset);
    }


    /* the calls. ringback at ×5/2 and ×11/4 — 434.20 and 477.62 hz, the
       phone company nearly rational all along. the star's line is station
       0's own arithmetic pulled through a telephone bandpass: carrier ×1,
       comb ×1 ×2 ×3, thump lowpass ×5/2, swell ×1/128. live because the
       math is the stream. mommy's line rings through to her greeting. */
    const call={ state:'idle', who:null, t0:0, tLive:0, ringOn:false };
    let ringG=null, starG=null, lineIn=null, staticG=null, callSrc=null;
    function buildRing(){
      if(ringG) return;
      ringG=an(actx.createGain()); ringG.gain.value=0; ringG.connect(callG);
      for(const f of [P*2.5,P*2.75]){
        const o=an(actx.createOscillator()); o.frequency.value=f;
        const og=an(actx.createGain()); og.gain.value=0.055;
        o.connect(og); og.connect(ringG); o.start(); stopables.push(o); }
    }
    function buildLine(){
      if(lineIn) return;
      lineIn=an(actx.createBiquadFilter()); lineIn.type='bandpass';
      lineIn.frequency.value=P*8; lineIn.Q.value=0.52; lineIn.connect(callG);
      // the star, on the line
      starG=an(actx.createGain()); starG.gain.value=0; starG.connect(lineIn);
      const NH=20, re=new Float32Array(NH+1), im=new Float32Array(NH+1);
      for(let k=1;k<=NH;k++) im[k]=1/Math.pow(k,0.35);
      const osc=an(actx.createOscillator());
      osc.setPeriodicWave(actx.createPeriodicWave(re,im));
      osc.frequency.value=P;
      const mix=an(actx.createGain());
      const combGains=[1.0,0.55,0.35];
      [1,2,3].forEach((k,i)=>{ const f=an(actx.createBiquadFilter());
        f.type='bandpass'; f.frequency.value=P*k; f.Q.value=25;
        const fg=an(actx.createGain()); fg.gain.value=combGains[i];
        osc.connect(f); f.connect(fg); fg.connect(mix); });
      const lp=an(actx.createBiquadFilter()); lp.type='lowpass';
      lp.frequency.value=P*2.5; lp.Q.value=0.7;
      const lg=an(actx.createGain()); lg.gain.value=1.1;
      osc.connect(lp); lp.connect(lg); lg.connect(mix);
      const lfo=an(actx.createOscillator()); lfo.frequency.value=P/128;
      const shp=an(actx.createWaveShaper());
      { const N=256, curve=new Float32Array(N);
        for(let i2=0;i2<N;i2++){ const x=i2/(N-1)*2-1; curve[i2]=x<=0?0:Math.pow(x,6); }
        shp.curve=curve; }
      const lfg=an(actx.createGain()); lfg.gain.value=0.85;
      mix.gain.value=0.30;
      lfo.connect(shp); shp.connect(lfg); lfg.connect(mix.gain);
      mix.connect(starG);
      osc.start(); lfo.start(); stopables.push(osc,lfo);
      // a breath of line hiss for the machine-answered call (a filter over
      // seeded noise, knot a tone)
      const arng=mulberry32(SEED^0x7f4a7c15);
      const n=Math.floor(sr*1.5), nb=actx.createBuffer(1,n,sr), nc=nb.getChannelData(0);
      let b0=0,b1=0;
      for(let i2=0;i2<n;i2++){ const w=arng()*2-1;
        b0=0.997*b0+w*0.029; b1=0.985*b1+w*0.052; nc[i2]=(b0+b1)*0.6; }
      const ns=an(actx.createBufferSource()); ns.buffer=nb; ns.loop=true;
      staticG=an(actx.createGain()); staticG.gain.value=0;
      ns.connect(staticG); staticG.connect(lineIn);
      ns.start(); stopables.push(ns);
    }
    function callStart(who){
      if(call.state!=='idle') return;
      buildRing(); buildLine();
      call.state='ring'; call.who=who; call.t0=tNow; call.ringOn=false;
      setApp('call');
    }
    function callHangup(){
      if(call.state==='idle') return;
      call.state='idle'; call.who=null;
      const t=actx.currentTime;
      if(ringG) ringG.gain.setTargetAtTime(0,t,0.02);
      if(starG) starG.gain.setTargetAtTime(0,t,0.05);
      if(staticG) staticG.gain.setTargetAtTime(0,t,0.05);
      if(callSrc){ const s=callSrc; callSrc=null;
        try{ s.onended=null; s.stop(); }catch(_){}}
      if(app==='call') setApp('phone');
    }
    function callTick(){                      // walked from update()
      if(call.state==='idle') return;
      const t=actx.currentTime, el=tNow-call.t0;
      if(call.state==='ring'){
        const on=(el%6)<2 && el<8;            // two rings: 0–2 and 6–8
        if(on!==call.ringOn){ call.ringOn=on;
          ringG.gain.setTargetAtTime(on?1:0,t,0.012); }
        const answerAt=(call.who==='psr')?7.2:8.6;
        if(el>=answerAt){
          call.state='live'; call.tLive=tNow; call.ringOn=false;
          ringG.gain.setTargetAtTime(0,t,0.012);
          uiTick();                           // the click of the line opening
          if(call.who==='psr'){
            starG.gain.setTargetAtTime(1,t+0.12,0.06);
          }else{                              // mommy's machine picks up
            staticG.gain.setTargetAtTime(0.05,t+0.1,0.1);
            if(VM.ab){ decodeRelic(VM,()=>{
              if(disposed||call.state!=='live'||call.who!=='mommy') return;
              const s=actx.createBufferSource(); s.buffer=VM.buf;
              s.connect(lineIn); stopables.push(s);
              s.start(actx.currentTime+0.55);
              callSrc=s; VM.heard=true;
              s.onended=()=>{ if(callSrc===s){ callSrc=null;
                setTimeout(()=>{ if(call.who==='mommy') callHangup(); },900); } };
            }); }
            else{ setTimeout(()=>{ if(call.who==='mommy') callHangup(); },7000); }
          }
          needDraw=true;
        }
      }
    }

    /* ---------------- the os ----------------
       a small quiet system drawn to one canvas. cool blue-white for the
       fixed things, gold only on what sounds, the sac's red for the one
       unheard thing. lowercase everywhere; numerals wear georgia, the same
       face as the radio's dial. */
    /* sans is NEW and it is used in exactly one place: the home screen's
       icon labels, plus the two numerals inside the calendar and clock
       icons, which are part of those drawings. on ios it resolves to SF Pro
       — the visitor's own phone's face, which is the point. every room
       behind the icons still speaks in mono and georgia. */
    const F={ mono:'ui-monospace,Menlo,Consolas,monospace', serif:'Georgia,serif',
              sans:'-apple-system,BlinkMacSystemFont,"SF Pro Text",'+
                   'system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif' };
    const ink=a=>'rgba(226,240,255,'+a+')';
    const wrm=a=>'rgba(255,195,122,'+a+')';
    const gld=a=>'rgba(226,168,62,'+a+')';
    const red=a=>'rgba(224,36,22,'+a+')';
    const grn=a=>'rgba(63,208,106,'+a+')';

       have no emoji to type, and a menu with two real glyphs and two
       drawings would read as a mistake. so all four are drawn in the same
       hand — filled, rounded, one soft highlight, one dark seat of shadow.
       the app icon on the home grid stays in ink: the grid is monochrome and
       one colour car in it would announce itself. only the red runs there. */
    /* ---- economy · a bicycle built for two ----
       it was an auto-rickshaw and the artist has ruled it a TANDEM, which is
       the better joke and it was already half-made: economy's tap has rung a
       bicycle bell (×3 ×8 ×15) since the day the tiers got voices, and the
       drawing was the only thing in the row still claiming an engine. now the
       cheapest way to a dead star is two people pedalling.

       the row still says ONE SEAT, at his word, and that is the whole point
       of drawing two. the app is knot lying — it is selling you the seat it
       has. who the other saddle is for is knot the app's business.

       drawn in the same hand as its siblings: filled, rounded, one soft
       highlight. the tell of a tandem at 44 units is knot the length, it is
       the PAIR — two saddles, two sets of bars, two cranks — so those are
       drawn heavy and everything else is frame. */
    function gTandem(x,y){                    // economy · one seat, two saddles
      sq.save(); sq.translate(x,y);
      const RW=[-13.2,6.6], FW=[13.2,6.6], WR=7.0;
      const BB1=[-6.2,6.6], BB2=[4.6,6.6];    // the two sets of cranks
      const S1=[-10.2,-6.2], S2=[0.2,-6.2];   // the two saddles
      const HD=[9.8,-5.4];                    // the head tube, where the bars sit
      // the wheels, drawn first and clear of the frame
      sq.strokeStyle='rgba(190,214,244,0.52)'; sq.lineWidth=0.7;
      for(const w of [RW,FW]) for(let k=0;k<8;k++){ const a=k/8*6.2831853;
        sq.beginPath(); sq.moveTo(w[0],w[1]);
        sq.lineTo(w[0]+Math.cos(a)*(WR-1.2),w[1]+Math.sin(a)*(WR-1.2)); sq.stroke(); }
      sq.strokeStyle='#6a7686'; sq.lineWidth=2.3;   // pale, so the tyre reads on a dark sheet
      for(const w of [RW,FW]){ sq.beginPath(); sq.arc(w[0],w[1],WR,0,6.283); sq.stroke(); }
      sq.fillStyle='#8d97a6';
      sq.beginPath(); sq.arc(RW[0],RW[1],1.6,0,6.283);
      sq.arc(FW[0],FW[1],1.6,0,6.283); sq.fill();
      // the frame — two diamonds sharing the captain's seat post
      sq.strokeStyle='#3f8f5e'; sq.lineWidth=2.1;
      sq.lineCap='round'; sq.lineJoin='round';
      sq.beginPath();
      sq.moveTo(RW[0],RW[1]); sq.lineTo(BB1[0],BB1[1]);        // chainstay
      sq.lineTo(S1[0],S1[1]); sq.lineTo(RW[0],RW[1]);          // seat tube · seat stay
      sq.moveTo(S1[0],S1[1]); sq.lineTo(S2[0],S2[1]);          // the long top tube
      sq.lineTo(BB1[0],BB1[1]);                                // the boom, down to the rear cranks
      sq.moveTo(S2[0],S2[1]); sq.lineTo(BB2[0],BB2[1]);        // captain's seat tube
      sq.lineTo(HD[0],HD[1]); sq.lineTo(S2[0],S2[1]);          // down tube · second top tube
      sq.moveTo(HD[0],HD[1]); sq.lineTo(FW[0],FW[1]);          // the fork
      sq.stroke();
      sq.strokeStyle='rgba(255,255,255,0.34)'; sq.lineWidth=0.9;  // the one highlight
      sq.beginPath(); sq.moveTo(S1[0]+1.2,S1[1]-0.8); sq.lineTo(S2[0]-1.2,S2[1]-0.8); sq.stroke();
      // the cranks, and one chainring, so the thing is pedalled and knot driven
      sq.strokeStyle='#59636f'; sq.lineWidth=1.5;
      sq.beginPath(); sq.arc(BB2[0],BB2[1],2.9,0,6.283); sq.stroke();
      sq.lineWidth=1.3; sq.strokeStyle='#8d97a6';
      sq.beginPath(); sq.moveTo(BB1[0],BB1[1]); sq.lineTo(BB1[0]-0.6,BB1[1]+3.4);
      sq.moveTo(BB2[0],BB2[1]); sq.lineTo(BB2[0]+0.6,BB2[1]+3.4); sq.stroke();
      // the two sets of bars — the stoker's off the captain's post, the captain's off the head
      sq.strokeStyle='#9aa5b4'; sq.lineWidth=1.9; sq.lineCap='round';
      sq.beginPath();
      sq.moveTo(S2[0]-2.6,S2[1]-1.6); sq.lineTo(S2[0]+1.4,S2[1]-1.6);
      sq.moveTo(HD[0]-2.4,HD[1]-1.8); sq.lineTo(HD[0]+1.8,HD[1]-1.8); sq.stroke();
      /* the two saddles, PALE and heavy. they were near-black leather, which
         is what a saddle is and which on a near-black sheet is a hole — and
         the pair of saddles is the entire argument this drawing is making.
         so they are the lightest thing on the bicycle. */
      sq.fillStyle='#d2dceb';
      for(const s of [S1,S2]){
        sq.beginPath(); sq.moveTo(s[0]-4.4,s[1]-0.4);
        sq.quadraticCurveTo(s[0]-4.8,s[1]-2.8,s[0]-1.6,s[1]-2.8);
        sq.lineTo(s[0]+3.6,s[1]-2.5);
        sq.quadraticCurveTo(s[0]+5.0,s[1]-2.2,s[0]+3.2,s[1]-0.5);
        sq.closePath(); sq.fill(); }
      sq.fillStyle='rgba(28,42,56,0.45)';        // one seam, so a saddle has a nose
      for(const sd of [S1,S2]) roundRectPath(sq,sd[0]-3.0,sd[1]-1.5,5.6,0.8,0.4);
      sq.fill();
      // the bell, which is the sound this tier already answers in
      sq.fillStyle='#f2c53d';
      sq.beginPath(); sq.arc(HD[0]-3.4,HD[1]-3.4,1.7,0,6.283); sq.fill();
      sq.restore();
    }

    /* the 1982 pontiac firebird trans am. a real car, drawn from its own
       proportions — the long wedge nose, the shallow fastback, the rear
       spoiler — and given the red scanning lamp across its face. the lamp
       SWEEPS: it is the one thing on this menu that moves, and a light that
       moves is a living or sounding thing, so the house law lets it have its
       red honestly. the sweep is on the pulsar's own clock. */
    function gKitt(x,y,t){
      sq.save(); sq.translate(x,y);
      sq.fillStyle='#232a35';                 // the wheels, under everything
      sq.beginPath(); sq.arc(-9.5,4.6,4.9,0,6.283); sq.arc(9.5,4.6,4.9,0,6.283); sq.fill();
      sq.fillStyle='#8f9aa9';
      sq.beginPath(); sq.arc(-9.5,4.6,2.0,0,6.283); sq.arc(9.5,4.6,2.0,0,6.283); sq.fill();
      sq.beginPath();                         // the body: long wedge nose, shallow fastback
      sq.moveTo(-17.4,3.6); sq.lineTo(-16.8,-1.6);
      sq.quadraticCurveTo(-15.8,-4.4,-10.8,-4.8);
      sq.lineTo(-7.4,-9.8); sq.quadraticCurveTo(-6.4,-11.0,-3.6,-11.0);
      sq.lineTo(4.8,-11.0); sq.quadraticCurveTo(6.8,-10.9,7.8,-9.2);
      sq.lineTo(11.0,-4.6); sq.quadraticCurveTo(16.2,-4.0,17.2,-1.4);
      sq.lineTo(17.6,3.6); sq.closePath();
      sq.fillStyle='#1b212b'; sq.fill();
      sq.strokeStyle='#4a5a71'; sq.lineWidth=1.1; sq.stroke();   // the rim, so black reads on black
      sq.fillStyle='#101319';                 // the spoiler, off the back
      roundRectPath(sq,-19.6,-3.0,5.4,2.4,1); sq.fill();
      sq.fillStyle='#33506e';                 // the glass
      sq.beginPath(); sq.moveTo(-6.4,-5.2); sq.lineTo(-3.6,-9.6);
      sq.lineTo(4.4,-9.6); sq.lineTo(6.8,-5.2); sq.closePath(); sq.fill();
      sq.fillStyle='rgba(190,214,244,0.30)';
      sq.beginPath(); sq.moveTo(-3.4,-9.2); sq.lineTo(0.6,-9.2);
      sq.lineTo(-1.6,-5.6); sq.lineTo(-5.0,-5.6); sq.closePath(); sq.fill();
      /* THE GOLD STRIPE IS GONE, at his word. it was the trans am's own
         pinstripe and it was also the only warm thing on this car that does
         knot move — which put it on the wrong side of the law the scanner
         lives by. the profile is all ink and one red light now, the way the
         face on the home tile always was. */
      /* the scanner. a bar of red across the nose, and one node of it
         brighter, walking. it is the one thing on this menu that moves, and
         a light that moves is a living or sounding thing — so the house law
         lets it keep its red honestly. the walk is on the pulsar's clock. */
      const sw=Math.sin((t||0)*Math.PI*2*(P/512));
      sq.fillStyle='rgba(96,12,10,0.95)';
      roundRectPath(sq,8.6,-3.4,9.0,3.0,1.4); sq.fill();
      const nx=13.1+sw*3.0;
      const rg=sq.createRadialGradient(nx,-1.9,0,nx,-1.9,6.4);
      rg.addColorStop(0,'rgba(255,96,74,0.98)');
      rg.addColorStop(0.30,'rgba(232,40,24,0.62)');
      rg.addColorStop(1,'rgba(232,40,24,0)');
      sq.fillStyle=rg; sq.beginPath(); sq.arc(nx,-1.9,6.4,0,6.283); sq.fill();
      sq.fillStyle='rgba(255,206,196,0.98)';
      roundRectPath(sq,nx-1.1,-3.0,2.2,2.2,1.0); sq.fill();
      sq.restore();
    }

      const mm=d.getMinutes()+d.getSeconds()/60, hh=(d.getHours()%12)+mm/60;
      const ha=hh/12*6.283-Math.PI/2, ma=mm/60*6.283-Math.PI/2;

      sq.lineCap='round'; sq.lineWidth=2;

      sq.strokeStyle=ink(0.5); sq.lineWidth=0.8;
      sq.beginPath(); sq.moveTo(x,y); sq.lineTo(x+Math.cos(sa2)*10.2,y+Math.sin(sa2)*10.2); sq.stroke(); }

      sq.beginPath();
      sq.moveTo(0,2.8);

    /* the dressing. 'tile' is the grid; ?icons=ink puts the old hairline

    const ICONART=((ctx.CFG&&ctx.CFG.icons)==='ink')?'ink':'tile';

    /* ================= the app icons, dressed as app icons =================

       RULED BY THE ARTIST, THREE TIMES, and the third ruling REVERSES the
       second. it is worth keeping all three, because the reversal is the
       useful part.

       first (aug 9): the grid used to be sixteen hairline drawings floating
       on translucent panels — the house's own hand, and handsome, and WRONG
       for the one job this screen has. what lands under the dead call has to
       read as "a home screen — theirs, they will assume", and nobody's home
       screen is sixteen outlines in one colour. so: solid tiles, apple's own
       corner.

       second (aug 9): he sent a photograph of his own phone running the DARK
       icon set — every apple tile the same charcoal squircle, all the colour
       in the mark — and 👁️ wrote at the time that "the house GAINS by it",
       because one dark tile with colour only in the mark sits closer to the
       colour law than a lit panel ever did.

       third (aug 9, this pass): he sent a MOCKUP of the screen he actually
       wants, and it is the bright set. green phone, white calendar, blue
       weather, red music, tan store, apple's own map. the dark tiles survive
       on exactly four apps — egg, pulsr, rider, starmaps — which are the
       house's OWN four, the ones that exist nowhere else.

       AND THAT IS THE BETTER ARRANGEMENT, for a reason the second ruling
       missed. the second pass optimised the grid against the colour law. but
       this screen's job is knot to obey the law, it is to be MISTAKEN — and
       a screen where every tile is charcoal is a screen with a look, and a
       look is a thing a stranger notices. the bright set has no look. it is
       what is already in their pocket. so the forgery outranks the colour
       law here, exactly as it already outranks the voice law on the labels
       and as `unknown.html` bends nearly every law it touches, and the four
       dark tiles left standing are knot a compromise: they are the four
       things in the visitor's hand that are knot theirs, and now they are the
       only four that LOOK it.

       THE BEND, CONFESSED, SO IT IS NEVER MISTAKEN FOR AN OVERSIGHT: the
       weather tile carries a yellow sun and the store tile carries warm sand.
       neither is a living or a sounding thing. gold is spoken for everywhere
       else in the house and it is spoken for on every surface behind these
       icons; it is spent here, on this grid only, to buy the two seconds.
       the rooms behind the icons are untouched.

       the labels are TITLE CASE in the system face — `Calendar`, `Weather`,
       `MeTube` — which is the voice law bending on the same grounds. the
       rooms behind them still speak in mono and lowercase. ?icons=ink puts
       the old hairline grid back whole, for the comparison.
       ======================================================================= */

    /* the ios corner. apple does knot draw a rounded rectangle — the corner of
       an app icon is one continuous curve with no seam where the arc meets the
       edge, and the eye catches that long before it can name it. this is a
       superellipse at n=5 walked in 72 steps; at 2× on this canvas that is
       under half a device pixel per step. it is the cheapest single thing that
       makes a square read as an app. */
    function squircle(q,cx,cy,w,h,n){
      const a=w/2, b=h/2, e=2/(n||5);
      q.beginPath();
      for(let i=0;i<=72;i++){
        const th=i/72*6.2831853, c=Math.cos(th), s=Math.sin(th);
        q[i?'lineTo':'moveTo'](cx+a*(c<0?-1:1)*Math.pow(Math.abs(c),e),
                               cy+b*(s<0?-1:1)*Math.pow(Math.abs(s),e));
      }
      q.closePath();
    }

    /* THE SIZE IS THE ARTIST'S. it was 62 units, then his measure took it to
       95% (60.8), and this pass he asked for 2% back — 60.8 × 1.02 = 62.02,
       which lands within a fiftieth of a unit on the 62-unit box every glyph
       below was written in. so TA is 1 again and the scale-on-the-way-in is a
       no-op that stays, because the next ruling will want it. */
    const TS=62.0, TA=TS/62;

    /* the grounds. `bg` is the icon's own, two stops and a flag that says the
       ground is LIGHT — which decides only where the seam goes: a dark tile on
       true #000 has no boundary without a lit hairline along its top, and a
       white tile has the opposite problem and wants the light gathered
       differently. no gloss dome anywhere: that is ios 9, and this phone draws
       a dynamic island. */
    const TILE_A='#31313a', TILE_B='#131317';
    const BG={
      white : { a:'#ffffff', b:'#e9ecf0', lite:true },
      /* SATURATED, at his word. it carries the telephone and the message
     bubble, which on a real screen are the same green and must stay so. */
  green : { a:'#4ff06a', b:'#07a831' },
      blue  : { a:'#5aabf6', b:'#1465d8' },
      red   : { a:'#ff5c74', b:'#e30035' },   // punched up, his word
      sand  : { a:'#f0c68f', b:'#d69a53' },
      steel : { a:'#eef0f3', b:'#a9aeb7', lite:true },
    };
    function tile(x,y,bg){
      const a=(bg&&bg.a)||TILE_A, b=(bg&&bg.b)||TILE_B, lite=!!(bg&&bg.lite);
      squircle(sq,x,y,TS,TS);
      const lg=sq.createLinearGradient(0,y-TS/2,0,y+TS/2);
      lg.addColorStop(0,a); lg.addColorStop(1,b);
      sq.fillStyle=lg; sq.fill();
      sq.save(); squircle(sq,x,y,TS,TS); sq.clip();
      const sh=sq.createRadialGradient(x-TS*0.34,y-TS*0.40,0,x-TS*0.34,y-TS*0.40,TS*0.95);
      sh.addColorStop(0,lite?'rgba(255,255,255,0.34)':'rgba(255,255,255,0.10)');
      sh.addColorStop(1,'rgba(255,255,255,0)');
      sq.fillStyle=sh; sq.fillRect(x-TS/2,y-TS/2,TS,TS);
      sq.restore();
      squircle(sq,x,y,TS-1,TS-1);
      const eg=sq.createLinearGradient(0,y-TS/2,0,y+6);
      eg.addColorStop(0,lite?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.20)');
      eg.addColorStop(1,'rgba(255,255,255,0)');
      sq.strokeStyle=eg; sq.lineWidth=1; sq.stroke();
    }
    /* everything an icon draws is drawn inside its own tile, at its own origin,
       in the 62-unit box the glyphs were written for. art that runs off the edge
       is cut by the corner, which is how apple's own maps and photos are built. */
    function inTile(x,y,fn){ sq.save(); squircle(sq,x,y,TS,TS); sq.clip();

    /* ---- starmaps · THE CONSTELLATION IS PICTOR NOW, AND IT IS TRUE ----

    function tSky(){

    /* ---- photos ----
       it used to be the ink grid's eight little ellipses scaled up, and the
       artist is right that it was knot his: at 2.15× they read as a spinning
       pinwheel of flat blobs with no centre and no bloom.

       HIS IS A FLOWER, and the thing that makes it one is the HOLE. the
       petals do knot reach the middle — they stop about a sixth of the way
       out and leave a white eye, and every apparent `glow` in the centre of
       the real icon is that gap doing the work. the second thing is the
       OVERLAP: adjacent petals cross for a couple of units at their widest
       and the crossing mixes to an intermediate hue, so eight petals read as
       a continuous wheel of colour rather than eight of anything.

       the numbers are solved and knot eyed: a petal is an ellipse of 8.6 ×
       11.6 centred 18 out, so it runs from radius 6.4 to 29.6 — inside the
       tile by a unit and a half — and at its widest the arc between two
       centres is 18 × 45° = 14.1 units against two half-widths of 8.6, which
       overlaps by 3.1. enough to mix, knot enough to muddy. */
    /* ---- photos, THIRD PASS, off the photograph ----
       the ellipse version was closer than the pinwheel and it was still knot
       his, and enlarging the reference tile to 600px said why in three
       places.

       THE PETAL IS KNOT AN ELLIPSE. it is a CAPSULE WITH TWO DIFFERENT
       RADII — a small round cap at the inner end, a big round cap at the
       outer, and the two joined by their outer tangents. that is why the
       real flower reads as eight fat fingers rather than eight leaves: the
       outer end is blunt, knot pointed, and it is nearly twice the width of
       the inner end. the tangent construction is exact (the angle between
       the axis and each tangent is asin((r2−r1)/d)), so the join has no
       corner in it at any size.

       THE OVERLAPS MULTIPLY. every apparent `third colour` in the real icon
       — the deep orange where red crosses yellow, the teal where green
       crosses blue — is two translucent films over each other, knot a
       painted colour. so the petals are drawn in `multiply` at 0.72, which
       on a white tile is identical to source-over for a lone petal and goes
       correctly dark exactly where two cross. this is one line of code doing
       what eight hand-mixed hues would have done badly.

       THE HOLE IS BIGGER THAN 👁️ HAD IT. the inner caps stop at radius 6.5
       and the white eye reads to about 8, which is an eighth of the tile —
       measured off the photograph, where the gap is unmistakable and mine
       was a pinprick.

       the hues are walked off the reference clockwise from the top: orange,
       gold, lime, green, blue, violet, magenta, red. */
    function tPhotos(){
      const HUE=[30,46,78,134,214,258,306,2];
      sq.save();
      sq.globalCompositeOperation='multiply';
      sq.globalAlpha=0.86;
      const R1=5.5, D1=11.8, R2=9.3, D2=20.2;      // inner cap · outer cap
      const th=Math.asin((R2-R1)/(D2-D1));          // the tangent's own angle
      for(let k=0;k<8;k++){
        sq.save(); sq.rotate(k/8*6.2831853);
        /* the axis runs UP the negative y, so both caps sit at (0,−D) and the
           external tangent touches BOTH circles at the same angle th off the
           x-axis — the small cap is walked along its bottom (through +y) and
           the big one along its top (through −y), which closes the capsule
           with two straight tangents and no corner at either join. */
        sq.beginPath();
        sq.arc(0,-D1, R1, th,          Math.PI-th);
        sq.arc(0,-D2, R2, Math.PI-th,  th);
        sq.closePath();
        /* the ramp is SHALLOW on purpose. 👁️ had the tip at 68% lightness
           and under multiply on a white tile that is very nearly nothing —
           eight petals that faded out at exactly the end the eye measures
           them by, which read as eight teardrops pointing the wrong way. the
           real ones hold their colour to the cap and lift only a little. */
        const g=sq.createLinearGradient(0,-D1+R1,0,-D2-R2);
        g.addColorStop(0.00,'hsl('+HUE[k]+',86%,60%)');
        g.addColorStop(0.50,'hsl('+HUE[k]+',92%,54%)');
        g.addColorStop(1.00,'hsl('+HUE[k]+',90%,59%)');
        sq.fillStyle=g; sq.fill();
        sq.restore();
      }
      sq.restore();
      /* the outer rim light. one hairline along the blunt cap of each petal,
         source-over and white — it is the gloss on the film and it is the
         difference between eight coloured shapes and eight coloured OBJECTS. */
      sq.save();
      sq.strokeStyle='rgba(255,255,255,0.5)'; sq.lineWidth=1.1;
      for(let k=0;k<8;k++){
        sq.save(); sq.rotate(k/8*6.2831853);
        sq.beginPath(); sq.arc(0,-D2,R2-0.5,Math.PI*1.18,Math.PI*1.86); sq.stroke();
        sq.restore();
      }
      sq.restore();
      sq.save();
      /* the eye, PAINTED WHITE. 👁️ punched it with destination-out first and
         wrote a confident comment explaining why that was better — that the
         tile would show through and so the eye could never go grey. THE
         COMMENT WAS WRONG AND THE ARTIST SAW IT ON A REAL SCREEN: this whole
         ui is one canvas that is cleared to TRANSPARENT and composited onto
         the glass, so destination-out does knot stop at the tile. it cuts
         through the tile, through the canvas, and out the other side, and
         what shows in the hole is the sheet behind — which is black. the
         `it shows the tile through` reasoning only holds if there is
         something opaque underneath, and on this screen there never is. */
      const h=sq.createRadialGradient(0,0,0,0,0,7.4);
      h.addColorStop(0,'rgba(255,255,255,1)');
      h.addColorStop(0.55,'rgba(255,255,255,0.96)');
      h.addColorStop(1,'rgba(255,255,255,0)');
      sq.fillStyle=h; sq.beginPath(); sq.arc(0,0,7.4,0,6.2831853); sq.fill();
      sq.restore();
    }

    /* safari. the needle is the whole icon — the ring is just a ring. red

    function tSafari(){
      /* ---- THIRD PASS, AND THE LAST ONE HAD THE ICON INSIDE OUT ----

         👁️ drew a blue annulus with a WHITE face and dark ticks on the white,
         and wrote a confident paragraph about how the dense ring of ticks is
         what the eye identifies. the ring was the right observation and the
         colours were exactly backwards. enlarging his dock photograph to
         600px settles it: the disc is BLUE ALL THE WAY ACROSS and the ticks
         are WHITE, cut into the blue. there is no white face at all. the
         needle floats on blue.

         because a white face makes the icon read as a hole with a ring
         around it and a blue face makes it read as a dial.

         the rest is measured off the same enlargement. the disc is 0.82 of
         the tile. its gradient runs light cyan-blue at the top (108,178,240
         sampled) to a saturated royal at the bottom (60,118,242) — it gets
         BLUER as it falls, knot merely darker, which is why a plain lightness
         ramp never looked right. the ticks are inset about a tenth of the
         radius. the needle is longer than mine and split ACROSS its middle,
         knot along its spine: two triangles base to base at the centre, red
         to the north-east, white behind. */
      const bgg=sq.createLinearGradient(0,-31,0,31);
      bgg.addColorStop(0,'#ffffff'); bgg.addColorStop(1,'#e2e6ec');
      sq.fillStyle=bgg; sq.fillRect(-31,-31,62,62);
      // the disc, and the thin cool rim that sits it into the tile
      const rg=sq.createLinearGradient(0,-25.5,0,25.5);
      rg.addColorStop(0.00,'#6db6f5');
      rg.addColorStop(0.32,'#57a4f2');
      rg.addColorStop(0.72,'#3c81f3');
      rg.addColorStop(1.00,'#2f6bf0');
      sq.fillStyle=rg; sq.beginPath(); sq.arc(0,0,25.4,0,6.283); sq.fill();
      sq.strokeStyle='rgba(255,255,255,0.42)'; sq.lineWidth=1;
      sq.beginPath(); sq.arc(0,0,25.0,Math.PI*1.08,Math.PI*1.92); sq.stroke();
      // sixty white ticks, every fifth one long — cut INTO the blue
      for(let k=0;k<60;k++){ const a=k/60*6.283, five=(k%5)===0;
        sq.strokeStyle=five?'rgba(255,255,255,0.94)':'rgba(255,255,255,0.72)';

        sq.lineTo(Math.cos(a)*(23.4-l),Math.sin(a)*(23.4-l)); sq.stroke(); }

    /* ---- the handset. KNOT DRAWN BY ME, AND THAT IS THE POINT ----

   wrong the same way: 👁️ built a shaft and hung ends on it, then a ribbon,
   then a ribbon with splayed cups — each one nearer, none of them APPLE'S.
   a different handset in the same slot is the same failure as a broken one
   on a screen whose whole job is to be indistinguishable, and 👁️ should
   have gone looking before drawing, because the artist had already had this
   argument once and won it: unknown.html carries a handset that was knot
   invented at all. it was MEASURED — thresholded out of a screenshot of the
   real sheet at 61×61, resampled to a 30×30 mask, and fitted until the two
   masks disagreed on 7.7% of cells.

   so this is that path, ported curve for curve out of unknown.html's svg
   into canvas. the front door and the home screen now draw the SAME
   telephone, from the same fifteen cubics, which is what they should have
   been doing from the start — and if the artist ever re-traces it, the two
   files can be corrected from one place.

       a rotated Y ending in a dot. the bright tile is the steel ground with
       the marks in machine greys — nothing here has ever sounded and nothing
       here is warm. the ink understudy is the same figure in hairline. */
    function gearMarks(band,tooth){
      // outer band, teeth inward
      sq.strokeStyle=band; sq.lineWidth=4.6;
      sq.beginPath(); sq.arc(0,0,21.6,0,6.2832); sq.stroke();
      sq.lineWidth=1.7; sq.lineCap='butt';

        sq.lineTo(Math.cos(a)*15.6,Math.sin(a)*15.6); sq.stroke(); }
      // the hub: three spokes and the dot
      sq.lineWidth=2.5; sq.lineCap='round';
      for(let k=0;k<3;k++){ const a=-1.5708+k*2.0944;

    /* ---- mail — THE MAIL PASS. the letters go out now. ---- */

       reply's header is printed, immutable — to: the departed · bcc: the
       star. NOBODY's bounce machinery (mailPump, the tape) stands below,
       unfed — the scar precedent: one call restores it. */
    const P_MS=1000/P;
    /* the care list — §7's tripwire. dumb substrings, never a model; the
       keyboard already keeps everything lowercase, so plain matching is
       enough. short on purpose: it must never guess, only recognize the
       unmistakable. checked on send, kept nowhere, sent nowhere. */
    const CARE_WORDS=['kill myself','end my life','want to die','suicide',
      'suicidal','hurt myself','harm myself','self harm','self-harm',
      'better off dead','end it all','no reason to live'];
