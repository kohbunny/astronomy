    /* the return — checked every sheet redraw and belted by a timeout, so a
       throttled background tab still lands the letter the moment the glass
       is looked at again. never under a reader's feet. */
    function mailPump(){
      if(app==='letter') return;
      const now=Date.now(); let landed=false;
      for(let i=MAIL_PEND.length-1;i>=0;i--){
        if(MAIL_PEND[i].at<=now){
          const L=MAIL_PEND.splice(i,1)[0].letter; L.back=true;
          MAILS.unshift({ f:'NOBODY', s:L.s, tm:'today', un:true, ret:true,
            b:L.b.slice() });
          landed=true; } }
      if(landed) needDraw=true;
    }

    /* ---- THE SEANCE ENGINE (full confession in the html top) ----
       the quantize: every interval snaps to P·2^5 ≈ 184 ms — coarse on
       purpose. finer would keep a person's typing fingerprint; this grid
       destroys it, and the same grid is the groove. */
    const QMS=P_MS*32;
    const DEG=[2,3/2,4/3,1,3/4,2/3,1/2,1/2];   // fast climbs; hesitation falls
    function wordsN(s2){ let n=0,w2=false;
      for(let i2=0;i2<s2.length;i2++){ const c2=s2.charCodeAt(i2)>32;
        if(c2&&!w2){ n++; w2=true; } else if(!c2) w2=false; }
      return n; }
    /* the cap, wordless: about the length of the letter itself. counted
       from its own body at build — no numeral ever reaches a surface. */
    const WCAP=wordsN(MAILS[0].b.join(' '));

    /* the grain voice. everything through mailG into the house gate; the
       ghost path is lowpassed — voices behind glass. degrade silently. */
    let mailG=null, ghostG=null;
    function mailAudio(){
      if(mailG||disposed) return;
      try{
        mailG=an(actx.createGain()); mailG.gain.value=0.5; mailG.connect(gate);
        ghostG=an(actx.createGain()); ghostG.gain.value=0;
        const lp=an(actx.createBiquadFilter()); lp.type='lowpass';
        lp.frequency.value=900; lp.Q.value=0.4;
        ghostG.connect(lp); lp.connect(mailG);
      }catch(_){}
    }
    function grain(deg,ghost,rev){
      mailAudio(); if(!mailG) return;
      try{
        const o=actx.createOscillator(); o.type='sine';
        o.frequency.value=P*deg;
        const g2=actx.createGain(); g2.gain.value=0;
        o.connect(g2); g2.connect(ghost?ghostG:mailG);
        const t0=actx.currentTime;
        if(rev){ /* erasure, audible: the note sucked back */
          g2.gain.setValueAtTime(0.0001,t0);
          g2.gain.exponentialRampToValueAtTime(ghost?0.05:0.16,t0+0.19);
          g2.gain.linearRampToValueAtTime(0,t0+0.206); }
        else{ g2.gain.setValueAtTime(0.0001,t0);
          g2.gain.exponentialRampToValueAtTime(ghost?0.05:0.16,t0+0.008);
          g2.gain.exponentialRampToValueAtTime(0.0001,t0+(ghost?0.34:0.24)); }
        o.start(t0); o.stop(t0+0.42);
      }catch(_){}
    }

    /* the rain — blooms where the invisible words fall. transient, never
       kept: the glass shows the shape of a letter and dries. */
    const blooms=[];
    const bpen={ x:24, y:0, maxY:288 };        // the visitor's pen
    const gpen={ x:24, y:0, maxY:520 };        // the departed's pen
    function bloomsClear(ghost){
      for(let i2=blooms.length-1;i2>=0;i2--)
        if(blooms[i2].ghost===ghost) blooms.splice(i2,1);
      const pen=ghost?gpen:bpen; pen.x=24; pen.y=0;
    }
    function bloomAdd(kind,deg,ghost){
      const pen=ghost?gpen:bpen;
      if(kind==='b'){ pen.x=Math.max(24,pen.x-13); }
      else if(kind==='n'){ pen.x=24; pen.y+=22; }
      else{ pen.x+=(kind==='w'?18:13);
        if(pen.x>324){ pen.x=24; pen.y+=22; } }
      if(pen.y>pen.maxY){ const d2=pen.y-pen.maxY;
        for(const b3 of blooms) if(b3.ghost===ghost) b3.y-=d2;
        pen.y=pen.maxY; }
      blooms.push({ x:pen.x+Math.sin((pen.x+pen.y)*0.71)*2.5, y:pen.y,
        r:kind==='b'?6.5:(3.5+2.6*Math.max(0,2-deg)),
        born:tNow, ghost:!!ghost, rev:kind==='b' });
      if(blooms.length>150) blooms.shift();
      needDraw=true;
    }
    function drawRain(y0,hh,ghostOnly){
      sq.save(); sq.beginPath(); sq.rect(0,y0-6,UIW,hh+12); sq.clip();
      for(const b3 of blooms){
        if(ghostOnly&&!b3.ghost) continue;
        const age=tNow-b3.born, life=b3.ghost?3.4:3.0;
        if(age>life) continue;
        const a2=(1-age/life)*(b3.ghost?0.20:0.50);
        const rr=b3.r+age*(b3.ghost?2.0:2.8);
        const sy=y0+b3.y;
        if(b3.rev){ sq.strokeStyle=gld(a2); sq.lineWidth=1;
          sq.beginPath(); sq.arc(b3.x,sy,rr,0,6.283); sq.stroke(); }
        else{ sq.fillStyle=gld(a2);
          sq.beginPath(); sq.arc(b3.x,sy,rr,0,6.283); sq.fill(); }
      }
      sq.restore();
    }

    /* the founding voices — seven seeded scores, words that never existed.
       rhythm dealt from fixed streams; dates are fixed history, floored. */
    function seanceScore(seed,when){
      const r2=mulberry32(seed>>>0), ev=[]; let t2=0,last=1;
      const words=6+Math.floor(r2()*26);
      for(let w2=0;w2<words;w2++){
        const L2=2+Math.floor(r2()*7);
        for(let i2=0;i2<L2;i2++){
          const q=Math.min(8,1+Math.floor(r2()*3)+(r2()<0.12?2:0));
          t2+=q*QMS; const d=DEG[q-1];
          ev.push({ t:t2, k:'g', d:d }); last=d; }
        if(r2()<0.10){ const n2=1+Math.floor(r2()*3);
          for(let i2=0;i2<n2;i2++){ t2+=QMS*(1+Math.floor(r2()*2));
            ev.push({ t:t2, k:'b', d:last }); } }
        const pq=r2()<0.16?(6+Math.floor(r2()*10)):(2+Math.floor(r2()*3));
        t2+=pq*QMS; ev.push({ t:t2, k:'w', d:2 });
      }
      return { ev:ev, secs:Math.max(1,Math.round(t2/1000)), when:when };
    }
    const SEANCE_POOL=[
      seanceScore(0xA11CE01,'in march'), seanceScore(0xA11CE02,'in april'),
      seanceScore(0xA11CE03,'2 may'),    seanceScore(0xA11CE04,'in may'),
      seanceScore(0xA11CE05,'in june'),  seanceScore(0xA11CE06,'9 june'),
      seanceScore(0xA11CE07,'in july') ];
    const seanceRng=mulberry32((SEED^0x5EA9CE)>>>0);

    /* the seance — one departed at a time, held, let go, much later
       another. runs only while the letter is open; leaving the room simply
       stops the dealing. */
    const seance={ cur:null, idx:0, at0:0, wait:0, line:'', lineUntil:0 };
    function seanceReset(){
      seance.cur=null; seance.idx=0; seance.wait=0;
      seance.line=''; seance.lineUntil=0;
      bloomsClear(true); gpen.maxY=520;
      mailAudio();
      if(ghostG) try{ ghostG.gain.setTargetAtTime(1,actx.currentTime,0.4); }catch(_){}
    }
    function seanceTick(){
      const now=Date.now();
      if(!seance.cur){
        if(!seance.wait) seance.wait=now+P_MS*4096;   // the room breathes first
        if(now>=seance.wait){ seance.wait=0;
          const sc=SEANCE_POOL[Math.floor(seanceRng()*SEANCE_POOL.length)];
          seance.cur=sc; seance.idx=0; seance.at0=now;
          seance.line='someone wrote this · '+sc.secs+' seconds'+
            (sc.when?' · '+sc.when:''); }
        return;
      }
      const el=now-seance.at0, es=seance.cur.ev;
      while(seance.idx<es.length&&es[seance.idx].t<=el){
        const e=es[seance.idx++];
        grain(e.d,true,e.k==='b'); bloomAdd(e.k,e.d,true);
      }
      if(seance.idx>=es.length&&el>es[es.length-1].t+P_MS*512){
        seance.cur=null; seance.lineUntil=now+1600;      // let go
        seance.wait=now+P_MS*(8192+Math.floor(seanceRng()*8192)); // much later
      }
    }

    /* the seep — hesitation admits one ghost; the next key lowers them out.
       2^9 pulses of stillness is the door. */
    const SEEP_MS=P_MS*512;
    let seep=null;
    function ghostDuck(){
      if(ghostG) try{ ghostG.gain.setTargetAtTime(0,actx.currentTime,0.12); }catch(_){}
    }
    function seepStop(){ if(seep){ seep=null; } ghostDuck(); }
    function seepTick(){
      if(compose.playing){ seepStop(); return; }
      const now=Date.now();
      const idle=now-(compose.lastAt||compose.openedAt||now);
      if(!seep&&idle>SEEP_MS){
        const sc=SEANCE_POOL[Math.floor(seanceRng()*SEANCE_POOL.length)];
        seep={ sc:sc, idx:0, at0:now };
        mailAudio();
        if(ghostG) try{ ghostG.gain.setTargetAtTime(1,actx.currentTime,0.6); }catch(_){}
      }
      if(seep){
        const el=now-seep.at0, es=seep.sc.ev;
        while(seep.idx<es.length&&es[seep.idx].t<=el){
          const e=es[seep.idx++];
          grain(e.d,true,e.k==='b'); bloomAdd(e.k,e.d,true);
        }
        if(seep.idx>=es.length) seep=null;               // held, then gone
      }
    }

    /* the visitor's keys — THE DEAF MAPPING. the score keeps WHEN and the
       degree the interval earned; it never learns WHICH key. the first key
       is the fundamental: you begin at the star's own tone. */
    function mailKey(kind){
      const now=Date.now();
      let q=4;
      if(compose.score.length){
        q=Math.max(1,Math.min(8,Math.round((now-compose.lastAt)/QMS)));
        compose.tq+=q*QMS;
      } else { compose.tq=0; }
      compose.lastAt=now;
      const deg= kind==='b'?compose.lastDeg : (kind==='w'||kind==='n')?2 : DEG[q-1];
      if(kind==='g') compose.lastDeg=deg;
      compose.score.push({ t:compose.tq, k:kind, d:deg });
      grain(deg,false,kind==='b');
      bloomAdd(kind,deg,false);
      if(seep) seep=null;
      ghostDuck();
    }

    function composeReset(){ compose.body=''; compose.care=0;
      compose.tripped=false; compose.ref=0; compose.score=[];
      compose.lastAt=0; compose.tq=0; compose.lastDeg=1;
      compose.playing=null; bloomsClear(false); }
    function composeOpen(){
      /* a draft survives leaving the room — ios keeps drafts and so does
         the tide, until the tab closes or cancel is pressed. the pen
         stands where it stood; the blooms have dried. */
      if(!(compose.body||compose.score.length)) composeReset();
      compose.openedAt=Date.now();
      bpen.maxY=288; ghostDuck();
      setApp('compose'); }

    function composeChar(ch){
      if(compose.playing) return;
      const atNew=!compose.body||compose.body.charCodeAt(compose.body.length-1)<=32;
      if(ch!==' '&&atNew&&wordsN(compose.body)>=WCAP){
        compose.ref=tNow; return; }         // the door refuses, registering
      if(compose.body.length>=4000){ compose.ref=tNow; return; }
      compose.body+=ch;
      mailKey(ch===' '?'w':'g');
    }
    function composeBack(){
      if(compose.playing||!compose.body) return;
      compose.body=compose.body.slice(0,-1);
      mailKey('b');
    }
    function composeReturn(){
      if(compose.playing||!compose.body) return;
      compose.body+='\n';
      mailKey('n');
    }

    function mailSend(){
      if(compose.playing) return;
      if(!/\S/.test(compose.body)||!compose.score.length){ compose.ref=tNow; return; }
      if(!compose.tripped){
        const hay=compose.body.toLowerCase();
        for(const w2 of CARE_WORDS){ if(hay.indexOf(w2)>=0){
          compose.tripped=true; compose.care=1; return; } } }
      /* THE ONCE — the letter plays to its writer a single time. pauses
         fold to 2^3 steps: the music keeps the hesitation, knot the wait. */
      const played=[]; let t2=0;
      for(let i2=0;i2<compose.score.length;i2++){
        const e=compose.score[i2];
        if(i2) t2+=Math.min(8*QMS, e.t-compose.score[i2-1].t);
        played.push({ t:t2, k:e.k, d:e.d });
      }
      compose.playing={ ev:played, at0:Date.now(), idx:0,
        secs:Math.max(1,Math.round((t2+400)/1000)),
        dust:(SEED^(played.length*2654435761))>>>0 };
      /* the words die here — the tide, mid-room. the care card has read;
         nothing else ever will. */
      compose.body='';
      seepStop(); bloomsClear(false);
    }
    function mailPlayTick(){
      const pl=compose.playing; if(!pl) return;
      const el=Date.now()-pl.at0;
      while(pl.idx<pl.ev.length&&pl.ev[pl.idx].t<=el){
        const e=pl.ev[pl.idx++];
        grain(e.d,false,e.k==='b'); bloomAdd(e.k,e.d,false);
      }
      if(pl.idx>=pl.ev.length&&el>pl.ev[pl.ev.length-1].t+700){
        MAIL_OUT.unshift({ to:'the departed', s:'sealed', rcpt:true,
          secs:pl.secs, dust:pl.dust });
        composeReset(); setApp('mail');
      }
    }
    /* ---- the ANYBODY thread's wire (THE ANYBODY PASS — full confession
       in the html top comment; the law is §5b, the second carrier). one
       POST to the page's OWN origin. the wall reads the letter once, in
       transit, keeps its END — four words at most, lowercase, knotted,
       nameless — and forgets the rest in the same breath; what it deals
       back is a departed end and an hour to land it, every wait a
       rational multiple of the pulse. the landing rides the mail pump's
       own belt-and-braces, so a throttled tab still lands the echo the
       moment the glass is looked at again — into the thread if the
       thread is open, as a badge if it is knot, and silently either
       way: the house never calls across rooms. if the wall is gone,
       unreachable, refused, or answering nonsense, nothing happens at
       all, ever. nobody answers is the failure mode and the piece. */
    function anybIdx(){ return MSGS.findIndex(m2=>m2.f==='ANYBODY'); }
    function anybKey(ch){
      if(ch==='\b') anyb.t=anyb.t.slice(0,-1);
      else if(ch==='\n'){ if(anyb.t.trim()) anybSend(); }
      else if(anyb.t.length<480) anyb.t+=ch;
    }
    function anybSend(){
      const text=anyb.t.trim(); if(!text) return;
      if(!anyb.tripped){
        const hay=text.toLowerCase();
        for(const w2 of CARE_WORDS){ if(hay.indexOf(w2)>=0){
          anyb.tripped=true; anyb.care=1; return; } } }
      const m2=MSGS[anybIdx()];
      m2.b.push({ me:true, t:text }); m2.tm='today';
      anyb.t=''; anyb.tripped=false; anyb.snap=true;
      try{
        fetch('/api/anybody',{ method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({text}) })
        .then(r2=>r2.json())
        .then(d2=>{ if(!d2||!d2.echo) return;
          const at=+d2.arrivesAt||Date.now();
          ANYB_PEND.push({ echo:String(d2.echo), at });
          setTimeout(()=>{ anybPump(); },Math.max(0,at-Date.now())+80); })
        .catch(()=>{});                 // nobody answers. the piece.
      }catch(_){}
    }
    function anybPump(){
      const now=Date.now(); let landed=false;
      const ai=anybIdx(), m2=MSGS[ai];
      for(let i=ANYB_PEND.length-1;i>=0;i--){
        if(ANYB_PEND[i].at<=now){
          const e=ANYB_PEND.splice(i,1)[0];
          m2.b.push({ me:false, t:e.echo });
          if(app==='thread'&&sel.msg===ai) anyb.snap=true;
          else m2.un=true;
          landed=true; } }
      if(landed) needDraw=true;
    }

      const pDeep=Math.min(0.85,d/240);             // and, deeper, the emptying
      const set=R()<pDeep?EGGCAT_DEEP:EGGCAT_FAR;

      const due=[];

      return [u*u*u*p0[0]+3*u*u*t2*p1[0]+3*u*t2*t2*p2[0]+t2*t2*t2*p3[0],

    /* ---- pulsr — the dating app ----

       as a lighthouse heart, the egg by candlelight. swipe with a drag or
       the two buttons; both swiped right is a match, and of course it is. */
    let pulsrArt=null;
    function bakePulsrArt(){
      if(pulsrArt) return pulsrArt;
      const mk=(i)=>{
        const S=LOW?300:420, W=S, H2=Math.floor(S*1.1);
        const cv=mkcv(W,H2), q=cv.getContext('2d');
        const R=mulberry32((SEED^(0xDA7E+i*77))>>>0), rv=(a,b)=>a+(b-a)*R();
        q.fillStyle='#04060b'; q.fillRect(0,0,W,H2);
        if(i===0){                             // the star
          for(let k=0;k<170;k++){ q.fillStyle='rgba(220,233,251,'+rv(0.05,0.5)+')';
            q.fillRect(R()*W,R()*H2,1,1); }
          for(let k=0;k<11;k++){ const rad=W*0.05+k*W*0.05;
            q.strokeStyle='rgba(159,196,236,'+(k===3?0.8:rv(0.07,0.26))+')';
            q.lineWidth=k===3?2.2:1;
            q.beginPath(); q.arc(W/2,H2*0.46,rad,0,6.283); q.stroke(); }

    /* the scar, drawn over whichever room is open — hairlines of glass
       catching the cave light. the shimmer rides the phone's own sway, so
       tilting the glass makes the crack answer. */
    function drawCrack(t,tilt){
      sq.save(); sq.lineCap='round'; sq.lineJoin='round';
      for(const c of CRACK.polys){
        const gl2=0.5+0.5*Math.sin(t*0.7+c.ph+tilt*5.2);
        const a=c.a*(0.5+0.8*gl2);
        sq.strokeStyle='rgba(8,12,18,'+(a*0.5).toFixed(3)+')'; sq.lineWidth=c.w+0.9;
        sq.beginPath(); sq.moveTo(c.p[0]+0.5,c.p[1]+0.7);
        for(let i=2;i<c.p.length;i+=2) sq.lineTo(c.p[i]+0.5,c.p[i+1]+0.7);
        sq.stroke();
        sq.strokeStyle='rgba(228,238,252,'+a.toFixed(3)+')'; sq.lineWidth=c.w;
        sq.beginPath(); sq.moveTo(c.p[0],c.p[1]);
        for(let i=2;i<c.p.length;i+=2) sq.lineTo(c.p[i],c.p[i+1]);
        sq.stroke();
        if(gl2>0.93&&c.p.length>=8){           // one facet catches the candle
          const k=(Math.max(1,Math.floor(c.p.length/6)))*2;
          sq.strokeStyle='rgba(255,244,220,'+(a*1.5).toFixed(3)+')';
          sq.lineWidth=c.w*0.6;
          sq.beginPath(); sq.moveTo(c.p[k-2],c.p[k-1]);
          sq.lineTo(c.p[k],c.p[k+1]); sq.stroke();
        }
      }
      const g2=sq.createRadialGradient(CRACK.x,CRACK.y,0,CRACK.x,CRACK.y,17);
      g2.addColorStop(0,'rgba(235,242,252,0.10)');
      g2.addColorStop(1,'rgba(235,242,252,0)');
      sq.fillStyle=g2;
      sq.beginPath(); sq.arc(CRACK.x,CRACK.y,17,0,6.283); sq.fill();
      for(const d of CRACK.dust){
        sq.fillStyle='rgba(235,242,252,'+
          (d[3]*(0.5+0.5*Math.sin(t*0.9+d[4]))).toFixed(3)+')';
        sq.fillRect(d[0],d[1],d[2],d[2]);
      }
      sq.restore();
    }

    /* ---- the reality switch ----
       the camera app and the glass side button do the same thing: ask for
       the visitor's own camera and hold it behind the phone, so the glass
       can prove itself against the real room. refused? the icon dims for a
       breath and the cave stays. degrade silently. */
    let arStream=null, arVideo=null, arTex=null, arFace='';
    /* THE SWITCH HAS THREE POSITIONS NOW, at the artist's word, and the
       ordering is his:

         press 1 · MIRROR     · the front camera, flipped, so the glass shows
                                the visitor their own face
         press 2 · INVISIBLE  · the rear camera, so the room behind the phone
                                comes through it and the phone reads as knot
                                being there
         press 3 · BLACK      · the eye closes and the cave comes back

       and then round again. it used to be a two-position toggle — invisible
       or black — and the middle position is the one that was missing, knot an
       extra. the whole argument of this object is that the glass transmits
       whatever is behind it; the rear camera proves that about the ROOM and
       the front camera proves it about the person holding it, and the second
       proof is the one that lands, because it is the only moment in the piece
       where the visitor is looking at themselves through something they were
       told was their own phone. the black is knot a failure state at the end
       of a cycle, it is the third answer: nothing behind it at all.

       MIRROR MEANS THE FRONT CAMERA. if the artist meant `the rear camera,
       flipped` instead, it is the two face strings below and nothing else.

       the count is still the door. arTaps is incremented before any hardware
       is touched, and the arrival lock upstairs reads arTaps % 3 — so a
       visitor who refuses the permission still gets all three presses and
       still gets the phone unlocked. the button is a door either way and the
       camera behind it is a gift, knot a toll. */
    const AR_FACE=['','user','environment'];   // by arMode. see above.
    let arMode=0;
    /* THE COUNT AND THE HARDWARE ARE TWO DIFFERENT THINGS, and they were the
       same function until an earlier pass, which broke the arrival badly.

       the arrival lock upstairs reads arTaps every frame. `wakeCamera` used
       to call toggleAR and put the count back afterwards — but toggleAR
       increments synchronously and getUserMedia resolves whenever it feels
       like it, so for the whole life of the permission dialog the count sat
       wrong. the lock read it, released itself, un-hid the body, dropped the
       dock and let the camera fall back to whatever position the orbit was
       sitting at. that is the `1/3 too big` and the missing home screen: the
       arrival framing had let go of itself before a finger touched anything.

       so the turning-on is its own function and nothing else counts. */
    /* stopping a stream is three things that can each throw independently and
       none of which may take the others down with them. */
    function stopStream(s){ if(!s) return;
      try{ s.getTracks().forEach(tk=>tk.stop()); }catch(_){} }
    /* getUserMedia CAN HANG, and on this switch a hang is fatal: arBusy would
       stay true for ever and the camera button would stop answering
       altogether — on the arrival screen that is the one door out, welded
       shut. so every request is raced against a clock. six seconds is long
       enough for a permission dialog a visitor is actually reading and short
       enough that a wedged request is knot mistaken for a considered refusal.
       a request that loses the race is treated exactly like a refusal, and a
       stream that arrives afterwards is stopped on arrival rather than left
       running unwatched. */
    function askCam(face){
      return new Promise((res,rej)=>{
        let done=false;
        const t=setTimeout(()=>{ if(!done){ done=true; rej(0); } },6000);
        let md=null; try{ md=navigator.mediaDevices; }catch(_){}
        if(!md||!md.getUserMedia){ clearTimeout(t); done=true; rej(0); return; }
        md.getUserMedia({ video:{ facingMode:{ ideal:face } }, audio:false })
          .then(s=>{ clearTimeout(t);
            if(done){ stopStream(s); return; }   // lost the race; do knot leave it running
            done=true; res(s); })
          .catch(e=>{ clearTimeout(t); if(!done){ done=true; rej(e); } });
      });
    }
    async function camUp(face){
      if(arBusy||disposed) return;
      face=face||'environment';
      if(arOn&&arFace===face) return;          // already looking that way
        arBusy=true; needDraw=true;
        /* ---- RELEASE, THEN ACQUIRE. this order is knot a preference ----

           👁️ wrote it the other way first, on the argument that acquiring the
           new eye before letting go of the old one means no blink and a safe
           fallback if the second request fails. THE HEADLESS TEST KILLED
           THAT: asking for the second camera while the first is still held
           does knot fail, it HANGS — the promise never settles, arBusy never
           clears, and the camera button stops answering for the rest of the
           session. on the arrival screen that button is the only door out.

           and the device this piece is built for is the worst case: a phone
           can point one camera at a time. so the old eye is closed first.

           the blink 👁️ was afraid of does knot happen: stopping the tracks
           freezes the <video> on its last frame rather than blanking it, the
           texture goes on sampling that frozen frame, and the swap reads as
           the picture holding still for a moment — which is what a camera
           changing lenses looks like anyway. */
        const swapping=arOn;
        if(swapping) stopStream(arStream);
        try{
          const stream=await askCam(face);
          if(disposed){ stopStream(stream); arBusy=false; return; }
          const vid=document.createElement('video');
          vid.playsInline=true; vid.muted=true;
          vid.setAttribute('playsinline','');
          vid.srcObject=stream;
          await vid.play();
          /* WAIT FOR THE FRAME'S OWN SIZE. play() resolves before the track
             has told anyone how big it is, and videoWidth/videoHeight are 0
             until it does. the room fits the picture from those two numbers,
             so handing it a texture that measures 0×0 is handing it a guess —
             which is where the stretch and the bar came from. one tick of
             patience, and a hard cap so a camera that never reports does knot
             hang the door: the room re-reads the size every frame anyway. */
          if(!vid.videoWidth){
            await new Promise(res=>{ let done=false;
              const go=()=>{ if(done) return; done=true; res(); };
              vid.addEventListener('loadedmetadata',go,{once:true});
              vid.addEventListener('resize',go,{once:true});
              setTimeout(go,900); });
          }
          if(disposed){ stopStream(stream); arBusy=false; return; }
          const tex=new THREE.VideoTexture(vid);
          tex.colorSpace=THREE.SRGBColorSpace;
          /* the FIT is knot set here. which way the frame stands and how much
             of it is cropped both depend on the viewport, which this module
             cannot see and which changes under the visitor's thumb as
             safari's chrome collapses. the module only records the one thing
             the room cannot find out for itself — whether this frame must be
             MIRRORED — and the room does the rest, every frame. see fitCam.

             it is recorded from what we ASKED for and knot only from what the
             track reports: some browsers hand back an empty facingMode, and a
             mirror that silently stops mirroring is the one failure this
             state cannot survive, because the whole state IS the mirror. */
          let got=''; try{ got=(stream.getVideoTracks()[0].getSettings()||{}).facingMode||''; }catch(_){}
          tex.userData.mirror=(face==='user')||(got==='user');
          const oV=arVideo, oT=arTex;
          arStream=stream; arVideo=vid; arTex=tex; arFace=face;
          arOn=true; pad.visible=false; padGlow.visible=false;
          if(arCb) arCb(arTex);
          if(oV){ try{ oV.srcObject=null; }catch(_){} }
          if(oT){ try{ oT.dispose(); }catch(_){} }
        }catch(_){
          arDim=1;
          /* the old eye is already closed by the time we get here, so there
             is nothing to fall back TO. rather than leave a frozen frame on
             the glass pretending to be a live room — which is the one lie
             this object must never tell — the switch goes all the way to
             black and the cave comes back. the count is untouched, so the
             next press simply moves on. */
          if(swapping){ arOn=false; arFace='';
            if(arVideo){ try{ arVideo.srcObject=null; }catch(_){} }
            if(arTex){ try{ arTex.dispose(); }catch(_){} }
            arStream=null; arVideo=null; arTex=null;
            if(arCb) arCb(null); }
        }
        arBusy=false; needDraw=true;
        /* AND THEN CATCH UP. see arApply — presses that landed while this was
           in flight only moved the number; this is where the hardware is made
           to agree with it. */
        if(arMode!==arActed) arApply();
    }
    function camDown(){
      if(!arOn) return;
      arOn=false; arFace='';
      stopStream(arStream);
      if(arVideo){ try{ arVideo.srcObject=null; }catch(_){}}
      if(arTex){ try{ arTex.dispose(); }catch(_){}}
      arStream=null; arVideo=null; arTex=null;
      pad.visible=false; padGlow.visible=false;   // the pad stays gone
      if(arCb) arCb(null); needDraw=true;
    }
    /* the wake and the press must knot cancel each other. the arrival can
       open the eye on its own, so `arOn` may already be true when the visitor
       finally presses the camera button — and a naive toggle would read that
       as `it is on, turn it off`, killing the night at the exact moment it is
       supposed to be revealed. arWoke remembers that the eye was opened by
       the room and knot by a thumb; the first press spends it and only opens
       the DOOR. if the wake was refused, arWoke is spent for nothing and the
       press does what it always did. */
    let arWoke=false;
    /* ---- the number and the hardware, reconciled ----

       THE HEADLESS TEST CAUGHT THIS AND 👁️ WOULD KNOT HAVE. the old two-state
       toggle could say `if(arBusy) return` and get away with it: a press lost
       during a permission dialog resolved itself on the next press, because
       with two positions the hardware was never more than one press behind.
       with THREE it can be two behind, and then the count and the eye
       disagree permanently — three fast presses during the dialog leave the
       count at black, the arrival lock re-bolts the phone, and the visitor's
       room is still being transmitted through a screen that has just told
       them it is off. that is the worst failure available to this file: the
       one thing it must never do is keep looking after it has said it
       stopped.

       so a press only ever moves the NUMBER, and arApply is the single place
       the hardware is asked to match it. arActed records what the hardware
       was last asked for; when a camUp lands it checks whether the number
       moved underneath it and applies again if it did. a camera that is
       refused leaves arActed equal to arMode, so a refusal never retries in a
       loop — it degrades silently, once, the way everything else here does. */
    let arActed=0;
    function arApply(){
      if(arBusy||disposed) return;
      arActed=arMode;
      if(arMode===0) camDown(); else camUp(AR_FACE[arMode]);
    }
    function camWake(){ if(!arOn&&!arBusy&&!disposed){ arWoke=true; arMode=1; arApply(); } }
    function toggleAR(){
      if(disposed) return;
      /* counted FIRST, before arBusy is even consulted. a press that lands
         while the wake's getUserMedia is still in flight used to return
         early and count for nothing — which on the arrival screen means the
         one door out does nothing and the visitor is stranded. the count is
         the door; the hardware is a separate question. */
      arTaps++;
      arMode=arTaps%3;
      if(arWoke){ arWoke=false; if(arOn&&arFace===AR_FACE[arMode]){ arActed=arMode; return; } }
      arApply();
    }

    /* ---- touch, through the glass ---- */
    const touch={ on:false, x:0, y:0, x0:0, y0:0, moved:0, key:null, vel:0, lastT:0 };
    const momentum={ key:null, v:0 };
    function scrollKey(){ return app==='note'?'note'+sel.note:
      app==='letter'?'letter'+(sel.box==='out'?'o'+sel.out:'i'+sel.mail):
      app==='mail'?'mailbox':
      app==='thread'?'thread'+sel.msg:
      app==='instagram'?'eggriver':
      app==='safari'?'wiki':
      app==='settings'?'settings':null; }
    function tapAt(x,y){
      for(let i=hits.length-1;i>=0;i--){ const h=hits[i];
        if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){
          if(!h.mute) uiTick();                 // back is silent — see H
          h.fn(); needDraw=true; return true; } }
      return false;
    }
    function screenDown(x,y){
      touch.on=true; touch.x=touch.x0=x; touch.y=touch.y0=y; touch.moved=0;
      touch.key=scrollKey(); touch.vel=0; touch.lastT=tNow; momentum.key=null;
      home.ax=0; home.sw=false;
      if(app==='pulsr'&&pulsr.view==='cards'&&y>110&&y<612){
        pulsr.drag=true; pulsr.dx=0; }
      if(app==='sky'&&y>96&&y<560) skyS.drag=true;
    }
    function screenMove(x,y){
      if(!touch.on) return;
      const dx=x-touch.x, dy=y-touch.y;
      touch.moved+=Math.abs(dx)+Math.abs(dy);
      if(touch.key){ const k=touch.key;
        scrollPos[k]=clamp((scrollPos[k]||0)-dy,0,scrollMax[k]||0);
        const dt2=Math.max(tNow-touch.lastT,1e-3);
        touch.vel=touch.vel*0.7+(-dy/dt2)*0.3; }
      if(pulsr.drag) pulsr.dx+=dx;
      if(skyS.drag){ skyS.yaw-=dx*0.0052;
        skyS.pitch=clamp(skyS.pitch+dy*0.0052,-1.35,1.35); }
      /* ---- the home screen's page turn ----

         A DRAG ON THE GLASS ALREADY MEANT SOMETHING: while the home grid is
         up it swivels the phone (orbitNudge, in the harness). so the page
         turn cannot simply take every drag, and it does knot — the gesture
         is AXIS-LOCKED on its first seven pixels, the way ios locks a
         scroll against a swipe. mostly sideways is a page. mostly up and
         down is still the phone turning in the hand. the harness asks
         api.swiping() before it nudges, so exactly one of the two ever
         happens and never both.

         WHAT IT COSTS, honestly: yaw can no longer be started from the glass
         itself on the home screen. it can be started anywhere else — the
         whole black cave around the phone is still a turning surface and the
         orbit owns it — so nothing is lost that a thumb cannot reach, and on
         the arrival screen the phone is bolted flat anyway and there was
         never a swivel there to lose. */
      if(app==='home'){
        if(!home.ax){
          const mx=Math.abs(x-touch.x0), my=Math.abs(y-touch.y0);
          if(mx>7||my>7) home.ax=(mx>my)?1:2;
        }
        if(home.ax===1){
          home.sw=true;
          /* the ends push back rather than stop dead. a page that refuses to
             move at all reads as a broken screen; one that gives a little and
             comes back reads as the end of the shelf, which is what it is. */
          const lim=(home.pg===0&&dx>0&&home.dx>=0)||
                    (home.pg===PAGES.length-1&&dx<0&&home.dx<=0);
          home.dx+=dx*(lim?0.34:1);
          needDraw=true;
        }
      }
      touch.x=x; touch.y=y; touch.lastT=tNow; needDraw=true;
    }
    function screenUp(){
      if(!touch.on){ home.ax=0; home.sw=false; return; } touch.on=false;
      if(skyS.drag) skyS.drag=false;
      if(pulsr.drag){
        const d3=pulsr.dx; pulsr.drag=false;
        if(d3>90){ pulsrSwipe(true); return; }
        if(d3<-90){ pulsrSwipe(false); return; }
        pulsr.dx=0; needDraw=true;
      }
      if(touch.moved<9){ home.ax=0; home.sw=false; tapAt(touch.x0,touch.y0); return; }
      if(app==='home'){
        const d=home.dx, ax=home.ax;
        home.sw=false; home.ax=0;
        if(ax===1){
          /* a fifth of the sheet commits the turn. it is knot half, because
             half is what a mouse wants and a thumb on glass has already
             decided by then — and it is knot a tenth, because a page that
             turns under an accidental slide is a page nobody trusts. */
          if(d<-70) homeGo(home.pg+1);
          else if(d>70) homeGo(home.pg-1);
          else { home.dx=0; needDraw=true; }
          return;
        }
      }
      if(app==='photo'){ const dx=touch.x-touch.x0;
        if(dx<-48&&sel.photo<11) sel.photo++;
        else if(dx>48&&sel.photo>0) sel.photo--;
        needDraw=true; return; }
      if(touch.key&&Math.abs(touch.vel)>40){ momentum.key=touch.key; momentum.v=touch.vel; }
    }
    const uvToUi=(uv)=>({ x:uv.x*UIW, y:(1-uv.y)*UIH });

    let pressT=0;
    function isDesc(o,root){ let p=o; while(p){ if(p===root) return true; p=p.parent; } return false; }
    function onPointerDown(hit){
      if(!hit||!hit.object) return;
      if(hit.object===powerBtn){ pressT=1; toggleAR(); return; }
      if(hit.object===screen&&hit.uv){ const p2=uvToUi(hit.uv); screenDown(p2.x,p2.y); }
    }
    function onPointerMove(hit){
      if(!touch.on||!hit) return;
      if(hit.object===screen&&hit.uv){ const p2=uvToUi(hit.uv); screenMove(p2.x,p2.y); }
    }
    function onPointerUp(){ screenUp(); }

    /* ---- power, from the room ---- */
    let roomPower=false;
    function applyGate(){ gate.gain.setTargetAtTime(roomPower?1:0,actx.currentTime,0.08); }
    const onVis=()=>{ if(document.visibilityState==='visible'&&roomPower&&actx.state==='suspended')
      actx.resume().catch(()=>{}); };
    document.addEventListener('visibilitychange',onVis);

    /* ---- update ---- */
    function update(dt,t){
      tNow=t;
      // it hovers; it never quite holds still — unless it is docked, when
      // it holds perfectly still, the way anything watched closely does
      const fy=HOVER+(0.0028*Math.sin(t*0.9)+0.0012*Math.sin(t*1.7+1.3))*(1-dock);
      phoneG.position.y=fy;
      phoneG.rotation.y=(0.045*Math.sin(t*0.21)+0.020*Math.sin(t*0.13+1.0))*(1-dock);
      phoneG.rotation.x=(0.012*Math.sin(t*0.27+0.5))*(1-dock);
      screenLight.position.y=fy+0.008;
      // the ride, leaving
      if(rider.leaving>0&&!rider.gone){
        rider.leaving+=dt/rideHold;
        /* the page-level black is a BELT, knot the effect: the fall is drawn
           on the glass itself and the harness walks the camera in until the
           glass is the whole viewport, so this only has to cover whatever
           slivers of cave are left down the sides. it starts late, on the
           same breath the night side takes the sheet. */
        if(rider.leaving>1-Math.min(0.55,1.75/rideHold)&&!rider.blacked){ rider.blacked=true;
          try{ const dv=document.getElementById('rideBlack');
            if(dv) requestAnimationFrame(()=>{ dv.style.opacity='1'; }); }catch(_){} }
        if(rider.leaving>=1){ rider.gone=true;
          /* ?from=rider is knot decoration: a query makes it a different
             url to the cache, so a stale intro.html can never be served
             back to a visitor who has already been here once. */
          /* the chosen tier rides across on the url — intro.html has to show
             the same fare the thumb agreed to, and a query is also a
             different url to the cache, which is the other half of why it
             is there. */
          try{ location.href='intro.html?from=rider&tier='+rider.tier; }catch(_){} }
      }
      // (the hum room's breathing left with the room — aug 12)
      // the speaker's own level, read back off the gate
      let lvl=0;
      if(analy&&roomPower&&actx.state==='running'){
        analy.getByteTimeDomainData(analyBuf);
        let s3=0; for(let i=0;i<analyBuf.length;i++){ const v=(analyBuf[i]-128)/128; s3+=v*v; }
        lvl=Math.sqrt(s3/analyBuf.length);
      }
      const lvlN=clamp(lvl*3.4,0,1);
      spk+=(lvlN-spk)*(1-Math.exp(-dt*(lvlN>spk?18:6)));
      screenLight.intensity+=((roomPower?0.0032:0)+0.011*spk-screenLight.intensity)*(1-Math.exp(-dt*8));
      padGlowM.opacity=arOn?0:0.075+0.045*Math.sin(t*0.9)+0.10*spk;
      // the pressed button, felt
      if(pressT>0) pressT=Math.max(0,pressT-dt*5);
      powerBtn.scale.setScalar(1-0.14*Math.sin(Math.min(pressT*Math.PI,Math.PI)));
      // scroll momentum, settling long like the dial
      if(momentum.key){ const k=momentum.key;
        scrollPos[k]=clamp((scrollPos[k]||0)+momentum.v*dt,0,scrollMax[k]||0);
        momentum.v*=Math.exp(-dt*3.2);
        if(Math.abs(momentum.v)<8||scrollPos[k]<=0||scrollPos[k]>=(scrollMax[k]||0)) momentum.key=null;
        needDraw=true; }
      if(arDim>0){ arDim=Math.max(0,arDim-dt*1.4); needDraw=true; }
      callTick();
      // the sheet redraws itself ~30 times a second — it is the living part
      drawAcc+=dt;
      /* the sheet redraws twice as often while the ride is leaving — a
         zoom at 30 reads as a slideshow, and this is the only moving
         picture the glass ever shows. */
      const iv=(rider.leaving>0)?1/60:(LOW?1/15:1/30);
      if(drawAcc>=iv){ drawAcc=0; draw(t); }
    }

    return {
      group:g,
      update,
      onPointerDown, onPointerMove, onPointerUp,
      api:{
        setPower(on){ roomPower=!!on; applyGate(); },
        setDock(d){ dock=clamp(d||0,0,1); },
        setArrive,
        leaving(){ return rider.leaving; },
        getApp(){ return app; },
        open(a){ setApp(a); },
        tap(x,y){ return tapAt(x,y); },
        isAR(){ return arOn; },
        arTaps(){ return arTaps; },
        arMode(){ return arMode; },
        arDbg(){ return { arMode, arActed, arFace, arOn, arBusy, arTaps, arWoke }; },
        /* the page, for the harness's test hud and for nothing else — the
           screen owns the swipe and nothing outside it may move the shelves. */
        homePage(){ return home.pg; },
        /* the harness asks this before it swivels the phone: a home-screen
           page turn and a swivel are the same drag until the axis is
           decided, and only one of them may win. see screenMove. */
        swiping(){ return app==='home'&&home.sw; },
        /* wake the eye without counting a press. it calls camUp directly —
           the count is never touched, never restored, never raced. */
        wakeCamera(){ camWake(); },
        onAR(cb){ arCb=cb; },
        toggleAR,
        getSpk(){ return spk; },
        callState(){ return call.state; },
        musicState(){ return { cur:music.cur, playing:music.playing }; },
        vmHeard(){ return VM.heard; },
      },
      dispose(){
        disposed=true;
        document.removeEventListener('visibilitychange',onVis);
        if(arOn){ try{ arStream&&arStream.getTracks().forEach(tk=>tk.stop()); }catch(_){}
          if(arCb) arCb(null); }
        if(arTex){ try{ arTex.dispose(); }catch(_){}}
        musicStop(); vmStop();
        if(callSrc){ try{ callSrc.stop(); }catch(_){}}
        for(const s3 of stopables){ try{ s3.stop(); }catch(_){}}
        for(const n of nodes){ try{ n.disconnect(); }catch(_){}}
        screenTex.dispose(); glowT.dispose(); envT.dispose();
        g.traverse(o=>{ if(o.isMesh||o.isSprite){
          if(o.geometry) o.geometry.dispose();
          const mats=Array.isArray(o.material)?o.material:[o.material];
          for(const m of mats){ if(!m) continue;
            for(const p2 of ['map','bumpMap','emissiveMap','alphaMap','envMap'])
              if(m[p2]&&m[p2].dispose) m[p2].dispose();
            m.dispose(); } }});
        if(g.parent) g.parent.remove(g);
      }
    };
  }
};
/*@APWNP-MODULE-END*/
</script>

<script type="module">
/* harness — the same cave the radio stood in. true #000, dark floor disc,
   cool key, warm candle. a tap anywhere first wakes the AudioContext (ios),
   then the room hands the phone its power. ?test hud · ?gl webgl2 · ?q=low ·
   ?icons=ink the old hairline home grid ·

import * as THREE from 'three';
import * as TSL from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q=new URLSearchParams(location.search);
const TEST=q.has('test'), GL=q.has('gl'), LOWQ=q.get('q')==='low';

   CFG rather than being read inside the module: the phone knows its own

   is still theirs. it is knot. the first drag (or the first app they open

/* THE ONE MEASURE. every width and height below this line comes from the

   expanded, collapsing, or mid-rubber-band. */

  const a=VW()/VH(), t2=Math.tan(camera.fov*Math.PI/360);
  const rH=(0.1476*0.80)/t2, rW=(0.0716*1.05)/(t2*a);

    0.115+Math.sin(el)*r, Math.cos(az)*Math.cos(el)*r);

}
frameCamera();

const key=new THREE.DirectionalLight(0x9db8e8,1.45);
key.position.set(0.6,1.1,0.9); scene.add(key);
const candle=new THREE.PointLight(0xffc37a,0.85,0,2);
candle.position.set(-0.45,0.30,0.35); scene.add(candle);
const fill=new THREE.HemisphereLight(0x35465e,0x0c0a08,0.45); scene.add(fill);

/* the floor is gone too — no disc, no ground, no horizon. the phone hangs
   in pure #000 and the only lit thing anywhere is the glass. the mesh is
   built and never added, so the reality switch's fades below still have
   something to write to. */
const fcv=document.createElement('canvas'); fcv.width=fcv.height=256;
{ const qq=fcv.getContext('2d');
  qq.fillStyle='#0c0c0d'; qq.fillRect(0,0,256,256);
  const rg=qq.createRadialGradient(128,128,6,128,128,66);
  rg.addColorStop(0,'rgba(0,0,0,0.9)'); rg.addColorStop(1,'rgba(0,0,0,0)');

floor.rotation.x=-Math.PI/2; floor.position.y=-0.001; floor.visible=false;

const actx=new AC({ latencyHint:'interactive' });
const bus=actx.createGain(); bus.gain.value=0.9; bus.connect(actx.destination);

const ctx={ THREE, TSL, renderer, parent:scene,
  audio:{ ctx:actx, bus },
  CFG:{ pulsarHz:173.68, seed:20260807, quality:LOWQ?'low':'high', icons:ICONSET } };
const mod=await window.APWNP.modules.phone.build(ctx);

/* the reality switch, honored by the room — but grown, knot swapped:
   the visitor's camera rides a billboard behind the phone, let in through
   a hole that grows outward from the phone the way intro.html opens its
   night. at full-open the scene background takes over, so the glass
   transmits the actual room (the prototype's proof, kept). closing is a
   cut — back underground between two frames. */
const caveBG=new THREE.Color(0x000000);
const holeCv=document.createElement('canvas'); holeCv.width=holeCv.height=512;
const holeCtx=holeCv.getContext('2d');
const holeTex=new THREE.CanvasTexture(holeCv);
let vrPlane=null, vrOn=false, holeP=0, vrTex=null;
const vrDir=new THREE.Vector3();
function drawHole(p){
  holeCtx.fillStyle='#000'; holeCtx.fillRect(0,0,512,512);
  /* the hole grows to a radius that OUTRUNS the plane's own corners at full
     open. the plane is sampled over its whole square, and its corners sit at
     radius √2·256 ≈ 362 from the centre of this map; a hole that stopped at
     385 left those corners inside the fade band at about half alpha, and the
     letterboxed background behind showed through them as a bar. so the hole
     is driven past the corner — to ~470 at p=1 — and the fade band is kept
     thin, so by full-open every corner is solid white and the plane is
     opaque edge to edge. while it is still growing the soft edge stays. */
  const r=p*p*470+2;
  const g=holeCtx.createRadialGradient(256,256,Math.max(0,r-40),256,256,r);
  g.addColorStop(0,'#fff'); g.addColorStop(1,'#000');
  holeCtx.fillStyle=g;
  holeCtx.beginPath(); holeCtx.arc(256,256,r,0,6.283); holeCtx.fill();
  holeTex.needsUpdate=true;
}

    vrTex=tex; vrOn=true; holeP=Math.max(holeP,0.02);
    if(!vrPlane){
      vrPlane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
        new THREE.MeshBasicMaterial({ map:tex, alphaMap:holeTex,
          transparent:true, depthWrite:false, toneMapped:false,
          color:0xd2d9df }));
      vrPlane.renderOrder=-8; scene.add(vrPlane);
    }else{ vrPlane.material.map=tex; vrPlane.material.needsUpdate=true; }
  }else{
    vrOn=false; holeP=0; vrTex=null;
    if(vrPlane) vrPlane.visible=false;
    scene.background=caveBG;
    floor.material.opacity=1;   // the floor is never shown; this is bookkeeping
  }
});

/* ---- the camera's picture, stood up and cropped ----

   THE PICTURE CAME IN ON ITS SIDE. ios hands getUserMedia's frames over in
   the SENSOR's orientation, knot the screen's — a <video> element shown in
   the page gets turned right way up by safari on its way to the compositor,
   but a texture sampled off that same element does knot, and this piece
   only ever samples. so a phone held upright was showing the room lying
   down, and the four fifths of black at the top was the other half of the
   same fact: the plane was being handed a landscape frame stretched over a
   portrait quad, and whatever the frame could knot reach stayed black.

   the rule is knot `ios, so rotate`. it is: ROTATE WHEN THE FRAME AND THE
   VIEWPORT DISAGREE ABOUT WHICH WAY IS UP. a landscape frame in a portrait
   window stands up; a landscape frame in a landscape window is already
   right; a browser that hands the frame over already turned needs nothing
   done to it and this test says so on its own, with no user-agent sniffing
   anywhere. the plane is rotated rather than the texture, because three's
   texture rotation composes with repeat in the ROTATED frame and the crop
   arithmetic below would have to be written twice, once per orientation.

   then COVER, never stretch: the visible slice of the frame is cropped to
   the quad's own aspect and centred, so nothing is squeezed and no edge
   goes uncovered. it is recomputed every frame on purpose — the frame's
   size can change after a track settles, and the viewport changes under
   the visitor's thumb every time safari's address bar collapses. */
let camStood=false;      // did the last fit stand the frame up? the scale asks
function fitCam(){
  camStood=false;
  const t=vrTex; if(!t||!vrPlane) return;
  const v=t.image, vw=(v&&v.videoWidth)||0, vh=(v&&v.videoHeight)||0;
  if(!vw||!vh) return;                       // nothing known yet; leave it alone
  const pa=Math.max(camera.aspect,0.0001);   // the window: <1 upright
  const va=vw/vh;                            // the frame, as delivered
  let rot=0;

    /* clockwise is the correction ios wants; ?cam=flip is the other way */
    rot=(CAMFIX==='flip')?Math.PI/2:-Math.PI/2;

  if(rot){ vrPlane.rotateZ(rot); camStood=true; }
  /* the quad's aspect in the FRAME's own axes — swapped when it is stood up */
  const la=rot?(1/pa):pa;
  let rx=1, ry=1;
  if(va>la) rx=la/va; else ry=va/la;         // cover: crop the long way
  const m=t.userData&&t.userData.mirror?-1:1;
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  t.repeat.set(rx*m,ry);
  t.offset.set(m<0?(1+rx)/2:(1-rx)/2,(1-ry)/2);

controls.minPolarAngle=0.02; controls.maxPolarAngle=Math.PI-0.02; // all angles, over and under
controls.enablePan=false;
controls.addEventListener('start',()=>{ userOrbited=true; });

   the home bar lets it go and the float returns. ---- */

/* ---- the night behind the arrival · WITHDRAWN ----
   👁️ put a camera request on the arrival's own load last pass so the
   visitor's room would already be behind the locked home screen. the artist
   has ruled against it and he is right: it raises a permission sheet the
   instant a page loads, with nothing on screen to explain it, on a phone the
   visitor has knot touched yet — and the camera button is three seconds away
   and is literally a lens. an ask needs a reason visible at the moment it is
   made, and this one never had one.

   so nothing asks at boot. and the LENS — kept through the arrival for one
   pass, on the argument that a lens seen through the glass says `you are
   inside this` — has been ruled OUT again (the artist, aug 8): the locked
   home screen carries no lens, no plateau, nothing solid at all. the lens
   belongs to the camera now; it appears only when the camera button is
   pressed and the body returns with the visitor's own room behind it. the
   hide itself lives in setArrive, in the module.

   `wakeCamera` stays on the api, unused. it is three lines, it is correct,
   and the day the arrival wants its night back it is already there — with the
   count/hardware split that made it safe. */

const dockTg=new THREE.Vector3(0,0.118,0), dockPos=new THREE.Vector3(),
      lerpTg=new THREE.Vector3();

  const a=VW()/VH(), t2=Math.tan(camera.fov*Math.PI/360);
  return Math.max((0.1412*0.56)/t2,(0.0652*0.60)/(t2*a),0.165);
}
/* the arrival framing. the body is hidden while the lock is on (setArrive
   in the module), and so are the sheet's own edge, the status bar and the
   home bar — so there is nothing left near the borders worth keeping and
   the sheet can be COVERED rather than contained, with a 2% bleed so its
   rounded corners land outside the viewport. the crop is capped at 10% of
   the height, though: past that it starts eating the rooms, whose back
   chevrons sit at y 56–98 and whose buttons run to about 730. under the cap
   a phone-shaped window loses 8px at each end and safari's bars push that
   to 39, and both clear everything. what the cap costs is a few pixels of
   black down each side on a wider window — invisible, since the canvas
   ground is transparent and the background behind it is the same #000. */
function arriveDist(){
  const a=VW()/VH(), t2=Math.tan(camera.fov*Math.PI/360);
  const dV=0.1412/(2*t2), dH=0.0652/(2*t2*a);
  return Math.max(Math.min(dV,dH)*0.98, dV*0.90);

let curDist=ARRIVE?arriveDist():dockDist();

   the camera button used to hand the phone back to the free orbit, and the
   free orbit is framed for a small object floating in a cave: the screen the
   visitor was holding a second ago shrank to a third of itself and tilted
   away. that is knot what the button is for. the button is for THE BLACK
   GOING AWAY. the phone is knot supposed to leave.

   so the release keeps the framing and changes only the ground — the same
   home screen at very nearly the same size, the glass now transmitting the
   room behind it, and the whole thing turnable in the hand. the orbit is
   enabled but its distance is PINNED: rotation only, no zoom, no pan, so a
   stray pinch cannot lose the layout the arrival just spent its whole life
   establishing.

   it used to pull back from the arrival distance by about a third, so the
   object would show an edge and leave some black for a thumb. RULED OUT
   (the artist, aug 8): the screen shrank to about two thirds of itself at
   the exact moment it was proving it had knot moved. the camera view now
   keeps the SAME size and layout as the locked home screen — the release
   is only the black going away, pixel for pixel — and the thumb's problem
   is already answered elsewhere: a drag that begins on the glass itself
   still turns the phone (orbitNudge listens on the screen while the home
   grid is up). the edges arrive the moment the visitor turns it. */
let vrHome=false, orbMin=controls.minDistance, orbMax=controls.maxDistance;
function vrHomeDist(){
  /* the arrival framing, exactly — one function, so the two states can
     never drift apart by a pixel. */
  return arriveDist();
}
function vrHomeOn(){
  vrHome=true;
  const d=vrHomeDist();
  controls.target.set(0,0.115,0);
  /* front on, knot frameCamera's three-quarter pose: the release must read
     as the background changing, knot as the camera moving. */
  savedPos=new THREE.Vector3(0,0.118,d);
  savedTg=controls.target.clone();
  controls.minDistance=d; controls.maxDistance=d;
}
function vrHomeOff(){
  if(!vrHome) return; vrHome=false;
  controls.minDistance=orbMin; controls.maxDistance=orbMax;
}

let woken=false;
function wake(){ if(woken) return; woken=true;
  actx.resume().then(()=>mod.api.setPower(true)).catch(()=>{ woken=false; }); }

const ray=new THREE.Raycaster();
let dragging=false, downOnPower=false, lastPX=0, lastPY=0;
function hitAt(e){
  const ndc={ x:e.clientX/VW()*2-1, y:-(e.clientY/VH())*2+1 };
  ray.setFromCamera(ndc,camera);
  const ints=ray.intersectObject(mod.group,true);
  let sc=null, btn=null;
  for(const it of ints){
    if(!sc&&it.object.name==='screen') sc=it;
    if(!btn&&it.object.name==='power') btn=it; }
  const pick=btn&&(!sc||btn.distance<sc.distance)?btn:(sc||(ints.length?ints[0]:null));
  return pick?{ object:pick.object, point:pick.point, uv:pick.uv||null,
                ray:ray.ray.clone(), ndc }
             :{ object:null, point:null, uv:null, ray:ray.ray.clone(), ndc };
}
/* a drag anywhere that is knot a button swivels the phone at all angles —
   even a drag that begins on the glass itself, so long as the home screen
   is up (the icons still hear their taps; a tap is knot a drag). */
function orbitNudge(dx,dy){
  const off=camera.position.clone().sub(controls.target);
  const sph=new THREE.Spherical().setFromVector3(off);
  sph.theta-=dx*0.0052;
  sph.phi=Math.max(0.03,Math.min(Math.PI-0.03,sph.phi-dy*0.0052));
  off.setFromSpherical(sph);

  camera.lookAt(controls.target);
  userOrbited=true;

  wake();

});

  if(!dragging) return;

  lastPX=e.clientX; lastPY=e.clientY;

     is axis-locked, so this is knot a race — it is one of two answers, and
     the module has already decided which. */
  if(!downOnPower&&dockT<0.05&&mod.api.getApp()==='home'&&!mod.api.swiping())
    orbitNudge(dx,dy);
});
const up=()=>{ if(dragging){ dragging=false;
  controls.enabled=dockT<0.05; mod.onPointerUp(); } };
window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);

const hud=document.getElementById('hud');
let analyser=null, tdata=null;
if(TEST){ hud.style.display='block';
  analyser=actx.createAnalyser(); analyser.fftSize=1024;
  bus.connect(analyser); tdata=new Float32Array(analyser.fftSize);
  window.__phone={ mod, scene, camera, renderer, actx, THREE, ray }; }
/* one handle for the headless harness, always present and inert: it only
   opens a room, which a tap already does. it costs nothing and it is the
   difference between testing this file and looking at it. */
try{ window.__phoneOpen=(a)=>mod.api.open(a); }catch(_){}

/* the viewport moves more than `resize` admits on ios: the chrome collapses
   on a rubber-band, the keyboard comes and goes, the orientation turns.
   visualViewport reports all of it and `resize` reports some of it, so both
   are listened to and the work is idempotent. */
let fitW=0, fitH=0;
function fitView(){
  const w=VW(), h=VH();
  /* IDEMPOTENT. ios fires these events in bursts — a rubber-band scroll can
     raise dozens a second — and every setSize reallocates the renderer's
     swapchain. doing that at scroll rate is how a canvas goes black and stays
     black. the guard is knot an optimisation, it is the point. */
  if(w===fitW && h===fitH) return;
  fitW=w; fitH=h;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  if(vrHome){
    /* the pinned distance is a function of the frame, so it is re-solved and
       the camera walked along its own sight line — the visitor's rotation is
       kept, only the reach changes. frameCamera would throw both away. */
    const d=vrHomeDist();
    controls.minDistance=d; controls.maxDistance=d;
    camera.position.sub(controls.target).setLength(d).add(controls.target);
    return;
  }
  if(!userOrbited&&dockT===0) frameCamera();
}
window.addEventListener('resize', fitView);
window.addEventListener('orientationchange', ()=>setTimeout(fitView,120));
try{ if(window.visualViewport) visualViewport.addEventListener('resize', fitView); }catch(_){}
/* knot visualViewport's `scroll`: it reports the chrome sliding, which is a
   different question from how big the page is, and it fires far too often. */
requestAnimationFrame(fitView);

let last=performance.now(), fpsE=60, hudT=0;
renderer.setAnimationLoop(()=>{
  const now=performance.now(); const rawDt=(now-last)/1000; last=now;
  const dt=Math.min(rawDt,0.05); fpsE+=(1/Math.max(rawDt,1e-4)-fpsE)*0.05;
  mod.update(dt,now/1000);
  /* conform ↔ float. the arrival lock is knot broken by a drag and knot by
     opening a room — it is held or released by ONE control, the camera
     button, and nothing else. locked: the phone is bolted flat, the screen
     covers the viewport, and no amount of dragging or pinching moves it,
     because dockT is pinned at 1 and the orbit controls are off at that
     value already. pressed: the reality switch opens, the lock lifts, the
     body returns (the lens with it) and the black goes away behind the same
     home screen at the same size, the phone turnable in the hand.
     pressed again: the switch closes, the visitor is put back on the home
     grid and the phone bolts flat again exactly as it landed. the camera
     app is therefore the only way in and the only way back, which is the
     one thing the visitor has to discover for themselves. */
  if(ARRIVE){
    /* THREE POSITIONS, knot two. the camera button cycles mirror →
       invisible → black (see toggleAR), so the lock holds on every third
       press and is released on the other two: press one gives the visitor
       their own face and the phone in their hand, press two gives them the
       room behind it, press three puts them back on the bolted home grid
       exactly as they landed. it still reads the COUNT and knot the
       hardware, so refusing the permission walks the same three positions. */
    const want=(mod.api.arTaps()%3)===0?1:0;
    if(want!==arriveHold){
      arriveHold=want;
      if(want){ if(mod.api.getApp()!=='home') mod.api.open('home'); vrHomeOff(); }
      else vrHomeOn();
    }
  }
  /* the ride, leaving. the fall is drawn on the glass, but the glass is
     still a small lit rectangle floating in a black cave — so the harness
     walks the camera in with it until the sheet covers the viewport and
     there is no cave left to see. the body, the buttons, the sheet's own
     edge, the status bar and the home bar go the moment the fall starts,
     for the same reason they go on arrival: a rounded rectangle outlined
     against black is a picture of a phone, and nothing may look like a
     picture of a phone while it is becoming a sky. */
  const lv=mod.api.leaving();
  const wantDock=mod.api.getApp()!=='home'||arriveHold>0||lv>0;
  mod.api.setArrive(arriveHold>0||lv>0.08);
  dockT+=((wantDock?1:0)-dockT)*(1-Math.exp(-dt*4.2));
  if(wantDock&&dockT>0.999) dockT=1;
  if(!wantDock&&dockT<0.002) dockT=0;
  if(dockT>0){
    if(!savedPos){ savedPos=camera.position.clone();
      savedTg=controls.target.clone(); }
    controls.enabled=false;
    const e2=dockT<0.5?2*dockT*dockT:1-Math.pow(-2*dockT+2,2)/2;
    /* the two dock distances are eased between, never cut: letting the
       arrival go is the phone stepping back from the visitor's face. */
    /* the departure distance runs a tenth PAST the arrival framing, so the
       sheet overscans and its rounded corners are never on screen when the
       night side takes it. the walk is driven by the ride's own progress,
       knot by a second clock — one curve, so it can never drift out of
       step with what the glass is drawing. */
    const lk=lv<=0?0:(lv<0.5?2*lv*lv:1-Math.pow(-2*lv+2,2)/2);
    const baseDist=arriveHold>0?arriveDist():dockDist();
    const wantDist=lv>0?(baseDist+(arriveDist()*0.90-baseDist)*lk):baseDist;
    curDist+=(wantDist-curDist)*(1-Math.exp(-dt*4.2));
    dockPos.set(0,0.118,curDist);
    camera.position.lerpVectors(savedPos,dockPos,e2);
    lerpTg.lerpVectors(savedTg,dockTg,e2);
    camera.lookAt(lerpTg);
  }else if(savedPos){ controls.enabled=!dragging; savedPos=null; savedTg=null; }
  mod.api.setDock(dockT);
  if(controls.enabled) controls.update();
  /* the vr, growing */
  holeP+=((vrOn?1:0)-holeP)*(1-Math.exp(-dt*1.05));
  if(vrOn&&vrTex){
    /* THE BLACK BAR WAS THE BACKGROUND SWAP, knot the billboard.

       👁️ measured both before changing anything, at the arrival pose: the old
       billboard's corners project to ±1.40 in ndc and the new one's to ±1.06.
       BOTH cover. the billboard was never the problem and the first diagnosis
       was wrong — writing it down here because a wrong confession left in a
       file is worse than none.

       the problem is the other branch. once holeP passed 0.996 the plane was
       HIDDEN and the video handed to scene.background, and from that moment
       the framing belongs to the renderer: a background texture is fitted by
       its own rules, and a landscape camera feed in a portrait frame is
       exactly where those rules and this piece disagree. that is the four
       fifths and the bar.

       so the plane is never hidden now, AND the background is never the
       video. the old code still swapped scene.background to vrTex at full
       open — and a background texture is fitted by the renderer's own rules,
       which letterbox a landscape feed in a portrait frame into a black bar
       top and bottom. even with the plane in front, the plane's soft-edged
       corners let that bar show THROUGH. the fix is both: the alphaMap now
       opens past the plane's corners so the plane is opaque edge to edge
       (see drawHole), and the background stays the solid cave colour for
       good. transmitting the real room through the glass was the prototype's
       proof; it is proved by the billboard, which the glass samples, and the
       background no longer needs to carry it. what is on screen is always
       the one surface whose framing can be proved.

       and while 👁️ was here the plane was re-hung off the CAMERA rather than
       off controls.target, and sized to the frustum at a fixed distance. knot
       because the old way failed, but because it depended on where the orbit
       target happened to be, which has nothing to do with where the camera is
       aimed — it covered by luck. now the numbers that size it are the same
       numbers that project it, and it covers by construction. */
    if(vrPlane){
      scene.background=caveBG;
      vrPlane.visible=true;
      drawHole(holeP);
      camera.getWorldDirection(vrDir);
      const D=1.9;
      vrPlane.position.copy(camera.position).addScaledVector(vrDir,D);
      vrPlane.quaternion.copy(camera.quaternion);
      fitCam();
      /* 12% over the frustum, up from 6%. with the background no longer
         standing behind the plane there is nothing to catch a corner if the
         visitor turns the phone, so the plane itself has to reach past the
         frame in every rotation — the extra margin is cheap and it is the
         whole guarantee now. */
      /* the quad still has to cover the SCREEN, and rotateZ above swapped
         its local axes — so when it is stood up the scale swaps with it. */
      const h3=2*D*Math.tan(camera.fov*Math.PI/360)*1.12;
      const w3=h3*Math.max(camera.aspect,0.001);
      const up=camStood;
      vrPlane.scale.set(up?h3:w3,up?w3:h3,1);
    }
    const fo=Math.max(0,1-holeP*1.6);
    floor.material.opacity=fo;   // the floor is never shown; this is bookkeeping
  }
  renderer.render(scene,camera);
  if(TEST){ hudT+=dt; if(hudT>0.25){ hudT=0;
    let rms=0; if(analyser){ analyser.getFloatTimeDomainData(tdata);
      let s=0; for(let i=0;i<tdata.length;i++) s+=tdata[i]*tdata[i];
      rms=Math.sqrt(s/tdata.length); }
    const tris=(renderer.info&&renderer.info.render)?renderer.info.render.triangles:0;
    hud.textContent='▮ '+Math.round(fpsE)+'\n◱ '+mod.api.getApp()+
      '\n▣ '+['cave','mirror','room'][mod.api.arMode()]+'\n△ '+tris+
      '\n∿ '+rms.toFixed(3)+'\n∴ '+actx.state.length;
  } }
});
</script>
