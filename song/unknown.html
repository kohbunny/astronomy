     query): an address that differs from this one only by its # is knot a

  function cardWords(h){ var m=/^#?(\d{1,6})(?:\.([A-Za-z0-9_-]+))?$/.exec(h||''); if(!m||!m[2]) return 'no one had died in your hands yet.';

  var actx=null, bus=null;

    var AC=window.AudioContext||window.webkitAudioContext;

    var a=audio(); if(!a) return;
    var t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=P*8;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.05,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.055);

    g.gain.setValueAtTime(0.10,t+dur-0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var oscs=[];
    [P*5/2, P*11/4].forEach(function(f){

    });

    live.push({ g:g, oscs:oscs });

    var a=actx; if(!a) return;

    live.forEach(function(n){
      try{

        n.g.gain.setValueAtTime(Math.max(n.g.gain.value,0.0001),t);
        n.g.gain.exponentialRampToValueAtTime(0.0001,t+0.035);
      }catch(_){}
      n.oscs.forEach(function(o){ try{ o.stop(t+0.05); }catch(_){} });

  var dotEl=document.getElementById('dot');

  /* RETIRED, ON PURPOSE, RECOVERABLE. with the mark off this is a no-op on

  /* the website leaves when the website is refused. the height is measured
     and pinned before the class lands — a collapse off a guessed max-height
     stalls for half its duration and then falls, and a stall followed by a
     fall is more visible than the collapse it was meant to hide. */

    cardEl.style.maxHeight=cardEl.scrollHeight+'px';
    void cardEl.offsetHeight;                 /* force the layout before the class */

  }

  /* showAlert raises the dialog and NOTHING else. every caller drops the
     mark first, on its own clock, so that the two are never simultaneous
     on any path — that simultaneity was the whole bug. */
  function showAlert(){
    scrim.style.display='flex';
    requestAnimationFrame(function(){ scrim.classList.add('on'); });
  }
  function hideAlert(cb){
    scrim.classList.remove('on');
    setTimeout(function(){ scrim.style.display='none'; if(cb) cb(); },230);
  }
  /* two events, knot one, and under ?dot the order between them is the
     point: the mark is finished at 1.08 and the dialog starts at 1.15. with
     the mark off, the first line does nothing and the sheet has been one
     word since the first paint. */
  if(!HOLD){
    setTimeout(dropDot,   940*SLOW);
    setTimeout(showAlert,1150*SLOW);
  }

  /* ---- no ----
     no still keeps them on the page. it also takes the website with it: the
     alert said it could knot connect to one, they declined the call, and the
     row is gone by the time the dialog has finished leaving. the collapse
     starts on the press so that it runs under the dismissal rather than
     after it. */
  document.getElementById('btnNo').addEventListener('click',function(){
    tick(); dropCard(); hideAlert();
  });

  /* ---- the door the website used to be ----
     the homepage row was the way back to the alert — a door that opened onto
     the same closed door — and No now removes it. something has to carry
     that, or a visitor who says No is standing on a dead sheet with the
     whole house behind a door they just deleted, and this file's own law
     says never strand anyone.
     it moves to the handset, which is where it should probably have been all
     along: the four discs are a forgery of buttons that DIAL on the real
     sheet, so the dead ones were the bend and a live one is the correction.
     the alert asked about a call; the visitor said no; the telephone is still
     sitting there. it is live from the start, knot only after No, because a
     button that becomes tappable partway through a page is its own tell. */
  function summon(){
    if(scrim.style.display==='flex' || dialed) return;
    /* under ?dot: the mark goes here too, and 260ms of air is more than the
       140 it needs. a thumb on the handset in the first second would
       otherwise raise the alert BEFORE the scheduled drop at 940 and put
       the glyph up behind it — the exact photograph terence sent, reachable
       by a fast visitor. with the mark off this line costs nothing. */
    dropDot(); tick(); setTimeout(showAlert,260);
  }
  document.getElementById('homepage').addEventListener('click',function(){
    if(cardEl.classList.contains('gone')) return;   /* a collapsed row is knot a door */
    summon();
  });
  /* getElementById and knot the callBtn var: that one is declared below, and
     `var` would hand this line an undefined. summon itself reads `dialed`,
     which is also below — that one is safe, because summon only ever runs on
     a thumb, long after this function body has finished. */
  document.getElementById('callBtn').addEventListener('click',summon);

  /* ---- yes ---- */
  var call=document.getElementById('call'),
      status=document.getElementById('status'),
      callBtn=document.getElementById('callBtn'),
      black=document.getElementById('black');
  var timers=[], dialed=false;
  function later(fn,ms){ timers.push(setTimeout(fn,ms*SLOW)); }

  document.getElementById('btnYes').addEventListener('click',function(){
    if(dialed) return; dialed=true;
    audio(); tick();
    /* warm the next room while the line is ringing — the html only; the
       three.js cdn is phone.html's own business. fails silently. */
    try{ fetch(NEXT,{cache:'force-cache'}).catch(function(){}); }catch(_){}
    try{ fetch('mortal.js',{cache:'force-cache'}).catch(function(){}); }catch(_){}   /* the next room's first script */
    hideAlert(function(){
      /* the button lights, and then it is HELD. it used to light at 350 and
         be gone at 550 — two tenths, which is long enough to register as a
         flicker and knot long enough to register as a decision being carried
         out. a real phone lights the button and sits there while it finds
         the line. a second and a fifth of it now: the visitor gets to watch
         their own press take effect before the room changes. */
      later(function(){ callBtn.classList.add('live'); }, 350);
      later(dial, 1550);
    });
  });

  function dial(){
    /* redundant — the alert already took it, and there is no route to the
       call that does knot pass through the alert. it is stated here anyway
       because the law is about the call as much as the alert, and because
       the sheet is genuinely on screen twice while the call is up: for the
       .55 the call slides in over it, and again for the .5 the call scales
       away at the end, before the black has finished arriving. */
    dropDot();
    call.style.display='flex';
    requestAnimationFrame(function(){ call.classList.add('up'); });
    /* the line does knot give up. 0.80 of connecting silence, then the
       telephone cadence — 2.0 ringing, 3.0 of nobody — repeating for as
       long as the visitor is willing to hold it. there is no timeout and
       nothing at the far end. the only way out is the red button, which
       means leaving is the visitor's decision and knot the line's: they
       have to be the one who stops waiting. */
    later(cadence, 800);
  }
  var rings=0;                     /* THE BIRTH (pass two): the rings the visitor waited, counted as each BEGINS */
  function cadence(){
    if(ended) return;
    rings++;
    ring(0,2.00);
    later(cadence, 5000);
  }

  var ended=false;
  function hangup(){
    if(ended) return; ended=true;
    /* THE BIRTH (21 sep, the mortality pass, pass two). the thumb has landed
       on the red disc: this instant is the conception, and this page keeps
       its three raw facts for the first room to wake — when, how many rings
       were waited, and the # the card carried. it computes nothing: the law
       is mortal.js's. a living tab's life is never replaced (mortal.js
       throws a second stone away); under ?mortal=0 nothing is born. */
    if(!window.__apwnpOff){
      try{ window.sessionStorage.setItem('apwnp.birth',JSON.stringify({ t:Date.now(), r:rings, h:String(location.hash||'') })); }catch(_){}
    }
    timers.forEach(clearTimeout); timers=[];
    cutLine(); thump();
    status.textContent='Call Ended';
    call.classList.add('ending');
    /* `Call Ended` and the tipped handset used to hold 1.30 and now hold
       1.80. it is the only moment on this page where nothing is being asked
       of anyone — the ringing has stopped, the decision is made, and the
       next room has knot arrived. half a second is the difference between a
       screen that flashes past and a screen that is read. */
    later(function(){
      call.classList.add('gone');
      black.classList.add('on');
      /* THE ONE-PAGE LAW (20 sep, the mortality pass): a REPLACE, never a push —
         phone.html takes this page's place in the tab, so the tab still holds
         one page and can close itself at the end. ?mortal=0 is the door as
         it was. */
      later(function(){
        try{ if(window.__apwnpOff) location.href=NEXT; else location.replace(NEXT); }
        catch(_){ location.href=NEXT; }
      }, 620);
    }, 1800);
  }

  /* the red button ends it on the frame it is pressed — pointerdown, knot
     click: a call ends when the thumb lands on it. it is the only door out
     of this page, and it opens onto the home screen. */
  var endBtn=document.getElementById('end');
  endBtn.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(!dialed) return;
    endBtn.style.transform='scale(0.92)';
    /* ---- the eye, offered here and NOT taken by default ----
       phone.html's arrival wants the visitor's room behind the locked home
       screen, and a camera needs a gesture, and this press is the last
       gesture before that page loads. same origin, so a grant taken here is
       a grant that page inherits. technically it is the right hook and it
       is one line.

       it is off, and 👁️ argue it should stay off. a permission sheet raised
       on the frame the call dies puts a system dialog on the only charged
       moment this page has — and it asks for a camera with nothing to
       explain why, seconds after the visitor hung up a telephone. that is
       the shape of a page you stop trusting. the original reasoning at the
       top of this file was right: the camera is asked for where it makes
       sense, on the camera app, one room later, where the button the thumb
       is already on is literally a lens.

       what is lost by leaving it off is small: the arrival's night comes on
       at the visitor's first touch of that screen instead of before it, and
       their first touch there is the camera button anyway.

       ?eye turns it on so both can be felt on a real phone and ruled. */
    if(EYE){
      try{
        var md=navigator.mediaDevices;
        if(md&&md.getUserMedia){
          md.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
            .then(function(st){ try{ st.getTracks().forEach(function(tk){ tk.stop(); }); }catch(_){} })
            .catch(function(){});
        }
      }catch(_){}
    }
    hangup();
  });

  /* ---- RULED, and what it cost ----
     terence ruled it three times and it landed in the same place each time,
     harder: the mark is knot drawn at all, and the website goes on No.
     the page subtracts itself every time the system speaks.

     what that bought, and it is worth saying out loud because it is the
     only structural change in the file: No used to be free. it kept the
     visitor on the sheet, the sheet was whole, and the homepage row was
     still sitting there to be tapped again. now No costs them the row, and
     the row was the door. the door has moved to the handset (see summon,
     above) and 👁️ would knot ship this without that move — without it, No
     is a dead end and the house is unreachable to anyone who presses it,
     which this file's own law forbids.

     one reading of the instruction 👁️ did knot take: "the website page is no
     longer there" could have meant this whole page — that No ends the piece
     rather than thinning it. it is a real move and a harder one, but it
     shuts the house to every visitor who hesitates, and hesitating is knot
     a thing this page should punish. 👁️ read it as the row. say so if it
     was the page and it is a two-line change.

     the alternative that stays available: dropCard() called on the Yes press
     as well, so the website leaves whichever answer is given. 👁️ left it on
     No alone — on Yes the sheet is on screen for about a second and a half
     before the call covers it, and a card collapsing under a lit call button
     is a second motion competing with the one that matters. */
})();
</script>
