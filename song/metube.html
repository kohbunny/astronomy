  if(!brokenOK) return false;
  try{
    const vw2=vid.videoWidth, vh2=vid.videoHeight;
    if(!vw2||!vh2) return false;
    if(!still){ still=document.createElement('canvas'); stx=still.getContext('2d');
      if(!stx){ still=null; return false; } }
    still.width=shat.width; still.height=shat.height;
    stx.setTransform(SDPR,0,0,SDPR,0,0);
    stx.fillStyle='#000'; stx.fillRect(0,0,SW,SH);
    const s3=Math.min(SW/vw2,SH/vh2), dw2=vw2*s3, dh2=vh2*s3;
    stx.drawImage(vid,(SW-dw2)*0.5,(SH-dh2)*0.5,dw2,dh2);
    haveStill=true;
    if(web) for(let n=0;n<web.shards.length;n++){
      web.shards[n].cvs=null; web.shards[n].fail=false; }
    bKey='';
    return true;
  }catch(_){ return false; }
}

/* a piece is baked — its pixels lifted from the still into its own
   small canvas — the first breath it leaves the sheet, never before.
   the departures are staggered by td, so the cost arrives a few pieces
   at a time. the bake may fail; the sheet's erase may knot (a piece
   that cannot fly is still gone from the pane — see the compose). */
function bakeOne(s){
  if(s.cvs) return true;
  if(s.fail||!haveStill) return false;
  let x0=1e9, x1=-1e9, y0=1e9, y1=-1e9;
  for(let n=0;n<s.poly.length;n++){
    const p=s.poly[n];
    if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
    if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1];
  }
  s.bx=Math.floor(x0)-1; s.by=Math.floor(y0)-1;
  s.bw=Math.ceil(x1-x0)+2; s.bh=Math.ceil(y1-y0)+2;
  if(s.bw<2||s.bh<2){ s.fail=true; return false; }
  try{
    const cv=document.createElement('canvas');
    cv.width=Math.max(2,Math.round(s.bw*SDPR));
    cv.height=Math.max(2,Math.round(s.bh*SDPR));
    const g=cv.getContext('2d'); if(!g){ s.fail=true; return false; }
    g.setTransform(SDPR,0,0,SDPR,-s.bx*SDPR,-s.by*SDPR);
    g.beginPath();
    for(let n=0;n<s.poly.length;n++){
      const p=s.poly[n];
      if(n===0) g.moveTo(p[0],p[1]); else g.lineTo(p[0],p[1]);
    }
    g.closePath(); g.clip();
    g.drawImage(still,0,0,still.width,still.height,0,0,SW,SH);
    s.cvs=cv; return true;
  }catch(_){ s.fail=true; return false; }
}

/* how far along a piece is, from the one number B */
function qOf(s,B){ const x=(B-s.td)/s.span; return x<=0?0:x>=1?1:x*x*(3-2*x); }

/* the visitor beneath — cover-fit, flipped like a true mirror, a
   breath too large, warped in bands like water knot yet level, with a
   ghost of themselves a few pixels off. all of it stills with settle;
   at rest it is one clean draw. driven by c alone, never a wall clock,
   so a pause freezes the water too. */
function drawFace(c,settle){
  const vw2=mir.videoWidth, vh2=mir.videoHeight;
  if(!vw2||!vh2) return;
  const un=1-settle;
  const S2=Math.max(SW/vw2,SH/vh2)*(1.10-0.10*settle);
  const dw=vw2*S2, dh=vh2*S2, dx0=(SW-dw)*0.5, dy0=(SH-dh)*0.5;
  shx2.save();
  shx2.translate(SW,0); shx2.scale(-1,1);
  try{
    if(un>0.02){
      const BN=18, bh3=SH/BN, amp=11*Math.pow(un,1.3);
      for(let k3=0;k3<BN;k3++){
        const y3=k3*bh3;
        const off=(Math.sin(y3*0.045+c*9.0)+0.6*Math.sin(y3*0.013-c*5.2))*amp;
        let sy2=(y3-dy0)/S2, sh4=bh3/S2+0.5;
        if(sy2<0){ sh4+=sy2; sy2=0; }
        if(sh4<=0||sy2>=vh2) continue;
        shx2.drawImage(mir,0,sy2,vw2,Math.min(sh4,vh2-sy2),
          dx0+off,y3,dw,bh3+0.6);
      }
      shx2.globalAlpha=0.22*un;
      shx2.drawImage(mir,0,0,vw2,vh2,
        dx0+Math.sin(c*6.3)*8*un, dy0+Math.cos(c*4.7)*6*un, dw, dh);
      shx2.globalAlpha=1;
    }else{
      shx2.drawImage(mir,0,0,vw2,vh2,dx0,dy0,dw,dh);
    }
  }catch(_){}
  shx2.restore();
  if(un>0.02){
    shx2.fillStyle='rgba(255,255,255,'+(0.06*un).toFixed(3)+')';
    shx2.fillRect(0,0,SW,SH);
  }
}

/* the web, drawn — dark hair and its light answer, offset the way
   intro's glass carries them. spokes grow to a living white tip while
   the film still plays; a line dies the moment either pane beside it
   is airborne; the whole voice fades with the give. */
function drawCracks(c,crackU,B,giveK,gate){
  if(crackU<=0.002||giveK<=0.02||!web) return;
  const ca=0.9*giveK;
  const segs=web.segs, rt=web.rate;
  /* how far each spoke has walked — its own clock inside the clock.
     the front is a front, knot a circle; the white tips that marked it
     read as a necklace of dots and are gone (15 aug). */
  const revs=[];
  for(let i=0;i<rt.length;i++)
    revs.push(Math.pow(Math.min(1,crackU*rt[i]),0.85)*web.rmax);
  for(let pass=0;pass<2;pass++){
    shx2.save();
    if(pass===0){ shx2.translate(0.55,0.75);
      shx2.strokeStyle='rgba(5,8,14,'+(0.55*ca).toFixed(3)+')'; shx2.lineWidth=1.15; }
    else{ shx2.translate(-0.35,-0.45);
      shx2.strokeStyle='rgba(240,246,255,'+(0.34*ca).toFixed(3)+')'; shx2.lineWidth=0.7; }
    shx2.lineCap='round';
    shx2.beginPath();
    for(let n=0;n<segs.length;n++){
      const g2=segs[n];
      if(gate&&((g2.s1&&qOf(g2.s1,B)>0.12)||(g2.s2&&qOf(g2.s2,B)>0.12))) continue;
      if(g2.spoke){
        const rv=revs[g2.si];
        if(g2.r0>rv) continue;
        if(g2.r1>rv){
          const t2=Math.max(0,Math.min(1,(rv-g2.r0)/Math.max(1e-3,g2.r1-g2.r0)));
          if(t2<=0.001) continue;
          shx2.moveTo(g2.a[0],g2.a[1]);
          shx2.lineTo(g2.a[0]+(g2.b[0]-g2.a[0])*t2, g2.a[1]+(g2.b[1]-g2.a[1])*t2);
        }else{
          shx2.moveTo(g2.a[0],g2.a[1]); shx2.lineTo(g2.b[0],g2.b[1]);
        }
      }else if(g2.mr<=Math.min(revs[g2.si],revs[g2.sj])){
        /* a ring crack joins two spokes — it appears when the slower
           of its two walkers arrives, knot before */
        shx2.moveTo(g2.a[0],g2.a[1]); shx2.lineTo(g2.b[0],g2.b[1]);
      }
    }
    shx2.stroke();
    shx2.restore();
  }
  /* the sparks, breathing on the displayed clock, never a wall one */
  if(crackU>0.6){
    shx2.save(); shx2.globalCompositeOperation='lighter';
    const gl=web.glints;
    for(let n=0;n<gl.length;n++){
      const g3=gl[n];
      if(g3.gr>revs[g3.gi]) continue;
      if(gate&&((g3.s1&&qOf(g3.s1,B)>0.12)||(g3.s2&&qOf(g3.s2,B)>0.12))) continue;
      const tw=Math.pow(Math.max(0,Math.sin(c*3.8+g3.ph)),8)*ca;
      if(tw<0.04) continue;
      shx2.strokeStyle='rgba(255,255,255,'+(0.8*tw).toFixed(3)+')';
      shx2.lineWidth=0.8;
      shx2.beginPath();
      shx2.moveTo(g3.x-3.2,g3.y); shx2.lineTo(g3.x+3.2,g3.y);
      shx2.moveTo(g3.x,g3.y-3.2); shx2.lineTo(g3.x,g3.y+3.2);
      shx2.stroke();
    }
    shx2.restore();
  }
}

/* the whole passage, one function of the displayed second */
function breakDraw(c){
  const D=fdur();
  if(!EP.mirror||!isFinite(D)||!mirReady||!web||doneAll||c<D-LEAD){ clearShat(); return; }
  const T=D+CODA;
  const crackU=ease01((c-(D-LEAD))/LEAD);        // the failing, over the film
  const giveK=1-ease01((c-(T-1.0))/1.0);         // the last second, run down
  const B=ease01((c-D)/4.6)*giveK;               // brokenness, the one number
  const settle=ease01((c-D)/4.6);                // the water finding its level
  const broken=c>=D-0.001;
  if(broken&&!haveStill) takeStill();            // the scrub can arrive before the end does
  const key2=c.toFixed(3)+'|'+SW+'x'+SH+'|'+(haveStill?1:0);
  if(key2===bKey&&!shatClear) return; bKey=key2;
  shx2.setTransform(SDPR,0,0,SDPR,0,0);
  shx2.clearRect(0,0,SW,SH); shatClear=false;

  /* the visitor beneath, before the pane so the openings show them */
  if(broken&&haveStill&&B>0.0015) drawFace(c,settle);

  if(broken&&haveStill&&B<0.997){
    /* the sheet's kick — how many pieces are tearing off right now.
       a count, knot an event log, so it runs backwards for free. */
    const sh2=web.shards;
    let act=0;
    for(let n=0;n<sh2.length;n++){
      const q0=(B-sh2[n].td)/sh2[n].span;
      if(q0>0&&q0<0.22) act++;
    }
    const amp=Math.min(1,act/3)*2.4+1.1*crackU*(1-B);
    const kx=Math.sin(c*47.0)*amp, ky=Math.cos(c*39.0)*amp*0.8;
    /* the standing sheet, composed fresh: the still minus the airborne.
       nothing destructive — scrub back and it is simply whole again. */
    sheetCtx.setTransform(SDPR,0,0,SDPR,0,0);
    sheetCtx.clearRect(0,0,SW,SH);
    sheetCtx.drawImage(still,0,0,still.width,still.height,0,0,SW,SH);
    sheetCtx.globalCompositeOperation='destination-out';
    sheetCtx.beginPath();
    let flying=0;
    for(let n=0;n<sh2.length;n++){
      const s=sh2[n];
      if(qOf(s,B)<=0.02) continue;
      flying++;
      const P2=s.poly;
      sheetCtx.moveTo(P2[0][0],P2[0][1]);
      for(let m=1;m<P2.length;m++) sheetCtx.lineTo(P2[m][0],P2[m][1]);
      sheetCtx.closePath();
    }
    if(flying) sheetCtx.fill();
    sheetCtx.globalCompositeOperation='source-over';
    /* the sheet stands — leaning a little into the break, kicked */
    shx2.save();
    shx2.translate(web.hx+kx,web.hy+ky);
    shx2.rotate(0.010*B);
    shx2.scale(1+0.030*B,1+0.030*B);
    shx2.translate(-web.hx,-web.hy);
    shx2.drawImage(sheetCv,0,0,sheetCv.width,sheetCv.height,0,0,SW,SH);
    shx2.restore();
    /* the pieces in the air — falling, tumbling, catching one light */
    let bakes=0;
    for(let n=0;n<sh2.length;n++){
      const s=sh2[n], q1=qOf(s,B);
      if(q1<=0.02) continue;
      const a2=1-ease01((q1-0.70)/0.30);
      if(a2<=0.01) continue;
      if(!s.cvs){ if(bakes>=12||!bakeOne(s)) continue; bakes++; }
      const fx=s.cx+s.dx*q1*s.dist,
            fy=s.cy+s.dy*q1*s.dist*0.45+q1*q1*s.grav;
      shx2.save();
      shx2.globalAlpha=a2;
      shx2.translate(fx,fy);
      shx2.rotate(q1*(0.35+0.65*q1)*s.rot);
      const sc2=1-0.13*q1;
      shx2.scale(sc2,sc2);
      shx2.drawImage(s.cvs,s.bx-s.cx,s.by-s.cy,s.bw,s.bh);
      if(q1<0.18){
        shx2.globalAlpha=a2*0.55*(1-q1/0.18);
        shx2.globalCompositeOperation='lighter';
        shx2.drawImage(s.cvs,s.bx-s.cx,s.by-s.cy,s.bw,s.bh);
      }
      shx2.restore();
    }
  }
  drawCracks(c,crackU,B,giveK,broken&&haveStill);
}

/* one door, two hands behind it. the break first; a single throw and
   the iris takes the frame mid-passage without a word. */
function mirDraw(c){
  if(brokenOK){
    try{ breakDraw(c); return; }
    catch(_){ brokenOK=false; try{ clearShat(); }catch(_2){} }
  }
  irisDraw(c);
}

/* the freeze follows the film: its end, and any seek that lands there. */
vid.addEventListener('ended',function(){ takeStill(); });
vid.addEventListener('seeked',function(){
  const D2=fdur();
  if(isFinite(D2)&&vid.currentTime>=D2-0.12) takeStill();
});
/* the pane follows the room — resize and rotation */
let rzRaf=0;
function reflow(){ if(rzRaf) return;
  rzRaf=requestAnimationFrame(function(){ rzRaf=0; sizeShat(); askPaint(); }); }
window.addEventListener('resize',reflow);
window.addEventListener('orientationchange',reflow);
sizeShat();
/* the film's true size lands after the first guess — the web walks to
   the hand the moment the frame confesses its shape */
vid.addEventListener('loadedmetadata',function(){
  buildWeb(); bKey=''; askPaint();
  /* the tile's length was a guess; the film has now said its own (6 sep).
     the mirror keeps its 0:46 — its clock is the film plus the coda. */
  const D3=fdur();
  if(isFinite(D3)&&!EP.mirror){
    const f3=fmt(D3);
    if(EP.dur!==f3){ EP.dur=f3; buildShelf(); }
  }
});

/* ---- THE WOBBLE (15 aug). at 0:34 the film's own surface gives — the
   hand is in, the mercury swings — and the room catches it: the whole
   page, chrome and comments and all, swings on the point where the hand
   stands. a pure pose per displayed second, like everything here — the
   thumb drags the tremor forward and backward alike, and a pause holds
   the room mid-sway. the pivot is measured once each time the sway
   begins, while the sheet still stands straight, so the numbers are
   layout's own, knot the transform's echo of itself. two frequencies,
   neither a multiple of the other, because mercury is knot a metronome.
   the sway dies as the first cracks walk out — the failure handed from
   the room back into the pane. ---- */
const wobEl=$('app');
let wobOn=false;
function wobUnwob(){
  wobOn=false;
  wobEl.style.transform=''; wobEl.style.transformOrigin=''; wobEl.style.willChange='';
}
function wobDraw(c){
  if(!wobEl) return;
  /* a row with no `wobble` on the shelf does knot sway. that is most of
     them, and the room stands perfectly still for every one. */
  const W=EP.wobble;
  let a=0;
  if(W&&!doneAll&&c>W[0]&&c<W[1]){
    const u=(c-W[0])/(W[1]-W[0]);
    a=ease01(u/0.08)*Math.pow(1-u,1.75);
  }
  if(a<=0.001){
    if(wobOn) wobUnwob();
    return;
  }
  if(!wobOn){
    wobOn=true;
    let ox=SW*0.5, oy=SH*0.42;
    try{
      const ar=wobEl.getBoundingClientRect(), pr=player.getBoundingClientRect();
      ox=pr.left-ar.left+(web?web.hx:SW*0.5);
      oy=pr.top-ar.top+(web?web.hy:SH*0.42);
    }catch(_){}
    wobEl.style.transformOrigin=ox.toFixed(1)+'px '+oy.toFixed(1)+'px';
    wobEl.style.willChange='transform';
  }
  const ph=(c-W[0])*6.28318;
  const rot=a*0.0074*(0.72*Math.sin(ph*2.6)+0.28*Math.sin(ph*4.3+1.7));
  const sc=1+a*0.011*Math.sin(ph*3.1+0.9);
  const tx=a*3.6*Math.sin(ph*2.2+0.4);
  const ty=a*2.6*Math.sin(ph*3.4+2.0);
  wobEl.style.transform='translate3d('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px,0) '+
    'rotate('+rot.toFixed(5)+'rad) scale('+sc.toFixed(4)+')';
}

/* ---- the red line, over the whole length ---- */
let raf=0;
function paint(){
  raf=0;
  const T=totT();
  const c=previewing?previewT:curT();
  const p=(isFinite(T)&&T>0)?Math.min(1,c/T):0;
  played.style.width=(p*100)+'%';
  knob.style.left=(p*100)+'%';
  tm.innerHTML=fmt(c)+' <span class="dur">/ '+fmt(T)+'</span>';
  mirDraw(c);
  wobDraw(c);
  try{ const b=vid.buffered, D=fdur();
    if(isFinite(T)&&isFinite(D)){
      for(let i=0;i<b.length;i++){
        if(vid.currentTime>=b.start(i)&&vid.currentTime<=b.end(i)){
          /* the mirror needs no buffering — it is live — so its stretch
             counts as held the moment it is granted. */
          buf.style.width=Math.min(100,(b.end(i)+extra())/T*100)+'%'; break; } }
    }
  }catch(_){}
}
function askPaint(){ if(!raf) raf=requestAnimationFrame(paint); }
vid.addEventListener('timeupdate',askPaint);
vid.addEventListener('progress',askPaint);
vid.addEventListener('durationchange',askPaint);
vid.addEventListener('loadedmetadata',askPaint);

/* ---- one seek for both stretches. under the thumb the bar only
   previews; the commit lands once, on release. ---- */
function seekTo(t,forcePlay){
  const D=fdur(); if(!isFinite(D)) return;
  const X=extra(), T=D+X;
  t=Math.max(0,Math.min(t,T));
  const wasPlaying=forcePlay?true:unifiedPlaying();
  doneAll=false;
  if(t<D-0.05||X===0){
    coda.on=false; coda.playing=false;          // back out of the mirror, into 1950
    try{ vid.currentTime=Math.min(t,Math.max(0,D-0.001)); }catch(_){}
    if(wasPlaying) vid.play().catch(()=>{});
    else{ try{ vid.pause(); }catch(_){} ppPaint(); }
  }else{
    /* into the mirror stretch. the film holds its last frame — the
       pane itself — which is the bridge again, from the other side. */
    try{ vid.pause(); }catch(_){}
    try{ vid.currentTime=Math.max(0,D-0.05); }catch(_){}
    const el2=Math.min(CODA,Math.max(0,t-D));
    if(el2>=CODA-0.02){ coda.on=true; finishCoda(); }
    else{
      coda.on=true; coda.t=el2; coda.playing=wasPlaying;
      ppPaint(); if(coda.playing) tickStart();
    }
  }
  askPaint();
}

const prohit=$('prohit');
function pxToT(clientX){
  const r=player.getBoundingClientRect();
  const p=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  const T=totT(); return isFinite(T)?p*T:0;
}
prohit.addEventListener('pointerdown',e=>{
  drag=true; previewing=true; player.classList.add('drag'); setCtl(true);
  try{ prohit.setPointerCapture(e.pointerId); }catch(_){}
  previewT=pxToT(e.clientX); askPaint();
  e.preventDefault(); e.stopPropagation();
});
prohit.addEventListener('pointermove',e=>{ if(drag){ previewT=pxToT(e.clientX); askPaint(); } });
function scrubEnd(){ if(!drag) return;
  drag=false; previewing=false; player.classList.remove('drag');
  seekTo(previewT); armHide(); }
prohit.addEventListener('pointerup',scrubEnd);
prohit.addEventListener('pointercancel',scrubEnd);

/* ---- the tap and the double tap. one wakes or rests the face; two on a
   wing is ten seconds, stacking while the arc is still warm, because that
   gesture IS the app now and a surface that ignored it would give the
   whole forgery away. the wings walk the mirror too. ---- */
let tapAt=0, tapX=0, oneT=null, accL=0, accR=0, accT=null;
function wing(side){
  const el=side<0?$('ripL'):$('ripR');
  const txt=side<0?$('ripLt'):$('ripRt');
  if(side<0){ accL+=10; txt.textContent=accL+' seconds'; }
  else{ accR+=10; txt.textContent=accR+' seconds'; }
  clearTimeout(accT); accT=setTimeout(()=>{ accL=accR=0; },760);
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  seekTo((previewing?previewT:curT())+side*10);
}
player.addEventListener('pointerup',e=>{
  if(e.target.closest('button')||e.target.closest('#prohit')) return;
  if(!unmute.classList.contains('hide')){ doUnmute(); setCtl(true); return; }
  if(retry.classList.contains('on')) return;
  const now=performance.now(), x=e.clientX;
  if(now-tapAt<300&&Math.abs(x-tapX)<90){
    clearTimeout(oneT); oneT=null; tapAt=now;
    const r=player.getBoundingClientRect(), q=(x-r.left)/r.width;
    if(q<0.45) wing(-1); else if(q>0.55) wing(1); else toggle();
    setCtl(true); return;
  }
  tapAt=now; tapX=x;
  clearTimeout(oneT);
  oneT=setTimeout(()=>{ oneT=null; setCtl(!ctlOn); },280);
});

/* ---- waiting and refusal, wordless. the wheel belongs to mid-film
   buffering only; the first load is the play button, still, alone. ---- */
/* the wheel and the big file (6 sep). ios fires `stalled` whenever it
   stops DOWNLOADING — which it does all the time on a long episode it
   is fetching in chunks — even while the film plays on happily from
   what it already holds. the wheel went up on that word and nothing
   ever took it down, so it sat spinning over a film that was moving.
   now the wheel only stands when the film is actually starved
   (readyState under HAVE_FUTURE_DATA), and the clock itself takes it
   down: a second that advances is proof enough that nothing is waiting. */
function starved(){ return vid.readyState<3&&!vid.paused&&!vid.ended; }
function spinOn(){
  if(retry.classList.contains('on')) return;
  if(!starved()) return;
  spin.classList.add('on'); }
function spinOff(){ spin.classList.remove('on'); }
vid.addEventListener('waiting',spinOn);
vid.addEventListener('stalled',spinOn);
vid.addEventListener('playing',spinOff);
vid.addEventListener('canplay',spinOff);
vid.addEventListener('canplaythrough',spinOff);
vid.addEventListener('seeked',spinOff);
vid.addEventListener('pause',spinOff);
let lastTU=-1;
vid.addEventListener('timeupdate',()=>{
  const t=vid.currentTime;
  if(spin.classList.contains('on')&&(vid.readyState>=3||t>lastTU+0.01)) spinOff();
  lastTU=t;
});
vid.addEventListener('error',()=>{ spinOff(); retry.classList.add('on'); setCtl(false); });
retry.addEventListener('click',()=>{
  retry.classList.remove('on');
  coda.on=false; coda.playing=false; doneAll=false;
  try{ vid.load(); }catch(_){}
  vid.play().catch(()=>{});
  setCtl(true);
});

/* ---- the arrival. the tile's tap does knot cross the door, so the film
   asks to run, and takes refusal the borrowed app's own way: once more,
   muted, wearing the chip that owns up — and if even that is refused,
   the big triangle simply waits. degrade silently, every rung. ---- */
let auto=false;
function doUnmute(){ vid.muted=false; unmute.classList.add('hide'); }
unmute.addEventListener('click',e=>{ e.stopPropagation(); doUnmute(); });
function tryAuto(){
  if(auto) return; auto=true;
  vid.play().catch(()=>{
    vid.muted=true;
    vid.play().then(()=>{ unmute.classList.remove('hide'); })
      .catch(()=>{ vid.muted=false; spinOff(); setCtl(true); ppPaint(); });
  });
}
/* on arrival the tap that opened the door is on the other side of it, so
   the film asks when it is ready and takes refusal the app's own way. a
   row CHOSEN by a hand is different: play() is called inside that hand's
   own gesture, so it lands unmuted and the chip never has to appear. */
function autoWhenReady(){
  if(vid.readyState>=3) tryAuto();
  else{ vid.addEventListener('canplay',tryAuto,{ once:true });
        vid.addEventListener('loadeddata',tryAuto,{ once:true }); }
}

/* ---- the corners button is gone (15 aug). fullscreen handed the film
   to players this room does knot control — the iphone's system player
   above all — and the pane is the point now: the room swings around it,
   the web starts on it. the film stays in its pane. ---- */

/* ---- switches that switch, gating nothing. a reload forgets them all;
   the page keeps no marks, which is the drawer's law kept here too. ---- */
let liked=false, disliked=false, subbed=false;
const likeN=$('likeN');
$('like').addEventListener('click',()=>{
  liked=!liked; if(liked) disliked=false;
  $('like').classList.toggle('on',liked);
  $('dislike').classList.remove('on');
  likeN.textContent=liked?EP.likesUp:EP.likes;
});
$('dislike').addEventListener('click',()=>{
  disliked=!disliked; if(disliked) liked=false;
  $('dislike').classList.toggle('on',disliked);
  $('like').classList.remove('on');
  likeN.textContent=EP.likes;
});
/* the subscribe is the CHANNEL's, knot the film's, so it survives a
   walk along the shelf the way a real one would — and a reload still
   forgets it, which is the drawer's law and the only one that matters. */
$('sub').addEventListener('click',function(){
  subbed=!subbed; this.classList.toggle('on',subbed);
  this.querySelector('span').textContent=subbed?'Subscribed':'Subscribe';
  /* nobody has ever subscribed to her. for as long as the switch is on,
     somebody has. the count tells the truth both ways. */
  $('subsN').textContent=subbed?EP.subs1:EP.subs;
});
$('share').addEventListener('click',()=>{
  const s={ title:EP.title, url:MORTAL.href };
  try{
    if(navigator.share) navigator.share(s).catch(()=>{});
    else if(navigator.clipboard) navigator.clipboard.writeText(s.url).catch(()=>{});
  }catch(_){}
});
$('dl').addEventListener('click',()=>{});   /* downloads live on a phone that
                                               keeps things. this one does knot. */
$('save').addEventListener('click',()=>{});

/* ---- ...more ---- */
const desc=$('desc');
$('more').addEventListener('click',()=>{
  desc.classList.toggle('open');
  $('more').textContent=desc.classList.contains('open')?'Show less':'...more';
});

/* ---- the desk keys, for whoever arrives with one. the borrowed app's
   own bindings, so a habit lands where it expects to. ---- */
document.addEventListener('keydown',e=>{
  if(e.target&&/input|textarea|select/i.test(e.target.tagName)) return;
  switch(e.key){
    case ' ': case 'k': e.preventDefault(); toggle(); setCtl(true); break;
    case 'ArrowLeft': case 'j': wing(-1); setCtl(true); break;
    case 'ArrowRight': case 'l': wing(1); setCtl(true); break;
    /* 'f' retired with the corners button (15 aug) — the film stays
       in its pane, whatever key a habit brings */
    case 'm': vid.muted=!vid.muted;
      if(!vid.muted) unmute.classList.add('hide'); break;
    case 'Escape': leave(); break;
  }
});

/* ==== THE SHELF, WRITTEN =============================================
   the room reads one row and paints itself with it. nothing below knows
   anything about mirror.mp4 or about a podcast; it knows about a row.
   ==================================================================== */
const ttlEl=$('ttl'), metaEl=$('meta');
const chanava=$('chanava'), channame=$('channame'), subsN=$('subsN');
const desclead=$('desclead'), descbody=$('descbody'), moreEl=$('more');
const cmtN=$('cmtN'), cmtlist=$('cmtlist');
const epsN=$('epsN'), eplist=$('eplist');
const prevb=$('prevb'), nextb=$('nextb');

function esc(s){ return String(s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* the comment, in the shape it has always had here. the heart appears
   only where a creator actually answered. */
function cmtHTML(c){
  return '<div class="cmt">'+
    '<div class="ava"><svg width="15" height="18" viewBox="0 0 20 24"><path d="M10 2.2c3.6 0 7 5.4 7 11.2 0 4.6-3 8.4-7 8.4s-7-3.8-7-8.4c0-5.8 3.4-11.2 7-11.2z" fill="rgba(241,241,243,0.55)"/></svg></div>'+
    '<div><div class="who">'+esc(c.who)+'</div>'+
    '<div class="txt">'+esc(c.txt)+'</div>'+
    '<div class="row">'+
      '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M7 10v10H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3zm2 10V10l4.2-7a2.2 2.2 0 0 1 2.1 2.7L14.5 9H19a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 17.6 20H9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>'+
      esc(c.likes)+
      (c.hearted
        ? '<span class="heart" title="hearted by the channel"><span class="hava"><svg width="6" height="9" viewBox="0 0 20 28"><path d="M10 2 C13.5 7.6 16 10.8 16 15.8 A6 6.4 0 0 1 4 15.8 C4 10.8 6.5 7.6 10 2 Z" fill="#ffc37a"/></svg></span>'+
          '<svg class="hh" width="11" height="11" viewBox="0 0 24 24"><path d="M12 21S3.5 15.5 3.5 9.6A4.8 4.8 0 0 1 12 6.7a4.8 4.8 0 0 1 8.5 2.9C20.5 15.5 12 21 12 21z" fill="#e30035"/></svg></span>'
        : '')+
    '</div></div></div>';
}

/* the tiles. a poster if the shelf has one; otherwise a triangle and no
   claim about a frame nobody has seen. the row you are in wears the
   app's own mark and the words `Now playing` — no red is spent here. */
function buildShelf(){
  $('eps').classList.toggle('solo',VIDEOS.length<2);
  epsN.textContent=String(VIDEOS.length);
  let h='';
  for(let i=0;i<VIDEOS.length;i++){
    const v=VIDEOS[i], now=(i===cur);
    h+='<button class="ep'+(now?' now':'')+'" data-i="'+i+'" '+
       'aria-label="play '+esc(v.title)+'"'+(now?' aria-current="true"':'')+'>'+
       '<span class="th">'+
         (v.poster?'<img class="'+(v.fit==='contain'?'fitc':'')+'" src="'+esc(v.poster)+'" alt="">'
                  :'<svg class="ph" width="19" height="19" viewBox="0 0 24 24" fill="rgba(255,255,255,.28)"><path d="M8 5l11 7-11 7z"/></svg>')+
         '<span class="nowmark"><svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l11 7-11 7z"/></svg></span>'+
         (v.dur?'<span class="len">'+esc(v.dur)+'</span>':'')+
       '</span>'+
       '<span class="tx"><b>'+esc(v.title)+'</b>'+
         '<i>'+(now?'Now playing':(v.ep?'Episode '+v.ep:esc(v.channel)))+'</i></span>'+
       '</button>';
  }
  eplist.innerHTML=h;
  /* the chevrons dim at either end, the way they were dimmed for three
     passes when both ends were the same place. */
  prevb.classList.toggle('dim',cur<=0);
  nextb.classList.toggle('dim',cur>=VIDEOS.length-1);
  prevb.setAttribute('aria-disabled',cur<=0?'true':'false');
  nextb.setAttribute('aria-disabled',cur>=VIDEOS.length-1?'true':'false');
}
eplist.addEventListener('click',e=>{
  const b=e.target.closest('.ep'); if(!b) return;
  go(+b.getAttribute('data-i'));
});

function render(){
  ttlEl.textContent=EP.title;
  metaEl.textContent=EP.views+' views \u00b7 '+(EP.premiered?'Premiered ':'')+EP.when;
  /* the channel's face: the show's own logo where a row carries one
     (6 sep), the drawn eggs standing behind it in case the shelf ever
     refuses the picture. song's flame is untouched. */
  chanava.innerHTML=AVA[EP.ava]||'';
  if(EP.avaImg){
    const im=document.createElement('img');
    im.alt=''; im.decoding='async';
    im.addEventListener('error',()=>{ chanava.innerHTML=AVA[EP.ava]||''; });
    im.src=EP.avaImg;
    chanava.innerHTML=''; chanava.appendChild(im);
  }
  channame.textContent=EP.channel;
  subsN.textContent=subbed?EP.subs1:EP.subs;
  desclead.textContent=EP.views+' views \u00b7 '+EP.when;
  descbody.textContent=EP.desc||'';
  desc.classList.remove('open');
  moreEl.textContent='...more';
  /* a short description has nothing folded under it, so it is knot
     offered a handle. the mask only lies when there is something to
     unmask. */
  const folded=(EP.desc||'').length>96||/\n/.test(EP.desc||'');
  moreEl.classList.toggle('hide',!folded);
  descbody.style.maxHeight=folded?'':'none';
  descbody.style.webkitMaskImage=folded?'':'none';
  descbody.style.maskImage=folded?'':'none';
  likeN.textContent=EP.likes;
  cmtN.textContent=String(EP.comments.length);
  cmtlist.innerHTML=EP.comments.map(cmtHTML).join('');
  buildShelf();
}

/* ---- stepping to a row. everything the last row left behind is put
   down first — the stream, the coda, the still, the baked pieces, the
   sway, the switches that were that film's and knot this one's — so a
   row is never haunted by the one before it. ---- */
function setEP(i,opt){
  opt=opt||{};
  cur=i; EP=VIDEOS[i];

  killMirror();                       /* tracks stopped leaving a row,
                                         exactly as leaving the page */
  coda.on=false; coda.playing=false; coda.t=0; doneAll=false;
  haveStill=false; still=null; stx=null; mirKey=''; bKey='';
  if(web) for(let n=0;n<web.shards.length;n++){
    web.shards[n].cvs=null; web.shards[n].fail=false; }
  try{ clearShat(); }catch(_){}
  if(wobOn) wobUnwob();
  liked=false; disliked=false;
  $('like').classList.remove('on'); $('dislike').classList.remove('on');
  retry.classList.remove('on'); spinOff(); unmute.classList.add('hide');

  render();
  /* the address carries the row, so a reload lands where it left and the
     way back is still the phone's, untouched. — 20 sep, the mortality pass:
     the bar wears the contact card now and may knot be written (a write
     would un-wear it and the tab could never close). so the row is said to
     the ORGAN instead: MORTAL.here keeps it as this page's true address,
     where the front door finds it after safari's own reload, and leaves
     the bar alone. with no organ beside the file, the old line stands. */
  try{
    if(window.MORTAL&&typeof MORTAL.here==='function') MORTAL.here(MORTAL.path+'?v='+EP.id);
    else history.replaceState(null,'',location.pathname+'?v='+EP.id);
  }catch(_){}

  try{ vid.pause(); }catch(_){}
  vid.muted=false;
  vid.preload=EP.preload||'metadata';
  /* the poster waits under the big triangle, contain-fit like the film
     itself, which is what an audio-first upload looks like on the app
     this room is forging. a row without one opens on black, and the
     attribute is REMOVED rather than blanked so no broken tile flashes. */
  if(EP.poster) vid.setAttribute('poster',EP.poster);
  else vid.removeAttribute('poster');
  vid.src=EP.src;
  try{ vid.load(); }catch(_){}
  buildWeb();                          /* the hand moved; the web follows */

  auto=false;
  ppPaint(); setCtl(true); askPaint();

  if(opt.play) tryAuto(); else autoWhenReady();
  /* and the ask, at this row's door and only if this row is the one that
     has a reason to make it. */
  armMirror();
}

function go(i){
  if(i===cur||i<0||i>=VIDEOS.length) return;
  setEP(i,{ play:true });
  try{ $('scroll').scrollTop=0; }catch(_){}
}
prevb.addEventListener('click',e=>{ e.stopPropagation(); go(cur-1); armHide(); });
nextb.addEventListener('click',e=>{ e.stopPropagation(); go(cur+1); armHide(); });

/* ---- the arrival. ?v= names the row; anything else, or nothing, and
   the room opens on the LAST row of the shelf, which is the latest
   episode (6 sep — the shelf reads first-to-latest now). ---- */
(function(){
  let i=VIDEOS.length-1;
  try{
    const q=new URLSearchParams(MORTAL.search).get('v');
    if(q) for(let n=0;n<VIDEOS.length;n++) if(VIDEOS[n].id===q){ i=n; break; }
  }catch(_){}
  setEP(i,{});
})();

ppPaint(); paint();
})();
</script>
</body>
</html>
