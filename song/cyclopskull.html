  /* ---- the waves: the star's blue thread and the visitor's gold,
     welded to the glass over the bone (unisong's grammar, small) ---- */
  const wctx=wv.getContext('2d');
  function wavesOn(v){ wv.classList.toggle('on',!!v); }
  let wPh=0;
  function drawWaves(dt){
    if(!wv.classList.contains('on')) return;
    const dpr=Math.min(2,devicePixelRatio||1);
    const cw=wv.clientWidth,chh=wv.clientHeight;
    if(wv.width!==cw*dpr||wv.height!==chh*dpr){ wv.width=cw*dpr; wv.height=chh*dpr; }
    const c=wctx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,cw,chh);
    wPh+=dt*0.0021;
    const mid=chh/2, A=13+7*micLoud, n=90;
    const near=Math.max(0,1-Math.abs(shownCents)/EX_CENTS);
    const met=exMet?1:0;
    const merge=met?1:near*0.55;
    /* gold's offset + wavelength ride the detune */
    const off=(met?0:(shownCents/60)*26)*(1-merge*0.5);
    const wob=met?0:Math.min(1,Math.abs(shownCents)/45);
    const kB=0.055, kG=kB*Math.pow(2,(met?0:shownCents)/900);
    function thread(col,kk,yof,tr,aA){
      c.strokeStyle=col; c.lineWidth=1.6; c.globalAlpha=aA;
      c.beginPath();
      for(let i=0;i<=n;i++){
        const x=i/n*cw;
        const tremble=tr?Math.sin(i*0.9+wPh*13)*2.6*wob*(voiced?1:1.6):0;
        const y=mid+yof+Math.sin(i/n*cw*kk-wPh*6)*A*(0.55+0.45*Math.sin(wPh*0.7+i*0.013))+tremble;
        if(i===0)c.moveTo(x,y); else c.lineTo(x,y);
      }
      c.stroke(); c.globalAlpha=1;
    }
    /* the star's blue-white, immovable */
    thread('rgba(140,190,255,0.95)',kB,0,false,0.92);
    thread('rgba(190,220,255,0.5)',kB,0,false,0.35);
    /* the visitor's gold, trembling with its own distance */
    if(part>=2&&(exLive||exMet)){
      thread('rgba(255,208,96,0.95)',kG,off,true,voiced||met?0.92:0.4);
      /* at unison, one still line and the one sanctioned rainbow breath */
      if(met&&uniFlashT>0){
        const gr=c.createLinearGradient(0,0,cw,0);
        ['#ff6a6a','#ffc46a','#fff26a','#7dff8f','#6ad2ff','#b48cff'].forEach((cc,i)=>gr.addColorStop(i/5,cc));
        c.strokeStyle=gr; c.lineWidth=2.4; c.globalAlpha=Math.min(0.5,uniFlashT);
        c.beginPath();
        for(let i=0;i<=n;i++){ const x=i/n*cw;
          const y=mid+Math.sin(i/n*cw*kB-wPh*6)*A*0.55;
          if(i===0)c.moveTo(x,y); else c.lineTo(x,y); }
        c.stroke(); c.globalAlpha=1;
        uniFlashT-=dt*0.0006;
      }
    }
  }

  /* ============ THE STAR IN THE EYE, AND THE EARTH (v11) ============
     viewer-hosted set dressing for the pulsar lesson. the flare rides
     the module's own skull group (found by the meshes the api names),
     so it breathes with the float; the earth stands in the ROOM.
     everything additive, depth-quiet, and faded by its own ease. */
  function glowTex(stops,W2){
    W2=W2||256;
    const cv=document.createElement('canvas'); cv.width=W2; cv.height=W2;
    const c=cv.getContext('2d');
    const g=c.createRadialGradient(W2/2,W2/2,0,W2/2,W2/2,W2/2);
    for(const s of stops) g.addColorStop(s[0],s[1]);
    c.fillStyle=g; c.fillRect(0,0,W2,W2);
    const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
    return tx;
  }
  function beamTex(){
    const cv=document.createElement('canvas'); cv.width=256; cv.height=64;
    const c=cv.getContext('2d');
    const g=c.createLinearGradient(0,0,256,0);
    g.addColorStop(0,'rgba(160,200,255,0)');
    g.addColorStop(0.18,'rgba(190,222,255,0.55)');
    g.addColorStop(0.5,'rgba(240,250,255,0.95)');
    g.addColorStop(0.82,'rgba(190,222,255,0.55)');
    g.addColorStop(1,'rgba(160,200,255,0)');
    c.fillStyle=g; c.fillRect(0,0,256,64);
    const v=c.createLinearGradient(0,0,0,64);
    v.addColorStop(0,'rgba(0,0,0,1)'); v.addColorStop(0.5,'rgba(0,0,0,0)');
    v.addColorStop(1,'rgba(0,0,0,1)');
    c.globalCompositeOperation='destination-out';
    c.fillStyle=v; c.fillRect(0,0,256,64);
    const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
    return tx;
  }
  function mkSprite(tex,scale,color,rot){
    const m=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0,
      depthWrite:false,blending:THREE.AdditiveBlending,color:color||0xffffff,
      rotation:rot||0});
    const s=new THREE.Sprite(m);
    if(typeof scale==='number') s.scale.set(scale,scale,1);
    else s.scale.set(scale[0],scale[1],1);
    return s;
  }
  const flare={grp:null,k:0,tgt:0,corona:null,core:null,beamA:null,beamB:null,veil:null};
  function flareBuild(){
    if(flare.grp) return;
    const SGp=inst.api.meshes[0].parent;         /* the module's own group */
    flare.grp=new THREE.Group(); flare.grp.visible=false;
    flare.grp.position.copy(inst.api.eye); flare.grp.position.z+=0.026;
    SGp.add(flare.grp);
    const softT=glowTex([[0,'rgba(236,246,255,0.95)'],[0.25,'rgba(170,210,250,0.55)'],
      [0.6,'rgba(90,140,205,0.18)'],[1,'rgba(40,80,140,0)']]);
    const hotT=glowTex([[0,'rgba(255,255,255,1)'],[0.4,'rgba(220,238,255,0.8)'],
      [1,'rgba(150,190,240,0)']],128);
    flare.corona=mkSprite(softT,0.085);
    flare.veil=mkSprite(softT,0.19,0x7ea8e0);
    flare.core=mkSprite(hotT,0.023);
    const bT=beamTex();
    flare.beamA=mkSprite(bT,[0.30,0.020],0xcfe4ff,0.9);
    flare.beamB=mkSprite(bT,[0.24,0.014],0x9fc8ff,-0.5);
    for(const s of [flare.veil,flare.corona,flare.beamA,flare.beamB,flare.core])
      flare.grp.add(s);
  }
  function eyeFlareTo(v){ flareBuild(); flare.tgt=Math.max(0,Math.min(1,v)); }
  function flareStep(dt,now){
    if(!flare.grp) return;
    flare.k+=(flare.tgt-flare.k)*Math.min(1,dt*0.0012);
    const k=flare.k;
    if(k<0.004){ flare.grp.visible=false; return; }
    flare.grp.visible=true;
    const t=now*0.001;
    /* the tick made visible: a soft breath at 2.2 hz — 173 would strobe */
    const beat=0.5+0.5*Math.sin(t*Math.PI*2*2.2);
    const slow=0.5+0.5*Math.sin(t*0.9);
    flare.corona.material.opacity=k*(0.26+0.20*beat);
    flare.corona.scale.setScalar(0.085*(1+0.10*beat));
    flare.veil.material.opacity=k*(0.10+0.06*slow);
    flare.core.material.opacity=k*(0.38+0.30*beat);
    flare.beamA.material.opacity=k*(0.22+0.26*beat);
    flare.beamB.material.opacity=k*(0.16+0.20*(1-beat));
    flare.beamA.material.rotation+=dt*0.00052;    /* the lighthouse turns */
    flare.beamB.material.rotation-=dt*0.00037;
  }
  /* ---- the earth — unisong's own globe, one earth in every room.
     the NASA jpeg (public domain, embedded below with the module's
     blessing) is never shown raw: it is read for land and height and
     the body is painted in canvas — the same sea-and-green law as the
     song's shader, baked here because this room renders by webgpu. ---- */
  const earth={grp:null,spin:null,k:0,tgt:0,ball:null,veil:null,halo:null,
    thread:null,threadN:64,label:null,eyeW:new THREE.Vector3(),built:false};
  function earthBuild(){
    if(earth.built) return; earth.built=true;
    earth.grp=new THREE.Group(); earth.grp.visible=false;
    earth.grp.position.set(-0.100,-0.005,0.185);
    scene.add(earth.grp);
    earth.spin=new THREE.Group(); earth.grp.add(earth.spin);
    const R=0.062;
    const mat=new THREE.MeshStandardMaterial({color:0x4d7fd0,roughness:0.8,
      metalness:0,transparent:true,opacity:0,
      emissive:new THREE.Color(0xffffff),emissiveIntensity:0.22});
    earth.ball=new THREE.Mesh(new THREE.SphereGeometry(R,48,32),mat);
    earth.spin.add(earth.ball);
    earth.veil=new THREE.Mesh(new THREE.IcosahedronGeometry(R*1.035,2),
      new THREE.MeshBasicMaterial({color:0x9fc4ff,transparent:true,opacity:0,
        side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    earth.grp.add(earth.veil);
    earth.halo=mkSprite(glowTex([[0,'rgba(220,236,255,0.55)'],
      [0.5,'rgba(160,200,255,0.16)'],[1,'rgba(120,170,240,0)']]),R*5.2,0xdcecff);
    earth.grp.add(earth.halo);
    /* the map, painted from the jpeg's land and depth */
    (function(){
      const im=new Image();
      im.onload=function(){
        try{
          const W2=512,H2=256;
          const cv=document.createElement('canvas'); cv.width=W2; cv.height=H2;
          const c=cv.getContext('2d');
          c.drawImage(im,0,0,W2,H2);
          const id=c.getImageData(0,0,W2,H2), d=id.data;
          const lum=new Float32Array(W2*H2);
          for(let i=0;i<W2*H2;i++)
            lum[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;
          const sst=(a,b,x)=>{ const q=Math.max(0,Math.min(1,(x-a)/(b-a))); return q*q*(3-2*q); };
          for(let y=0;y<H2;y++) for(let x=0;x<W2;x++){
            const i=y*W2+x, r=d[i*4]/255, g=d[i*4+1]/255, b=d[i*4+2]/255;
            const land=sst(0.02,0.20,Math.max(r,g)-b);
            const L=lum[i];
            const seaK=sst(0.05,0.45,L), grnK=sst(0.12,0.62,L);
            const sea=[0.36+(0.70-0.36)*seaK,0.66+(0.90-0.66)*seaK,1.0];
            const grn=[0.22+(0.62-0.22)*grnK,0.66+(0.96-0.66)*grnK,0.34+(0.52-0.34)*grnK];
            const hL=lum[Math.max(0,y-1)*W2+Math.max(0,x-1)];
            const hR=lum[Math.min(H2-1,y+1)*W2+Math.min(W2-1,x+1)];
            const relief=(hL-hR)*2.2*land;
            let cr=(sea[0]+(grn[0]-sea[0])*land)*(1+relief),
                cg=(sea[1]+(grn[1]-sea[1])*land)*(1+relief),
                cb=(sea[2]+(grn[2]-sea[2])*land)*(1+relief);
            const gy=0.299*cr+0.587*cg+0.114*cb;
            cr=gy+(cr-gy)*1.30; cg=gy+(cg-gy)*1.30; cb=gy+(cb-gy)*1.30;
            d[i*4]=Math.max(0,Math.min(255,cr*255));
            d[i*4+1]=Math.max(0,Math.min(255,cg*255));
            d[i*4+2]=Math.max(0,Math.min(255,cb*255));
          }
          c.putImageData(id,0,0);
          const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
          mat.map=tx; mat.emissiveMap=tx; mat.color.set(0xffffff); mat.needsUpdate=true;
        }catch(e){}
      };
      im.src='data:image/jpeg;base64,'+EARTH_B64;
    })();
    /* the thread: earth -> the eye, the whole map in one line */
    const pos=new Float32Array(earth.threadN*3);
    const tg=new THREE.BufferGeometry();
    tg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    earth.thread=new THREE.Line(tg,new THREE.LineBasicMaterial({color:0x9fd0ff,
      transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    earth.thread.frustumCulled=false;
    scene.add(earth.thread);
    /* the label — the one sanctioned figure, part of the demonstration */
    const cv2=document.createElement('canvas'); cv2.width=512; cv2.height=64;
    const c2=cv2.getContext('2d');
    c2.font='300 26px "JetBrains Mono",ui-monospace,monospace';
    c2.fillStyle='rgba(200,222,255,0.92)'; c2.textAlign='center';
    c2.fillText('512 light years · psr j0437-4715',256,40);
    const ltx=new THREE.CanvasTexture(cv2); ltx.colorSpace=THREE.SRGBColorSpace;
    earth.label=mkSprite(ltx,[0.125,0.0156],0xffffff);
    earth.label.material.blending=THREE.NormalBlending;
    scene.add(earth.label);
  }

  function earthStep(dt,now){
    if(!earth.built) return;
    earth.k+=(earth.tgt-earth.k)*Math.min(1,dt*(earth.tgt<earth.k?0.0026:0.0016));
    const k=earth.k;
    const vis=k>0.004;

    if(!vis) return;

    if(flare.grp) flare.grp.getWorldPosition(earth.eyeW);
    else earth.eyeW.copy(inst.api.eye);
    const p=earth.thread.geometry.attributes.position.array;
    const a=earth.grp.position, b=earth.eyeW, N=earth.threadN;
    for(let i=0;i<N;i++){
      const q=i/(N-1), lift=Math.sin(q*Math.PI)*0.028;
      p[i*3]=a.x+(b.x-a.x)*q;
      p[i*3+1]=a.y+(b.y-a.y)*q+lift;
      p[i*3+2]=a.z+(b.z-a.z)*q;
    }
    earth.thread.geometry.attributes.position.needsUpdate=true;
    earth.thread.geometry.setDrawRange(0,Math.max(2,Math.floor(N*Math.min(1,k*1.25))));
    earth.thread.material.opacity=0.42*k;
    earth.label.position.set(a.x+(b.x-a.x)*0.45,
      a.y+(b.y-a.y)*0.45+0.050,a.z+(b.z-a.z)*0.45);
    earth.label.material.opacity=0.85*k;

  /* ---- free text: crisis first, then the mind ----
     v10: in the MEETING (part 1) the house LLM answers BY DEFAULT — hist +
     turn + name to /.netlify/functions/ask, mode 'skull', planet-ar's
     architecture exactly; the local brain is the dark-house fallback and
     the same turns count either way. INTRO_TURNS caps the meeting: nudges
     at cap−2 and cap−1 (the server ramp speaks them when the house is up,
     W.twoMore/W.oneMore when it is dark), and after the tenth answer the
     skull says W.enough and walks to the tuning ITSELF — deterministic,
     whatever mind answered. parts 2–4 stay local (?brain forces the house
     there; ?nobrain forces local everywhere). a crisis answer never counts
     a turn and never forces the door. */
  let turn=0;
  function localBrain(t){
    for(const [re,as] of RULES) if(re.test(t)) return as[(Math.random()*as.length)|0];
    return DEFAULTS[(Math.random()*DEFAULTS.length)|0];
  }
  function pushHist(role,content){
    hist.push({role:role,content:content});

  }
  function parseReply(j){
    if(!j) return '';
    if(typeof j==='string') return j;
    if(typeof j.reply==='string') return j.reply;
    if(typeof j.text==='string') return j.text;
    if(typeof j.answer==='string') return j.answer;
    if(typeof j.message==='string') return j.message;
    if(j.content&&j.content.length){ let t2='';
      for(let i=0;i<j.content.length;i++) if(j.content[i].type==='text') t2+=j.content[i].text;
      return t2; }
    return '';
  }
  function houseBrain(){
    return new Promise((res,rej)=>{
      const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
      const to=setTimeout(()=>{ if(ctrl){try{ctrl.abort();}catch(e){}} rej(new Error('t')); },14000);
      fetch('/.netlify/functions/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        signal:ctrl?ctrl.signal:undefined,
        body:JSON.stringify({messages:hist.slice(-12),mode:'skull',
          turn:(part===1?llmTurns:turn),name:name||undefined})})
      .then(r=>{ if(!r.ok) throw new Error('http'); return r.json(); })
      .then(j=>{ clearTimeout(to);
        const s2=parseReply(j);
        if(s2) res(String(s2).replace(/[\*#`>_]+/g,'').trim().toLowerCase());
        else rej(new Error('empty')); })
      .catch(e=>{ clearTimeout(to); rej(e); });
    });
  }
  async function aside(t){
    if(CRISIS.test(t)){
      crisisHold=true; chips([]); ask(null);
      pushHist('user',t); pushHist('assistant',SAFE);
      await say(SAFE,{safe:true,hold:900});
      status('say something when you’re ready · i’m here',false);
      ask('free','');
      return;
    }
    if(crisisHold){ crisisHold=false; gLine.classList.remove('safe'); }
    const inMeeting=(part===1&&step==='bridge');
    turn++;
    if(inMeeting) llmTurns++;
    pushHist('user',t);
    const useHouse=inMeeting?!G_NOBRAIN:G_BRAIN;
    let a=null;
    if(useHouse){
      status('it is thinking',true);
      try{ a=await houseBrain(); }catch(e){ a=null; }
    }
    if(!a){
      a=localBrain(t);
      /* the dark-house ramp — the server speaks these itself when it is up */
      if(inMeeting&&llmTurns===INTRO_TURNS-2) a+=' '+W.twoMore;
      else if(inMeeting&&llmTurns===INTRO_TURNS-1) a+=' '+W.oneMore;
    }
    pushHist('assistant',a);
    /* one line ahead of the door: warm the closing + tuning voices */
    if(inMeeting&&llmTurns>=INTRO_TURNS-1)
      prefetchSay([W.enough(name),W.tune1,W.tune2,W.tune3,W.tune4(name)]);
    await say(a,{hold:600});
    if(inMeeting&&llmTurns>=INTRO_TURNS&&step==='bridge'&&!crisisHold){
      await say(W.enough(name),{hold:700});
      toTuning();
      return;
    }
    if(exLive&&!exMet) status('hum · make the two waves one',true);
    else if(inMeeting) status('',false);
    reprompt();
  }
  function reprompt(){
    if(step==='name'){ say(W.askName,{mute:true,hold:0});
      chips([['call me visitor',()=>routeVoice('visitor')]]);
      ask('name','a name for me to keep'); }
    else if(step==='bridge') { chips([[W.chipTune,toTuning],[W.chipWhat,whatIs]]); }
    else if(step==='choice'||step==='offer') showChoice(exOffered&&!exMet);
    else if(step==='goShell') chips([[W.chipGoShell,()=>handoff('conch')]]);
    else if(step==='goFull') chips([[W.chipGoFull,()=>handoff('full')]]);
  }
  gSend.addEventListener('click',()=>submit());
  gAsk.addEventListener('keydown',(e)=>{ if(e.key==='Enter') submit(); });
  function submit(){
    const t=clean(gAsk.value); gAsk.value='';
    if(!t) return;
    routeVoice(t);
  }
  /* v11 — ONE DOOR FOR EVERY WORD: the mic's finals, the fallback row
     and the rig's hear() all walk through here. spoken choices count
     exactly as the chips do (unisong's law: voice or tap, same gate). */
  function routeVoice(t){
    t=clean(t); if(!t) return;
    wakeAudio();
    if(step==='name'){ takeName(t); return; }
    if(step==='choice'||step==='offer'){
      if(/(sea ?shell|shell|conch|beach)/i.test(t)){ chips([]); chooseRite('conch'); return; }
      if(/(immersive|immersion|emers|full|deep|floor)/i.test(t)){ chips([]); chooseRite('full'); return; }
      if(/\b(keep|again|more|humming)\b/i.test(t)&&step==='offer'){ chips([]); keepHumming(); return; }
    }
    if(step==='bridge'&&/^(yes|yeah|ok|okay|sure|tune|let'?s|begin|start)\b/i.test(t)){
      chips([]); toTuning(); return; }
    if(step==='goShell'&&/\b(begin|start|ready|yes|ok|okay)\b/i.test(t)){ chips([]); handoff('conch'); return; }
    if(step==='goFull'&&/\b(begin|start|ready|yes|ok|okay)\b/i.test(t)){ chips([]); handoff('full'); return; }
    if(step==='lesson') return;   /* the lesson holds the floor; the ear is closed anyway */
    aside(t);
  }

  /* =================== the four parts =================== */
  /* the first tap is the key that winds the voice: the context cannot
     wake without a gesture, and the chat now opens before any. the name
     tap is usually that key. */
  function armWake(){
    if(actx) return;
    const h=()=>{ wakeAudio();
      if(actx){ removeEventListener('pointerdown',h,true);
        removeEventListener('keydown',h,true); } };
    addEventListener('pointerdown',h,true);
    addEventListener('keydown',h,true);
  }
  async function start(){
    if(on) return; on=true; part=1; turn=0; llmTurns=0; hist=[];
    manual();
    armWake();
    prefetchSay([W.intro1,W.askName,W.noName,W.bridge,W.whatIs]);
    document.body.classList.add('chat-on');
    try{ inst.api.look({x:0,y:0}); }catch(e){}
    /* the ear stays away through the whole intro — the artist's mark.
       it returns with the phone at the tuning, where it teaches. */
    setEar(false); setPhone(false); setPose('none'); setTune(false); setXray(0);
    root.classList.add('on');
    ask(null); chips([]);
    camTo(0.02,0.06,0.56);
    status('',false);
    await say(W.intro1,{hold:650});
    step='name';
    await say(W.askName,{hold:0});
    status(srHas()?'it is listening — say a name':'',srHas());
    chips([['call me visitor',()=>routeVoice('visitor')]]);
    ask('name','a name for me to keep');
  }
  async function takeName(t){
    if(step!=='name') return;
    let n=clean(t).toLowerCase();
    n=n.replace(/^(i am|i'm|im|my name is|the name is|name is|call me|it's|its|they call me)\s+/,'');
    n=n.split(/\s+/).slice(0,2).join(' ').slice(0,20);
    step='named'; ask(null); chips([]);
    if(!n||/^(no|nope|none|nothing|why|na|visitor)$/.test(n)){
      name='visitor'; named=true;
      await say(W.noName,{hold:500});
    } else {
      name=n; named=true;
      await say(W.named(name),{hold:500});
    }
    await lesson();
  }
  /* ============ THE PULSAR LESSON (v11) ============
     the eye flares into the star's own corona, the skull speaks AS
     psr j0437-4715 — what it is, the LIVE distance, the earth globe
     with a light-thread drawn to the eye — then the WHY: one wave,
     one now, a meeting 512 light years wide. the bone shifts
     regular → combo → full x-ray → back as the words ask. */
  async function lesson(){
    step='lesson'; status('',false);
    prefetchSay([W.hello(name),W.look1,W.iam1,W.iam2,W.earth1,W.dist1(),
      W.dist2(),W.skull2(name),W.why1,W.why2,W.why3(name),W.why4,W.bridge]);
    await say(W.hello(name),{hold:520});
    camTo(0.0,0.10,0.42);
    eyeFlareTo(1);                     /* the eye becomes the star */
    try{ inst.api.harmonic(1); }catch(e){}
    await say(W.look1,{hold:750});
    setXray(0.55);                     /* the combo: the star floats in half-glass */
    await say(W.iam1,{hold:650});
    await say(W.iam2,{hold:800});
    camTo(0.02,0.07,0.88);             /* the two-shot: skull and earth */
    earthTo(1);                        /* the globe forms; the thread draws */
    await say(W.earth1,{hold:800});
    await say(W.dist1(),{hold:850});
    await say(W.dist2(),{hold:950});
    setXray(1);                        /* the second skull: yours */
    camTo(0.0,0.10,0.50);
    await say(W.skull2(name),{hold:950});
    setXray(0.35);
    await say(W.why1,{hold:700});
    await say(W.why2,{hold:750});
    await say(W.why3(name),{hold:900});
    await say(W.why4,{hold:650});
    setXray(0); try{ inst.api.harmonic(0); }catch(e){}
    eyeFlareTo(0.30);                  /* the star stays lit, banked */
    earthTo(0);
    await sleep(350);
    await bridgeStep();
  }
  async function bridgeStep(){
    step='bridge';
    await say(W.bridge,{hold:0});
    /* the meeting's memory begins here: the LLM should know what the
       bone has already said, and to whom */
    hist=[{role:'assistant',content:W.intro1+' '+W.askName},
      {role:'user',content:name},
      {role:'assistant',content:[W.hello(name),W.look1,W.iam1,W.iam2,
        W.earth1,W.dist1(),W.skull2(name),W.why1,W.why2,W.why3(name),
        W.why4,W.bridge].join(' ')}];
    chips([[W.chipTune,toTuning],[W.chipWhat,whatIs]]);
    ask('free','or ask me something');
    status(srHas()?'it is listening':'',srHas());
  }
  async function whatIs(){
    await say(W.whatIs,{hold:600});
    reprompt();
  }
  async function toTuning(){
    part=2; step='tune'; chips([]); ask(null);
    prefetchSay([W.tune1,W.tune2,W.tune3,W.tune4(name),W.unison,W.ask(name)]);
    camTo(0.62,0.05,0.47);
    setSide('r'); setEar(true); setPhone(true);
    await say(W.tune1,{hold:700});
    setTune(true); toneOn();
    wavesOn(true);
    await say(W.tune2,{hold:800});
    exLive=true;                                /* gold wakes with the words */
    await say(W.tune3,{hold:800});
    camTo(0.30,0.05,0.58);
    await say(W.tune4(name),{hold:200});
    micStart(); if(G_NOMIC) dragOn();
    exT0=performance.now();
    status('hum · make the two waves one',true);
    /* v11: the word-ear stays CLOSED while the visitor hums (it would
       transcribe the hum); it opens with the choice, at unison or at
       the one-minute offer — voice or chip, same gate */
    ask(null);
  }
  async function unisonMet(){
    if(exMet) return;
    exMet=true; uniFlashT=0.9;
    status('',false);
    try{ inst.api.harmonic(1); }catch(e){}
    await say(W.unison,{hold:900});
    /* v10: the visitor can choose WHILE the ask line is still typing
       (typed choices count the moment step turns 'choice') — re-check
       after the line, or the choice chips re-arm over the instructions */
    if(!exChoiceMade){ step='choice'; await say(W.ask(name),{hold:0});
      if(!exChoiceMade&&step==='choice') showChoice(false); }
  }
  async function offer(){
    step='offer';
    const c=(bestClose===1e9)?999:Math.round(bestClose);
    await say(W.offer(c),{hold:0});
    if(!exChoiceMade) showChoice(true);        /* v10: same re-check as unisonMet */
  }
  function showChoice(withKeep){
    prefetchSay([W.shell1,W.full1]);  /* whichever door — its first line is warm */
    const list=[[W.chipShell,()=>chooseRite('conch')],[W.chipFull,()=>chooseRite('full')]];
    if(withKeep) list.push([W.chipKeep,keepHumming]);
    chips(list); ask('free');
    status(srHas()?'say it — seashell, or immersive':'',srHas());
  }
  async function keepHumming(){
    keepUntil=performance.now()+45000; exOffered=false;
    status('hum · the door will wait',true);
  }
  async function chooseRite(k){
    if(exChoiceMade) return;                   /* v10: a stale chip must not re-enter */
    exChoiceMade=true; chosen=k; chips([]); ask(null);
    exLive=false; toneOff(); setTune(false); wavesOn(false);
    status('',false);
    if(k==='conch') await shellPart(); else await fullPart();
  }
  async function shellPart(){
    part=3; step='shell';
    prefetchSay([W.shell1,W.shell2,W.shell3,W.shell4,W.go(name)]);
    camTo(0.95,0.08,0.50);
    setPose('shell');
    await say(W.shell1,{hold:520});
    await say(W.shell2,{hold:760});
    await say(W.shell3,{hold:760});
    await say(W.shell4,{hold:700});
    step='goShell';
    await say(W.go(name),{hold:0});
    chips([[W.chipGoShell,()=>handoff('conch')]]);
    ask('free'); status(srHas()?'it is listening':'',srHas());
  }
  async function fullPart(){
    part=4; step='full';
    prefetchSay([W.full1,W.full2,W.full3,W.full4,W.full5,W.full6,W.go(name)]);
    camTo(0.85,0.16,0.56);
    await say(W.full1,{hold:520});
    await say(W.full2,{hold:700});
    await say(W.full3,{hold:760});
    setPose('song');
    await say(W.full4,{hold:820});
    await say(W.full5,{hold:640});
    await say(W.full6,{hold:700});
    step='goFull';
    await say(W.go(name),{hold:0});
    chips([[W.chipGoFull,()=>handoff('full')]]);
    ask('free'); status(srHas()?'it is listening':'',srHas());
  }
  /* the door: the guide goes quiet, the exercise is chatbot-free.
     rite rides the url for the room to read (&rite=conch|full); today
     unisong runs its own arc regardless — the hint is forward wiring. */
  async function handoff(k){
    chips([]); ask(null); step='done';
    status('the guide is quiet now',false);
    await say(W.handoff,{mute:true,hold:300});
    const url=HREFG+'?enter=unisong&go=1&via=bone&rite='+(k==='conch'?'conch':'full');
    try{ window.APWNP.leave(url); }catch(e){}
    doneAt=performance.now();
    setTimeout(()=>{ stop(false); },5200);
  }
  function stop(hard){
    on=false; part=0; step=''; exLive=false;
    typeTok++;                                 /* v10: any typing loop lets go */
    houseStop(); try{ inst.api.hush(); }catch(e){}
    srDisarm();                                /* v11: the word-ear rests */
    if(flare.grp) flare.tgt=0;                 /* the star banks, the earth bows out */
    if(earth.built) earth.tgt=0;
    gLine.textContent='';
    document.body.classList.remove('chat-on');
    toneOff(); micStop(); wavesOn(false);
    root.classList.remove('on'); chips([]); ask(null);
    camT=null; crisisHold=false;
    if(hard){ setTune(false); setPose('none'); setPhone(false); setEar(false);
      try{ inst.api.look(null); }catch(e){} }
    exMet=false; exOffered=false; exChoiceMade=false; exCnt=0; exT0=0;
    bestClose=1e9; cents=999; shownCents=999; named=false; name='';
    hist=[]; llmTurns=0;
  }
  const HREFG=window.APWNP.modules.cyclopskull.href;

  /* ---- the guide's clock ---- */
  let lastT=performance.now();
  (function loop(){
    const now=performance.now(), dt=Math.min(80,now-lastT); lastT=now;
    if(on){ if(exLive&&!exMet) measure(dt); camStep(); drawWaves(dt); }
    flareStep(dt,now); earthStep(dt,now);   /* v11: fades finish even at rest */
    requestAnimationFrame(loop);
  })();

  /* ---- bench ---- */
  const API={
    start:start, stop:()=>stop(true),
    state:()=>({on:on,part:part,step:step,name:name,exLive:exLive,exMet:exMet,
      exOffered:exOffered,cents:Math.round(cents),best:(bestClose===1e9)?-1:Math.round(bestClose),
      chosen:chosen,voiced:voiced,turns:llmTurns,cap:INTRO_TURNS,
      vr:VR,sr:srHas(),flare:+((flare.k||0).toFixed(2)),earth:+((earth.k||0).toFixed(2))}),
    name:(n)=>{ if(step==='name') takeName(String(n)); },
    input:(t)=>{ routeVoice(String(t)); },
    hear:(t)=>{ routeVoice(String(t)); },   /* v11: the mic's own path, rig-driven */
    chip:(i)=>{ const f=chipFns[i]; if(f){ chips([]); f(); } },
    cents:(v)=>{ benchCents=(v===null||v===undefined)?null:+v; },
    unison:()=>unisonMet(),
    offer:()=>{ if(exLive&&!exMet&&!exOffered){ exOffered=true; offer(); } },
    jump:async(k)=>{ if(!on){ on=true; part=1; manual(); root.classList.add('on');
        document.body.classList.add('chat-on');
        try{ inst.api.look({x:0,y:0}); }catch(e){} }
      if(!named){ name='tester'; named=true; }
      if(!hist.length) hist=[{role:'assistant',content:W.bridge}];
      chips([]); ask(null);
      if(k==='tune') await toTuning();
      else if(k==='lesson') await lesson();
      else if(k==='choice'){ exMet=true; step='choice'; await say(W.ask(name),{hold:0}); showChoice(false); }
      else if(k==='shell') await shellPart();
      else if(k==='song'||k==='full') await fullPart();
      else if(k==='bridge') await bridgeStep();
    }
  };
  window.__GUIDE=API;
  return API;
})();
addEventListener('keydown',function(e){
  if(e.key==='c'||e.key==='C'){ const st=window.__GUIDE.state();
    if(st.on) window.__GUIDE.stop();
    else { wakeAudio(); window.__GUIDE.start(); } }
});
/* v11 — HOW THE DOOR OPENS. flat: the chat opens on entry as v10 ruled.
   vr: the BEGIN GATE stands first — one tap winds the audio, asks the
   gyro (ios wants the asking inside a gesture), starts the camera feed
   and opens the chat, all on the one grant. ?nochat holds everything. */
(function(){
  const gate=document.getElementById('vrGate');
  if(/[?&]nochat/.test(SRCH)) return;
  if(VR){
    gate.classList.add('on');
    gate.addEventListener('pointerdown',function(){
      wakeAudio(); gyroAsk(); camStart();
      gate.classList.add('going');
      setTimeout(function(){ gate.classList.remove('on'); },1150);
      setTimeout(function(){
        if(!window.__GUIDE.state().on) window.__GUIDE.start(); },420);
    },{once:true});
  } else {
    setTimeout(function(){
      if(!window.__GUIDE.state().on) window.__GUIDE.start(); },900);
  }
})();
/* ===SKULLGUIDE end=== */

document.getElementById('veil').classList.add('gone');
const clock=new THREE.Clock();
renderer.setAnimationLoop(function(){
  const dt=Math.min(0.05,clock.getDelta()), t=clock.getElapsedTime();
  applyLook();                     /* v11: vr — the body is the camera */
  try{ inst.update(dt,t); }catch(e){}
  if(dbg.style.display==='block'){
    const s=inst.api.state();
    dbg.textContent='rite '+s.rite+'  k '+s.k.toFixed(2)+'  t '+s.t
      +'\nmoon '+s.moon.toFixed(3)+'  tris '+M.tris+'  cell '+M.cell;
  }
  renderer.render(scene,camera);
});
</script>
