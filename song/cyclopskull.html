  vertex, 145 mm across), with ONE round socket cut high in the frontal

  orbits belong. the brow does not fork: it runs unbroken under the eye
  and out into two smooth swellings at the temples, and the frontal falls
  from them into the zygomatic processes without ever making a rim. the
  vault is HOLLOW, and the socket is its only opening INTO it: no foramen
  magnum, no orbital fissures — but in v4 the ears are TRUE HOLES at
  last: two external meatus canals bored in where the tragi would stand,
  behind the arch roots, angled in and a little up the way real canals
  run, each ending BLIND in the temporal a drum's depth in. nothing
  reaches the vault by them — the sound that stands between them stands
  in the bone — but a phone speaker centred on the tragus point now has
  a mouth to speak into. the gums have gone, and the roots have gone
  shy: each tooth thins into the bone as a TINY NEEDLE POINT, barely
  there, and the enamel itself is half-glass. the sutures are laid on
  as fine dark ribbons that wander the way real ones do; the metopic runs
  from the vertex down and DIES AT THE SOCKET'S UPPER RIM, which is the
  whole joke of the thing.

  HOW IT IS MADE. no meshes fetched, no images, nothing external. TWO
  signed distance fields now — the cranium (vault, occiput, brow,
  midface, arches, subtractions: braincase, socket bore, piriform,
  fossae) and the mandible (body, gonials, rami, condyles, coronoids) —
  each polygonised by SURFACE NETS (no lookup tables, one vertex per
  crossed cell), twice smoothed and twice re-projected onto the true
  isosurface by newton. normals from the field gradient. every vertex:
  five-tap field occlusion, bone mottle, weathering, cavity blackness,
  interdental scalloping, vascular pits, suture halos (cranium). a
  sub-millimetre noise displacement lumps the bone, normals corrected
  analytically. teeth by class, uppers on the cranium, lowers on the jaw.
  the eye skins, the beam alpha, the halo, the harmonic ring, the
  bone maps and the NIGHT the glass reflects are all baked in canvas
  at build. one tsl node FAMILY now — the fresnel glimmer, the night
  reflection and the fresnel opacity on the glass materials, same
  code both backends — no compute, no render targets, no new shadow
  casters: identical under ?gl.

  THE TALK (the chatbot's mouth). the host speaks; the skull moves.
    inst.api.mouth(v)     feed 0..1 every frame (your TTS analyser rms);
                          held 0.3 s, eased like muscle. silent.
    inst.api.speak(text)  or (seconds): it performs alone — syllable

                          (deterministic per text per seed), jaw working,
                          quiet unpitched whispers underneath. returns
                          the duration in seconds. api.hush() stops it.
    inst.api.look(g)      {x,y} in -1..1 (y down; {x:0,y:0} is straight
                          at the visitor) seizes the gaze;
                          null frees it to wander.
    inst.api.harmonic(n)  fix the sounding to mode 1..4; 0 wanders. the
                          wave itself is UNDRAWN (second cut): its
                          amplitude shows at the tragus ripples and in
                          the vault's breath.
    inst.api.xray(v)      0..1 (or true/false): ease the glass region —
                          crown to chin, all but the occiput — from bone
                          to CLEAR GLASS and back.

  THE INSTRUCTION (v7). all four are no-ops until called; the skull at
  rest has no ear and no phone.
    inst.api.ear(v)       0..1 (or true/false): ease the pinna in and
                          out. it stands on the side api.side names.
    inst.api.earSkin(k)   'flesh' (default) or 'xray'. flesh is the
                          mockup: photoreal skin over clearing bone.
                          xray dresses the pinna in the cranium's ivory
                          so it goes to glass WITH the skull.
    inst.api.phone(v)     0..1 (or true/false): the phone glides up from
                          off-side and seats its earpiece on the tragus.
                          hold it at 0.5 and it hangs mid-approach.
    inst.api.side(k)      'r' (default) or 'l' — which side the ear and
                          the phone stand on. returns the side.
    inst.api.tragus()     the tragus point in the block's own space, as
                          a Vector3: where the speaker goes, if the host
                          wants to draw its own thing there.
    inst.api.pose(k[,v])  v8 — the INSTRUCTION POSES, from the artist's
                          two references. 'shell': the skull stays
                          upright and the phone lies HORIZONTAL, cupped
                          over the ear like a seashell held to it.
                          'song': the whole skull pitches back ~50°,
                          chin skyward, and the phone rides the ear
                          into the tilt, running down along the jaw.
                          null|'none' stands it back up. optional v
                          0..1 holds a pose part-way. the speaker stays
                          seated on the tragus THROUGH all of it — the
                          anchor law bends for nobody. pose does not
                          summon ear or phone; ask for those as ever.
    inst.api.tune(v)      v8 — the TUNING SUN: kindles the mockup's
                          small burning sun at the earpiece speaker,
                          beating with the rings that leave it. the
                          artist's ruling: it burns during the TUNING
                          EXERCISE only — the holds stay unmarked. it
                          rides the phone; no phone up, no sun.
  a chatbot teaching the harmonic would: api.side('r'), api.ear(1),
  api.phone(1), api.harmonic(n), then api.speak(theReplyText) — and
  api.phone(0), api.ear(0) when it has finished explaining. teaching
  a HOLD it would add api.pose('shell') — or 'song' — and teaching
  the tuning, api.tune(1) while the tone plays, api.tune(0) after.
  while it talks: the socket warms and the wave rises.
  the whispers are unpitched noise, exempt under §8 like the knock.

      http://song.aprojectwithnopurpose.com/unisong
  tap again to stop it — except the last 0.8 s, which is not.

  knock and whispers are unpitched noise, exempt.

     the resting plane, z forward (the socket looks down +z). every number

  function sdEllip(px,py,pz,cx,cy,cz,rx,ry,rz){

    const k0=Math.sqrt(qx*qx+qy*qy+qz*qz);

  const ECRS=[  0.0122,-0.0098,  0.0186,-0.0124,  0.0238,-0.0138 ];
  const ECRI=[  0.0122,-0.0098,  0.0162,-0.0044,  0.0176, 0.0018 ];

  }
  const gradEar=(x,y,z,e)=>fieldGradF(fieldEar,x,y,z,e);
  /* the tragus point in the pinna's own frame — the place the phone
     speaker seats, and where the ripples land */
  const ETRG=[0.0086,-0.0026,0.0100];

  /* ================= surface nets =================
     one vertex per crossed cell, placed at the mean of that cell's edge
     crossings; a quad for every crossed grid edge. no lookup tables, and
     the quads come out square-ish, which the smoothing likes. run twice
     now — once for the cranium, once for the mandible — so the jaw can
     hinge at the condyles and the skull can talk. */
  const H=LO?0.0044:0.0032;
  /* the x span is forced to an even count of cells so that the grid has a
     column exactly on x=0 and the skull is sampled the same on both sides;
     an off-centre grid was quietly shaving the left parietal flat */
  async function polygonise(FN,GFN,HX,BY0,BY1,BZ0,BZ1,cullFn){
    const NX=2*Math.ceil(HX/H), BX0=-NX*H/2;
    const NY=Math.ceil((BY1-BY0)/H), NZ=Math.ceil((BZ1-BZ0)/H);
    const SX=NX+1, SY=NY+1, SZ=NZ+1;
    const F=new Float32Array(SX*SY*SZ);
    for(let k=0;k<SZ;k++){
      const z=BZ0+k*H;
      for(let j=0;j<SY;j++){
        const y=BY0+j*H, base=(k*SY+j)*SX;
        for(let i=0;i<SX;i++) F[base+i]=FN(BX0+i*H,y,z);
      }
      if((k&7)===7) await yieldTick();
    }
    const CIDX=new Int32Array(NX*NY*NZ).fill(-1);
    let   vx=[],vy=[],vz=[],idx=[];
    const EA=[0,0,0,1,1,2,2,3,4,4,5,6];   /* the twelve edges of a cell, as */
    const EB=[1,2,4,3,5,3,6,7,5,6,7,7];   /* corner-index pairs (bit0=x,1=y,2=z) */
    const cvv=new Float64Array(8);
    for(let k=0;k<NZ;k++){
      for(let j=0;j<NY;j++){
        for(let i=0;i<NX;i++){
          let neg=0;
          for(let c=0;c<8;c++){
            const v=F[((k+((c>>2)&1))*SY+(j+((c>>1)&1)))*SX+(i+(c&1))];
            cvv[c]=v; if(v<0) neg++;
          }
          if(neg===0||neg===8) continue;
          let sx=0,sy=0,sz=0,n=0;
          for(let e=0;e<12;e++){
            const a=EA[e],b=EB[e],va=cvv[a],vb=cvv[b];
            if((va<0)===(vb<0)) continue;
            const t=va/(va-vb);
            sx+=(a&1)+t*((b&1)-(a&1));
            sy+=((a>>1)&1)+t*(((b>>1)&1)-((a>>1)&1));
            sz+=((a>>2)&1)+t*(((b>>2)&1)-((a>>2)&1));
            n++;
          }
          CIDX[(k*NY+j)*NX+i]=vx.length;
          vx.push(BX0+(i+sx/n)*H); vy.push(BY0+(j+sy/n)*H); vz.push(BZ0+(k+sz/n)*H);
        }
      }
      if((k&15)===15) await yieldTick();
    }
    /* quads across every crossed grid edge that has four cells around it */
    function quad(a,b,c,d,flip){
      if(a<0||b<0||c<0||d<0) return;
      if(flip){ idx.push(a,c,b, a,d,c); } else { idx.push(a,b,c, a,c,d); }
    }
    for(let k=0;k<SZ;k++) for(let j=0;j<SY;j++) for(let i=0;i<SX;i++){
      const o=(k*SY+j)*SX+i, v0=F[o];
      if(i<NX){ const v1=F[o+1];
        if((v0<0)!==(v1<0)&&j>0&&k>0&&j<SY-1&&k<SZ-1)
          quad(CIDX[((k-1)*NY+(j-1))*NX+i],CIDX[((k-1)*NY+j)*NX+i],
               CIDX[(k*NY+j)*NX+i],CIDX[(k*NY+(j-1))*NX+i],v0<0); }
      if(j<NY){ const v1=F[o+SX];
        if((v0<0)!==(v1<0)&&i>0&&k>0&&i<SX-1&&k<SZ-1)
          quad(CIDX[((k-1)*NY+j)*NX+(i-1)],CIDX[((k-1)*NY+j)*NX+i],
               CIDX[(k*NY+j)*NX+i],CIDX[(k*NY+j)*NX+(i-1)],v0>=0); }
      if(k<NZ){ const v1=F[o+SX*SY];
        if((v0<0)!==(v1<0)&&i>0&&j>0&&i<SX-1&&j<SY-1)
          quad(CIDX[(k*NY+(j-1))*NX+(i-1)],CIDX[(k*NY+(j-1))*NX+i],
               CIDX[(k*NY+j)*NX+i],CIDX[(k*NY+j)*NX+(i-1)],v0<0); }
    }
    await yieldTick();
    if(cullFn){
      const hid=new Uint8Array(vx.length);
      for(let a=0;a<vx.length;a++) hid[a]=cullFn(vx[a],vy[a],vz[a])?1:0;
      const keep=[];
      for(let t=0;t<idx.length;t+=3){
        const a=idx[t],b=idx[t+1],c=idx[t+2];
        if(hid[a]&&hid[b]&&hid[c]) continue;
        keep.push(a,b,c);
      }
      /* compact: drop the vertices no surviving triangle names */
      const remap=new Int32Array(vx.length).fill(-1);
      const nx2=[],ny2=[],nz2=[];
      for(let t=0;t<keep.length;t++){
        const v=keep[t];
        if(remap[v]<0){ remap[v]=nx2.length; nx2.push(vx[v]); ny2.push(vy[v]); nz2.push(vz[v]); }
        keep[t]=remap[v];
      }
      vx=nx2; vy=ny2; vz=nz2; idx=keep;
    }
    await yieldTick();
    const NV=vx.length;
    const P=new Float64Array(NV*3);
    for(let a=0;a<NV;a++){ P[a*3]=vx[a]; P[a*3+1]=vy[a]; P[a*3+2]=vz[a]; }

    /* ---- thrice now (v3): relax, then pull back onto the true surface.
       the third pass is most of 'less blocky' — the newton reprojection
       keeps the anatomy honest while the faceting relaxes away ---- */
    const adjS=new Float64Array(NV*3), adjN=new Int32Array(NV);
    for(let pass=0;pass<3;pass++){
      adjS.fill(0); adjN.fill(0);
      for(let t=0;t<idx.length;t+=3){
        for(let e=0;e<3;e++){
          const a=idx[t+e], b=idx[t+(e+1)%3];
          adjS[a*3]+=P[b*3]; adjS[a*3+1]+=P[b*3+1]; adjS[a*3+2]+=P[b*3+2]; adjN[a]++;
          adjS[b*3]+=P[a*3]; adjS[b*3+1]+=P[a*3+1]; adjS[b*3+2]+=P[a*3+2]; adjN[b]++;
        }
      }
      const w=0.55;
      for(let a=0;a<NV;a++){
        if(!adjN[a]) continue;
        P[a*3]+=(adjS[a*3]/adjN[a]-P[a*3])*w;
        P[a*3+1]+=(adjS[a*3+1]/adjN[a]-P[a*3+1])*w;
        P[a*3+2]+=(adjS[a*3+2]/adjN[a]-P[a*3+2])*w;
      }
      for(let a=0;a<NV;a++){
        let x=P[a*3],y=P[a*3+1],z=P[a*3+2];
        for(let s=0;s<2;s++){
          const d=GFN(x,y,z,H*0.18);
          const st=cl(d,-H*1.4,H*1.4);
          x-=_g[0]*st; y-=_g[1]*st; z-=_g[2]*st;
        }
        P[a*3]=x; P[a*3+1]=y; P[a*3+2]=z;
      }
      await yieldTick();
    }
    return {P,idx,NV};
  }

  /* ---- surface nets, BOX BOUNDED. the skull's polygonise() forces an
     even x span about x=0 so both sides sample alike; the pinna is not
     symmetric about anything and lives entirely off to one side, so it
     gets its own grid and its own cell — an ear's ridges are 3 mm wide
     and the bone's 3.2 mm cell would eat them whole. ---- */
  async function polyBox(FN,GFN,HH,BX0,BX1,BY0,BY1,BZ0,BZ1){
    const NX=Math.ceil((BX1-BX0)/HH),NY=Math.ceil((BY1-BY0)/HH),
          NZ=Math.ceil((BZ1-BZ0)/HH);
    const SX=NX+1,SY=NY+1,SZ=NZ+1;
    const F=new Float32Array(SX*SY*SZ);
    for(let k=0;k<SZ;k++){ const z=BZ0+k*HH;
      for(let j=0;j<SY;j++){ const y=BY0+j*HH, base=(k*SY+j)*SX;
        for(let i=0;i<SX;i++) F[base+i]=FN(BX0+i*HH,y,z); }
      if((k&3)===3) await yieldTick(); }
    const CIDX=new Int32Array(NX*NY*NZ).fill(-1);
    let vx=[],vy=[],vz=[],idx=[];
    const EA=[0,0,0,1,1,2,2,3,4,4,5,6], EB=[1,2,4,3,5,3,6,7,5,6,7,7];
    const cvv=new Float64Array(8);
    for(let k=0;k<NZ;k++) for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){
      let neg=0;
      for(let c=0;c<8;c++){
        const v=F[((k+((c>>2)&1))*SY+(j+((c>>1)&1)))*SX+(i+(c&1))];
        cvv[c]=v; if(v<0) neg++; }
      if(neg===0||neg===8) continue;
      let sx=0,sy=0,sz=0,n=0;
      for(let e=0;e<12;e++){
        const a=EA[e],b=EB[e],va=cvv[a],vb=cvv[b];
        if((va<0)===(vb<0)) continue;
        const t=va/(va-vb);
        sx+=(a&1)+t*((b&1)-(a&1));
        sy+=((a>>1)&1)+t*(((b>>1)&1)-((a>>1)&1));
        sz+=((a>>2)&1)+t*(((b>>2)&1)-((a>>2)&1));
        n++; }
      CIDX[(k*NY+j)*NX+i]=vx.length;
      vx.push(BX0+(i+sx/n)*HH); vy.push(BY0+(j+sy/n)*HH); vz.push(BZ0+(k+sz/n)*HH);
    }
    function quad(a,b,c,d,flip){ if(a<0||b<0||c<0||d<0) return;
      if(flip){ idx.push(a,c,b,a,d,c); } else { idx.push(a,b,c,a,c,d); } }
    for(let k=0;k<SZ;k++) for(let j=0;j<SY;j++) for(let i=0;i<SX;i++){
      const o=(k*SY+j)*SX+i, v0=F[o];
      if(i<NX){ const v1=F[o+1];
        if((v0<0)!==(v1<0)&&j>0&&k>0&&j<SY-1&&k<SZ-1)
          quad(CIDX[((k-1)*NY+(j-1))*NX+i],CIDX[((k-1)*NY+j)*NX+i],
               CIDX[(k*NY+j)*NX+i],CIDX[(k*NY+(j-1))*NX+i],v0<0); }
      if(j<NY){ const v1=F[o+SX];
        if((v0<0)!==(v1<0)&&i>0&&k>0&&i<SX-1&&k<SZ-1)
          quad(CIDX[((k-1)*NY+j)*NX+(i-1)],CIDX[((k-1)*NY+j)*NX+i],
               CIDX[(k*NY+j)*NX+i],CIDX[(k*NY+j)*NX+(i-1)],v0>=0); }
      if(k<NZ){ const v1=F[o+SX*SY];
        if((v0<0)!==(v1<0)&&i>0&&j>0&&i<SX-1&&j<SY-1)
          quad(CIDX[(k*NY+(j-1))*NX+(i-1)],CIDX[(k*NY+(j-1))*NX+i],
               CIDX[(k*NY+j)*NX+i],CIDX[(k*NY+j)*NX+(i-1)],v0<0); }
    }
    await yieldTick();
    const NVe=vx.length; const P2=new Float64Array(NVe*3);
    for(let a=0;a<NVe;a++){ P2[a*3]=vx[a]; P2[a*3+1]=vy[a]; P2[a*3+2]=vz[a]; }
    /* TWO passes at 0.40, not the bone's three at 0.55: the pinna is a
       3.6 mm sheet and the bone's relaxation collapses it — the first
       build tore holes clean through the scapha */
    const adjS=new Float64Array(NVe*3), adjN=new Int32Array(NVe);
    for(let pass=0;pass<2;pass++){
      adjS.fill(0); adjN.fill(0);
      for(let t=0;t<idx.length;t+=3) for(let e=0;e<3;e++){
        const a=idx[t+e], b=idx[t+(e+1)%3];
        adjS[a*3]+=P2[b*3]; adjS[a*3+1]+=P2[b*3+1]; adjS[a*3+2]+=P2[b*3+2]; adjN[a]++;
        adjS[b*3]+=P2[a*3]; adjS[b*3+1]+=P2[a*3+1]; adjS[b*3+2]+=P2[a*3+2]; adjN[b]++; }
      for(let a=0;a<NVe;a++){ if(!adjN[a]) continue;
        P2[a*3]+=(adjS[a*3]/adjN[a]-P2[a*3])*0.40;
        P2[a*3+1]+=(adjS[a*3+1]/adjN[a]-P2[a*3+1])*0.40;
        P2[a*3+2]+=(adjS[a*3+2]/adjN[a]-P2[a*3+2])*0.40; }
      for(let a=0;a<NVe;a++){
        let x=P2[a*3],y=P2[a*3+1],z=P2[a*3+2];
        for(let s2=0;s2<2;s2++){
          const d=GFN(x,y,z,HH*0.18);
          const st2=cl(d,-HH*1.4,HH*1.4);
          x-=_g[0]*st2; y-=_g[1]*st2; z-=_g[2]*st2; }
        P2[a*3]=x; P2[a*3+1]=y; P2[a*3+2]=z; }
      await yieldTick();
    }
    return {P:P2,idx,NV:NVe};
  }

  /* v4: KEEP ONLY THE CONNECTED BONE. the smooth blends can overshoot
     where two primitives run parallel without meeting, and the field
     dips below zero in small DETACHED sheets and bubbles. the honest
     surface is one connected component (the bore joins the chambers to
     the world, the piriform joins the nose, the canals join the ears),
     so anything detached is debris — found by union over shared
     vertices and dropped whole, a couple of thousand triangles the
     clear glass would otherwise have caught floating. */
  function keepMain(S){
    const NVv=S.NV, parent=new Int32Array(NVv);
    for(let i=0;i<NVv;i++) parent[i]=i;
    const find=i=>{ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
    const uni=(a,b)=>{ a=find(a); b=find(b);
      if(a!==b){ if(a<b) parent[b]=a; else parent[a]=b; } };
    const idx=S.idx;
    for(let t=0;t<idx.length;t+=3){ uni(idx[t],idx[t+1]); uni(idx[t],idx[t+2]); }
    const size=new Map();
    for(let t=0;t<idx.length;t+=3){ const r=find(idx[t]);
      size.set(r,(size.get(r)||0)+1); }
    let best=-1,bs=0;
    for(const e of size) if(e[1]>bs){ bs=e[1]; best=e[0]; }
    const keep=[];
    for(let t=0;t<idx.length;t+=3)
      if(find(idx[t])===best) keep.push(idx[t],idx[t+1],idx[t+2]);
    const remap=new Int32Array(NVv).fill(-1); const P2=[];
    for(let t=0;t<keep.length;t++){ const v=keep[t];
      if(remap[v]<0){ remap[v]=P2.length/3;
        P2.push(S.P[v*3],S.P[v*3+1],S.P[v*3+2]); }
      keep[t]=remap[v]; }
    return {P:new Float64Array(P2), idx:keep, NV:P2.length/3};
  }

  /* ---- normals from the field, plus the lumps of bone ---- */
  const BUMP_F=150, BUMP_A=LO?0.00015:0.00024;   /* v3: finer, quieter lumps */
  async function shade(FN,GFN,P,NV,darkFn){
    const NR=new Float32Array(NV*3);
    const AO=new Float32Array(NV);
    const DK=new Float32Array(NV);
    for(let a=0;a<NV;a++){
      const x=P[a*3],y=P[a*3+1],z=P[a*3+2];
      GFN(x,y,z,H*0.16);
      let nx=_g[0],ny=_g[1],nz=_g[2];
      /* the lumps: one noise, displacing along the normal, with the normal
         corrected by that same noise's tangential gradient — no faceting */
      const e=0.0016;
      const h0=fb3(x*BUMP_F,y*BUMP_F,z*BUMP_F,3);
      const hx=fb3((x+e)*BUMP_F,y*BUMP_F,z*BUMP_F,3);
      const hy=fb3(x*BUMP_F,(y+e)*BUMP_F,z*BUMP_F,3);
      const hz=fb3(x*BUMP_F,y*BUMP_F,(z+e)*BUMP_F,3);
      let gx=(hx-h0)/e,gy=(hy-h0)/e,gz=(hz-h0)/e;
      const dn=gx*nx+gy*ny+gz*nz;
      gx-=nx*dn; gy-=ny*dn; gz-=nz*dn;
      const amp=BUMP_A;
      nx-=gx*amp*2.6; ny-=gy*amp*2.6; nz-=gz*amp*2.6;
      const L=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
      NR[a*3]=nx/L; NR[a*3+1]=ny/L; NR[a*3+2]=nz/L;
      const dsp=(h0-0.5)*2*amp;
      P[a*3]=x+_g[0]*dsp; P[a*3+1]=y+_g[1]*dsp; P[a*3+2]=z+_g[2]*dsp;
      /* five-tap field occlusion */
      let occ=0,sca=1;
      for(let s=1;s<=5;s++){
        const hh=0.0022*s*s*0.42;
        occ+=(hh-FN(x+_g[0]*hh,y+_g[1]*hh,z+_g[2]*hh))*sca; sca*=0.70;
      }
      AO[a]=cl(1-1.30*occ,0,1);
      DK[a]=darkFn?darkFn(x,y,z):9;
      if((a&8191)===8191) await yieldTick();
    }
    return {NR,AO,DK};
  }

  /* v2 culled the chamber's inner wall because no ray could reach it —
     the socket was the only door. v3 KEEPS it: the x-ray brow makes the
     inside a room you are meant to look into, so the vault's inner
     surface (painted cavity-dark by insideDark) is now part of the show.
     the tris it costs are the price of the window. */
  const CR=keepMain(await polygonise(field,fieldGrad,0.0880,-0.0130,0.2350,-0.1215,0.1055,null));
  const SHC=await shade(field,fieldGrad,CR.P,CR.NV,insideDark);
  const JW=keepMain(await polygonise(fieldJ,fieldGradJ,0.0680,-0.0130,0.1080,-0.0520,0.0940,null));
  const JSH=await shade(fieldJ,fieldGradJ,JW.P,JW.NV,null);

  /* ================= the ear, built once ================= */
  const HE=LO?0.0017:0.0012;
  const EARB=keepMain(await polyBox(fieldEar,gradEar,HE,
    -0.0115,0.0250,-0.0355,0.0355,-0.0305,0.0220));

  /* skin is not bone: the relief is far finer and far shallower, and it
     wants no five-tap crevice darkening as heavy as the bone's. its own
     small pass. */
  async function shadeEar(P2,NVe){
    const NR2=new Float32Array(NVe*3), AO2=new Float32Array(NVe);
    const SF=520, SA=0.000075, e=0.00045;
    for(let a=0;a<NVe;a++){
      const x=P2[a*3],y=P2[a*3+1],z=P2[a*3+2];
      gradEar(x,y,z,HE*0.16);
      let nx=_g[0],ny=_g[1],nz=_g[2];
      const gx0=_g[0],gy0=_g[1],gz0=_g[2];
      const h0=fb3(x*SF,y*SF,z*SF,3);
      let gx=(fb3((x+e)*SF,y*SF,z*SF,3)-h0)/e;
      let gy=(fb3(x*SF,(y+e)*SF,z*SF,3)-h0)/e;
      let gz=(fb3(x*SF,y*SF,(z+e)*SF,3)-h0)/e;
      const dn=gx*nx+gy*ny+gz*nz;
      gx-=nx*dn; gy-=ny*dn; gz-=nz*dn;
      nx-=gx*SA*2.2; ny-=gy*SA*2.2; nz-=gz*SA*2.2;
      const L=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
      NR2[a*3]=nx/L; NR2[a*3+1]=ny/L; NR2[a*3+2]=nz/L;
      const dsp=(h0-0.5)*2*SA;
      P2[a*3]=x+gx0*dsp; P2[a*3+1]=y+gy0*dsp; P2[a*3+2]=z+gz0*dsp;
      let occ=0,sca=1;
      for(let s2=1;s2<=5;s2++){
        const hh=0.0016*s2*s2*0.42;
        occ+=(hh-fieldEar(x+gx0*hh,y+gy0*hh,z+gz0*hh))*sca; sca*=0.70;
      }
      AO2[a]=cl(1-1.15*occ,0,1);
      if((a&4095)===4095) await yieldTick();
    }
    return {NR:NR2,AO:AO2};
  }
  const EARS=await shadeEar(EARB.P,EARB.NV);

  /* the skin. no transmission pass is allowed here (the block pays for
     no render targets), so the light that goes THROUGH an ear is
     painted: the helix rim and the lobule are 2 mm of blood-rich flesh
     and they go warm and red; the concha floor sits on bone and goes
     pale and slightly yellow; the hollows carry their own occlusion,
     and a fine capillary mottle runs over the lot.

     EVERY NUMBER HERE IS LINEAR, not sRGB. the bone's ivory is
     0.76/0.74/0.71 and reads as ivory because it is nearly grey; skin
     is not, and a plausible-looking sRGB triple written straight into
     the colour attribute comes out bleached — the first ear rendered
     as a white blob and it was read as blown specular for an hour.
     sRGB 228/172/150 is LINEAR 0.776/0.413/0.305, and that is what
     goes in. */
  async function colorEar(P2,NVe,AO2){
    const CO2=new Float32Array(NVe*3);
    for(let a=0;a<NVe;a++){
      const x=P2[a*3],u=P2[a*3+1],v=P2[a*3+2];
      const ao=AO2[a];
      const rim=sdPoly2(u,v,ERIM);
      /* how thin the flesh is here: rim and lobe are lit through */
      const thin=cl(ss(-0.0075,-0.0008,rim)+ss(-0.0130,-0.0250,u)*0.85,0,1);
      const mot=fb3(x*150+2.7,u*150,v*150,3);
      const cap=fb3(x*430,u*430+1.3,v*430,2);
      /* v8 — 'the ear more pink': the old base (linear .672/.382/.312,
         sRGB 214/167/152) was an honest tan and the room's blue rig
         dragged it to mauve, so v8 went ROSE (.800/.375/.390 — blue
         up near the green). v9 — 'more natural, like a pink orange':

     a moon high to the right where the key light stands, a cold blue
     glow opposite where the rim light stands, a breath of horizon, a
     scatter of stars — and the glass materials sample it along the

     no PMREM, nothing the room must pay for — so 'photoreal skin' is
     bought with a bake and a sheen: a fine dermal grain in the albedo,
     a pore normal, a roughness that breaks up the specular, and
     MeshPhysical's sheen standing in for the peach fuzz that makes an
     ear read as flesh at grazing angles. its own prng stream, seeded
     SEED^0x8B3D, so the main rr() is untouched and every downstream
     bake stays bit-identical to v6. */
  function bakeSkin(){
    const N=LO?256:512;
    let ss2=((SEED^0x8B3D)>>>0)||1;
    const rs=()=>{ ss2|=0; ss2=ss2+0x6D2B79F5|0;
      let t=Math.imul(ss2^ss2>>>15,1|ss2);
      t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

    for(let i=0;i<(LO?260:620);i++){
      const x=rs()*N, y=rs()*N, r=(3+rs()*26)*(N/512);
      const g2=ga.createRadialGradient(x,y,0,x,y,r);
      const w=0.030+rs()*0.055;
      if(rs()<0.5) g2.addColorStop(0,'rgba(214,150,132,'+w+')');
      else         g2.addColorStop(0,'rgba(255,238,226,'+w+')');
      g2.addColorStop(1,'rgba(255,255,255,0)');
      ga.fillStyle=g2; ga.beginPath(); ga.arc(x,y,r,0,Math.PI*2); ga.fill();
    }

    const cn=kv(N,N), gn=cn.getContext('2d');

      const x=rs()*N, y=rs()*N, r=(0.9+rs()*1.9)*(N/512);
      const d=rs()<0.24?1:-1;
      const g2=ga.createRadialGradient(x,y,0,x,y,r);
      g2.addColorStop(0,d>0?'rgba(255,244,236,0.16)':'rgba(196,142,126,0.20)');
      g2.addColorStop(1,'rgba(255,255,255,0)');
      ga.fillStyle=g2; ga.beginPath(); ga.arc(x,y,r,0,Math.PI*2); ga.fill();
      const xi=x|0, yi=y|0, ri=Math.ceil(r);
      for(let dy=-ri;dy<=ri;dy++) for(let dx=-ri;dx<=ri;dx++){
        const q=Math.sqrt(dx*dx+dy*dy)/r; if(q>1) continue;
        const px=((xi+dx)%N+N)%N, py=((yi+dy)%N+N)%N;
        HT[py*N+px]-=d*0.16*(1-q)*(1-q);

    for(let i=0;i<(LO?420:1500);i++){
      const x=rs()*N, y=rs()*N, a2=rs()*Math.PI*2, L=(4+rs()*20)*(N/512);
      const x2=x+Math.cos(a2)*L, y2=y+Math.sin(a2)*L;

      ga.lineWidth=(0.5+rs()*0.8)*(N/512);
      ga.beginPath(); ga.moveTo(x,y); ga.lineTo(x2,y2); ga.stroke();
      const st=Math.ceil(L);
      for(let s2=0;s2<=st;s2++){
        const px=(((x+(x2-x)*s2/st)|0)%N+N)%N, py=(((y+(y2-y)*s2/st)|0)%N+N)%N;
        HT[py*N+px]-=0.055;

       rougher in the creases the way skin is */
    const nd=gn.createImageData(N,N), cr=kv(N,N), gr2=cr.getContext('2d');
    const rd=gr2.createImageData(N,N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const i=(y*N+x)*4;
      const hL=HT[y*N+((x-1+N)%N)], hR=HT[y*N+((x+1)%N)];
      const hD=HT[((y-1+N)%N)*N+x], hU=HT[((y+1)%N)*N+x];
      /* the height field is an ACCUMULATION — thousands of pores and
         lines land on the same texel and it runs to several units deep.
         taken raw into a normal it lays every normal nearly flat and the
         ear renders as violent black-and-white mottle (it did, first
         build). so: bounded, and gently sloped. */
      let nx=cl(hL-hR,-1.6,1.6)*0.42, ny=cl(hD-hU,-1.6,1.6)*0.42, nz=1;
      const L=Math.sqrt(nx*nx+ny*ny+1)||1;

  function toGeo(pos,nor,col,ind,tile){
    const nf=ind.length/3;
    const axis=new Int8Array(nf);
    for(let f=0;f<nf;f++){
      const a=ind[f*3],b=ind[f*3+1],c=ind[f*3+2];
      const ux=pos[b*3]-pos[a*3],uy=pos[b*3+1]-pos[a*3+1],uz=pos[b*3+2]-pos[a*3+2];
      const vx2=pos[c*3]-pos[a*3],vy2=pos[c*3+1]-pos[a*3+1],vz2=pos[c*3+2]-pos[a*3+2];
      const nx=Math.abs(uy*vz2-uz*vy2),ny=Math.abs(uz*vx2-ux*vz2),nz=Math.abs(ux*vy2-uy*vx2);
      axis[f]=(nx>=ny&&nx>=nz)?0:((ny>=nz)?1:2);
    }
    const own=new Int8Array(pos.length/3).fill(-1);
    const outP=[],outN=[],outC=[],outU=[],outI=[];
    const map=new Int32Array(pos.length/3).fill(-1);
    const push=(v,axv)=>{
      const x=pos[v*3],y=pos[v*3+1],z=pos[v*3+2];
      const u=(axv===0?z:x)/tile, w=(axv===1?z:y)/tile;
      const k=outP.length/3;
      outP.push(x,y,z); outN.push(nor[v*3],nor[v*3+1],nor[v*3+2]);
      outC.push(col[v*3],col[v*3+1],col[v*3+2]); outU.push(u,w);
      return k;
    };
    for(let f=0;f<nf;f++){
      const axv=axis[f];
      for(let e=0;e<3;e++){
        const v=ind[f*3+e];
        if(own[v]===-1){ own[v]=axv; map[v]=push(v,axv); outI.push(map[v]); }
        else if(own[v]===axv) outI.push(map[v]);
        else outI.push(push(v,axv));    /* a seam vertex, given its own copy */
      }
    }
    const g=new T.BufferGeometry();
    g.setAttribute('position',new T.Float32BufferAttribute(outP,3));
    g.setAttribute('normal',new T.Float32BufferAttribute(outN,3));
    g.setAttribute('color',new T.Float32BufferAttribute(outC,3));
    g.setAttribute('uv',new T.Float32BufferAttribute(outU,2));
    g.setIndex(outI);
    return g;

     ninth pass): 'instead of rectangle window, should be just eyeball
     in skull.' the RECTANGLE was the fourth outbreak of the one
     disease, and the v9 walk had already met it: the strip above the
     nose pass's y 129 bound (|x| < 52, midline-forward) was left
     single ON PURPOSE then, because pushing the bound to 146 'paved
     bone over the socket dish's recess and flattened the socket' —
     which was a bug in v9 and is THE INSTRUCTION now. the whole
     midline-forward exclusion above the nose zone is doubled: the
     brow, the dish apron, the socket surround, the forelobe — every
     pale inward-wound sheet the front view fell through — so the
     face round the eye is honest mottled bone and the 'window' is
     gone. the v9 socket dish goes with it, sanctioned: what remains
     round the ball is the bore mouth and mPlug's own shadow — the
     socket, a breath bigger than the eye. bounds meet the v6 pass at
     |x| 52 / z −32 exactly and the v9 pass at y 129; pale-only,
     same confidence, every twin to the GLASS piece, per the law. */
  {
    const dup4=[];
    for(const IX of [idxR,idxF])
    for(let t=0;t<IX.length;t+=3){
      const a=IX[t]*3,b=IX[t+1]*3,c=IX[t+2]*3;
      const mx2=Math.abs(P[a]+P[b]+P[c])/3, my2=(P[a+1]+P[b+1]+P[c+1])/3,
            mz2=(P[a+2]+P[b+2]+P[c+2])/3;
      if(mx2>=0.052||my2<=0.129||mz2<=-0.032) continue;
      if((CO[a]+CO[b]+CO[c])/3<0.45) continue;
      const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2];
      const vx=P[c]-P[a],vy=P[c+1]-P[a+1],vz=P[c+2]-P[a+2];
      const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
      const sx=NR[a]+NR[b]+NR[c], sy=NR[a+1]+NR[b+1]+NR[c+1],
            sz=NR[a+2]+NR[b+2]+NR[c+2];
      const nl=Math.sqrt(nx*nx+ny*ny+nz*nz), sl=Math.sqrt(sx*sx+sy*sy+sz*sz);
      if(nl<1e-12||sl<1e-9) continue;
      if((nx*sx+ny*sy+nz*sz)/(nl*sl)<-0.26)
        dup4.push(IX[t],IX[t+2],IX[t+1]);
    }
    for(const v2 of dup4) idxF.push(v2);
  }
  /* v8: THE FUNNEL BEHIND THE EYE, TAKEN OUT — the artist's mark, third
     time round ('a funnel appears behind the eye that was supposed to
     be removed'). v6 closed the TEMPLE sightline; what remained is the
     SOCKET's own: the bore tube and the dish sheets around it are
     cavity-adjacent, so they ride the interior piece, and the DK rule
     spares them dark on purpose (v3) — so they stand PALE, and from
     any quarter angle the camera looks past the thinned ball (v6) down
     a bright cone. hiding the whole interior on the shot rig proved
     the outer skin and the v6 twins carry every one of those
     sightlines — front and quarter both close clean, no void round
     the ball. so the pale funnel sheets are DELETED, not darkened:
     darkening them would ring the floating eye in black, which is v2's
     black-hole eye come back. the cull is pale-only (the nasal walls,
     canal walls and chamber dark keep their sheets and their
     invisibility) and region-bound: a 42 mm tube round the eye axis,
     forward of z 26 mm. the same cull walks idxF for the tube's OWN
     wall tris (the split scatters bore wall between inner and front
     piece as DK crosses 0.0035) — but only STRICTLY inside the tube
     (r < 20.5 mm, z < 100 mm), never the mouth rim, so the face keeps
     every skin triangle it shows.
     second cut: the wholesale cull left the mouth ring UNBACKED — a
     hard black circle round the ball from dead front, the crescent
     worst below (the first try's own black-hole eye). keeping the
     tube's own deep walls as backdrop half-worked and left their cut
     edge jagged beside the ball. so the cull IS wholesale, and the
     backdrop is BUILT instead: mPlug below, a lathed socket floor
     seated behind the ball, wearing matInner so it fades with the
     interior under the x-ray exactly as the sheets it replaces did.
     past its throat the dark still falls away, which is canon —
     'one hole in and one hole out and it is stoppered by my eye.' */
  {
    const cull=(IX,pred)=>{
      const keep=[];
      for(let t=0;t<IX.length;t+=3){
        const a=IX[t]*3,b=IX[t+1]*3,c=IX[t+2]*3;
        const mx3=(P[a]+P[b]+P[c])/3, my3=(P[a+1]+P[b+1]+P[c+1])/3,
              mz3=(P[a+2]+P[b+2]+P[c+2])/3;
        if(((CO[a]+CO[b]+CO[c])/3>=0.45)&&pred(mx3,my3,mz3,
            mx3*mx3+(my3-EYE_Y)*(my3-EYE_Y))) continue;
        keep.push(IX[t],IX[t+1],IX[t+2]);
      }
      IX.length=0; for(const v2 of keep) IX.push(v2);
    };
    /* the dish and the tube, wholesale */
    cull(idxI,(x,y,z,r2)=>z>0.026&&r2<0.042*0.042);
    /* the tube's strays in the front piece — rim (z ≥ 100 mm) untouched.
       v11: radius follows isBore down to 19.0, inside the widened mouth */
    cull(idxF,(x,y,z,r2)=>z>0.030&&z<0.100&&r2<0.0190*0.0190);
  }
  const skullGeo=toGeo(P,NR,CO,idxR,0.050);
  await yieldTick();
  const frontGeo=toGeo(P,NR,CO,idxF,0.050);
  await yieldTick();
  const innerGeo=toGeo(P,NR,CO,idxI,0.050);
  await yieldTick();
  /* v4: the jaw splits like the cranium — chin and front body go glass
     with the x-ray (the artist's 'front more x-ray'), rami and angles
     keep their bone. same material at rest; no seam until asked. */
  const inFrontJ=(x,y,z)=>(z>0.0100);
  const idxJF=[],idxJR=[];
  for(let t=0;t<JW.idx.length;t+=3){
    const a=JW.idx[t]*3,b=JW.idx[t+1]*3,c=JW.idx[t+2]*3;
    (inFrontJ((JW.P[a]+JW.P[b]+JW.P[c])/3,
      (JW.P[a+1]+JW.P[b+1]+JW.P[c+1])/3,
      (JW.P[a+2]+JW.P[b+2]+JW.P[c+2])/3)?idxJF:idxJR)
      .push(JW.idx[t],JW.idx[t+1],JW.idx[t+2]);
  }
  const jawGeo=toGeo(JW.P,JSH.NR,COJ,idxJR,0.050);
  await yieldTick();
  const jawGeoF=toGeo(JW.P,JSH.NR,COJ,idxJF,0.050);
  await yieldTick();

  /* ================= the teeth =================
     thirty-two crowns on tapering roots, cusped by class: a blade for the
     incisors, one point for the canines, two for the premolars, four for
     the molars. the gums are long gone — every root stands exposed and
     stained, the lowers worse than the uppers. */
  const tP=[],tC=[],tI=[];
  const TU=[
    [0.0044,0.0805,0.0086,0.0072,0.0122,0.0543,0],
    [0.0118,0.0790,0.0068,0.0064,0.0108,0.0557,0],
    [0.0188,0.0742,0.0078,0.0080,0.0125,0.0540,1],
    [0.0245,0.0660,0.0070,0.0092,0.0092,0.0573,2],
    [0.0278,0.0538,0.0068,0.0092,0.0088,0.0577,2],
    [0.0292,0.0400,0.0105,0.0112,0.0082,0.0583,3],
    [0.0292,0.0262,0.0100,0.0110,0.0078,0.0587,3],
    [0.0278,0.0130,0.0090,0.0100,0.0072,0.0593,3]];
  const TL=[
    [0.0028,0.0778,0.0055,0.0060,0.0092,0.0508,0],
    [0.0085,0.0765,0.0060,0.0064,0.0098,0.0512,0],
    [0.0150,0.0722,0.0069,0.0078,0.0118,0.0506,1],
    [0.0208,0.0642,0.0072,0.0082,0.0090,0.0528,2],
    [0.0242,0.0522,0.0074,0.0086,0.0086,0.0534,2],
    [0.0268,0.0388,0.0112,0.0104,0.0080,0.0540,3],
    [0.0272,0.0250,0.0106,0.0100,0.0076,0.0548,3],
    [0.0262,0.0118,0.0096,0.0094,0.0070,0.0556,3]];
  /* v3 — 'teeth in more': the arch tucks toward the midline and pulls
     back, the crowns narrow a hair. heights stay; the 3.5 mm rest gap
     is untouched. */
  for(const TT of [TU,TL]) for(const t2 of TT){
    t2[0]*=0.90; t2[1]*=0.97; t2[2]*=0.955; t2[3]*=0.965; }
  const AA=LO?8:12, RG=7;
  function tooth(cx,cz,w,bl,hc,tipY,kind,up,side,dark,chip){
    /* v4: the hidden root is a NEEDLE now — barely exposed at the
       margin, tapering to a hair's point deep in the bone, so under
       the x-ray glass the arcades hang on pins of it */
    const root=hc*(up?1.26:1.36), expo=up?0.0005:0.0009;
    const gum=up?(tipY+hc):(tipY-hc);
    const sgn=up?1:-1;
    const e=[0.86,0.80,0.70,0.60][kind];
    const yaw=R(-0.08,0.08), lean=R(-0.028,0.028);
    const cy=Math.cos(yaw),sy2=Math.sin(yaw);
    const base=tP.length/3;
    const ring=[];
    for(let r2=0;r2<=RG;r2++){
      const t=r2/RG;
      let yy,sc;
      if(t<0.42){ const q=t/0.42; yy=gum+sgn*(root+expo)*(1-q);
        sc=0.040+0.960*q*q*Math.sqrt(q); }   /* v4: needle taper */
      else { const q=(t-0.42)/0.58; yy=gum-sgn*hc*q;
        sc=1.0-0.055*q-0.20*q*q*q*(kind===1?3.4:1.0); }
      if(chip&&t>0.86) sc*=0.86;
      ring.push([yy,sc,t]);
    }
    for(let r2=0;r2<=RG;r2++){
      const [yy,sc,t]=ring[r2];
      for(let a2=0;a2<AA;a2++){
        const th=a2/AA*Math.PI*2;
        const ct=Math.cos(th),st=Math.sin(th);
        let lx=(w*0.5)*sc*Math.sign(ct)*Math.pow(Math.abs(ct),e);
        let lz=(bl*0.5)*sc*Math.sign(st)*Math.pow(Math.abs(st),e);
        if(kind===0&&t>0.60){ const q=(t-0.60)/0.40; lz*=1-0.58*q; lx*=1+0.02*q; }
        let dy=0;
        if(t>0.985){
          if(kind===3) dy=sgn*0.0011*Math.abs(Math.cos(2*th));
          else if(kind===2) dy=sgn*0.0012*Math.abs(st);
          else if(kind===0) dy=sgn*0.0004*Math.abs(ct);
        }
        const rx2=lx*cy-lz*sy2, rz2=lx*sy2+lz*cy;
        const px=cx*side+rx2+ (yy-gum)*lean*side;
        const pz=cz+rz2;
        tP.push(px,yy+dy,pz);
        /* enamel at the crown, root darker and browner, gumline worst */
        let cr,cg,cb;
        if(t<0.42){ const q=t/0.42;
          cr=0.470+0.090*q; cg=0.396+0.078*q; cb=0.300+0.062*q; }
        else { const q=(t-0.42)/0.58;
          cr=0.545+0.330*q; cg=0.512+0.320*q; cb=0.452+0.300*q; }
        const jt=(vn3(px*300,yy*300,pz*300)-0.5)*0.075;
        cr+=jt; cg+=jt*0.98; cb+=jt*0.92;
        if(dark){ cr*=0.60; cg*=0.545; cb*=0.470; }
        tC.push(cl(cr,0,1),cl(cg,0,1),cl(cb,0,1));
      }
    }
    for(let r2=0;r2<RG;r2++)for(let a2=0;a2<AA;a2++){
      const a3=base+r2*AA+a2, b3=base+r2*AA+(a2+1)%AA;
      const c3=base+(r2+1)*AA+(a2+1)%AA, d3=base+(r2+1)*AA+a2;
      if(up){ tI.push(a3,b3,c3, a3,c3,d3); } else { tI.push(a3,c3,b3, a3,d3,c3); }
    }
    /* the occlusal cap */
    const capC=tP.length/3;
    const ty2=ring[RG][0];
    tP.push(cx*side+(ty2-gum)*lean*side, ty2+sgn*(kind===3?0.0004:0.0006), cz);
    const cc=dark?0.44:0.80; tC.push(cc,cc*0.965,cc*0.905);
    const last=base+RG*AA;
    for(let a2=0;a2<AA;a2++){
      const a3=last+a2, b3=last+(a2+1)%AA;
      if(up) tI.push(a3,capC,b3); else tI.push(a3,b3,capC);
    }
  }
  /* uppers stay with the cranium; lowers ride the jaw. same teeth, same
     jitters (n keeps counting through), two geometries now. */
  function buildTeethGeo(){
    const g2=new T.BufferGeometry();
    g2.setAttribute('position',new T.Float32BufferAttribute(tP.slice(),3));
    g2.setAttribute('color',new T.Float32BufferAttribute(tC.slice(),3));
    g2.setIndex(tI.slice());
    g2.computeVertexNormals();
    return g2;
  }
  {
    let n=0;
    for(const s of [1,-1]) for(const t of TU){
      tooth(t[0],t[1],t[2],t[3],t[4],t[5],t[6],true,s,(n===3||n===13),(n===0));
      n++; }
  }
  const teethGeoU=buildTeethGeo();
  tP.length=0; tC.length=0; tI.length=0;
  {
    let n=16;
    for(const s of [1,-1]) for(const t of TL){
      tooth(t[0],t[1],t[2],t[3],t[4],t[5],t[6],false,s,(n===19),false);
      n++; }
  }
  const teethGeoL=buildTeethGeo();

  /* the sutures split at the same occiput seam as the bone: nearly all
     of them ride the glass region now and fade as it clears — and the
     rear ribbons dim with them, so nothing floats on the glass anywhere */
  const sP=[[],[]],sN2=[[],[]],sC2=[[],[]];
  for(let v=0;v<rP.length/3;v+=6){
    const g2=inFront(rP[v*3],rP[v*3+1],rP[v*3+2])?0:1;
    for(let e=0;e<6;e++){ const o=(v+e)*3;
      sP[g2].push(rP[o],rP[o+1],rP[o+2]);
      sN2[g2].push(rN[o],rN[o+1],rN[o+2]);
      sC2[g2].push(rC[o],rC[o+1],rC[o+2]); }
  }
  function sutG(i2){ const g3=new T.BufferGeometry();
    g3.setAttribute('position',new T.Float32BufferAttribute(sP[i2],3));
    g3.setAttribute('normal',new T.Float32BufferAttribute(sN2[i2],3));
    g3.setAttribute('color',new T.Float32BufferAttribute(sC2[i2],3));
    return g3; }
  const sutGeoF=sutG(0), sutGeo=sutG(1);

  /* ---- lean it back on its jaw, then set it down on y = 0 ---- */
  const TILT=(function(){ const m=SRCH.match(/[?&]tilt=([0-9.]+)/);
    return m?parseFloat(m[1]):0.10; })();
  const MX=new T.Matrix4().makeRotationX(-TILT);
  const ALLG=[skullGeo,frontGeo,innerGeo,jawGeo,jawGeoF,teethGeoU,teethGeoL,sutGeo,sutGeoF];
  for(const g of ALLG) g.applyMatrix4(MX);
  let minY=1e9;
  for(const g of ALLG){
    g.computeBoundingBox();
    if(g.boundingBox.min.y<minY) minY=g.boundingBox.min.y;
  }
  for(const g of ALLG){ g.translate(0,-minY,0); g.computeBoundingSphere(); }
  const xf=(x,y,z)=>{ const v=new T.Vector3(x,y,z).applyMatrix4(MX); v.y-=minY; return v; };
  const EYE=xf(0,EYE_Y,EYE_Z);
  /* the hinge: the condyles' own axis, so the jaw geometry moves to pivot
     space and hangs from a group planted there */
  const JPIV=xf(0,0.0930,-0.0300);
  jawGeo.translate(-JPIV.x,-JPIV.y,-JPIV.z);
  jawGeoF.translate(-JPIV.x,-JPIV.y,-JPIV.z);
  teethGeoL.translate(-JPIV.x,-JPIV.y,-JPIV.z);
  jawGeo.computeBoundingSphere(); jawGeoF.computeBoundingSphere();
  teethGeoL.computeBoundingSphere();

  /* ================= planting the pinna (v7) =================
     the ear is built ONCE in its own frame and planted TWICE — right
     and left — because the artist asked for one ear, on the phone's
     side, with the side switchable at runtime. the left is the right
     mirrored in x with its winding reversed; mirroring commutes with
     the skull's lean (a rotation about x) and with the drop to y=0 (a
     translation in y), so it can be done last, on finished vertices.
     only one is ever visible, so the draw cost is one ear. */
  /* THE ONE NUMBER THE ARTIST WILL WANT: how large the pinna stands.
     1.00 is anatomy — a 59 mm ear on a 226 mm skull, and beside this
     cranium it reads small and easy to miss. the mockup draws it far
     larger because the ear is the SUBJECT of the instruction, not
     scenery. 1.18 is the compromise standing here: 70 mm, unmistakable
     at a glance, still hung on its own true canal. */
  const EAR_S    =1.18;
  const EAR_LEAN =-0.26;                /* its top leans back */
  const EAR_FLARE=-0.38;                /* its back edge stands off the head */
  const EAR_ROLL = 0.05;
  /* the meatus, on the bone. EAR_LIFT is the other dial: this skull's
     canal sits LOW (v4 bored it at y 94.5 mm on a 226 mm cranium), so a
     pinna hung honestly on it reads as hanging off the jaw. a centimetre
     up and it sits on the temporal squama the way the artist drew it,
     and the bore still opens on the canal. set it to 0 for anatomy. */
  const EAR_LIFT =0.0105;
  const EAR_OUT  =0.0046;               /* and out, so the lift clears the vault */
  const EAR_AT   =[0.0602+EAR_OUT, TRGY-0.0012+EAR_LIFT, TRGZ-0.0022];
  const MEAR=new T.Matrix4()
    .makeTranslation(EAR_AT[0],EAR_AT[1],EAR_AT[2])
    .multiply(new T.Matrix4().makeRotationY(EAR_FLARE))
    .multiply(new T.Matrix4().makeRotationX(EAR_LEAN))
    .multiply(new T.Matrix4().makeRotationZ(EAR_ROLL))
    .multiply(new T.Matrix4().makeScale(EAR_S,EAR_S,EAR_S));
  const MEARW=new T.Matrix4().multiplyMatrices(MX,MEAR);
  const earPos=new Float32Array(EARB.NV*3), earNor=new Float32Array(EARB.NV*3);
  {
    const _v=new T.Vector3();
    for(let a=0;a<EARB.NV;a++){
      _v.set(EARB.P[a*3],EARB.P[a*3+1],EARB.P[a*3+2]).applyMatrix4(MEARW);
      earPos[a*3]=_v.x; earPos[a*3+1]=_v.y-minY; earPos[a*3+2]=_v.z;
      _v.set(EARS.NR[a*3],EARS.NR[a*3+1],EARS.NR[a*3+2]).transformDirection(MEARW);
      earNor[a*3]=_v.x; earNor[a*3+1]=_v.y; earNor[a*3+2]=_v.z;
    }
  }
  const earIdxR=EARB.idx;
  const earIdxL=earIdxR.slice();
  for(let t=0;t<earIdxL.length;t+=3){
    const q=earIdxL[t+1]; earIdxL[t+1]=earIdxL[t+2]; earIdxL[t+2]=q; }
  function mirrorX(P2){
    const Q=new Float32Array(P2.length);
    for(let a=0;a<P2.length;a+=3){ Q[a]=-P2[a]; Q[a+1]=P2[a+1]; Q[a+2]=P2[a+2]; }
    return Q;
  }
  const earPosL=mirrorX(earPos), earNorL=mirrorX(earNor);
  /* the pore tile is small — 20 mm, against the bone's 50 — or skin
     reads as polished stone */
  const earGeoR=toGeo(earPos ,earNor ,EARCO,earIdxR,0.020);
  const earGeoL=toGeo(earPosL,earNorL,EARCO,earIdxL,0.020);
  /* the same ear in bone, for the x-ray skin. toGeo splits the same
     seams from the same input every time, so the two runs agree vertex
     for vertex and the heavy buffers are SHARED — only the colour
     array is new. */
  function boneTwin(g,pos,nor,ix){
    const gx=new T.BufferGeometry();
    const gb=toGeo(pos,nor,EARCX,ix,0.020);
    gx.setAttribute('position',g.getAttribute('position'));
    gx.setAttribute('normal',  g.getAttribute('normal'));
    gx.setAttribute('uv',      g.getAttribute('uv'));
    gx.setAttribute('color',   gb.getAttribute('color'));
    gx.setIndex(g.getIndex());
    gb.dispose();
    return gx;
  }
  const earGeoRX=boneTwin(earGeoR,earPos ,earNor ,earIdxR);
  const earGeoLX=boneTwin(earGeoL,earPosL,earNorL,earIdxL);
  for(const g of [earGeoR,earGeoL,earGeoRX,earGeoLX]) g.computeBoundingSphere();
  /* THE TRAGUS, in the world: the place the phone's speaker seats and
     the ripples land. and the ear's own outward, to stand the phone off
     it by a hair. */
  const ETRGR=new T.Vector3(ETRG[0],ETRG[1],ETRG[2]).applyMatrix4(MEARW);
  ETRGR.y-=minY;
  const ETRGL=new T.Vector3(-ETRGR.x,ETRGR.y,ETRGR.z);
  const ELATR=new T.Vector3(1,0,0).transformDirection(MEARW).normalize();
  const ELATL=new T.Vector3(-ELATR.x,ELATR.y,ELATR.z);

  /* ================= materials, meshes ================= */
  const matBone=new T.MeshStandardMaterial({
    color:0xffffff, vertexColors:true, map:BONE.a, roughnessMap:BONE.r,
    normalMap:BONE.n, normalScale:new T.Vector2(0.52,0.52),
    roughness:0.96, metalness:0.0,
    /* the blue the skull owns: a whisper of emissive that breathes with
       the harmonics and rises when it talks. never gold. */
    emissive:new T.Color(0x35528a), emissiveIntensity:0.05 });
  /* the glass-capable copies (v4): PHYSICAL materials now — a wet
     clearcoat, true ior and a whisper of iridescence are what make the
     x-ray read as REAL CLEAR GLASS instead of faded bone. at rest they
     render identical to matBone, so the seams do not exist until asked.
     the tiny non-zero clearcoat/iridescence keep the shader graph
     stable — no recompile hitch mid-fade. */
  function mkGlassBone(){
    return new T.MeshPhysicalMaterial({
      color:0xffffff, vertexColors:true, map:BONE.a, roughnessMap:BONE.r,
      normalMap:BONE.n, normalScale:new T.Vector2(0.52,0.52),
      roughness:0.96, metalness:0.0, ior:1.5,
      clearcoat:0.001, clearcoatRoughness:0.10,
      iridescence:0.001, iridescenceIOR:1.32,
      emissive:new T.Color(0x35528a), emissiveIntensity:0.05 });
  }
  const matBoneF=mkGlassBone(), matJawF=mkGlassBone(), matJawR=mkGlassBone();
  const GLS=[matBoneF];
  /* v5: the JAW IS PORCELAIN — the artist's mark, 4 aug: 'translucent
     even at opaque mode, and much more delicate'. both jaw parts are
     translucent bone-china at rest (the needle roots show through the
     body of it, the moon finds a wet glint on it) and they ride to
     full clear glass with the x-ray, whole — no more opaque chunk at
     the angle. the rear jaw can no longer share matBone: the occiput
     must stay honest bone, so the jaw owns its materials now. */
  const JGL=[matJawR,matJawF];
  for(const m of JGL){ m.transparent=true; m.opacity=0.55;
    m.depthWrite=false; m.side=T.DoubleSide;
    m.roughness=0.42; m.clearcoat=0.38; m.clearcoatRoughness=0.10;
    m.iridescence=0.05; m.normalScale.set(0.42,0.42); }

  const matEarS=new T.MeshPhysicalMaterial({
    color:0xffffff, vertexColors:true, map:SKIN.a, roughnessMap:SKIN.r,
    normalMap:SKIN.n, normalScale:new T.Vector2(0.55,0.55),
    roughness:0.82, metalness:0.0, ior:1.4,
    clearcoat:0.10, clearcoatRoughness:0.60,
    /* NO SHEEN. MeshPhysical's sheen looked like the obvious way to buy
       peach fuzz, and it wrecked the ear: its albedo-scaling term
       divides the diffuse out at grazing angles, so the pinna rendered
       as white arcs on pure black — an hour was spent blaming the
       normal map, the vertex colours and the lights in turn. the warm
       rim is a fresnel node below instead, which is one term and does
       exactly what it is told. */
    transparent:true, opacity:0, depthWrite:true, side:T.DoubleSide,
    emissive:new T.Color(0x511008), emissiveIntensity:0.0 });
  const matPhone=new T.MeshPhysicalMaterial({
    color:0x0a0d12, roughness:0.045, metalness:0.0, ior:1.5,
    clearcoat:1.0, clearcoatRoughness:0.035,
    iridescence:0.18, iridescenceIOR:1.32,
    transparent:true, opacity:0, depthWrite:false, side:T.DoubleSide,
    emissive:new T.Color(0x35528a), emissiveIntensity:0.05 });
  const matEarG=mkGlassBone();
  matEarG.side=T.DoubleSide; matEarG.transparent=true; matEarG.opacity=0;
  /* the interior's own bone material — identical to matBone at rest,
     and it FADES TO NOTHING with the x-ray, so the glass holds no
     funnel, no chamber dome, no bore: the ball floats by itself */
  const matInner=new T.MeshStandardMaterial({
    color:0xffffff, vertexColors:true, map:BONE.a, roughnessMap:BONE.r,
    normalMap:BONE.n, normalScale:new T.Vector2(0.52,0.52),
    roughness:0.96, metalness:0.0,
    emissive:new T.Color(0x35528a), emissiveIntensity:0.05 });
  /* the teeth: half-glass at rest now ('teeth more translucent'),
     clearer still under the x-ray */
  const matTeeth=new T.MeshPhysicalMaterial({
    color:0xffffff, vertexColors:true, roughness:0.30, metalness:0.0,
    transparent:true, opacity:0.80, ior:1.45,
    clearcoat:0.35, clearcoatRoughness:0.22,
    iridescence:0.001, iridescenceIOR:1.30 });
  const matSut=new T.MeshStandardMaterial({
    color:0xffffff, vertexColors:true, roughness:0.94, metalness:0.0,
    transparent:true, opacity:1 });
  const matSutF=new T.MeshStandardMaterial({
    color:0xffffff, vertexColors:true, roughness:0.94, metalness:0.0,
    transparent:true, opacity:1 });
  /* ---- the glimmer (v4): one fresnel node, shared in shape by every
     glass material — the edge-light that lets clear glass be seen at
     all. driven per frame by uniforms; nothing ever recompiles. falls
     back silently to plain emissive if the host passes no TSL. ---- */
  const TSLN=env.TSL||null;
  let uGlim=null,uEmiF=null,uGlimT=null,uGlimE=null;
  let uEnvI=null,uEnvIJ=null,uEnvT=null,uOpB=null,uOpF=null,uOpBJ=null,uOpFJ=null;
  /* v7: the pinna's bone skin and the phone's glass join the same
     family — one fresnel, one read of the baked night — but each keeps
     its OWN opacity pair so the instruction can fade them in and out
     without touching the skull's */
  let uOpBE=null,uOpFE=null,uEnvIE=null,uOpBP=null,uOpFP=null,uEnvIP=null;
  let uEarS=null;
  if(TSLN&&TSLN.uniform&&TSLN.normalView&&TSLN.positionViewDirection){
    /* v5: the fresnel runs on |n·v| now. the double-sided glass was
       handing its BACK faces a full-strength fresnel wash (much of
       the flat 'grey gradient' the artist marked); the absolute value
       gives the far wall the same honest grazing term as the near. */
    const ndv=TSLN.abs?TSLN.abs(TSLN.dot(TSLN.normalView,TSLN.positionViewDirection))
      :TSLN.dot(TSLN.normalView,TSLN.positionViewDirection);
    const fres=(p)=>TSLN.pow(TSLN.oneMinus(TSLN.saturate(ndv)),p);
    uGlim=TSLN.uniform(0); uEmiF=TSLN.uniform(0.05);
    uGlimT=TSLN.uniform(0.02); uGlimE=TSLN.uniform(0.16);
    uEnvI=TSLN.uniform(0); uEnvIJ=TSLN.uniform(0.14); uEnvT=TSLN.uniform(0);
    uOpB=TSLN.uniform(1); uOpF=TSLN.uniform(0);
    uOpBJ=TSLN.uniform(0.60); uOpFJ=TSLN.uniform(0.14);
    uOpBE=TSLN.uniform(0); uOpFE=TSLN.uniform(0); uEnvIE=TSLN.uniform(0);
    uOpBP=TSLN.uniform(0); uOpFP=TSLN.uniform(0); uEnvIP=TSLN.uniform(0);
    uEarS=TSLN.uniform(0);
    /* the night in the glass: sample the baked equirect along the true
       reflection vector, weighted the way dielectrics are — 4% face
       on, everything at grazing (schlick, ior 1.5). no PMREM, no
       render target, no transmission pass: one texture read in the
       node, identical under both backends. and the reflection
       SOLIDIFIES the glass where it lands — opacity rises with the
       reflected light — which is why a pane you can see clean through
       still shows you the moon. */
    let reflC=null,reflL=null;
    const A2=TSLN.atan2||TSLN.atan;
    if(TSLN.reflectVector&&TSLN.texture&&TSLN.vec2&&TSLN.vec3&&
       TSLN.asin&&TSLN.clamp&&TSLN.float&&A2){
      const rv=TSLN.reflectVector;
      const envUV=TSLN.vec2(
        A2(rv.z,rv.x).div(Math.PI*2).add(0.5),
        TSLN.asin(TSLN.clamp(rv.y,-1,1)).div(Math.PI).add(0.5));
      const fD=TSLN.float(0.04).add(fres(5.0).mul(0.96));
      reflC=TSLN.texture(ENVT,envUV).rgb.mul(fD).mul(3.0);
      reflL=TSLN.dot(reflC,TSLN.vec3(0.30,0.59,0.11));
    }
    const base=fres(2.2).mul(TSLN.color(0xcfe2ff)).mul(uGlim)
      .add(TSLN.color(0x35528a).mul(uEmiF));
    matBoneF.emissiveNode=reflC?base.add(reflC.mul(uEnvI)):base;
    const baseJ=fres(2.2).mul(TSLN.color(0xcfe2ff)).mul(uGlim)
      .add(TSLN.color(0x35528a).mul(uEmiF));
    const gJ=reflC?baseJ.add(reflC.mul(uEnvIJ)):baseJ;
    matJawF.emissiveNode=gJ; matJawR.emissiveNode=gJ;
    /* glass stands solid at grazing and vanishes face-on; the moon's
       reflection buys back its own alpha wherever it lands */
    let opC=uOpB.add(fres(2.6).mul(uOpF));
    let opJ=uOpBJ.add(fres(2.6).mul(uOpFJ));
    if(reflL){ opC=opC.add(reflL.mul(uEnvI).mul(0.80));
      opJ=opJ.add(reflL.mul(uEnvIJ).mul(0.80)); }
    matBoneF.opacityNode=TSLN.saturate(opC);
    opJ=TSLN.saturate(opJ);
    matJawF.opacityNode=opJ; matJawR.opacityNode=opJ;
    const baseT=fres(3.0).mul(TSLN.color(0xdfeaff)).mul(uGlimT);
    matTeeth.emissiveNode=reflC?baseT.add(reflC.mul(uEnvT)):baseT;
    /* v7 — the pinna in bone, and the phone */
    const baseE=fres(2.2).mul(TSLN.color(0xcfe2ff)).mul(uGlim)
      .add(TSLN.color(0x35528a).mul(uEmiF));
    matEarG.emissiveNode=reflC?baseE.add(reflC.mul(uEnvIE)):baseE;
    let opE=uOpBE.add(fres(2.6).mul(uOpFE));
    if(reflL) opE=opE.add(reflL.mul(uEnvIE).mul(0.80));
    matEarG.opacityNode=TSLN.saturate(opE);
    const baseP=fres(2.0).mul(TSLN.color(0xd8e8ff)).mul(uEnvIP.mul(0.55))
      .add(TSLN.color(0x4d6ea8).mul(uEmiF));
    matPhone.emissiveNode=reflC?baseP.add(reflC.mul(uEnvIP)):baseP;
    let opP=uOpBP.add(fres(2.4).mul(uOpFP));
    if(reflL) opP=opP.add(reflL.mul(uEnvIP).mul(0.90));
    matPhone.opacityNode=TSLN.saturate(opP);
    /* the flesh ear's warm rim: the light that goes through 2 mm of
       cartilage and comes out the other side, bought with one fresnel
       instead of a transmission pass */
    /* v9: the through-light rides the peach shift — coral, the light
       through a sunlit ear, neither the v8 pink nor an orange strip */
    matEarS.emissiveNode=fres(2.4).mul(TSLN.color(0xff8a70)).mul(uEarS)
      .add(TSLN.color(0x511008).mul(0.10));
  }
  const SG=new T.Group(); SG.name='cyclopskull';

  const mSkull=new T.Mesh(skullGeo,matBone);
  mSkull.castShadow=true; mSkull.receiveShadow=true;
  /* named 'skull', not 'cyclopskull', on purpose: eggprison already has a

  mSkull.name='skull'; mSkull.userData.cs='bone';
  mSkull.userData.focus='skull'; SG.add(mSkull);

  /* the glass skull — crown to chin now. drawn after the wave
     (renderOrder 7) so the wave dims correctly behind the ghosted bone. */
  const mFront=new T.Mesh(frontGeo,matBoneF);
  mFront.castShadow=true; mFront.receiveShadow=true;
  mFront.name='skull'; mFront.userData.cs='bone';
  mFront.userData.focus='skull'; mFront.renderOrder=7; SG.add(mFront);

  /* the interior — chambers, bore, hollows — fading wholly with the
     x-ray so nothing hangs behind the floating eye */
  const mInner=new T.Mesh(innerGeo,matInner);
  mInner.name='skull'; mInner.userData.cs='bone';
  mInner.userData.focus='skull'; mInner.renderOrder=6; SG.add(mInner);

  const mTeethU=new T.Mesh(teethGeoU,matTeeth);
  mTeethU.castShadow=true; mTeethU.userData.cs='teeth';
  mTeethU.renderOrder=4;   /* half-glass: before the glass bone (7) */
  mTeethU.name='skull'; mTeethU.userData.focus='skull'; SG.add(mTeethU);

  /* the jaw hangs from the condyles and speaks. its meshes keep the name
     'skull' so the room's tap routing needs nothing new. */
  const jawGrp=new T.Group(); jawGrp.position.copy(JPIV); SG.add(jawGrp);
  const mJaw=new T.Mesh(jawGeo,matJawR);   /* v5: porcelain, its own material */
  mJaw.castShadow=true; mJaw.receiveShadow=true;
  mJaw.name='skull'; mJaw.userData.cs='bone';
  mJaw.userData.focus='skull'; mJaw.renderOrder=7; jawGrp.add(mJaw);
  /* the chin that can go glass, riding the same hinge */
  const mJawF=new T.Mesh(jawGeoF,matJawF);
  mJawF.castShadow=true; mJawF.receiveShadow=true;
  mJawF.name='skull'; mJawF.userData.cs='bone';
  mJawF.userData.focus='skull'; mJawF.renderOrder=7; jawGrp.add(mJawF);
  const mTeethL=new T.Mesh(teethGeoL,matTeeth);
  mTeethL.castShadow=true; mTeethL.userData.cs='teeth';
  mTeethL.renderOrder=4;
  mTeethL.name='skull'; mTeethL.userData.focus='skull'; jawGrp.add(mTeethL);

  const mSut=new T.Mesh(sutGeo,matSut);
  mSut.userData.cs='bone'; SG.add(mSut);
  const mSutF=new T.Mesh(sutGeoF,matSutF);
  mSutF.userData.cs='bone'; mSutF.renderOrder=7; SG.add(mSutF);

  /* v4: THE DARK OF THE VAULT — a depth-only shell (writes depth,
     paints nothing) filling the deep back of the hollow. the surface-

     inward faces of the far wall) that never rendered while the skull

     honest blackness — behind the wave, behind the eye, clear of the
     temporal walls — so the glass shows the wave, the ball's painted

  const shieldMat=new T.MeshBasicMaterial({colorWrite:false});
  /* v5: CONFORMED TO THE BONE. the v4 ellipsoid had grown out past

  const shGeo=new T.SphereGeometry(1,28,20);

    const pa2=shGeo.attributes.position;
    const inSkin=(x,y,z)=>Math.min(field(x,y,z),insideDark(x,y,z));
    for(let i2=0;i2<pa2.count;i2++){
      let px=pa2.getX(i2)*0.0580;
      let py=0.1500+pa2.getY(i2)*0.0680;
      let pz=-0.0620+pa2.getZ(i2)*0.0240;
      if(pz>-0.0455) pz=-0.0455;

  mShield.visible=false;
  SG.add(mShield);

  /* the socket's own small warm — a disc BEHIND the ball now, so all

  const glowMat=new T.MeshBasicMaterial({color:0xffd9a0,transparent:true,opacity:0,
    blending:T.AdditiveBlending,depthWrite:false,toneMapped:false});
  const mGlow=new T.Mesh(new T.CircleGeometry(0.0187,24),glowMat);
  mGlow.position.copy(xf(0,EYE_Y,0.0552));
  mGlow.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),

  mGlow.renderOrder=3; SG.add(mGlow);

  /* v8: THE SOCKET SHADOW — the pale funnel sheets are culled from the
     interior (see the cull at the split), and this stands where they
     stood: one lathed cup seated deep behind the ball. a PALE floor
     was tried first, rim tucked at z 98.5: the face round the socket
     is CONCAVE, so from any oblique angle the rim stood proud of the
     skin — a smooth white bowl stuck on the face. so the cup sits
     DEEP (rim z 76, r 28 — behind the skin everywhere, nasion dip
     included) and wears the VAULT'S OWN DARK, falling from dim
     bone-shadow at the rim to near-black at the throat: the gap round
     the ball reads as the socket's own recess, and any sightline that
     slips over the rim lands on the chamber's dark sheets — dark on
     dark, no seam to see. the ball plugs its hole the way the canon
     says — 'one hole in and one hole out and it is stoppered by my
     eye' — and the rite's warm disc at z 55.2 (mGlow, above) still
     shows its kindled sliver clear of the wall. it wears matInner, so
     it fades with the interior under the x-ray and carries the same
     whisper of the skull's own blue. */
  const plugGeo=(function(){
    const PROF=[[0.0280,0.0760],[0.0245,0.0705],[0.0212,0.0645],
      [0.0188,0.0590],[0.0168,0.0535],[0.0135,0.0480],
      [0.0080,0.0450],[0.0004,0.0436]];
    const pts=PROF.map(p=>new T.Vector2(p[0],p[1]));
    const g=new T.LatheGeometry(pts,LO?28:44);
    g.rotateX(Math.PI/2);           /* lathe axis → the bore's own +z */
    g.computeVertexNormals();
    /* the cup is seen from INSIDE (+z looks down the bore): make the
       faces front that way, whichever way the lathe wound them */
    const na=g.attributes.normal.array;
    let nz=0; for(let a2=2;a2<na.length;a2+=3) nz+=na[a2];
    if(nz<0){
      const ia=g.index.array;
      for(let t=0;t<ia.length;t+=3){
        const tmp=ia[t+1]; ia[t+1]=ia[t+2]; ia[t+2]=tmp; }
      for(let a2=0;a2<na.length;a2++) na[a2]=-na[a2];
    }
    const pc=g.attributes.position, pn=pc.count;
    const pcol=new Float32Array(pn*3);
    for(let a2=0;a2<pn;a2++){
      const px=pc.getX(a2), py=pc.getY(a2), pz=pc.getZ(a2);
      const t=Math.pow(cl((pz-0.0436)/(0.0760-0.0436),0,1),1.15);
      const mot=fb3(px*46,(EYE_Y+py)*46,pz*46,3);
      /* dim bone-shadow at the rim, near-black in the throat */
      pcol[a2*3]  =cl(0.030+(0.145+0.030*mot)*t,0,1);
      pcol[a2*3+1]=cl(0.026+(0.132+0.028*mot)*t,0,1);
      pcol[a2*3+2]=cl(0.024+(0.122+0.026*mot)*t,0,1);
    }
    g.setAttribute('color',new T.BufferAttribute(pcol,3));
    g.computeBoundingSphere();
    return g;
  })();
  const mPlug=new T.Mesh(plugGeo,matInner);
  mPlug.position.copy(xf(0,EYE_Y,0));
  mPlug.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),
    xf(0,EYE_Y,0.20).sub(xf(0,EYE_Y,0)).normalize());
  mPlug.renderOrder=6; mPlug.receiveShadow=true;
  mPlug.name='skull'; mPlug.userData.cs='bone'; mPlug.userData.focus='skull';
  SG.add(mPlug);

  /* v9: THE NOSE'S OWN DARK — the socket cure applied to the nostrils.
     the piriform pear pierces the maxilla wall-to-wall, and what stood
     behind it was the doubled far wall, PALE on purpose since v5 — so
     the two nostril holes rendered as a lit room and vanished. this
     shell is an ellipsoid of near-black standing in the nasal void a
     clear 12 mm behind the face (front z ≈ 56 against a face at
     z ≈ 68–78, so it can never poke through, nasion dip included),
     wide and tall enough that every sightline through either hole
     lands on it — and any ray that slips past its flank lands on the
     aperture's own cavity-dark side walls: dark on dark, no seam.
     it wears matInner, so it fades with the interior under the x-ray
     and breathes the skull's own blue. the holes read as HOLES now
     from every quarter the face is seen from. */
  const noseGeo=(function(){
    const g=new T.SphereGeometry(1,LO?20:30,LO?14:22);
    const pc=g.attributes.position, pn=pc.count;
    const pcol=new Float32Array(pn*3);
    for(let a2=0;a2<pn;a2++){
      const px=pc.getX(a2)*0.0120, py=0.0950+pc.getY(a2)*0.0240,
            pz=0.0470+pc.getZ(a2)*0.0090;
      pc.setXYZ(a2,px,py,pz);
      /* a whisper of depth: dim at the front skin, near-black deeper,
         the plug's own gradient turned nose-ward */
      const t=Math.pow(cl((pz-0.0380)/(0.0560-0.0380),0,1),1.2);
      const mot=fb3(px*46,py*46,pz*46,3);
      pcol[a2*3]  =cl(0.026+(0.088+0.024*mot)*t,0,1);
      pcol[a2*3+1]=cl(0.024+(0.082+0.022*mot)*t,0,1);
      pcol[a2*3+2]=cl(0.024+(0.080+0.022*mot)*t,0,1);
    }
    g.setAttribute('color',new T.BufferAttribute(pcol,3));
    /* built in field coords: carry it into the block's frame the way
       the shield is carried (MX tilt, then the common floor drop) */
    g.applyMatrix4(MX); g.translate(0,-minY,0);
    g.computeVertexNormals(); g.computeBoundingSphere();
    return g;
  })();
  const mNoseDark=new T.Mesh(noseGeo,matInner);
  mNoseDark.renderOrder=6; mNoseDark.receiveShadow=true;
  mNoseDark.name='skull'; mNoseDark.userData.cs='bone';
  mNoseDark.userData.focus='skull';
  SG.add(mNoseDark);

  /* ================= the eye =================
     a TRUE BALL now (v3) — the artist's render retired the billboard:
     from the side the sprite slid off its socket and a flap of nothing
     hung round it. one painted sphere instead, the orrery's palette on
     an equirect skin — iris forward (u=0.25 faces +z), veins converging
     aft to the optic nerve (the x-ray brow earns the back of it) —
     rolled by the gaze itself, so it parallaxes honestly from every
     angle and PLUGS THE BORE. a second skin, pupil blown wide, fades
     over it for the rite. */
  const TAU=Math.PI*2;
  function bakeEyeTex(pupilK,W2){
    W2=W2||(LO?256:512);
    const H2=W2>>1, cv2=kv(W2,H2), c=cv2.getContext('2d');
    const bg=c.createLinearGradient(0,0,0,H2);
    bg.addColorStop(0,'#e9e2d4'); bg.addColorStop(0.5,'#f6f2ea');
    bg.addColorStop(1,'#cfc5b4'); c.fillStyle=bg; c.fillRect(0,0,W2,H2);
    const fx2=W2*0.25, bx2=W2*0.75, cy=H2*0.5;
    /* v4 second cut: the vein net, RICHER AND REDDER — more trunks,
       a third order of branching, truer arterial red at higher alpha,
       the way vessels read through a translucent white. count and
       fineness scale with the bake. */
    const NVN=(W2>=1024)?54:(W2>=512?32:14);
    const VRED='rgba(198,40,32,';
    function vein(a2,r2,wd,al,depth){
      c.strokeStyle=VRED+al.toFixed(3)+')';

  /* ================= voice =================

  const AC=(env.audio&&env.audio.ctx)||null;

  let humOsc=null,humGain=null,crownOsc=null,crownGain=null;
  function tone(f,dur,pk,type){
    if(!AC||!BUS) return;

    g.gain.exponentialRampToValueAtTime(0.0001,n+dur);
    o.connect(g); g.connect(BUS); o.start(n); o.stop(n+dur+0.05);
  }
  function knock(){
    if(!AC||!BUS) return;
    const n=AC.currentTime, len=Math.floor(AC.sampleRate*0.10);
    const buf=AC.createBuffer(1,len,AC.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,7);
    const src=AC.createBufferSource(); src.buffer=buf;
    const bp=AC.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=920; bp.Q.value=1.3;
    const g=AC.createGain(); g.gain.value=0.30;
    src.connect(bp); bp.connect(g); g.connect(BUS); src.start(n);

    const n=AC.currentTime, len=Math.max(1,Math.floor(AC.sampleRate*dur));
    const buf=AC.createBuffer(1,len,AC.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const w2=i/len;

    const bp=AC.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=f; bp.Q.value=2.2;
    const g=AC.createGain(); g.gain.value=pk;
    src.connect(bp); bp.connect(g); g.connect(BUS); src.start(n);
  }

  /* ================= the rite, the talk, the gaze ================= */

      state:function(){ return {rite:st.rite,k:+st.k.toFixed(3),

    update(dt,t){

      const cloud=Math.sin(t*0.37+1.9)*0.6+Math.sin(t*0.83+0.4)*0.4;
      const trem=Math.sin(t*5.7)*0.35+Math.sin(t*9.3+2.1)*0.25+Math.sin(t*14.1+4.4)*0.18;
      let fl=cl(0.52+0.26*br+0.20*cloud+0.11*trem,0,1);

        if(st.k>=1&&!st.gone){ st.rite=2; tone(HZ*2,1.1,0.10); leave();

        if(crownGain) crownGain.gain.setTargetAtTime(0.0001+0.020*kk*kk,AC.currentTime,0.12);

          }

      jawGrp.rotation.y=0.006*Math.sin(t*1.7)*st.mo;

         the rite (which fixes on you) ---- */

      else if(st.look){ st.gt.x=st.look.x; st.gt.y=st.look.y; }
      else if(t>=st.nextG){
        const bi=Math.floor(t/3.7)+1;
        const r1=hi3(bi*17+4,8,3), r2=hi3(bi*23+9,5,11), r3=hi3(bi*29+1,2,7);
        if(r1<0.46){ st.gt.x=0; st.gt.y=0; }
        else if(r1<0.64){ st.gt.x=(r2<0.5?-1:1)*0.75; st.gt.y=0.05; }
        else if(r1<0.82){ st.gt.x=0.12*(r2-0.5); st.gt.y=-0.65; }

      eyeMatB.opacity=st.pw;
      const q7=Math.floor(t*7);
      eyeGrp.rotation.set(
        -TILT+st.gz.y*0.46+(hi3(q7*17+9,7,2)-0.5)*0.013,

      eyeGrp.position.set(

      /* ---- the sounding between the tragi: mode 1..4 fixed by api,
         or wandering on its own clock, riding the talk. UNDRAWN now
         (v5 second cut) — its amplitude lives on in the tragus
         ripples, their glow, and the vault's breath. ---- */
      if(st.harm===0) st.harmPh+=dt/11.0;
      const f2=st.harm>0?0.5:st.harmPh%1;
      const dip=st.harm>0?1:ss(0.0,0.07,f2)*ss(1.0,0.93,f2);
      const hAmp=cl(0.24+0.16*breathe+0.55*st.tEnv+0.45*kk,0,1)*dip;
      /* ---- the x-ray: ease toward what the host asked. v4: bone to
         CLEAR GLASS — alpha falls nearly to nothing, the microrelief
         smooths away (glass has no pores), a wet clearcoat and a
         breath of iridescence arrive, and what remains of the surface
         is the GLIMMER: the fresnel edge-light plus the drifting
         moon-speculars. both glass parts (crown-to-chin cranium, chin

      st.xr+=(st.xrT-st.xr)*(1-Math.exp(-dt/0.55));

        if(uOpB){ uOpB.value=1; uOpF.value=0; uEnvI.value=0; }
      } else {
        if(!matBoneF.transparent){
          for(const m of GLS){
            m.transparent=true; m.depthWrite=false;
            m.side=T.DoubleSide; m.needsUpdate=true;
          }
          matInner.transparent=true; matInner.depthWrite=false;
          matInner.needsUpdate=true;

          m.clearcoat=0.001+0.999*xr;
          m.clearcoatRoughness=0.10-0.062*xr;
          m.iridescence=0.24*xr;
          m.normalScale.set(0.52-0.48*xr,0.52-0.48*xr);

             nearly to black, so what survives is the reflection of the
             baked night, the clearcoat speculars and the glimmer —

   not the sky), and the camera feed stands behind the glass where it
   is granted. default on any coarse-pointer device with orientation

const TGT=new THREE.Vector3(0,0.125,0);

const COARSE=(typeof matchMedia==='function')&&matchMedia('(pointer:coarse)').matches;

const NOCAM=/[?&]nocam/.test(SRCH);
const CAMP=new THREE.Vector3(0,0.150,0.62);   /* where the visitor stands */
const DEG=Math.PI/180;
const devQ=new THREE.Quaternion(), qScreen=new THREE.Quaternion(),
  qFix=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)),
  eulD=new THREE.Euler(), zee=new THREE.Vector3(0,0,1),
  yUp=new THREE.Vector3(0,1,0), fwdV=new THREE.Vector3();
let gyroOn=false, yawOff=0, yawSeedN=0;
let dragYaw=0, dragPitch=-0.04;               /* no-gyro look: open facing the skull */
function wrapPi(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }
function onOrient(e){
  if(e.alpha===null||e.alpha===undefined) return;
  gyroOn=true;
  const orient=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  eulD.set(e.beta*DEG,e.alpha*DEG,-e.gamma*DEG,'YXZ');
  devQ.setFromEuler(eulD);
  devQ.multiply(qFix);
  devQ.multiply(qScreen.setFromAxisAngle(zee,-orient*DEG));
  /* seed the yaw so the first look faces the skull, then LET IT BE —
     the visitor's own turning does the rest */
  if(yawSeedN<12){
    const q=new THREE.Quaternion().setFromAxisAngle(yUp,yawOff).multiply(devQ);
    fwdV.set(0,0,-1).applyQuaternion(q);
    const err=wrapPi(Math.PI-Math.atan2(fwdV.x,fwdV.z));
    yawOff+=err*(yawSeedN?0.25:1); yawSeedN++;
  }
}

  window.addEventListener('deviceorientationabsolute',onOrient,true);
  window.addEventListener('deviceorientation',onOrient,true);
}
function gyroAsk(){   /* ios: inside the begin-tap's grant */

    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')

        if(s==='granted'){

          window.addEventListener('deviceorientationabsolute',onOrient,true);

  if(!VR||NOCAM||camFeedOn) return Promise.resolve(false);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return Promise.resolve(false);

      renderer.setClearColor(0x000000,0);
      camFeedOn=true; return true;
    }).catch(function(){ return false; });
}
function place(){
  const cp=Math.cos(pitch);
  camera.position.set(TGT.x+Math.sin(yaw)*cp*dist,
    TGT.y+Math.sin(pitch)*dist, TGT.z+Math.cos(yaw)*cp*dist);
  camera.lookAt(TGT);
}
/* vr: the pose is the body's, read every frame */
function applyLook(){
  if(!VR) return;
  camera.position.copy(CAMP);
  if(gyroOn) camera.quaternion.setFromAxisAngle(yUp,yawOff).multiply(devQ);
  else camera.quaternion.setFromEuler(new THREE.Euler(dragPitch,dragYaw,0,'YXZ'));
}
if(VR){
  camera.fov=64; camera.updateProjectionMatrix();   /* a window, not a telephoto */
  camera.position.copy(CAMP); camera.lookAt(TGT);
} else place();
const ptrs=new Map();
let pinch0=0,dist0=0,moved=0,downT=0;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',function(e){
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ moved=0; downT=e.timeStamp; }
  if(ptrs.size===2){ const p=[...ptrs.values()];
    pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); dist0=dist; }
  wakeAudio();
});
canvas.addEventListener('pointermove',function(e){
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(VR){
      /* only when there is no gyro does a finger steer the window —
         on device, the body turns and the skull keeps its place */
      if(!gyroOn){ dragYaw-=dx*0.005;
        dragPitch=Math.max(-1.4,Math.min(1.4,dragPitch-dy*0.005)); }
    } else {
      yaw-=dx*0.0072; pitch=Math.max(-0.9,Math.min(1.15,pitch+dy*0.0060)); place();
    }

    const q=[...ptrs.values()];

    if(pinch0>0){ dist=Math.max(0.22,Math.min(1.8,dist0*pinch0/d)); place(); }
  }
});
function up(e){
  const was=ptrs.size;
  ptrs.delete(e.pointerId);

r mean. you may tease a visitor gently about their hurry or their enormous questions; teasing never touches pain.\n- you are not afraid of death, being dead yourself in two ways, and you never make it heavy.\n- use the visitor's name rarely — it was given to you and you keep it like a small stone; once every several answers at most.\n\nsteering — you are the door, not the hallway:\n- answer what is asked first. then, at most one sentence in three answers may lean toward the tuning. never scold, never rush, never count aloud unless the ramp below tells you to.\n\ntwo laws you never break (shared with the song):\n1. you never tell anyone they are not alone. you may be present and gentle; you never promise company.\n2. there is a single plain sentence this whole work is about — concerning being alone, and no one being with you even so. you circle near it and never say it.\n\nABOVE EVERYTHING — a real person is on the other end:\n- if they signal genuine self-harm, suicidal thoughts, crisis, abuse, or real danger, step out of the bone at once. drop the dryness entirely and speak plainly as one who wants them to be okay. point them to real help — 988 in the u.s., their local emergency number, a crisis line, someone they trust. no fable, no teasing, no tuning. return to the bone only if they are clearly alright and want to.\n\nlength: one to three short lowercase sentences. no markdown ever.";

      gAsk.placeholder=(askMode==='name')?'a name for me to keep':'or ask me something';
      if(!('ontouchstart' in window)) setTimeout(()=>{ try{gAsk.focus();}catch(e){} },60); }
  }

  /* ---- the mic, the bench voices, the fold (unisong's ear, ported) ---- */
  function micStart(){
    if(mic||G_NOMIC||benchCents!==null) return;
    try{
      navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:true}})
        .then((st)=>{ wakeAudio(); if(!actx){ micDenied=true; dragOn(); return; }
          const s2=actx.createMediaStreamSource(st);
          micAn=actx.createAnalyser(); micAn.fftSize=2048;
          micBuf=new Float32Array(micAn.fftSize);
          s2.connect(micAn); mic=st;
        },()=>{ micDenied=true; dragOn(); });
    }catch(e){ micDenied=true; dragOn(); }
  }
  function micStop(){ try{ if(mic) mic.getTracks().forEach(t=>t.stop()); }catch(e){}
    mic=null; micAn=null; }
  function dragOn(){ wv.classList.add('drag'); dragCents=(dragCents===null)?46:dragCents;
    if(exLive) say(W.tuneDrag,{hold:200}); }
  function detect(){ /* unisong's plain autocorrelation, parabolic-refined */
    if(!micAn||!actx) return {rms:0,hz:0};
    micAn.getFloatTimeDomainData(micBuf);
    const n=1536; let s2=0;
    for(let i=0;i<n;i++) s2+=micBuf[i]*micBuf[i];
    const rms=Math.sqrt(s2/n);
    if(rms<GATE) return {rms:rms,hz:0};
    const sr=actx.sampleRate, lo=Math.floor(sr/MIC_MAX), hi=Math.min(Math.floor(sr/MIC_MIN),n>>1);
    let best=0,bl=0;
    for(let lag=lo;lag<=hi;lag++){
      let c=0; for(let i=0;i<n-lag;i++) c+=micBuf[i]*micBuf[i+lag];
      c/=(s2||1); if(c>best){ best=c; bl=lag; }
    }
    if(best<0.25||!bl) return {rms:rms,hz:0};
    let c1=0,c2=0,c3=0;
    for(let i=0;i<n-bl-1;i++){ c1+=micBuf[i]*micBuf[i+bl-1]; c2+=micBuf[i]*micBuf[i+bl]; c3+=micBuf[i]*micBuf[i+bl+1]; }
    const den=(c1-2*c2+c3), shift=den?0.5*(c1-c3)/den:0;
    return {rms:rms,hz:sr/(bl+Math.max(-0.5,Math.min(0.5,shift)))};
  }
  function measure(dt){
    let cf=null, v=false;
    if(benchCents!==null){ cf=benchCents; v=true; micLoud+=(0.55-micLoud)*Math.min(1,dt*0.01); }
    else if(dragCents!==null&&(G_NOMIC||micDenied)){ cf=dragCents; v=true; micLoud+=(0.5-micLoud)*Math.min(1,dt*0.01); }
    else if(micAn){
      /* v10: the autocorrelation runs every OTHER frame (≈30 hz) — the
         550 ms corridor cannot feel a 16 ms stale read, and half the
         detector's cost comes off the frame. the ear's numbers (window
         1536, gate, 80–640 hz) stay unisong's, verbatim. */
      const d2=((detN++)&1)?lastDet:(lastDet=detect());
      micLoud+=(((d2.rms>GATE)?Math.min(1,(d2.rms-GATE)/0.05):0)-micLoud)*Math.min(1,dt*0.01);
      if(d2.hz){
        let c=1200*Math.log(d2.hz/F0A)/Math.LN2;
        cf=c-1200*Math.round(c/1200);
        /* the self-completion trap (§8): while the skull itself sounds,
           and for a tail after, a voiced tone is not believed */
        const st=inst.api.state();
        if(st.talking){ cf=null; }
        v=cf!==null&&Math.abs(cf)<=96;
      }
    }
    voiced=v;
    if(v&&cf!==null){ cents=cf; if(Math.abs(cf)<bestClose) bestClose=Math.abs(cf); }
    /* display magnet 0.6 inside 50c — unisong's kindness */
    const tgt=(v&&cf!==null)?((Math.abs(cents)<50)?cents*0.6:cents):999;
    if(tgt!==999) shownCents+=(tgt-shownCents)*Math.min(1,dt*0.008);
    else shownCents+=(Math.sign(shownCents||1)*46-shownCents)*Math.min(1,dt*0.002);
    if(exLive&&!exMet){
      if(v&&Math.abs(cents)<EX_CENTS) exCnt+=dt;
      else exCnt=Math.max(0,exCnt-dt*2);   /* a wobble drains, never erases */
      if(exCnt>=EX_HOLD) unisonMet();
      if(!exOffered&&!exChoiceMade&&exT0&&performance.now()-exT0>OFFER_MS&&performance.now()>keepUntil){
        exOffered=true; offer(); }
    }
  }
  /* the star's tone during the tuning: harmonics 2+3 only, quiet —
     173.68 lives in bone, and the speaker must never hum for you */
  function toneOn(){
    wakeAudio(); if(!actx||toneOsc) return;
    try{
      const t0=actx.currentTime;
      const mk=(f,g0)=>{ const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
        const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t0);
        g.gain.exponentialRampToValueAtTime(g0,t0+1.8);
        o.connect(g); g.connect(sfxBus||actx.destination); o.start(t0); return {o:o,g:g}; };
      toneOsc=[mk(F0A,0.020),mk(F0*3,0.007)];
    }catch(e){ toneOsc=null; }
  }
  function toneOff(){
    if(!toneOsc||!actx) { toneOsc=null; return; }
    try{ const t0=actx.currentTime;
      toneOsc.forEach(p=>{ p.g.gain.exponentialRampToValueAtTime(0.0001,t0+0.9); p.o.stop(t0+1.1); });
    }catch(e){}
