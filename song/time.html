<script type="module">
/* ================= three.js — cdn chain, devkit fallback =================
   the WEBGPU build (the house standard: eggprison, phone and the raven's
   own devkit all ride it): the raven module's angle-sheen is a TSL node
   family, and TSL runs on WebGPURenderer (webgpu, or its webgl2 backend
   on phones without) — never on the classic WebGLRenderer. TSL is the
   same build's own export, so the chain stays one file. */

  'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js',
  'https://unpkg.com/three@0.185.1/build/three.webgpu.js',
  './node_modules/three/build/three.webgpu.js'

/* ============================ flags ============================ */

const NOSND=Q.has('nosnd')||CLEAN;
const ENTER_TILE=(Q.get('enter')==='tile');        /* the phone's hand-off */
const INFO_Q=Q.has('info');                        /* the rig's hand on the writing */
const NOGLASS=Q.has('noglass'), NOASK=Q.has('noask'), BIRDLEGS=Q.has('birdlegs');   /* v3 */
/* v4 */
const MIRROR=!Q.has('nomirror');                    /* the front camera; your face in the dial */
const COIN_FACE=(Q.get('tilt')!==null&&isFinite(parseFloat(Q.get('tilt'))))?parseFloat(Q.get('tilt')):1.0;   /* 1 = the coin faces the eye */
const BIRDEYES=Q.has('birdeyes'), NOLEGANIM=Q.has('stilllegs');
const FASTTYPE=Q.has('fasttype');                  /* the bench's hand: lines land whole, untyped */
/* v5 — THE BRIDGE and the red ink on the bird (3 sep, his screenshot) */
const qf=(k,d)=>{ const v=parseFloat(Q.get(k)); return isFinite(v)?v:d; };
const CRACK_K=qf('crack',0.5);                      /* the cracks' width, as a fraction of v4's ("thinner") */
const EYE_R=qf('eye',0.0092);                       /* the human eye's radius (v4: 0.0076; the bead: 0.0056) */
const BILL_SC=(Q.get('bill')||'0.82,0.94,1.08').split(',').map(parseFloat);   /* the bill's width, depth, length over the wedge's own (v5: 1.08,1.10,1.36 over the module's cone; v6 re-cuts the wedge — see billDress) */
const HEADCARDS=!Q.has('noheadcards');              /* v6: the skull feathered host-side */
const HIPCARDS=!Q.has('nohipcards');                /* the extra feather rows over the hip */
const HEELBALL=Q.has('heelball');                   /* v4's heel sphere back */
const SPIN0=qf('spin0',0), SPIN_W=qf('spinw',4.712), SPIN_UP=qf('spinup',1.55);   /* the phone's spin: its start (Date.now()), peak rate, ramp — see THE BRIDGE */

const BRIDGE=(ENTER_TILE&&SPIN0>0&&(Date.now()-SPIN0)>=0&&(Date.now()-SPIN0)<30000);   /* the coin arrives already turning */
/* v6 — THE RAVEN'S DANCE (3 sep, later): the shatter's seat on the dial, the
   bird's bill and pupils, the wings' rise, the dances */
const SHATTER_AT=(function(){ const m=/^(\d{1,2})(?::(\d{1,2}))?$/.exec(Q.get('shatter')||'4:20'); return m?{h:+m[1]%12,m:+(m[2]||0)}:{h:4,m:20}; })();   /* the crack sits where the hour hand points at this reading ("around the 4:20 mark") */
const SHATTER_R=qf('shatterr',16.5);                /* its distance from the centre, in the dial's 62 units (v4: 16.5) */
const PUPIL_K=qf('pupil',0.64);                     /* the pupil's radius as a fraction of the iris (v4: 0.39) — "black and bigger" */
const WING_UP=qf('wingup',0.85);                    /* how high the wings rise at full open, radians ("flap up more") */

const STAGE_Q=(Q.get('stage')!==null&&isFinite(parseInt(Q.get('stage'))))?Math.max(0,Math.min(4,parseInt(Q.get('stage')))):0;   /* v6.1: the ladder's first rung (4 = the full dance at once) */
const SLEEK=!Q.has('nosleek');                      /* v5's rounder bird back with ?nosleek */

/* ===================== v4.1 — ?dslog, THE PHONE'S OWN EYES =====================
   a small corner readout (plus ungated console lines) that names every
   stage the piece passes and every error it catches. one glance on the
   artist's own phone names the failing step. */
const DSLOG=Q.has('dslog');
let dsBox=null, dsLines=[], dsSaid=0;
function dslog(s){
  try{
    if(DSLOG){
      if(!dsBox){ dsBox=document.createElement('div');
        dsBox.style.cssText='position:fixed;left:6px;bottom:6px;z-index:99;'+
          'font:9px/1.45 ui-monospace,monospace;color:#7fe0a0;pointer-events:none;'+
          'text-shadow:0 1px 3px #000;max-width:92vw;white-space:pre-wrap';
        document.body.appendChild(dsBox); }
      dsLines.push(s); if(dsLines.length>14)dsLines.shift();
      dsBox.textContent=dsLines.join('\n');
    }
    if(DSLOG||dsSaid<6){ dsSaid++; console.log('[time] '+s); }
  }catch(e){}
}
function dsErr(s){
  try{ console.error('[time] '+s); }catch(e){}
  try{ if(DSLOG&&dsBox)dsBox.style.color='#ffb3a0'; }catch(e){}
  dslog('ERR '+s);
}

/* ============================ helpers ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, sat01=v=>clamp(v,0,1);
const ss=(a,b,t)=>{const u=sat01((t-a)/(b-a));return u*u*(3-2*u);};
const s5=u=>{u=sat01(u);return u*u*u*(u*(6*u-15)+10);};   /* smootherstep — the ride's ease */
const lerp=(a,b,u)=>a+(b-a)*u;
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let x=Math.imul(s^s>>>15,1|s);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}

/* ============================ stage ============================
   v2 — NO TONE MAPPING. ACES lived here for the skull alone: the bone was
   lit under it and approved under it, and the pulsar body carried an
   analytic inverse so the star could survive the map. the bone is gone,
   and the coin's white face has to be white — ACES writes a full white at
   about 0.83 and pulls the cornflower toward grey, and an 8-bit canvas
   texture has no headroom above 1.0 to pre-invert into. so the map comes
   off. ?tone=aces puts it back. */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGPURenderer({canvas,antialias:true,alpha:true});

/* ==================== the room — the camera as offering ====================
   v2 — THE ASK COMES LAST. v1.1 offered the feed at the door, before a
   single thing stood. the artist's word: "the system asks for the camera
   only later after the clock moves to its final position." so the ask goes
   out from coinSeated(), one breath after the turn begins. denied → the
   void, and nothing else changes. */
const camEl=document.getElementById('cam'), camTint=document.getElementById('camTint');
let camOn=false,camAsked=false;
async function offerCamera(){
  if(camAsked)return; camAsked=true;
  if(NOCAM||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){dslog('camera: not offered');return;}
  dslog('camera: asked'+(MIRROR?' (the front one — the mirror)':''));
  try{
    /* v4: the FRONT camera, so the human clock's dial can be a mirror.
       the room behind the coin is the same feed, softened (#cam.mirror). */
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:MIRROR?'user':'environment'},audio:false});
    camEl.srcObject=st;
    /* play() is not awaited (v4): on the bench a fake device's play() never
       settles and the room was never declared standing; the mirror reads
       the element's own readyState, and ios plays a muted inline stream
       without being asked twice. */
    try{ const pp=camEl.play(); if(pp&&pp.catch)pp.catch(function(){}); }catch(e){}
    if(MIRROR)camEl.classList.add('mirror');
    camEl.classList.add('on'); camTint.classList.add('on'); camOn=true;
    dslog('camera: the room stands');
  }catch(e){ camOn=false; dslog('camera: refused — the void stands'); }
}

}

/* ======================================================================
   THE COIN — one object, two times
   ======================================================================
   a cylinder stood on its edge and turned on the world's vertical axis:
   CylinderGeometry's three material slots come in the order [side, top
   cap, bottom cap], and rotation.x = +pi/2 walks the top cap round to
   face the viewer. so slot 1 is YOUR face (the phone's own white tile,
   the same 62-unit drawing, hands walking your real time) and slot 2 is
   HERS (the star's dial: her night, her cornflower ring, her seven-tail
   strobe at the folded pulse). slot 0 is the milled edge, and it is the
   only lit thing on the coin — the faces are basic material so the white
   stays white.

   THE FAR CAP RENDERS MIRRORED. that is the classic way this goes wrong,
   and it is cured here by flipping the texture's u (repeat -1, offset 1)
   rather than by drawing the canvas backwards — one line, and the two
   faces stay one drawing.

   THE TURN IS A HOUSE FREQUENCY: one revolution per 2^12 pulsar turns,
   4096 / 173.6879 = 23.588 s (v4: "slow down the rotation" — one octave
   down from v2's 2^11). never a round number of seconds.

   THE COIN FACES THE EYE (v4). the artist: "the clock seems to have its
   top part tilted a little back, if can straighten." it was never tilted
   — it stood plumb, parallel to the glass — but a plumb disc seated above
   the eye is seen from below: its lower rim shows and the dome's light
   sits low, and the eye reads that as a face leaning back. so the coin is
   now pitched toward the camera by atan(y/d), the exact angle that puts
   its face square to the eye at whatever height it sits; the spin axis
   tilts with it (euler XYZ: the turn first, then the pitch). at the
   tile's seat, near the eye line, the pitch is under three degrees, so
   the seam still holds. ?tilt=K scales it (0 = plumb, the v3 stance). */
const COIN_HZ=173.6879;
const COIN_TURN_S=(parseFloat(Q.get('spin'))>0)?parseFloat(Q.get('spin')):(4096/COIN_HZ);
const COIN_D=0.62;            /* the coin's depth in the dark */
const COIN_TH=0.075;          /* the edge, as a fraction of the diameter */
const RIDE_MS=2600;           /* the walk from the tile's centre to the seat */
const HOLD_MS=BRIDGE?0:(ENTER_TILE?420:900);   /* the beat it stands at the centre first — none through the bridge: it is already moving */
const SPINUP_MS=1400;         /* the turn eases in — "and THEN starts slowly rotating" */
let coinR=0.043, coinYSeat=0.19, coinYLand=0.03;
let coinTheta=0, coinSpinK=0, coinRideK=0, coinT0=0, coinFrozen=false;
let ST='boot';                /* boot · ride · room */

/* ======================================================================
   THE BRIDGE (v5) — the tile's spin crosses the address
   ======================================================================
   the artist: "when user taps the clock the rest of tiles disappear and
   the clock spins and elegantly has a bridge animation to new clock."
   phone.html now spins its tile on the vertical axis as it arrives at
   the centre, and hands over with three numbers in the address: spin0
   (Date.now() at the tap), spinw (the peak rate, rad/s) and spinup (the
   ramp, s). the SAME LAW stands in both files ([SYNC] — the pair below
   and phone.html's clockSpin): the rate rises on a smootherstep over
   spinup and holds at spinw; the angle is that curve's own integral,
   u⁴(u²−3u+2.5)·w·up on the ramp and linear after. so this page does not
   restart the turn: it asks the wall clock how long the coin has been
   spinning — through the black, through the load — and stands it at the
   angle it has reached, turning at the rate it has, and only then lets
   the rate FALL to the house rate on an exponential (SPIN_DEC) while the
   coin rides to its seat. a coin that stopped to travel would be a lie;
   this one never stops. no spin0 (a cold walk-in, or v4's own phone) is
   v4's seam exactly. the edge-on beat holds its tongue until the spin
   has come within reach of the house rate. */
function bridgeTheta(tau){   /* [SYNC] with phone.html clockSpin.theta */
  const u=Math.min(1,Math.max(0,tau)/SPIN_UP);
  const ramp=SPIN_W*SPIN_UP*(u*u*u*u*(u*u-3*u+2.5));
  return (tau<=SPIN_UP)?ramp:ramp+SPIN_W*(tau-SPIN_UP);
}
function bridgeRate(tau){ return SPIN_W*s5(tau/SPIN_UP); }   /* [SYNC] with phone.html clockSpin.rate */
let bridgeW0=0, bridgeAt=0, bridgeTau0=0, bridgeTheta0=0;   /* v6: the catch itself, kept for the press */
function bridgeRateNow(){
  const wH=6.283185/COIN_TURN_S;
  return wH+(bridgeW0-wH)*Math.exp(-((performance.now()-bridgeAt)/1000)/SPIN_DEC);
}
const coinG=new THREE.Group(); coinG.visible=false; scene.add(coinG);

/* ---- the two faces, painted into their own canvases ----
   v3: yours is painted at 768 (it repaints at 4 Hz and carries the
   weathered bezel's fine work); hers stays at 512 (30 Hz — the dot). */
const FACE_PX=768, STAR_PX=512;
function faceCanvas(px){ const c=document.createElement('canvas');
  c.width=px; c.height=px; return c; }
const cvYou=faceCanvas(FACE_PX), cvStar=faceCanvas(STAR_PX);
const qYou=cvYou.getContext('2d'), qStar=cvStar.getContext('2d');
const cInk=a=>'rgba(226,240,255,'+a+')';
const cPsr=a=>'rgba(92,154,255,'+a+')';
const CLK_STAR={ name:'psr j0437−4715', hz:173.6879, discovered:Date.UTC(1993,1,18) };
/* the folded beat — 128 turns, 736.98 ms. the dot, the hot spot, the
   thump and the mouth-pulsar of the ear all ride this one number. */
const BEAT_MS=1000*128/CLK_STAR.hz;
function beatPhase(){ return (performance.now()%BEAT_MS)/BEAT_MS; }

/* ---- THE WEATHER ON THE HUMAN CLOCK (v3, beaten harder in v4) ----
   dealt once from one seed, in the tile's own 62-unit space: the cracks
   in the bezel (the long ones run off the bezel into the dial), the chips
   and DENTS at the edge, the FLAKES where the plating lifted, the
   scratches, the rust, and the crystal's own wounds: one hairline (v3)
   and a SHATTER, upper right — a crushed centre, seven rays, two broken
   rings (v4: "a little more obviously cracked"). everything is drawn
   under `coinDetail`, which is 0 at the tile's seat (the seam stays
   honest — the face IS the tile there) and 1 once the coin has ridden
   up. ?detail=K / __TIME.detail(k) hold it by hand. */
const WEAR=(function(){
  const r=mulberry(20260903), W={cracks:[],chips:[],dents:[],flakes:[],scratches:[],rust:[],mottle:[],fox:[]};
  for(let i=0;i<18;i++){
    const a0=r()*6.283, long=(i<6);
    const len=(long?6.0:2.2)+r()*(long?3.6:1.6);
    let x=Math.cos(a0)*25.45, y=Math.sin(a0)*25.45, ang=a0+Math.PI+(r()-0.5)*1.0;
    const pts=[[x,y]], n=4+((r()*4)|0);
    for(let k=0;k<n;k++){ const st=len/n*(0.55+r()*0.9); ang+=(r()-0.5)*1.15;
      x+=Math.cos(ang)*st; y+=Math.sin(ang)*st; pts.push([x,y]); }
    const branch=(r()<0.6)?(function(){ const j=1+((r()*(pts.length-2))|0), b=[pts[j]];
      let bx=pts[j][0],by=pts[j][1],ba=ang+(r()<0.5?1:-1)*(0.8+r()*0.7);
      for(let k=0;k<3;k++){ bx+=Math.cos(ba)*0.7*(0.5+r()); by+=Math.sin(ba)*0.7*(0.5+r()); ba+=(r()-0.5)*0.9; b.push([bx,by]); }
      return b; })():null;
    W.cracks.push({pts,branch,w:(0.26+r()*0.34)*CRACK_K});   /* v5: ×CRACK_K — thinner */
  }
  for(let i=0;i<10;i++) W.chips.push({a:r()*6.283,s:0.55+r()*1.1,d:0.5+r()*0.9});
  for(let i=0;i<9;i++) W.dents.push({a:r()*6.283,rr:23.9+r()*1.2,s:0.55+r()*0.9,e:0.45+r()*0.45,rot:r()*3.14,al:0.5+r()*0.4});
  for(let i=0;i<4;i++){
    const a=r()*6.283, w=0.22+r()*0.42, n=5+((r()*3)|0), pts=[];
    for(let k=0;k<n;k++){ const aa=a-w/2+w*k/(n-1), rr2=24.5+r()*1.0; pts.push([Math.cos(aa)*rr2,Math.sin(aa)*rr2]); }
    for(let k=n-1;k>=0;k--){ const aa=a-w/2+w*k/(n-1), rr2=23.3+r()*1.0; pts.push([Math.cos(aa)*rr2,Math.sin(aa)*rr2]); }
    W.flakes.push({pts,al:0.30+r()*0.30});
  }
  for(let i=0;i<26;i++) W.scratches.push({a:r()*6.283,l:0.25+r()*0.9,rr:23.4+r()*1.9,al:0.12+r()*0.28});
  for(let i=0;i<110;i++){ const a=r()*6.283, rad=23.5+r()*1.9; W.rust.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,s:0.12+r()*0.34,al:0.25+r()*0.45}); }
  for(let i=0;i<120;i++){ const a=r()*6.283, rad=23.3+r()*2.2; W.mottle.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,s:0.4+r()*1.3,al:0.10+r()*0.32}); }
  for(let i=0;i<70;i++){ const a=r()*6.283, rad=12+r()*11; W.fox.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad,s:0.15+r()*0.5,al:0.05+r()*0.14}); }
  /* v6 — THE SHATTER SITS AT 4:20 ("put the crack around the 4:20 mark"): its
     crushed centre where the hour hand points at that reading, SHATTER_R
     out from the centre (130° round from twelve; v4 had it upper right, at
     about ten to two). the hairline sets out from the rim at the same
     bearing, as it always did. ?shatter=H:MM ?shatterr=R. the deal's
     random sequence is untouched — nothing else on the face moves. */
  const shA=((SHATTER_AT.h+SHATTER_AT.m/60)/12)*6.283185-Math.PI/2;
  W.hair={a:shA,len:9.5,seed:r()*100};
  { const cx=Math.cos(shA)*SHATTER_R,cy=Math.sin(shA)*SHATTER_R,rays=[],n=7;
    for(let i=0;i<n;i++){ const a=i/n*6.283+(r()-0.5)*0.5, len=4.5+r()*9.5;
      let x=cx,y=cy,ang=a; const pts=[[x,y]], m=3+((r()*3)|0);
      for(let k=0;k<m;k++){ ang+=(r()-0.5)*0.5; const st=len/m*(0.6+r()*0.8); x+=Math.cos(ang)*st; y+=Math.sin(ang)*st; pts.push([x,y]); }
      rays.push({pts,w:(0.16+r()*0.16)*CRACK_K}); }
    const rings=[]; for(let i=0;i<2;i++) rings.push({r:2.4+i*2.8+r()*0.8,a0:r()*6.283,len:1.4+r()*2.4,w:(0.13+r()*0.1)*CRACK_K});
    W.shatter={x:cx,y:cy,rays,rings,at:SHATTER_AT.h+':'+String(SHATTER_AT.m).padStart(2,'0')};
  }
  return W;
})();
let coinDetail=0;   /* 0 at the tile's seat, 1 seated — grows with the ride */
const DETAIL_Q=parseFloat(Q.get('detail')); let detailHeld=(DETAIL_Q>=0&&DETAIL_Q<=1)?DETAIL_Q:null;

/* THE STATIC WEATHER, drawn at `det` into a context already standing in
   the 62-unit space: the dial's age, the bezel and everything beaten into
   it, the cracks, the crystal's wounds. once the detail is whole this is
   painted ONCE into a cache (v4 — the mirror repaints the face at 25 Hz
   and the weather is ~500 strokes) and stamped from there. */
function paintWeather(q,det){
  q.globalAlpha=det;
  /* the dial's age — a warm shadow toward the rim, a little foxing.
     the centre stays white (the law of the white face). */
  const ag=q.createRadialGradient(0,0,14,0,0,23.6);
  ag.addColorStop(0,'rgba(196,182,150,0)'); ag.addColorStop(0.7,'rgba(196,182,150,0.10)');
  ag.addColorStop(1,'rgba(150,132,100,0.34)');
  q.fillStyle=ag; q.beginPath(); q.arc(0,0,23.6,0,6.283); q.fill();
  for(const f of WEAR.fox){ q.fillStyle='rgba(120,96,60,'+f.al+')'; q.beginPath(); q.arc(f.x,f.y,f.s,0,6.283); q.fill(); }
  /* THE BEZEL — gunmetal, weathered: patina, flakes, rust, scratches,
     dents, chips, and the cracks. the long cracks run off it into the dial. */
  const bz=q.createRadialGradient(0,0,23.2,0,0,25.5);
  bz.addColorStop(0,'#7d838d'); bz.addColorStop(0.12,'#5a606a'); bz.addColorStop(0.55,'#3d424b');
  bz.addColorStop(0.9,'#2c3037'); bz.addColorStop(1,'#1a1d22');
  /* the ring: outer circle clockwise, inner circle anticlockwise (a
     full 2π each, or the canvas draws no hole and the dial goes grey) */
  q.fillStyle=bz; q.beginPath(); q.arc(0,0,25.5,0,Math.PI*2); q.arc(0,0,23.2,Math.PI*2,0,true); q.fill();
  q.strokeStyle='rgba(215,222,232,0.55)'; q.lineWidth=0.18;
  q.beginPath(); q.arc(0,0,23.32,0,6.283); q.stroke();
  for(const m of WEAR.mottle){ q.fillStyle='rgba(12,14,18,'+m.al+')'; q.beginPath(); q.ellipse(m.x,m.y,m.s,m.s*0.55,Math.atan2(m.y,m.x),0,6.283); q.fill(); }
  for(const f of WEAR.flakes){ q.fillStyle='rgba(150,156,166,'+f.al+')'; q.beginPath(); q.moveTo(f.pts[0][0],f.pts[0][1]);
    for(let i=1;i<f.pts.length;i++)q.lineTo(f.pts[i][0],f.pts[i][1]); q.closePath(); q.fill();
    q.strokeStyle='rgba(10,12,16,0.5)'; q.lineWidth=0.10; q.stroke(); }
  for(const s of WEAR.scratches){ q.strokeStyle='rgba(205,212,222,'+s.al+')'; q.lineWidth=0.09;
    q.beginPath(); q.arc(0,0,s.rr,s.a,s.a+s.l); q.stroke(); }
  for(const rs of WEAR.rust){ q.fillStyle='rgba(126,70,36,'+rs.al+')'; q.beginPath(); q.arc(rs.x,rs.y,rs.s,0,6.283); q.fill(); }
  for(const dn of WEAR.dents){ const x=Math.cos(dn.a)*dn.rr, y=Math.sin(dn.a)*dn.rr;
    q.fillStyle='rgba(8,10,14,'+(0.55*dn.al)+')'; q.beginPath(); q.ellipse(x,y,dn.s,dn.s*dn.e,dn.rot,0,6.283); q.fill();
    q.strokeStyle='rgba(200,208,220,'+(0.5*dn.al)+')'; q.lineWidth=0.12; q.beginPath(); q.ellipse(x-0.1,y-0.12,dn.s*0.92,dn.s*dn.e*0.92,dn.rot,3.4,5.8); q.stroke(); }
  for(const c of WEAR.chips){ const ca=Math.cos(c.a), sa=Math.sin(c.a), px=Math.cos(c.a+1.5708), py=Math.sin(c.a+1.5708);
    q.fillStyle='#07080b'; q.beginPath();
    q.moveTo(ca*25.6-px*c.s,sa*25.6-py*c.s); q.lineTo(ca*(25.5-c.d),sa*(25.5-c.d)); q.lineTo(ca*25.6+px*c.s,sa*25.6+py*c.s); q.closePath(); q.fill();
    q.strokeStyle='rgba(190,198,210,0.35)'; q.lineWidth=0.12; q.beginPath();
    q.moveTo(ca*25.5-px*c.s,sa*25.5-py*c.s); q.lineTo(ca*(25.5-c.d),sa*(25.5-c.d)); q.stroke(); }
  q.lineCap='round'; q.lineJoin='round';
  const path=(pts)=>{ q.beginPath(); q.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++)q.lineTo(pts[i][0],pts[i][1]); };
  for(const c of WEAR.cracks){
    q.strokeStyle='rgba(224,230,238,0.42)'; q.lineWidth=c.w*0.7; q.save(); q.translate(0.16*CRACK_K,0.20*CRACK_K); path(c.pts); q.stroke(); if(c.branch){path(c.branch); q.stroke();} q.restore();
    q.strokeStyle='#08090c'; q.lineWidth=c.w; path(c.pts); q.stroke();
    if(c.branch){ q.lineWidth=c.w*0.6; path(c.branch); q.stroke(); }
  }
  /* THE CRYSTAL'S WOUNDS — under the dome. one hairline from the rim,
     curving in (v3); and the shatter (v4): every line a dark cut with a
     white lit edge beside it, the way a crack catches the window. */
  q.save(); q.beginPath(); q.arc(0,0,25.4,0,6.283); q.clip();
  { const h=WEAR.hair, a=h.a; let x=Math.cos(a)*25.2, y=Math.sin(a)*25.2, ang=a+Math.PI-0.35;
    const pts=[[x,y]]; for(let k=0;k<7;k++){ ang+=0.09+0.05*Math.sin(h.seed+k*1.7); x+=Math.cos(ang)*h.len/7; y+=Math.sin(ang)*h.len/7; pts.push([x,y]); }
    path(pts); q.strokeStyle='rgba(0,0,0,0.22)'; q.lineWidth=0.36*CRACK_K; q.stroke();
    q.strokeStyle='rgba(246,250,255,0.66)'; q.lineWidth=0.16*CRACK_K; q.save(); q.translate(-0.14*CRACK_K,-0.14*CRACK_K); q.stroke(); q.restore(); }
  { const sh=WEAR.shatter;
    for(const ry of sh.rays){ path(ry.pts); q.strokeStyle='rgba(0,0,0,0.26)'; q.lineWidth=ry.w*1.6; q.stroke();
      q.strokeStyle='rgba(248,251,255,0.78)'; q.lineWidth=ry.w; q.save(); q.translate(-0.13*CRACK_K,-0.15*CRACK_K); q.stroke(); q.restore(); }
    for(const rg of sh.rings){ q.beginPath(); q.arc(sh.x,sh.y,rg.r,rg.a0,rg.a0+rg.len); q.strokeStyle='rgba(0,0,0,0.22)'; q.lineWidth=rg.w*1.5; q.stroke();
      q.beginPath(); q.arc(sh.x-0.12*CRACK_K,sh.y-0.13*CRACK_K,rg.r,rg.a0,rg.a0+rg.len); q.strokeStyle='rgba(248,251,255,0.62)'; q.lineWidth=rg.w; q.stroke(); }
    /* the crushed centre */
    const cg=q.createRadialGradient(sh.x,sh.y,0,sh.x,sh.y,1.6);

  const hh=Math.tan(camera.fov*Math.PI/360)*COIN_D, hw=hh*camera.aspect;

  glassStar.scale.setScalar(coinR); glassStar.position.z=-th/2;

  coinSeatApply();

   boundary, so the sound and the hand agree), each a short band-passed
   noise strike with a small metal ping and a wooden thud under it. hers

   swells on. both are scheduled a beat ahead on the audio clock (a
   lookahead, so no frame drop skips a tick), and their two gains follow

    gY.gain.value=0; gS.gain.value=0; gY.connect(master); gS.connect(master);
    const nb=ac.createBuffer(1,Math.floor(ac.sampleRate*0.05),ac.sampleRate);
    const ch=nb.getChannelData(0); for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;

    clkSnd.timer=setInterval(clockSoundSchedule,150);
    clockSoundSchedule();
    dslog('the clocks sound');
  }catch(e){ clkSnd=null; }
}
function clockSoundSchedule(){
  if(!clkSnd||!ac)return;
  const acNow=ac.currentTime, wall=Date.now(), pn=performance.now();

  let t=Math.max(clkSnd.tickUntil,Math.ceil(wall/1000)*1000);
  while(t<wall+AHEAD*1000){ const at=acNow+(t-wall)/1000; if(at>acNow-0.05)tickAt(at,((t/1000)|0)%2===1); t+=1000; }

  /* thumps on the folded beat (performance.now()'s own phase — the dot's) */
  let b=Math.max(clkSnd.beatUntil,Math.ceil(pn/BEAT_MS)*BEAT_MS);
  while(b<pn+AHEAD*1000){ const at=acNow+(b-pn)/1000; if(at>acNow-0.05)thumpAt(at); b+=BEAT_MS; }
  clkSnd.beatUntil=b;
}

  src.connect(bp); bp.connect(g); g.connect(out); src.start(t); src.stop(t+0.05);

  o.frequency.setValueAtTime(tock?1180:1560,t); o.frequency.exponentialRampToValueAtTime(tock?720:960,t+0.022);

  og.gain.exponentialRampToValueAtTime(0.22,t+0.0015); og.gain.exponentialRampToValueAtTime(0.0001,t+0.05);

const SND_YOU=0.62, SND_STAR=0.80;
function clockSoundStep(){

function coinStep(dt,M){

  if(ST==='ride'){
    const k=sat01((el-HOLD_MS)/RIDE_MS);

  /* v3: the detail rides in with the coin — 0 at the tile's seat, 1 seated */
  { const want=(detailHeld!==null)?detailHeld:s5(coinRideK);
    if(Math.abs(want-coinDetail)>0.002){ coinDetail=want; youAt=0; glassApply(); dialHandsApply(); } }
  /* v4: the mirror surfaces once the coin is seated whole and the front
     camera stands — on the wall clock, not the frame's (a fade, not physics) */
  { const wantM=(mirrorLive()&&coinDetail>0.996)?1:0, nowM=performance.now(), dtM=Math.min(2,(nowM-mirrorT)/1000); mirrorT=nowM;
    if(Math.abs(wantM-mirrorK)>0.001)mirrorK+=(wantM-mirrorK)*Math.min(1,dtM*0.9); }

    if(coinTheta>6.283185)coinTheta-=6.283185;
    coinG.rotation.y=coinTheta;

  } else if(ST==='room'&&!coinFrozen){

    const step=dt*(6.283185/COIN_TURN_S)*coinSpinK;
    coinTheta+=step; coinThetaAcc+=step;
    if(coinTheta>6.283185)coinTheta-=6.283185;
    coinG.rotation.y=coinTheta;
    /* the edge-on beat: every half-turn the coin is a hairline, the
       writing swaps — and the bird asks (v3) */
    const half=Math.floor((coinThetaAcc+Math.PI/2)/Math.PI);
    if(half!==coinHalf){ coinHalf=half; try{ onEdgeBeat(); }catch(e){} }
  }

let coinThetaAcc=0, coinHalf=0;

    ctxt(c,'the star keeps its own',cx,top+105,11,cPsr(0.6),'center',400);

   itself, verbatim where it could be: grown feather by feather (~460

   preens, stretches, and rarely spreads both wings wide and holds them:
   a display for no one. it stands tall and lean on bare tarsi, head
   carried clear of its shoulders, the way a raven stands when it is
   watching you. its own subtle moonlight follows it.

   a VOICE (inst.voice(env, pulse) each frame) — the bill works on the
   folded beat, the throat hackles flutter, the wings answer the peaks —
   and a MOOD (inst.mood('listen'|'think'|'idle')): listening it fixes
   one eye on the visitor and holds; thinking it lowers its head and

  /* the gronk: 86.84 at heart — the fire hum's tone */
  function sndGronk(n){
    const A=AU(),sfxBus=BUS(); if(!A||!sfxBus) return;
    let t0=A.currentTime+0.02;
    for(let i=0;i<n;i++){
      const f0=(HZ/2)*(1.02-0.06*i)*(0.96+Math.random()*0.08);
      const o1=A.createOscillator(),o2=A.createOscillator();
      o1.type='sawtooth'; o2.type='sawtooth';
      o1.frequency.setValueAtTime(f0*1.14,t0);
      o1.frequency.exponentialRampToValueAtTime(f0*0.80,t0+0.24);
      o2.frequency.setValueAtTime(f0*1.16*1.02,t0);
      o2.frequency.exponentialRampToValueAtTime(f0*0.81*1.02,t0+0.24);
      const lfo=A.createOscillator(); lfo.type='square'; lfo.frequency.value=25+Math.random()*6;
      const lg=A.createGain(); lg.gain.value=0.5; lfo.connect(lg);
      const vca=A.createGain(); vca.gain.value=0.55; lg.connect(vca.gain);
      const bp1=A.createBiquadFilter(); bp1.type='bandpass'; bp1.frequency.value=640; bp1.Q.value=3.2;
      const bp2=A.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1480; bp2.Q.value=5.5;
      const g1=A.createGain(); g1.gain.value=1.0;
      const g2=A.createGain(); g2.gain.value=0.5;
      const env2=A.createGain();
      env2.gain.setValueAtTime(0,t0);
      env2.gain.linearRampToValueAtTime(0.34,t0+0.028);
      env2.gain.setValueAtTime(0.30,t0+0.17);
      env2.gain.exponentialRampToValueAtTime(0.002,t0+0.27);
      o1.connect(vca); o2.connect(vca);
      vca.connect(bp1); vca.connect(bp2);
      bp1.connect(g1); bp2.connect(g2); g1.connect(env2); g2.connect(env2);
      /* breath */
      const nb=A.createBuffer(1,A.sampleRate*0.28,A.sampleRate);
      const ch=nb.getChannelData(0);
      for(let k2=0;k2<ch.length;k2++) ch[k2]=(Math.random()*2-1)*Math.pow(1-k2/ch.length,1.4);
      const ns=A.createBufferSource(); ns.buffer=nb;

      const ng=A.createGain(); ng.gain.value=0.06;

    const s=A.createBufferSource(); s.buffer=nb;

/* ---- the raven — eggprison's bird, mounted free, 1.6x ----
   the artist: "below is the raven figure in bigger size." 0.58 -> 0.94,
   so the bird stands about 23 cm in the room and owns the lower half of
   the glass. its perch is derived from the LIVE GLASS at its own depth,
   the way the coin's seat is, so "below the spinning clock" holds on a
   phone held tall and on a desk — and it rides a resize honestly. */
const ravenG=new THREE.Group(); ravenG.visible=false; scene.add(ravenG);

   the glass (room under them for the ear's lines) and the body follows
   from there; the bird stands a step deeper than v2 (0.78 → 0.84) so

   neck thicker, the back flatter (torsoG pitched −0.42 → −0.28, shifted

   belly to the ankle, feathered to the knee, on feet with toes — and the

     like a raven"; his scan sheet). the head is drawn out along the bill —
     narrower and lower by a twentieth, a tenth longer — so the crown runs

     narrowed and lengthened the same way, the back a hair flatter still;

/* ===================== THE BILL (v6) =====================
   the artist: "make the bird's beak thinner and matt black, add the
   breathing nostrils." the module's bill is a clearcoated gloss; it is
   given a MATT skin here (no clearcoat, rough, a whisper of sheen so the
   wedge still reads under the moon and does not fall to silhouette), and
   the NARES are set on the upper mandible's own flanks — the point on
   its base ring at about fifty degrees up, carried a third of the way
   toward the tip — as a dark slit in a raised rim, under the nasal
   bristles where a raven's are. they BREATHE: the aperture opens and
   shuts with the module's own breath (the body's 0.81 Hz swell), and
   flares with the voice on the folded beat. ?bill=x,y,z still sets the
   wedge's width, depth and length. */
/* THE WEDGE. the module's mandibles are cones — two rings, base and apex,
   so whatever the profile note intended, the bill tapered in a straight
   line from root to tip and, drawn longer, read as a needle (the v5
   shoot, up close). a raven's bill is a wedge: deep at the root, nearly
   as deep past the middle, and only then falling into the hook. each
   mandible is re-cut here with sixteen rings on that law — the culmen a
   ridge that runs straight and drops as t^2.5, the tomium a straight
   line, the gonys angling up to meet it — and set on the module's own
   mesh objects, so the jaw still opens at the module's hinge. the units
   are the module's (um/lm local); BILL_SC dials the wedge as before. */
function billGeo(upper){
  const T=THREE, N=16, M=14, L=upper?0.0718:0.0653, z0=-L/2;
  const prof=t=>{
    if(upper){ const yT=0.016-0.0195*Math.pow(t,2.5), yB=-0.008+0.0045*t;
      return {yT,yB,w:0.0078*Math.pow(Math.max(0,1-Math.pow(t,1.5)),0.72)}; }
    const yT=-0.0025+0.0040*t, yB=yT-0.0112*Math.max(0,1-Math.pow(t,1.35));
    return {yT,yB,w:0.0068*Math.pow(Math.max(0,1-Math.pow(t,1.5)),0.72)};
  };
  const pos=[], idx=[];
  for(let i=0;i<N-1;i++){ const t=i/(N-1), p=prof(t), yc=(p.yT+p.yB)/2, h=(p.yT-p.yB)/2;
    for(let j=0;j<M;j++){ const th=j/M*6.283185, cs=Math.cos(th), sn=Math.sin(th);

  const tip=(N-1)*M; pos.push(0,(prof(0).yT+prof(0).yB)/2,z0);   /* the root's centre */
  const root=tip+1;

  for(let j=0;j<M;j++){ idx.push((N-2)*M+j,tip,(N-2)*M+(j+1)%M); idx.push(root,j,(j+1)%M); }
  const g=new T.BufferGeometry(); g.setIndex(idx); g.setAttribute('position',new T.Float32BufferAttribute(pos,3));

}
function billDress(){
  const T=THREE, bill=rv.billG;
  const um=bill.children.find(o=>o.isMesh);
  const jaw=bill.children.find(o=>o.isGroup), lm=jaw&&jaw.children.find(o=>o.isMesh);
  /* matt: no clearcoat, rough — but not pitch: a black that never catches
     the moon is a hole in the head, so the skin is a dark slate with a
     soft sheen, the way a raven's bill reads grey on its ridges in light */
  const matt=new T.MeshPhysicalMaterial({color:0x24272e,roughness:0.70,metalness:0,clearcoat:0,
    sheen:0.32,sheenColor:new T.Color(0x3a4252),sheenRoughness:0.80});
  rv.billMat=matt; rv.nostrils=[];
  if(!um||!lm)return;
  um.geometry=billGeo(true); lm.geometry=billGeo(false);
  um.material=matt; lm.material=matt;
  /* the nares: on the upper mandible's flank, three tenths of the way to
     the tip, thirty degrees up from the mid-line (higher and they climb
     onto the culmen — the wedge is deep and narrow) — the same profile
     that cut the wedge places them on its skin */
  const g=um.geometry, prof=g.userData.prof, t=0.30, p=prof(t), yc=(p.yT+p.yB)/2, h=(p.yT-p.yB)/2, th=0.50;
  const slitMat=new T.MeshStandardMaterial({color:0x030304,roughness:1.0,metalness:0});
  const rimMat=new T.MeshPhysicalMaterial({color:0x1e2128,roughness:0.80,metalness:0,clearcoat:0,sheen:0.25,sheenColor:new T.Color(0x2c3444),sheenRoughness:0.8});
  for(const sd of [-1,1]){
    const at=new T.Vector3(sd*p.w*Math.pow(Math.cos(th),0.85), yc+h*Math.pow(Math.sin(th),1.15), um.position.z+g.userData.z0+g.userData.L*t);
    const n=new T.Vector3(sd*Math.cos(th)*h,Math.sin(th)*p.w,0).normalize();   /* the ellipse's own normal */
    const rim=new T.Mesh(new T.SphereGeometry(1,14,10),rimMat); rim.position.copy(at).addScaledVector(n,0.00012); rim.scale.set(0.0017,0.0014,0.0040);
    const slit=new T.Mesh(new T.SphereGeometry(1,12,8),slitMat); slit.position.copy(at).addScaledVector(n,0.00075); slit.scale.set(0.0011,0.00095,0.0030);
    rim.rotation.z=sd*0.45; slit.rotation.z=sd*0.45;   /* laid along the flank's slope */
    rim.rotation.x=-0.12; slit.rotation.x=-0.12;        /* and along the culmen's fall */
    for(const o of [rim,slit]){ o.userData.rv='raven'; bill.add(o); }
    rv.nostrils.push({sd,rim,slit,b0:rim.scale.clone(),s0:slit.scale.clone()});

}
/* THE HEAD, FEATHERED (v6). the module deals eighty-eight crown and nape

   rubber ball with a few scales on it. a hundred and fifty more small
   contour cards are dealt over the whole skull here — the module's own
   card and material — sweeping back from the bill, kept off the eyes'
   sockets, the bill's root (the bristles' ground) and the chin (the
   hackles'), so the head is a feathered head. ?noheadcards. */
function headDress(){
  const T=THREE, headG=rv.headG;

  try{ const im=rv.torsoG.children.find(o=>o.isInstancedMesh); if(im)cards={geo:im.geometry,mat:im.material}; }catch(e){}
  if(!cards)return;
  const r=mulberry(20260903^0x5EED), defs=[], N=190, back=new T.Vector3(0,-0.30,-1).normalize();

    if(fim.instanceColor)fim.instanceColor.needsUpdate=true; }catch(e){}

}
function nostrilStep(M){
  if(!rv.nostrils||!rv.nostrils.length)return;

  const ap=(0.82+0.36*br)*(1+0.22*ravVoiceEnv*legPulse)*(1+(dance.on?0.10*dance.env:0));
  for(const n of rv.nostrils){
    n.slit.scale.set(n.s0.x*Math.sqrt(ap),n.s0.y*ap,n.s0.z*(0.97+0.06*br));
    n.rim.scale.set(n.b0.x*(0.96+0.08*br),n.b0.y*(0.95+0.10*br),n.b0.z);

/* ===================== THE LEGS (v4) =====================
   the artist: "the raven's legs are currently detached from body. make
   them less jointed and more realistic. the feather continue on the feet
   with bigger feathers at top to smaller feathers as get to knee cap.
   the feet should look realistic with toes etc. the legs and feet are
   more expressive during the chat."
   each leg is ONE SKIN: a tube of thirty rings swept along a spline that
   runs from a root INSIDE the belly, through the knee, to the ankle — so
   there is no hip ball hanging under the feathers and no joint anywhere,
   only a bend. the rings carry a body's profile: a full thigh tapering
   to the knee, a kneecap raised on the front, a calf swelling behind the
   shin, the ankle bones spreading at the bottom. the thigh wears
   FEATHERS — the module's own contour cards and material, dealt in rows
   that shrink from the hip to the knee — and the shin below is bare
   black skin. the foot is built from parts: heel, arch, the ball, five
   toes with nails, the two ankle bones. every leg is POSED every frame
   (legPose): the spline is re-swept from the hip's pitch and the knee's
   bend, so the skin bends without a seam. legsStep drives the pose from
   the ear's state — the whole point of "more expressive during the
   chat". LEG units are the bird's own (bodyG space). */
const LEG={L1:0.060,L2:0.050,rx:0.0150,ry:-0.022,rz:-0.0040,N:30,M:18};   /* the root is inside the belly; the knee at about −0.082, the ankle at −0.132 */
function legProfile(t){
  let rx,rz;
  if(t<0.5){ const k=Math.pow(t/0.5,0.9); rx=lerp(0.0132,0.0076,k); rz=lerp(0.0144,0.0082,k); }
  else { const u=(t-0.5)/0.5; rx=lerp(0.0076,0.0054,Math.pow(u,0.8)); rz=lerp(0.0082,0.0056,Math.pow(u,0.7)); }
  const top=0.55+0.45*ss(0,0.10,t);   /* the thigh's shoulder rounds off inside the belly */
  const calf=Math.exp(-Math.pow((t-0.64)/0.10,2)), knee=Math.exp(-Math.pow((t-0.50)/0.055,2)), ank=Math.exp(-Math.pow((t-0.97)/0.05,2));

function legBuild(s,mat,cards){
  const T=THREE, V=(x,y,z)=>new T.Vector3(x,y,z);

  const top=N*M, bot=top+1;
  for(let j=0;j<M;j++){ idx.push(top,(j+1)%M,j); idx.push(bot,(N-1)*M+j,(N-1)*M+(j+1)%M); }

       full radius (the shoulder's rounding is what showed as a ball) and

      :[[0.05,9],[0.14,9],[0.23,8],[0.32,8],[0.40,7],[0.46,6]];
    const r=mulberry(7+((s+1)*31));
    for(let ri=0;ri<rows.length;ri++){
      const tt=rows[ri][0], cnt=rows[ri][1];
      const pr=legProfile(Math.max(tt,0.10)+0.02), k=sat01(tt/0.46), hip=HIPCARDS?Math.pow(1-sat01((tt+0.06)/0.26),2):0;

        const cs=Math.cos(a), sn=Math.sin(a);
        const rad=0.96+(SLEEK?0.11:0.16)*hip;   /* v6: the ruff flares a little less (sleeker) */
        const p=V(cs*pr.rx*rad,-(tt/0.5)*LEG.L1-0.002,sn*pr.rz*rad);
        const n=V(cs/pr.rx,0,sn/pr.rz).normalize();
        const d=V(n.x*0.22,-1,n.z*0.22).normalize();
        const w=lerp(0.0118,0.0056,k)*(1+0.22*hip)*(0.9+r()*0.2), l=lerp(0.0215,0.0105,k)*(1+0.24*hip)*(0.9+r()*0.2);

    const q=new T.Quaternion(), m4=new T.Matrix4(), sc=V(), dd=V();
    for(let i=0;i<defs.length;i++){ const f=defs[i];
      dd.copy(f.d).multiplyScalar(Math.cos(f.lift)).addScaledVector(f.n,Math.sin(f.lift));
      fbasisH(dd,f.n,q); sc.set(f.w,f.l,f.l);
      fim.setMatrixAt(i,m4.compose(f.p,q,sc)); }
    fim.instanceMatrix.needsUpdate=true; fim.frustumCulled=false; thighG.add(fim);
    /* no two feathers the same grey — the module's own variance, dealt again here */
    try{ const col=new T.Color(); for(let i=0;i<defs.length;i++){ const v=0.82+r()*0.30, bl=(r()<0.25?1:0.3)*0.5;

  sph(-s*0.0040,0.0024,-0.0004,0.0024,0.0029,0.0026);        /* the inner one, higher, as it is */
  /* v5 — NO BALL AT THE BACK ("remove ball back of feet"): v4 hung a heel
     sphere behind the ankle and it read as a ball stuck on. the heel is

     hangs the old one back. */

  sph(0,-0.0058,0.0022,0.0064,0.0046,0.0140);                /* the arch and the instep, reaching back under the ankle */
  sph(0,-0.0040,-0.0008,0.0054,0.0058,0.0088);               /* the top of the foot, under the ankle, closing the back */
  sph(0,-0.0072,0.0142,0.0082,0.0036,0.0062);                /* the ball */
  const toes=[];
  const TL=[0.0082,0.0072,0.0064,0.0056,0.0046], TR=[0.0027,0.0021,0.0019,0.0018,0.0016];
  const TX=[-0.0046,-0.0018,0.0008,0.0032,0.0054], TZ=[0.0000,0.0009,0.0004,-0.0006,-0.0018], TY=[-0.04,0.03,0.09,0.16,0.24];
  const nailMat=new T.MeshPhysicalMaterial({color:0x2c2f37,roughness:0.30,metalness:0,clearcoat:0.8,clearcoatRoughness:0.2});
  for(let i=0;i<5;i++){
    const Tg=new T.Group(); Tg.position.set(s*TX[i],-0.0076,0.0150+TZ[i]); Tg.rotation.y=s*TY[i]; Tg.rotation.x=0.10;
    Tg.userData.base=0.10; Tg.userData.k=1-i*0.08;
    const cg=new T.CapsuleGeometry(TR[i],TL[i],4,10); cg.translate(0,TL[i]/2,0);
    const cap=new T.Mesh(cg,mat); cap.rotation.x=Math.PI/2; Tg.add(cap);
    const nail=new T.Mesh(new T.SphereGeometry(1,10,8),nailMat); nail.position.set(0,TR[i]*0.62,TL[i]+TR[i]*0.45);

const _fbY=new THREE.Vector3(), _fbZ=new THREE.Vector3(), _fbX=new THREE.Vector3(), _fbM=new THREE.Matrix4();
function fbasisH(d,n,q){   /* the module's own feather frame: y along the quill, z its face */
  _fbY.copy(d).normalize();

  }catch(e){}
  setTimeout(function(){ let i; try{ for(i=0;i<nodes.length;i++) nodes[i].stop(); }catch(e){} }, hard?80:800);
}
/* -- listening -- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let recog=null, finalTxt='', listenT=null, listenCap=null, listenHeard=false;
/* v4: the written door names what it wants at each stage of the rite */
const WIND_MSG={
  song:'the wind can’t carry your voice here — write your song to the raven instead',
  permission:'the wind can’t carry your voice here — write your answer: yes, or no',
  open:'the wind can’t carry your voice here — write to the raven instead'
};
function windMsg(){ return WIND_MSG[rite]||WIND_MSG.open; }
function askinPlaceholder(){ try{ askin.placeholder=(rite==='song')?'write your song here':(rite==='permission')?'yes, or no':'write to the raven'; }catch(e){} }
function showAsk(msg){
  askinPlaceholder();
  askrow.classList.add('on'); statusEl.innerHTML='';
  if(msg){ youline.innerHTML='<em>'+msg+'</em>'; }
  setTimeout(function(){ try{askin.focus();}catch(e){} },50);
}
function listenClear(){ if(listenT){clearTimeout(listenT);listenT=null;} if(listenCap){clearTimeout(listenCap);listenCap=null;} }
/* v4: for the SONG the ear stays open (continuous) — it ends on a tap of
   the raven, on a few seconds of silence after the last word, or at
   thirty seconds; every other stage takes one answer and closes. */
function startListen(){
  const song=(rite==='song');
  if(!SR){ showAsk(windMsg()); setChatStatus(chatRest()); return; }
  finalTxt=''; listenHeard=false; listenClear();
  try{
    recog=new SR();
    recog.lang=navigator.language||'en-US';
    recog.interimResults=true; recog.continuous=song; recog.maxAlternatives=1;
    recog.onresult=function(ev){
      let i; listenHeard=true;
      for(i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal) finalTxt+=ev.results[i][0].transcript+' ';
      }
      if(song){ if(listenT)clearTimeout(listenT); listenT=setTimeout(function(){ listenT=null; stopListen(); },4200); }
    };
    recog.onerror=function(ev){
      recog=null; listenClear();
      if(ev&&(ev.error==='not-allowed'||ev.error==='service-not-allowed'||ev.error==='audio-capture')){
        showAsk(windMsg());
      } else if(ev&&ev.error==='no-speech'){
        if(rite==='song'){ riteNoSong(); return; }
        youline.innerHTML='<em>…only the wind. try again.</em>';
      }
      setChatStatus(chatRest());
    };
    recog.onend=function(){
      recog=null; listenClear();
      const q2=finalTxt.trim();
      if(q2&&uiState==='listening') chatSubmit(q2);
      else if(uiState==='listening'){ if(rite==='song')riteNoSong(); else setChatStatus(chatRest()); }
    };
    recog.start();
    setChatStatus('listening');
    if(song) listenCap=setTimeout(function(){ listenCap=null; stopListen(); },30000);
  }catch(e){ recog=null; showAsk(windMsg()); setChatStatus(chatRest()); }
}
function stopListen(){ if(recog){ try{recog.stop();}catch(e){} } }
function chatHandBack(){
  try{ if(recog){ recog.abort?recog.abort():recog.stop(); } }catch(e){}
  chatStopVoice();
}
/* -- the exchange -- */
function ravenAsleep(){
  typeStopAll();   /* a walking key must not write on the sleep */
  youline.innerHTML='<em>the raven is asleep — the clocks keep counting.</em>';
}
/* THE RAVEN PASS — the head under the wing. `ravenDown` is the sleep
   itself (set once the eighth answer has been spoken); `asleep` is only
   its resting display. the care law reaches a sleeping bird: a crisis
   line wakes the override and prints on the glass exactly as it does
   awake; every other line meets the sleep. (v1 closed the ear whole in
   sleep, and the typed line with it — a person in distress after the
   eighth answer got the sleep line and nothing else.) */
let ravenDown=false;
function chatRest(){ return ravenDown?'asleep':'idle'; }

/* ===================== THE RITE (v4) =====================
   the artist: "after user touches the raven, the raven ask: 'sing me a
   song?'. update the chat so the raven intelligently acknowledges the
   song, then asks 'may i have permission to enter your skull?'. if user
   says no, then discontinue chat and it goes quiet. if user says yes,
   continue the chat and the raven says 'now look deep inside your self
   and ask yourself the deepest question you have ever wondered. don't
   speak it. echo the question inside your skull.' then the raven pauses
   until is tapped again and answers users questions or whatever with dry
   intelligent wit with bite at first. as the interactions go on they get
   melancholic then tender."
   the stages (`rite`): touch — the loop word, until the bird is touched ·
   song — "sing me a song?" is said and printed, the ear opens wide ·
   permission — the song acknowledged by the far mind (or the near one,
   dark), and the page itself asks the question, to the letter; the
   answer is read HERE, deterministically (YES_RE / NO_RE; twice unclear
   asks once more, then counts as no) · quiet — refused: the ear shuts
   for good, no line, the bird only turns its eye when touched · echo —
   granted: the instruction, said and printed · wait — the question
   echoing; nothing until the next tap · open — the conversation, the
   open turn 1..8 carried to the wire with the stage, the arc in ask.js
   (bite 1–3, melancholy 4–5, tender 6–8, then the sleep as before).
   the care law stands at every stage. every line his to red-ink. */
const SONG_ASK='sing me a song?';
const SONG_RETRY='…only the wind. sing me a song?';
const PERMISSION_Q='may i have permission to enter your skull?';
const PERMISSION_AGAIN='yes or no. may i have permission to enter your skull?';
const ECHO_LINE='now look deep inside your self and ask yourself the deepest question you have ever wondered. don\'t speak it. echo the question inside your skull.';
const YES_RE=/\b(yes|yeah|yep|yup|ya|sure|ok|okay|fine|alright|all right|of course|go ahead|you may|you can|please do|do it|granted|enter|come in|by all means|why not)\b/i;
const NO_RE=/\b(no|nope|nah|never|don'?t|do not|not|stay out|refuse|forbid|get out|keep out)\b/i;
let openTurn=0, riteSongTries=0, riteAskTries=0;
function askStop(){ if(askVoiceOn){ askVoiceOn=0; try{ chatStopVoice(); }catch(e){} } if(askWebT){clearTimeout(askWebT);askWebT=null;} typeStop(statusEl); statusEl.classList.remove('ask'); }   /* v6: the typewriter is stopped too — it went on writing the word into the status line after the rite began (seen on the slow press) */
function riteSay(text,then){
  /* a line of the rite: SPOKEN, and not printed (v6 — the artist: "remove
     the accompanying text messages that repeat the system's question").
     the one exception is a room with no voice in it at all — nothing from
     say.js, no web voice began (a voiceless browser, or ?nosnd): then the
     line is printed whole once the silence is certain, so the visitor is
     never asked a question they could not hear. */
  replyEl.classList.remove('crisis'); replyEl.classList.remove('rite'); replyEl.textContent='';
  youline.innerHTML='';
  setChatStatus('speaking');
  chatVoiceCarried=false;
  chatSpeak(text,function(){
    if(uiState!=='speaking')return;
    if(!chatVoiceCarried){ replyEl.classList.add('rite'); replyEl.textContent=text; ritePrinted++; dslog('the rite: no voice — the line printed'); }
    if(then)then(); else setChatStatus(chatRest()); });
}
let ritePrinted=0;
function riteBegin(){   /* the first touch: the loop ends for good; the bird asks for a song */
  if(rite!=='touch')return;
  rite='song'; askStop();
  try{ ravenInst&&ravenInst.gronk(1); }catch(e){}
  if(hintT){ clearTimeout(hintT); hintT=null; }
  statusEl.classList.remove('ask'); statusEl.innerHTML='';
  dslog('the rite: touched — a song is asked for');
  setTimeout(function(){ if(rite==='song')riteSay(SONG_ASK,function(){ riteListen(); }); },420);
}
function riteListen(){ askinPlaceholder(); startListen(); }
function riteNoSong(){
  riteSongTries++;
  if(riteSongTries<=2) riteSay(SONG_RETRY,function(){ riteListen(); });
  else { showAsk(WIND_MSG.song); setChatStatus('idle'); }
}
function riteSong(text){
  /* what was sung, acknowledged by the mind (stage `song`); then the
     question of permission — the page's own words, exact */
  setChatStatus('thinking'); startChatHum();
  chatBrain(text,'song').then(function(ack){
    ack=(ack||'').replace(/\?+\s*$/,'.').trim();   /* the mind does not ask; the page does */
    const line=(ack?ack+' ':'')+PERMISSION_Q;
    chatHist.push({role:'assistant',content:line});
    rite='permission';
    dslog('the rite: the song heard — permission asked');
    riteSay(line,function(){ riteListen(); });
  });
}
function ritePermission(text){
  const t=text.toLowerCase().replace(/\bno problem\b|\bnot at all\b|\bwhy not\b/g,' yes ');
  if(NO_RE.test(t)){ riteRefuse(); return; }
  if(YES_RE.test(t)){ riteGrant(); return; }
  riteAskTries++;
  if(riteAskTries<=2){ chatHist.push({role:'assistant',content:PERMISSION_AGAIN}); riteSay(PERMISSION_AGAIN,function(){ riteListen(); }); }
  else riteRefuse();
}
function riteRefuse(){
  /* "if user says no, then discontinue chat and it goes quiet." */
  rite='quiet'; chatVoid(); chatStopVoice(); typeStopAll();
  replyEl.classList.remove('rite'); replyEl.textContent='';
  askrow.classList.remove('on'); statusEl.innerHTML='';
  setChatStatus('idle');
  setTimeout(function(){ if(rite==='quiet')youline.innerHTML='<em>the raven has gone quiet.</em>'; },900);
  dslog('the rite: refused — the raven is quiet');
}
function riteGrant(){
  rite='echo';
  chatHist.push({role:'assistant',content:ECHO_LINE});
  dslog('the rite: granted — the question echoes');
  riteSay(ECHO_LINE,function(){ rite='wait'; setChatStatus('idle'); askrow.classList.remove('on'); });
}
function chatSubmit(text){
  text=(text||'').trim(); if(!text) return;
  if((uiState==='asleep'||ravenDown)&&!CRISIS.test(text)){ setChatStatus('asleep'); ravenAsleep(); return; }
  if(rite==='quiet'&&!CRISIS.test(text)) return;   /* the door is shut */
  try{ if(recog){ recog.abort?recog.abort():recog.stop(); } }catch(e){}
  listenClear();
  chatTurn++;
  replyEl.classList.remove('crisis');
  if(rite!=='song'&&rite!=='permission'){ replyEl.classList.remove('rite'); replyEl.textContent=''; }
  typeInto(youline, (rite==='song'||rite==='permission')?text.toLowerCase():asQuestion(text.toLowerCase()));
  chatHist.push({role:'user',content:text});
  if(CRISIS.test(text)){
    /* the safety override — plain words on the glass, above the aesthetic */
    chatHist.push({role:'assistant',content:SAFE});
    setChatStatus('speaking');
    replyEl.classList.remove('rite'); replyEl.classList.add('crisis'); replyEl.textContent=SAFE;
    chatSpeak(SAFE, function(){ if(uiState==='speaking') setChatStatus(chatRest()); });
    return;
  }
  if(rite==='touch'){ rite='song'; askStop(); }          /* written to before it was touched: the line is the song */
  if(rite==='song'){ riteSong(text); return; }
  if(rite==='permission'){ ritePermission(text); return; }
  if(rite==='wait'||rite==='echo') rite='open';
  openTurn++;
  setChatStatus('thinking');
  startChatHum();
  chatBrain(text,'open').then(function(reply){
    chatHist.push({role:'assistant',content:reply});
    if(chatHist.length>24) chatHist=chatHist.slice(-24);
    setChatStatus('speaking');
    /* the answer lives in the voice; the raven's bill carries it */
    chatSpeak(reply, function(){
      if(uiState!=='speaking') return;
      if(openTurn>=8){
        ravenDown=true;
        setChatStatus('asleep');
        ravenAsleep();
      } else setChatStatus('idle');
    });
  });
}
function chatTap(){
  if(ST!=='room'||!ravenLanded)return;
  try{ if(ac&&ac.state==='suspended')ac.resume(); }catch(e){}
  chatPrime();
  if(hintT){ clearTimeout(hintT); hintT=null; }
  if(rite==='quiet')return;                                   /* the door is shut; the bird only turns its eye */
  if(rite==='touch'){ if(uiState==='pre')setChatStatus('idle'); riteBegin(); return; }
  if(uiState==='idle'&&chatHinted)statusEl.textContent='';
  if(uiState==='pre')setChatStatus('idle');
  if(uiState==='asleep'){ ravenAsleep(); startListen(); return; }   /* the ear opens in sleep so the care law has a door; chatSubmit keeps the sleep for everything else */
  if(uiState==='thinking')return;
  if(uiState==='speaking'){
    chatVoid(); chatStopVoice();
    typeStopAll();
    if(rite==='song'||rite==='permission'){   /* the line cut short: the ear opens anyway (v6: nothing printed — the voice alone) */
      replyEl.textContent=''; riteListen(); return; }
    if(rite==='echo'){ replyEl.textContent=''; rite='wait'; setChatStatus('idle'); askrow.classList.remove('on'); return; }
    setChatStatus(chatRest()); return;
  }
  if(rite==='wait'){ rite='open'; try{ ravenInst&&ravenInst.gronk(1); }catch(e){} askinPlaceholder(); startListen(); return; }
  if(uiState==='idle'){ askinPlaceholder(); startListen(); }
  else if(uiState==='listening') stopListen();
}
askin.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ const v=askin.value; askin.value='';
    if(uiState==='idle'||uiState==='listening'||uiState==='asleep') chatSubmit(v); }
});
/* the tap finds the bird — a ray through the glass; only the raven is a
   thing you touch in the after, and a tap mid-listen closes the ear */
const chatRay=new THREE.Raycaster(), chatNDC=new THREE.Vector2();
canvas.addEventListener('pointerdown',function(ev){
  if(ST!=='room'||!ravenInst||!ravenLanded)return;
  try{
    const r=canvas.getBoundingClientRect();
    chatNDC.x=((ev.clientX-r.left)/r.width)*2-1;
    chatNDC.y=-((ev.clientY-r.top)/r.height)*2+1;
    chatRay.setFromCamera(chatNDC,camera);
    const hits=chatRay.intersectObject(ravenInst.hit,false);
    if(hits&&hits.length){ ravenInst.onTap(); }
    else if(uiState==='listening'){ stopListen(); }
  }catch(e){}
},{passive:true});



/* ---- the coin's own tap — the writing opens and shuts ----
   the ray is tested against the coin's invisible sphere. a tap anywhere
   else on the glass is the bird's business (its own listener, above),
   and the two objects never share a pixel. */
const coinRay=new THREE.Raycaster(), coinNDC=new THREE.Vector2();
canvas.addEventListener('pointerdown',function(ev){
  if(ST==='boot'||!coinShown)return;
  try{
    const r=canvas.getBoundingClientRect();
    coinNDC.x=((ev.clientX-r.left)/r.width)*2-1;
    coinNDC.y=-((ev.clientY-r.top)/r.height)*2+1;
    coinRay.setFromCamera(coinNDC,camera);
    const hits=coinRay.intersectObject(coinHit,false);
    if(hits&&hits.length) infoToggle();
  }catch(e){}
},{passive:true});

/* ============================ the frame ============================
   deadstar's frameStep retired with the film. what is left is three
   things a second apiece: the coin's ride and turn, the bird's small
   life, and the writing's fade. */
let lastT=performance.now(), MCLK=0, frames=0, renderDead=false;
function onRenderErr(e){
  if(renderDead)return; renderDead=true;
  dsErr('render: '+((e&&e.message)||e));
}
function frameStep(){
  requestAnimationFrame(frameStep);
  const now=performance.now();
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.1)dt=0.1; if(dt<0)dt=0;
  MCLK+=dt; frames++;
  try{ coinStep(dt,MCLK); }catch(e){ dsErr('coin: '+((e&&e.message)||e)); }
  try{ clockSoundStep(); }catch(e){}
  try{ ravenStep(dt,MCLK); }catch(e){}
  try{ infoStep(dt); }catch(e){}
  try{ renderer.render(scene,camera); }catch(e){ onRenderErr(e); }
}

/* ============================ the boot ============================
   nothing is waited for. the coin stands (at once through the phone's
   seam, over a breath if walked in cold), holds a beat at the centre
   where the tile landed, rides to the top, and begins to turn. the
   camera is asked from there, and the bird comes with it. */
const veilEl=document.getElementById('veil');
resize(); coinFit();
ravenKick();                       /* the feathers start growing immediately */
if(ENTER_TILE){ try{ veilEl.style.transition='none'; }catch(e){} }
veilEl.classList.add('gone');
coinStand();
if(INFO_Q){ try{ titleEl.classList.add('on'); }catch(e){} }
frameStep();
dslog('the room stands · coin '+COIN_TURN_S.toFixed(3)+' s a turn');

/* ======================= THE WAY BACK =======================
   one door out, wearing the house mark: the dark pulled over
   everything, then the address changes. the feed is handed back, the
   ear is closed, the voice is stopped. */
{
  const leaveEl=document.getElementById('leave'),
        leaveVeilEl=document.getElementById('leaveVeil');
  let leaving=false;
  const leaveForPhone=(ev)=>{
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    if(leaving)return; leaving=true;
    try{ if(camEl&&camEl.srcObject){
      camEl.srcObject.getTracks().forEach(t2=>{try{t2.stop();}catch(e){}});
      camEl.srcObject=null; } }catch(e){}
    try{ chatHandBack(); }catch(e){}
    try{ if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel(); }catch(e){}
    try{ if(master)master.gain.value=0; }catch(e){}
    try{ if(ac&&ac.suspend)ac.suspend(); }catch(e){}
    try{ if(leaveVeilEl)leaveVeilEl.classList.add('on'); }catch(e){}
    setTimeout(()=>{ MORTAL.go('phone.html?door=clock'); },280);
  };
  if(leaveEl)leaveEl.addEventListener('click',leaveForPhone);
}

/* ============================ console ============================ */
window.__TIME={
  state:()=>({st:ST,cam:camOn,bench:BENCH,tone:TONEMAP?'aces':'none',
    ready:true,
    coin:{shown:coinShown,ride:+coinRideK.toFixed(3),spin:+coinSpinK.toFixed(3),
      theta:+coinTheta.toFixed(3),face:(Math.cos(coinTheta)>=0?'you':'star'),
      turnS:+COIN_TURN_S.toFixed(3),r:+coinR.toFixed(4),
      y:+coinG.position.y.toFixed(4),seat:+coinYSeat.toFixed(4)},
    info:{open:infoOpen,k:+infoK.toFixed(3)},
    detail:+coinDetail.toFixed(3), glass:glassYou.visible,
    sound:{on:!!clkSnd,ac:ac?ac.state:'none',you:clkSnd?+clkSnd.gY.gain.value.toFixed(3):0,star:clkSnd?+clkSnd.gS.gain.value.toFixed(3):0},
    ask:{printed:askPrinted,said:askSaid,buf:askBuf===undefined?'unfetched':(askBuf?'say':'web'),voice:askVoiceOn,active:askActive(),word:ASK_WORD},
    raven:ravenState(),
    chat:{ui:uiState,turn:chatTurn,open:openTurn,rite,down:ravenDown},
    mirror:{on:MIRROR,live:mirrorLive(),k:+mirrorK.toFixed(3)},
    tilt:+coinTilt.toFixed(3),
    bridge:{on:BRIDGE,spin0:SPIN0,w:BRIDGE?+bridgeRateNow().toFixed(3):0,w0:+bridgeW0.toFixed(3),peak:SPIN_W,up:SPIN_UP,dec:SPIN_DEC,tau0:+bridgeTau0.toFixed(3),theta0:+bridgeTheta0.toFixed(4)},
    crack:CRACK_K, eye:EYE_R, bill:BILL_SC,
    shatter:{at:WEAR.shatter.at,x:+WEAR.shatter.x.toFixed(2),y:+WEAR.shatter.y.toFixed(2)}, pupil:PUPIL_K, wingUp:WING_UP, sleek:SLEEK,
    rite:{printed:ritePrinted,carried:chatVoiceCarried},
    frames}),
  tap:()=>{ chatTap(); return rite; },
  _t:{ ui:s=>{ setChatStatus(s); return uiState; }, rite:r=>{ if(r)rite=r; return rite; } },
  info:v=>{ infoToggle(v===undefined?undefined:!!v); return infoOpen; },
  detail:k=>{ detailHeld=(k==null)?null:sat01(+k); return coinDetail; },
  glance:()=>{ ravenGlanceNow(); return true; },
  dance:(n,stage)=>{ if(!ravenInst||!ravenLanded)return false; if(dance.on)danceEnd(); if(stage!=null)dance.stage=Math.max(0,Math.min(4,+stage|0)); danceBegin((n==null)?-1:(+n|0)); return dance.name; },   /* v6: the rig's hand — a dance now (v6.1: at a rung) */
  ask:()=>{ askBeat(); return askActive(); },
  wake:()=>{ wakeAudio(); try{ if(ST==='room')clockSoundStart(); }catch(e){} return !!ac; },
  spin:r=>{ if(r!=null){ coinTheta=r%6.283185; coinG.rotation.y=coinTheta; coinRepaint(); }
    return coinTheta; },
  freeze:v=>{ coinFrozen=(v===undefined)?true:!!v; return coinFrozen; },
  seat:()=>{ /* the rig's hand: land the coin and open the room now */
    if(!coinShown)coinStand();
    coinRideK=1; coinSeatApply(); coinSeated(); return true; },
  say:txt=>{ try{ chatSubmit(String(txt||'')); }catch(e){} },
  hist:()=>chatHist.map(m=>({role:m.role,content:m.content})),
  _p:{scene,camera,coin:coinG,mesh:coinMesh,hit:coinHit,
    faces:{you:cvYou,star:cvStar},glass:{you:glassYou,star:glassStar,mat:matGlass,room:roomTex},glassSag:GLASS_SAG,
    dial:dialG,hands:{hour:handHour,min:handMin,sec:handSec},
    raven:()=>ravenInst,ravenG,rv,glance,legs:legAnim,dance,
    lights:{hemi,key,rim}}
};
