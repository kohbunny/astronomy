THE CAVE PASS (25 sep 2026 — his word: `would like to update the treehouse
squat so its deep underground in a cave room instead … because the room is
now underground to use the room architecture in eggprison.html instead.
remove all the things in the current room except for the toilet (but disable
access to the submarine.html) and the crank system that turns to reveal the
exterior … make it so when it reveals the exterior to be magma and black
rock. update how the records are presented as well so they are knot on the
rack but a pile that magically shows the current album when user taps pile
to choose. the user can still write but in future an ai agent will be
introduced to this room.` and, RULED the same night: `put back the stove and
so we can keep its tile on phone.html`; build squat-20260925a).

what this is now: THE SQUAT is a CAVE deep in the rock. the treehouse is
gone — its deck, its roof, the earth and the moon below, the door, the
window, the walkie, the tank and the fridge, the clock, the table, the
chess, the bonsai, the book, the blanket, the lamp, the peanuts, the carrot,
the egg, the joint, the pot. the far room (the-squat.sql, UNCHANGED) still
sends their rows; the room hides them (RETIRED) and never places them.
the ROCK (CAVE) is the egg prison's own hollow, ported: a sphere pulled
into an egg (R 2.15, y × 1.32, its centre at 1.30), lumped by ridged noise
with beds of strata, cut off flat at the floor; black basalt, drawn by the
kit's noise (albedo, normal, roughness), stalactites off the dome; the
FLOOR the same rock laid flat, split by FISSURES with magma glowing up
through them (the room's light with the stove's — three orange lamps stand
in the biggest cracks, and the walls' lowest band shows the same heat in
veins). the marks (prints, ash, matches, the broom) are pale ash-dust on
the black rock. what stands: the WOODSTOVE (north, his ravenstove.mp4,
the fire in its firebox, the matchbox at its foot — put back, RULED, so its
tile on phone.html keeps its live fire; the sheets feed it); the TOILET
(west-south-west, the egg prison's own build, ported line for line: the
pod out of the rock, the seat down, the flap up, the flush button beside
it; the flush is a swirl, a sound and a breath of STEAM off the heat — its
leave to submarine.html is DISABLED); the CRANK (east-north-east: an iron
bracket bolted to the rock, a spoked wheel, a crank with a wooden grip;
tap it and the crank goes round, the wheel takes a charge, and THE ROCK
UNKNITS from the floor up in a hot rim — the egg prison's reveal, its
blue-white turned to heat — until every wall and the dome are gone and
THE MAGMA WORLD stands round the floor: a sea of magma far below, plates
of black crust on it and bright cracks between, the far walls of black
rock lit from below and streaked with heat, three lava falls, embers
rising, the magma's light under everything; the wheel runs down and the
rock knits again; the charge is the room's, on the tap's row); the RECORD
PLAYER on a flat boulder (south-east) and the six sleeves in a PILE on the
floor beside it (tap the pile: the next album's sleeve rises out of it,
turns to face you and hangs in the air, lit from under, its record on the
platter playing; tap the pile again for the next; tap the risen sleeve to
lift the needle); the WRITING on a flat slab of rock (east): the pencil,
the pile of sheets, the keyboard, the leaf and the page as before.
the arrival is the matchbox landing of 21 sep, unchanged: the box, the
drawer, the note, the taped match; the tap strikes it and carries it to
the cold stove; the fire takes, and the cave comes up round it (the
fissures' glow, then the walls). ?enter=sink is the sinkhole's own flag
(phone.html's new door, THE SINKHOLE): it wakes on the same landing.
the agent's seat (his word: an ai agent will be introduced to this room in
future): nothing in this file stands in for it, listens for it or wears
its name — it will come through the one doorway in mortal.js, like every
room's; what it might do here is the writing's (read the slab, leave a
sheet, feed one to the stove) — see DESK.

/* ---------------- SILVER — the colour law, by material ----------------

  const S={ on:false, stream:null, video:el('cam'), asked:false, want:FLAGS.cam!=='off', fix:Q.get('camfix')||'', busy:false };
  function stop(s){ if(!s) return; try{ s.getTracks().forEach(t=>t.stop()); }catch(_){} }
  function askCam(ms){ return new Promise((res,rej)=>{ let done=false; const t=setTimeout(()=>{ if(!done){ done=true; rej(0); } },ms||6000);

      .then(s=>{ clearTimeout(t); if(done){ stop(s); return; } done=true; res(s); }).catch(e=>{ clearTimeout(t); if(!done){ done=true; rej(e); } }); }); }
  async function up(){ if(S.on||!S.want||S.busy) return S.on; S.busy=true; S.asked=true;
    try{ const s=await askCam(6000); S.stream=s; S.video.srcObject=s; try{ await S.video.play(); }catch(_){}
      S.video.classList.add('on'); S.on=true; }   /* THE MATCHBOOK PASS: the glass stays black — the feed is the window's, knot the room's */

   a sprig's wilt, a fish's return, the record's phase, the cat's day. every

  function fishStill(t){ if(t.kind!=='fish') return 0; const o=T.ms(S(t,'out',null)); if(!isFinite(o)) return 0; return clamp((now()-o)/1000/LAWS.FISH_STILL,0,1); }

  /* the cat's day: four visits, seeded by the day, an hour apart at least; ?cat=now begins one two seconds in; ?cat=off none */
  const _visits={};

    while(out.length<4&&tries++<200){ const s=Math.floor(rr()*86400); if(out.every(o=>Math.abs(o.s-s)>3600)) out.push({ s, dir:rr()*TAU, seed:rr() }); }

/* ---------------- HOUSE — the treehouse's own things (THE TREEHOUSE, 18 sep) ----------------
   the can, the bowl of peanuts, the chess game, the blanket, the lamp and
   the walkie talkie have NO rows in the-squat.sql. each is a row in THIS
   phone's ledger (local: a full read never deletes it), and its state
   rides the far room on the tap's row — the tap is gone, its row is the
   house's page: state.h_<id> = { place, x, y, a, holder, state, at },
   written by one fold each (squat_act 'fold', p_states — shallow-merged
   by squat_fold, at most 2 kB a patch) and read back off every merge of
   the tap row. the newest `at` wins; a hand that held one and died lets go
   after HOUSE_HELD. ?house=local keeps them in this phone only. */
const HOUSE=(function(){
  const ROW='tap';
  const START='rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR';
  /* THE CAVE (25 sep): the house things of the treehouse are gone; one house thing remains — the CRANK's charge (q at the time at; see CRANK) */
  const HOME={
    crank:{ kind:'crank', place:'fixed', x:0, y:0, a:0, state:{ q:0, at:null } }
  };
  const IDS=Object.keys(HOME);
  const is=(id)=>!!HOME[id];
  function seed(){ IDS.forEach(id=>{ if(LEDGER.get(id)) return; const h=HOME[id]; const st=JSON.parse(JSON.stringify(h.state)); if(id==='lamp'){ st.at=T.iso(); if(FLAGS.lamp!=null&&FLAGS.lamp!=='') st.q=clamp(+FLAGS.lamp||0,0,1); }
    LEDGER.room.things[id]={ id, kind:h.kind, place:h.place, x:h.x, y:h.y, a:h.a, seat:null, tx:null, tz:null, state:st, since:T.iso(), ver:0, held:false, mine:false, holder:null, local:true, house:true, hat:null }; });
    if(FLAGS.lamp!=null&&FLAGS.lamp!==''){ const l=LEDGER.get('lamp'); if(l){ l.state.q=clamp(+FLAGS.lamp||0,0,1); l.state.at=T.iso(); } } }
  function home(id){ const t=LEDGER.get(id), h=HOME[id]; if(!t||!h) return; Object.assign(t,{ place:h.place, x:h.x, y:h.y, a:h.a, holder:null, held:false, mine:false }); }

    const vat=T.ms(v.at); if(t.hat&&isFinite(vat)&&vat<=T.ms(t.hat)) return;
    t.place=v.place||t.place; t.x=v.x==null?t.x:+v.x; t.y=v.y==null?t.y:+v.y; t.a=v.a==null?t.a:+v.a; if(v.state&&typeof v.state==='object') t.state=Object.assign({},t.state,v.state);
    t.holder=v.holder||null; t.held=!!v.holder; t.mine=!!v.holder&&v.holder===LEDGER.device(); t.hat=v.at||t.hat; t.since=v.at||t.since;
    if(t.place==='hand'&&!t.mine&&(!isFinite(vat)||T.now()-vat>LAWS.HOUSE_HELD*1000)) home(id);

  function push(id,keep){ const t=LEDGER.get(id); if(!t) return Promise.resolve(null); t.hat=T.iso(); t.since=t.hat; LEDGER.room.rev++;
    const v={ place:t.place, x:t.x, y:t.y, a:t.a, holder:t.holder||null, state:t.state, at:t.hat }; const st={}; st['h_'+id]=v; const states={}; states[ROW]=st;

  function take(id){ const t=LEDGER.get(id); if(!t) return Promise.resolve(null); t.place='hand'; t.holder=LEDGER.device(); t.held=true; t.mine=true; t.held_at=T.iso(); t.seat=null; return push(id); }

  function set(id,patch){ const t=LEDGER.get(id); if(!t) return Promise.resolve(null); Object.assign(t.state,patch); return push(id); }
  LEDGER.on('thing',(r)=>{ if(r&&r.id===ROW) hydrate(r); });
  LEDGER.on('sweep',()=>{ const p=LEDGER.get('peanuts'); if(p&&((p.state.left|0)<LAWS.PEANUTS||(p.state.shells||[]).length)){ p.state.left=LAWS.PEANUTS; p.state.shells=[]; push('peanuts'); } });

})();
/* ---------------- THINGS — the registry ----------------
   every kind registers a builder (a Group with its meshes, base at y=0),
   optionally a ticker (per frame), and its poses (how it lies, how it
   stands in a seat, how it sits in the hand). every PLACE registers an
   anchor: where the k-th thing at that place goes. placeAll() sets a
   target for every row the ledger holds; tick() walks each group toward
   its target (a record sliding to the platter, a page lifting into the

import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const EUL=(x,y,z)=>new THREE.Euler(x||0,y||0,z||0);
function mesh(g,m,o){ const me=new THREE.Mesh(g,m); o=o||{}; me.castShadow=o.cast!==false; me.receiveShadow=o.receive!==false; if(o.name) me.name=o.name; return me; }
function tube(pts,r,seg,rad){ const c=new THREE.CatmullRomCurve3(pts.map(p=>V3(p[0],p[1],p[2]))); return new THREE.TubeGeometry(c,seg||24,r,rad||10,false); }
function rbox(w,h,d,r,m,seg){ return mesh(new RoundedBoxGeometry(w,h,d,seg||3,r),m); }
/* a rock: an icosphere pushed about by noise */
function rock(r,seed,m){ const g=new THREE.IcosahedronGeometry(r,LOW?2:3); const p=g.attributes.position; const rr=rng(seed); const k=[rr()*7+3,rr()*7+3,rr()*7+3], ph=[rr()*9,rr()*9,rr()*9]; const sx=1+0.25*(rr()-0.5);
  for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i); const n=0.78+0.22*Math.sin(x*k[0]+ph[0])*Math.cos(y*k[1]+ph[1])+0.12*Math.sin(z*k[2]+ph[2]); p.setXYZ(i,x*n*sx,y*n*0.7,z*n); }
  g.computeVertexNormals(); return mesh(g,m); }
/* the direction of a ring seat: angle a from north (−z), clockwise seen from above */
const ringPos=(a,r,y)=>V3(Math.sin(a)*(r==null?RING:r),y||0,-Math.cos(a)*(r==null?RING:r));
const DIR={ N:0, NE:Math.PI/4, E:Math.PI/2, SE:Math.PI*3/4, S:Math.PI, SW:-Math.PI*3/4, W:-Math.PI/2, NW:-Math.PI/4 };
const faceIn=(a)=>EUL(0,-a,0);   /* a group at ring angle a, turned so its local +z looks at the centre */
/* THE TREEHOUSE: kinds the far room still sends rows for but the room no longer has (the wine bottle, the cat's bowl) — never built, never placed */
const RETIRED={ bottle:1, bowl:1, pot:1, carrot:1, egg:1, glass:1, joint:1, pouch:1, ashtray:1, vessel:1, bonsai:1, scissors:1, bone:1, fish:1, book:1, clock:1, page:1, snip:1, sprig:1, can:1, peanuts:1, chess:1, blanket:1, lamp:1, walkie:1 };   /* THE CAVE: everything the treehouse had and the cave has knot — the far room still sends their rows; never built, never placed */
const THINGS=(function(){
  const groups={}, builders={}, tickers={}, poses={}, anchors={}, spare={};
  let hits=[], hitsDirty=true;
  function tag(g,id){ g.traverse(o=>{ if(o.isMesh){ o.userData.thing=id; } }); }
  function build(t){ const b=builders[t.kind]; let g; try{ g=b?b(t):null; }catch(e){ log('build '+t.kind,e); g=null; }
    if(!g){ g=new THREE.Group(); g.add(mesh(new THREE.SphereGeometry(0.03,12,8),KIT.mat.dark())); }
    g.userData.kind=t.kind; g.userData.id=t.id; g.userData.tgt=null; g.userData.fresh=true; tag(g,t.id); groups[t.id]=g; world.add(g); hitsDirty=true; return g; }
  function group(t){ return groups[t.id]||build(t); }
  function pose(kind,which){ const p=poses[kind]||{}; return p[which]||{ rot:[0,0,0] }; }
  function target(g,parent,pos,rot,scale){ const tg=g.userData.tgt||(g.userData.tgt={ parent:null, pos:new THREE.Vector3(), q:new THREE.Quaternion(), s:1 });
    tg.parent=parent; tg.pos.copy(pos); if(rot&&rot.isQuaternion) tg.q.copy(rot); else tg.q.setFromEuler(rot||EUL()); tg.s=scale==null?1:scale; }
  const byPlace={};
  function placeAll(){
    Object.keys(byPlace).forEach(k=>{ byPlace[k].length=0; });
    LEDGER.things().forEach(t=>{ if(RETIRED[t.kind]) return; let p=t.place; if(CLOCKS.fishIn(t)) p='tank'; (byPlace[p]||(byPlace[p]=[])).push(t); });
    Object.keys(byPlace).forEach(p=>{ const list=byPlace[p]; list.sort((a,b)=>(T.ms(a.since)-T.ms(b.since))||(a.id<b.id?-1:1));
      list.forEach((t,i)=>{ if(RETIRED[t.kind]){ const rg=groups[t.id]; if(rg) rg.visible=false; return; } const g=group(t); if(THINGS.benchId){ if(t.id===THINGS.benchId) return; g.visible=false; return; } const hidden=(p==='gone')||(p==='hand'&&!t.mine)||(p==='fixed'); g.visible=!hidden; if(hidden) return;
        const ovf=THINGS.override&&THINGS.override[t.id]; const ov=ovf?ovf(t):null; if(ov){ target(g,ov.parent||world,ov.pos,ov.rot,ov.scale); return; }
        const an=anchors[p]; if(!an){ g.visible=false; return; } const a=an(t,list,i); if(!a){ g.visible=false; return; }
        target(g,a.parent||world,a.pos,a.rot,a.scale); }); });
    LEDGER.things().forEach(t=>{ if(t.place==='gone'){ const g=groups[t.id]; if(g) g.visible=false; } });
    Object.keys(groups).forEach(id=>{ if(!LEDGER.get(id)){ const g=groups[id]; if(g.parent) g.parent.remove(g); delete groups[id]; hitsDirty=true; } });
  }
  const tmpV=new THREE.Vector3(), tmpQ=new THREE.Quaternion();
  function tick(dt){
    const k=1-Math.exp(-dt*9);
    Object.values(groups).forEach(g=>{ const tg=g.userData.tgt; if(!tg||!g.visible) return;
      if(g.parent!==tg.parent){ tg.parent.attach(g); g.userData.fresh=false; hitsDirty=true; }
      if(g.userData.fresh){ g.userData.fresh=false; g.position.copy(tg.pos); g.quaternion.copy(tg.q); g.scale.setScalar(tg.s); return; }
      g.position.lerp(tg.pos,k); g.quaternion.slerp(tg.q,k); g.scale.lerp(tmpV.setScalar(tg.s),k); });
    LEDGER.things().forEach(t=>{ const g=groups[t.id]; if(!g||!g.visible) return; if(RETIRED[t.kind]) return; const f=tickers[t.kind]; if(f){ try{ f(t,g,dt); }catch(e){ if(!g.userData.erred){ g.userData.erred=true; log('tick '+t.kind,e); } } } });
  }
  function hitList(){ if(hitsDirty){ hits=[]; world.traverse(o=>{ if(o.isMesh&&o.visible&&(o.userData.thing||o.userData.place)) hits.push(o); }); hand.traverse(o=>{ if(o.isMesh&&o.userData.thing) hits.push(o); }); hitsDirty=false; } return hits; }
  function dirtyHits(){ hitsDirty=true; }
  return { groups, builders, tickers, poses, anchors, group, build, pose, placeAll, tick, hitList, dirtyHits, byPlace, override:{}, benchId:null };
})();
/* a place mesh: something you can tap to put a thing there (a table top, a basin, the pit's floor) */
function placeTag(o,place){ o.traverse(m=>{ if(m.isMesh) m.userData.place=place; }); return o; }

/* ================================================================
   SECTION: FIRE — the fire itself, in the woodstove's firebox (THE
   TREEHOUSE: the campfire is gone; the pit IS the firebox). the flames
   (billboard quads with a noise-torn ramp, additive), the glow, a few
   sparks behind the door, the smoke from the pipe's top, and the fire's
   own light. the fuel clock is the ledger's (CLOCKS.fire). the pit is a
   place: a thing put here waits for a match when the fire is cold; the

const FIRE=(function(){
  const g=new THREE.Group(); g.position.set(0,0.4,-RING); world.add(g);
  const C=g.position;   /* the firebox, in the world (the sound bed, the spill) */

  LEDGER.wake(); HANDS.entryPrints();
  if(!ARRIVAL.on){ HANDS.idle(); setTimeout(firstHint,Math.max(300,(FLAGS.reveal>0?4500*FLAGS.reveal:300))); }
  PRESS.ready=true; }
/* THE MATCHBOOK (18 sep, later): the tap on the held last frame. the film
   fades to the black it stands on; the match it showed is drawn by code
   where it lay in the frame (?mbhx ?mbhy its head, ?mbtx ?mbty its tail —
   fractions of the FILM's frame, from its left and top; the film's place
   on the glass is worked out from its own size and its fit) and glides to
   where the 3d match waits in the hand; then the boot lifts on the dark
   room (REVEAL.dark — nothing lit), the stove straight ahead (LOOK.face),
   the match in hand (ARRIVAL.hold). */
function drawMatch2d(q,hx,hy,tx,ty,alpha){ if(window.__squatDrawMatch){ window.__squatDrawMatch(q,hx,hy,tx,ty,alpha); return; } const dx=hx-tx, dy=hy-ty, len=Math.hypot(dx,dy)||1, a=Math.atan2(dy,dx); q.save(); q.globalAlpha=alpha; q.translate(tx,ty); q.rotate(a);
  const th=len*0.052; const gr=q.createLinearGradient(0,-th/2,0,th/2); gr.addColorStop(0,'#a98a5e'); gr.addColorStop(0.45,'#8a6a42'); gr.addColorStop(1,'#4e3a24'); q.fillStyle=gr; q.fillRect(0,-th/2,len*0.93,th);
  q.strokeStyle='rgba(40,28,16,0.35)'; q.lineWidth=Math.max(1,th*0.08); for(let i=0;i<3;i++){ q.beginPath(); q.moveTo(len*0.04,-th*0.3+i*th*0.28); q.lineTo(len*0.9,-th*0.26+i*th*0.3); q.stroke(); }
  const rx=len*0.10, ry=len*0.066; const hg=q.createRadialGradient(len-rx*0.9,-ry*0.35,ry*0.1,len-rx*0.8,0,rx*1.25); hg.addColorStop(0,'#f06a58'); hg.addColorStop(0.35,'#cf3a2e'); hg.addColorStop(1,'#7a1712'); q.fillStyle=hg; q.beginPath(); q.ellipse(len-rx*0.8,0,rx,ry,0,0,TAU); q.fill(); q.restore(); }
/* THE MATCHBOX (21 sep): the tap on the taped match. drawn on the boot's 2d canvas, over the landing: the match comes
   off its tape, goes up to the box's striker strip, is drawn along it (sparks; the strike sounds — the first sound
   the page makes, on the gesture that woke it), flares, and is lifted away lit while the box, the drawer and the note
   go back into the dark; it glides to where the 3d match waits in the hand; the boot lifts on the dark room
   (REVEAL.dark), the stove straight ahead (LOOK.face), and the lit match is carried to the firebox by itself
   (ARRIVAL.hold → ?autolight=1). with no landing (the old boot: ?media=off, or the landing's script failed) the
   match appears in the middle of the glass, flares there, and goes the same way. */
function drawFlame2d(q,x,y,size,k,t){ if(k<=0.01) return; const fl=0.9+0.1*Math.sin(t*31)+0.06*Math.sin(t*17.3); const h=size*(0.9+0.5*k)*fl, w=size*0.42*(0.8+0.3*k); q.save(); q.globalCompositeOperation='lighter';
  const gg=q.createRadialGradient(x,y-h*0.35,0,x,y-h*0.35,size*3.2); gg.addColorStop(0,'rgba(255,170,80,'+(0.34*Math.min(1,k))+')'); gg.addColorStop(0.4,'rgba(255,110,40,'+(0.12*Math.min(1,k))+')'); gg.addColorStop(1,'rgba(255,80,20,0)'); q.fillStyle=gg; q.fillRect(x-size*3.2,y-h*0.35-size*3.2,size*6.4,size*6.4);
  const sway=Math.sin(t*6.1)*w*0.18; const body=(ww,hh,c0,c1,c2)=>{ const g=q.createLinearGradient(0,y,0,y-hh); g.addColorStop(0,c0); g.addColorStop(0.5,c1); g.addColorStop(1,c2); q.fillStyle=g; q.beginPath(); q.moveTo(x-ww/2,y); q.bezierCurveTo(x-ww*0.62,y-hh*0.35,x-ww*0.2+sway,y-hh*0.6,x+sway,y-hh); q.bezierCurveTo(x+ww*0.2+sway,y-hh*0.6,x+ww*0.62,y-hh*0.35,x+ww/2,y); q.closePath(); q.fill(); };
  body(w,h,'rgba(255,90,20,0.85)','rgba(255,150,40,0.8)','rgba(255,220,120,0)'); body(w*0.6,h*0.7,'rgba(255,200,90,0.9)','rgba(255,240,190,0.85)','rgba(255,255,230,0)'); body(w*0.3,h*0.34,'rgba(120,160,255,0.55)','rgba(255,255,240,0.6)','rgba(255,255,255,0)'); q.restore(); }
function matchbookLeave(){
  const boot=el('boot'), cv=el('mbmatch'), mb=window.__squatMB||null; const W=VW(), H=VH(), dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); const q=cv.getContext('2d'); q.setTransform(dpr,0,0,dpr,0,0);
  const live=!!(mb&&mb.live&&mb.ends);
  let A;   /* [hx,hy,tx,ty] where the match lies on the glass */
  if(live){ const e0=mb.ends(); A=[e0.hx,e0.hy,e0.tx,e0.ty]; } else A=[W*0.5+Math.min(W,H)*0.2,H*0.46,W*0.5-Math.min(W,H)*0.2,H*0.54];
  const Lm=Math.hypot(A[0]-A[2],A[1]-A[3]);
  const strip=live?mb.strip():null; const pose=(hx,hy,deg)=>{ const a=deg*Math.PI/180; return [hx,hy,hx+Lm*Math.cos(a),hy-Lm*Math.sin(a)]; };
  const B=strip?pose(strip.x0,strip.y,58):A.slice(), C=strip?pose(strip.x1,strip.y,38):A.slice();
  const Dp=[W*0.5+Lm*0.10,H*0.46-Lm*0.45,W*0.5-Lm*0.10,H*0.46+Lm*0.45];
  try{ window.__squatBootFireOff(); }catch(_){} try{ el('bootline').style.display='none'; const bf=el('bootfire'); bf.style.transition='opacity .6s ease'; bf.style.opacity='0'; }catch(_){}
  if(live){ try{ mb.leave(); }catch(_){} }
  ARRIVAL.show(); const e=ARRIVAL.ends(); const E=[e.head.x,e.head.y,e.tail.x,e.tail.y];
  const TS=strip?0.80:0.30, TE=TS+0.24;   /* the strike: from, to */
  /* between two lies of the match: its middle, its angle (the short way round) and its length — never its two ends apart (a match does knot shrink as it turns) */
  const mix=(P,Q,k)=>{ const pc=[(P[0]+P[2])/2,(P[1]+P[3])/2], qc=[(Q[0]+Q[2])/2,(Q[1]+Q[3])/2]; const pa=Math.atan2(P[1]-P[3],P[0]-P[2]), qa=Math.atan2(Q[1]-Q[3],Q[0]-Q[2]); let da=qa-pa; while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU; const a=pa+da*k; const pl=Math.hypot(P[0]-P[2],P[1]-P[3]), ql=Math.hypot(Q[0]-Q[2],Q[1]-Q[3]), l=(pl+(ql-pl)*k)/2; const cx=pc[0]+(qc[0]-pc[0])*k, cy=pc[1]+(qc[1]-pc[1])*k; return [cx+Math.cos(a)*l,cy+Math.sin(a)*l,cx-Math.cos(a)*l,cy-Math.sin(a)*l]; };
  const sparks=[]; let struckSaid=false, faded=false, lifted=false; const t0=performance.now(); let lastT=0, frozen=false;
  function step(){ if(frozen) return; const t=(performance.now()-t0)/1000, dt=Math.min(0.05,t-lastT); lastT=t; draw(t,dt); if(t<TE+3.4&&!gone) requestAnimationFrame(step); }
  function draw(t,dt){
    let p; if(t<TS) p=mix(A,B,sstep(0.22,TS,t)); else if(t<TE){ const k=(t-TS)/(TE-TS); p=mix(B,C,k*k); const hx=B[0]+(C[0]-B[0])*k*k, hy=B[1]+(C[1]-B[1])*k*k; const ox=hx-p[0], oy=hy-p[1]; p=[hx,hy,p[2]+ox,p[3]+oy]; }   /* the head stays on the strip */ else if(t<TE+0.75) p=mix(C,Dp,sstep(TE,TE+0.75,t)); else p=mix(Dp,E,sstep(TE+1.05,TE+2.15,t));
    const lift=t<TS?Math.sin(sstep(0.0,TS,t)*Math.PI)*-0.02*H:0;
    if(t>=TS&&!struckSaid){ struckSaid=true; try{ SOUND.hit('strike',camera.position.clone().add(V3(0,-0.1,-0.5))); }catch(_){} }
    if(t>=TS&&t<TE+0.05){ for(let i=0;i<3;i++) sparks.push({ x:p[0], y:p[1], vx:-(60+Math.random()*240), vy:-(30+Math.random()*190), l:0.25+Math.random()*0.35, a:1 }); }
    if(t>=TE+0.12&&!faded){ faded=true; if(live){ try{ mb.fade(); }catch(_){} } }
    q.clearRect(0,0,W,H);
    /* the streak the head leaves on the strip */
    if(strip&&t>=TS&&t<TE+0.5){ const k=clamp((t-TS)/(TE-TS),0,1), a=clamp(1-(t-TE)/0.5,0,1); const g=q.createLinearGradient(B[0],0,B[0]+(C[0]-B[0])*k*k,0); g.addColorStop(0,'rgba(255,120,40,0)'); g.addColorStop(1,'rgba(255,200,120,'+(0.75*a)+')'); q.save(); q.globalCompositeOperation='lighter'; q.strokeStyle=g; q.lineWidth=Math.max(2,Lm*0.018); q.lineCap='round'; q.beginPath(); q.moveTo(B[0],strip.y); q.lineTo(B[0]+(C[0]-B[0])*k*k,strip.y); q.stroke(); q.restore(); }
    q.save(); if(t<TS+0.1){ q.shadowColor='rgba(0,0,0,0.85)'; q.shadowBlur=10; q.shadowOffsetY=6; } drawMatch2d(q,p[0],p[1]+lift,p[2],p[3]+lift,1); q.restore();
    /* the head chars once it has burned a moment */
    if(t>TE+0.5){ const k=clamp((t-TE-0.5)/0.8,0,1); const dx=p[0]-p[2], dy=p[1]-p[3], len=Math.hypot(dx,dy)||1; q.save(); q.globalAlpha=0.85*k; q.translate(p[2],p[3]); q.rotate(Math.atan2(dy,dx)); q.fillStyle='#16110d'; q.beginPath(); q.ellipse(len*0.92,0,len*0.09,len*0.058,0,0,TAU); q.fill(); q.restore(); }
    const fk=t<TE-0.04?0:(t<TE+0.2?(t-TE+0.04)/0.24*1.8:(1+0.8*Math.exp(-(t-TE-0.2)*4))); drawFlame2d(q,p[0],p[1]+lift-Lm*0.03,Lm*0.2,fk,t);
    q.save(); q.globalCompositeOperation='lighter'; for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.l-=dt; if(s.l<=0){ sparks.splice(i,1); continue; } s.vy+=520*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; q.fillStyle='rgba(255,'+(150+Math.random()*90|0)+',70,'+Math.min(1,s.l*3)+')'; q.fillRect(s.x,s.y,2.2,2.2); } q.restore();
    if(t>=TE+2.05&&!lifted){ lifted=true; boot.classList.add('off'); REVEAL.dark(); LOOK.face(0); ARRIVAL.hold(); setTimeout(()=>{ try{ if(mb&&mb.remove) mb.remove(); }catch(_){} try{ q.clearRect(0,0,W,H); }catch(_){} },1300); }
  }
  step();
  PRESS.matchbook={ p0:A, p1:E, strip, live, TS, TE, at:(t)=>{ frozen=true; for(let k=0;k<6;k++) draw(t-0.1+k*0.02,0.02); }, get lifted(){ return lifted; }, get struck(){ return struckSaid; } };
}
function onBootTap(){ const mb=window.__squatMB;
  if(ARRIVAL.on&&mb&&mb.live) return;   /* the landing takes its own taps: only the match comes in */
  el('boot').removeEventListener('click',onBootTap); enter(); }
async function boot(){
  sizeUp();
  el('boot').addEventListener('click',onBootTap);
  { const mb=window.__squatMB; if(ARRIVAL.on&&mb&&mb.live&&mb.arm) mb.arm(()=>{ enter(); }); }   /* THE MATCHBOX: the tap on the taped match is the door */
  const bootP=LEDGER.boot(); HOUSE.seed(); THINGS.placeAll(); frame(); try{ window.__squatWake(); }catch(_){}
  await bootP; HOUSE.seed(); HOUSE.hydrate(); THINGS.placeAll(); SWEEP.restamp(); SWEEP.check(); BENCH.begin();
  /* the press's fire: ?fire=lit|out|embers sets the fire's row here before anything is read back */
  if(FLAGS.fire){ const f=LEDGER.get('fire'); if(f){ const n=T.now(); if(FLAGS.fire==='lit'){ f.state.until=T.iso(n+1800000); f.state.lit=T.iso(n-60000); f.state.fed=T.iso(n-30000); } else if(FLAGS.fire==='embers'){ f.state.until=T.iso(n-120000); f.state.lit=T.iso(n-3600000); } else { f.state.until=null; } } }
  const bl=el('bootline'); if(!entered) bl.innerHTML=(LEDGER.communal()?'the squat':'the squat · a room of one')+'\n\n<b>tap to come in</b>';
  if(FLAGS.silent) setTimeout(()=>enter(),50);
}
window.addEventListener('pagehide',()=>{ gone=true; });
/* THE MORTALITY CARD, rule 7: the death call — the room goes quiet (see SOUND.hush) */
window.addEventListener('apwnp:call',function(){ try{ SOUND.hush(); }catch(_){} },false);
boot().catch(e=>{ log('boot',e); try{ el('bootline').textContent='the room did knot wake · '+(e&&e.message||e); }catch(_){} });
</script>
