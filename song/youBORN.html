<script src="mortal.js"></script>
<script>
window.MORTAL=window.MORTAL||{ organ:'', href:location.href, search:location.search, hash:location.hash,
  path:location.pathname, go:function(u){ location.href=u; } };
</script>

<script>
/* ---- THE TOMBSTONE REPLACES. ALWAYS. ----------------------------------

   if it PUSHED, this file would stand in the tab's history behind the room

  var M=window.MORTAL||{};
  var to='bornHUB.html'+(M.search||'')+(M.hash||'');
  try{ to=new URL(to,M.href||location.href).href; }catch(_){}
  setTimeout(function(){
    try{ location.replace(to); }catch(_){ try{ location.href=to; }catch(__){} }
  },420);
})();
</script>
