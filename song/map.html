what this file is, in one breath: the maps tile's map, and his drawing made exact and alive. two circles side by side,
each 511.9 light years across, meeting in a thin lens. the far rim of one is HER (psr j0437−4715, 511.9 light years off,
in pictor); the far rim of the other is the point as far the other way (EQUIDISTANT, in hercules). the lens where they
meet is THE EYE; its waist is THE EARTH; and the black point on the earth is THE WELL (33.133219° n 115.666223° w — the
dust camera at the vail drain, on the dry shore of the salton sea). the map breathes on its own: the whole figure → the
pupil → the well's country, where the same figure lies on the ground (the old lake's two stones, the music room's own)
→ into the well, where it turns in the black and opens again on the whole figure.

THE SCALE (the picture is knot to scale between the earth and her, and says how): his drawing of 11 oct has three
anchors — the earth is the lens's waist (drawn true: the earth's radius is the map's half-unit), her is the far rim of
her circle (a circle's diameter from the earth, as he lettered it: EARTH TO PULSAR DISTANCE, 511.9 light years), and
the lens's rim is THE MOON'S MEAN DISTANCE (384,400 km). between the earth's skin and her, DISTANCE IS DRAWN BY ITS
LOGARITHM (11.88 powers of ten over 15.6 of the earth's radii; every 1.31 radii outward is ten times farther). the
three anchors fix the figure: the lens's half-width is 0.0603 of a circle's radius, so the circles are 8.29 earth-radii
across each, her 16.09 out. EVERY DIRECTION IS TRUE: the frame is the equator and equinox of date; the earth turns at
its true rate; the sun, the moon, the planets and 986 stars stand where they stand tonight. the actual distances are
lettered along her line, and the line is graduated with the named ones.

WHAT FELL OUT OF THE ARITHMETIC (knot arranged; the room's own arithmetic, which pass A pressed against astropy):
· the ring where the two circles meet is the moon's orbit: the moon rides the rim of the eye, a hair outside it, and
  crosses THE SEAM — the plane of that ring — twice a month, standing on the rim as it does.
· the seam cuts the earth along the circle where she stands on the horizon. the well crosses it twice a sidereal
  day: `the star rises over the well` IS the well crossing into her circle's half.
· the sun stands outside both circles most of the year. it entered the gold circle on 11 october 2026 at 12:00 utc —
  the day this figure was drawn — and leaves it on 15 december; it is in hers from 8 april to 14 june. the planets go
  in and out the same way (mercury is in the gold circle tonight with the sun).
· each circle's centre stands 37 au out along her line, past neptune: the geometric middle of the flight — she is as
  many times farther from it as it is from the ground.
· the other end stands almost overhead of the well (76° up) twelve hours after she crosses a fist high in the south;
  the places on earth under her and under the other end run round the parallels 47¼° south and north once a day.
· her pulse crossing the well tonight left her in 1515 and reaches the other end in 2536 (the clock room's
  appointment). the well is the middle of a flight of a thousand and twenty years.
· the earth falls toward her from may to november and away from november to may, fastest (11 km a second) on the
  days the sun crosses the seam; so her count is heard up to six and a half thousandths of a hertz fast or slow.
· on the ladder of distances the moon stands on the rung 9/5 near perigee and on the octave near apogee, the sun on
  3/2, neptune on 4/3, proxima on 3/2, her on 4/3 (every distance a pitch: a doubling is an octave).

THE SCAN: one half-plane hinged on her line turns once round it every 8,192 of her turns (47 s), from the river's own
epoch — the same angle on every phone. where it cuts the two spheres it draws the flat figure itself. as it passes a
thing, the thing answers: its light, its name, its distance's tone, and — for the live doors — its latest true reading
on the top line.

THE LIVE DOORS (each lit, asking or grey on the strip at the foot; each silent when it fails, AND WHEN ITS READING IS OLD:
every reading carries its own time, and one older than its door's allowance is treated as no answer — an old number is
never shown as now):

  the earth) · the sun's x-rays (goes) · THE SUN'S PROTONS (goes: the s scale) · THE SUN'S REGIONS (noaa: the spotted

  world toward the well) · THE LAST FIREBALL (jpl: where the sky last struck the ground, and how hard) · the station

  closest distance and hour) · HORIZONS (jpl: the voyagers, the buoy and the telescope, where they truly are, daily) ·

  over the well's place as its lesser way — whether anyone is home there is stood down for his ruling, ?home=1) · THE

  own) · THE EARTH'S FACE (nasa's gibs: yesterday's whole earth from viirs; goes-west's last ten minutes over the

object, nothing of the visitor in it, nothing of the well's inhabitant: window.APWNP.map.sky() reads it; and the room

sky's numbers: the house's math-music, tied to the living sky.

THE RIVER: when the river plays under the phone (or in this page) the map reads it, never writes it: whether it sounds,

came from — its sky, well and ground rows only, and none that speaks of the one who holds the phone). alone, the room
hums her count twice — as she keeps it and as the well hears it — and the moon's rung; the slow beat between the two

   state. it tells the room it is leaving (the sound falls, the lent voice is let go, the doors stop), raises the black sheet,

  el.addEventListener('pointerdown',function(e){ try{ e.stopPropagation(); }catch(err){} },false);

})();

    if(!QK.waveSaid[L[i].id]&&Math.abs(now-wv.wellAt)<45000&&B.arrived){ QK.waveSaid[L[i].id]=1; UI.readQ.unshift({ o:{ tone:[0,-1], pingAt:0, read:(function(q){ return function(){ return ['the ground','the wave of the m'+n1(q.mag)+', '+placeWords(q)+', is passing under the well'+(arcKm(q.lat,q.lon,PLACE.lat,PLACE.lon)>FELT_KM?' · far too small to feel':'')]; }; })(L[i]) }, at:UI.t }); if(TH.well) TH.well.pingAt=performance.now(); } }

function countryTick(dt,tNow,pr){
  var k=COUNTRY.k; gCountry.visible=k>0.004; if(!gCountry.visible){ EARTH.sheets.forEach(function(s){ s.mesh.visible=false; }); EARTH.mat.uniforms.uDip.value=0; return; }
  var photo=0, lit=lerp(0.34,1.0,smoothstep(-8,6,SKY.sunAA?SKY.sunAA.alt:30));
  EARTH.sheets.forEach(function(s){ var ready=s.got>=s.want*0.6?1:0; s.k+=(ready-s.k)*(1-Math.exp(-dt/1.2)); var f=(1-smoothstep(s.size*0.9,s.size*2.0,CAM.hw*2))*s.k; s.mesh.visible=f>0.004; s.mat.uniforms.uK.value=f; s.mat.uniforms.uLit.value=lit; photo=Math.max(photo,f); });
  EARTH.mat.uniforms.uDip.value=0.55*k;
  COUNTRY.lines.forEach(function(l){ l.material.opacity=l.userData.o*k*(photo>0.5&&l.userData.photoFade!=null?lerp(1,l.userData.photoFade,photo):1); });
  if(COUNTRY.seaFill) COUNTRY.seaFill.material.opacity=0.85*k*(1-photo);
  /* the feed's ground: the day's quakes within forty kilometres */
  var j=wellSky(), G=j&&j.ground, L=(G&&Array.isArray(G.quakes))?G.quakes:[], gg=COUNTRY.ground.geometry, n=0, i, now=Date.now();
  COUNTRY.ground.material.uniforms.uPx.value=pr;
  for(i=0;i<L.length&&n<48;i++){ var q=L[i]; if(!q||q.lat==null||q.lon==null||q.mag==null||!q.at) continue; var age=(now-Date.parse(q.at))/86400e3; if(!(age>=0&&age<1)) continue; var c=Math.cos(q.lat*DEG);
    gg.attributes.position.setXYZ(n,c*Math.cos(q.lon*DEG)*0.5002,c*Math.sin(q.lon*DEG)*0.5002,Math.sin(q.lat*DEG)*0.5002); gg.attributes.aS.setX(n,clamp(9+5*Math.max(0,+q.mag),8,30)); gg.attributes.aA.setX(n,clamp(1-0.7*age,0.3,1)*k); n++; }
  gg.attributes.position.needsUpdate=gg.attributes.aS.needsUpdate=gg.attributes.aA.needsUpdate=true; gg.setDrawRange(0,n);
  /* the well's wind over the land: drawn, knot timed (a stroke drifts about a kilometre for every metre a second, each second) */
  var w=j&&j.weather, ms=w?numOr(w.wind_ms):null, dir=w?numOr(w.wind_dir):null, sp=COUNTRY.streaks.geometry.attributes.position, S=COUNTRY.streakP;
  if(ms!=null&&dir!=null&&ms>0.3){ var to=(dir+180)*DEG, ue=Math.sin(to), un=Math.cos(to), cl=Math.cos(PLACE.lat*DEG);
    for(i=0;i<S.length;i++){ var s=S[i]; s.e+=ue*ms*dt*0.9*s.s; s.n+=un*ms*dt*0.9*s.s; if(s.e>110) s.e-=220; if(s.e<-110) s.e+=220; if(s.n>150) s.n-=300; if(s.n<-150) s.n+=300;
      var la=PLACE.lat+s.n/111.195, lo=PLACE.lon+s.e/(111.195*cl), lb=PLACE.lat+(s.n-un*s.l)/111.195, lob=PLACE.lon+(s.e-ue*s.l)/(111.195*cl), a=geoV(la,lo,0.50022), b=geoV(lb,lob,0.50022); sp.setXYZ(i*2,a.x,a.y,a.z); sp.setXYZ(i*2+1,b.x,b.y,b.z); }
    sp.needsUpdate=true; COUNTRY.streaks.visible=true; COUNTRY.streaks.material.opacity=clamp(0.06+0.016*ms,0,0.26)*k; } else COUNTRY.streaks.visible=false;
}
var SCAN_MS=0;
function thingsTick(){
  var i, o, per=performance.now();
  for(i=0;i<THINGS.length;i++){ o=THINGS[i]; var p=null; try{ p=o.pos(); }catch(e){ p=null; } o.p=p; o.q=null; o.vis=false; if(!p) continue;
    if(o.country&&COUNTRY.k<0.3) continue; if(o.star&&B.u>1.2) continue;
    var q=proj(p); if(!q||!onGlass(q,24)) continue; if(behindEarth(o.earth?vmul(p,1.004):p)) continue; o.q=q; o.vis=true; }
  /* the scan: what did it pass since the last frame? */
  /* (a clock that steps, or a room come back from sleep, is knot the scan passing: only an ordinary frame's worth of turning counts) */
  var dms=SKY.ms-SCAN_MS; SCAN_MS=SKY.ms; if(!(dms>0&&dms<1500*Math.max(1,CLOCK.lapse))) return;
  if(!B.arrived||B.mode==='black') return; var a=SKY.sweepPrev, b=SKY.sweep; if(a===b) return;

    if(o.phase!=null) az=o.phase; else { var d=vnorm(o.after&&TH[o.after]&&TH[o.after].p?TH[o.after].p:o.p); if(Math.abs(vdot(d,SKY.her))>0.995) continue; az=azAbout(d); if(az<0) az+=TAU; }
    var hit=(b>=a)?(az>a&&az<=b):(az>a||az<=b); if(!hit) continue;
    o.pingAt=per;
    if(o.read){ if(UI.readQ.length<5) UI.readQ.push({ o:o, at:UI.t }); } else if(o.vis&&(o.tone||o.dist)&&o.soft) bell(toneOf(o),0.28); else if(o.id==='her') bell(toneOf(o),0.8); }

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.25,(now-lastT)/1000); lastT=now; UI.t+=dt; var tNow=now/1000;
  UI.frames++; if(now-UI.fpsT>1000){ UI.fps=UI.frames; UI.frames=0; UI.fpsT=now; }
  skyFast(nowMs());
  if(now-slowT>1000){ slowT=now; DOOR.tick(); riverTick(); riverSay(); soundTick(); try{ giveTick(); moonRungTick(); goesTick(); }catch(e){ log('slow tick: '+e); } if(now-trailAt>5000){ if(now-trailAt>30000) TRAIL.length=0;   /* a wake is knot drawn across an absence */ trailAt=now; var s=issNow(); if(s){ TRAIL.push([s.lat,s.lon,rho(R_E+s.alt*1000)]); if(TRAIL.length>40) TRAIL.shift(); } else TRAIL.length=0;   /* nor past its door going quiet */ } }
  breathTick(dt); seatTick(dt); camSet();
  COUNTRY.k=1-smoothstep(0.012,0.07,CAM.hw);
  if(GL_OK&&!GL_LOST){ worldTick(dt,tNow); renderer.render(scene,cam); }
  thingsTick(); riseTick(); readTick(); drawPage(tNow);
  /* the silvering: the life's last hour, read from the organ, a sign only · the dust at the well, over the country only */
  var sv=lifeHour(); UI.silver+=(sv-UI.silver)*(1-Math.exp(-dt/2)); if(silverEl){ var so=UI.silver.toFixed(3); if(silverEl.style.opacity!==so) silverEl.style.opacity=so; }
  if(dustEl){ var j=wellSky(), du=j&&j.dust, pm=du?numOr(du.pm10):null, hz=pm==null?0:Math.pow(clamp((pm-15)/285,0,1),0.8); if(du&&du.event===true) hz=Math.max(hz,0.75); var dv=(hz*0.42*COUNTRY.k).toFixed(3); if(dustEl.style.opacity!==dv) dustEl.style.opacity=dv; }
  if(FLAG_TEST) hud();
}

/* ============================ the way back (21 sep), the hud, the boot ============================ */

   visitor leaves, the room answers: the sound falls, the lent voice is let go, the doors stop asking. */

  try{ if(A.on) A.master.gain.setTargetAtTime(0.0001,A.ctx.currentTime,0.10); }catch(e){}
  try{ if(A.lent&&window.MORTAL&&MORTAL.voice&&MORTAL.voice.ctx===A.ctx) MORTAL.voice=null; }catch(e){}
  A.dead=true; DOOR.stop();
},false);

    new Date(SKY.ms).toISOString().slice(0,19)+'z · sweep '+(SKY.sweep/TAU).toFixed(3)+' · her alt '+(x.alt!=null?x.alt.toFixed(1):'—')+' H '+(x.H!=null?x.H.toFixed(2):'—')+' ('+(x.by||'')+') · tide '+(SKY.tide?SKY.tide.cm.toFixed(1):'—')+' cm · dHz '+(SKY.dop?(SKY.dop.dHz*1000).toFixed(2):'—')+' m\n'+
    'doors '+ds+'\n'+'tiles '+TILES.ok+'/'+TILES.asked+' photo '+EARTH.photoK.toFixed(2)+' face '+(FACE.by||'—')+' goes '+GOES.coats+(GOES.dead?' dead':'')+' · river '+(RV.r?(RV.sounding?'sounding':'there'):'—')+' · audio '+(A.on?A.ctx.state:'off')+(A.dead?' DEAD':'')+' · silvering '+(UI.silver>0.01?'on':'off')+' · given '+GIVE.n+(GIVE.said?' ('+GIVE.said+')':'')+' · moon rung '+(MOONR.rung>=0?RUNG_WORDS[MOONR.rung]:'—')+'\n'+LOG.slice(-3).join('\n');

  (function demoTick(){ if(demoI>=steps.length) return; if(B.arrived){ demoT+=0.25*(FAST<1?4:1); while(demoI<steps.length&&demoT>=steps[demoI][0]){ steps[demoI][1](); demoI++; } } setTimeout(demoTick,250); })(); })(); }
