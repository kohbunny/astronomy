/* ============================ THE FLAT PAGE — the emblem, the mark on the line, the two turns, the arrival's word ============================ */

function silvered(rgb,k){ var c=rgb.split(',').map(Number), sv=S.silver*(k===undefined?1:k); return Math.round(lerp(c[0],140,sv))+','+Math.round(lerp(c[1],140,sv))+','+Math.round(lerp(c[2],146,sv)); }

/* THE EMBLEM: the vesica, small, at the foot above the home bar. two circles of EMB_R whose centres stand one radius apart, so each
   passes through the other's centre — that IS the arithmetic: the human's circle centred on you reaches from the quark (−18.7) to her
   (+18.7); the universe's centred on her reaches from you to +37, ten decades past the last light. one decade is r/18.68 px along
   the line through the centres. the mark walks it; the "?" at the lens's middle lights at the spark. the two circles are its two buttons. */
var emb={ cx:0, cy:0, xL:0, xR:0, r:EMB_R };
function embSeat(){ emb.r=EMB_R; emb.cx=page.W*0.5; emb.cy=page.H-SAFE.b-Math.max(26,page.H*0.03)-emb.r-14; emb.xL=emb.cx-emb.r*0.5; emb.xR=emb.cx+emb.r*0.5; }

function drawEmblem(g,t){
  embSeat(); var r=emb.r, cy=emb.cy, xL=emb.xL, xR=emb.xR, k=S.veiled?1:0; if(k<=0) return;
  var gold=silvered(COL.gold), blue=silvered(COL.her), ink=silvered(COL.ink);
  var cnt=(t*P/128)%1, breath=Math.pow(1-cnt,2.2);           // her count as light
  g.save(); g.lineWidth=1.15;
  /* the lens, faint */
  g.save(); g.beginPath(); g.arc(xL,cy,r,0,TAU); g.clip(); g.beginPath(); g.arc(xR,cy,r,0,TAU); g.fillStyle='rgba('+ink+','+(0.05+0.03*breath).toFixed(3)+')'; g.fill(); g.restore();
  /* the human's circle, gold */
  g.strokeStyle='rgba('+gold+','+(0.62+0.10*breath).toFixed(3)+')'; g.beginPath(); g.arc(xL,cy,r,0,TAU); g.stroke();
  /* the universe's circle, her blue — the arc past the edge (the ten decades no one can see) drawn faint */
  var aEdge=Math.acos(clamp((embX(S_MAX)-xR)/r,-1,1));
  g.strokeStyle='rgba('+blue+','+(0.62+0.10*breath).toFixed(3)+')'; g.beginPath(); g.arc(xR,cy,r,aEdge,TAU-aEdge); g.stroke();
  g.strokeStyle='rgba('+blue+',0.22)'; g.beginPath(); g.arc(xR,cy,r,-aEdge,aEdge); g.stroke();

  g.fillStyle='rgba('+ink+','+qa.toFixed(3)+')'; g.fillText('?',emb.cx,cy+0.5);

  g.fillStyle=mg; g.beginPath(); g.arc(mx,cy,7,0,TAU); g.fill();
  g.fillStyle='rgba(255,255,255,'+(0.85*pk).toFixed(3)+')'; g.beginPath(); g.arc(mx,cy,2.1,0,TAU); g.fill();

function drawPage(){

  /* THE TURN: at each end the hole grows to the glass, holds black one breath, and opens the other way — gold-lipped at the quark (inside the living), blue-lipped at the edge (hers) */
  if(S.turnK>0.001){
    var lip=(S.turnEnd==='quark')?COL.gold:COL.her, rmax=Math.hypot(W,H)*0.5/0.62*1.02, rr=Math.max(1,rmax*ss(S.turnK));

    var ph=(t%1.9)/1.9, bl=(ph<0.70)?1:((ph<0.85)?1-ss((ph-0.70)/0.15):ss((ph-0.85)/0.15));

/* ============================ THE HAND (ruling 9): hum · thumb · pinch · a tap on a circle to turn · a tap near a landmark to read. no looking around. ============================ */
var ptrs={}, pDown=null;
function embHit(x,y){ embSeat(); var rr=Math.max(emb.r,22)+8; var dL=Math.hypot(x-emb.xL,y-emb.cy), dR=Math.hypot(x-emb.xR,y-emb.cy); if(dL>rr&&dR>rr) return 0; return (dL<=dR)?-1:1; }
function setDir(d){ if(S.dir===d) return; S.dir=d; log('turn '+(d<0?'in':'out')); tone(d<0?3:6,1.2,0.05,'sine'); }
function onDown(e){
  try{ e.preventDefault(); }catch(err){}
  audioWake();
  ptrs[e.pointerId]={ x:e.clientX, y:e.clientY, t:performance.now(), x0:e.clientX, y0:e.clientY, moved:false };
  var ids=Object.keys(ptrs);
  if(ids.length===2){ var a=ptrs[ids[0]], b=ptrs[ids[1]]; S.pinch={ d0:Math.max(8,Math.hypot(a.x-b.x,a.y-b.y)), s0:S.s, sPrev:S.s, tPrev:performance.now(), v:0 }; pDown=null; }
  else if(ids.length===1) pDown=ptrs[e.pointerId];
  try{ pageEl.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){
  var p=ptrs[e.pointerId]; if(!p) return;
  p.x=e.clientX; p.y=e.clientY; if(Math.hypot(p.x-p.x0,p.y-p.y0)>8) p.moved=true;
  if(S.pinch){ var ids=Object.keys(ptrs); if(ids.length>=2){ var a=ptrs[ids[0]], b=ptrs[ids[1]], d=Math.max(8,Math.hypot(a.x-b.x,a.y-b.y));
    /* the phone's own grammar: spreading the fingers zooms in — inward, to the smaller scales; pinching together goes out */
    if(S.mode==='breathe'){ var ns=clamp(S.pinch.s0-Math.log(d/S.pinch.d0)/Math.LN10*PINCH_GAIN,S_MIN+0.05,S_MAX-0.05); var now=performance.now(), dtp=Math.max(0.008,(now-S.pinch.tPrev)/1000); S.pinch.v=(ns-S.pinch.sPrev)/dtp; S.pinch.sPrev=ns; S.pinch.tPrev=now; S.s=ns; } } }
}
function onUp(e){
  var p=ptrs[e.pointerId]; if(!p) return; delete ptrs[e.pointerId];
  var ids=Object.keys(ptrs);
  if(S.pinch){ if(ids.length<2){ S.nudgeV=clamp(S.pinch.v*0.5,-1.5,1.5); S.pinch=null; pDown=null; } return; }
  if(pDown!==p) return; pDown=null;
  var dt=performance.now()-p.t, tap=(!p.moved&&dt<320);
  if(!tap) return;
  audioInit(); audioWake();
  if(S.mode==='arrive'){ if(S.needTap){ S.needTap=false; askGeo(function(){ S.geoDone=true; }); S.walk=true; tone(2,1.4,0.08,'sine'); } else locSay(); return; }   // the arrival's own hand (1.4): the place's ask, or a voice a touch may wake
  if(S.mode==='turn') return;                                                                       // in the black the map is already turning; a tap waits
  var h=embHit(p.x,p.y);
  if(h){ setDir(h); return; }
  /* the first tap on the glass asks for the mic — an ask rides a tap, and no tap carries two */
  if(!micAsked&&!micDenied&&!FLAG_NOMIC&&!micOK){ openMic().then(function(){},function(){}); return; }
  var L=nearestLandmark(S.s); if(L&&Math.abs(L.s-S.s)<0.6) openCard(L);

if(pageEl){ pageEl.addEventListener('pointerdown',onDown,{ passive:false }); pageEl.addEventListener('pointermove',onMove,{ passive:true }); pageEl.addEventListener('pointerup',onUp); pageEl.addEventListener('pointercancel',onUp); }
var keys={};
window.addEventListener('keydown',function(e){ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); if(e.code==='ArrowLeft') setDir(-1); if(e.code==='ArrowRight') setDir(1); });   // the bench's hand

  var target=held?1:0; S.thumbK+=(target-S.thumbK)*(1-Math.exp(-dt/(held?0.8:0.6)));
}

/* ============================ THE ARRIVAL (1.4, carried): the tile's tap was the gesture; this reads what it settled ============================ */

  if(S.boarded) return; S.boarded=true;

  fetchRelic(LOC); fetchRelic(PSR); fetchRelic(LULLR); fetchRelic(QUARKV); fetchRelic(UNIVV);
  var settled=false;
  function walkOn(){ if(settled) return; settled=true; askGeo(function(){ S.geoDone=true; }); S.walk=true; }
  function needsHand(){ if(settled) return; settled=true; S.needTap=true; }
  if(FAKEGEO||!navigator.geolocation){ walkOn(); }
  else {
    var q=null;
    try{ if(navigator.permissions&&navigator.permissions.query) q=navigator.permissions.query({ name:'geolocation' }); }catch(e){ q=null; }
    if(q&&q.then) q.then(function(pr){ if(pr&&(pr.state==='granted'||pr.state==='denied')) walkOn(); else needsHand(); },needsHand);
    else needsHand();

}

  } else if(S.t-S.streetT0>=STREET_T){

}

/* ============================ THE BREATH — the loop ============================ */
var lastT=performance.now(), REND={ realms:[], calls:0 };
function breatheTick(dt){

  var thr=0;
  if(micOK||FLAG_SIM){ var rr=micRMS(); S.rms=rr; thr=smoothstep(0.030,0.120,rr); } else S.rms=0;   // the throttle's law: the breath heard, never judged
  if(keys.Space) thr=1;
  thr=Math.max(thr,S.thumbK);

  S.dirV+=(S.dir-S.dirV)*(1-Math.exp(-dt/0.8));
  var rate=S.dirV*(1/DECADE_S)*dwellAt(S.s)*seatDwell(S.s)*SEAT.rate*(1+BOOST*S.boost);
  if(S.hold) rate=0;                                                   // the bench's hand only: stand still for a still
  S.rate=rate;
  if(!S.pinch){ S.s+=rate*dt+S.nudgeV*dt; S.nudgeV*=Math.exp(-dt/NUDGE_EASE); }

}

  if(T<TURN_S){ S.turnK=T/TURN_S; }
  else if(T<TURN_S+TURN_HOLD){ S.turnK=1;
    if(!S.flipped&&T>TURN_S+TURN_HOLD*0.5){ S.flipped=true; S.dir=-S.dir; S.traverses++;
      var v=(S.turnEnd==='quark')?QUARKV:UNIVV; if(v.ab||v.buf) playRelic(v,0.9,null);
      if(S.turnEnd===HUSH_AT) sayLine(lnLow,HUSH_LINE,3.2);
      log('turned: now '+(S.dir<0?'inward':'outward')); } }
  else if(T<TURN_S*2+TURN_HOLD){ S.turnK=1-(T-TURN_S-TURN_HOLD)/TURN_S; }
  else { S.turnK=0; S.mode='breathe'; S.dirV=S.dir*0.2; }
  S.s=(S.turnEnd==='quark')?S_MIN:S_MAX;
}
function poseCam(R,s){
  var row=R._row, u=Math.pow(10,row.unit), ctx=R._ctx;
  var org=(row.origin==='heart')?world.H:(row.origin==='ground')?world.G:(row.origin==='sun')?world.Sun:_v4.set(0,0,0);
  if(row.frame==='place') ctx.celQ.copy(world.BqInv); else ctx.celQ.identity();
  _v1.copy(eye.C).sub(org).multiplyScalar(1/u).applyQuaternion(ctx.celQ);         // the centre, in the realm's own units and frame
  var D=Math.pow(10,s-row.unit);
  _v2.copy(eye.dir).applyQuaternion(ctx.celQ); _v3.copy(eye.up).applyQuaternion(ctx.celQ);
  cam.position.copy(_v1).addScaledVector(_v2,D); cam.up.copy(_v3);
  if(row.origin==='sun'){ var rs=1.6*R_SUN/u; if(cam.position.lengthSq()<rs*rs) cam.position.setLength(rs); }   // never inside the sun: the step's geometry could cross it for a frame
  cam.lookAt(_v1);
  cam.near=Math.max(D*0.02,1e-7); cam.far=Math.max(D*4000,R.far||0); cam.updateProjectionMatrix();
  ctx.sun.dir.copy(world.sunEff).applyQuaternion(ctx.celQ); ctx.her.dir.copy(world.herDir).applyQuaternion(ctx.celQ); ctx.moon.dir.copy(world.moonDir).applyQuaternion(ctx.celQ);
}
function realmsTick(dt){
  var s=S.s, active=[];
  for(var i=0;i<REALMS.length;i++){
    var R=REALMS[i], row=R._row;
    var k=kOf(row,s); R._k=k;
    if(!R._built&&!R._broken&&s>row.span[0]-BUILD_AHEAD&&s<row.span[1]+BUILD_AHEAD){
      R._built=true; var t0=performance.now();
      jailed(R,'build',function(){ R.build&&R.build(R._ctx); });
      log('built '+R.id+' in '+(performance.now()-t0).toFixed(0)+' ms'+(R.fog?' (fog)':''));
    }
    if(k>0.001&&R._built&&!R._broken){
      if(!R._in){ R._in=true; jailed(R,'enter',function(){ R.enter&&R.enter(R._ctx); }); }
      active.push(R);
    } else if(R._in){ R._in=false; jailed(R,'leave',function(){ R.leave&&R.leave(R._ctx); }); }
  }
  active.sort(function(a,b){ return b._row.unit-a._row.unit; });     // large to small: the larger realm is the background
  if(active.length>3) active=active.slice(0,3);
  REND.realms=active;
  for(var j=0;j<active.length;j++){ var A2=active[j]; poseCam(A2,s); jailed(A2,'tick',function(){ A2.tick&&A2.tick(A2._ctx,S.t,dt,s,A2._k); }); if(renderer){ renderer.clearDepth(); renderer.render(A2._scene,cam); } }
}
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.1,(now-lastT)/1000); lastT=now; S.t+=dt; S.tNow=now/1000;
  S.frames++; if(now-S.fpsT>1000){ S.fps=S.frames; S.frames=0; S.fpsT=now; }
  if(S.mode==='arrive') arriveTick(dt); else if(S.mode==='breathe') breatheTick(dt); else if(S.mode==='turn') turnTick(dt);
  thumbTick(dt); seatPulseTick(dt);
  /* the silvering: the life's last hour, read from the organ, a sign only */
  var sv=lifeHour()*SILVER_K; S.silver+=(sv-S.silver)*(1-Math.exp(-dt/2)); if(silverEl){ var so=S.silver.toFixed(3); if(silverEl.style.opacity!==so) silverEl.style.opacity=so; }
  /* the sound along the line */
  if(A.on&&!A.dead){ droneTo(curveAt(DRONE_CURVE,S.s)*(S.mode==='arrive'?0.6:1),1.0); droneShape(S.s,dt); stairAt(-S.s,(S.mode==='arrive')?0:curveAt(DRONE_CURVE,S.s)/0.42); heartTick(dt,S.s); }
  /* the world, the eye, the sky, the realms */
  worldTick(S.t); eyeAt(S.s);
  if(renderer){ renderer.info.reset(); renderer.setRenderTarget(null); renderer.clear(true,true,true); skyTick(S.s); if(sky.k>0.002) renderer.render(sceneSky,camSky); }
  realmsTick(dt);
  drosteTick();
  wordsTick(dt);
  drawPage();
  if(FLAG_TEST) hud();
}

/* ============================ the way back (21 sep), the hud, the boot ============================ */
function goHome(){ try{ MORTAL.go('phone.html?door=maps'); }catch(e){} }
var wbEl=$('wayback'), wbSheet=$('leavesheet'), wbLeaving=false;
function waybackPaint(){ if(!wbEl||wbLeaving) return; wbEl.classList.toggle('on',!!S.veiled); }
function wayBackNow(){
  if(wbLeaving) return; wbLeaving=true;
  if(wbEl) wbEl.classList.remove('on');
  try{ if(A.on) A.master.gain.setTargetAtTime(0.0001,A.ctx.currentTime,0.10); }catch(e){}
  try{ if(wbSheet) wbSheet.classList.add('on'); }catch(e){}
  setTimeout(goHome,420);
}
if(wbEl){
  var wbTake=function(e){ try{ e.preventDefault(); e.stopPropagation(); }catch(err){} wayBackNow(); };
  wbEl.addEventListener('pointerdown',function(e){ try{ e.stopPropagation(); }catch(err){} },false);
  wbEl.addEventListener('pointerup',wbTake,false);
  wbEl.addEventListener('click',wbTake,false);
  wbEl.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ e.preventDefault(); wayBackNow(); } },false);
}
function hud(){
  hudEl.style.display='block';
  var ks=REALMS.map(function(R){ return R.id+(R.fog?'~':'')+' '+R._k.toFixed(2); }).filter(function(x){ return !/ 0\.00$/.test(x); }).join(' · ');
  hudEl.textContent='vesica · '+S.mode+' · s '+S.s.toFixed(3)+' '+(S.dir<0?'in':'out')+' · rate '+S.rate.toFixed(3)+'/s · boost '+S.boost.toFixed(2)+' · fps '+S.fps+'\n'+
    'realms '+ks+'\n'+
    'geo '+geo.state+' '+geo.lat.toFixed(2)+','+geo.lon.toFixed(2)+' · tiles '+tiles.ok+'/'+tiles.asked+' · wind '+(WIND/TAU).toFixed(2)+' · turn '+S.turnK.toFixed(2)+' '+S.turnEnd+' · traverses '+S.traverses+'\n'+
    'mic '+(micOK?'open':(micDenied?'refused':(micAsked?'asked':'—')))+' rms '+S.rms.toFixed(3)+' · audio '+(A.on?A.ctx.state:'off')+(A.dead?' DEAD':'')+' · heart '+heart.bpm.toFixed(0)+' · silver '+S.silver.toFixed(2)+' · calls '+(renderer?renderer.info.render.calls:0)+' tris '+(renderer?renderer.info.render.triangles:0)+'\n'+
    (JAIL.on?('jail hits '+JAIL.hits.length+'\n'):'')+
    (LOG.slice(-4).join('\n'));
}
/* THE BOOT. the page opens BLACK with the hole at the middle of it — the same hole that ate the phone, seen from the far side. */
tzGuess();
if(FLAG_ENTER){ veil.classList.add('snap'); }
seatRealms();
pageResize();
S.arriveT0=0; lastT=performance.now();
if(FLAG_S!==null) standAt(FLAG_S);
requestAnimationFrame(frame);
board();
/* ?seat=demo (with ?test): the seat's seven calls, scripted, so the keeper can see the shape working against a fake doorway */
if(FLAG_SEATDEMO){
  var seat=window.APWNP.map.seat, demoT=0;
  var demoSteps=[[2,function(){ log('seat.where → '+JSON.stringify(seat.where())); }],[4,function(){ seat.breathe(1.6,'out'); }],[8,function(){ seat.linger(9.1,6); }],[10,function(){ seat.say('?',4); }],[12,function(){ seat.tint(COL.her,0.4); }],[14,function(){ seat.mark(-0.8,'a phone in a hand'); }],[16,function(){ seat.pulse(2,5); }],[22,function(){ seat.tint(COL.her,0); seat.breathe(1,'in'); log('seat demo done'); }]];
  var demoI=0; (function demoTick(){ if(demoI>=demoSteps.length) return; if(S.mode!=='arrive'){ demoT+=0.25*(FAST<1?4:1); while(demoI<demoSteps.length&&demoT>=demoSteps[demoI][0]){ demoSteps[demoI][1](); demoI++; } } setTimeout(demoTick,250); })();
}
if(FLAG_TEST){ window.__map={ S:S, geo:geo, A:A, seat:window.APWNP.map.seat, SEAT:SEAT, eye:eye, world:world, tiles:tiles, JAIL:JAIL, log:LOG, heart:heart, REALMS:REALMS, LANDMARKS:LANDMARKS, emb:emb,
  jump:jumpTo, dir:setDir, stand:standAt, hold:function(on){ S.hold=!!on; }, realms:function(){ return REALMS.map(function(R){ return { id:R.id, k:R._k, built:!!R._built, on:!!R._in, fog:!!R.fog, broken:!!R._broken }; }); },
  active:function(){ return REND.realms.map(function(R){ return R.id; }); },
  master:function(){ return A.on?A.master.gain.value:-1; }, mic:function(){ return { ok:micOK, asked:micAsked, denied:micDenied }; },
  fire:function(){ window.dispatchEvent(new Event('apwnp:call')); }, info:function(){ return renderer?{ calls:renderer.info.render.calls, tris:renderer.info.render.triangles, points:renderer.info.render.points }:null; },
  wind:function(){ return WIND; }, gl:GL_OK, droste:{ ask:function(){ return !!drosteWant(); }, state:function(){ return { on:DROSTE.on, has:!!DROSTE.tex, w:DROSTE.w, h:DROSTE.h, copies:DROSTE.copies, glErr:(renderer?renderer.getContext().getError():-1) }; } },
  sol:function(){ var R=HOST_REALMS.sol; return R&&R.body?{ bodyOn:R.body.visible, spin:R.spin, promK:R.promMat.uniforms.uK.value, corK:R.corMat.uniforms.uK.value, windK:R.windMat.uniforms.uK.value, orbits:R.orbits.visible }:null; },
  stars:function(){ var R=HOST_REALMS.stars; if(!R||!R.cat) return null; var d=R.dwarf.position; return { count:R.count, dwarfOn:R.dwarf.visible, dwarf:[d.x,d.y,d.z], dwarfK:R.dwarfMat.uniforms.uK.value, wakeOn:R.wake.visible, wakeQ:R.wake.quaternion.toArray(), motion:R.motion.toArray(), north:R.north.toArray(), east:R.east.toArray(), her:R.her.position.toArray(), skyPtsK:sky.pts.material.uniforms.uK.value, skyK:sky.k }; }, card:function(){ return S.cardOf?S.cardOf.name:null; }, way:function(){ return { on:S.wayOn, html:wayEl.innerHTML, top:lnTop.textContent, low:lnLow.textContent, topOn:lnTop.classList.contains('on'), lowOn:lnLow.classList.contains('on') }; },
  T:{ DECADE_S:DECADE_S, TURN_S:TURN_S, TURN_HOLD:TURN_HOLD, HOLE_IN:HOLE_IN, STREET_T:STREET_T, FADE:FADE, S_MIN:S_MIN, S_MAX:S_MAX } }; }
})();
