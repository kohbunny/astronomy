}

/* ═══ the cover emblem — the moth burned; the dead star keeps the door now.
   psr j0437-4715 and its white-dwarf companion, in ice-light: the pulsar
   blinks its lighthouse blip, its beams sweep slowly, a beat-ring breathes
   outward, and the little dwarf holds steady beside it. touch it to open. ═══ */
var emblemCanvas=null, emblemCtx=null, emblemTex=null;
var EMB = 512, EMB_STARS = null;
function embPulse(now){ return Math.pow(0.5 + 0.5*Math.sin(now*0.0036), 8); }   /* the lighthouse blip */
function renderEmblem(awaken, now){
  var g = emblemCtx; if (!g) return;
  g.clearRect(0,0,EMB,EMB);
  awaken = clamp(awaken == null ? 1 : awaken, 0, 1);
  if (awaken <= 0){ emblemTex.needsUpdate = true; return; }
  if (!EMB_STARS){
    var r = mulberry32(0x1CE); EMB_STARS = [];
    for (var i=0;i<14;i++) EMB_STARS.push({ x:46+r()*420, y:46+r()*420, rr:0.7+r()*1.5, ph:r()*6.2832, sp:0.5+r()*1.5 });
  }
  now = (now == null) ? performance.now() : now;
  var t = now*0.001, A = awaken, blip = embPulse(now);
  var cx = 256, cy = 250, px = cx-48, py = cy-30, i, k;

  /* two icy rings bind the emblem, the way the tooled frame once did */
  g.strokeStyle = 'rgba(140,188,242,'+(0.17*A).toFixed(3)+')';
  g.lineWidth = 2;
  g.beginPath(); g.arc(cx, cy, 214, 0, 6.2832); g.stroke();
  g.strokeStyle = 'rgba(120,170,235,'+(0.08*A).toFixed(3)+')';
  g.lineWidth = 1;
  g.beginPath(); g.arc(cx, cy, 238, 0, 6.2832); g.stroke();

  /* the small cold stars */
  for (i=0;i<EMB_STARS.length;i++){
    var st = EMB_STARS[i], tw = 0.30 + 0.45*(0.5+0.5*Math.sin(t*st.sp + st.ph));
    g.fillStyle = 'rgba(206,228,255,'+(tw*A).toFixed(3)+')';
    g.beginPath(); g.arc(st.x, st.y, st.rr, 0, 6.2832); g.fill();
  }

  /* the beat-rings — the dead star's pulse, breathing outward, twice */
  var ring = (t*36) % 172;
  if (ring > 4){
    g.strokeStyle = 'rgba(150,198,250,'+((1-ring/172)*0.22*A).toFixed(3)+')';
    g.lineWidth = 1.6;
    g.beginPath(); g.arc(px, py, ring, 0, 6.2832); g.stroke();
  }
  var ring2 = (t*36 + 86) % 172;
  if (ring2 > 4){
    g.strokeStyle = 'rgba(130,182,245,'+((1-ring2/172)*0.11*A).toFixed(3)+')';
    g.lineWidth = 1.2;
    g.beginPath(); g.arc(px, py, ring2, 0, 6.2832); g.stroke();
  }

  /* the two beams — a wide cold cone, and a bright filament inside it */
  var th = t*0.42, L = 212;
  for (k=0;k<2;k++){
    var an = th + k*Math.PI;
    g.save();
    g.translate(px, py); g.rotate(an);
    var bg2 = g.createLinearGradient(0,0,L,0);
    bg2.addColorStop(0,   'rgba(186,218,255,'+((0.28+0.42*blip)*A).toFixed(3)+')');
    bg2.addColorStop(0.55,'rgba(140,190,250,'+((0.10+0.20*blip)*A).toFixed(3)+')');
    bg2.addColorStop(1,   'rgba(110,165,240,0)');
    g.fillStyle = bg2;
    g.beginPath();
    g.moveTo(0, -2.5); g.lineTo(L, -18 - 10*blip); g.lineTo(L, 18 + 10*blip); g.lineTo(0, 2.5);
    g.closePath(); g.fill();
    var fg = g.createLinearGradient(0,0,L*0.9,0);
    fg.addColorStop(0, 'rgba(235,246,255,'+((0.38+0.5*blip)*A).toFixed(3)+')');
    fg.addColorStop(1, 'rgba(170,210,255,0)');
    g.fillStyle = fg;
    g.beginPath();
    g.moveTo(0, -1.1); g.lineTo(L*0.9, -3.5 - 2*blip); g.lineTo(L*0.9, 3.5 + 2*blip); g.lineTo(0, 1.1);
    g.closePath(); g.fill();
    g.restore();
  }

  /* diffraction rings around the core */
  g.strokeStyle = 'rgba(168,208,255,'+((0.16+0.18*blip)*A).toFixed(3)+')';
  g.lineWidth = 1.2;
  g.beginPath(); g.arc(px, py, 34+9*blip, 0, 6.2832); g.stroke();
  g.strokeStyle = 'rgba(140,188,250,'+((0.08+0.10*blip)*A).toFixed(3)+')';
  g.beginPath(); g.arc(px, py, 52+13*blip, 0, 6.2832); g.stroke();

  /* the pulsar core — a blinding pin of ice, blue at its rim */
  var cg = g.createRadialGradient(px, py, 0, px, py, 30+18*blip);
  cg.addColorStop(0,   'rgba(255,255,255,'+((0.94)*A).toFixed(3)+')');
  cg.addColorStop(0.22,'rgba(214,236,255,'+((0.60+0.3*blip)*A).toFixed(3)+')');
  cg.addColorStop(0.55,'rgba(160,205,255,'+((0.28+0.2*blip)*A).toFixed(3)+')');
  cg.addColorStop(1,   'rgba(120,175,248,0)');
  g.fillStyle = cg; g.beginPath(); g.arc(px, py, 30+18*blip, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(255,255,255,'+A.toFixed(3)+')';
  g.beginPath(); g.arc(px, py, 6, 0, 6.2832); g.fill();
  /* the hotspot — a bright knot riding the core's rim */
  var ha = t*0.9, hx = px + Math.cos(ha)*8.5, hy = py + Math.sin(ha)*8.5;
  var hg = g.createRadialGradient(hx, hy, 0, hx, hy, 12+6*blip);
  hg.addColorStop(0, 'rgba(255,255,255,'+((0.75+0.25*blip)*A).toFixed(3)+')');
  hg.addColorStop(0.4,'rgba(200,230,255,'+((0.35+0.3*blip)*A).toFixed(3)+')');
  hg.addColorStop(1, 'rgba(150,200,255,0)');
  g.fillStyle = hg; g.beginPath(); g.arc(hx, hy, 12+6*blip, 0, 6.2832); g.fill();
  for (k=0;k<4;k++){                                       /* the glare cross */
    var ga = k*Math.PI/2 + 0.35, gl = 34 + 66*blip;
    g.strokeStyle = 'rgba(216,236,255,'+((0.32+0.4*blip)*A).toFixed(3)+')';
    g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(px, py);
    g.lineTo(px+Math.cos(ga)*gl, py+Math.sin(ga)*gl); g.stroke();
  }

  /* the white-dwarf companion — small, dense, a hot crescent toward its star */
  var dx = cx+70, dy = cy+52;
  var dg = g.createRadialGradient(dx, dy, 0, dx, dy, 34);
  dg.addColorStop(0,   'rgba(252,254,255,'+(0.85*A).toFixed(3)+')');
  dg.addColorStop(0.35,'rgba(198,224,255,'+(0.46*A).toFixed(3)+')');
  dg.addColorStop(1,   'rgba(150,195,250,0)');
  g.fillStyle = dg; g.beginPath(); g.arc(dx, dy, 34, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(232,244,255,'+(0.95*A).toFixed(3)+')';
  g.beginPath(); g.arc(dx, dy, 10, 0, 6.2832); g.fill();
  var ca = Math.atan2(py-dy, px-dx);                       /* the crescent faces the pulsar */
  g.strokeStyle = 'rgba(255,255,255,'+((0.5+0.35*blip)*A).toFixed(3)+')';
  g.lineWidth = 2.2;
  g.beginPath(); g.arc(dx, dy, 10.5, ca-1.0, ca+1.0); g.stroke();
  g.strokeStyle = 'rgba(170,205,252,'+(0.30*A).toFixed(3)+')';   /* its cold limb */
  g.lineWidth = 1;
  g.beginPath(); g.arc(dx, dy, 14, 0, 6.2832); g.stroke();

  emblemTex.needsUpdate = true;
}

/* ═══ the scene — a transparent pane; the 2d candle burns through it ═══ */

}catch(e){ renderer = null; }

else if (THREE.ReinhardToneMapping !== undefined){ renderer.toneMapping = THREE.ReinhardToneMapping; renderer.toneMappingExposure = 1.4; }

var VW=2, VH=2, openFit=1;
function placeLights(){
  var b = document.getElementById('candlebox');
  var r = b ? b.getBoundingClientRect() : null;
  if (!r || !r.width){ r = { left:VW/2-150, top:0.42*VH-200, width:300, height:400 }; }
  var px = r.left + r.width*0.5, py = r.top + r.height*0.56;   /* the flame's core, as the moth knows it */
  var nx = (px/VW)*2-1, ny = -(py/VH)*2+1;
  var v = new THREE.Vector3(nx, ny, 0.5); v.unproject(camera);
  var d = v.sub(camera.position).normalize();
  var t = (K.FLAME_Z - camera.position.z) / d.z;
  var pos = camera.position.clone().add(d.multiplyScalar(t));
  key.position.copy(pos);
  spot.position.copy(pos); spot.position.z += 0.35;
  spot.target.position.set(0, K.BOOK_Y + 0.15, 0);
}
function resize(){
  VW = window.innerWidth; VH = window.innerHeight;

  camera.aspect = VW/VH; camera.updateProjectionMatrix();
  var visW = 2 * K.CAM_Z * Math.tan(K.FOV*Math.PI/360) * camera.aspect;
  openFit = clamp((visW*0.92) / (2*K.PAGE_W*K.BOOK_SCALE), 0.55, 1);   /* the open spread always fits the window */
  placeLights();
}
window.addEventListener('resize', resize);

/* ── the bend of a leaf — the whole turn lives in these few lines ───────── */
var _colX = new Float64Array(K.SEG_X+1), _colZ = new Float64Array(K.SEG_X+1);
function applyLeaf(leaf, T, hint){

  var B  = K.CURL * Math.sin(2*Math.PI * T); /* the belly lags rising, leads falling — a paper whip */

/* ═══ state, time, and the hand ═══ */

  function easeIn(t){ t=clamp(t,0,1); return t*t; }
  function qx2(a,b,c,t){ var m=1-t; return m*m*a + 2*m*t*b + t*t*c; }
  function cub(a,b,c,d,t){ var m=1-t; return m*m*m*a + 3*m*m*t*b + 3*m*t*t*c + t*t*t*d; }
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  /* ── the moon moth — baked wings (branching vein-fan + speckles) ────────── */
  var BAKE = 190;
  var foreWing = null, hindWing = null;

  function wingParams(isFore){                 /* straight from wingGeo() in the doorway */
    return isFore ? {span:1.50, ridge:0.56, belly:0.40, sweep:0.60}
                  : {span:1.04, ridge:0.34, belly:0.50, sweep:0.14};
  }
  function bakeWing(isFore, rnd){
    var P = wingParams(isFore);
    function pt(u,t){                           /* (u along span, t across chord) -> local x,y (canvas, +y down) */
      var x=P.span*Math.pow(u,0.95), cY=P.sweep*Math.pow(u,1.15),
          hT=P.ridge*Math.sin(Math.PI*Math.pow(u,0.80)),
          hB=P.belly*Math.sin(Math.PI*Math.pow(u,0.72));
      return [x, -(cY + (t*(hT+hB) - hB))];
    }
    function outline(o2){ var N=26,i,p; o2.beginPath();
      for(i=0;i<=N;i++){ p=pt(i/N,1); if(i===0)o2.moveTo(p[0],p[1]); else o2.lineTo(p[0],p[1]); }
      for(i=N;i>=0;i--){ p=pt(i/N,0); o2.lineTo(p[0],p[1]); } o2.closePath(); }

    var b = isFore ? {x0:-0.10,x1:1.62,y0:-0.90,y1:0.32}
                   : {x0:-0.10,x1:1.16,y0:-0.46,y1:0.54};
    var pad=0.05, wpx=Math.ceil((b.x1-b.x0+2*pad)*BAKE), hpx=Math.ceil((b.y1-b.y0+2*pad)*BAKE);
    var ox=(-b.x0+pad)*BAKE, oy=(-b.y0+pad)*BAKE;
    var oc=document.createElement('canvas'); oc.width=wpx; oc.height=hpx;
    var o=oc.getContext('2d'); o.translate(ox,oy); o.scale(BAKE,BAKE);

    /* near-transparent cool membrane (WING_F: cool 0.64,0.76,1.0 · very faint) */
    o.globalCompositeOperation='source-over';
    var reach=P.span*1.06;
    var mg=o.createRadialGradient(0.05,0,0.02, 0.05,0,reach);
    mg.addColorStop(0.00,'rgba(163,194,255,0.11)');
    mg.addColorStop(0.50,'rgba(120,150,210,0.055)');
    mg.addColorStop(1.00,'rgba(90,110,170,0.015)');
    outline(o); o.fillStyle=mg; o.fill();

    o.save(); outline(o); o.clip();
      var rbz=o.createRadialGradient(0.03,0,0, 0.03,0,0.5);
      rbz.addColorStop(0,'rgba(210,225,255,0.24)'); rbz.addColorStop(1,'rgba(210,225,255,0)');
      o.fillStyle=rbz; o.beginPath(); o.arc(0.03,0,0.5,0,6.2832); o.fill();

      /* the vein fan — pale veins radiating from the root (wingVeinTex, exactly) */
      var nMain=isFore?11:9, k, tt;
      o.globalCompositeOperation='lighter'; o.lineCap='round';
      for(k=0;k<nMain;k++){
        var f=nMain>1?k/(nMain-1):0.5;
        var uE=0.70+0.26*Math.sin(f*Math.PI), tE=0.05+0.90*f;
        var uM=0.40+0.06*Math.sin(f*Math.PI), tM=0.20+0.58*f;
        var E=pt(uE,tE), M=pt(uM,tM);
        var vlen=Math.hypot(E[0],E[1]) || 1, dxn=E[0]/vlen, dyn=E[1]/vlen;

        o.strokeStyle='rgba(233,243,255,0.40)'; o.lineWidth=0.009*(1-0.4*f)+0.003;
        o.beginPath(); o.moveTo(0.02,0); o.quadraticCurveTo(M[0],M[1], E[0],E[1]); o.stroke();

        /* speckles + dashes streaming along each vein */
        for(tt=0.14; tt<=1.0; tt+=0.05+0.02*rnd()){
          var qX=qx2(0.02,M[0],E[0],tt), qY=qx2(0,M[1],E[1],tt);
          var x=qX+(rnd()-0.5)*0.045, y=qY+(rnd()-0.5)*0.045;
          var bt=Math.sin(Math.PI*Math.min(1,tt*1.04));
          o.globalAlpha=(0.16+0.5*bt)*(0.5+0.5*rnd());
          if(rnd()<0.13){ var dl=0.02+rnd()*0.03; o.lineWidth=0.006+rnd()*0.005; o.strokeStyle='rgba(236,244,255,1)';
            o.beginPath(); o.moveTo(x-dxn*dl*0.5,y-dyn*dl*0.5); o.lineTo(x+dxn*dl*0.5,y+dyn*dl*0.5); o.stroke();
            o.strokeStyle='rgba(233,243,255,0.40)';
          } else { var big=rnd()<0.06, rad=big?(0.011+rnd()*0.013):(0.004+rnd()*0.005);
            o.fillStyle='rgba(236,244,255,1)'; o.beginPath(); o.arc(x,y,rad,0,6.2832); o.fill(); }
        }
        /* a few secondary branches, lightly speckled */
        for(var bnc=0;bnc<3;bnc++){
          var bT=0.34+0.18*bnc, bx=qx2(0.02,M[0],E[0],bT), by=qx2(0,M[1],E[1],bT);
          var sd=(by<0?-1:1), ex=bx+0.11*(rnd()*0.6+0.4), ey=by+0.095*sd*(rnd()*0.6+0.4);
          o.globalAlpha=1; o.strokeStyle='rgba(233,243,255,0.22)'; o.lineWidth=0.005;
          o.beginPath(); o.moveTo(bx,by); o.quadraticCurveTo((bx+ex)/2,(by+ey)/2, ex,ey); o.stroke();
          for(var d2=0;d2<3;d2++){ var bb=0.3+0.3*d2, sx=qx2(bx,(bx+ex)/2,ex,bb)+(rnd()-0.5)*0.02, sy=qx2(by,(by+ey)/2,ey,bb)+(rnd()-0.5)*0.02;
            o.globalAlpha=0.28+0.3*rnd(); o.fillStyle='rgba(236,244,255,1)'; o.beginPath(); o.arc(sx,sy,0.004+rnd()*0.004,0,6.2832); o.fill(); }
        }
        o.strokeStyle='rgba(233,243,255,0.40)';
      }
      /* a fine dusting scattered over the membrane */
      o.globalCompositeOperation='lighter'; o.fillStyle='rgba(236,244,255,1)';
      for(var sc=0; sc<(isFore?95:75); sc++){
        var su=0.1+0.85*rnd(), st=rnd(), Pp=pt(su,st);
        o.globalAlpha=0.10+0.28*rnd();
        o.beginPath(); o.arc(Pp[0]+(rnd()-0.5)*0.03, Pp[1]+(rnd()-0.5)*0.03, 0.003+rnd()*0.004, 0, 6.2832); o.fill();
      }
      o.globalAlpha=1;
    o.restore();

    o.globalCompositeOperation='lighter';
    outline(o); o.lineWidth=0.010; o.strokeStyle='rgba(200,216,245,0.13)'; o.stroke();
    return { canvas:oc, ox:ox, oy:oy };
  }
  function ensureWings(){
    if (foreWing) return;
    foreWing = bakeWing(true,  mulberry32(0x9e3779b1));
    hindWing = bakeWing(false, mulberry32(0x51ed2701));
  }
  function drawBakedWing(w, hx, hy, rot, mirror){
    g.save(); g.translate(hx,hy); if (mirror) g.scale(-1,1); g.rotate(rot);
    g.scale(1/BAKE, 1/BAKE); g.drawImage(w.canvas, -w.ox, -w.oy); g.restore();
  }

  function drawMoth(cx, cy, s, angle, flap, openP, glow){
    ensureWings();
    openP=clamp(openP,0,1); glow=clamp(glow,0,1);
    g.save(); g.scale(dpr,dpr); g.translate(cx,cy); g.rotate(angle); g.scale(s,s);

    g.globalCompositeOperation='lighter';
    var aura=g.createRadialGradient(0,-0.2,0.1, 0,-0.2,2.1);
    aura.addColorStop(0.00,'rgba(120,145,190,'+(0.06+0.08*glow).toFixed(3)+')');
    aura.addColorStop(1.00,'rgba(120,145,190,0)');
    g.fillStyle=aura; g.beginPath(); g.arc(0,-0.2,2.1,0,6.2832); g.fill();

    /* four wings from one root; sweep is baked into the shape, small rest tilt */
    var beat=Math.sin(flap), beat2=Math.sin(flap-0.7);
    var foreRot=-0.06 - openP*0.22 + beat *(0.20+0.05*openP);
    var hindRot= 0.42 + openP*0.20 + beat2*(0.16+0.04*openP);
    var rootX=0.05, wingA=(0.82+0.18*glow);
    g.globalCompositeOperation='source-over'; g.globalAlpha=wingA;
    drawBakedWing(hindWing,  rootX, 0, hindRot, false);
    drawBakedWing(hindWing, -rootX, 0, hindRot, true);
    drawBakedWing(foreWing,  rootX, 0, foreRot, false);
    drawBakedWing(foreWing, -rootX, 0, foreRot, true);
    g.globalAlpha=1;

    /* body — slender segmented spindle below the root; bright thorax, faint abdomen */
    g.globalCompositeOperation='source-over';
    var bg=g.createLinearGradient(0,-0.16, 0,0.48);
    bg.addColorStop(0.00,'rgba(150,166,196,0.90)');
    bg.addColorStop(0.30,'rgba(70,78,98,0.90)');
    bg.addColorStop(1.00,'rgba(26,30,42,0.40)');
    g.fillStyle=bg; g.beginPath(); g.ellipse(0,0.16,0.090,0.30,0,0,6.2832); g.fill();
    g.strokeStyle='rgba(16,18,26,0.5)'; g.lineWidth=0.015;
    for(var sy=0.0; sy<0.42; sy+=0.075){ g.beginPath(); g.moveTo(-0.07,sy); g.quadraticCurveTo(0,sy+0.02,0.07,sy); g.stroke(); }

    /* fur bloom, tail hairs, and two spark-eyes (additive) */
    g.globalCompositeOperation='lighter';
    var fur=g.createRadialGradient(0,-0.06,0.01, 0,-0.06,0.26);
    fur.addColorStop(0.00,'rgba(204,222,255,'+(0.20+0.10*glow).toFixed(3)+')');
    fur.addColorStop(1.00,'rgba(204,222,255,0)');
    g.fillStyle=fur; g.beginPath(); g.arc(0,-0.06,0.26,0,6.2832); g.fill();
    g.strokeStyle='rgba(199,219,255,0.24)'; g.lineWidth=0.005; g.lineCap='round';
    for(var hh=0;hh<16;hh++){ var fk=hh/15, an=Math.PI*0.5+(fk-0.5)*1.5, L=0.09+0.06*Math.sin(fk*Math.PI);
      g.beginPath(); g.moveTo(0,0.44); g.lineTo(Math.cos(an)*L, 0.44+Math.sin(an)*L); g.stroke(); }
    for(var e=-1;e<=1;e+=2){ g.fillStyle='rgba(179,219,255,0.65)'; g.beginPath(); g.arc(e*0.075,-0.16,0.015,0,6.2832); g.fill(); }

    /* antennae — long, near-straight, feathered, up to glowing moon-heads */
    var sway=0.03*Math.sin(flap*0.5);
    for(var sgn=-1; sgn<=1; sgn+=2){
      var ax0=sgn*0.03, ay0=-0.16;
      var atx=sgn*(0.34+sway), aty=-1.52;
      var ac1x=sgn*0.10, ac1y=-0.72, ac2x=sgn*0.30, ac2y=-1.20;
      g.globalCompositeOperation='lighter';
      g.lineWidth=0.012; g.lineCap='round';
      g.strokeStyle='rgba(199,219,255,'+(0.5*(0.7+0.3*glow)).toFixed(3)+')';
      g.beginPath(); g.moveTo(ax0,ay0); g.bezierCurveTo(ac1x,ac1y, ac2x,ac2y, atx,aty); g.stroke();
      g.lineWidth=0.005; g.strokeStyle='rgba(198,218,255,0.26)';
      for(var k2=1;k2<=10;k2++){ var u=k2/11;
        var bx=cub(ax0,ac1x,ac2x,atx,u), by=cub(ay0,ac1y,ac2y,aty,u), bl=0.04*Math.sin(Math.PI*u);
        g.beginPath(); g.moveTo(bx,by); g.lineTo(bx-sgn*bl, by+0.006); g.stroke();
        g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+sgn*bl, by-0.006); g.stroke();
      }
      var orbR=0.085+0.02*openP;
      var halo=g.createRadialGradient(atx,aty,0, atx,aty,orbR*3.0);
      halo.addColorStop(0.00,'rgba(209,227,255,'+(0.72*(0.6+0.4*glow)).toFixed(3)+')');
      halo.addColorStop(0.40,'rgba(150,178,235,'+(0.30*(0.6+0.4*glow)).toFixed(3)+')');
      halo.addColorStop(1.00,'rgba(150,178,235,0)');
      g.fillStyle=halo; g.beginPath(); g.arc(atx,aty,orbR*3.0,0,6.2832); g.fill();
      g.save(); g.translate(atx,aty); g.scale(0.82,1.25);
      g.fillStyle='rgba(240,247,255,0.95)'; g.beginPath(); g.arc(0,0,orbR,0,6.2832); g.fill(); g.restore();
    }

    /* the moon above — fades as the moth commits to the flame */
    if (SHOW_MOON){
      var moonA=clamp(1 - openP*1.15, 0, 1) * (0.6+0.4*glow);
      if (moonA>0.02){ var mx=0, my=-1.92;
        g.globalCompositeOperation='lighter';
        var m2=g.createRadialGradient(mx,my,0, mx,my,0.5);
        m2.addColorStop(0.00,'rgba(240,247,255,'+(0.80*moonA).toFixed(3)+')');
        m2.addColorStop(0.32,'rgba(198,214,244,'+(0.30*moonA).toFixed(3)+')');
        m2.addColorStop(1.00,'rgba(178,200,240,0)');
        g.fillStyle=m2; g.beginPath(); g.arc(mx,my,0.5,0,6.2832); g.fill();
        g.fillStyle='rgba(255,255,255,'+(0.9*moonA).toFixed(3)+')';
        g.beginPath(); g.arc(mx,my,0.085,0,6.2832); g.fill();
        g.strokeStyle='rgba(255,255,255,'+(0.30*moonA).toFixed(3)+')'; g.lineWidth=0.008; g.lineCap='round';
        g.beginPath(); g.moveTo(mx-0.24,my); g.lineTo(mx+0.24,my);
        g.moveTo(mx,my-0.24); g.lineTo(mx,my+0.24); g.stroke();
      }
    }
    g.restore();
  }

  /* ── motes, embers, smoke, flash ───────────────────────────────────────── */
  var motes=[], embers=[], smoke=[];
  function stepMotes(dt){
    g.save(); g.scale(dpr,dpr); g.globalCompositeOperation='lighter';
    for (var i=motes.length-1;i>=0;i--){
      var m=motes[i]; m.t+=dt; if (m.t>m.life){ motes.splice(i,1); continue; }
      m.x+=m.vx*dt; m.y+=m.vy*dt; var u=m.t/m.life;
      g.globalAlpha=(1-u)*0.5; g.fillStyle='rgba(216,226,246,1)';
      g.beginPath(); g.arc(m.x,m.y,m.r*(1-u*0.3),0,6.2832); g.fill();
    }
    g.restore(); g.globalAlpha=1;
  }
  function spawnEmbers(x,y,n){
    for (var i=0;i<n;i++){
      var ang=-Math.PI/2+(Math.random()-0.5)*2.2, spd=40+Math.random()*180;
      embers.push({ x:x+(Math.random()-0.5)*10, y:y+(Math.random()-0.5)*10,
        vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-Math.random()*30,
        t:0, life:0.5+Math.random()*0.9, r:0.6+Math.random()*1.3, hot:Math.random()<0.4 });
    }
  }
  function stepEmbers(dt){
    g.save(); g.scale(dpr,dpr); g.globalCompositeOperation='lighter';
    for (var i=embers.length-1;i>=0;i--){
      var s=embers[i]; s.t+=dt; if (s.t>s.life){ embers.splice(i,1); continue; }
      s.vy+=150*dt; s.vx*=(1-0.7*dt); s.x+=s.vx*dt; s.y+=s.vy*dt;
      var u=s.t/s.life, al=(1-u)*(1-u), rr=s.r*(1-u*0.4);
      g.globalAlpha=al*0.5; g.fillStyle=s.hot?'rgba(255,246,220,1)':'rgba(255,206,120,1)';
      g.beginPath(); g.arc(s.x,s.y,rr*1.8,0,6.2832); g.fill();
      g.globalAlpha=Math.min(1,al*1.6); g.fillStyle=s.hot?'rgb(255,252,240)':'rgb(255,228,150)';
      g.beginPath(); g.arc(s.x,s.y,rr,0,6.2832); g.fill();
    }
    g.restore(); g.globalAlpha=1;
  }
  function spawnSmoke(x,y,n){
    for (var i=0;i<n;i++){
      smoke.push({ x:x+(Math.random()-0.5)*14, y:y+(Math.random()-0.5)*8,
        vx:(Math.random()-0.5)*14, vy:-(22+Math.random()*30),
        t:0, life:1.6+Math.random()*1.6, r:8+Math.random()*14, grow:26+Math.random()*30,
        sway:0.4+Math.random()*0.8, seed:Math.random()*6.28 });
    }
  }
  function stepSmoke(dt, now){
    g.save(); g.scale(dpr,dpr); g.globalCompositeOperation='source-over';
    for (var i=smoke.length-1;i>=0;i--){
      var s=smoke[i]; s.t+=dt; if (s.t>s.life){ smoke.splice(i,1); continue; }
      s.vy+=5*dt; s.x+=(s.vx+Math.sin(now*0.001*s.sway+s.seed)*10)*dt; s.y+=s.vy*dt;
      var u=s.t/s.life, rr=s.r+s.grow*u, al=Math.sin(Math.PI*Math.min(1,u*1.1))*0.22;
      var gr=g.createRadialGradient(s.x,s.y,0, s.x,s.y,rr);
      gr.addColorStop(0.00,'rgba(150,150,158,'+al.toFixed(3)+')');
      gr.addColorStop(0.55,'rgba(120,120,130,'+(al*0.6).toFixed(3)+')');
      gr.addColorStop(1.00,'rgba(110,110,120,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(s.x,s.y,rr,0,6.2832); g.fill();
    }
    g.restore();
  }
  function drawFlash(x,y,p,unit){
    if (p<=0 || p>=1) return;
    var a=Math.sin(Math.PI*p), R=unit*(0.4+1.35*p);
    g.save(); g.scale(dpr,dpr); g.globalCompositeOperation='lighter';
    var gr=g.createRadialGradient(x,y,0, x,y,R);
    gr.addColorStop(0.00,'rgba(255,252,238,'+(0.78*a).toFixed(3)+')');
    gr.addColorStop(0.25,'rgba(255,236,180,'+(0.45*a).toFixed(3)+')');
    gr.addColorStop(0.60,'rgba(255,210,120,'+(0.18*a).toFixed(3)+')');
    gr.addColorStop(1.00,'rgba(255,200,110,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,R,0,6.2832); g.fill();
    var cR=unit*0.30*(1-p*0.4);
    var cr=g.createRadialGradient(x,y,0, x,y,cR);
    cr.addColorStop(0,'rgba(255,255,250,'+(0.82*a).toFixed(3)+')');
    cr.addColorStop(1,'rgba(255,250,235,0)');
    g.fillStyle=cr; g.beginPath(); g.arc(x,y,cR,0,6.2832); g.fill();
    g.restore();
  }

  /* ── the ashfall — what remains of the moth, falling in a slow grey rain.
        the book forms out of it below ('apwnp:book-form'). each flake carries
        only an OFFSET across the cover; its landing place is re-asked every
        frame, so the stream keeps finding the book while the book grows. ──── */
  var ash = [], ashT0 = -1, formSent = false, lastAshEnd = -1;
  function targetBand(){
    var t = null;
    try{ t = window.__coverTop ? window.__coverTop() : null; }catch(e){ t = null; }
    if (!t){ var ff = flame(); t = { x: ff.x, y: H*0.62, hw: Math.min(W*0.21, 100) }; }
    if (!t.hw) t.hw = Math.min(W*0.21, 100);
    return t;
  }
  function spawnAsh(f, now){
    ashT0 = now;
    var i;
    for (i = 0; i < ASH.n; i++){
      var ember = Math.random() < 0.18;
      var fine  = !ember && Math.random() < 0.35;          /* a share of finer dust between the flakes */
      /* spread across the cover: dense at the middle, feathered at the edges */
      var sp = (Math.random()+Math.random()-1) * 1.15;
      ash.push({
        x0: f.x + (Math.random()-0.5)*26,
        y0: f.core - 4 + Math.random()*12,
        spread: sp,                                        /* … × the cover's live half-width */
        tyOff: (Math.random()-0.5)*10 + Math.random()*10,
        t0: now + ASH.delay + Math.pow(Math.random(), 0.8)*ASH.span,
        dur: 1400 + Math.random()*1700,
        sway: (Math.random()-0.5)*100,
        sph: Math.random()*6.2832,
        r: ember ? 0.8+Math.random()*1.1 : (fine ? 0.55+Math.random()*0.6 : 1.1+Math.random()*1.9),
        rot: Math.random()*6.2832, vr: (Math.random()-0.5)*3.4,
        ember: ember, done: false
      });
    }
  }
  function ashActive(){
    for (var i=0;i<ash.length;i++) if (!ash[i].done) return true;
    return false;
  }
  function stepAsh(now, dt){
    if (!ash.length) return;
    var tb = targetBand();                                 /* asked fresh — the book is growing under the fall */
    g.save(); g.scale(dpr,dpr);
    for (var i=0;i<ash.length;i++){
      var a2 = ash[i];
      if (a2.done || now < a2.t0) continue;
      var tx = tb.x + a2.spread*tb.hw, ty = tb.y + a2.tyOff;
      var u = clamp((now - a2.t0)/a2.dur, 0, 1);
      if (u >= 1){
        a2.done = true; lastAshEnd = now;
        if (Math.random() < 0.5)                           /* the flake settles — a small grey breath */
          motes.push({ x:tx, y:ty, t:0, life:0.5+Math.random()*0.6,
                       vx:(Math.random()-0.5)*10, vy:-4-Math.random()*8, r:0.6+Math.random()*0.9 });
        continue;
      }
      var v = u*u*(3-2*u)*0.25 + easeIn(u)*0.75;           /* drifting, then settling */
      var px = lerp(a2.x0, tx, v) + Math.sin(now*0.0016 + a2.sph)*a2.sway*(1-v)*0.35;
      var py = lerp(a2.y0, ty, v);
      a2.rot += a2.vr*dt;
      var heat = a2.ember ? Math.max(0, 1 - u*2.2) : 0;    /* embers cool grey mid-fall */
      var al = (u < 0.08 ? u/0.08 : 1) * (1 - Math.pow(u, 6)) * 0.8;
      if (heat > 0){
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = al*heat*0.8;
        g.fillStyle = 'rgba(255,196,110,1)';
        g.beginPath(); g.arc(px, py, a2.r*1.9, 0, 6.2832); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
      var grey = Math.round(lerp(152, 96, u*0.6) + heat*70);
      g.globalAlpha = al;
      g.fillStyle = 'rgb('+grey+','+(grey-4)+','+(grey-8)+')';
      g.save(); g.translate(px, py); g.rotate(a2.rot);
      g.fillRect(-a2.r, -a2.r*0.55, a2.r*2, a2.r*1.1);      /* a small tumbling flake */
      g.restore();
    }
    g.restore(); g.globalAlpha = 1;
  }

  /* ── the flight ────────────────────────────────────────────────────────── */
  var t0=0, last=0, raf=0, flashT0=-1, fadeT0=-1;
  var enterFrom=null, orbitAngle=0, path={ x:0,y:0,px:0,py:0,heading:0 };

  function begin(){
    if (started) return; started=true; size();
    var f=flame();
    enterFrom={ x:f.x+(Math.random()<0.5?-1:1)*W*0.16, y:-H*0.12 };
    orbitAngle=Math.atan2(enterFrom.y-f.core, enterFrom.x-f.x);
    path.x=enterFrom.x; path.y=enterFrom.y; path.px=enterFrom.x; path.py=enterFrom.y+1;
    t0=performance.now(); last=t0; raf=requestAnimationFrame(frame);
  }

  function frame(now){
    raf=requestAnimationFrame(frame);
    var dt=last?Math.min(0.05,(now-last)/1000):0.016; last=now;
    if (document.hidden) return;

    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cv.width,cv.height);

    var f=flame(), unit=f.h;
    var mothS=clamp(unit*MOTH_SCALE, 16, 58);
    var el=now-t0;
    var alive=true, cx=path.x, cy=path.y, glow=0.4, openP=0, flap=now*0.017, phase='enter';

    if (el < T.enter){
      var p=ease(el/T.enter);
      var orx=f.x+Math.cos(orbitAngle)*unit*0.5;
      var ory=f.core+Math.sin(orbitAngle)*unit*0.42-unit*0.08;
      cx=lerp(enterFrom.x,orx,p); cy=lerp(enterFrom.y,ory,p);
      cx+=Math.sin(el*0.012)*unit*0.06*(1-p);
      mothS*=lerp(0.62,1.0,p); glow=lerp(0.35,0.6,p); flap=now*0.02;
    } else if (el < T.enter+T.orbit){
      phase='orbit';
      var q=(el-T.enter)/T.orbit, qe=ease(q);
      orbitAngle+=dt*(2.1+0.7*Math.sin(el*0.004));
      var rBase=lerp(unit*0.62, unit*0.16, easeIn(q));
      var flutter=1+0.16*Math.sin(el*0.02)+0.10*Math.sin(el*0.031+1);
      var dart=0.16*Math.max(0, Math.sin(el*0.006-1.2));
      var rad=rBase*flutter*(1-dart);
      cx=f.x+Math.cos(orbitAngle)*rad; cy=f.core+Math.sin(orbitAngle)*rad*0.82-unit*0.05;
      glow=0.6+0.35*qe+0.12*Math.sin(el*0.02); openP=0.15+0.2*Math.sin(el*0.02);
      flap=now*0.019+6*Math.sin(el*0.003);
    } else if (el < T.enter+T.orbit+T.dive){
      phase='dive';
      var d=(el-(T.enter+T.orbit))/T.dive, de=easeIn(d);
      orbitAngle+=dt*(3.0+6.0*de);
      var rad2=lerp(unit*0.16, 0.0, de);
      cx=f.x+Math.cos(orbitAngle)*rad2; cy=f.core+Math.sin(orbitAngle)*rad2-unit*0.02;
      glow=lerp(0.95,1.0,d); openP=lerp(0.4,1.0,de); mothS*=lerp(1.0,0.7,de); flap=now*0.03;
      if (d>=0.86 && flashT0<0){
        flashT0=now;
        if (window.__flameSurge) window.__flameSurge(1.7);
        spawnEmbers(f.x,f.core,34); spawnSmoke(f.x,f.core-unit*0.04,18);
        setTimeout(function(){ spawnSmoke(f.x,f.core-unit*0.10,12); }, 200);
        setTimeout(function(){ spawnSmoke(f.x,f.core-unit*0.16,7);  }, 520);
      }
    } else {
      phase='gone'; alive=false;
      if (flashT0<0){ flashT0=now; if (window.__flameSurge) window.__flameSurge(1.7);
        spawnEmbers(f.x,f.core,34); spawnSmoke(f.x,f.core,18);
        setTimeout(function(){ spawnSmoke(f.x,f.core-unit*0.10,10); }, 260); }
      if (fadeT0<0) fadeT0=now+1400;
    }

    /* orientation: upright (antennae up), banking gently into sideways drift */
    var vx=cx-path.px;
    var lean=clamp(vx*0.014, -0.6, 0.6);
    path.heading += (lean - path.heading) * clamp(dt*9, 0, 1);
    path.px=cx; path.py=cy; path.x=cx; path.y=cy;

    if (alive && (phase==='enter'||phase==='orbit') && Math.random()<0.5){
      motes.push({ x:cx+(Math.random()-0.5)*mothS*0.7, y:cy+(Math.random()-0.5)*mothS*0.7,
        t:0, life:0.7+Math.random()*0.8, vx:(Math.random()-0.5)*8, vy:-8-Math.random()*14, r:0.8+Math.random()*1.2 });
    }

    /* the ash — spawned just after the flash; the book forms beneath it */
    if (flashT0>0 && ashT0<0 && now > flashT0 + 60){
      spawnAsh(f, now);
      if (!formSent){
        formSent = true;
        try{ window.dispatchEvent(new CustomEvent('apwnp:book-form')); }catch(e){}
      }
    }
    if (ash.length) stepAsh(now, dt);

    if (motes.length) stepMotes(dt);
    if (alive) drawMoth(cx,cy,mothS,path.heading,flap,openP,glow);
    if (flashT0>0){ var fp=(now-flashT0)/560; if (fp<1) drawFlash(f.x,f.core,fp,unit); }
    if (embers.length) stepEmbers(dt);
    if (smoke.length)  stepSmoke(dt,now);

    if (fadeT0>0 && now>=fadeT0 && !ashActive()){
      var fadeFrom = Math.max(fadeT0, lastAshEnd + 250);
      if (now >= fadeFrom){
        var fo=1-ease((now-fadeFrom)/1600);
        cv.style.opacity=String(clamp(fo,0,1));
        if (fo<=0 && !smoke.length){ retire(); return; }
      }
    }
  }

  function retire(){
    done=true; if (raf){ cancelAnimationFrame(raf); raf=0; }
    try { if (cv && cv.parentNode) cv.parentNode.removeChild(cv); } catch(e){}
  }

  window.addEventListener('message', function(e){
    if (e && e.data && e.data.apwnp === 'arrive-moth') begin();
  });
  function fallback(){ setTimeout(function(){ if (!started && !done) begin(); }, 650); }
  if (document.readyState === 'complete' || document.readyState === 'interactive') fallback();
  else document.addEventListener('DOMContentLoaded', fallback);
})();
</script>
