25 sep 2026 as squat.html, its own file since 26 sep:
nobody's writing room. a deck of old boards very high up, the earth far
below with its dusk line going round, the moon passing close now and then,
the stars. on the deck one round low table; on the table a stack of paper, a
brush, a dish of ink. nobody (the phone's inhabitant, through mortal.js's
one doorway) takes a sheet, writes a haiku on it in ink — about where the
phone is, the two spells (am i alone? am i anybody?), the two circles that
overlap into an eye, its search for home, its own days, and, obliquely, the
weather the visitor left in the other rooms — dates it at the foot, folds it
into a paper boat with the words inside, sets the boat on the boards, and
lets it ride the only current there is: the dusk line's slow turn. at the
first gap the boat slips through, falls into the earth's sky, turning and
shrinking, a white speck on the day side, crosses the dusk band, and on the
night side settles among the lights people left on and becomes one of them.
every haiku ever let go is one more light on the night side. then the camera
comes back to the table and nobody begins the next sheet. the visitor may
stay or leave; there is nothing to touch.

the fold is origami-boat.js (THE FOLD, 25 sep), beside this file, with its
`inside` option (the first fold a valley, so the writing ends inside the

const N3=(function(){

              let k=(z0+y0+x0)*3; const a=G[k]*fx+G[k+1]*fy+G[k+2]*fz; k=(z0+y0+x1)*3; const b=G[k]*(fx-1)+G[k+1]*fy+G[k+2]*fz;
              k=(z0+y1+x0)*3; const c=G[k]*fx+G[k+1]*(fy-1)+G[k+2]*fz; k=(z0+y1+x1)*3; const d=G[k]*(fx-1)+G[k+1]*(fy-1)+G[k+2]*fz;

/* ---------------- ENV — the room's own reflections ----------------
   a 64×32 panorama: the night above, the earth's lit band below the horizon
   (brightest under the sun), the moon where it is. PMREM'd into
   scene.environment — what the ink dish, the brush's ferrule and the table's
   varnish reflect. repainted every few seconds as the sun goes round. */
const ENV=(function(){

    try{ SKY.env(q,W,H,uOf,glow); }catch(_){} dirty=true; }

  return { paint, apply, canvas:cv };
})();

/* ---------------- REVEAL — the arrival: the room comes up out of the black ----------------
   the tile's black sheet ends on black; this page's first paint is black; the room
   fades up over a few seconds (the sky last). ?reveal=k paces it (0: at once). */
const REVEAL=(function(){
  const S={ room:0, sky:0 }; const k=FLAGS.reveal; const SCHED={ room:[0.2,3.2], sky:[1.4,7.0] };
  let t=-1, begun=false;
  function begin(){ if(begun) return; begun=true; t=0; if(k<=0){ S.room=S.sky=1; t=1e9; } }
  function tick(dt){ if(!begun||t>=1e9) return S; t+=dt; let all=true; Object.keys(SCHED).forEach(n=>{ const [a,b]=SCHED[n]; S[n]=sstep(a*k,b*k,t); if(S[n]<1) all=false; }); if(all) t=1e9; return S; }
  return { S, begin, tick, get done(){ return t>=1e9; } };
})();

/* ---------------- FLOOR — old boards on joists, their gaps and breaks, a plywood patch, and the dust ----------------
   THE EARTHLIGHT PASS's deck (21 sep 2026; RULED: OLD BOARDS WITH GAPS), kept whole: the stamps of the ledger's marks
   are simply never made now (nobody leaves footprints here). onWood(x,z,tol) is what the boat asks as it rides. */
const FLOOR=(function(){
  const SIZE=6, PX=LOW?1024:2048, K=PX/SIZE, FR=FLAGS.floorr, BT=0.026, BW=0.142;
  const cv=KIT.canvas(PX,PX), q=cv.getContext('2d');
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
  const HOLES_ON=FLAGS.holes>0, HK=FLAGS.holek, GK=Math.max(0,FLAGS.gaps);
  const rr=rng(hash32('deck'));
  /* ---- where the wood is knot: ellipses in the room's own metres [cx, cz, rx, rz] (the first three are the old holes' places; B lies under the patch) ---- */
  const RIMA=(a,r)=>[Math.sin(a*Math.PI/180)*r,-Math.cos(a*Math.PI/180)*r];
  const VOIDS=HOLES_ON?[
    [0.75,0.62,0.27*HK,0.33*HK,'A'], [-0.55,0.45,0.22*HK,0.27*HK,'B'], [0.55,-0.85,0.19*HK,0.25*HK,'C'],
    [...RIMA(232,FR-0.02),0.30*Math.min(1.25,HK),0.40*Math.min(1.2,HK),'bite'],
    [...RIMA(25,FR+0.02),0.16,0.26,'rim'], [...RIMA(160,FR+0.03),0.15,0.22,'rim'], [...RIMA(291,FR+0.02),0.17,0.30,'rim'], [...RIMA(350,FR+0.04),0.13,0.20,'rim']
  ]:[];
  const SLOTS=HOLES_ON?[ { x:1.05, z0:-0.52, z1:0.31 }, { x:-0.90, z0:-0.36, z1:0.12 } ]:[];   /* a board gone over a run (whichever board lies over x) */
  /* ---- the joists: across the boards, every 0.55 m; the rim beam, eight lengths ---- */
  const JZ=[]; for(let z=-1.925;z<=1.93;z+=0.55) JZ.push(z);
  /* ---- the boards: x by x, each with its own gap; then cut by the voids into pieces ---- */
  const boards=[]; { let x=-FR-0.02; let i=0; while(x<FR){ const w=BW*(0.93+rr()*0.12), gap=(0.007+rr()*rr()*0.022)*GK+0.0015; const xa=x, xb=Math.min(x+w,FR+0.05); if(xb-xa>0.03) boards.push({ i:i++, xa, xb, gapR:gap, strip:(rr()*4)|0, flipU:rr()<0.5, vOff:rr()*3, tone:0.80+rr()*0.30, warm:rr(), dy:-(rr()*rr())*0.0035 }); x=xb+gap; } }
  const pieces=[];
  boards.forEach(b=>{ const xm=(b.xa+b.xb)/2; const xe=Math.min(Math.abs(b.xa),Math.abs(b.xb)), xo=Math.max(Math.abs(b.xa),Math.abs(b.xb)); if(xe>=FR-0.02) return;

    VOIDS.forEach(v=>{ const u=(xm-v[0])/v[2]; if(Math.abs(u)>=1) return; const dz=v[3]*Math.sqrt(1-u*u); cutOut(v[1]-dz+(rr()-0.5)*0.10,v[1]+dz+(rr()-0.5)*0.10); });
    SLOTS.forEach(s=>{ if(s.x>=b.xa&&s.x<b.xb) cutOut(s.z0+(rr()-0.5)*0.05,s.z1+(rr()-0.5)*0.05); });
    /* butt joints on a joist for the long ones */
    const out=[]; iv.forEach(s=>{ if(s[1]-s[0]>2.3&&rr()<0.8){ const cand=JZ.filter(z=>z>s[0]+0.6&&z<s[1]-0.6); if(cand.length){ const zj=cand[(rr()*cand.length)|0]+(rr()-0.5)*0.01; out.push([s[0],zj-0.002,s[2],'butt']); out.push([zj+0.002,s[1],'butt',s[3]]); return; } } out.push(s); }); iv=out;
    iv.forEach((s,k)=>{ const len=s[1]-s[0]; if(len<0.09) return; const held=JZ.some(z=>z>s[0]+0.015&&z<s[1]-0.015); if(!held) return;    /* a length no joist carries has fallen to earth */
      pieces.push({ b, z0:s[0], z1:s[1], e0:s[2], e1:s[3], tone:b.tone*(0.94+rr()*0.12), sprung:((s[2]==='broken'||s[3]==='broken')&&rr()<0.30)?(0.006+rr()*0.016):0 }); }); });

    else if(kind==='butt'){ pts.push([b.xa,z],[b.xb,z]); }
    else { const n=5+((rr()*4)|0); let longAt=(rr()*n)|0; for(let k=0;k<=n;k++){ const x=b.xa+(b.xb-b.xa)*k/n; let t=(rr()-0.35)*0.05; if(k===longAt||(rr()<0.18)) t=0.05+rr()*0.13; if(k===0||k===n) t*=0.4; pts.push([x,z+sgn*t]); } }   /* teeth and one long splinter, running WITH the grain, out over the hole */
    return pts; }
  const bow=(b,z,side)=>Math.sin(z*1.7+b.i*2.1+side)*0.0022+Math.sin(z*4.3+b.i*0.7+side*2.0)*0.0009;
  function outline(p){ const b=p.b, pts=[]; const e0=endPts(p,0), e1=endPts(p,1);

    const za=e0[0][1], zb=e1[0][1], zc=e1[e1.length-1][1], zd=e0[e0.length-1][1];
    const seg=(zs,ze,x,side)=>{ const L=Math.abs(ze-zs), n=Math.max(1,Math.ceil(L/0.30)); const o=[]; for(let k=1;k<n;k++){ const z=zs+(ze-zs)*k/n; o.push([x+bow(b,z,side),z]); } return o; };
    e0.forEach(v=>pts.push(v)); seg(zd,zc,b.xb,1).forEach(v=>pts.push(v)); e1.slice().reverse().forEach(v=>pts.push(v)); seg(zb,za,b.xa,0).forEach(v=>pts.push(v));

    return pts; }

    /* the track: from where it slipped (its own point over the ground) away from the sun, past the dusk line (`sunel` degrees from the point under the house) into the night */
    const from=p0.clone().sub(C); const alt0=from.length()-ER; from.normalize(); const th1=se+6.5*Math.PI/180; const to=V3(d.x*Math.sin(th1),Math.cos(th1),d.z*Math.sin(th1));
    S.fall={ p0, d, from, to, alt0, C, ER, spin:V3(0.6+0.4*S.sheet.seed,0.9,0.4).normalize() }; speck.visible=true; speckM.opacity=0; go('fall'); }
  function track(e,alt,out){ const F=S.fall; out.copy(F.from).lerp(F.to,e).normalize().multiplyScalar(F.ER+alt).add(F.C); return out; }
  function fallTick(dt){ const F=S.fall, h=S.sheet.holder; const f=S.t, u=clamp(f/D.fall,0,1); const e=ssm(u);
    const alt=lerp(F.alt0,0.02,ssm(clamp(f/(D.fall*0.6),0,1)));   /* it falls through the first part, slowly, then goes on along the ground to the dusk */
    track(e,alt,h.position);
    const sc=lerp(1,0.12,ssm(clamp(f/9,0,1))); h.scale.setScalar(sc); h.rotateOnAxis(F.spin,dt*0.8);
    const meshA=1-ssm(clamp((f-4)/5,0,1)); h.visible=meshA>0.02; S.sheet.mf.transparent=S.sheet.mb.transparent=true; S.sheet.mf.opacity=S.sheet.mb.opacity=meshA;
    speck.position.copy(h.position); const dl=tmpV2.copy(h.position).sub(F.C).normalize().dot(SKY.S.sunW); const night=sstep(0.0,-0.085,dl), day=sstep(-0.06,0.22,dl);
    /* white on the day side, warm and small on the night side; it flickers a little as a far thing does */
    speckM.color.setRGB(lerp(1,1,night),lerp(1,0.66,night),lerp(1,0.34,night)); speckM.opacity=ssm(clamp((f-1.5)/3,0,1))*(0.55+0.45*day+0.3*night)*(0.9+0.1*Math.sin(f*9.1+S.sheet.seed*4))*SKY.glowK();
    speck.scale.setScalar(lerp(0.16,0.085,ssm(clamp(f/(D.fall*0.9),0,1)))); }
  function settle(){ track(1,0.02,tmpV); LAMPS.add(tmpV); speck.visible=false; speckM.opacity=0; const deed=(S.sheet.blank?'folded a blank sheet into a boat':(S.sheet.words.theme==='word'?'folded a boat with one word on it':(S.sheet.words.theme==='voice'?'wrote the line it keeps to itself, folded it into a boat':'wrote a haiku, folded it into a boat')))+' and let it go through the floor'; NOBODY.did(deed); VOICE.did(deed); }
  /* ---- the sign drops ---- */
  function freeze(){ S.frozen=true; }
  function died(){ S.dead=true; S.frozen=true; }
  /* the press jumps the act to a beat (with a sheet made) */
  function jump(beat){ if(!NOBODY.has) return false; if(!S.sheet){ S.seen=true; newSheet(); } const s=S.sheet; poseWriting();
    if(beat==='take'){ go('take'); return true; } if(beat==='write'){ go('write'); return true; } if(beat==='read'||beat==='lift'||beat==='fold'){ s.paper.write(s.paper.count); s.paper.flush(); if(beat==='fold'){ s.holder.position.copy(AIR); s.holder.rotation.set(TILT_READ,0,0); } go(beat); return true; }
    if(beat==='set'||beat==='ride'||beat==='slip'||beat==='fall'||beat==='light'){ s.paper.write(s.paper.count); s.paper.flush(); FOLD.set(s.boat,FOLD.duration); if(beat==='set'){ s.holder.position.copy(AIR); go('set'); return true; } beginRide(false); if(beat==='ride') return true; const h=s.holder; h.position.x+=current().x*0.6; h.position.z+=current().z*0.6; S.ride.slipAt=h.position.clone(); S.ride.slipRot=h.rotation.clone(); go('slip'); if(beat==='slip') return true; beginFall(); if(beat==='fall') return true; S.t=D.fall; fallTick(0.016); settle(); go('light'); return true; }
    return false; }
  window.addEventListener('apwnp:call',()=>{ freeze(); },false);
  return { S, tick, jump, freeze, died, brush, speck, D, get sheet(){ return S.sheet; }, get AIR(){ return AIR; }, SHEET_AT, current };
})();

/* ---------------- LAMPS — the lights on the night side ----------------
   every boat let go becomes one more light among the ones people left on: a warm point on
   the ground, fixed to the ground (it turns with the earth), lit only where the shader's own
   night is (the day takes it, as it takes the cities). in memory only — nothing stored; the
   earth's own lights stand for all the boats ever let go. */
const LAMPS=(function(){
  const MAX=64; const pos=new Float32Array(MAX*3), a=new Float32Array(MAX); const ge=new THREE.BufferGeometry(); ge.setAttribute('position',new THREE.BufferAttribute(pos,3)); ge.setAttribute('a',new THREE.BufferAttribute(a,1)); ge.setDrawRange(0,0);
  const m=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, depthTest:true, blending:THREE.AdditiveBlending, uniforms:{ uDpr:{ value:1 }, uSilver:{ value:0 }, uK:{ value:1 } },
    vertexShader:`attribute float a; uniform float uDpr; varying float vA; void main(){ vA=a; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=(2.6+1.8*a)*uDpr; gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform float uSilver; uniform float uK; varying float vA; vec3 apSilver(vec3 c){ float y=dot(c,vec3(0.30,0.59,0.11)); return vec3(y*0.92,y*0.96,min(1.0,y*1.05)); }
      void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d)*2.0; float k=smoothstep(1.0,0.2,r)*vA*uK; if(k<0.01) discard; vec3 c=mix(vec3(1.0,0.68,0.34),apSilver(vec3(1.0,0.68,0.34)),uSilver)*k; gl_FragColor=vec4(c,k); }` });
  const pts=new THREE.Points(ge,m); pts.frustumCulled=false; pts.renderOrder=-5; scene.add(pts);
  const local=[]; const tmp=V3(), qi=new THREE.Quaternion();
  function add(worldPt){ if(local.length>=MAX) local.shift(); const qE=SKY.qE(); qi.copy(qE).invert(); const l=worldPt.clone().sub(SKY.C).applyQuaternion(qi); local.push({ l, born:performance.now() }); }
  function tick(){ if(!local.length){ ge.setDrawRange(0,0); return; } const qE=SKY.qE(); const sun=SKY.S.sunW; for(let i=0;i<local.length;i++){ tmp.copy(local[i].l).applyQuaternion(qE); const n=tmp.clone().normalize(); const dl=n.dot(sun); tmp.add(SKY.C); pos[i*3]=tmp.x; pos[i*3+1]=tmp.y; pos[i*3+2]=tmp.z;
      a[i]=sstep(0.0,-0.085,dl)*sstep(0,1.5,(performance.now()-local[i].born)/1000)*SKY.glowK(); } ge.attributes.position.needsUpdate=true; ge.attributes.a.needsUpdate=true; ge.setDrawRange(0,local.length); m.uniforms.uDpr.value=DPR.cur; m.uniforms.uSilver.value=SIL.cur; }
  return { add, tick, get count(){ return local.length; } };
})();

/* ---------------- CAM — the room's own camera ----------------
   the visitor does knot steer. by beat: at the table, close, over the visitor's shoulder, for the
   writing; back a little for the fold in the air; up and back to see the boat set down and ride the
   boards; then out past the rim on the sun's side and DOWN under the deck, to watch the speck go
   away over the earth to the dusk band and become a light; a moment there; then home to the table.
   everything eased; the camera breathes. ?cam=free (the press): a fixed look from ?cx ?cy ?cz at the table. */
const CAM=(function(){
  const pos=V3(), tgt=V3(), wantP=V3(), wantT=V3(); let first=true, tAcc=0;
  const T=TABLE.TOP, SA=ACT.SHEET_AT;
  const TABLET=V3(SA.x,T+0.01,SA.z-0.02);
  const tableP=()=>{ const back=camera.aspect<1?1.0:0.74; return V3(SA.x+0.05*back,T+0.50*back+0.05,SA.z+0.54*back); };
  /* three-quarter, on the sun's side, looking after the boat as it goes down the current */
  function rideP(){ const S=ACT.S, d=ACT.current(); const back=camera.aspect<1?1.0:0.8; const side=V3(d.z,0,-d.x); const h=S.sheet?S.sheet.holder.position:TABLET;
    wantP.set(h.x+side.x*0.62*back-d.x*0.18,h.y+0.40*back,h.z+side.z*0.62*back-d.z*0.18);
    /* over the table it would skim the top: lift it clear */ const rr=Math.hypot(wantP.x-TABLE.C.x,wantP.z-TABLE.C.z); if(rr<TABLE.RAD+0.15) wantP.y=Math.max(wantP.y,T+0.42); return wantP; }
  function want(dt){ const S=ACT.S, b=S.beat; const port=camera.aspect<1; const back=port?1.0:0.72;
    tAcc+=dt; const br=V3(0.012*Math.sin(tAcc*0.23),0.008*Math.sin(tAcc*0.17),0.010*Math.sin(tAcc*0.29));
    let k=1.6;
    if(b==='idle'||b==='take'||b==='dip'||b==='write'||b==='read'){ wantP.copy(tableP()); wantT.copy(TABLET); }
    else if(b==='lift'||b==='fold'){ const A=ACT.AIR; wantP.set(A.x+0.02,A.y+0.30*back+0.12,A.z+0.80*back); wantT.set(A.x,A.y-0.02,A.z); }
    else if(b==='set'||b==='ride'||b==='slip'){ const h=S.sheet?S.sheet.holder.position:TABLET; rideP(); wantT.set(h.x,h.y+0.02,h.z); k=1.1; }
    else if(b==='fall'||b==='light'){ const d=ACT.current(); const spk=ACT.speck.position; const side=V3(d.z,0,-d.x);
      /* up and out over the rim, to the side of the boat's road and a little sun-ward, high enough that the dusk band and the night beyond it
         lie well under the horizon (from low down the dusk line hides at the limb); the speck comes out from under the deck's edge and goes away
         over the earth. home: straight back over the deck to the table (the road stays above the table's height) */
      const high=V3(TABLE.C.x+side.x*2.7-d.x*0.7,2.35,TABLE.C.z+side.z*2.7-d.z*0.7);
      if(b==='fall'){ const u1=ssm(clamp(S.t/4.5,0,1)); rideP(); wantP.lerp(high,u1); wantT.copy(spk); k=1.0; }
      else if(S.t<=ACT.D.linger){ wantP.copy(high); wantT.copy(spk); k=1.0; }
      else { const v=ssm(clamp((S.t-ACT.D.linger)/ACT.D.home,0,1)); wantP.copy(high).lerp(tableP(),v); wantT.copy(spk).lerp(TABLET,v); k=lerp(1.0,1.6,v); } }
    wantP.add(br);
    if(FLAGS.cam==='free'){ wantP.set(F('cx',0.4),F('cy',1.4),F('cz',1.4)); wantT.set(F('tx',0),F('ty',0.4),F('tz',0)); k=100; }
    return k; }
  function tick(dt){ const k=want(dt); if(first||FLAGS.still){ first=false; pos.copy(wantP); tgt.copy(wantT); } else { const e=1-Math.exp(-dt*k); pos.lerp(wantP,e); tgt.lerp(wantT,e*1.15); }
    camera.position.copy(pos); camera.lookAt(tgt); }
  return { tick, pos, tgt };
})();

/* ================================================================
   PRESS — window.__origami: the harness's handles (never the visitor's)
================================================================ */
const PRESS={ frames:0, ready:false, BUILD, FLAGS, sil:SIL, floor:FLOOR, sky:SKY, act:ACT, words:WORDS, paper:PAPER, nobody:NOBODY, voice:VOICE, lamps:LAMPS, cam:CAM, table:TABLE, fold:FOLD, reveal:REVEAL,
  camera, scene, renderer, THREE, V3, world,
  screenOf:(v)=>{ const p=v.clone().project(camera); return { x:(p.x+1)/2*VW(), y:(1-p.y)/2*VH(), z:p.z }; },
  beat:()=>ACT.S.beat, t:()=>ACT.S.t, sheet:()=>{ const s=ACT.S.sheet; return s?{ lines:s.words.lines, foot:s.words.foot, theme:s.words.theme, count:s.paper.count }:null; },
  compose:(n)=>WORDS.compose(n,NOBODY.now(),{ first:n===0, sunAz:SKY.S.sunAz, moonUp:SKY.S.moonUp, count:n },NOBODY.chance),
  /* the press's clock: under ?still=1 the loop leaves the act alone and the bench steps it by hand, in act-seconds (the sky keeps its own clock) */
  step:(sec)=>{ let left=Math.max(0,+sec||0); const nb=NOBODY.now(); while(left>0){ const d=Math.min(0.05,left); left-=d; ACT.tick(d,nb); CAM.tick(d); } LAMPS.tick(); return ACT.S.beat+' '+ACT.S.t.toFixed(2); } };
window.__origami=PRESS;

/* ================================================================
   LOOP and BOOT
================================================================ */
let lastT=performance.now(), envAt=0, gone=false, bootOff=false, jumped=false;
function frame(){ if(gone) return; requestAnimationFrame(frame); const now=performance.now(); let dt=(now-lastT)/1000; lastT=now; if(dt>0.05) dt=0.05; if(dt<=0) dt=0.001;
  const e=SIL.tick(); const rev=REVEAL.tick(dt);
  SKY.tick(dt,rev);
  const nb=NOBODY.now(); if(nb&&nb.dead) ACT.died();
  const adt=FLAGS.still?0:dt*FLAGS.speed; if(!jumped&&FLAGS.jump&&PRESS.frames>2){ jumped=true; ACT.jump(FLAGS.jump); }
  ACT.tick(adt,nb);
  LAMPS.tick(); CAM.tick(FLAGS.still?0.016:dt);
  /* the lights: the warm spot comes up with the room; the moonlight follows the moon; the earth's blue from below */
  spot.intensity=SPOT_I*rev.room; SIL.col(spot.color,spot.userData.orig,e); fill.intensity=0.32*rev.room; fill.position.copy(camera.position).add(V3(0.15,0.25,0)); fill.target.position.copy(CAM.tgt); SIL.col(fill.color,fill.userData.orig,e);
  hemi.intensity=0.42*rev.room; moon.intensity=SKY.moonK()*rev.room; SIL.col(moon.color,moon.userData.orig,e); SKY.lights(e);
  if(now-envAt>3000){ envAt=now; ENV.paint(); ENV.apply(); }
  renderer.render(scene,camera); PRESS.frames++;
  if(!bootOff&&PRESS.frames>=3){ bootOff=true; el('boot').classList.add('off'); REVEAL.begin(); PRESS.ready=true; }
  /* adaptive dpr: over budget for two seconds, drop a step; under it for eight, climb back */
  DPR.acc+=dt; DPR.n++; if(DPR.n>=60){ const avg=DPR.acc/DPR.n; DPR.acc=0; DPR.n=0; if(!FLAGS.dpr){ if(avg>0.03&&DPR.cur>1){ DPR.cur=Math.max(1,DPR.cur-0.25); sizeUp(); DPR.cool=8; } else if(avg<0.014&&DPR.cur<DPR.cap&&DPR.cool<=0){ DPR.cur=Math.min(DPR.cap,DPR.cur+0.25); sizeUp(); } DPR.cool-=1; } }
  if(FLAGS.test){ const h=el('hud'); h.style.display='block'; const s=ACT.S; h.textContent=BUILD+'\ndpr '+DPR.cur+' · silver '+e.toFixed(3)+' · frames '+PRESS.frames+'\n'+SKY.hud()+'\nnobody '+(NOBODY.has?(nb?(nb.stageName+' '+(nb.here?'here':'away')):'no reading'):'none')+' · '+s.beat+' '+s.t.toFixed(1)+'s · sheet '+s.n+' · lamps '+LAMPS.count; }
}
window.addEventListener('resize',()=>{ sizeUp(); });
window.addEventListener('pagehide',()=>{ gone=true; });
function boot(){ sizeUp(); ENV.paint(); ENV.apply(); try{ SKY.warm(); }catch(_){} frame(); try{ window.__origamiWake(); }catch(_){} }
try{ boot(); }catch(e){ log('boot',e); }
</script>
</body>
</html>
