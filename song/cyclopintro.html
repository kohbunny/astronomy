<title>lullaby for one living skull · intro v1</title>
<!--
  cyclopskull_intro_1.html · the intro film, first cut (6 aug 2026)

  WHAT THIS IS. a forty-five second 3d lullaby that stands BEFORE the
  cyclopskull room: the star dies, the clock remains, one pulse crosses
  512 years, turning becomes tone, the vacuum admits it has no breath,
  one amber breath answers, a skull of light forms around the visitor,
  and the last frame — the tone waiting beside an empty wave, the word
  "hum" — is the first frame of the tuning exercise. the film performs
  everything EXCEPT the meeting: the trembling slows and never finishes.

  THE TIMELINE (the nine beats · scrub the bar, or the beats panel):
    0:00  an old star                    a calm giant, breathing
    0:06  the star dies                  quiet bloom; only a point remains
    0:11  the clock that remained        two beams keep turning
    0:17  five hundred and twelve years  one pulse crosses · 1514 → 2026
    0:24  turning becomes tone           the lens · 173.68 turns in 1 second
    0:30  no breath                      vacuum · the emptiest frame
    0:33  lend me yours                  the first warm color · one breath
    0:36  inside your skull              bone forms around you · two waves
    0:42  hum                            the thread finds the cochlea · it waits
    0:45  END — the frame keeps living (waves flow, beams turn) forever.

  LYRIC MAP (for the elevenlabs pass — the film was cut to carry these):
    "the star i was / died long ago"                     → 0:00–0:11
    "but the clock i became kept turning… kept turning"  → 0:11–0:17
    "for five hundred and twelve years my pulse
     crossed the dark to find your ear"                  → 0:17–0:24
    "i turn one hundred seventy-three point six eight
     times each second"  (spoken plainly)                → 0:24–0:30
    "i have no breath."  (near-silence)                  → 0:30–0:33
    "lend me yours."  (first human inhalation at 0:33)   → 0:33–0:36
    "hum until the trembling between us disappears"      → 0:36–0:42
    "for one breath, meet me inside your skull"          → 0:42–0:45

  THE LAWS (held throughout):
  · the camera never travels. the visitor may LOOK (drag, or gyro on a
    phone — the magic window, minus the compass) but never rides.
  · nearly monochrome: ice, silver, ash, bone ivory. warm amber exists
    ONLY for the human breath and the human wave.
  · three texts in space, no more: "512 years" (with its 1514/2026
    ends), "173.68 turns / in 1 second", and the final "hum".
  · transitions transform, never cut: star→point→clock, pulse→thread,
    thread→wave, breath-line→human wave, wave→waiting line.
  · the pulsar stays DISTANT even when its rhythm is indoors. distance
    remains; frequency can meet.
  · no unison. the film stops one millimetre before the miracle.

  SOUND. a placeholder bed only — browser oscillators: the exact
  173.6784 (displayed 173.68) fundamental first audible at 0:26, its
  2nd/3rd harmonics (347.36 / 521.04) above it, stripped one by one
  until only the fundamental waits; a detuned second sine carries the
  audible beating in the skull chapter, slowing, never zero; filtered
  noise for the death bloom (quieter as it grows bigger) and for the
  one inhalation. the elevenlabs lullaby replaces ALL of it except the
  fundamental, which stays browser-generated and exact on purpose —
  generative music may drift; the tuning target must not.

  DRIVING IT.  ?clean (no ui, no gate, autoplay muted — the shot rig)
  · ?t=SS (start time) · ?loop · ?nosnd · ?flat (no gyro) · ?snd
  (sound even in clean).  keys: space play/pause · ←/→ ±1s (shift ±5)
  · 1..9 jump to beat · b beats · m mute · r restart.
  console: __INTRO = {seek(s) play() pause() mute(v) state() chapters
  dur ready}.  seek() freezes the frame — every visual is a pure
  function of film time, so any instant can be held, shot, rewound.

  three.js r185 (webgl build) rides a cdn fallback chain: jsdelivr →
  cdnjs → unpkg → ./node_modules (the devkit's own). no other deps,
  no assets: every texture is baked in canvas at load.
-->

<script type="module">
/* ================= three.js — cdn chain, devkit fallback ================= */
let THREE=null;
for(const u of [
  'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.min.js',
  'https://unpkg.com/three@0.185.1/build/three.module.min.js',
  './node_modules/three/build/three.module.js'
]){ try{ THREE=await import(u); if(THREE&&THREE.WebGLRenderer) break; }catch(e){} }
if(!THREE){ document.querySelector('#gate .big').textContent='three.js could not load'; throw new Error('no three'); }

/* ============================ flags & time ============================ */
const Q=new URLSearchParams(location.search);
const CLEAN=Q.has('clean'), LOOP=Q.has('loop'), FLAT=Q.has('flat');
const NOSND=Q.has('nosnd');
const DUR=45;
const CH=[
  {t:0.0, name:'an old star',                   d:'a calm giant, breathing'},
  {t:6.0, name:'the star dies',                 d:'quiet bloom; a point remains'},
  {t:11.0,name:'the clock that remained',       d:'two beams keep turning'},
  {t:17.0,name:'five hundred and twelve years', d:'one pulse crosses · 1514 → 2026'},
  {t:24.0,name:'turning becomes tone',          d:'173.68 turns in 1 second'},
  {t:30.0,name:'no breath',                     d:'vacuum · the emptiest frame'},
  {t:33.0,name:'lend me yours',                 d:'the first warm color'},
  {t:36.0,name:'inside your skull',             d:'bone forms · two waves tremble'},
  {t:42.0,name:'hum',                           d:'the thread finds the cochlea'},
];
let T=Math.max(0,Math.min(DUR,parseFloat(Q.get('t'))||0));
let playing=false, ended=false, afterT=0, scrubbing=false, muted=NOSND||(CLEAN&&!Q.has('snd'));

/* ============================== helpers ============================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, sat=v=>clamp(v,0,1);
const ss=(a,b,t)=>{const u=sat((t-a)/(b-a));return u*u*(3-2*u);};
const box=(t,a0,a1,b0,b1)=>ss(a0,a1,t)*(1-ss(b0,b1,t));
const lerp=(a,b,u)=>a+(b-a)*u;
const eoc=u=>1-Math.pow(1-sat(u),3);
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let x=Math.imul(s^s>>>15,1|s);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function prof(arr,v){const n=arr.length-1;const x=sat(v)*n;const i=Math.floor(x);const u=x-i;
  const a=arr[Math.max(0,i-1)],b=arr[i],c=arr[Math.min(n,i+1)],d=arr[Math.min(n,i+2)];
  return b+0.5*u*(c-a+u*(2*a-5*b+4*c-d+u*(3*(b-c)+d-a)));}

/* baked textures — the module's own grammar: radial glows, a beam strip */
function glowTex(stops,W){W=W||256;const cv=document.createElement('canvas');cv.width=W;cv.height=W;
  const c=cv.getContext('2d');const g=c.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2);
  for(const s of stops)g.addColorStop(s[0],s[1]);c.fillStyle=g;c.fillRect(0,0,W,W);
  const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;return tx;}
function beamTex(){const cv=document.createElement('canvas');cv.width=256;cv.height=64;
  const c=cv.getContext('2d');const g=c.createLinearGradient(0,0,256,0);
  g.addColorStop(0,'rgba(160,200,255,0)');g.addColorStop(0.18,'rgba(190,222,255,0.55)');
  g.addColorStop(0.5,'rgba(240,250,255,0.95)');g.addColorStop(0.82,'rgba(190,222,255,0.55)');
  g.addColorStop(1,'rgba(160,200,255,0)');c.fillStyle=g;c.fillRect(0,0,256,64);
  const v=c.createLinearGradient(0,0,0,64);
  v.addColorStop(0,'rgba(0,0,0,1)');v.addColorStop(0.5,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,1)');
  c.globalCompositeOperation='destination-out';c.fillStyle=v;c.fillRect(0,0,256,64);
  const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;return tx;}
function ringTex(){const cv=document.createElement('canvas');cv.width=256;cv.height=256;
  const c=cv.getContext('2d');c.strokeStyle='rgba(230,242,255,1)';c.lineWidth=7;
  c.shadowColor='rgba(200,225,255,0.9)';c.shadowBlur=16;
  c.beginPath();c.arc(128,128,96,0,Math.PI*2);c.stroke();
  const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;return tx;}
function dotTex(){return glowTex([[0,'rgba(255,255,255,1)'],[0.4,'rgba(255,255,255,0.6)'],[1,'rgba(255,255,255,0)']],64);}
function mkSprite(tex,scale,color,rot){
  const m=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0,depthWrite:false,
    blending:THREE.AdditiveBlending,color:color||0xffffff,rotation:rot||0});
  const s=new THREE.Sprite(m);
  if(typeof scale==='number')s.scale.set(scale,scale,1);else s.scale.set(scale[0],scale[1],1);
  return s;}
/* text baked to a sprite. lines: [{t,f,c,dy,ls}] · worldH = height of canvas in world units */
function textSprite(lines,worldH,align){
  const S=3, cv=document.createElement('canvas');
  const ctx=cv.getContext('2d'); let w=40,h=16;
  for(const L of lines){ctx.font=L.f; w=Math.max(w,ctx.measureText(L.t).width+((L.ls||0)*L.t.length));h+=L.h;}
  cv.width=Math.ceil((w+30)*S); cv.height=Math.ceil((h+16)*S);
  const c=cv.getContext('2d'); c.scale(S,S);
  const draw=()=>{c.clearRect(0,0,cv.width,cv.height); let y=14;
    for(const L of lines){c.font=L.f;c.fillStyle=L.c;c.textAlign=align||'center';c.textBaseline='top';
      if(L.ls)c.letterSpacing=L.ls+'px';
      c.fillText(L.t,(align==='left')?10:(w+30)/2,y+(L.pad||0)); y+=L.h; if(L.ls)c.letterSpacing='0px';}};
  draw();
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.SpriteMaterial({map:tx,transparent:true,opacity:0,depthWrite:false,color:0xffffff});
  const spr=new THREE.Sprite(m);
  const aspect=cv.width/cv.height; spr.scale.set(worldH*aspect,worldH,1);
  return {spr,cv,c,tx,draw,lines,w};
}
function lineOf(pts,color,op){
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:op,
    blending:THREE.AdditiveBlending,depthWrite:false});
  return new THREE.Line(g,m);}

/* ============================== stage ============================== */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,0.05,400);
scene.add(camera);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  camera.fov=(h>w)?76:62;camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* the star's one seat — everything transforms in place */
const P=new THREE.Vector3(0,0.4,-26);

/* ---- dust (far shell + a near cloud that drifts during the crossing) ---- */
const dTex=dotTex();
function makeDust(n,r0,r1,size,seed){
  const rnd=mulberry(seed),pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const u=rnd()*2-1,th=rnd()*Math.PI*2,r=lerp(r0,r1,Math.pow(rnd(),0.7));
    const s=Math.sqrt(1-u*u);pos[i*3]=r*s*Math.cos(th);pos[i*3+1]=r*u;pos[i*3+2]=r*s*Math.sin(th);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({size,sizeAttenuation:true,map:dTex,transparent:true,
    opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,color:0xa8b8d8});
  return new THREE.Points(g,m);}
const dustFar=makeDust(1050,55,130,0.42,101);
const dustBright=makeDust(90,50,110,0.85,202); dustBright.material.color.set(0xcfdcf2);
const dustNear=makeDust(260,7,30,0.16,303);
scene.add(dustFar,dustBright,dustNear);

/* ---------------------------- the old star ---------------------------- */
const starGrp=new THREE.Group(); starGrp.position.copy(P); scene.add(starGrp);
function starTex(){
  const W=512,cv=document.createElement('canvas');cv.width=W;cv.height=W;
  const c=cv.getContext('2d');const rnd=mulberry(77);
  const g=c.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2);
  g.addColorStop(0,'rgba(255,250,238,1)');g.addColorStop(0.55,'rgba(245,237,217,1)');
  g.addColorStop(0.82,'rgba(214,199,168,0.95)');g.addColorStop(0.94,'rgba(150,135,110,0.55)');
  g.addColorStop(1,'rgba(120,105,85,0)');
  c.fillStyle=g;c.beginPath();c.arc(W/2,W/2,W/2,0,Math.PI*2);c.fill();
  c.globalCompositeOperation='source-atop';
  for(let i=0;i<620;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*W*0.46;
    const x=W/2+r*Math.cos(a),y=W/2+r*Math.sin(a),s=2+rnd()*7;
    c.fillStyle='rgba(120,100,80,'+(0.028+rnd()*0.05)+')';
    c.beginPath();c.arc(x,y,s,0,Math.PI*2);c.fill();}
  for(let i=0;i<5;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*W*0.34;
    const x=W/2+r*Math.cos(a),y=W/2+r*Math.sin(a),s=10+rnd()*16;
    c.fillStyle='rgba(90,72,58,0.10)';c.beginPath();c.arc(x,y,s,0,Math.PI*2);c.fill();}
  const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;return tx;}
const starBody=mkSprite(starTex(),6.4); starBody.material.blending=THREE.NormalBlending;
const starGlow=mkSprite(glowTex([[0,'rgba(255,248,232,0.55)'],[0.4,'rgba(230,215,180,0.22)'],[1,'rgba(160,140,110,0)']]),13.5);
const starRim=mkSprite(glowTex([[0.62,'rgba(0,0,0,0)'],[0.78,'rgba(255,244,222,0.30)'],[0.9,'rgba(230,210,175,0.10)'],[1,'rgba(0,0,0,0)']]),7.1);
starGrp.add(starGlow,starBody,starRim);

/* the death: rings, burst, bloom, ghost */
const rTex=ringTex();
const rings=[0,1,2].map(i=>{const s=mkSprite(rTex,1,0xdfe9ff);starGrp.add(s);return s;});
const bloom=mkSprite(glowTex([[0,'rgba(255,255,255,0.95)'],[0.35,'rgba(226,238,255,0.5)'],[1,'rgba(140,170,220,0)']]),2); starGrp.add(bloom);
const ghost=mkSprite(rTex,1,0x9fc8ff); starGrp.add(ghost);
const NB=900, burstDir=new Float32Array(NB*3), burstV=new Float32Array(NB);
{const rnd=mulberry(909);for(let i=0;i<NB;i++){const u=rnd()*2-1,th=rnd()*Math.PI*2,s=Math.sqrt(1-u*u);
  burstDir[i*3]=s*Math.cos(th);burstDir[i*3+1]=u;burstDir[i*3+2]=s*Math.sin(th);burstV[i]=4.5+rnd()*5.5;}}
const burstGeo=new THREE.BufferGeometry();
burstGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NB*3),3));
const burst=new THREE.Points(burstGeo,new THREE.PointsMaterial({size:0.24,sizeAttenuation:true,
  map:dTex,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,color:0xe6f0ff}));
burst.position.copy(P);scene.add(burst);

/* ------------------------------ the pulsar ------------------------------ */

  starBody.material.rotation=M*0.004;
  starGlow.scale.setScalar(13.5*swell*Math.max(collapse,0.02));
  starGlow.material.opacity=0.5*ss(0.4,2.6,T2)*alive;
  starRim.scale.setScalar(7.1*swell*Math.max(collapse,0.004));
  starRim.material.opacity=0.6*ss(0.8,2.6,T2)*alive;

  /* c2 — the death */
  for(let i=0;i<3;i++){const t0=6.9+0.14*i,u=sat((T2-t0)/3.2);
    const R=[10,7.6,5.6][i]*(1-Math.pow(1-u,2));
    rings[i].scale.setScalar(Math.max(R,0.001));
    rings[i].material.opacity=(u<=0||u>=1)?0:0.5*Math.pow(1-u,2);}
  {const u=sat((T2-6.85)/1.55);
   bloom.scale.setScalar(Math.max(1.5+7.0*eoc(u),0.001));
   bloom.material.opacity=(u<=0||u>=1)?0:0.85*Math.pow(1-u,2.2);}
  {const u=sat((T2-8.5)/4.0);
   ghost.scale.setScalar(Math.max(2.2+6.6*u,0.001));
   ghost.material.opacity=(u<=0||u>=1)?0:0.10*(1-u);}
  {const u=sat((T2-6.9)/4.1);const q=1-Math.pow(1-u,1.8);
   const p=burstGeo.attributes.position.array;
   for(let i=0;i<NB;i++){const r=0.4+burstV[i]*q*1.15;
     p[i*3]=burstDir[i*3]*r;p[i*3+1]=burstDir[i*3+1]*r;p[i*3+2]=burstDir[i*3+2]*r;}
   burstGeo.attributes.position.needsUpdate=true;
   burst.material.opacity=(u<=0||u>=1)?0:0.55*Math.pow(1-u,1.6);}

  /* c3 — the clock. the point resolves; the beams turn */
  const pk=ss(7.3,8.2,T2);                    /* the point itself */
  const ck=ss(11,13,T2);                      /* corona/veil resolve */
  const bk=ss(12,13.5,T2);                    /* beams */
  const strip=1-0.35*ss(30,31.5,T2);          /* c6 dimming */
  const far=1-0.55*ss(42,44,T2);              /* c9 receding */
  const psc=(1-0.5*ss(36,42,T2))*far;         /* c8 shrink */
  pCore.material.opacity=(0.9*pk-0.3*ck+0.30*ck*beat)*strip;
  pCore.scale.setScalar(Math.max(0.001,(0.22+0.14*ck)*psc*(1+0.1*beat)));
  pCorona.material.opacity=ck*(0.26+0.20*beat)*strip*far;
  pCorona.scale.setScalar(Math.max(0.001,0.62*(1+0.10*beat)*psc));
  pVeil.material.opacity=ck*(0.10+0.06*slow)*strip*far*(1-0.5*ss(30,31.5,T2));
  pVeil.scale.setScalar(Math.max(0.001,1.85*psc));
  const phase=beamPhase(T2)+Math.max(0,M-T2)*1.35;
  beamA.material.rotation=phase; beamB.material.rotation=-0.72*phase-0.5;
  beamA.material.opacity=bk*(0.22+0.26*beat)*strip*far;
  beamB.material.opacity=bk*(0.16+0.20*(1-beat))*strip*far;
  beamA.scale.set(7.6*psc,0.34*psc,1); beamB.scale.set(6.0*psc,0.24*psc,1);
  erode.material.opacity=0.35*box(T2,12.5,14,16,17.5);
  erode.rotation.z=M*0.05;

  /* c4 — the crossing */
  const dep=17.6,arr=25.0;
  const sN=sat((T2-dep)/(arr-dep));
  const on4=T2>dep&&T2<arr+0.4;
  const hp=path4(sN);
  const on9=T2>42.2;
  if(on9){ /* c9 pulse re-uses the head/trail */
    const u=sat((T2-42.2)/(44.15-42.2));
    const q=path9(u);head.position.copy(q);headGlow.position.copy(q);
    const vis=(u>0&&u<1)?1:0;
    const d9=q.length();
    head.material.opacity=0.85*vis;head.scale.setScalar(clamp(0.012*d9,0.05,0.32));
    headGlow.material.opacity=0.30*vis;headGlow.scale.setScalar(clamp(0.035*d9,0.15,0.85));
    const p=trailGeo.attributes.position.array;
    for(let i=0;i<NT;i++){const ui=Math.max(0,u-i*0.012);const pp=path9(ui);
      p[i*3]=pp.x;p[i*3+1]=pp.y;p[i*3+2]=pp.z;}
    trailGeo.attributes.position.needsUpdate=true;
    trail.material.opacity=0.5*vis;
    wake.material.opacity=0;
  }else{
    head.position.copy(hp);headGlow.position.copy(hp);
    const vis=on4?1:0;
    const d4=hp.length();
    head.material.opacity=0.9*vis;head.scale.setScalar(clamp(0.012*d4,0.05,0.32));
    headGlow.material.opacity=0.4*vis;headGlow.scale.setScalar(clamp(0.035*d4,0.15,0.85));
    const p=trailGeo.attributes.position.array;
    for(let i=0;i<NT;i++){const si=Math.max(0,sN-i*0.0062);const pp=path4(si);
      p[i*3]=pp.x;p[i*3+1]=pp.y;p[i*3+2]=pp.z;}
    trailGeo.attributes.position.needsUpdate=true;
    trail.material.opacity=0.55*vis;
    wake.material.opacity=0.10*vis*ss(dep,dep+1.5,T2);
    wake.geometry.setFromPoints([P,hp]);
  }

  /* the 512-year rule */
  const yk=box(T2,18.4,19.6,24.0,24.9);
  yline.material.opacity=0.10*yk;
  endL.material.opacity=0.5*yk;endR.material.opacity=0.5*yk;
  if(lab1514){lab1514.spr.material.opacity=0.75*yk;lab2026.spr.material.opacity=0.75*yk;
    lab512.spr.material.opacity=0.9*yk;}
  const xd=lerp(-5.5,5.5,sN);
  ydot.position.set(xd,0,0);ydot.material.opacity=0.8*yk;
  {const p=dotsGeo.attributes.position.array;
   for(let i=0;i<NDOT;i++){let x=lerp(-5.28,5.28,i/(NDOT-1));
     if(x<xd)x=lerp(x,xd-0.35*(xd-x)/11,0.55*ss(0,1,(xd-x)/11)); /* passed time condenses */
     p[i*3]=x;p[i*3+1]=0;p[i*3+2]=0;}
   dotsGeo.attributes.position.needsUpdate=true;
   ydots.material.opacity=0.5*yk;}
  for(let i=0;i<6;i++){const yr=lerp(1514,2026,(i+0.7)/6.7);
    let x=lerp(-5.5,5.5,(yr-1514)/512);
    if(x<xd)x=lerp(x,xd-0.35*(xd-x)/11,0.55);
    cent[i].position.x=x;cent[i].material.opacity=(x<xd?0.18:0.35)*yk;}

  /* c5 — the lens, the one second, the counter */
  const lk=box(T2,23.5,24.5,29.7,30.7);
  lensRing.material.opacity=0.5*lk;lensRing2.material.opacity=0.18*lk;
  lensGlass.material.opacity=0.045*lk;lensSpiral.material.opacity=0.22*lk;
  lensSpiral.rotation.z=M*0.05;
  {const u=sat((T2-25.0)/0.55);
   lensFlash.scale.setScalar(Math.max(0.001,0.6+1.9*eoc(u)));
   lensFlash.material.opacity=(u<=0||u>=1)?0:0.7*Math.pow(1-u,1.7);}
  {const rk=box(T2,25.2,26.0,29.6,30.5);
   const p=ribGeo.attributes.position.array;
   for(let i=0;i<NR;i++){const s=i/(NR-1);
     const amp=0.15*Math.pow(s,1.3)*rk;
     const y=0.12-0.42*s+amp*Math.sin(Math.PI*2*(3.4*s-1.35*M));
     p[i*3]=1.85*Math.pow(s,1.15);p[i*3+1]=y;p[i*3+2]=-8+5.3*s;}
   ribGeo.attributes.position.needsUpdate=true;
   ribbon.material.opacity=0.6*rk;}
  const gk=box(T2,25.8,26.6,29.5,30.3);
  secGlass.material.opacity=0.05*gk;secGlassB.material.opacity=0.03*gk;
  {const u=ss(25.9,27.4,T2);
   secRing.geometry.setDrawRange(0,Math.floor(129*u));
   secRing.material.opacity=0.5*gk;
   if(T2>25.9)setCounter(173.6879*eoc(u),T2>=27.4);
   if(counter)counter.spr.material.opacity=0.9*box(T2,25.9,26.5,29.8,30.5);}

  /* c7 — the breath (camera space) */
  {const u=ss(33.3,35.5,T2), off=box(T2,33.3,34.3,35.5,36.4);
   breathGlow.position.set(0.02*Math.sin(M*0.8),lerp(-1.35,-0.42,eoc(u)),-2.1);
   breathGlow.scale.setScalar(0.5+0.4*u);
   breathGlow.material.opacity=0.5*off;}

  /* c8 — the skull forms; the two waves */
  for(let i=0;i<loops.length;i++){
    const st=36.1+0.13*i;
    const k=reveal(loops[i],97,st,st+1.7,T2);
    loops[i].material.opacity=loopBase[i]*k*(0.9+0.08*Math.sin(M*0.7+i));}
  for(const f of feats){
    const k=reveal(f.l,f.n,f.t0,f.t1,T2);
    f.l.material.opacity=f.op*k*(0.92+0.08*Math.sin(M*0.9));}
  {const ck2=ss(40,41.2,T2);
   cochr.material.opacity=(0.30*ck2+0.6*box(T2,44.1,44.5,46.5,48))* (1);
   cochl.material.opacity=0.30*ck2;
   reveal(cochr,91,40,41.4,T2);reveal(cochl,91,40.2,41.6,T2);
   const fu=sat((T2-44.15)/0.9);
   cochFlash.scale.setScalar(Math.max(0.001,0.2+0.9*eoc(fu)));
   cochFlash.material.opacity=((fu<=0||fu>=1)?0:0.5*(1-fu))
     +0.11*beat*ss(44.8,45,T2);              /* the ear keeps a small living light */
   earGlow.material.opacity=0.32*box(T2,44.1,44.35,44.9,45.9)
     +0.05*beat*ss(44.9,45,T2);}

  /* the waves — one cold and even, one warm and unfinished */
  const fh=lerp(0.865,0.985,ss(36.5,42,T2));
  {const ckk=ss(36.8,38.2,T2)*(T2>36?1:0);
   const us=lerp(1.18,-0.32,ss(44.15,45.0,T2)); /* the arrived pulse rides its own wave in */
   const p=wCold.geometry.attributes.position.array;
   for(let i=0;i<NW;i++){const u=i/(NW-1),x=lerp(-1.35,1.35,u);
     const grow=sat((ckk*1.6)-Math.abs(u-0.5)*2);
     const surge=1+1.1*Math.exp(-Math.pow((u-us)*5,2))*box(T2,44.15,44.3,45.6,47.5);
     p[i*3]=x;p[i*3+1]=-0.62+0.075*grow*surge*Math.sin(Math.PI*2*(2.6*u-1.9*M));p[i*3+2]=-2.05;}
   wCold.geometry.attributes.position.needsUpdate=true;
   wCold.material.opacity=0.8*ckk*(T2<36.6?0:1);}
  {/* the warm wave is BORN as the breath-line (c7) and becomes the human wave */
   const born=ss(33.9,35.2,T2);
   const mig=ss(35.6,36.8,T2);            /* migrate to the wave band */
   const wav=ss(36.4,37.6,T2);            /* become a wave */
   const dieA=1-0.88*ss(42.6,43.9,T2);    /* c9: the wave empties, waits */
   const p=wWarm.geometry.attributes.position.array;
   for(let i=0;i<NW;i++){const u=i/(NW-1);
     const x=lerp(-0.75,0.75,u)*lerp(1,1.8,mig);
     const y0=lerp(-0.50,-0.62,mig);
     const waver=0.045*(Math.sin(u*7+M*1.1)+0.6*Math.sin(u*13-M*0.7));
     const wobA=0.075*(0.75+0.25*Math.sin(u*5.2+M*0.53));
     const wave=wobA*Math.sin(Math.PI*2*(2.6*fh*u-1.9*fh*M+0.13*Math.sin(M*0.4)));
     const amp=lerp(waver,wave,wav)*dieA+ (0.014+0.007*Math.sin(M*Math.PI*2*0.2))*ss(43.2,44.2,T2)*Math.sin(Math.PI*2*(2.2*u-0.5*M));
     p[i*3]=x;p[i*3+1]=y0+amp*born;p[i*3+2]=-2.05;}
   wWarm.geometry.attributes.position.needsUpdate=true;
   wWarm.material.opacity=0.75*born*(1-0.25*ss(42.6,44,T2));
   reveal(wWarm,NW,33.9,35.2,T2);}

  /* c9 — hum */
  if(humLab)humLab.spr.material.opacity=(0.72*ss(43.8,44.8,T2))*(0.9+0.13*Math.sin(M*Math.PI*2*0.09));

  return fh;
}

/* =============================== ui =============================== */
const $=id=>document.getElementById(id);
const bar=$('bar'),track=$('track'),fill=$('fill'),headE=$('head'),tip=$('tip'),
  tc=$('tc'),chname=$('chname'),bPlay=$('bPlay'),bSnd=$('bSnd'),bBeats=$('bBeats'),
  beatsE=$('beats'),gate=$('gate'),veil=$('veil');
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}
function chOf(t){let c=CH[0],ix=0;for(let i=0;i<CH.length;i++)if(t>=CH[i].t){c=CH[i];ix=i;}return {c,ix};}
for(const c of CH){const d=document.createElement('div');d.className='tick';
  d.style.left=(c.t/DUR*100)+'%';track.appendChild(d);}
CH.forEach((c,i)=>{const r=document.createElement('div');r.className='row';r.dataset.i=i;
  r.innerHTML='<span class="t">'+fmt(c.t).replace('.0','')+'</span><span class="nm">'+c.name+
    '</span><span class="d">'+c.d+'</span>';
  r.addEventListener('click',()=>{seek(c.t);});beatsE.appendChild(r);});
function uiStep(){
  const p=T/DUR*100;fill.style.width=p+'%';headE.style.left=p+'%';
  tc.firstChild.nodeValue=fmt(T)+' ';
  const {c,ix}=chOf(T);chname.textContent=c.name;
  bPlay.innerHTML=ended?'&#10227;':(playing?'&#10074;&#10074;':'&#9654;');
  const rows=beatsE.children;
  for(let i=0;i<rows.length;i++)rows[i].classList.toggle('cur',i===ix);
}
function seek(t){T=clamp(t,0,DUR);if(T<DUR){ended=false;afterT=0;}scrubTick();}
function scrubTick(){uiStep();}
function play(){if(ended){T=0;ended=false;afterT=0;}playing=true;idleArm();}
function pause(){playing=false;showUI();}
bPlay.addEventListener('click',()=>{playing?pause():play();});
bSnd.addEventListener('click',()=>{muted=!muted;
  bSnd.textContent=muted?'sound off':'sound on';bSnd.classList.toggle('on',!muted);
  if(!muted)wakeAudio();});
bBeats.addEventListener('click',()=>{beatsE.classList.toggle('on');
  bBeats.classList.toggle('on',beatsE.classList.contains('on'));});
let trackDrag=false;
function trackSeek(e){const r=track.getBoundingClientRect();
  seek((e.clientX-r.left)/r.width*DUR);}
track.addEventListener('pointerdown',e=>{trackDrag=true;scrubbing=true;trackSeek(e);e.stopPropagation();});
addEventListener('pointermove',e=>{if(trackDrag)trackSeek(e);
  if(e.target===track||track.contains(e.target)){const r=track.getBoundingClientRect();
    const t=clamp((e.clientX-r.left)/r.width*DUR,0,DUR);
    tip.style.display='block';tip.style.left=((e.clientX-r.left)/r.width*100)+'%';
    tip.textContent=chOf(t).c.name;}else tip.style.display='none';});
addEventListener('pointerup',()=>{trackDrag=false;scrubbing=false;});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play();}
  else if(e.key==='ArrowLeft')seek(T-(e.shiftKey?5:1));
  else if(e.key==='ArrowRight')seek(T+(e.shiftKey?5:1));
  else if(e.key==='m')bSnd.click();
  else if(e.key==='b')bBeats.click();
  else if(e.key==='r'){seek(0);play();}
  else if(e.key>='1'&&e.key<='9')seek(CH[+e.key-1].t);
});
/* auto-hide while playing */
let idleTm=null;
function showUI(){document.body.classList.remove('hideui');idleArm();}
function idleArm(){clearTimeout(idleTm);
  if(playing&&!CLEAN)idleTm=setTimeout(()=>{if(playing&&!trackDrag)document.body.classList.add('hideui');},2800);}
addEventListener('pointermove',showUI);
addEventListener('pointerdown',showUI);

/* ============================== boot ============================== */
if(CLEAN){bar.style.display='none';$('title').style.display='none';gate.style.display='none';}
await bakeText();
let ready=false;
function begin(){
  if(!NOSND&&!muted)wakeAudio();
  if(!FLAT&&typeof DeviceOrientationEvent!=='undefined'){
    const arm=()=>addEventListener('deviceorientation',onOrient);
    if(DeviceOrientationEvent.requestPermission)
      DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')arm();}).catch(()=>{});
    else arm();
  }
  gate.classList.add('going');veil.classList.add('gone');
  play();
}
gate.addEventListener('pointerdown',begin,{once:true});
if(CLEAN){veil.classList.add('gone');playing=!Q.has('t');if(Q.has('t'))playing=false;}

/* the loop */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(playing&&!scrubbing){T+=dt;
    if(T>=DUR){T=DUR;if(!ended){ended=true;playing=false;showUI();}
      if(LOOP){setTimeout(()=>{if(ended){seek(0);play();}},3000);} }}
  if(ended)afterT+=dt;
  const M=T+afterT;
  lookStep();
  const fh=update(T,M);
  audioStep(T,dt,fh);
  if(!CLEAN)uiStep();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
ready=true;

/* the console door */
window.__INTRO={
  seek:t=>{seek(t);pause();},
  play, pause,
  mute:v=>{muted=(v===undefined)?true:!!v;},
  state:()=>({t:T,playing,ended,muted,ch:chOf(T).c.name,after:afterT}),
  chapters:CH, dur:DUR,
  get ready(){return ready;}
};
</script>
</body>
