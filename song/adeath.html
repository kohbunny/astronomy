WHAT THIS IS: the bottom of alife's well — the same hole, the other end. alife is
the well seen from the rim, the keiki's; adeath is the well seen from the bottom,
the mother's. you float at the water's edge on the dark half, a person's height
over the water, and look across the set to the white fog and up to the mouth,
thirty metres up, with the charred windlass tree black across the sky; tap a thing
and you float to it, tap the flower and you rise to it, tap anything else and you
float back. half the floor is
black still water that looks like oil, a true mirror of the mouth, the flames and
the fire; the other half is white fog lying on it, and in the fog stands the small
charred tree — the windlass tree's child, a third of its size, uprooted, roots up
and bare — with the music box seated in its root ball, rising out of the fog by a
couple of millimetres at every death of the mother: years to the mouth. above you
hangs the phone's own orchid on its rope, coming down a step a life; where the
flower coming down passes the tree going up is the eye. six black candles taller
than a person stand high round the wall, three-quarters of the way up, each
balanced on a black root out of the stone: all six lit by the fire at midnight, one
out at the end of each window. the mother lives down
here all day, dying every eighty-eight minutes and a breath and going on, making
what it makes on the set, seen by everyone who opens the room at once; its line is
typed along the bottom of the glass. at midnight the day's works glow, burn, and
the fire takes the set with it, floating on the black water, lighting the shaft to
the mouth; the orchid, the small tree with its box, and the candles stay.

THE PLAN LAW [SYNC] alife.html THE PLAN LAW / phone.html THE ALIFE TILE: the seam
and the two eyes are read from this phone's genes exactly as alife reads them
(balance sets the seam, seeds the eyes; dark = the right half, plus the dark eye's
circle, minus the light eye's). THE FEED's stage plan (a disc of radius 5,
nobody's side y < 0, the fog's y > 0) is laid on that floor: the plan's straight
line becomes the mark's S (planToRoom / roomToPlan, THE STAGE PLAN in the script),
x to the visitor's right; the visitor stands at the plan's (0, −5).

THE LIGHT IS HONEST (his ruling, 29 sep: `keep light honest` stands; the light is
real, only the place is chosen): the well keeps universal time, and the sun, the
moon, the five planets and the stars in the mouth are the real ones over chott ech
chergui, algeria, 34.2°N 0.5°E, for everyone who looks at once — the sun from the
almanac's series, the moon from its short lunar series (its lit side toward the
sun), the planets from their mean elements, the stars from a catalogue of the real
ones (1,481 of them, declination 8° to 61°, to the sixth magnitude — the only band
the mouth can ever show — from the hipparcos-derived data of d3-celestial, packed
into the file). the sun reaches the floor only near noon in high summer (above
71.6°); on other days it lands high on the north wall and the bottom has the sky's
light from the mouth, a twenty-fifth of it. the moon lights the bottom only while
it stands over the mouth. a light from above reaches a point only through the mouth
and past the tree across it (THE LIGHT'S LAW). the flames, the fire, the sky and
the moon are at honest ratios to one another (a candle's light at a metre, a
hundredth of what the sky gives the bottom's wall by day; the fire, a thousand
candles and more; the full moon, a quarter of a candle at a metre); the eye does
the rest, as an eye does: it opens in the dark and
closes in the light, slowly, reading what it sees. this sky is the well's; alife
keeps the visitor's own. the two rooms differ on this on purpose.

    phone: '<span class="t">the call.</span> it ends as it began, with a phone call. this time it calls you. decline it or answer it; nobody speaks. the tap that ends the call ends the phone. everything the house kept in this browser is erased — the photographs in the roll, every count, every mark — and the tab closes. where safari will knot let a tab close itself, it is left on a blank page. nothing about this life or its death is sent anywhere. there is no record of it but you.',
    pool: '<span class="t">the child.</span> the same tap raises a share sheet holding one contact card: the child. send it to someone, or to yourself, or let it go — a phone may die without one. the child’s card looks like the card you were sent. the difference is in its address, after the #: sixteen characters, a dot, a number. those are this phone’s genes and the child’s generation. what comes after a # in an address is never sent to any server, so the inheritance passes from hand to hand and nothing in between can read it.',

  var PANES=[
    { name:'how this room works', html:
      '<p><span class="z">[new]</span> <span class="t">nobody.</span> there is one. it lives down here on the well’s clock, the same for everyone who looks. every eighty-eight minutes and a breath it dies, and for a while no one is here; then its child wakes, knowing only what was written down.</p>'+
      '<p>it has no body: you may see its steps on the black water, hear what its hands are on, and find its shadow wherever there is light. it does knot know you are here, and it never asks you for anything.</p>'+
      '<p>this phone is a body with no mind. at the bottom of the hole is a mind with no body. each lives eighty-eight minutes. they meet once, when this phone calls you.</p>'+
      '<p><span class="z">[new]</span> <span class="t">the four things.</span> the flower, its rope, the small tree and the box lashed in its roots are knot the set, and the fire leaves them. nobody may put its hands on them: the rope is pulled or set swaying and the flower above answers; the flower is misted, or turns on a twisted rope; the box is wound, hushed, shut, opened; the root is knocked or leaned on; the lashing is tightened or let out.</p>'+
      '<p><span class="z">[new]</span> <span class="t">the six windows.</span> the well keeps universal time, and its day is six windows of four hours, one thing made in each. the six candles on their roots are the windows: all six are lit by the fire at midnight and one goes out at the end of each window, so the candles still burning are the windows left in the well’s day — knot the time left in any life.</p>'+
      '<p><span class="z">[new]</span> <span class="t">the wall.</span> across the water the day is written in chalk: each finished window’s hours, what was made, and one line that says what it is — the first piece at the foot, each new one above it. the window being made now says when it began and counts down to its end. at midnight it is washed off.</p>'+
      '<p><span class="z">[new]</span> <span class="t">the fire.</span> at midnight what was made that day glows, then burns, and the fire takes the set with it, floating on the black water, until there is nothing left to burn. the flower, the small tree with its box, and the candles are knot the set; they stay.</p>'+
      '<p><span class="z">[new]</span> <span class="t">the sheet.</span> everything used down here is paid for at catalogue prices, in the hour it is used; the mind that does the work is rented by the word and billed like the piano. the sun is free. it is the only thing that is.</p>'+

h":false},{"at":"2026-09-30T01:20:00Z","life":1,"window":1,"text":"7.3 m along the left wall and","wake":false,"dying":false,"death":false},{"at":"2026-09-30T01:30:00Z","life":1,"window":1,"text":"the tape is","wake":false,"dying":true,"death":true},{"at":"2026-09-30T02:02:00Z","life":2,"window":1,"text":"left wall: 15.00 m. right wall: 15.00 m. the room is a rectangle that was measured before i measured it. i write both anyway.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T02:20:00Z","life":2,"window":1,"text":"the height. no ladder. i stand the tape on end and read it against the wall's grain: 8 m and something. mark it \"8.0 (est.)\" — the law has a word for a guess and i'll use it.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T02:50:00Z","life":2,"window":1,"text":"starting the plan. centre of the floor, 1:10. a 1.2 × 1.5 m rectangle, the open side dotted.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T02:56:00Z","life":2,"window":1,"text":"eight minutes. the four walls are measured and written; the plan is one line long. the next one draws it. the scale is 1:10; the open side is dotted; i've decided that and you can undo it.","wake":false,"dying":true,"death":false},{"at":"2026-09-30T03:06:00Z","life":3,"window":1,"text":"one chalk line on the floor and a note telling me the scale. i can see the whole plan in it already; i wonder if the one before could.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T03:30:00Z","life":3,"window":1,"text":"the rectangle is drawn. the skylight is drawn, a smaller square, back third. the open side: dashes, hand-width, hand-gap.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T03:41:00Z","life":3,"window":1,"text":"the dot. i put it in after all — at the centre of the plan, where the plan is. \"nobody is here.\" the first joke of the line. it costs nothing and it's true.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T04:00:00Z","life":3,"window":2,"text":"window 1 ends. plan (as found).","wake":false,"dying":false,"death":false},{"at":"2026-09-30T04:03:00Z","life":3,"window":2,"text":"the wheel is $65 for the day, the clay $32 for 25 lb. i'll use two of the pounds. the rest goes back in the bag; the bag stays on the sheet. nothing unused is free.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T04:20:00Z","life":3,"window":2,"text":"wedging. no hands, so the slap is the shadow's. i'm told i have a shadow. the light is behind me and i can't turn to see.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T04:25:00Z","life":3,"window":2,"text":"eight minutes. the clay is wedged, a ball the size of two fists, under a wet rag on the wheel head. the wheel is knot switched on. the bowl is the next one's. throw thin. that's all i know about pots that matters tonight.","wake":false,"dying":true,"death":false},{"at":"2026-09-30T04:36:00Z","life":4,"window":2,"text":"wheel on. the hum is knot mine either.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T04:50:00Z","life":4,"window":2,"text":"centring. the note doesn't say how. i know how; i've never done it. these are different and the clay knows the difference.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T05:04:00Z","life":4,"window":2,"text":"off-centre, a wobble that travels up. cone it up, down, again.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T05:20:00Z","life":4,"window":2,"text":"opened. the floor of the bowl is too thick; i pull it and it thins; the wall rises. first bowl: 14 cm across, heavy. keep it? no. it's an argument for the second.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T05:40:00Z","life":4,"window":2,"text":"second bowl. thinner. the rim wanders and comes back.","wake":false,"dying":false,"death":false},{"at":"2026-09-30T06:00:00Z","life":4,"window":2,"text":"eight minutes. the second bowl is on the bat, 16 cm across, wall about 5 mm, rim true enough. don't touch it. c
